name: Production Admin Bootstrap Schema Reconcile

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Exact merged main source commit"
        required: true
        type: string
      confirm_project_ref:
        description: "Type the exact production project ref"
        required: true
        type: string
      confirm_action:
        description: "Type RECONCILE ADMIN BOOTSTRAP SCHEMA"
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: production-admin-bootstrap-schema-reconcile
  cancel-in-progress: false

env:
  MANIFEST_PATH: docs/operations/evidence/production-admin-bootstrap-schema-reconciliation-v1.json
  EXPECTED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  DENIED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  RUN_SOURCE_COMMIT: ${{ inputs.source_commit }}
  RUN_CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
  RUN_CONFIRM_ACTION: ${{ inputs.confirm_action }}

jobs:
  reconcile:
    name: Reconcile Admin bootstrap schema
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Enforce explicit production authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$SUPABASE_DB_URL"
          test -n "${SUPABASE_SECRET_KEY:-}${SUPABASE_SERVICE_ROLE_KEY:-}"
          test "$RUN_CONFIRM_PROJECT_REF" = "$EXPECTED_PRODUCTION_PROJECT_REF"
          test "$RUN_CONFIRM_ACTION" = "RECONCILE ADMIN BOOTSTRAP SCHEMA"
          test "$EXPECTED_PRODUCTION_PROJECT_REF" != "$DENIED_STAGING_PROJECT_REF"
          [[ "$RUN_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          command -v psql >/dev/null

          node - <<'NODE'
          const expected = process.env.EXPECTED_PRODUCTION_PROJECT_REF;
          const parsed = new URL(process.env.SUPABASE_DB_URL);
          const username = decodeURIComponent(parsed.username || "");
          const directHost = parsed.hostname === `db.${expected}.supabase.co`;
          const poolerUser = username === `postgres.${expected}` ||
            username.endsWith(`.${expected}`);
          if (parsed.protocol !== "postgresql:" && parsed.protocol !== "postgres:") {
            throw new Error("Production database URL must use PostgreSQL.");
          }
          if (!directHost && !poolerUser) {
            throw new Error("Production database URL is not bound to the expected project.");
          }
          NODE

      - name: Check out exact merged main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RUN_SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source, manifest, and additive migration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RUN_SOURCE_COMMIT"
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor HEAD origin/main
          test -f "$MANIFEST_PATH"

          node - <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const manifest = JSON.parse(
            fs.readFileSync(process.env.MANIFEST_PATH, "utf8"),
          );
          const migration = manifest.canonicalMigration;
          if (
            manifest.schemaVersion !== 1 ||
            manifest.roadmapItem !== "BETA-PROD-ADMIN-LOGIN-005" ||
            manifest.targetProjectRef !== process.env.EXPECTED_PRODUCTION_PROJECT_REF ||
            !manifest.deniedProjectRefs?.includes(process.env.DENIED_STAGING_PROJECT_REF) ||
            manifest.staffSecurityPrerequisiteRequired !== true ||
            manifest.gameSessionSchemaWritesAllowed !== true ||
            manifest.databaseFunctionWritesAllowed !== false ||
            manifest.applicationRowWritesAllowed !== false ||
            manifest.authMetadataWritesAllowed !== false ||
            manifest.edgeFunctionDeploymentAllowed !== false ||
            manifest.credentialRotationAllowed !== false ||
            manifest.destructiveChangesAllowed !== false ||
            manifest.rollbackStrategy !== "forward-only-idempotent-rerun" ||
            migration?.version !== "20260729123000" ||
            migration?.name !== "reconcile_admin_bootstrap_join_code_v1" ||
            migration?.path !==
              "backend/supabase/migrations/20260729123000_reconcile_admin_bootstrap_join_code_v1.sql" ||
            migration?.gitBlobSha !==
              "1a12c63686b936a40f56403da5c162bf3c79b2df" ||
            manifest.requiredBootstrapColumns?.length !== 7 ||
            manifest.requiredBootstrapConstraint !==
              "game_sessions_readable_join_code_valid" ||
            manifest.requiredBootstrapIndex !==
              "game_sessions_active_readable_join_code_unique"
          ) {
            throw new Error("Admin bootstrap schema authorization mismatch.");
          }

          const actualBlob = execFileSync(
            "git",
            ["hash-object", migration.path],
            { encoding: "utf8" },
          ).trim();
          if (actualBlob !== migration.gitBlobSha) {
            throw new Error("Admin bootstrap migration digest mismatch.");
          }

          const sql = fs.readFileSync(migration.path, "utf8").trim();
          if (!/^begin;\s*/iu.test(sql) || !/\s*commit;$/iu.test(sql)) {
            throw new Error("Admin bootstrap migration is not transaction-bounded.");
          }
          if (
            !/alter\s+table\s+public\.game_sessions\s+add\s+column\s+if\s+not\s+exists\s+game_join_code\s+text\s+null/iu.test(sql) ||
            !/game_sessions_readable_join_code_valid/iu.test(sql) ||
            !/game_sessions_active_readable_join_code_unique/iu.test(sql) ||
            !/comment\s+on\s+column\s+public\.game_sessions\.game_join_code/iu.test(sql)
          ) {
            throw new Error("Admin bootstrap migration contract is incomplete.");
          }
          if (
            /\b(?:insert\s+into|update\s+|delete\s+from|truncate)\b/iu.test(sql) ||
            /\bdrop\s+(?:table|schema|database|column|constraint)\b/iu.test(sql) ||
            /\b(?:create|replace)\s+(?:or\s+replace\s+)?function\b/iu.test(sql) ||
            /\balter\s+table\s+(?!public\.game_sessions\b)/iu.test(sql)
          ) {
            throw new Error("Unapproved SQL found in Admin bootstrap migration.");
          }
          NODE

      - name: Verify bounded database preconditions
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" \
            --set=ON_ERROR_STOP=1 \
            --no-psqlrc \
            --tuples-only \
            --no-align <<'SQL' > "$RUNNER_TEMP/admin-bootstrap-preconditions.json"
          with staff_auth as (
            select
              staff.*,
              auth_user.id as auth_user_id,
              auth_user.raw_app_meta_data
            from public.staff_users as staff
            left join auth.users as auth_user
              on auth_user.id = staff.supabase_auth_user_id
          )
          select json_build_object(
            'staffSecurityColumns', (
              select count(*)
              from information_schema.columns
              where table_schema = 'public'
                and table_name = 'staff_users'
                and column_name in (
                  'status',
                  'role',
                  'permission_version',
                  'security_version',
                  'mfa_required',
                  'security_hold_reason',
                  'suspended_at',
                  'compromised_at'
                )
            ),
            'activeGameAdmins', (
              select count(*)
              from staff_auth
              where status = 'active'
                and role = 'game_admin'
            ),
            'missingAuthLinks', (
              select count(*)
              from staff_auth
              where auth_user_id is null
            ),
            'metadataMismatches', (
              select count(*)
              from staff_auth
              where auth_user_id is null
                or raw_app_meta_data ->> 'econovaria_role' is distinct from role
                or case
                    when coalesce(raw_app_meta_data ->> 'permission_version', '')
                      ~ '^[1-9][0-9]*$'
                    then (raw_app_meta_data ->> 'permission_version')::bigint
                    else null
                  end is distinct from permission_version::bigint
                or case
                    when coalesce(raw_app_meta_data ->> 'security_version', '')
                      ~ '^[1-9][0-9]*$'
                    then (raw_app_meta_data ->> 'security_version')::bigint
                    else null
                  end is distinct from security_version
                or raw_app_meta_data ->> 'econovaria_account_status'
                  is distinct from status
                or case
                    when raw_app_meta_data ->> 'econovaria_mfa_required' = 'true'
                      then true
                    when raw_app_meta_data ->> 'econovaria_mfa_required' = 'false'
                      then false
                    else null
                  end is distinct from mfa_required
            ),
            'coreBootstrapColumns', (
              select count(*)
              from information_schema.columns
              where table_schema = 'public'
                and table_name = 'game_sessions'
                and column_name in (
                  'id',
                  'name',
                  'status',
                  'game_join_code_status',
                  'created_at',
                  'updated_at'
                )
            ),
            'joinCodeColumn', (
              select count(*)
              from information_schema.columns
              where table_schema = 'public'
                and table_name = 'game_sessions'
                and column_name = 'game_join_code'
            ),
            'activeGames', (
              select count(*)
              from public.game_sessions
              where status = 'active'
            ),
            'canonicalLedgerRows', (
              select count(*)
              from supabase_migrations.schema_migrations
              where version = '20260729123000'
            )
          );
          SQL

          PRECONDITIONS_PATH="$RUNNER_TEMP/admin-bootstrap-preconditions.json" node - <<'NODE'
          const fs = require("node:fs");
          const result = JSON.parse(
            fs.readFileSync(process.env.PRECONDITIONS_PATH, "utf8").trim(),
          );
          if (
            Number(result.staffSecurityColumns) !== 8 ||
            Number(result.activeGameAdmins) < 1 ||
            Number(result.missingAuthLinks) !== 0 ||
            Number(result.metadataMismatches) !== 0 ||
            Number(result.coreBootstrapColumns) !== 6 ||
            ![0, 1].includes(Number(result.joinCodeColumn)) ||
            Number(result.activeGames) < 1 ||
            ![0, 1].includes(Number(result.canonicalLedgerRows)) ||
            (
              Number(result.canonicalLedgerRows) === 1 &&
              Number(result.joinCodeColumn) !== 1
            )
          ) {
            throw new Error("Production Admin bootstrap preconditions failed.");
          }
          NODE

      - name: Generate one atomic forward reconciliation
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_PATH="$RUNNER_TEMP/admin-bootstrap-reconciliation.sql" node - <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(
            fs.readFileSync(process.env.MANIFEST_PATH, "utf8"),
          );
          const migration = manifest.canonicalMigration;
          const sql = fs.readFileSync(migration.path, "utf8").trim();
          const body = sql
            .replace(/^begin;\s*/iu, "")
            .replace(/\s*commit;$/iu, "")
            .trim();
          if (!body) throw new Error("Admin bootstrap migration body is empty.");

          const literal = (value) =>
            `'${String(value).replaceAll("'", "''")}'`;
          const statement = `${migration.path}@${migration.gitBlobSha}`;
          const ledgerPredicate = [
            `version = ${literal(migration.version)}`,
            `name = ${literal(migration.name)}`,
            `statements = array[${literal(statement)}]`,
            `created_by = 'github-actions-production-recovery'`,
            `idempotency_key = ${literal(migration.name)}`,
          ].join(" and ");

          const generated = [
            "begin;",
            `-- source: ${migration.path}`,
            body,
            "create schema if not exists supabase_migrations;",
            "create table if not exists supabase_migrations.schema_migrations (version text not null primary key);",
            "alter table supabase_migrations.schema_migrations add column if not exists statements text[];",
            "alter table supabase_migrations.schema_migrations add column if not exists name text;",
            "alter table supabase_migrations.schema_migrations add column if not exists created_by text;",
            "alter table supabase_migrations.schema_migrations add column if not exists idempotency_key text unique;",
            "alter table supabase_migrations.schema_migrations add column if not exists rollback text[];",
            `insert into supabase_migrations.schema_migrations (version, name, statements, created_by, idempotency_key) values (${literal(migration.version)}, ${literal(migration.name)}, array[${literal(statement)}], 'github-actions-production-recovery', ${literal(migration.name)}) on conflict (version) do nothing;`,
            `do $$ begin if not exists (select 1 from supabase_migrations.schema_migrations where ${ledgerPredicate}) then raise exception 'Migration ledger conflict for version ${migration.version}'; end if; end $$;`,
            "notify pgrst, 'reload schema';",
            "commit;",
            "",
          ].join("\n\n");
          fs.writeFileSync(process.env.OUTPUT_PATH, generated, { mode: 0o600 });
          NODE
          test -s "$RUNNER_TEMP/admin-bootstrap-reconciliation.sql"

      - name: Apply additive Admin bootstrap schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" \
            --set=ON_ERROR_STOP=1 \
            --no-psqlrc \
            --file "$RUNNER_TEMP/admin-bootstrap-reconciliation.sql"
          rm -f "$RUNNER_TEMP/admin-bootstrap-reconciliation.sql"

      - name: Verify final bootstrap and authorization postconditions
        shell: bash
        env:
          SUPABASE_URL: https://cgiukdjwicykrmtkhudh.supabase.co
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" \
            --set=ON_ERROR_STOP=1 \
            --no-psqlrc \
            --tuples-only \
            --no-align <<'SQL' > "$RUNNER_TEMP/admin-bootstrap-postconditions.json"
          select json_build_object(
            'requiredBootstrapColumns', (
              select count(*)
              from information_schema.columns
              where table_schema = 'public'
                and table_name = 'game_sessions'
                and column_name in (
                  'id',
                  'name',
                  'status',
                  'game_join_code',
                  'game_join_code_status',
                  'created_at',
                  'updated_at'
                )
            ),
            'readableCodeConstraint', (
              select count(*)
              from pg_constraint
              where conrelid = 'public.game_sessions'::regclass
                and conname = 'game_sessions_readable_join_code_valid'
            ),
            'readableCodeIndex',
              to_regclass(
                'public.game_sessions_active_readable_join_code_unique'
              ) is not null,
            'invalidReadableCodes', (
              select count(*)
              from public.game_sessions
              where game_join_code is not null
                and game_join_code !~
                  '^ECO-[A-Z]{3,12}-[A-Z]{3,12}-[0-9]{3}$'
            ),
            'ledgerRecordedOnce', (
              select count(*) = 1
              from supabase_migrations.schema_migrations
              where version = '20260729123000'
                and name = 'reconcile_admin_bootstrap_join_code_v1'
                and statements = array[
                  'backend/supabase/migrations/20260729123000_reconcile_admin_bootstrap_join_code_v1.sql@1a12c63686b936a40f56403da5c162bf3c79b2df'
                ]
                and created_by = 'github-actions-production-recovery'
                and idempotency_key =
                  'reconcile_admin_bootstrap_join_code_v1'
            )
          );
          SQL

          POSTCONDITIONS_PATH="$RUNNER_TEMP/admin-bootstrap-postconditions.json" node - <<'NODE'
          const fs = require("node:fs");
          const result = JSON.parse(
            fs.readFileSync(process.env.POSTCONDITIONS_PATH, "utf8").trim(),
          );
          if (
            Number(result.requiredBootstrapColumns) !== 7 ||
            Number(result.readableCodeConstraint) !== 1 ||
            result.readableCodeIndex !== true ||
            Number(result.invalidReadableCodes) !== 0 ||
            result.ledgerRecordedOnce !== true
          ) {
            throw new Error("Production Admin bootstrap postconditions failed.");
          }
          NODE

          psql "$SUPABASE_DB_URL" \
            --set=ON_ERROR_STOP=1 \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --command "select id, name, status, game_join_code, game_join_code_status, created_at, updated_at from public.game_sessions limit 1" \
            > /dev/null

          response_code="$(
            curl --silent --show-error \
              --output "$RUNNER_TEMP/admin-bootstrap-postgrest.json" \
              --write-out "%{http_code}" \
              --header "apikey: ${SUPABASE_SECRET_KEY:-$SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SECRET_KEY:-$SUPABASE_SERVICE_ROLE_KEY}" \
              "$SUPABASE_URL/rest/v1/game_sessions?select=id,name,status,game_join_code,game_join_code_status,created_at,updated_at&limit=1"
          )"
          test "$response_code" = "200"
          rm -f "$RUNNER_TEMP/admin-bootstrap-postgrest.json"

      - name: Record sanitized reconciliation summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Production Admin Bootstrap Schema Reconciliation'
            echo
            echo "- Source commit: \`$RUN_SOURCE_COMMIT\`"
            echo "- Target project: \`$EXPECTED_PRODUCTION_PROJECT_REF\`"
            echo "- Migration: \`20260729123000_reconcile_admin_bootstrap_join_code_v1\`"
            echo "- Schema operation: one nullable column, one check constraint, one partial unique index"
            echo "- Application rows changed: no"
            echo "- Database functions changed: no"
            echo "- Auth metadata changed: no"
            echo "- Edge Functions deployed: no"
            echo "- Credentials or cryptographic keys rotated: no"
            echo "- Raw identifiers or email addresses recorded: no"
          } >> "$GITHUB_STEP_SUMMARY"
