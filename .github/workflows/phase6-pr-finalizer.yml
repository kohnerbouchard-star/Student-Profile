name: Phase 6 PR Finalizer

on:
  push:
    branches:
      - feat/business-timed-manufacturing-v2
    paths:
      - .github/workflows/phase6-pr-finalizer.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
      - name: Verify durable certification boundary
        id: certification
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/roadmaps/business-phase6-certified-v1.json
          implementation_sha="$(node -e "const e=require('./docs/roadmaps/business-phase6-certified-v1.json'); if(!/^[0-9a-f]{40}$/.test(e.implementationSha)||e.missingWorkflows.length||e.failedWorkflows.length) process.exit(1); process.stdout.write(e.implementationSha)")"
          git cat-file -e "${implementation_sha}^{commit}"
          git merge-base --is-ancestor "$implementation_sha" HEAD
          grep -q '^\*\*Status:\*\* COMPLETE' docs/roadmaps/business-phase6-timed-manufacturing-scope-v1.md
          grep -q 'Phase 6 COMPLETE' docs/roadmaps/business-v2-development-execution-plan-v1.md
          grep -q 'Phase 6 COMPLETE: timed manufacturing' docs/roadmaps/business-v2-development-execution-log-v1.md
          unexpected="$(git diff --name-only "${implementation_sha}..HEAD" | grep -Ev '^(docs/roadmaps/|\.github/workflows/)' || true)"
          test -z "$unexpected"
          node scripts/business-phase6-manufacturing-foundation-contract.mjs
          node scripts/business-phase6-manufacturing-start-contract.mjs
          node scripts/business-phase6-manufacturing-completion-contract.mjs
          node scripts/business-phase6-manufacturing-recovery-contract.mjs
          node scripts/business-phase6e-player-api-contract.mjs
          node --test scripts/player-edge-trusted-ip-entrypoint-contract.test.mjs
          echo "implementation_sha=${implementation_sha}" >> "$GITHUB_OUTPUT"
      - name: Remove temporary finalizer and commit cleanup
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase6-pr-finalizer.yml
          rm -f .github/workflows/phase6-convergence.yml .github/workflows/phase6-durable-certifier.yml
          git config user.name "econovaria-phase6-finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/phase6-pr-finalizer.yml .github/workflows/phase6-convergence.yml .github/workflows/phase6-durable-certifier.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(business): remove Phase 6 certification controllers"
            git push origin HEAD:feat/business-timed-manufacturing-v2
          fi
          echo "documentation_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Update draft PR with certified sources
        env:
          GH_TOKEN: ${{ github.token }}
          IMPLEMENTATION_SHA: ${{ steps.certification.outputs.implementation_sha }}
          DOCUMENTATION_HEAD: ${{ steps.cleanup.outputs.documentation_head }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<EOF
          ## Phase 6 certified scope

          Phase 6 replaces instant physical Business production with an authoritative server-timed manufacturing lifecycle. This PR is stacked on certified Phase 5 branch \`feat/business-equipment-capacity-v2\`.

          - **Exact certified implementation and verification source:** \`${IMPLEMENTATION_SHA}\`.
          - **Current documentation/workflow-cleanup head:** \`${DOCUMENTATION_HEAD}\`.
          - Parent PR: #660.

          The implementation source certifies server-owned queued/running/due jobs, atomic Warehouse-to-WIP material movement, deterministic labor and installed-equipment reservations, lease-based exact-once completion into Finished Goods, cancellation/failure recovery, authenticated Player API/workspace cutover, public-key-only reads, and retirement of visible instant production.

          All required exact-head workflows recorded in \`docs/roadmaps/business-phase6-certified-v1.json\` passed. The Phase 6 scope, Business V2 execution plan, and execution log contain the immutable implementation SHA and workflow IDs.

          This PR remains intentionally **draft, open, unmerged, and undeployed**. It does not authorize merge, staging deployment, production deployment, secret mutation, or live database mutation.

          ## Explicit exclusions

          - Store seller offers and Store-listing inventory custody;
          - buyer/seller purchase settlement and automatic sales convergence;
          - durability decay, random failure, maintenance pricing, or repair settlement;
          - corporate equity, IPO, or Financial Market publication;
          - merge, staging deployment, production deployment, or live data mutation.

          **Next authorized work: Phase 7 — bounded Store seller-offer scope intake.**
          EOF
          gh pr edit 661 --repo "$GITHUB_REPOSITORY" --title "Draft: Business V2 Phase 6 timed manufacturing — certified" --body-file /tmp/pr-body.md
