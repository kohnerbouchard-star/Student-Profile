name: Business Phase 6 Status Snapshot

on:
  push:
    branches:
      - feat/business-timed-manufacturing-v2
    paths:
      - .github/workflows/business-phase6-status-snapshot.yml

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0
      - name: Generate durable status snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import binascii
          import json
          import os
          import re
          import struct
          import urllib.request
          import zlib

          scope = Path("docs/roadmaps/business-phase6-timed-manufacturing-scope-v1.md").read_text()
          log = Path("docs/roadmaps/business-v2-development-execution-log-v1.md").read_text()
          plan = Path("docs/roadmaps/business-v2-development-execution-plan-v1.md").read_text()
          match = re.findall(r"Exact certified implementation and verification source:\*\* `([0-9a-f]{40})`|Exact implementation and verification source:\*\* `([0-9a-f]{40})`", log + "\n" + scope)
          source = ""
          for pair in reversed(match):
              source = pair[0] or pair[1]
              if source:
                  break

          required = [
              "Business Timed Manufacturing V2",
              "Business Manufacturing Resource Hold V2",
              "Business Timed Manufacturing Resource Hold V2",
              "Business Manufacturing Completion V2",
              "Database Replay",
              "Backend Typecheck",
              "Player Terminal Verify",
              "Business Banking Runtime",
              "Business Economy V2",
              "Business Workforce Production Payroll V2",
              "Repository Quality",
              "Supply Chain Security",
              "Admin API Check",
              "Staging Readiness Preflight",
              "Required Game Market Timezone",
              "Exchange Calendar Runtime",
          ]
          workflows = {}
          if source:
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "econovaria-phase6-status",
              }
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/runs?head_sha={source}&per_page=100",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              latest = {}
              for run in payload.get("workflow_runs", []):
                  name = run.get("name")
                  current = latest.get(name)
                  if current is None or run.get("created_at", "") > current.get("created_at", ""):
                      latest[name] = run
              workflows = {
                  name: {
                      "runId": latest[name]["id"],
                      "status": latest[name]["status"],
                      "conclusion": latest[name].get("conclusion"),
                  }
                  for name in required if name in latest
              }

          missing = [name for name in required if name not in workflows]
          failed = [
              name for name in required
              if name in workflows and workflows[name].get("conclusion") != "success"
          ]
          durable = (
              "**Status:** COMPLETE" in scope
              and "Phase 6 COMPLETE: timed manufacturing" in log
              and "Phase 7" in plan
              and bool(source)
          )
          certified = durable and not missing and not failed
          status = "CERTIFIED" if certified else ("FAILED" if failed else "PENDING")
          data = {
              "schemaVersion": 1,
              "status": status,
              "sourceSha": source or None,
              "durableScopePlanLog": durable,
              "missingWorkflows": missing,
              "failedWorkflows": failed,
              "workflows": workflows,
              "prNumber": 661,
              "branch": "feat/business-timed-manufacturing-v2",
              "mergeAuthorized": False,
              "deploymentAuthorized": False,
          }
          Path("docs/roadmaps/business-phase6-status-v1.json").write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n"
          )

          color = {
              "CERTIFIED": (32, 160, 72),
              "FAILED": (200, 48, 48),
              "PENDING": (224, 160, 32),
          }[status]
          width, height = 320, 96
          raw = b"".join(b"\x00" + bytes(color) * width for _ in range(height))
          def chunk(kind, payload):
              return struct.pack(">I", len(payload)) + kind + payload + struct.pack(">I", binascii.crc32(kind + payload) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0))
          png += chunk(b"tEXt", f"Phase6Status\x00{status}".encode())
          png += chunk(b"tEXt", f"SourceSha\x00{source}".encode())
          png += chunk(b"IDAT", zlib.compress(raw, 9))
          png += chunk(b"IEND", b"")
          Path("docs/roadmaps/business-phase6-status-v1.png").write_bytes(png)
          PY
          rm .github/workflows/business-phase6-status-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(business): snapshot Phase 6 certification status"
          git push origin HEAD:feat/business-timed-manufacturing-v2
