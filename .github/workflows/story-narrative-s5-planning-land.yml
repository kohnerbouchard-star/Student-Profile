name: Story Narrative S5 Planning Land

on:
  push:
    branches:
      - feat/story-narrative-convergence-v1
    paths:
      - ".github/workflows/story-narrative-s5-planning-land.yml"

permissions:
  contents: write

concurrency:
  group: story-narrative-s5-planning-land
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact story branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard S4 boundary
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/story-narrative-convergence-v1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 31dd4f0c287d6227adf26fda07bce1da4debc088 HEAD
          test -f docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.1"

      - name: Restore exact S5 planning blobs
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          restore_blob() {
            local target="$1"
            local sha="$2"
            mkdir -p "$(dirname "$target")"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/kohnerbouchard-star/Student-Profile/git/blobs/$sha" \
              | python3 -c 'import base64,json,sys; sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["content"].replace("\n", "")))' \
              > "$target"
            test "$(git hash-object "$target")" = "$sha"
          }

          restore_blob docs/seed-content/story/00-master-story-bible-v1.md 60aa600881a55cf5ec43a9a2f8c64097945481f9
          restore_blob docs/seed-content/story/01-hidden-canon-truth-v1.md 3cf3fbf801bc0ab20f5f7478d5f6622c23444923
          restore_blob docs/seed-content/story/02-character-web-v1.md f1f1acfadd2f995023b54e31e0f64719068e926b
          restore_blob docs/seed-content/story/03-content-delivery-and-production-standard-v1.md 503b96d58bb3aa1745db974cdafa1048864a3ef5
          restore_blob docs/seed-content/story/04-campaign-index-v1.md bd5479ccfdd3b200ed94c7f15a9b18fb6f823c59
          restore_blob docs/seed-content/story/calendar/2026-08-august-v1.md 3dc2ed67130646520f96c896ddb7700b3dad0af8
          restore_blob docs/seed-content/story/calendar/2026-09-september-v1.md 2b2eab9877246403bc1ca33c8cbb4de149b3f53b
          restore_blob docs/seed-content/story/calendar/2026-10-october-v1.md daf3614bf67218742632d4469ed9e51ed07bc490
          restore_blob docs/seed-content/story/calendar/2026-11-november-v1.md 461ada70473c97444465871459a5e2f6ea042502
          restore_blob docs/seed-content/story/calendar/2026-12-december-v1.md 56de0b5f27ee3197ba7426928845aff905a39a2d
          restore_blob docs/seed-content/story/calendar/2027-01-january-v1.md 89dd8833391aa55035b2ec0a3c51be4fe88ea46a
          restore_blob docs/seed-content/story/calendar/2027-02-february-v1.md bea328854ce72f5aa3b58a3785a9c06a01386aee
          restore_blob docs/seed-content/story/calendar/2027-03-march-v1.md 68c99780c82d98b4137086b4866a8d3474c2e1cc
          restore_blob docs/seed-content/story/calendar/2027-04-april-v1.md 56d58c63cf7e036c42f5bba92c95c158d1293f16
          restore_blob docs/seed-content/story/calendar/2027-05-may-v1.md 4dfa219d03690932fb1634f0280399813e630631
          restore_blob docs/seed-content/story/calendar/2027-06-june-v1.md 8e0e8fbce3e617320ba4bf5377e3f4903dfffe3d
          restore_blob scripts/story-content-calendar-contract.test.mjs cbb84237d84cb6bfaaad85ae09086a776290fbb5
          git diff --check

      - name: Verify 334-day campaign calendar contract
        id: calendar
        run: node scripts/story-content-calendar-contract.test.mjs

      - name: Update persistent roadmap for S5 planning layer
        id: roadmap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md")
          text = path.read_text(encoding="utf-8")
          old = "### S5 — Narrative content saturation tranche\n\nStatus: PLANNED"
          new = "### S5 — Narrative content saturation tranche\n\nStatus: IN PROGRESS"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("S5 roadmap status anchor missing")

          heading = "### Run 2026-08-11 — S5 master story planning layer landed"
          if heading not in text:
              marker = "\n## Run-completion rule\n"
              if marker not in text:
                  raise SystemExit("roadmap run-completion marker missing")
              lines = [
                  "",
                  heading,
                  "",
                  f"Workflow run: `{os.environ['GITHUB_RUN_ID']}`",
                  f"Source head verified by runner: `{os.environ['GITHUB_SHA']}`",
                  "",
                  "Result: AUTHORITATIVE STORY BIBLE + FULL 334-DAY PRODUCTION CALENDAR GREEN ON BRANCH.",
                  "",
                  "Landed planning authorities:",
                  "",
                  "- master Story thesis, promises, act structure, surface rules, war rule, and ending model;",
                  "- hidden Meridian canon including the Continuity Compact, January intrusion, February attack, independent state escalation, March correction, and May breakthrough;",
                  "- recurring-character web preserving established country/opening casts;",
                  "- delivery/production standard distinguishing interrupts, news, country feed, inbox, choices, Contracts, system consequences, and deliberate quiet days;",
                  "- campaign index with the fixed CEE100 spine;",
                  "- 11 monthly daily-production files covering Days 1–334 from August through June;",
                  "- every simulation day explicitly plans its beat, automatic delivery class, and required assets/system work;",
                  "- authoring dates are reference-only and executable Story records remain elapsed-time/authoritative-trigger based.",
                  "",
                  "Verification:",
                  "",
                  "- `git diff --check`;",
                  "- `node scripts/story-content-calendar-contract.test.mjs`;",
                  "- contract result: 11 months, 334 unique sequential days, all fixed anchor dates correct.",
                  "",
                  "Important scope boundary:",
                  "",
                  "- this completes the S5 planning/calendar layer, not all executable seed records;",
                  "- S5 remains IN PROGRESS until the planned Events, News, Messages, structured Choices, Contracts, country variants, and supported system bindings are authored and validated.",
                  "",
                  "Next: implement the executable August / Act I content pack against proven S1–S4 mechanics, then advance month-by-month while updating this roadmap each run.",
                  "",
              ]
              text = text.replace(marker, "\n".join(lines) + marker, 1)

          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Remove one-shot S5 landing workflow
        shell: bash
        run: rm -f .github/workflows/story-narrative-s5-planning-land.yml

      - name: Commit verified S5 planning layer
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(story): add master story bible and 334-day campaign plan"
          git push origin HEAD:feat/story-narrative-convergence-v1

      - name: Record S5 landing failure in roadmap
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path("docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md")
          text = path.read_text(encoding="utf-8")
          marker = "\n## Run-completion rule\n"
          heading = f"### Run 2026-08-11 — S5 planning landing failure `{os.environ['GITHUB_RUN_ID']}`"
          if heading not in text and marker in text:
              lines = [
                  "",
                  heading,
                  "",
                  f"Source head: `{os.environ['GITHUB_SHA']}`",
                  "",
                  "Result: FAILED; NO S5 STORY-BIBLE/CALENDAR IMPLEMENTATION COMMIT WAS PUBLISHED.",
                  "",
                  "Review this workflow run and correct the exact failing guard, blob restore, calendar contract, roadmap update, or commit step. Do not bypass the 334-day calendar contract.",
                  "",
              ]
              path.write_text(text.replace(marker, "\n".join(lines) + marker, 1), encoding="utf-8")
          PY
          git diff --check
          git add docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(story): record S5 planning landing failure"
            git push origin HEAD:feat/story-narrative-convergence-v1
          fi
