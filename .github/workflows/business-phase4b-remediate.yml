name: Business Phase 4B Remediate

on:
  push:
    branches:
      - feat/business-workforce-hiring-v2
    paths:
      - ".github/workflows/business-phase4b-remediate.yml"

permissions:
  contents: write

concurrency:
  group: business-phase4b-implement
  cancel-in-progress: true

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, 'remediate Phase 4B workforce hiring') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-workforce-hiring-v2
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            player-terminal/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Ensure implementation is materialized
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f backend/supabase/migrations/20260822120000_business_workforce_candidate_hiring_v2.sql ]]; then
            test -f scripts/business-phase4b-payload.py
            python3 scripts/business-phase4b-payload.py
          fi

      - name: Refine source boundaries and retained verification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          contracts = Path("backend/src/domains/business/contracts/playerBusinessContracts.ts")
          text = contracts.read_text(encoding="utf-8")
          text = text.replace("  readWorkforceCandidates(input: {\n", "  readWorkforceCandidates?(input: {\n", 1)
          contracts.write_text(text, encoding="utf-8")

          api = Path("backend/src/domains/business/api/playerBusinessWorkforce.ts")
          text = api.read_text(encoding="utf-8")
          if "PlayerBusinessError," not in text:
              text = text.replace(
                  '  type PlayerBusinessRepository,\n} from "../contracts/playerBusinessContracts.ts";',
                  '  PlayerBusinessError,\n  type PlayerBusinessRepository,\n} from "../contracts/playerBusinessContracts.ts";',
                  1,
              )
          if "business_workforce_unavailable" not in text:
              text = text.replace(
                  "  return repository.readWorkforceCandidates(scope);",
                  '''  if (!repository.readWorkforceCandidates) {
    throw new PlayerBusinessError(
      "business_workforce_unavailable",
      "The Business workforce market is not available.",
      503,
      true,
    );
  }
  return repository.readWorkforceCandidates(scope);''',
                  1,
              )
          api.write_text(text, encoding="utf-8")

          module = Path("player-terminal/src/pages/business-workforce-market.js")
          module.write_text('''import { escapeHtml, formatCurrency, formatNumber, formatPercent } from "../core/format.js";
import { icon } from "../components/icons.js";
import { renderEmptyState } from "../components/ui.js";

function hiddenBusinessKey(business) {
  return `<input name="businessKey" type="hidden" value="${escapeHtml(business.company.id)}" />`;
}

export function renderBusinessWorkforceMarket(workforce, business, fallbackCode) {
  const candidates = Array.isArray(workforce?.candidates) ? workforce.candidates : [];
  if (!candidates.length) {
    return renderEmptyState({
      title: "No candidates available",
      detail: "The server-owned labor market has no matching candidates for this Business country and currency.",
      iconName: "users"
    });
  }
  const groups = new Map();
  for (const candidate of candidates) {
    const key = candidate.roleKey || candidate.roleName || "workforce.other";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(candidate);
  }
  return [...groups.entries()].map(([roleKey, entries]) => `<section class="player-terminal-workforce-role-group">
    <header><small>${escapeHtml(roleKey)}</small><strong>${escapeHtml(entries[0]?.roleName || "Workforce")}</strong></header>
    <div>${entries.map((candidate) => `<article class="player-terminal-business-product">
      <span class="player-terminal-product-icon">${icon("users")}</span>
      <div><small>${escapeHtml(candidate.laborClass)} · ${escapeHtml(candidate.contractType)}</small><strong>${escapeHtml(candidate.displayLabel)}</strong><p>${escapeHtml(formatCurrency(candidate.wagePerCycle, candidate.currencyCode || fallbackCode))} per cycle · ${escapeHtml(formatNumber(candidate.laborMinutesPerCycle))} labor minutes · ${escapeHtml(formatPercent(candidate.skillBasisPoints / 100, 0))} skill</p></div>
      <form data-player-form="business-candidate-hire" data-endpoint="businessCandidateHire" data-candidate-id="${escapeHtml(candidate.candidateKey)}">
        ${hiddenBusinessKey(business)}
        <input name="candidateKey" type="hidden" value="${escapeHtml(candidate.candidateKey)}" />
        <button class="player-terminal-secondary-button" type="submit">${icon("users")} Hire candidate</button>
      </form>
    </article>`).join("")}</div>
  </section>`).join("");
}
''', encoding="utf-8")

          page = Path("player-terminal/src/pages/business-page.js")
          text = page.read_text(encoding="utf-8")
          import_line = 'import { renderBusinessWorkforceMarket } from "./business-workforce-market.js";\n'
          if import_line not in text:
              first_break = text.find("\n") + 1
              text = text[:first_break] + import_line + text[first_break:]
          text = re.sub(
              r'function workforceMarket\(workforce, business, code\) \{.*?\n\}\n\nfunction statusForm',
              'function statusForm',
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace(
              "${workforceMarket(data.businessWorkforce, business, code)}",
              "${renderBusinessWorkforceMarket(data.businessWorkforce, business, code)}",
          )
          page.write_text(text, encoding="utf-8")

          contract = Path("scripts/business-workforce-hiring-contract.mjs")
          text = contract.read_text(encoding="utf-8")
          text = text.replace(
              'const businessPage = fs.readFileSync(\n  "player-terminal/src/pages/business-page.js",\n  "utf8",\n);',
              '''const businessPage = [
  fs.readFileSync("player-terminal/src/pages/business-page.js", "utf8"),
  fs.readFileSync("player-terminal/src/pages/business-workforce-market.js", "utf8"),
].join("\\n");''',
          )
          contract.write_text(text, encoding="utf-8")

          runtime = Path("scripts/business-banking-runtime-contract.mjs")
          if runtime.exists():
              text = runtime.read_text(encoding="utf-8")
              text = text.replace("businessHire", "businessCandidateHire")
              text = text.replace("hire_business_employee_v1", "hire_business_workforce_candidate_v2")
              runtime.write_text(text, encoding="utf-8")
          PY

      - name: Regenerate architecture inventory
        run: node scripts/architecture/build-architecture-inventory.mjs

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm --prefix backend ci --ignore-scripts
          npm --prefix player-terminal ci --no-audit --no-fund

      - name: Verify Phase 4B candidate authority
        shell: bash
        run: |
          set -euo pipefail
          node scripts/business-workforce-hiring-contract.mjs
          node scripts/validate-supabase-migrations.mjs
          npm test
          npm --prefix backend run typecheck
          cd backend
          deno test --config supabase/functions/classroom-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            src/domains/business/api/playerBusinessWorkforceHiring.test.ts \
            src/domains/business/api/playerBusinessRoutePaths.test.ts
          cd ../player-terminal
          npm run check
          node tests/business-banking-surface.mjs
          npm run adapter
          npm run capability-manifest-current
          npm run runtime-integration
          cd ..
          git diff --check

      - name: Publish remediated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/roadmaps/business-phase4b-implementation-diagnostics.md
          rm -f scripts/business-phase4b-payload.py
          rm -f .github/workflows/business-phase4b-implement.yml
          rm -f .github/workflows/business-phase4b-implement-v2.yml
          rm -f .github/workflows/business-phase4b-controller.yml
          rm -f .github/workflows/business-phase4b-remediate.yml
          rm -f .github/workflows/business-phase4b-source-bundle.yml
          git diff --check
          git config user.name "econovaria-phase4b-remediator"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(business): remediate Phase 4B workforce hiring"
          git push origin HEAD:feat/business-workforce-hiring-v2
