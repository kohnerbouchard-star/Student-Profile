name: REF-009 Contract Reward Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ref-009-contract-reward-qualification.yml'
      - 'backend/supabase/functions/admin-api/**'
      - 'scripts/ref-009-contract-reward-acceptance.ts'
      - 'docs/architecture/inventories/econovaria-architecture-inventory-v2.json'
      - 'docs/operations/contracts/player-cross-cutting/pr-752.json'
      - 'docs/roadmaps/refactor-execution-v1/tasks/REF-009.md'

permissions:
  contents: read

jobs:
  inventory-export:
    name: Regenerate bounded REF-009 inventory blob
    if: github.event.pull_request.number == 752 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'refactor/ref-009-local-contract-reward'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
      - name: Generate inventory with the unchanged repository generator
        run: node scripts/architecture/build-architecture-inventory.mjs
      - name: Export only the generated blob without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const path = 'docs/architecture/inventories/econovaria-architecture-inventory-v2.json';
          const changed = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          if (changed.some(value => value !== path)) throw new Error('Unexpected generated path');
          const content = readFileSync(path, 'utf8');
          if (JSON.parse(content).generatedBy !== 'scripts/architecture/build-architecture-inventory.mjs') throw new Error('Unexpected generator');
          const response = await fetch(`https://api.github.com/repos/${process.env.EXPECTED_REPOSITORY}/git/blobs`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ content, encoding: 'utf-8' }),
          });
          if (!response.ok) throw new Error(`Inventory blob export failed: HTTP ${response.status}`);
          const { sha } = await response.json();
          if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid blob identity');
          console.log(JSON.stringify({ path, blobSha: sha, sourceCommit: process.env.GITHUB_SHA, refsChanged: false }));
          NODE
