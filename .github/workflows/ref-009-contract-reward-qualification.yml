name: REF-009 Contract Reward Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ref-009-contract-reward-qualification.yml'
      - 'backend/supabase/functions/admin-api/**'
      - 'backend/supabase/migrations/**'
      - 'scripts/ref-009-contract-reward-*'
      - 'docs/architecture/inventories/econovaria-architecture-inventory-v2.json'
      - 'docs/operations/contracts/player-cross-cutting/pr-752.json'
      - 'docs/roadmaps/refactor-execution-v1/tasks/REF-009.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ref-009-contract-reward-qualification.yml'
      - 'backend/supabase/functions/admin-api/**'
      - 'backend/supabase/migrations/**'
      - 'scripts/ref-009-contract-reward-*'

permissions:
  contents: read

concurrency:
  group: ref009-rewards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory-export:
    name: Regenerate bounded REF-009 inventory blob
    if: github.event.pull_request.number == 752 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'refactor/ref-009-local-contract-reward'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
      - run: node scripts/architecture/build-architecture-inventory.mjs
      - name: Export generated inventory without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const path = 'docs/architecture/inventories/econovaria-architecture-inventory-v2.json';
          const changed = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          if (changed.some(value => value !== path)) throw new Error('Unexpected generated path');
          const content = readFileSync(path, 'utf8');
          if (JSON.parse(content).generatedBy !== 'scripts/architecture/build-architecture-inventory.mjs') throw new Error('Unexpected generator');
          const response = await fetch(`https://api.github.com/repos/${process.env.EXPECTED_REPOSITORY}/git/blobs`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ content, encoding: 'utf-8' }),
          });
          if (!response.ok) throw new Error(`Inventory blob export failed: HTTP ${response.status}`);
          const { sha } = await response.json();
          if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid blob identity');
          console.log(JSON.stringify({ path, blobSha: sha, sourceCommit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), refsChanged: false }));
          NODE
  reward-qualification:
    name: Contract reward database/race qualification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      REF009_DISPOSABLE_DATABASE: '1'
      RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact qualification head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3
      - name: Install pinned tooling and check qualification source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ref009
          npm install --global npm@10.9.8
          npm ci
          npm --prefix backend ci
          deno check --config backend/supabase/functions/admin-api/deno.json --lock=backend/supabase/functions/deno.lock --frozen scripts/ref-009-contract-reward-acceptance.ts scripts/ref-009-contract-reward-parity.test.ts
          npx supabase --version
          npx supabase start --help > /tmp/ref009/start-help.log
          npx supabase db reset --help > /tmp/ref009/reset-help.log
      - name: Verify focused application and retained parity regressions
        shell: bash
        run: |
          set -euo pipefail
          {
            npm --prefix backend run test:admin-api
            deno test --config backend/supabase/functions/admin-api/deno.json --lock=backend/supabase/functions/deno.lock --frozen scripts/ref-009-contract-reward-parity.test.ts
            npm --prefix backend run test:economic-ledger-invariants
            npm --prefix backend run test:player-contract-acceptance
            npm --prefix backend run test:player-contract-lifecycle
            npm run test:admin-economic-writes
          } 2>&1 | tee /tmp/ref009/application-regressions.log
      - name: Start disposable local database and replay migrations
        shell: bash
        run: |
          set -euo pipefail
          npx supabase start --workdir backend --exclude studio,imgproxy,storage-api,logflare,vector,supavisor,realtime,postgres-meta,mailpit,edge-runtime > /tmp/ref009/database-start.log 2>&1
          npx supabase db reset --workdir backend --local > /tmp/ref009/database-replay.log 2>&1
      - name: Prove actual reward effects, replay, rollback and overlapping submissions
        shell: bash
        run: |
          set -euo pipefail
          deno run --config backend/supabase/functions/admin-api/deno.json --lock=backend/supabase/functions/deno.lock --frozen --allow-env --allow-read --allow-run=psql --allow-write=/tmp/ref009 --deny-net scripts/ref-009-contract-reward-acceptance.ts 2>&1 | tee /tmp/ref009/database-qualification.log
      - name: Verify deterministic inventory and unchanged architecture limits
        run: npm run audit:architecture
      - name: Upload exact-head qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ref009-reward-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/ref009/
          if-no-files-found: error
          retention-days: 30
      - name: Stop disposable database
        if: always()
        run: npx supabase stop --workdir backend --no-backup
