name: Business Store Atomic Settlement V2

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/src/domains/store/**"
      - "backend/src/domains/inventory/**"
      - "backend/src/domains/business/**"
      - "backend/src/domains/business-banking/**"
      - "backend/supabase/migrations/202608251100*.sql"
      - "docs/architecture/inventories/econovaria-architecture-inventory-v2.json"
      - "docs/roadmaps/business-phase10-atomic-store-settlement-scope-v1.md"
      - "scripts/business-phase10-atomic-settlement-*.mjs"
      - ".github/workflows/business-store-atomic-settlement-v2.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/src/domains/store/**"
      - "backend/src/domains/inventory/**"
      - "backend/src/domains/business/**"
      - "backend/src/domains/business-banking/**"
      - "backend/supabase/migrations/202608251100*.sql"
      - "docs/architecture/inventories/econovaria-architecture-inventory-v2.json"
      - "docs/roadmaps/business-phase10-atomic-store-settlement-scope-v1.md"
      - "scripts/business-phase10-atomic-settlement-*.mjs"
      - ".github/workflows/business-store-atomic-settlement-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-store-atomic-settlement-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-settlement-authority:
    name: Verify atomic settlement authority and retained Store phases
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm and install repository dependencies
        run: |
          npm install --global npm@10.9.8
          npm ci --ignore-scripts

      - name: Verify Phase 10A.3 and retained Store authorities
        shell: bash
        run: |
          set -euo pipefail
          {
            node scripts/business-phase10-atomic-settlement-contract.mjs
            node scripts/business-phase10-atomic-settlement-simulation.mjs
            node --experimental-strip-types scripts/business-phase10-atomic-settlement-types.mjs
            node scripts/business-phase10-offer-aware-quote-contract.mjs
            node scripts/business-phase10-offer-aware-quote-simulation.mjs
            node --experimental-strip-types scripts/business-phase10-offer-aware-quote-types.mjs
            node scripts/business-phase10-store-purchase-settlement-foundation-contract.mjs
            node --experimental-strip-types scripts/business-phase10-store-purchase-settlement-lock-simulation.mjs
            node --experimental-strip-types scripts/business-phase10-store-purchase-settlement-foundation-types.mjs
            node scripts/business-phase9-store-withdrawal-safety-contract.mjs
            node scripts/business-phase9-store-withdrawal-safety-simulation.mjs
            node --experimental-strip-types scripts/business-phase9-store-withdrawal-safety-types.mjs
            node scripts/business-phase8-store-listing-inventory-contract.mjs
            node scripts/business-phase8-store-listing-inventory-simulation.mjs
            node --experimental-strip-types scripts/business-phase8-store-listing-inventory-types.mjs
            node scripts/business-phase7-store-seller-offers-contract.mjs
            node scripts/business-phase7-store-seller-offers-simulation.mjs
            node --experimental-strip-types scripts/business-phase7-store-seller-offers-types.mjs
            node scripts/validate-supabase-migrations.mjs
            npm run audit:interaction-wiring
            git diff --check
          } 2>&1 | tee /tmp/phase10a3-settlement-authority.log

      - name: Verify deterministic architecture inventory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/architecture/build-architecture-inventory.mjs
          git diff --exit-code -- docs/architecture/inventories/econovaria-architecture-inventory-v2.json

      - name: Upload generated architecture inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase10a3-architecture-inventory
          path: docs/architecture/inventories/econovaria-architecture-inventory-v2.json
          if-no-files-found: error
          retention-days: 14

      - name: Run Repository Quality and Supply Chain Security
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/phase10a3-repository-quality.log
          npm run security:verify 2>&1 | tee /tmp/phase10a3-supply-chain-security.log

      - name: Upload authority diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase10a3-authority-diagnostics
          path: |
            /tmp/phase10a3-settlement-authority.log
            /tmp/phase10a3-repository-quality.log
            /tmp/phase10a3-supply-chain-security.log
          if-no-files-found: warn
          retention-days: 14

  verify-database-settlement:
    name: Verify database settlement, rollback, races, and isolation
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm and install pinned tooling
        run: |
          npm install --global npm@10.9.8
          npm ci --ignore-scripts

      - name: Start disposable Postgres service
        shell: bash
        run: |
          set -euo pipefail
          LOG="/tmp/phase10a3-database-startup.log"
          : > "$LOG"
          STATUS=1
          EXCLUDED="studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,gotrue,postgrest,realtime,kong,mailpit,postgres-meta"
          for ATTEMPT in 1 2 3; do
            printf '\n## Supabase Postgres startup attempt %s\n' "$ATTEMPT" | tee -a "$LOG"
            set +e
            npx supabase start --workdir backend --exclude "$EXCLUDED" 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            npx supabase status --workdir backend 2>&1 | tee -a "$LOG" || true
            npx supabase stop --workdir backend --no-backup 2>&1 | tee -a "$LOG" || true
            sleep $((ATTEMPT * 10))
          done
          exit "$STATUS"

      - name: Rebuild database for behavior verification
        shell: bash
        run: |
          set -euo pipefail
          npx supabase db reset --workdir backend --local 2>&1 | tee /tmp/phase10a3-database-reset.log

      - name: Run permanent atomic-settlement database harness
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          node scripts/business-phase10-atomic-settlement-database.mjs 2>&1 | tee /tmp/phase10a3-database-harness.log

      - name: Rebuild database for independent concurrency verification
        shell: bash
        run: |
          set -euo pipefail
          npx supabase db reset --workdir backend --local 2>&1 | tee /tmp/phase10a3-concurrency-reset.log

      - name: Run permanent atomic-settlement concurrency harness
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          node scripts/business-phase10-atomic-settlement-concurrency.mjs 2>&1 | tee /tmp/phase10a3-concurrency-harness.log

      - name: Capture database-settlement diagnostics
        if: failure()
        shell: bash
        run: |
          npx supabase status --workdir backend 2>&1 | tee /tmp/phase10a3-database-status.log || true
          docker ps -a 2>&1 | tee /tmp/phase10a3-database-docker.log || true
          docker system df 2>&1 | tee -a /tmp/phase10a3-database-docker.log || true

      - name: Upload database-settlement diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase10a3-database-settlement-diagnostics
          path: |
            /tmp/phase10a3-database-startup.log
            /tmp/phase10a3-database-reset.log
            /tmp/phase10a3-database-harness.log
            /tmp/phase10a3-concurrency-reset.log
            /tmp/phase10a3-concurrency-harness.log
            /tmp/phase10a3-database-status.log
            /tmp/phase10a3-database-docker.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop disposable stack
        if: always()
        run: npx supabase stop --workdir backend --no-backup || true

  verify-database-replay:
    name: Replay complete database twice and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm and install pinned tooling
        run: |
          npm install --global npm@10.9.8
          npm ci --ignore-scripts

      - name: Validate migration source
        run: npm run audit:migrations

      - name: Start disposable Postgres service
        shell: bash
        run: |
          set -euo pipefail
          LOG="/tmp/phase10a3-database-replay-startup.log"
          : > "$LOG"
          STATUS=1
          EXCLUDED="studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,gotrue,postgrest,realtime,kong,mailpit,postgres-meta"
          for ATTEMPT in 1 2 3; do
            printf '\n## Supabase Postgres startup attempt %s\n' "$ATTEMPT" | tee -a "$LOG"
            set +e
            npx supabase start --workdir backend --exclude "$EXCLUDED" 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            npx supabase status --workdir backend 2>&1 | tee -a "$LOG" || true
            npx supabase stop --workdir backend --no-backup 2>&1 | tee -a "$LOG" || true
            sleep $((ATTEMPT * 10))
          done
          exit "$STATUS"

      - name: Replay migrations from zero twice
        shell: bash
        run: |
          set -euo pipefail
          npx supabase db reset --workdir backend --local 2>&1 | tee /tmp/phase10a3-database-replay.log
          npx supabase db reset --workdir backend --local 2>&1 | tee -a /tmp/phase10a3-database-replay.log

      - name: Lint rebuilt database
        shell: bash
        run: |
          set -euo pipefail
          npx supabase db lint --workdir backend --local --level warning 2>&1 | tee /tmp/phase10a3-database-lint.log

      - name: Capture database-replay diagnostics
        if: failure()
        shell: bash
        run: |
          npx supabase status --workdir backend 2>&1 | tee /tmp/phase10a3-database-replay-status.log || true
          docker ps -a 2>&1 | tee /tmp/phase10a3-database-replay-docker.log || true
          docker system df 2>&1 | tee -a /tmp/phase10a3-database-replay-docker.log || true

      - name: Upload database-replay diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase10a3-database-replay-diagnostics
          path: |
            /tmp/phase10a3-database-replay-startup.log
            /tmp/phase10a3-database-replay.log
            /tmp/phase10a3-database-lint.log
            /tmp/phase10a3-database-replay-status.log
            /tmp/phase10a3-database-replay-docker.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop disposable stack
        if: always()
        run: npx supabase stop --workdir backend --no-backup || true

  verify-retained-economic-runtime:
    name: Verify retained Business, Store, Inventory, Backend, and Edge runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.3

      - name: Pin npm and install dependencies
        run: |
          npm install --global npm@10.9.8
          npm ci --ignore-scripts
          npm --prefix backend ci --ignore-scripts

      - name: Verify retained Business Economy and Banking
        shell: bash
        run: |
          set -euo pipefail
          node scripts/business-formation-authority-contract.mjs
          node scripts/business-economy-authority-contract.mjs
          node scripts/business-domain-boundary-contract.mjs
          node scripts/business-recipe-access-contract.mjs
          node scripts/business-stockroom-authority-contract.mjs
          node scripts/business-store-procurement-authority-contract.mjs
          node scripts/business-input-purchase-retirement-contract.mjs
          node scripts/business-banking-runtime-contract.mjs
          node --experimental-strip-types --test scripts/business-banking-economic-simulation.test.mjs

      - name: Verify retained workforce, payroll, equipment, and manufacturing
        shell: bash
        run: |
          set -euo pipefail
          node scripts/business-workforce-hiring-contract.mjs
          node scripts/business-workforce-payroll-foundation-contract.mjs
          node scripts/business-workforce-payroll-scope-hardening-contract.mjs
          node scripts/business-phase4c-production-labor-contract.mjs
          node scripts/business-phase4c-labor-reservation-simulation.mjs
          node scripts/business-phase4c-payroll-settlement-contract.mjs
          node scripts/business-phase4c-payroll-simulation.mjs
          node scripts/business-phase4c-player-recovery-contract.mjs
          node scripts/business-phase5-equipment-foundation-contract.mjs
          node scripts/business-phase5-equipment-capacity-simulation.mjs
          node scripts/business-phase5-equipment-recipe-sync-contract.mjs
          node scripts/business-phase5-equipment-production-contract.mjs
          node scripts/business-phase5-equipment-production-simulation.mjs
          node scripts/business-phase6-manufacturing-foundation-contract.mjs
          node scripts/business-phase6-manufacturing-lifecycle-simulation.mjs
          node scripts/business-phase6-manufacturing-start-contract.mjs
          node scripts/business-phase6-manufacturing-start-simulation.mjs
          node scripts/business-phase6-manufacturing-completion-contract.mjs
          node scripts/business-phase6-manufacturing-completion-simulation.mjs
          node scripts/business-phase6-manufacturing-recovery-contract.mjs
          node scripts/business-phase6-manufacturing-recovery-simulation.mjs
          node scripts/business-phase6-manufacturing-classroom-load-isolation.mjs
          node scripts/business-phase6e-player-api-contract.mjs
          node --test \
            scripts/player-cross-cutting-authority.test.mjs \
            scripts/player-edge-trusted-ip-entrypoint-contract.test.mjs

      - name: Verify extracted Business route authority
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          deno test --config supabase/functions/classroom-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            src/domains/business/api/playerBusinessRoutePaths.test.ts \
            src/domains/business/api/playerBusinessStoreProcurement.test.ts \
            src/domains/business/api/playerBusinessStockroomHttpHandler.test.ts \
            src/domains/business/api/playerBusinessInputPurchaseRetirement.test.ts \
            src/domains/business/infrastructure/supabaseBusinessStockroomReadRepository.test.ts \
            src/domains/players/contracts/playerCapabilityManifestContracts.test.ts \
            src/domains/business-banking/api/playerBusinessBankingRoutePaths.test.ts

      - name: Verify retained Store and Inventory lifecycles
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm run test:player-store-public
          npm run test:player-inventory

      - name: Verify all backend and Edge TypeScript
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck:all
          deno check \
            --config supabase/functions/deno.json \
            --lock=supabase/functions/deno.lock \
            --frozen \
            supabase/functions/bootstrap-api/index.ts \
            supabase/functions/staff-api/index.ts \
            supabase/functions/staff-mfa-api/index.ts \
            supabase/functions/player-api/index.ts \
            supabase/functions/player-web-session-api/index.ts \
            supabase/functions/web-session-api/index.ts \
            supabase/functions/password-reset-api/index.ts

  verify-player-terminal-and-chromium:
    name: Verify retained Player Terminal and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: player-terminal/package-lock.json

      - name: Install Player Terminal dependencies
        working-directory: player-terminal
        run: npm ci --no-audit --no-fund

      - name: Verify standalone Player Terminal and Business surface
        working-directory: player-terminal
        shell: bash
        run: |
          set -euo pipefail
          npm run verify
          npm run check
          node tests/business-banking-surface.mjs
          npm run adapter
          npm run capability-manifest-current
          npm run runtime-integration

      - name: Install Chromium
        working-directory: player-terminal
        run: npx playwright install --with-deps chromium

      - name: Materialize browser-only runtime fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p player-terminal/frontend/src/core
          cp frontend/src/core/runtime-config.js player-terminal/frontend/src/core/runtime-config.js
          cat > player-terminal/runtime-config.env.js <<'EOF'
          window.__ECONOVARIA_RUNTIME_CONFIG__ = Object.freeze({
            environment: "development",
            projectRef: "runtimefixture123456",
            supabaseUrl: "https://runtimefixture123456.supabase.co",
            supabasePublishableKey: "sb_publishable_runtime_fixture_1234567890"
          });
          EOF

      - name: Run Chromium browser verification
        working-directory: player-terminal
        shell: bash
        run: |
          set -euo pipefail
          npm run browser 2>&1 | tee /tmp/phase10a3-player-chromium.log

      - name: Upload Player/Chromium diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase10a3-player-chromium-diagnostics
          path: |
            /tmp/phase10a3-player-chromium.log
            player-terminal/playwright-report
            player-terminal/test-results
          if-no-files-found: warn
          retention-days: 14
