name: C2 local certification once

on:
  push:
    branches:
      - feat/multicurrency-marketplace-funding-v1
    paths:
      - .github/workflows/c2-local-certification-20260828-once.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact certification head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out SHA and remove carrier from tested tree
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          rm .github/workflows/c2-local-certification-20260828-once.yml

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.3

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          npm ci --ignore-scripts
          npm --prefix backend ci --ignore-scripts
          npm --prefix player-terminal ci --ignore-scripts

      - name: Verify C2 source, authority, Backend, and deterministic architecture
        shell: bash
        env:
          PR_NUMBER: "675"
          BASE_REF: feat/multicurrency-store-funding-v1
        run: |
          set -euo pipefail
          node --test scripts/player-cross-cutting-authority.test.mjs
          git diff --name-only "origin/${BASE_REF}...HEAD" \
            | grep -v '^.github/workflows/c2-local-certification-20260828-once.yml$' \
            | sort -u > /tmp/c2-certified-files.txt
          node scripts/verify-player-cross-cutting-authority.mjs \
            --changed-files /tmp/c2-certified-files.txt \
            --pr-number "$PR_NUMBER" \
            --base-ref "$BASE_REF"
          node scripts/multicurrency-marketplace-funding-contract.mjs
          node --test player-terminal/tests/marketplace-funding-flow.mjs
          node player-terminal/tests/smoke.mjs
          node player-terminal/tests/marketplace-connected-lifecycle.mjs
          node --check player-terminal/tools/connected-marketplace-mutation-runner.mjs
          node scripts/validate-supabase-migrations.mjs
          npm --prefix backend run typecheck
          npm --prefix backend run test:player-marketplace
          node scripts/architecture/build-architecture-inventory.mjs
          node scripts/architecture/architecture-ratchet-v2.mjs
          git diff --exit-code -- docs/architecture/inventories/econovaria-architecture-inventory-v2.json
          git diff --check

      - name: Verify complete standalone Player Terminal
        shell: bash
        run: npm --prefix player-terminal run verify

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd player-terminal
          npx playwright install --with-deps chromium

      - name: Verify Marketplace Chromium journey
        shell: bash
        run: |
          set -euo pipefail
          cd player-terminal
          npm run browser -- tests/browser/marketplace-lifecycle.spec.mjs

      - name: Start disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          EXCLUDED="studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,gotrue,postgrest,realtime,kong,mailpit,postgres-meta"
          npx supabase start --workdir backend --exclude "$EXCLUDED"

      - name: Replay zero-to-head twice
        shell: bash
        run: |
          set -euo pipefail
          npx supabase db reset --workdir backend --local
          npx supabase db reset --workdir backend --local

      - name: Verify C2 serial, rollback, concurrency, privacy, and isolation database authority
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          node scripts/multicurrency-marketplace-funding-database.mjs
          node scripts/multicurrency-marketplace-funding-concurrency.mjs
          npx supabase db lint --workdir backend --local --level warning

      - name: Stop disposable stack
        if: always()
        run: npx supabase stop --workdir backend --no-backup || true
