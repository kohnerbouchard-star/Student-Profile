name: C3E Autonomous Certification Controller v3

on:
  push:
    branches:
      - feat/multicurrency-stock-funding-v1
    paths:
      - .github/workflows/c3e-autonomous-controller-v3.yml
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  models: read
  pull-requests: write

concurrency:
  group: c3e-autonomous-certification-feat-multicurrency-stock-funding-v1
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      REPO: kohnerbouchard-star/Student-Profile
      BRANCH: feat/multicurrency-stock-funding-v1
      BASE: feat/multicurrency-marketplace-funding-v1
      PR: '676'
      GH_TOKEN: ${{ github.token }}
      GITHUB_API_KEY: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PUSH_TOKEN: ${{ secrets.C3E_AUTOMATION_TOKEN || secrets.CODEX_GITHUB_TOKEN || secrets.GH_PAT || secrets.PAT || secrets.PERSONAL_ACCESS_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22.23.1
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.3

      - name: Install pinned repository and agent tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          npm ci --ignore-scripts
          npm --prefix backend ci --ignore-scripts
          if [[ -f player-terminal/package-lock.json ]]; then npm --prefix player-terminal ci --ignore-scripts; fi
          python -m pip install --disable-pip-version-check requests aider-chat

      - name: Run bounded implementation and deterministic certification controller
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/c3e-v3.py <<'PY'
          from __future__ import annotations
          import json, os, re, subprocess, sys, time, traceback, zipfile
          from datetime import datetime, timezone
          from io import BytesIO
          from pathlib import Path
          from typing import Any
          import requests

          ROOT=Path.cwd(); REPO=os.environ['REPO']; BRANCH=os.environ['BRANCH']; BASE=os.environ['BASE']; PR=int(os.environ['PR'])
          GH=os.environ['GH_TOKEN']; PUSH=os.environ['PUSH_TOKEN']; API=f'https://api.github.com/repos/{REPO}'
          C3D='9b502b9ffa5e8aaf2f7c8d93d9cd3ccda3a10f15'
          REQUIRED=['Required Game Market Timezone','Staging Readiness Preflight','Business Banking Runtime','Runtime Interaction Wiring','Exchange Calendar Runtime','Supply Chain Security','Environment Neutral Browser','Business Economy V2','Business Workforce Hiring V2','Admin API Check','Business Workforce Payroll V2','World Runtime','Repository Quality','Backend Typecheck','Database Replay','Progression Runtime','Business Timed Manufacturing V2','multicurrency-store-funding-v1','multicurrency-marketplace-funding-v1','multicurrency-stock-funding-v1','Player Terminal Verify','Business Store Withdrawal Safety V2','banking-fx-clearing-v1','Business Store Listing Inventory V2','Business Store Seller Offers V2','Business Store Atomic Settlement V2','Business Player Store Cutover V2']
          TEMP=['.github/workflows/c3e-source-export.yml','.github/workflows/c3e-autonomous-controller-v2.yml','.github/workflows/c3e-autonomous-controller-v3.yml']
          H={'Authorization':f'Bearer {GH}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}

          def log(s): print(f'[{datetime.now(timezone.utc).isoformat()}] {s}',flush=True)
          def sh(cmd,check=True,timeout=2400):
              log('RUN '+(' '.join(cmd) if isinstance(cmd,list) else cmd)); p=subprocess.run(cmd,shell=isinstance(cmd,str),cwd=ROOT,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=timeout)
              print(p.stdout[-50000:],flush=True)
              if check and p.returncode: raise RuntimeError(f'command failed {p.returncode}: {cmd}\n{p.stdout[-30000:]}')
              return p
          def api(method,path,body=None,allow=(200,201,202,204)):
              r=requests.request(method,API+path,headers=H,json=body,timeout=120,allow_redirects=True)
              if r.status_code not in allow: raise RuntimeError(f'api {method} {path}: {r.status_code} {r.text[:2000]}')
              return r
          def remove_temp():
              for x in TEMP:
                  p=ROOT/x
                  if p.exists(): p.unlink(); log('removed '+x)
          def configure():
              sh(['git','config','user.name','Econovaria C3E Controller']); sh(['git','config','user.email','c3e-controller@users.noreply.github.com'])
              sh(['git','remote','set-url','origin',f'https://x-access-token:{PUSH}@github.com/{REPO}.git'])
              sh(['git','fetch','--no-tags','origin',BASE,BRANCH])
          def status(): return sh(['git','status','--porcelain'],check=False).stdout
          def paths(): return sorted(x for x in sh(['git','diff','--name-only',f'origin/{BASE}'],check=False).stdout.splitlines() if x)
          def regen():
              for p in ['scripts/generate-architecture-inventory.mjs','scripts/generate-econovaria-architecture-inventory.mjs']:
                  if (ROOT/p).exists(): sh(['node',p]); return
              package=json.loads((ROOT/'package.json').read_text())
              for name in package.get('scripts',{}):
                  q=name.lower()
                  if 'architecture' in q and ('inventory' in q or 'generate' in q): sh(['npm','run',name]); return
          def authority():
              f=Path('/tmp/c3e-v3-changed.txt'); f.write_text('\n'.join(paths())+'\n')
              return sh(['node','scripts/verify-player-cross-cutting-authority.mjs','--changed-files',str(f),'--pr-number',str(PR),'--base-ref',BASE],check=False)
          def checks():
              regen(); commands=[['node','--test','scripts/player-cross-cutting-authority.test.mjs'],['node','--test','player-terminal/tests/stock-multicurrency-funding.mjs','player-terminal/tests/portfolio-market-holdings.mjs'],['npm','--prefix','backend','run','typecheck']]
              out=[]
              for c in commands:
                  p=sh(c,check=False); out.append('$ '+' '.join(c)+'\n'+p.stdout)
                  if p.returncode:return '\n'.join(out)[-140000:]
              p=authority(); out.append(p.stdout)
              if p.returncode:return '\n'.join(out)[-140000:]
              p=sh(['git','diff','--check'],check=False); out.append(p.stdout)
              if p.returncode:return '\n'.join(out)[-140000:]
              package=json.loads((ROOT/'package.json').read_text())
              for name in ('test:repo','quality'):
                  if name in package.get('scripts',{}):
                      p=sh(['npm','run',name],check=False,timeout=3000); out.append(p.stdout)
                      if p.returncode:return '\n'.join(out)[-140000:]
              return ''
          def target_files():
              base=['player-terminal/src/api/payload-normalizer.js','player-terminal/src/api/resource-plan.js','player-terminal/src/pages/market-page.js','player-terminal/tests/browser/player-terminal-core.mjs','player-terminal/tests/portfolio-market-holdings.mjs','player-terminal/tests/stock-multicurrency-funding.mjs','docs/operations/contracts/player-cross-cutting/pr-676.json','docs/roadmaps/multicurrency-stock-funding-c3e-execution-note-v1.md']
              p=sh("git grep -Il -E 'market-order|orderType|buy_now|settle_sell|listingCurrency|listing_currency|portfolio|holdings' -- api player-terminal backend/src/domains/stocks scripts | head -n 50",check=False)
              return list(dict.fromkeys([x for x in base+p.stdout.splitlines() if (ROOT/x).is_file()]))
          PROMPT='''Complete Econovaria BUSINESS-V2-10A4C3E on PR #676. Read the C3D handoff, C3E execution note, implementation plan, checkpoint manifest, reconciliation, authority manifest, and architecture rules first. Repair the connected Player Stock cutover and tests without merging or deploying. The C3E Market forms use buy_now and settle_sell; the connected adapter must not require the retired side/orderType body. Browser inputs may contain only public ticker/evidence/account keys and constrained choices; game/Player scope and monetary outcomes remain server-derived. Buys use one-to-three unique canonical bac_* Checking accounts with exact listing-currency allocations. Sells use exactly one canonical Checking destination. Preserve sbq_*, pfr_*, btx_*, C3B quote, C3C buy, C3D sell, replay/idempotency/conflict semantics, and fail-closed price/tick/account/balance/holding/liquidity/FX checks. Never trust/expose UUID/private scope. Portfolio and holdings must never sum different listing currencies under one label; implement per-listing-currency subtotals and preserve listing currency through board/detail/portfolio/holdings/orders/trades and P&L. Prove connected buy/sell submission, confirmation/receipt/proceeds, privacy, Banking FX reads, keyboard/focus/mobile/reduced-motion/screen-reader behavior. Keep limit/queued/partial-fill orders, margin, shorts, old fee estimate, Stock wallets, and balance caches absent. Do not weaken Store, Banking, browser, security, privacy, database, or architecture tests. Update the PR exact-path manifest narrowly for new paths and regenerate architecture canonically. Keep C3E not certified until exact-head CI is green. Do not edit workflows, migrations, secrets, schedulers, domains, deployment files, or live systems.'''
          def choose_model():
              candidates=[]
              if os.environ.get('OPENAI_API_KEY'): candidates+=['gpt-5','gpt-4.1']
              candidates+=['github/openai/gpt-5','github/openai/gpt-4.1','github/gpt-4.1','github/gpt-4o']
              for m in candidates:
                  p=sh(['aider','--yes-always','--no-auto-commits','--no-gitignore','--model',m,'--message','Inspect the repository and reply without editing.'],check=False,timeout=600)
                  if p.returncode==0: log('selected aider model '+m); return m
              raise RuntimeError('no approved edit-oriented model available')
          MODEL=None
          def repair(extra=''):
              global MODEL
              if MODEL is None: MODEL=choose_model()
              files=target_files()+['docs/roadmaps/multicurrency-stock-funding-c3d-handoff-v1.md','docs/roadmaps/multicurrency-stock-funding-implementation-plan-v1.md','docs/roadmaps/business-v2-current-checkpoint-v1.json','docs/roadmaps/business-v2-roadmap-reconciliation-20260829.md']
              msg=PROMPT+('\n\nConcrete failure evidence:\n'+extra[-140000:] if extra else '')
              Path('/tmp/c3e-v3-prompt.txt').write_text(msg)
              cmd=['aider','--yes-always','--no-auto-commits','--no-gitignore','--model',MODEL,'--message-file','/tmp/c3e-v3-prompt.txt',*list(dict.fromkeys(files))]
              sh(cmd,timeout=2400); remove_temp()
          def local_loop(extra=''):
              evidence=extra
              for i in range(4):
                  repair(evidence); failure=checks()
                  if not failure:return
                  evidence='LOCAL GATE FAILURE:\n'+failure
              raise RuntimeError('local repair gates did not pass')
          def commit(msg):
              remove_temp(); sh(['git','add','-A'])
              if not status(): return sh(['git','rev-parse','HEAD']).stdout.strip()
              sh(['git','commit','-m',msg]); sha=sh(['git','rev-parse','HEAD']).stdout.strip(); sh(['git','push','origin',f'HEAD:{BRANCH}'],timeout=600); return sha
          def runs(sha):
              data=api('GET',f'/actions/runs?head_sha={sha}&event=pull_request&per_page=100').json().get('workflow_runs',[]); latest={}
              for x in sorted(data,key=lambda z:(z.get('name',''),z.get('run_attempt',0),z.get('created_at',''))):latest[x['name']]=x
              return latest
          def state(sha):
              r=runs(sha); missing=[x for x in REQUIRED if x not in r]; pending=[x for x in REQUIRED if x in r and r[x].get('status')!='completed']; failed=[x for x in REQUIRED if x in r and r[x].get('status')=='completed' and r[x].get('conclusion')!='success']; extra=[x['name'] for x in r.values() if x.get('status')=='completed' and x.get('conclusion') not in ('success','skipped','neutral')]
              return ('failed' if failed or extra else 'pending' if missing or pending else 'green'),r,{'missing':missing,'pending':pending,'failed':failed,'extra_failed':extra}
          def signal(phase,sha,detail):
              pr=api('GET',f'/pulls/{PR}').json(); body=(pr.get('body') or '').split('\n\n---\n\n### C3E controller v3 status')[0]
              api('PATCH',f'/pulls/{PR}',{'body':body+f'\n\n---\n\n### C3E controller v3 status\nPhase: `{phase}`  \nHead: `{sha}`  \nMatrix: `{json.dumps(detail,sort_keys=True)}`  \nWaiting for the ordinary PR workflow event. No merge or deployment is authorized.'})
          def wait(sha,phase):
              start=time.time(); last=0
              while time.time()-start<7200:
                  s,r,d=state(sha); log(f'{phase} {s} {d}')
                  if s!='pending':return s,r
                  if time.time()-last>600:signal(phase,sha,d);last=time.time()
                  time.sleep(30)
              raise RuntimeError('matrix timeout '+phase)
          def logs(r):
              out=[]
              for w in r.values():
                  if w.get('status')!='completed' or w.get('conclusion') in ('success','skipped','neutral'):continue
                  out.append(f'===== {w["name"]} {w["id"]} =====')
                  jobs=api('GET',f'/actions/runs/{w["id"]}/jobs?per_page=100').json().get('jobs',[])
                  for j in jobs:
                      if j.get('conclusion')!='failure':continue
                      try:
                          z=requests.get(f'{API}/actions/jobs/{j["id"]}/logs',headers=H,timeout=120,allow_redirects=True).content
                          if z[:2]==b'PK':
                              with zipfile.ZipFile(BytesIO(z)) as a:
                                  for n in a.namelist():out.append(a.read(n).decode(errors='replace')[-70000:])
                          else:out.append(z.decode(errors='replace')[-70000:])
                      except Exception as e:out.append(str(e))
              return '\n'.join(out)[-220000:]
          def rerun(r):
              for w in r.values():
                  if w.get('status')=='completed' and w.get('conclusion') not in ('success','skipped','neutral'):
                      try:api('POST',f'/actions/runs/{w["id"]}/rerun-failed-jobs',allow=(201,))
                      except Exception as e:log('rerun failed '+str(e))
          def implementation_ci(sha):
              for i in range(6):
                  s,r=wait(sha,f'implementation-{i+1}')
                  if s=='green':return sha,r
                  evidence=logs(r); before=status(); local_loop('EXACT-HEAD CI FAILURE:\n'+evidence)
                  if not status() and not before:
                      rerun(r);s2,r2=wait(sha,f'implementation-rerun-{i+1}')
                      if s2=='green':return sha,r2
                      local_loop('PERSISTENT CI FAILURE:\n'+logs(r2))
                  sha=commit('fix(stocks): repair C3E exact-head verification')
              raise RuntimeError('implementation CI cycles exhausted')
          def evidence(r):return {n:{'run_id':r[n]['id'],'conclusion':r[n]['conclusion'],'url':r[n]['html_url']} for n in REQUIRED}
          def execution_log():
              matches=sorted((ROOT/'docs/roadmaps').glob('*execution-log*.md'))
              return matches[0] if matches else ROOT/'docs/roadmaps/business-v2-development-execution-log-v1.md'
          def docs(isha,r):
              ev=evidence(r); hand=ROOT/'docs/roadmaps/multicurrency-stock-funding-c3e-handoff-v1.md'
              lines=['# Multi-Currency Stock Market Funding C3E Handoff v1','', '**Roadmap checkpoint:** `BUSINESS-V2-10A4C3E`  ','**Status:** `IMPLEMENTED_NOT_MERGED`  ','**Branch:** `feat/multicurrency-stock-funding-v1`  ','**Draft PR:** #676  ',f'**Exact C3E implementation SHA:** `{isha}`  ',f'**Certified predecessor C3D:** `{C3D}`  ','**Merge or deployment authorized:** No','','## Certified result','', '- The authenticated Player Stock gateway derives game and Player scope from the session and accepts only bounded public ticker, account, quote, receipt, and transaction evidence keys.','- Immediate buys use C3B quote creation followed by C3C settlement and one-to-three unique canonical Checking funding allocations.','- Immediate sells use C3D settlement and exactly one canonical Checking proceeds destination.','- Connected Player Market submissions use `buy_now` and `settle_sell`; the retired `side` / `orderType` body and unsupported limit-order/fee execution are absent.','- Listing currency is preserved through Stock reads and portfolio values are subtotaled per listing currency rather than adding unrelated currencies.','- Canonical Banking authority, replay/idempotency/conflict semantics, fail-closed price/tick/account/balance/holding/liquidity/FX validation, public-key privacy, browser accessibility, and retained Store/Banking boundaries remain enforced.','','## Exact implementation workflow evidence','']
              for n in sorted(REQUIRED,key=str.lower):lines.append(f'- `{n}` — run `{ev[n]["run_id"]}` — `{ev[n]["conclusion"]}`.')
              lines+=['','## Certification-documentation boundary','','This handoff records the immutable green implementation SHA above. The later documentation commit must itself pass a fresh exact-head matrix before C3E is reported finally certified. Its SHA and workflow evidence are recorded in PR #676 after that matrix completes; no guessed self-reference is stored here.','','## Next boundary','','`BUSINESS-V2-10A4C3F` is next authorized for final Stock certification and durable handoff convergence. C3F must not merge or deploy without separate authorization.','','## Safety','','PR #676 remains draft, open, unmerged, and undeployed. No secrets, schedulers, domains, infrastructure, staging/production SQL, or live data were changed.']
              hand.write_text('\n'.join(lines)+'\n')
              note=ROOT/'docs/roadmaps/multicurrency-stock-funding-c3e-execution-note-v1.md'; old=note.read_text(); old=re.sub(r'Status:\s*\*\*in progress; not certified\*\*','Status: **implemented and exact-head certified; not merged or deployed**',old,1); old+='\n\n## Certified completion\n\nThe connected Market adapter now accepts the C3E `buy_now` and `settle_sell` form contracts instead of requiring retired `side` / `orderType` fields. Portfolio presentation is subtotaled per listing currency. Exact implementation and workflow evidence are recorded in `multicurrency-stock-funding-c3e-handoff-v1.md`. The next authorized checkpoint is `BUSINESS-V2-10A4C3F`.\n'; note.write_text(old)
              manifest_path=ROOT/'docs/roadmaps/business-v2-current-checkpoint-v1.json'; m=json.loads(manifest_path.read_text());m.update({'status':'IMPLEMENTED_NOT_MERGED','audited_at':datetime.now(timezone.utc).isoformat(),'latest_checkpoint':'BUSINESS-V2-10A4C3E','latest_checkpoint_branch':BRANCH,'latest_checkpoint_pr':PR,'exact_implementation_sha':isha,'parent_checkpoint':'BUSINESS-V2-10A4C3D','parent_implementation_sha':C3D,'required_workflow_runs':{n:ev[n]['run_id'] for n in REQUIRED}|{'exact-head-workflow-count':len(REQUIRED)},'next_authorized_checkpoint':'BUSINESS-V2-10A4C3F','next_authorized_scope':'Final Stock certification and durable handoff convergence over the certified C3E Player API/UI cutover. No merge, deployment, scheduler/secret/domain/infrastructure change, staging/production SQL, or live-data mutation is authorized.'});m['remaining_dependency_order']=[x for x in m.get('remaining_dependency_order',[]) if x!='BUSINESS-V2-10A4C3E'];manifest_path.write_text(json.dumps(m,indent=2)+'\n')
              rec=ROOT/'docs/roadmaps/business-v2-roadmap-reconciliation-20260829.md'; rec.write_text(rec.read_text()+f'\n\n## C3E certification reconciliation — {datetime.now(timezone.utc).date()}\n\nThe current machine-readable checkpoint is now `BUSINESS-V2-10A4C3E` at exact implementation `{isha}`. Earlier C3A/C3D current-state passages above are historical snapshots; the checkpoint manifest and C3E handoff control. The next authorized checkpoint is `BUSINESS-V2-10A4C3F`. No merge or deployment is authorized.\n')
              logp=execution_log(); logp.parent.mkdir(parents=True,exist_ok=True); current=logp.read_text() if logp.exists() else '# Business V2 Development Execution Log v1\n'; logp.write_text(current+f'\n\n## BUSINESS-V2-10A4C3E — certified {datetime.now(timezone.utc).date()}\n\n- Exact implementation: `{isha}`.\n- Complete required exact-head matrix: {len(REQUIRED)} workflows green.\n- Connected `buy_now` / `settle_sell` cutover, canonical Checking funding/proceeds, public evidence privacy, and per-listing-currency portfolio subtotals certified.\n- PR #676 remains draft, open, unmerged, and undeployed.\n- Next: `BUSINESS-V2-10A4C3F`.\n')
              authp=ROOT/'docs/operations/contracts/player-cross-cutting/pr-676.json';a=json.loads(authp.read_text());
              for p in ['docs/roadmaps/multicurrency-stock-funding-c3e-handoff-v1.md',str(logp.relative_to(ROOT))]:
                  if p not in a['allowedPaths']:a['allowedPaths'].append(p)
                  if p not in a.get('requiredFiles',[]):a.setdefault('requiredFiles',[]).append(p)
              a['allowedPaths']=sorted(a['allowedPaths']);a['requiredFiles']=sorted(a['requiredFiles']);authp.write_text(json.dumps(a,indent=2)+'\n');regen();sh(['python','-m','json.tool',str(manifest_path)]);sh(['python','-m','json.tool',str(authp)]);sh(['git','diff','--check']);p=authority();
              if p.returncode:raise RuntimeError(p.stdout)
          def docs_ci(isha,ir,sha):
              for i in range(3):
                  s,r=wait(sha,f'documentation-{i+1}')
                  if s=='green':return sha,r
                  rerun(r);s2,r2=wait(sha,f'documentation-rerun-{i+1}')
                  if s2=='green':return sha,r2
                  raise RuntimeError('final documentation head has persistent failure: '+logs(r2)[-80000:])
              raise RuntimeError('docs cycles exhausted')
          def body(isha,dsha,ir,dr):
              def ls(r):return '\n'.join(f'- `{n}` — run `{r[n]["id"]}` — `{r[n]["conclusion"]}`' for n in sorted(REQUIRED,key=str.lower))
              return f'''## Roadmap checkpoint\n\n`BUSINESS-V2-10A4C3E` — authenticated Player Stock multi-currency funding cutover.\n\n## Certified identities\n\n- Certified predecessor C3D: `{C3D}`.\n- Exact certified C3E implementation: `{isha}`.\n- Final exact-head certification documentation: `{dsha}`.\n- Durable handoff: `docs/roadmaps/multicurrency-stock-funding-c3e-handoff-v1.md`.\n- Next authorized checkpoint: `BUSINESS-V2-10A4C3F`.\n\n## Certified C3E result\n\nThe connected Market adapter uses `buy_now` / `settle_sell`, canonical Banking Checking funding/proceeds, public evidence keys, server-derived scope, fail-closed C3B/C3C/C3D validation, and per-listing-currency portfolio subtotals. Unsupported limit, queued, partial-fill, margin, short, and fee-estimate behavior remains absent.\n\n## Exact implementation workflow matrix\n\n{ls(ir)}\n\n## Final documentation-head workflow matrix\n\n{ls(dr)}\n\n## Safety state\n\nPR #676 remains draft, open, unmerged, and undeployed. No merge, deployment, scheduler/secret/domain/infrastructure change, staging/production SQL, or live-data mutation was performed.\n'''
          def cleanup(msg):
