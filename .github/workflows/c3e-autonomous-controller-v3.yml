                  sh(['git','reset','--hard','HEAD']);remove_temp();
                  if status():commit('chore(ci): remove failed C3E controller bootstrap')
              except Exception as e:log('cleanup '+str(e))
              try:
                  pr=api('GET',f'/pulls/{PR}').json();b=(pr.get('body') or '').split('\n\n---\n\n### C3E controller v3 status')[0];api('PATCH',f'/pulls/{PR}',{'body':b+'\n\n---\n\n### C3E controller v3 status\nStopped without certification: `'+msg[:1500].replace('`',"'")+'`. C3D remains certified. No merge or deployment occurred.'})
              except Exception:pass
          def main():
              configure();pr=api('GET',f'/pulls/{PR}').json()
              if pr.get('state')!='open' or not pr.get('draft') or pr.get('merged') or pr['head']['ref']!=BRANCH or pr['base']['ref']!=BASE:raise RuntimeError('PR safety drift')
              remove_temp(); local_loop(); cand=commit('fix(stocks): complete C3E connected funding cutover');isha,ir=implementation_ci(cand);docs(isha,ir);dc=commit('docs(stocks): certify C3E Player funding cutover');dsha,dr=docs_ci(isha,ir,dc);api('PATCH',f'/pulls/{PR}',{'body':body(isha,dsha,ir,dr)});final=api('GET',f'/pulls/{PR}').json()
              if final.get('state')!='open' or not final.get('draft') or final.get('merged') or final['head']['sha']!=dsha:raise RuntimeError('final PR verification failed')
              result={'status':'certified','implementation_sha':isha,'documentation_sha':dsha,'implementation_runs':evidence(ir),'documentation_runs':evidence(dr),'next':'BUSINESS-V2-10A4C3F'};log(json.dumps(result,indent=2));Path('/tmp/c3e-v3-result.json').write_text(json.dumps(result,indent=2));Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('## C3E certified\n```json\n'+json.dumps(result,indent=2)+'\n```\n')
          try:main()
          except Exception as e:traceback.print_exc();cleanup(str(e));raise
          PY
          python /tmp/c3e-v3.py

      - name: Upload failure diagnostics
        if: failure()
