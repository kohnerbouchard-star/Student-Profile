name: Clean finalized CodeQL remediation branch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: codeql-remediation-cleanup-v1
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/codeql-remediation-runner' && github.event.pull_request.base.ref == 'agent/codeql-remediation-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out finalized clean branch
        uses: actions/checkout@v4
        with:
          ref: agent/codeql-remediation-clean
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Restore complete drift audit and remove generated bytecode
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main agent/codeql-remediation-clean
          git checkout origin/main -- scripts/admin-v606-full-drift-audit.mjs
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/admin-v606-full-drift-audit.mjs")
          source = path.read_text(encoding="utf-8")
          old = '  "../runtime-config.env.js", "../frontend/src/core/runtime-config.js",\n  "./auth-session-manager.js",'
          new = '  "../runtime-config.env.js", "../frontend/src/core/runtime-config.js",\n  "../frontend/src/core/admin-game-selection.js",\n  "./auth-session-manager.js",'
          if source.count(old) != 1:
              raise SystemExit("Admin script-order anchor drifted")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          rm -rf scripts/__pycache__
          git diff --check

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm --prefix backend ci

      - name: Validate cleaned branch
        shell: bash
        run: |
          set -euo pipefail
          node scripts/admin-v606-full-drift-audit.mjs
          node --test scripts/admin-game-selection-memory.test.mjs scripts/codeql-security-remediation.test.mjs scripts/local-staging-gateway-contract.test.mjs
          npm test

      - name: Commit cleaned branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: preserve complete Admin drift audit after security remediation"
          git push origin HEAD:agent/codeql-remediation-clean
