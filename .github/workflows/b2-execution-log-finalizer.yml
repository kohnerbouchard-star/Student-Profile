name: B2 execution log finalizer

on:
  push:
    branches:
      - feat/banking-fx-clearing-v1
    paths:
      - .github/workflows/b2-execution-log-finalizer.yml

permissions:
  contents: write

jobs:
  append-execution-log:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out one-shot documentation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Guard one-shot parent and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/banking-fx-clearing-v1"
          test "$(git rev-parse HEAD^)" = "82642dc7d1f899f545b5077241ccdb5cc85794ab"
          ! grep -Fq "Banking FX clearing EXACT-HEAD VERIFIED" docs/roadmaps/business-v2-development-execution-log-v1.md

      - name: Append B2 certification record
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode >> docs/roadmaps/business-v2-development-execution-log-v1.md
          git diff --check
          test "$(git diff --name-only)" = "docs/roadmaps/business-v2-development-execution-log-v1.md"

      - name: Commit documentation-only execution log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmaps/business-v2-development-execution-log-v1.md
          git commit -m "docs(business): record B2 exact-head certification"
          git push origin HEAD:feat/banking-fx-clearing-v1
