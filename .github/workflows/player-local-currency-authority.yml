name: Player Local Currency Authority

on:
  pull_request:
    paths:
      - "admin/ledger-adjustment-wiring.js"
      - "backend/supabase/functions/admin-api/playerOperations.ts"
      - "backend/supabase/functions/admin-api/playerCurrencyAuthority.test.ts"
      - "player-terminal/src/pages/store-page.js"
      - "player-terminal/tests/store-local-currency.mjs"
      - "scripts/player-local-currency-authority-contract.test.mjs"
      - ".github/workflows/player-local-currency-authority.yml"
  push:
    branches:
      - main
    paths:
      - "admin/ledger-adjustment-wiring.js"
      - "backend/supabase/functions/admin-api/playerOperations.ts"
      - "backend/supabase/functions/admin-api/playerCurrencyAuthority.test.ts"
      - "player-terminal/src/pages/store-page.js"
      - "player-terminal/tests/store-local-currency.mjs"
      - "scripts/player-local-currency-authority-contract.test.mjs"
      - ".github/workflows/player-local-currency-authority.yml"

permissions:
  contents: read

concurrency:
  group: player-local-currency-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Local wallet and Store settlement contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"

      - name: Validate currency authority source contract
        run: node --test scripts/player-local-currency-authority-contract.test.mjs

      - name: Validate Player Store local-wallet rendering
        run: node player-terminal/tests/store-local-currency.mjs
