name: Business Phase 4B Source Bundle

on:
  pull_request:
    paths:
      - ".github/workflows/business-phase4b-source-bundle.yml"

permissions:
  contents: read

jobs:
  bundle:
    if: github.event.pull_request.number == 658
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-workforce-hiring-v2
          fetch-depth: 0
      - name: Package repository source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules --exclude='**/node_modules' \
            -czf "$RUNNER_TEMP/student-profile-phase4b-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: student-profile-phase4b-source
          path: ${{ runner.temp }}/student-profile-phase4b-source.tar.gz
          if-no-files-found: error
          retention-days: 2
