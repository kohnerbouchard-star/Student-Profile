name: Business V2 Inventory Sync Once

on:
  push:
    branches:
      - refactor/business-ux-mechanics-v1

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/business-ux-mechanics-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic architecture inventory
        run: node scripts/architecture/build-architecture-inventory.mjs
      - name: Commit generated inventory when changed
        shell: bash
        run: |
          if git diff --quiet -- docs/architecture/inventories/econovaria-architecture-inventory-v2.json; then
            exit 0
          fi
          git config user.name "econovaria-ci"
          git config user.email "actions@users.noreply.github.com"
          git add docs/architecture/inventories/econovaria-architecture-inventory-v2.json
          git commit -m "Refresh deterministic architecture inventory"
          git push origin HEAD:refactor/business-ux-mechanics-v1
