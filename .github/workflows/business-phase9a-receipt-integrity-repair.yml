name: Business Phase 9A Receipt and Cost Integrity Repair

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/business-phase9a-receipt-integrity-repair.yml"
      - ".github/workflows/business-phase9a-receipt-runner-fix.yml"
      - ".github/workflows/business-phase9a-receipt-integrity-executor.yml"

permissions:
  contents: write

concurrency:
  group: business-phase9a-receipt-integrity-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 664 &&
      github.event.pull_request.head.ref == 'feat/business-store-withdrawal-safety-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Phase 9A branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/business-store-withdrawal-safety-v2
          fetch-depth: 0

      - name: Verify bounded temporary lineage
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_HEAD="9aa3595be3376069a6005e713c982705cf449883"
          git merge-base --is-ancestor "$SOURCE_HEAD" HEAD
          ALLOWED='^\.github/workflows/business-phase9a-(receipt-integrity-repair|receipt-runner-fix|receipt-integrity-executor)\.yml$'
          UNEXPECTED="$(git diff --name-only "$SOURCE_HEAD" HEAD -- . | grep -Ev "$ALLOWED" || true)"
          test -z "$UNEXPECTED" || { printf 'Unexpected temporary delta:\n%s\n' "$UNEXPECTED" >&2; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deterministic tooling
        run: |
          npm install --global npm@10.9.8
          npm ci --ignore-scripts

      - name: Execute corrected reviewed transformation
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/business-phase9a-receipt-integrity-repair.yml \
            > /tmp/business-phase9a-receipt-parent.yml
          python3 - <<'PYEXTRACT'
          from pathlib import Path

          source_path = Path('/tmp/business-phase9a-receipt-parent.yml')
          text = source_path.read_text()
          old = '''              2,
              "recorded replay receipt",
'''
          new = '''              1,
              "recorded replay receipt",
'''
          if text.count(old) != 1:
              raise SystemExit('receipt repair match-count target is not unique')
          text = text.replace(old, new, 1)
          source = text.splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 - <<'PY'")
          end = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'PY')
          body = [
              line[10:] if line.startswith('          ') else line
              for line in source[start + 1:end]
          ]
          Path('/tmp/business-phase9a-receipt-hardening.py').write_text(
              '\n'.join(body) + '\n'
          )
          PYEXTRACT
          python3 /tmp/business-phase9a-receipt-hardening.py
          git diff --check

      - name: Verify receipt and cost-integrity hardening
        shell: bash
        run: |
          set -euo pipefail
          node scripts/business-phase9-store-withdrawal-safety-contract.mjs
          node scripts/business-phase9-store-withdrawal-safety-simulation.mjs
          node --experimental-strip-types scripts/business-phase9-store-withdrawal-safety-types.mjs
          node scripts/business-phase8-store-listing-inventory-contract.mjs
          node scripts/business-phase8-store-listing-inventory-simulation.mjs
          node --experimental-strip-types scripts/business-phase8-store-listing-inventory-types.mjs
          node scripts/business-phase7-store-seller-offers-contract.mjs
          node scripts/business-phase7-store-seller-offers-simulation.mjs
          node --experimental-strip-types scripts/business-phase7-store-seller-offers-types.mjs
          node scripts/validate-supabase-migrations.mjs
          node scripts/architecture/build-architecture-inventory.mjs
          git diff --exit-code -- docs/architecture/inventories/econovaria-architecture-inventory-v2.json
          git diff --check

      - name: Commit hardening and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "econovaria-automation"
          git config user.email "econovaria-automation@users.noreply.github.com"
          git rm -f \
            .github/workflows/business-phase9a-receipt-integrity-repair.yml \
            .github/workflows/business-phase9a-receipt-runner-fix.yml \
            .github/workflows/business-phase9a-receipt-integrity-executor.yml
          git add \
            backend/supabase/migrations/20260824120000_store_offer_withdrawal_foundation_v2.sql \
            backend/supabase/migrations/20260824120010_store_offer_withdrawal_request_command_v2.sql \
            backend/supabase/migrations/20260824120020_store_offer_withdrawal_processor_v2.sql \
            backend/supabase/migrations/20260824120030_store_offer_withdrawal_assertions_v2.sql \
            scripts/business-phase9-store-withdrawal-safety-contract.mjs \
            scripts/business-phase9-store-withdrawal-safety-simulation.mjs \
            docs/architecture/inventories/econovaria-architecture-inventory-v2.json
          git diff --cached --quiet && { echo "No receipt or cost-integrity changes were produced." >&2; exit 1; }
          git commit -m "fix(store): harden withdrawal receipts and cost integrity"
          git push origin HEAD:feat/business-store-withdrawal-safety-v2
