name: Business Phase 6 Final Convergence

on:
  push:
    branches:
      - feat/business-timed-manufacturing-v2
    paths:
      - .github/workflows/business-phase6-final-convergence.yml

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact Phase 6 branch
        uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            player-terminal/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Converge direct Player Edge handlers and authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def export_handler(path_value: str, handler_name: str) -> None:
              path = Path(path_value)
              source = path.read_text()
              if f"export async function {handler_name}" in source:
                  return
              replaced = 0
              for pattern in (
                  r"Deno\.serve\(async \(request: Request\) => \{",
                  r"Deno\.serve\(async \(request\) => \{",
              ):
                  source, replaced = re.subn(
                      pattern,
                      f"export async function {handler_name}(request: Request): Promise<Response> {{",
                      source,
                      count=1,
                  )
                  if replaced:
                      break
              if replaced != 1:
                  raise SystemExit(f"Could not locate Deno.serve registration in {path_value}")
              trimmed = source.rstrip()
              if not trimmed.endswith("});"):
                  raise SystemExit(f"Unexpected runtime terminator in {path_value}")
              path.write_text(trimmed[:-3] + "}\n")

          export_handler(
              "backend/supabase/functions/player-api/runtime.ts",
              "handlePlayerApiRequest",
          )
          export_handler(
              "backend/supabase/functions/player-web-session-api/runtime.ts",
              "handlePlayerWebSessionApiRequest",
          )

          Path("backend/supabase/functions/player-api/trustedClientIpServe.ts").write_text(
              '''import { bindGatewayTrustedClientIp } from "../../../src/security/edgeGatewayClientIp.ts";\n\nexport function preparePlayerApiRequest(incomingRequest: Request): Request {\n  return bindGatewayTrustedClientIp(\n    incomingRequest,\n    Deno.env.get("ECONOVARIA_TRUSTED_CLIENT_IP_HEADER"),\n  );\n}\n'''
          )
          Path("backend/supabase/functions/player-api/index.ts").write_text(
              '''import { handlePlayerApiRequest } from "./runtime.ts";\nimport { preparePlayerApiRequest } from "./trustedClientIpServe.ts";\n\nDeno.serve((incomingRequest: Request) =>\n  handlePlayerApiRequest(preparePlayerApiRequest(incomingRequest))\n);\n'''
          )
          Path("backend/supabase/functions/player-web-session-api/trustedClientIpServe.ts").write_text(
              '''import { bindGatewayTrustedClientIp } from "../../../src/security/edgeGatewayClientIp.ts";\n\nconst MAX_MATERIALIZED_BODY_BYTES = 1_048_577;\n\nasync function materializeBoundedRequestBody(request: Request): Promise<Request> {\n  const method = request.method.toUpperCase();\n  if (request.body === null || method === "GET" || method === "HEAD" || method === "OPTIONS") return request;\n  const reader = request.body.getReader();\n  const chunks: Uint8Array[] = [];\n  let totalBytes = 0;\n  try {\n    while (true) {\n      const { done, value } = await reader.read();\n      if (done) break;\n      if (!value?.byteLength) continue;\n      const remainingBytes = MAX_MATERIALIZED_BODY_BYTES - totalBytes;\n      const chunk = value.byteLength > remainingBytes ? value.subarray(0, remainingBytes) : value;\n      chunks.push(chunk);\n      totalBytes += chunk.byteLength;\n      if (totalBytes >= MAX_MATERIALIZED_BODY_BYTES) {\n        await reader.cancel("Player request body capture limit reached").catch(() => {});\n        break;\n      }\n    }\n  } finally {\n    reader.releaseLock();\n  }\n  const body = new Uint8Array(totalBytes);\n  let offset = 0;\n  for (const chunk of chunks) {\n    body.set(chunk, offset);\n    offset += chunk.byteLength;\n  }\n  const headers = new Headers(request.headers);\n  headers.delete("content-length");\n  return new Request(request.url, { method: request.method, headers, body, signal: request.signal });\n}\n\nexport async function preparePlayerWebSessionRequest(\n  incomingRequest: Request,\n): Promise<Request> {\n  const materializedRequest = await materializeBoundedRequestBody(incomingRequest);\n  return bindGatewayTrustedClientIp(\n    materializedRequest,\n    Deno.env.get("ECONOVARIA_TRUSTED_CLIENT_IP_HEADER"),\n  );\n}\n'''
          )
          Path("backend/supabase/functions/player-web-session-api/index.ts").write_text(
              '''import { handlePlayerWebSessionApiRequest } from "./runtime.ts";\nimport { preparePlayerWebSessionRequest } from "./trustedClientIpServe.ts";\n\nDeno.serve(async (incomingRequest: Request) =>\n  handlePlayerWebSessionApiRequest(await preparePlayerWebSessionRequest(incomingRequest))\n);\n'''
          )

          authority_path = Path(
              "docs/operations/contracts/player-cross-cutting-verification-authority-v1.json"
          )
          authority = json.loads(authority_path.read_text())
          required_paths = {
              "backend/supabase/functions/_shared/playerBusinessDispatch.ts",
              "backend/supabase/functions/player-api/index.ts",
              "backend/supabase/functions/player-api/runtime.ts",
              "backend/supabase/functions/player-api/trustedClientIpServe.ts",
              "backend/supabase/functions/player-web-session-api/index.ts",
              "backend/supabase/functions/player-web-session-api/runtime.ts",
              "backend/supabase/functions/player-web-session-api/trustedClientIpServe.ts",
              "scripts/player-edge-trusted-ip-entrypoint-contract.test.mjs",
          }
          authority["allowedPaths"] = sorted(set(authority["allowedPaths"]) | required_paths)
          authority_path.write_text(json.dumps(authority, indent=2) + "\n")
          PY

      - name: Write permanent direct-entrypoint contract
        shell: bash
        run: |
          cat > scripts/player-edge-trusted-ip-entrypoint-contract.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          const definitions = [
            { name: "player-api", handler: "handlePlayerApiRequest", prepare: "preparePlayerApiRequest" },
            { name: "player-web-session-api", handler: "handlePlayerWebSessionApiRequest", prepare: "preparePlayerWebSessionRequest" },
          ];
          const isolatedBffAcceptances = [
            "scripts/business-banking-player-commerce-browser-acceptance.mjs",
            "scripts/business-banking-player-inventory-browser-acceptance.mjs",
            "scripts/player-contracts-browser-acceptance.mjs",
            "scripts/business-banking-player-market-browser-acceptance.mjs",
            "scripts/business-banking-player-business-browser-acceptance.mjs",
          ];

          for (const definition of definitions) {
            test(`${definition.name} prepares the trusted request before invoking its exported handler`, async () => {
              const root = `backend/supabase/functions/${definition.name}`;
              const entrypoint = await readFile(`${root}/index.ts`, "utf8");
              const trustedServe = await readFile(`${root}/trustedClientIpServe.ts`, "utf8");
              const runtime = await readFile(`${root}/runtime.ts`, "utf8");
              assert.match(entrypoint, /Deno\.serve\(/u);
              assert.match(entrypoint, new RegExp(definition.prepare, "u"));
              assert.match(entrypoint, new RegExp(definition.handler, "u"));
              assert.ok(entrypoint.indexOf(definition.prepare) < entrypoint.lastIndexOf(definition.handler));
              assert.doesNotMatch(entrypoint, /await import\(/u);
              assert.match(trustedServe, /bindGatewayTrustedClientIp\(/u);
              assert.match(trustedServe, /ECONOVARIA_TRUSTED_CLIENT_IP_HEADER/u);
              assert.match(runtime, new RegExp(`export async function ${definition.handler}`, "u"));
              assert.doesNotMatch(runtime, /Deno\.serve\(/u);
              assert.doesNotMatch(runtime, /raw\.githubusercontent\.com/u);
              if (definition.name === "player-web-session-api") {
                assert.match(trustedServe, /materializeBoundedRequestBody/u);
                assert.match(trustedServe, /MAX_MATERIALIZED_BODY_BYTES/u);
              }
            });
          }

          test("Player read resilience is installed once at the outer client boundary", async () => {
            const entrypoint = await readFile("backend/supabase/functions/player-web-session-api/index.ts", "utf8");
            const runtimeIntegration = await readFile("player-terminal/src/integrations/student-profile-runtime.js", "utf8");
            const helper = await readFile("player-terminal/src/integrations/student-profile-read-resilience.js", "utf8");
            const bffProxy = await readFile("api/_player-bff-proxy.js", "utf8");
            const loadAdapter = await readFile("scripts/player-runtime-load-profile.mjs", "utf8");
            assert.doesNotMatch(entrypoint, /ResilientFetch|globalThis\.fetch\s*=/u);
            assert.match(runtimeIntegration, /createStudentProfileReadResilientFetch/u);
            assert.match(runtimeIntegration, /fetchImpl: resilientFetch/u);
            assert.match(runtimeIntegration, /econovaria:player-read-resilience/u);
            assert.match(runtimeIntegration, /retriesScheduled/u);
            assert.match(helper, /new Set\(\[502, 503, 504, 546\]\)/u);
            assert.match(helper, /WorkerAlreadyRetired/u);
            assert.match(helper, /NON_RETRYABLE_503_PATTERNS/u);
            assert.match(helper, /\["GET", "HEAD"\]/u);
            assert.match(helper, /DEFAULT_MAX_ATTEMPTS = 3/u);
            assert.match(helper, /DEFAULT_MAX_RETRY_ELAPSED_MS = 3_000/u);
            assert.match(helper, /Date\.parse\(value\)/u);
            assert.match(helper, /globalThis\.crypto\.getRandomValues/u);
            assert.doesNotMatch(helper, /Math\.random/u);
            assert.match(bffProxy, /X-Econovaria-Retryable/u);
            assert.match(bffProxy, /transientWorkerFailureReason/u);
            assert.match(bffProxy, /new Date\(timestamp\)\.toUTCString\(\)/u);
            assert.match(loadAdapter, /createStudentProfileReadResilientFetch/u);
            assert.match(loadAdapter, /readRetries: playerReadRetryEvents/u);
          });

          test("connected functional journeys and load handoff use stable isolated Edge runtimes", async () => {
            const orchestrator = await readFile("scripts/business-banking-player-world-browser-acceptance.mjs", "utf8");
            const isolation = await readFile("scripts/local-edge-runtime-isolation.mjs", "utf8");
            assert.match(orchestrator, /import \{ restartLocalEdgeRuntime \}/u);
            assert.match(orchestrator, /EDGE_ISOLATION_OPTIONS = Object\.freeze\(\{ stableWaves: 3, settleMs: 1_000 \}\)/u);
            assert.match(orchestrator, /record\.edgeRuntime = await restartLocalEdgeRuntime\(EDGE_ISOLATION_OPTIONS\)/u);
            assert.match(orchestrator, /evidence\.loadHandoff = await restartLocalEdgeRuntime\(EDGE_ISOLATION_OPTIONS\)/u);
            assert.match(orchestrator, /fresh-stable-edge-runtime-per-functional-journey-and-load-handoff/u);
            for (const path of isolatedBffAcceptances) {
              const entrypoint = await readFile(path, "utf8");
              assert.match(entrypoint, /import \{ restartLocalEdgeRuntime \}/u, `${path} must import isolation`);
              const isolationCall = entrypoint.indexOf("await restartLocalEdgeRuntime()");
              const acceptanceCall = entrypoint.indexOf("await runConnectedPlayerBffAcceptance(import.meta.url)");
              assert.ok(isolationCall >= 0, `${path} must isolate the runtime`);
              assert.ok(acceptanceCall > isolationCall, `${path} must isolate before acceptance execution`);
            }
            assert.match(isolation, /docker", \["restart", containerName\]/u);
            assert.match(isolation, /DEFAULT_STABLE_WAVES = 3/u);
            assert.match(isolation, /DEFAULT_SETTLE_MS = 1_000/u);
            assert.match(isolation, /consecutiveReadyWaves/u);
            assert.match(isolation, /\/functions\/v1\/player-api/u);
            assert.match(isolation, /\/functions\/v1\/player-web-session-api/u);
            assert.match(isolation, /status === 204/u);
            assert.match(isolation, /restricted to the local acceptance gateway/u);
            assert.doesNotMatch(isolation, /sb_publishable_[A-Za-z0-9_-]{20,}/u);
          });
          EOF

      - name: Restore permanent Phase 6 verification workflow
        shell: bash
        run: |
          cat > .github/workflows/business-timed-manufacturing-v2.yml <<'EOF'
          name: Business Timed Manufacturing V2

          on:
            pull_request:
              paths:
                - "backend/supabase/migrations/2026082311*.sql"
                - "backend/src/domains/business/**"
                - "backend/src/domains/players/contracts/playerCapabilityManifestContracts*.ts"
                - "backend/src/security/playerRateLimitDispatch.ts"
                - "backend/supabase/functions/_shared/playerBusinessDispatch.ts"
                - "backend/supabase/functions/player-api/**"
                - "backend/supabase/functions/player-web-session-api/**"
                - "player-terminal/src/**"
                - "player-terminal/tests/**"
                - "scripts/business-phase6*.mjs"
                - "scripts/player-edge-trusted-ip-entrypoint-contract.test.mjs"
                - "docs/operations/contracts/player-cross-cutting-verification-authority-v1.json"
                - "docs/architecture/inventories/econovaria-architecture-inventory-v2.json"
                - "docs/roadmaps/business-phase6*.md"
                - ".github/workflows/business-*-manufacturing-*.yml"
                - ".github/workflows/business-timed-manufacturing-v2.yml"
            push:
              branches: [main]
              paths:
                - "backend/supabase/migrations/2026082311*.sql"
                - "backend/src/domains/business/**"
                - "backend/supabase/functions/player-api/**"
                - "backend/supabase/functions/player-web-session-api/**"
                - "scripts/business-phase6*.mjs"
                - ".github/workflows/business-timed-manufacturing-v2.yml"

          permissions:
            contents: read

          jobs:
            verify-manufacturing:
              runs-on: ubuntu-24.04
              timeout-minutes: 45
              steps:
                - uses: actions/checkout@v7
                  with:
                    ref: ${{ github.event.pull_request.head.sha || github.sha }}
                - uses: actions/setup-node@v7
                  with:
                    node-version: 22.23.1
                    cache: npm
                    cache-dependency-path: |
                      package-lock.json
                      backend/package-lock.json
                      player-terminal/package-lock.json
                - uses: denoland/setup-deno@v2
                  with:
                    deno-version: v2.9.3
                - run: npm install --global npm@10.9.8
                - run: npm ci --ignore-scripts
                - name: Verify timed manufacturing authority and regressions
                  run: |
                    node scripts/business-phase6-manufacturing-foundation-contract.mjs
                    node scripts/business-phase6-manufacturing-lifecycle-simulation.mjs
                    node scripts/business-phase6-manufacturing-start-contract.mjs
                    node scripts/business-phase6-manufacturing-start-simulation.mjs
                    node scripts/business-phase6-manufacturing-completion-contract.mjs
                    node scripts/business-phase6-manufacturing-completion-simulation.mjs
                    node scripts/business-phase6-manufacturing-recovery-contract.mjs
                    node scripts/business-phase6-manufacturing-recovery-simulation.mjs
                    node scripts/business-phase6e-player-api-contract.mjs
                    node --test scripts/player-edge-trusted-ip-entrypoint-contract.test.mjs
                    node scripts/business-phase5-equipment-foundation-contract.mjs
                    node scripts/business-phase5-equipment-capacity-simulation.mjs
                    node scripts/business-phase5-equipment-recipe-sync-contract.mjs
                    node scripts/business-phase5-equipment-production-contract.mjs
                    node scripts/business-phase5-equipment-production-simulation.mjs
                    node scripts/business-phase4c-production-labor-contract.mjs
                    node scripts/business-phase4c-labor-reservation-simulation.mjs
                    node scripts/business-phase4c-payroll-settlement-contract.mjs
                    node scripts/business-phase4c-payroll-simulation.mjs
                    node scripts/business-banking-runtime-contract.mjs
                    node scripts/validate-supabase-migrations.mjs
                    deno check backend/supabase/functions/player-api/index.ts
                    deno check backend/supabase/functions/player-web-session-api/index.ts
                    git diff --check
                - name: Run repository quality suite
                  run: npm test
                - name: Install backend dependencies
                  working-directory: backend
                  run: npm ci --ignore-scripts
                - name: Verify all backend and Edge TypeScript
                  working-directory: backend
                  run: npm run typecheck:all
                - name: Install Player Terminal dependencies
                  working-directory: player-terminal
                  run: npm ci --no-audit --no-fund
                - name: Verify retained Player Business surface
                  working-directory: player-terminal
                  run: |
                    npm run check
                    node tests/business-banking-surface.mjs
                    npm run adapter
                    npm run capability-manifest-current
                    npm run runtime-integration

            verify-player-edge-boot:
              runs-on: ubuntu-24.04
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v7
                  with:
                    ref: ${{ github.event.pull_request.head.sha || github.sha }}
                - uses: actions/setup-node@v7
                  with:
                    node-version: 22.23.1
                    cache: npm
                - run: npm ci --ignore-scripts
                - name: Start local Player Edge stack
                  shell: bash
                  run: |
                    set -euo pipefail
                    {
                      node -e "process.stdout.write('ECONOVARIA_RATE_LIMIT_HMAC_SECRET=' + require('node:crypto').randomBytes(48).toString('base64url') + '\n')"
                      node -e "process.stdout.write('ECONOVARIA_WEB_SESSION_ENCRYPTION_KEY=' + require('node:crypto').randomBytes(32).toString('base64url') + '\n')"
                      node -e "process.stdout.write('ECONOVARIA_PLAYER_CREDENTIAL_PEPPER=' + require('node:crypto').randomBytes(48).toString('base64url') + '\n')"
                      printf '%s\n' 'ECONOVARIA_TRUSTED_CLIENT_IP_HEADER=x-real-ip'
                    } > backend/supabase/functions/.env
                    chmod 600 backend/supabase/functions/.env
                    npx supabase start --workdir backend --exclude studio,imgproxy,storage-api,logflare,vector,supavisor,realtime,postgres-meta,mailpit
                - name: Verify Player Edge preflights
                  shell: bash
                  run: |
                    set -euo pipefail
                    eval "$(npx supabase status --workdir backend -o env)"
                    KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
                    test -n "$KEY"
                    for FUNCTION in player-api player-web-session-api; do
                      STATUS=000
                      for ATTEMPT in $(seq 1 30); do
                        STATUS="$(curl --silent --show-error --output "/tmp/${FUNCTION}.json" --write-out '%{http_code}' --max-time 5 --request OPTIONS --header "apikey: ${KEY}" "http://127.0.0.1:54321/functions/v1/${FUNCTION}" || true)"
                        test "$STATUS" = "204" && break
                        sleep 1
                      done
                      if test "$STATUS" != "204"; then
                        echo "${FUNCTION} preflight returned HTTP ${STATUS}." >&2
                        head -c 4000 "/tmp/${FUNCTION}.json" >&2 || true
                        for CONTAINER in $(docker ps --format '{{.Names}}' | grep -E 'edge_runtime|kong' || true); do
                          docker logs --since 15m "$CONTAINER" 2>&1 | tail -n 1200 >&2
                        done
                        exit 1
                      fi
                    done
                - name: Stop local stack
                  if: always()
                  run: |
                    rm -f backend/supabase/functions/.env
                    npx supabase stop --workdir backend --no-backup || true
          EOF

      - name: Remove temporary recovery artifacts
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f -name 'business-phase6-*.yml' \
            ! -name 'business-phase6-final-convergence.yml' -print -delete || true
          find scripts -maxdepth 1 -type f \( -name 'business-phase6-certification-*.mjs' -o -name 'business-phase6-convergence-*.mjs' -o -name 'business-phase6-repair-*.mjs' \) -print -delete || true
          find docs/roadmaps -maxdepth 1 -type f -name '.phase6-*' -print -delete || true
          rm -f pathlib.py sitecustomize.py

      - name: Verify exact converged source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node scripts/architecture/build-architecture-inventory.mjs
          node scripts/business-phase6e-player-api-contract.mjs
          node --test scripts/player-edge-trusted-ip-entrypoint-contract.test.mjs
          deno check backend/supabase/functions/player-api/index.ts
          deno check backend/supabase/functions/player-web-session-api/index.ts
          npm --prefix backend ci --ignore-scripts
          npm --prefix backend run typecheck:all
          npm --prefix player-terminal ci --no-audit --no-fund
          npm --prefix player-terminal run check
          npm --prefix player-terminal run adapter
          npm --prefix player-terminal run capability-manifest-current
          npm --prefix player-terminal run runtime-integration
          git diff --check

      - name: Boot both Player Edge services before commit
        shell: bash
        run: |
          set -euo pipefail
          {
            node -e "process.stdout.write('ECONOVARIA_RATE_LIMIT_HMAC_SECRET=' + require('node:crypto').randomBytes(48).toString('base64url') + '\n')"
            node -e "process.stdout.write('ECONOVARIA_WEB_SESSION_ENCRYPTION_KEY=' + require('node:crypto').randomBytes(32).toString('base64url') + '\n')"
            node -e "process.stdout.write('ECONOVARIA_PLAYER_CREDENTIAL_PEPPER=' + require('node:crypto').randomBytes(48).toString('base64url') + '\n')"
            printf '%s\n' 'ECONOVARIA_TRUSTED_CLIENT_IP_HEADER=x-real-ip'
          } > backend/supabase/functions/.env
          chmod 600 backend/supabase/functions/.env
          trap 'rm -f backend/supabase/functions/.env; npx supabase stop --workdir backend --no-backup >/dev/null 2>&1 || true' EXIT
          npx supabase start --workdir backend --exclude studio,imgproxy,storage-api,logflare,vector,supavisor,realtime,postgres-meta,mailpit
          eval "$(npx supabase status --workdir backend -o env)"
          KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          test -n "$KEY"
          for FUNCTION in player-api player-web-session-api; do
            STATUS=000
            for ATTEMPT in $(seq 1 30); do
              STATUS="$(curl --silent --show-error --output "/tmp/${FUNCTION}.json" --write-out '%{http_code}' --max-time 5 --request OPTIONS --header "apikey: ${KEY}" "http://127.0.0.1:54321/functions/v1/${FUNCTION}" || true)"
              test "$STATUS" = "204" && break
              sleep 1
            done
            if test "$STATUS" != "204"; then
              echo "${FUNCTION} preflight returned HTTP ${STATUS}." >&2
              head -c 4000 "/tmp/${FUNCTION}.json" >&2 || true
              for CONTAINER in $(docker ps --format '{{.Names}}' | grep -E 'edge_runtime|kong' || true); do
                docker logs --since 15m "$CONTAINER" 2>&1 | tail -n 1200 >&2
              done
              exit 1
            fi
          done

      - name: Commit exact convergence and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/business-phase6-final-convergence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(player): converge Phase 6 Edge runtime authority"
          git push origin HEAD:feat/business-timed-manufacturing-v2
