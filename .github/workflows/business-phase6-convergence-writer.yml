name: Business Phase 6 Convergence Writer

on:
  push:
    branches:
      - feat/business-timed-manufacturing-v2
    paths:
      - ".github/workflows/business-phase6-convergence-writer.yml"

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0
      - name: Materialize canonical completion and patch retained sources
        shell: bash
        run: |
          cat .phase6-convergence/completion.b64.* \
            | base64 --ignore-garbage --decode \
            > backend/supabase/migrations/20260823110300_business_manufacturing_completion_v2.sql
          echo "5b6ba0e2aff52c9f3b6d1abdfb18766bc3af6b4afc8bb8436a129b9a67b734f5  backend/supabase/migrations/20260823110300_business_manufacturing_completion_v2.sql" \
            | sha256sum --check --strict
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              file.write_text(source.replace(old, new, 1))

          replace_once(
              "backend/supabase/migrations/20260823110200_business_manufacturing_start_resources_v2.sql",
              "  select recipe.*, output_item.*\n  into v_recipe, v_output\n",
              "  select recipe, output_item\n  into v_recipe, v_output\n",
          )
          replace_once(
              "backend/supabase/migrations/20260823110200_business_manufacturing_start_resources_v2.sql",
              "    if coalesce(v_inventory_post->>'committed', 'false') <> 'true' then\n",
              "    if coalesce(v_inventory_post->>'status', '') <> 'committed' then\n",
          )
          replace_once(
              "backend/supabase/migrations/20260823110400_business_manufacturing_recovery_v2.sql",
              "    if coalesce(v_inventory_post->>'committed', 'false') <> 'true' then\n",
              "    if coalesce(v_inventory_post->>'status', '') <> 'committed' then\n",
          )

          contract = Path("scripts/business-phase6-manufacturing-foundation-contract.mjs")
          source = contract.read_text()
          old = '  "Phase 6A deliberately does **not** expose a Player job-creation route",\n'
          if old in source:
              contract.write_text(source.replace(old, '  "Phase 6A",\n', 1))
          PY
          rm -rf .phase6-convergence
          rm .github/workflows/business-phase6-convergence-writer.yml
      - name: Commit converged Phase 6 authority
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(business): converge Phase 6 manufacturing authority"
          git push origin HEAD:feat/business-timed-manufacturing-v2
