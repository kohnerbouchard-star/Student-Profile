name: Business Phase 6 Workflow Inventory

on:
  push:
    branches:
      - feat/business-timed-manufacturing-v2
    paths:
      - .github/workflows/business-phase6-workflow-inventory.yml

permissions:
  actions: read
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0
      - name: Inventory workflows and runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "econovaria-phase6-workflow-inventory",
          }
          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          repo = os.environ["REPOSITORY"]
          workflows_payload = get(f"https://api.github.com/repos/{repo}/actions/workflows?per_page=100")
          runs_payload = get(
              f"https://api.github.com/repos/{repo}/actions/runs?branch=feat%2Fbusiness-timed-manufacturing-v2&per_page=100"
          )
          workflows = [
              {
                  "id": item.get("id"),
                  "name": item.get("name"),
                  "path": item.get("path"),
                  "state": item.get("state"),
              }
              for item in workflows_payload.get("workflows", [])
              if "phase6" in (item.get("path") or "").lower()
              or "manufactur" in (item.get("name") or "").lower()
          ]
          runs = [
              {
                  "id": item.get("id"),
                  "name": item.get("name"),
                  "path": item.get("path"),
                  "status": item.get("status"),
                  "conclusion": item.get("conclusion"),
                  "headSha": item.get("head_sha"),
                  "event": item.get("event"),
                  "createdAt": item.get("created_at"),
                  "updatedAt": item.get("updated_at"),
                  "htmlUrl": item.get("html_url"),
              }
              for item in runs_payload.get("workflow_runs", [])
              if "phase 6" in (item.get("name") or "").lower()
              or "manufactur" in (item.get("name") or "").lower()
              or "phase6" in (item.get("path") or "").lower()
          ]
          data = {
              "schemaVersion": 1,
              "branchHead": os.popen("git rev-parse HEAD").read().strip(),
              "workflowFilesPresent": sorted(
                  str(path) for path in Path(".github/workflows").glob("*phase6*")
              ),
              "workflows": workflows,
              "runs": runs,
          }
          Path("docs/roadmaps/business-phase6-workflow-inventory-v1.json").write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n"
          )
          PY
          rm .github/workflows/business-phase6-workflow-inventory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(business): inventory Phase 6 workflow state"
          git push origin HEAD:feat/business-timed-manufacturing-v2
