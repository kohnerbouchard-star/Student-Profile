name: C3E Architecture Inventory Sync

on:
  push:
    branches:
      - feat/multicurrency-stock-funding-v1

permissions:
  contents: write

concurrency:
  group: c3e-architecture-inventory-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"

      - name: Generate canonical architecture inventory
        run: node scripts/architecture/build-architecture-inventory.mjs

      - name: Commit generated inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/inventories/econovaria-architecture-inventory-v2.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(architecture): refresh C3E inventory"
          git push origin "HEAD:${GITHUB_REF_NAME}"
