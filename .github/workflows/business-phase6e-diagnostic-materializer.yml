name: Business Phase 6E Diagnostic Materializer

on:
  push:
    branches:
      - feat/business-timed-manufacturing-v2
    paths:
      - .github/workflows/business-phase6e-diagnostic-materializer.yml

permissions:
  contents: write

concurrency:
  group: business-phase6e-diagnostic-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1

      - name: Apply source and persist exact outcome
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/business-timed-manufacturing-v2
          git reset --hard origin/feat/business-timed-manufacturing-v2

          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import re

          workflow = Path('.github/workflows/business-phase6e-cutover.yml').read_text()
          match = re.search(
              r'PHASE6E_PATCH_GZIP_BASE64:\s*>-\s*\n\s*([A-Za-z0-9+/=]+)\s*\n\s*shell:',
              workflow,
              re.MULTILINE,
          )
          if not match:
              raise SystemExit('Phase 6E payload was not found in the canonical launcher.')
          source = gzip.decompress(base64.b64decode(match.group(1)))
          digest = hashlib.sha256(source).hexdigest()
          expected = '1169570ebc7bee657159393e80b51efc6aac13f3389346e712bb66a9d738b98c'
          if digest != expected:
              raise SystemExit(f'Phase 6E payload digest mismatch: {digest}')
          Path('/tmp/phase6e_cutover.py').write_bytes(source)
          PY

          set +e
          python3 /tmp/phase6e_cutover.py > /tmp/phase6e-materialize.log 2>&1
          PATCH_STATUS=$?
          set -e

          if [ "$PATCH_STATUS" -ne 0 ]; then
            git reset --hard origin/feat/business-timed-manufacturing-v2
            rm -f \
              .github/workflows/business-phase6e-cutover.yml \
              .github/workflows/business-phase6e-commit-source.yml \
              .github/workflows/business-phase6e-diagnostic-materializer.yml \
              .github/workflows/business-phase6e-inspection.yml \
              docs/roadmaps/.phase6e-inspection.json
            {
              echo "Phase 6E source materialization failed before a permanent source commit."
              echo "Patch exit code: $PATCH_STATUS"
              echo
              sed -n '1,260p' /tmp/phase6e-materialize.log
            } > docs/roadmaps/.phase6e-materialization-diagnostic.txt
            git add -A
            git diff --cached --check
            git commit -m "chore(business): capture Phase 6E materialization failure"
            git push origin HEAD:feat/business-timed-manufacturing-v2
            exit 0
          fi

          set +e
          {
            node scripts/architecture/build-architecture-inventory.mjs
            node scripts/business-phase6e-player-api-contract.mjs
            node scripts/validate-supabase-migrations.mjs
            git diff --check
          } >> /tmp/phase6e-materialize.log 2>&1
          VERIFY_STATUS=$?
          set -e

          rm -f \
            .github/workflows/business-phase6e-cutover.yml \
            .github/workflows/business-phase6e-commit-source.yml \
            .github/workflows/business-phase6e-diagnostic-materializer.yml \
            .github/workflows/business-phase6e-inspection.yml \
            docs/roadmaps/.phase6e-inspection.json

          if [ "$VERIFY_STATUS" -ne 0 ]; then
            {
              echo "Phase 6E source was materialized, but focused verification failed."
              echo "Verification exit code: $VERIFY_STATUS"
              echo
              sed -n '1,320p' /tmp/phase6e-materialize.log
            } > docs/roadmaps/.phase6e-materialization-diagnostic.txt
            COMMIT_MESSAGE="wip(business): materialize Phase 6E cutover for repair"
          else
            rm -f docs/roadmaps/.phase6e-materialization-diagnostic.txt
            COMMIT_MESSAGE="feat(business): cut over Player timed manufacturing"
          fi

          git add -A
          git diff --cached --check
          git commit -m "$COMMIT_MESSAGE"
          git push origin HEAD:feat/business-timed-manufacturing-v2
