name: Business Equipment Capacity V2

on:
  pull_request:
    paths:
      - "backend/supabase/migrations/2026082310*.sql"
      - "scripts/business-phase5-equipment-*.mjs"
      - "docs/roadmaps/business-phase5-equipment-capacity-scope-v1.md"
      - ".github/workflows/business-equipment-capacity-v2.yml"
  push:
    branches: [main]
    paths:
      - "backend/supabase/migrations/2026082310*.sql"
      - "scripts/business-phase5-equipment-*.mjs"
      - ".github/workflows/business-equipment-capacity-v2.yml"

permissions:
  contents: write

jobs:
  verify-equipment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            player-terminal/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3
      - run: npm install --global npm@10.9.8
      - run: npm ci --ignore-scripts
      - name: Verify canonical equipment authority and deterministic capacity
        run: |
          node scripts/business-phase5-equipment-foundation-contract.mjs
          node scripts/business-phase5-equipment-capacity-simulation.mjs
          node scripts/business-phase5-equipment-recipe-sync-contract.mjs
          node scripts/business-phase5-equipment-production-contract.mjs
          node scripts/business-phase5-equipment-production-simulation.mjs
          node scripts/business-phase4c-production-labor-contract.mjs
          node scripts/business-phase4c-labor-reservation-simulation.mjs
          node scripts/business-phase4c-payroll-settlement-contract.mjs
          node scripts/business-phase4c-payroll-simulation.mjs
          node scripts/business-workforce-payroll-foundation-contract.mjs
          node scripts/business-workforce-hiring-contract.mjs
          node scripts/business-banking-runtime-contract.mjs
          node scripts/validate-supabase-migrations.mjs
          git diff --check
      - name: Run repository quality suite
        run: npm test
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Verify all backend and Edge TypeScript
        working-directory: backend
        run: npm run typecheck:all
      - name: Install Player Terminal dependencies
        working-directory: player-terminal
        run: npm ci --no-audit --no-fund
      - name: Verify retained Player Business surface
        working-directory: player-terminal
        run: |
          npm run check
          node tests/business-banking-surface.mjs
          npm run adapter
          npm run capability-manifest-current
          npm run runtime-integration

  certify-phase5:
    if: github.actor != 'github-actions[bot]'
    needs: verify-equipment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact Phase 5 head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Append durable Phase 5 certification
        shell: bash
        run: |
          if ! grep -q "Phase 5 COMPLETE: canonical equipment capacity" docs/roadmaps/business-v2-development-execution-log-v1.md; then
            cat docs/roadmaps/.business-phase5-certification-fragment.md >> docs/roadmaps/business-v2-development-execution-log-v1.md
          fi
          rm -f docs/roadmaps/.business-phase5-certification-fragment.md
          rm -f .github/workflows/business-phase5-certification-writer.yml
      - name: Commit durable certification
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No certification changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmaps/business-v2-development-execution-log-v1.md docs/roadmaps/.business-phase5-certification-fragment.md .github/workflows/business-phase5-certification-writer.yml
          git commit -m "docs(business): certify Phase 5 equipment capacity"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
