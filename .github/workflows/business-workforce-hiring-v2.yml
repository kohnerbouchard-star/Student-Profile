name: Business Workforce Hiring V2

on:
  pull_request:
    paths:
      - "backend/src/domains/business/**"
      - "backend/src/domains/business-banking/**"
      - "backend/src/domains/players/contracts/playerCapabilityManifestContracts.ts"
      - "backend/src/security/playerRateLimitDispatch.ts"
      - "backend/supabase/functions/classroom-api/index.ts"
      - "backend/supabase/migrations/20260822*.sql"
      - "player-terminal/src/api/**"
      - "player-terminal/src/data/empty-read-models.js"
      - "player-terminal/src/pages/business*.js"
      - "player-terminal/tests/business-banking-surface.mjs"
      - "scripts/business-workforce-hiring-contract.mjs"
      - "scripts/business-banking-runtime-contract.mjs"
      - "docs/operations/contracts/button-action-coverage-v1.json"
      - ".github/workflows/business-workforce-hiring-v2.yml"
  push:
    branches: [main]
    paths:
      - "backend/src/domains/business/**"
      - "backend/src/domains/business-banking/**"
      - "backend/src/domains/players/contracts/playerCapabilityManifestContracts.ts"
      - "backend/src/security/playerRateLimitDispatch.ts"
      - "backend/supabase/functions/classroom-api/index.ts"
      - "backend/supabase/migrations/20260822*.sql"
      - "player-terminal/src/api/**"
      - "player-terminal/src/data/empty-read-models.js"
      - "player-terminal/src/pages/business*.js"
      - "player-terminal/tests/business-banking-surface.mjs"
      - "scripts/business-workforce-hiring-contract.mjs"
      - "scripts/business-banking-runtime-contract.mjs"
      - "docs/operations/contracts/button-action-coverage-v1.json"
      - ".github/workflows/business-workforce-hiring-v2.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  converge-edge-authority:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 658
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FEATURE_BRANCH: feat/business-workforce-hiring-v2
      BASE_BRANCH: feat/business-workforce-payroll-foundation-v2
    steps:
      - name: Check out exact Phase 4B branch
        uses: actions/checkout@v7
        with:
          ref: feat/business-workforce-hiring-v2
          fetch-depth: 0

      - name: Capture starting head
        id: start
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Converge Edge dispatch and Phase 4A/4B assertions
        env:
          START_SHA: ${{ steps.start.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one marker in {path}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          runtime = "backend/supabase/functions/player-api/runtime.ts"
          replace_once(
              runtime,
              '''      businessStorePurchase: "storePurchase",
      businessProduction: "businessProduction",''',
              '''      businessStorePurchase: "storePurchase",
      businessCandidateHire: "businessCandidateHire",
      businessProduction: "businessProduction",''',
          )
          replace_once(
              runtime,
              '      businessHire: "businessHire",',
              '      businessHire: "businessRetiredHire",',
          )

          contract = "scripts/business-workforce-payroll-foundation-contract.mjs"
          replace_once(
              contract,
              '''// Phase 4A is intentionally additive. These assertions keep the remaining
// Phase 4B cutover debt explicit rather than silently claiming it is solved.
assert.match(
  liveMutation,
  /case "businessHire"[\\s\\S]{0,1800}p_role_name[\\s\\S]{0,600}p_wage_per_cycle[\\s\\S]{0,600}p_productivity_index/u,
);
assert.match(
  liveValidation,
  /businessHire:[\\s\\S]{0,500}"wagePerCycle"[\\s\\S]{0,200}"productivityIndex"/u,
);''',
              '''// Phase 4B retires browser-authored employee economics while retaining a
// bounded compatibility request shape so authenticated callers receive stable 410.
assert.doesNotMatch(liveMutation, /case "businessHire"/u);
assert.match(
  liveValidation,
  /businessCandidateHire:[\\s\\S]{0,220}"businessKey"[\\s\\S]{0,220}"idempotencyKey"/u,
);
assert.match(
  liveValidation,
  /businessHire:[\\s\\S]{0,500}"wagePerCycle"[\\s\\S]{0,200}"productivityIndex"/u,
);''',
          )
          replace_once(
              contract,
              '"Business Phase 4A workforce/payroll authority foundation passed; live hiring, production labor charging, and payroll settlement cutover remain explicitly deferred.",',
              '"Business workforce/payroll foundation and Phase 4B hiring cutover passed; production labor charging and payroll settlement remain explicitly deferred.",',
          )

          authority_path = Path(
              "docs/operations/contracts/player-cross-cutting-verification-authority-v1.json"
          )
          authority = json.loads(authority_path.read_text(encoding="utf-8"))
          required_path = "scripts/business-workforce-payroll-foundation-contract.mjs"
          if required_path not in authority["allowedPaths"]:
              authority["allowedPaths"].append(required_path)
          authority_path.write_text(json.dumps(authority, indent=2) + "\n", encoding="utf-8")
          PY
          git show "$START_SHA^:.github/workflows/business-workforce-hiring-v2.yml" \
            > .github/workflows/business-workforce-hiring-v2.yml
          rm -f .github/workflows/business-phase4b-edge-converge.yml

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm --prefix backend ci --ignore-scripts

      - name: Verify exact repaired tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_BRANCH"
          git diff --name-only "origin/$BASE_BRANCH" -- \
            > /tmp/player-terminal-changed-files.txt
          npm --prefix backend run typecheck:all
          node scripts/business-workforce-payroll-foundation-contract.mjs
          node scripts/business-workforce-payroll-scope-hardening-contract.mjs
          node scripts/business-workforce-hiring-contract.mjs
          node scripts/business-banking-runtime-contract.mjs
          node --test scripts/player-cross-cutting-authority.test.mjs
          node scripts/verify-player-cross-cutting-authority.mjs \
            --changed-files /tmp/player-terminal-changed-files.txt \
            --pr-number 658 \
            --base-ref "$BASE_BRANCH"
          node scripts/validate-supabase-migrations.mjs
          git diff --check

      - name: Commit exact tested tree
        env:
          START_SHA: ${{ steps.start.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$FEATURE_BRANCH"
          test "$(git rev-parse origin/$FEATURE_BRANCH)" = "$START_SHA"
          git config user.name econovaria-phase4b-edge-converger
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "fix(business): converge Phase 4B Edge authority"
          git push origin HEAD:"$FEATURE_BRANCH"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            player-terminal/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3
      - run: npm install --global npm@10.9.8
      - run: npm ci --ignore-scripts
      - name: Validate Phase 4B authority and migrations
        run: |
          node scripts/business-workforce-hiring-contract.mjs
          node scripts/business-banking-runtime-contract.mjs
          node scripts/validate-supabase-migrations.mjs
          node scripts/architecture/build-architecture-inventory.mjs
          git diff --exit-code -- docs/architecture/inventories/econovaria-architecture-inventory-v2.json
      - name: Run repository quality
        run: npm test
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Verify backend candidate hiring
        working-directory: backend
        run: |
          npm run typecheck
          deno test --config supabase/functions/classroom-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            src/domains/business/api/playerBusinessWorkforceHiring.test.ts \
            src/domains/business/api/playerBusinessRoutePaths.test.ts
      - name: Install Player Terminal dependencies
        working-directory: player-terminal
        run: npm ci --no-audit --no-fund
      - name: Verify Player candidate market
        working-directory: player-terminal
        run: |
          npm run check
          node tests/business-banking-surface.mjs
          npm run adapter
          npm run capability-manifest-current
          npm run runtime-integration
