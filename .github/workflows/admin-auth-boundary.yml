name: Admin Auth Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/admin-auth-boundary.yml"
      - "admin/auth-session-manager.js"
      - "admin/session-gate.js"
      - "backend/src/domains/auth/api/staffBootstrapHttpHandler.ts"
      - "backend/src/domains/auth/api/staffLoginHttpHandler.ts"
      - "backend/src/domains/auth/api/staffSignupCancelHttpHandler.ts"
      - "backend/src/domains/auth/api/staffSignupHttpHandler.ts"
      - "backend/src/domains/auth/api/staffSignupResendHttpHandler.ts"
      - "backend/src/domains/auth/application/staffSignupSupabaseLink.ts"
      - "backend/src/domains/auth/application/staffSignupVerificationEmail.ts"
      - "backend/src/domains/licensing/**"
      - "backend/src/platform/supabase/edgeStaffSession.ts"
      - "backend/src/security/edgeGatewayClientIp.ts"
      - "backend/src/security/rateLimitKeying.ts"
      - "backend/supabase/config.toml"
      - "backend/supabase/functions/admin-api/adminSecurityGuard.ts"
      - "backend/supabase/functions/admin-api/gameProvisioningOperations.ts"
      - "backend/supabase/functions/admin-email-verification/**"
      - "backend/supabase/functions/staff-mfa-api/index.ts"
      - "backend/supabase/migrations/2026073113*.sql"
      - "frontend/src/core/api.js"
      - "frontend/src/core/login.js"
      - "index.html"
      - "scripts/verified-staff-onboarding-contract.test.mjs"
      - "backend/supabase/functions/admin-api/progressionRateLimit.ts"
      - "backend/supabase/functions/admin-api/progressionRateLimit.contract.test.ts"
      - "scripts/admin-session-manager-smoke.mjs"
      - "scripts/admin-auth-session-resilience-smoke.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/admin-auth-boundary.yml"
      - "admin/auth-session-manager.js"
      - "admin/session-gate.js"
      - "backend/src/domains/auth/api/staffBootstrapHttpHandler.ts"
      - "backend/src/domains/auth/api/staffLoginHttpHandler.ts"
      - "backend/src/domains/auth/api/staffSignupCancelHttpHandler.ts"
      - "backend/src/domains/auth/api/staffSignupHttpHandler.ts"
      - "backend/src/domains/auth/api/staffSignupResendHttpHandler.ts"
      - "backend/src/domains/auth/application/staffSignupSupabaseLink.ts"
      - "backend/src/domains/auth/application/staffSignupVerificationEmail.ts"
      - "backend/src/domains/licensing/**"
      - "backend/src/platform/supabase/edgeStaffSession.ts"
      - "backend/src/security/edgeGatewayClientIp.ts"
      - "backend/src/security/rateLimitKeying.ts"
      - "backend/supabase/config.toml"
      - "backend/supabase/functions/admin-api/adminSecurityGuard.ts"
      - "backend/supabase/functions/admin-api/gameProvisioningOperations.ts"
      - "backend/supabase/functions/admin-email-verification/**"
      - "backend/supabase/functions/staff-mfa-api/index.ts"
      - "backend/supabase/migrations/2026073113*.sql"
      - "frontend/src/core/api.js"
      - "frontend/src/core/login.js"
      - "index.html"
      - "scripts/verified-staff-onboarding-contract.test.mjs"
      - "backend/supabase/functions/admin-api/progressionRateLimit.ts"
      - "backend/supabase/functions/admin-api/progressionRateLimit.contract.test.ts"
      - "scripts/admin-session-manager-smoke.mjs"
      - "scripts/admin-auth-session-resilience-smoke.mjs"

permissions:
  contents: read

concurrency:
  group: admin-auth-boundary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact proposed source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"

      - name: Verify Admin session manager baseline
        run: node scripts/admin-session-manager-smoke.mjs

      - name: Verify Admin outage and retry semantics
        run: node scripts/admin-auth-session-resilience-smoke.mjs

      - name: Verify confirmed onboarding lifecycle
        run: node --test scripts/verified-staff-onboarding-contract.test.mjs

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Typecheck Admin trusted-IP boundary
        working-directory: backend
        run: |
          deno check --config supabase/functions/admin-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            supabase/functions/admin-api/progressionRateLimit.ts

      - name: Verify Admin trusted-IP contracts
        working-directory: backend
        run: |
          deno test --config supabase/functions/admin-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            supabase/functions/admin-api/progressionRateLimit.contract.test.ts

      - name: Reject malformed diffs
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
