name: Production Admin API Join Code Read Hotfix

on:
  push:
    branches:
      - main
    paths:
      - docs/operations/evidence/production-admin-api-join-code-read-hotfix-v1.json

permissions:
  contents: read

concurrency:
  group: production-admin-api-join-code-read-v1
  cancel-in-progress: false

env:
  AUTHORIZATION_PATH: docs/operations/evidence/production-admin-api-join-code-read-hotfix-v1.json
  EXPECTED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  DENIED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  FUNCTION_NAME: admin-api
  SOURCE_COMMIT: d28c98db96e6468c2a328a68529446c80ad50a0e
  EXPECTED_BEFORE_VERSION: "23"
  EXPECTED_BEFORE_DIGEST: 38e0edb0dbfe0988755edb6b28c785c4b725d03e72d4e54d9997edf37b877b55
  EXPECTED_INDEX_BLOB: 0a5e81671aac07a5287bc965b585f8fd87c57c13
  EXPECTED_GAME_ROUTES_BLOB: 52346ede2340a6f918cb5a84ea5a91d242835359
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  deploy:
    name: Deploy bounded join-code read route
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Enforce merged-main production scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$EXPECTED_PRODUCTION_PROJECT_REF" != "$DENIED_STAGING_PROJECT_REF"
          test "$FUNCTION_NAME" = "admin-api"

      - name: Check out exact authorization commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify merged authorization contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$AUTHORIZATION_PATH"
          git diff --name-only "${{ github.event.before }}" "$GITHUB_SHA" | grep -Fx "$AUTHORIZATION_PATH"
          node - <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.env.AUTHORIZATION_PATH, 'utf8'));
          const failures = [];
          if (value.schemaVersion !== 'econovaria.production-admin-api-join-code-read-hotfix.v1') failures.push('schemaVersion');
          if (value.targetProjectRef !== process.env.EXPECTED_PRODUCTION_PROJECT_REF) failures.push('targetProjectRef');
          if (value.deniedProjectRef !== process.env.DENIED_STAGING_PROJECT_REF) failures.push('deniedProjectRef');
          if (value.functionName !== process.env.FUNCTION_NAME) failures.push('functionName');
          if (String(value.expectedBeforeVersion) !== process.env.EXPECTED_BEFORE_VERSION) failures.push('expectedBeforeVersion');
          if (value.expectedBeforeDigest !== process.env.EXPECTED_BEFORE_DIGEST) failures.push('expectedBeforeDigest');
          if (value.sourceCommit !== process.env.SOURCE_COMMIT) failures.push('sourceCommit');
          if (value.databaseMigrationsAllowed !== false) failures.push('databaseMigrationsAllowed');
          if (value.otherFunctionsAllowed !== false) failures.push('otherFunctionsAllowed');
          if (value.verifyJwtRequired !== true) failures.push('verifyJwtRequired');
          if (!Array.isArray(value.scope) || value.scope.length !== 1 || value.scope[0] !== 'authenticated owner-scoped GET join-code read') failures.push('scope');
          if (failures.length) throw new Error(`Authorization mismatch: ${failures.join(', ')}`);
          NODE

      - name: Check out exact production-era source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git hash-object backend/supabase/functions/admin-api/index.ts)" = "$EXPECTED_INDEX_BLOB"
          test "$(git hash-object backend/supabase/functions/admin-api/gameRoutes.ts)" = "$EXPECTED_GAME_ROUTES_BLOB"

      - name: Verify current production function identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/functions-before.json"
          FUNCTIONS_PATH="$RUNNER_TEMP/functions-before.json" node - <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync(process.env.FUNCTIONS_PATH, 'utf8'));
          const rows = Array.isArray(parsed) ? parsed : (parsed.functions || []);
          const row = rows.find((entry) => entry.slug === process.env.FUNCTION_NAME);
          if (!row) throw new Error('Production admin-api is missing.');
          if (String(row.version) !== process.env.EXPECTED_BEFORE_VERSION) throw new Error(`Unexpected production version: ${row.version}`);
          if (row.ezbr_sha256 !== process.env.EXPECTED_BEFORE_DIGEST) throw new Error('Production admin-api digest drifted.');
          if (row.verify_jwt !== true || row.status !== 'ACTIVE') throw new Error('Production admin-api security metadata is invalid.');
          NODE

      - name: Apply the single-route patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("backend/supabase/functions/admin-api/gameRoutes.ts")
          source = path.read_text()
          marker = '  if (suffix === "/dashboard") {'
          if source.count(marker) != 1:
              raise SystemExit("Expected route insertion marker was not found exactly once.")

          route = '''  if (suffix === "/join-code/reset") {
            const result = await context.service.from("game_sessions")
              .select("game_join_code,game_join_code_status,updated_at")
              .eq("id", gameId)
              .eq("owner_staff_user_id", context.staff.id)
              .maybeSingle();
            if (result.error) throw result.error;
            const row = result.data;
            if (
              !row?.game_join_code ||
              row.game_join_code_status !== "active" ||
              !row.updated_at
            ) {
              return json(request, 409, {
                code: "join_code_not_available",
                message:
                  "This game does not have a persisted readable code yet. Rotate it once to create one.",
              });
            }
            return json(request, 200, {
              ok: true,
              gameSession: {
                id: gameId,
                name: game.name,
              },
              joinCode: {
                gameJoinCode: row.game_join_code,
                status: row.game_join_code_status,
                updatedAt: row.updated_at,
              },
            });
          }

          '''
          path.write_text(source.replace(marker, route + marker, 1))
          PY

      - name: Verify bounded patch scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only)" = "backend/supabase/functions/admin-api/gameRoutes.ts"
          grep -q 'suffix === "/join-code/reset"' backend/supabase/functions/admin-api/gameRoutes.ts
          grep -q 'join_code_not_available' backend/supabase/functions/admin-api/gameRoutes.ts
          grep -q 'owner_staff_user_id' backend/supabase/functions/admin-api/gameRoutes.ts
          grep -q 'request.method === "POST"' backend/supabase/functions/admin-api/gameRoutes.ts
          git diff --check

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Deploy only production admin-api
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"
          supabase functions deploy "$FUNCTION_NAME" \
            --workdir backend \
            --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF" \
            --use-api

      - name: Verify deployed function metadata and source marker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/functions" \
              > "$RUNNER_TEMP/functions-after.json"
            if FUNCTIONS_PATH="$RUNNER_TEMP/functions-after.json" node - <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync(process.env.FUNCTIONS_PATH, 'utf8'));
          const rows = Array.isArray(parsed) ? parsed : (parsed.functions || []);
          const row = rows.find((entry) => entry.slug === process.env.FUNCTION_NAME);
          if (!row) process.exit(1);
          if (Number(row.version) <= Number(process.env.EXPECTED_BEFORE_VERSION)) process.exit(1);
          if (row.ezbr_sha256 === process.env.EXPECTED_BEFORE_DIGEST) process.exit(1);
          if (row.verify_jwt !== true || row.status !== 'ACTIVE') process.exit(1);
          NODE
            then
              break
            fi
            sleep 3
          done

          FUNCTIONS_PATH="$RUNNER_TEMP/functions-after.json" node - <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync(process.env.FUNCTIONS_PATH, 'utf8'));
          const rows = Array.isArray(parsed) ? parsed : (parsed.functions || []);
          const row = rows.find((entry) => entry.slug === process.env.FUNCTION_NAME);
          if (!row || Number(row.version) <= Number(process.env.EXPECTED_BEFORE_VERSION)) throw new Error('Production admin-api version did not advance.');
          if (row.ezbr_sha256 === process.env.EXPECTED_BEFORE_DIGEST) throw new Error('Production admin-api digest did not change.');
          if (row.verify_jwt !== true || row.status !== 'ACTIVE') throw new Error('Production admin-api security metadata changed unexpectedly.');
          console.log(`admin-api version ${row.version}; verify_jwt=true; status=ACTIVE`);
          NODE

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/functions/$FUNCTION_NAME/body" \
            > "$RUNNER_TEMP/function-body.json"
          grep -q 'join_code_not_available' "$RUNNER_TEMP/function-body.json"
          grep -q 'game_join_code,game_join_code_status,updated_at' "$RUNNER_TEMP/function-body.json"
          rm -f \
            "$RUNNER_TEMP/functions-before.json" \
            "$RUNNER_TEMP/functions-after.json" \
            "$RUNNER_TEMP/function-body.json"

      - name: Record bounded release result
        shell: bash
        run: |
          {
            echo "### Production Admin API join-code read hotfix"
            echo ""
            echo "- Target project: production ref bound and staging denied"
            echo "- Function changed: admin-api only"
            echo "- Baseline source: $SOURCE_COMMIT"
            echo "- Baseline version: $EXPECTED_BEFORE_VERSION"
            echo "- JWT verification: enabled"
            echo "- Database migrations: none"
            echo "- Added behavior: authenticated owner-scoped GET join-code read"
          } >> "$GITHUB_STEP_SUMMARY"
