name: Production Web Session Deploy

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Successful staging candidate workflow run ID"
        required: true
        type: string
      source_commit:
        description: "Exact merged main source commit"
        required: true
        type: string
      source_sha256:
        description: "Immutable backend source artifact SHA-256"
        required: true
        type: string
      candidate_digest:
        description: "Verified staging candidate Edge Function digest"
        required: true
        type: string
      confirm_project_ref:
        description: "Type the exact production project ref"
        required: true
        type: string
      confirm_action:
        description: "Type DEPLOY WEB SESSION API"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-web-session-deploy
  cancel-in-progress: false

env:
  AUTHORIZATION_PATH: docs/operations/evidence/production-web-session-recovery-v1.json
  EXPECTED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  DENIED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  FUNCTION_NAME: web-session-api
  CANDIDATE_FUNCTION_NAME: web-session-api
  PRODUCTION_ORIGIN: https://econovaria.vercel.app
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  deploy:
    name: Deploy and verify production web-session-api
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Enforce explicit production authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "${{ inputs.confirm_project_ref }}" = "$EXPECTED_PRODUCTION_PROJECT_REF"
          test "${{ inputs.confirm_action }}" = "DEPLOY WEB SESSION API"
          test "$EXPECTED_PRODUCTION_PROJECT_REF" != "$DENIED_STAGING_PROJECT_REF"
          test "$FUNCTION_NAME" = "$CANDIDATE_FUNCTION_NAME"
          [[ "${{ inputs.source_commit }}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${{ inputs.source_sha256 }}" =~ ^[a-f0-9]{64}$ ]]
          [[ "${{ inputs.candidate_digest }}" =~ ^[a-f0-9]{64}$ ]]
          [[ "${{ inputs.candidate_run_id }}" =~ ^[0-9]+$ ]]

      - name: Check out exact merged main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source is current main history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_commit }}"
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor HEAD origin/main
          test -f "$AUTHORIZATION_PATH"

      - name: Download exact staging-verified artifact
        uses: actions/download-artifact@v8
        with:
          name: production-web-session-${{ inputs.source_commit }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/production-web-session

      - name: Verify artifact tree matches exact tracked source
        shell: bash
        run: |
          set -euo pipefail
          expected_dir="$RUNNER_TEMP/expected-backend-tree"
          artifact_dir="$RUNNER_TEMP/artifact-backend-tree"
          expected_tar="$RUNNER_TEMP/expected-backend-canonical.tar"
          artifact_tar="$RUNNER_TEMP/artifact-backend-canonical.tar"
          mkdir -p "$expected_dir" "$artifact_dir"
          git archive \
            --format=tar \
            "${{ inputs.source_commit }}" \
            backend | tar -xf - -C "$expected_dir"
          tar -xzf dist/production-web-session/backend-source.tgz -C "$artifact_dir"
          test -f "$expected_dir/backend/supabase/functions/web-session-api/index.ts"
          test -f "$artifact_dir/backend/supabase/functions/web-session-api/index.ts"
          tar \
            --sort=name \
            --mtime='@0' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --format=gnu \
            -cf "$expected_tar" \
            -C "$expected_dir" \
            backend
          tar \
            --sort=name \
            --mtime='@0' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --format=gnu \
            -cf "$artifact_tar" \
            -C "$artifact_dir" \
            backend
          cmp --silent "$expected_tar" "$artifact_tar"
          rm -rf \
            "$expected_dir" \
            "$artifact_dir" \
            "$expected_tar" \
            "$artifact_tar"

      - name: Verify artifact identity and authorization
        shell: bash
        run: |
          set -euo pipefail
          cd dist/production-web-session
          sha256sum --check backend-source.tgz.sha256
          actual_sha="$(sha256sum backend-source.tgz | awk '{print $1}')"
          test "$actual_sha" = "${{ inputs.source_sha256 }}"
          SOURCE_COMMIT="${{ inputs.source_commit }}" \
          SOURCE_SHA="$actual_sha" \
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('build-manifest.json', 'utf8'));
          const authorization = JSON.parse(fs.readFileSync('authorization.json', 'utf8'));
          const expected = {
            sourceCommit: process.env.SOURCE_COMMIT,
            sourceRef: 'refs/heads/main',
            sourceSha256: process.env.SOURCE_SHA,
            sourceFunctionName: process.env.FUNCTION_NAME,
            candidateFunctionName: process.env.CANDIDATE_FUNCTION_NAME,
            stagingProjectRef: process.env.DENIED_STAGING_PROJECT_REF,
            deniedProductionProjectRef: process.env.EXPECTED_PRODUCTION_PROJECT_REF,
            verifyJwt: false,
            trackedGitTreeOnly: true,
            repositoryLocalModuleGraph: true,
            privateRemoteImports: false,
            dataUrlImports: false,
            identicalFunctionIdentityAcrossEnvironments: true,
          };
          for (const [key, value] of Object.entries(expected)) {
            if (manifest[key] !== value) throw new Error(`Build manifest mismatch: ${key}`);
          }
          if (
            authorization.targetProjectRef !== process.env.EXPECTED_PRODUCTION_PROJECT_REF ||
            !authorization.deniedProjectRefs?.includes(process.env.DENIED_STAGING_PROJECT_REF) ||
            authorization.functionName !== process.env.FUNCTION_NAME ||
            authorization.stagingFunctionName !== process.env.FUNCTION_NAME ||
            authorization.verifyJwt !== false ||
            authorization.customAuthenticationRequired !== true ||
            authorization.otherFunctionsAllowed !== false ||
            authorization.productionDataWritesAllowed !== false ||
            authorization.productionDeployRequiresManualApproval !== true
          ) {
            throw new Error('Production authorization contract mismatch.');
          }
          NODE

      - name: Verify recorded staging candidate digest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$DENIED_STAGING_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/staging-functions.json"
          actual_candidate_digest="$(node - <<'NODE'
          const rows = require(process.env.FUNCTIONS_PATH);
          const row = rows.find((v) => v.slug === process.env.CANDIDATE_FUNCTION_NAME);
          const digest = String(row?.ezbr_sha256 || '');
          if (!/^[a-f0-9]{64}$/.test(digest) || row?.verify_jwt !== false) process.exit(1);
          process.stdout.write(digest);
          NODE
          )"
          test "$actual_candidate_digest" = "${{ inputs.candidate_digest }}"
          rm -f "$RUNNER_TEMP/staging-functions.json"
        env:
          FUNCTIONS_PATH: ${{ runner.temp }}/staging-functions.json

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Validate production secret names without revealing values
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"
          names="$RUNNER_TEMP/production-secret-names.txt"
          supabase secrets list \
            --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF" \
            > "$names"
          grep -q 'ECONOVARIA_WEB_ALLOWED_ORIGINS' "$names"
          grep -q 'ECONOVARIA_TRUSTED_CLIENT_IP_HEADER' "$names"
          grep -q 'ECONOVARIA_RATE_LIMIT_HMAC_SECRET' "$names"
          grep -q 'ECONOVARIA_WEB_SESSION_ENCRYPTION_KEY' "$names"
          rm -f "$names"

      - name: Capture rollback identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/production-functions-before.json"
          node - <<'NODE'
          const rows = require(process.env.FUNCTIONS_PATH);
          const row = rows.find((v) => v.slug === process.env.FUNCTION_NAME);
          if (!row) throw new Error('Existing production function identity missing.');
          const bounded = {
            slug: row.slug,
            version: row.version,
            digest: row.ezbr_sha256,
            verifyJwt: row.verify_jwt,
          };
          require('node:fs').writeFileSync(
            process.env.ROLLBACK_PATH,
            `${JSON.stringify(bounded, null, 2)}\n`,
          );
          NODE
        env:
          FUNCTIONS_PATH: ${{ runner.temp }}/production-functions-before.json
          ROLLBACK_PATH: ${{ runner.temp }}/production-web-session-rollback.json

      - name: Restore exact source artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backend
          tar -xzf dist/production-web-session/backend-source.tgz
          test -f backend/supabase/functions/web-session-api/index.ts
          ! grep -R --line-number --fixed-strings 'raw.githubusercontent.com/kohnerbouchard-star/Student-Profile' \
            backend/supabase/functions/web-session-api \
            backend/supabase/functions/_shared \
            backend/src/domains/auth \
            backend/src/platform/supabase \
            backend/src/security
          ! grep -R --line-number --fixed-strings 'data:text/javascript' \
            backend/supabase/functions/web-session-api \
            backend/supabase/functions/_shared \
            backend/src/domains/auth \
            backend/src/platform/supabase \
            backend/src/security

      - name: Deploy only production web-session-api
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy "$FUNCTION_NAME" \
            --workdir backend \
            --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF" \
            --no-verify-jwt \
            --use-api

      - name: Verify deployed production source equals staging candidate
        id: deployed_source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/production-functions-after.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$DENIED_STAGING_PROJECT_REF/functions/$CANDIDATE_FUNCTION_NAME/body" \
            > "$RUNNER_TEMP/staging-function-body.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/functions/$FUNCTION_NAME/body" \
            > "$RUNNER_TEMP/production-function-body.json"
          node - <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          const metadata = JSON.parse(fs.readFileSync(process.env.METADATA_PATH, 'utf8'));
          const row = metadata.find((value) => value.slug === process.env.FUNCTION_NAME);
          if (!row || row.verify_jwt !== false || row.status !== 'ACTIVE') {
            throw new Error('Production function metadata is invalid.');
          }

          function bodyFiles(value) {
            const candidates = [value?.files, value?.body?.files, value?.body, value];
            const files = candidates.find(Array.isArray);
            if (!files?.length) throw new Error('Deployed function body is empty.');
            return files;
          }

          function canonicalSourceDigest(value) {
            const names = new Set();
            const rows = bodyFiles(value).map((file) => {
              let name = String(file?.name || file?.path || '')
                .replaceAll('\\', '/')
                .replace(/^\.\//u, '');
              if (name.startsWith('backend/')) name = name.slice('backend/'.length);
              if (
                !name ||
                name.startsWith('/') ||
                name.split('/').includes('..') ||
                typeof file?.content !== 'string' ||
                names.has(name)
              ) {
                throw new Error('Deployed function body contains an invalid file.');
              }
              names.add(name);
              return { name, content: file.content };
            }).sort((left, right) => left.name.localeCompare(right.name));
            if (!rows.some((file) => file.name === 'supabase/functions/web-session-api/index.ts')) {
              throw new Error('Deployed function entrypoint is missing.');
            }
            return crypto.createHash('sha256').update(JSON.stringify(rows)).digest('hex');
          }

          const staging = JSON.parse(fs.readFileSync(process.env.STAGING_BODY_PATH, 'utf8'));
          const production = JSON.parse(fs.readFileSync(process.env.PRODUCTION_BODY_PATH, 'utf8'));
          const stagingDigest = canonicalSourceDigest(staging);
          const productionDigest = canonicalSourceDigest(production);
          if (stagingDigest !== productionDigest) {
            throw new Error('Production deployed source differs from the staging candidate.');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `canonical_digest=${productionDigest}\n`);
          NODE
          rm -f \
            "$RUNNER_TEMP/production-functions-after.json" \
            "$RUNNER_TEMP/staging-function-body.json" \
            "$RUNNER_TEMP/production-function-body.json"
        env:
          METADATA_PATH: ${{ runner.temp }}/production-functions-after.json
          STAGING_BODY_PATH: ${{ runner.temp }}/staging-function-body.json
          PRODUCTION_BODY_PATH: ${{ runner.temp }}/production-function-body.json

      - name: Verify direct production startup and invalid-input contract
        shell: bash
        run: |
          set -euo pipefail
          base="https://${EXPECTED_PRODUCTION_PROJECT_REF}.supabase.co/functions/v1/${FUNCTION_NAME}"
          for attempt in $(seq 1 12); do
            health_status="$(curl --silent --show-error --output "$RUNNER_TEMP/health.json" --write-out '%{http_code}' "$base/health")"
            if [[ "$health_status" == "200" ]]; then break; fi
            if [[ "$attempt" == "12" ]]; then
              cat "$RUNNER_TEMP/health.json" >&2 || true
              exit 1
            fi
            sleep 5
          done
          node -e 'const b=require(process.argv[1]); if(b.ok!==true||b.status!=="ready") process.exit(1)' "$RUNNER_TEMP/health.json"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/api-keys?reveal=true" \
            > "$RUNNER_TEMP/api-keys.json"
          publishable_key="$(node - <<'NODE'
          const rows = require(process.env.KEYS_PATH);
          const row = rows.find((v) => String(v.api_key || '').startsWith('sb_publishable_')) ||
            rows.find((v) => v.name === 'anon' || v.type === 'anon');
          process.stdout.write(String(row?.api_key || row?.apiKey || ''));
          NODE
          )"
          test -n "$publishable_key"
          echo "::add-mask::$publishable_key"
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/direct-invalid.json" \
            --write-out '%{http_code}' \
            --request POST "$base/login" \
            -H "apikey: $publishable_key" \
            -H "Origin: $PRODUCTION_ORIGIN" \
            -H "Content-Type: application/json" \
            --data '{}')"
          test "$status" = "400"
          node - <<'NODE'
          const body = require(process.env.INVALID_PATH);
          const code = String(body?.error?.code || '');
          if (!code || code === 'web_session_failed' || code === 'WORKER_ERROR') process.exit(1);
          NODE
          rm -f "$RUNNER_TEMP/health.json" "$RUNNER_TEMP/api-keys.json" "$RUNNER_TEMP/direct-invalid.json"
          unset publishable_key
        env:
          KEYS_PATH: ${{ runner.temp }}/api-keys.json
          INVALID_PATH: ${{ runner.temp }}/direct-invalid.json

      - name: Verify Vercel production proxy route
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error \
              --output "$RUNNER_TEMP/vercel-invalid.json" \
              --write-out '%{http_code}' \
              --request POST "$PRODUCTION_ORIGIN/api/admin-session/login" \
              -H "Origin: $PRODUCTION_ORIGIN" \
              -H "Content-Type: application/json" \
              --data '{}')"
            if [[ "$status" == "400" ]]; then break; fi
            if [[ "$attempt" == "12" ]]; then
              echo "Unexpected Vercel proxy status: $status" >&2
              cat "$RUNNER_TEMP/vercel-invalid.json" >&2 || true
              exit 1
            fi
            sleep 5
          done
          node - <<'NODE'
          const body = require(process.env.INVALID_PATH);
          const code = String(body?.error?.code || '');
          if (!code || code === 'web_session_failed' || code === 'WORKER_ERROR') process.exit(1);
          NODE
          rm -f "$RUNNER_TEMP/vercel-invalid.json"
        env:
          INVALID_PATH: ${{ runner.temp }}/vercel-invalid.json

      - name: Record bounded production evidence
        shell: bash
        run: |
          {
            echo '## Production web-session recovery deployed'
            echo "- Source ref: \`$GITHUB_REF\`"
            echo "- Source commit: \`${{ inputs.source_commit }}\`"
            echo "- Source SHA-256: \`${{ inputs.source_sha256 }}\`"
            echo "- Staging candidate digest: \`${{ inputs.candidate_digest }}\`"
            echo "- Canonical deployed-source digest: \`${{ steps.deployed_source.outputs.canonical_digest }}\`"
            echo "- Candidate run: \`${{ inputs.candidate_run_id }}\`"
            echo "- Project: \`$EXPECTED_PRODUCTION_PROJECT_REF\`"
            echo "- Function: \`$FUNCTION_NAME\`"
            echo '- Artifact tree equals tracked Git tree: `true`'
            echo '- Production deployed source equals staging: `true`'
            echo '- Platform JWT verification: `false` (custom browser-session boundary)'
            echo '- Database schema changed by this workflow: `false`'
            echo '- Other functions deployed: `false`'
            echo '- Direct health probe: `pass`'
            echo '- Direct invalid-input probe: `pass`'
            echo '- Vercel proxy invalid-input probe: `pass`'
            echo '- Real administrator login: `required before incident closure`'
            echo '### Rollback identity'
            cat "$RUNNER_TEMP/production-web-session-rollback.json"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/production-functions-before.json" "$RUNNER_TEMP/production-web-session-rollback.json"
