name: Story Narrative S4 Choice Callbacks

on:
  push:
    branches:
      - feat/story-narrative-convergence-v1
    paths:
      - ".github/workflows/story-narrative-s4-choice-callbacks.yml"

permissions:
  contents: write

concurrency:
  group: story-narrative-s4-choice-callbacks
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact story branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard S3 boundary and S4 inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/story-narrative-convergence-v1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 53df4817ee85efda7603face50b08428f1b10ae3 HEAD
          test -f docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md
          test -f scripts/story-narrative-s4-apply.py
          test -f scripts/story-narrative-s4-normalize.py
          test -f scripts/story-narrative-s4-roadmap.py
          python3 -m py_compile scripts/story-narrative-s4-apply.py scripts/story-narrative-s4-normalize.py scripts/story-narrative-s4-roadmap.py

      - name: Record S4 design and launch in roadmap
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/story-narrative-s4-roadmap.py --launch
          git diff --check
          git add docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(story): lock S4 choice callback design"
            git push origin HEAD:feat/story-narrative-convergence-v1
          fi

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.3

      - name: Apply guarded S4 source transform
        id: transform
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/story-narrative-s4-normalize.py
          python3 scripts/story-narrative-s4-apply.py
          git diff --check

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Verify backend and Edge types
        id: typecheck
        working-directory: backend
        run: npm run typecheck:all

      - name: Verify authoritative choice conditions and delayed callbacks
        id: callbacks
        working-directory: backend
        run: npm run test:story-choice-callbacks

      - name: Verify Player Story context effective-choice hydration
        id: contexts
        working-directory: backend
        run: deno test --config supabase/functions/deno.json --lock=supabase/functions/deno.lock --frozen src/domains/storylines/infrastructure/supabasePlayerStoryContextRepository.test.ts

      - name: Verify S2 Messaging remains green
        id: messaging
        working-directory: backend
        run: npm run test:player-messaging

      - name: Verify stock/story scheduler integration
        id: scheduler
        working-directory: backend
        run: npm run test:stock-market-calendar

      - name: Record S4 failure in roadmap
        if: failure()
        env:
          S4_TRANSFORM_OUTCOME: ${{ steps.transform.outcome }}
          S4_TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          S4_CALLBACK_TEST_OUTCOME: ${{ steps.callbacks.outcome }}
          S4_CONTEXT_TEST_OUTCOME: ${{ steps.contexts.outcome }}
          S4_SCHEDULER_OUTCOME: ${{ steps.scheduler.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/story-narrative-s4-roadmap.py --failure
          git diff --check
          git add docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(story): record S4 verification failure"
            git push origin HEAD:feat/story-narrative-convergence-v1
          fi

      - name: Mark S4 complete in roadmap
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/story-narrative-s4-roadmap.py --success
          git diff --check

      - name: Remove temporary S4 implementation tooling
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/story-narrative-s4-choice-callbacks.yml
          rm -f scripts/story-narrative-s4-apply.py
          rm -f scripts/story-narrative-s4-normalize.py
          rm -f scripts/story-narrative-s4-roadmap.py

      - name: Commit verified S4 implementation
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(story): connect choices to delayed callbacks"
          git push origin HEAD:feat/story-narrative-convergence-v1
