name: Temporary Business V2 finalization

on:
  push:
    branches: [refactor/admin-ui-v2-business-v1]
    paths:
      - ".github/workflows/_finalize-business-temp.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Align accumulated V2 expectations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text: raise SystemExit(f"missing Business finalization anchor in {path}: {old[:120]!r}")
              p.write_text(text.replace(old,new,1))
          replace_once("scripts/admin-v2-unit.test.mjs", '["overview", "players", "attendance", "market", "banking", "loans", "contracts", "crafting", "store", "inventory", "world-management", "news-events", "messages", "progression", "settings", "logs"]', '["overview", "players", "attendance", "market", "banking", "loans", "contracts", "business", "crafting", "store", "inventory", "world-management", "news-events", "messages", "progression", "settings", "logs"]')
          replace_once("scripts/admin-v2-unit.test.mjs", '["business", "marketplace"]', '["marketplace"]')
          replace_once("scripts/admin-v2-unit.test.mjs", '  assert.equal(isMigratedAdminRoute("crafting"), true);\n', '  assert.equal(isMigratedAdminRoute("business"), true);\n  assert.equal(isMigratedAdminRoute("crafting"), true);\n')
          replace_once("scripts/admin-v2-unit.test.mjs", '  assert.equal(resolveAdminRouteBoundary({ routeId: "crafting" }).kind, "migrated");\n', '  assert.equal(resolveAdminRouteBoundary({ routeId: "business" }).kind, "migrated");\n  assert.equal(resolveAdminRouteBoundary({ routeId: "crafting" }).kind, "migrated");\n')
          replace_once("package.json", 'scripts/admin-v2-crafting-api.test.mjs scripts/admin-v2-logs-api.test.mjs', 'scripts/admin-v2-crafting-api.test.mjs scripts/admin-v2-business-api.test.mjs scripts/admin-v2-logs-api.test.mjs')
          PY
          rm .github/workflows/_finalize-business-temp.yml
          git add -- scripts/admin-v2-unit.test.mjs package.json
          git add -u -- .github/workflows/_finalize-business-temp.yml
          git diff --cached --check
          node --test scripts/admin-v2-business-api.test.mjs
          node --test scripts/admin-v2-unit.test.mjs
          git commit -m "test(admin-v2): align Business convergence expectations"
          git push origin HEAD:refactor/admin-ui-v2-business-v1
