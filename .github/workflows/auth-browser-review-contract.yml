name: Auth Browser Review Contract

on:
  pull_request:
    paths:
      - "api/password-reset.js"
      - "auth/security-review.html"
      - "auth/security-review.js"
      - "auth/recovery-start.js"
      - "auth/reset-password.js"
      - "backend/supabase/auth-email-template-manifest.json"
      - "scripts/auth-email-template-contract.test.mjs"
      - "scripts/password-recovery-frontend-contract.test.mjs"
      - "scripts/auth-browser-review-contract.test.mjs"
  push:
    branches: [main]
    paths:
      - "api/password-reset.js"
      - "auth/security-review.html"
      - "auth/security-review.js"
      - "auth/recovery-start.js"
      - "auth/reset-password.js"
      - "backend/supabase/auth-email-template-manifest.json"
      - "scripts/auth-email-template-contract.test.mjs"
      - "scripts/password-recovery-frontend-contract.test.mjs"
      - "scripts/auth-browser-review-contract.test.mjs"

permissions:
  contents: read

concurrency:
  group: auth-browser-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
      - name: Validate browser-hosted auth review boundary
        run: |
          set -euo pipefail
          node --check api/password-reset.js
          node --check auth/security-review.js
          node --check auth/recovery-start.js
          node --check auth/reset-password.js
          node --test \
            scripts/auth-email-template-contract.test.mjs \
            scripts/password-recovery-frontend-contract.test.mjs \
            scripts/auth-browser-review-contract.test.mjs \
            scripts/vercel-auth-proxy-contract.test.mjs
          node scripts/build-supabase-auth-email-config.mjs --check
