name: Business Manufacturing Classroom Load Isolation V2

on:
  pull_request:
    paths:
      - "backend/supabase/migrations/20260823110*.sql"
      - "scripts/business-phase6-manufacturing-classroom-load-isolation.mjs"
      - "docs/roadmaps/business-phase6-timed-manufacturing-scope-v1.md"
      - ".github/workflows/business-manufacturing-classroom-load-isolation-v2.yml"
  push:
    branches: [main]
    paths:
      - "backend/supabase/migrations/20260823110*.sql"
      - "scripts/business-phase6-manufacturing-classroom-load-isolation.mjs"
      - ".github/workflows/business-manufacturing-classroom-load-isolation-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-manufacturing-classroom-load-isolation-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-classroom-load-isolation:
    name: Verify 40-player and two-game isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
      - name: Run deterministic classroom load and isolation acceptance
        run: node scripts/business-phase6-manufacturing-classroom-load-isolation.mjs
      - name: Verify clean patch formatting
        run: git diff --check
