name: Admin V2 Attendance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/admin-v2-attendance.yml"
      - "admin/v2/**"
      - "scripts/admin-v2-attendance-api.test.mjs"
      - "scripts/admin-v2-unit.test.mjs"
      - "scripts/admin-v2-store-api.test.mjs"
      - "scripts/admin-v2-store-media.test.mjs"
      - "scripts/admin-v2-market-api.test.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-v2-attendance-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install pinned repository tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          npm ci

      - name: Check Attendance syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check admin/v2/src/routes/attendance/AttendanceApi.js
          node --check admin/v2/src/routes/attendance/AttendanceController.js
          node --check admin/v2/src/routes/attendance/AttendanceRoute.js
          node --check admin/v2/src/routes/attendance/AttendanceSkeleton.js
          node --check scripts/admin-v2-attendance-api.test.mjs

      - name: Run focused Attendance tests
        run: node --test scripts/admin-v2-attendance-api.test.mjs

      - name: Run Admin V2 regressions
        run: npm run test:admin-v2

      - name: Check diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git diff --check origin/main...HEAD

      - name: Scan changed Attendance source for credentials
        shell: bash
        run: |
          set -euo pipefail
          node scripts/supply-chain-secret-scan.mjs \
            admin/v2/src/routes/attendance/AttendanceApi.js \
            admin/v2/src/routes/attendance/AttendanceController.js \
            admin/v2/src/routes/attendance/AttendanceRoute.js \
            admin/v2/src/routes/attendance/AttendanceSkeleton.js \
            admin/v2/styles/routes/attendance.css \
            scripts/admin-v2-attendance-api.test.mjs \
            docs/architecture/admin-ui-v2-attendance.md \
            docs/operations/evidence/admin-ui-v2-attendance/contract-audit.md \
            docs/operations/evidence/admin-ui-v2-attendance/verification.md
