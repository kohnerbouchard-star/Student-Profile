name: Business Phase 6 Deterministic Repair

on:
  push:
    branches:
      - feat/business-timed-manufacturing-v2
    paths:
      - .github/workflows/business-phase6-deterministic-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0
      - name: Normalize Phase 6 source and verification authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/business-equipment-capacity-v2
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          for name in (
              "sitecustomize.py",
              "pathlib.py",
              ".github/workflows/business-phase6-source-correction.yml",
              "docs/roadmaps/.phase6-head-correction-trigger",
          ):
              Path(name).unlink(missing_ok=True)

          migration = Path("backend/supabase/migrations/20260823110300_business_manufacturing_atomic_start_v2.sql")
          source = migration.read_text()
          marker = "  select recipe.*, recipe_output.*\n  into v_recipe, v_output_line\n"
          if marker in source:
              start = source.index(marker)
              end = source.index("  limit 1;\n", start) + len("  limit 1;\n")
              recipe_lookup = source[start:end].replace(
                  marker,
                  "  select recipe.*\n  into v_recipe\n",
                  1,
              )
              output_lookup = """

  select recipe_output.*
  into v_output_line
  from public.physical_economy_recipe_outputs as recipe_output
  where recipe_output.recipe_id = v_recipe.id
    and recipe_output.item_key = v_output_item.canonical_key
  limit 1;
  if not found then
    raise exception 'BUSINESS_MANUFACTURING_OUTPUT_INVALID'
      using errcode = 'P0001';
  end if;
"""
              migration.write_text(source[:start] + recipe_lookup + output_lookup + source[end:])

          authority_path = Path("docs/operations/contracts/player-cross-cutting-verification-authority-v1.json")
          authority = json.loads(authority_path.read_text())
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "origin/feat/business-equipment-capacity-v2...HEAD"],
              text=True,
          ).splitlines()
          permanent = {
              path for path in changed
              if path
              and path != ".github/workflows/business-phase6-deterministic-repair.yml"
              and not path.endswith("business-phase6-source-correction.yml")
              and path not in {"sitecustomize.py", "pathlib.py", "docs/roadmaps/.phase6-head-correction-trigger"}
          }
          permanent.update({
              "docs/operations/contracts/player-cross-cutting-verification-authority-v1.json",
              "scripts/player-cross-cutting-authority.test.mjs",
              "scripts/verify-player-cross-cutting-authority.mjs",
          })
          authority["pullRequestNumber"] = 661
          authority["baseRef"] = "feat/business-equipment-capacity-v2"
          authority["productionDeploymentAllowed"] = False
          authority["productionMutationAllowed"] = False
          authority["secretValuesAllowed"] = False
          authority["allowedPaths"] = sorted(permanent)
          authority_path.write_text(json.dumps(authority, indent=2) + "\n")
          PY

          cat > .github/workflows/business-timed-manufacturing-v2.yml <<'EOF'
          name: Business Timed Manufacturing V2

          on:
            pull_request:
              paths:
                - "backend/supabase/migrations/2026082311*.sql"
                - "scripts/business-phase6-manufacturing-*.mjs"
                - "docs/roadmaps/business-phase6-timed-manufacturing-scope-v1.md"
                - ".github/workflows/business-timed-manufacturing-v2.yml"
            push:
              branches: [main]
              paths:
                - "backend/supabase/migrations/2026082311*.sql"
                - "scripts/business-phase6-manufacturing-*.mjs"
                - ".github/workflows/business-timed-manufacturing-v2.yml"

          permissions:
            contents: read

          jobs:
            verify-manufacturing:
              runs-on: ubuntu-latest
              timeout-minutes: 35
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-node@v7
                  with:
                    node-version: 22.23.1
                    cache: npm
                    cache-dependency-path: |
                      package-lock.json
                      backend/package-lock.json
                      player-terminal/package-lock.json
                - uses: denoland/setup-deno@v2
                  with:
                    deno-version: v2.9.3
                - run: npm install --global npm@10.9.8
                - run: npm ci --ignore-scripts
                - name: Verify timed manufacturing and retained authorities
                  shell: bash
                  run: |
                    set -euo pipefail
                    for script in scripts/business-phase6-manufacturing-*.mjs; do
                      node "$script"
                    done
                    node scripts/business-phase5-equipment-foundation-contract.mjs
                    node scripts/business-phase5-equipment-capacity-simulation.mjs
                    node scripts/business-phase5-equipment-recipe-sync-contract.mjs
                    node scripts/business-phase5-equipment-production-contract.mjs
                    node scripts/business-phase5-equipment-production-simulation.mjs
                    node scripts/business-phase4c-production-labor-contract.mjs
                    node scripts/business-phase4c-labor-reservation-simulation.mjs
                    node scripts/business-phase4c-payroll-settlement-contract.mjs
                    node scripts/business-phase4c-payroll-simulation.mjs
                    node scripts/business-banking-runtime-contract.mjs
                    node scripts/validate-supabase-migrations.mjs
                    git diff --check
                - name: Run repository quality suite
                  run: npm test
                - name: Install backend dependencies
                  working-directory: backend
                  run: npm ci --ignore-scripts
                - name: Verify all backend and Edge TypeScript
                  working-directory: backend
                  run: npm run typecheck:all
                - name: Install Player Terminal dependencies
                  working-directory: player-terminal
                  run: npm ci --no-audit --no-fund
                - name: Verify retained Player Business surface
                  working-directory: player-terminal
                  run: |
                    npm run check
                    node tests/business-banking-surface.mjs
                    npm run adapter
                    npm run capability-manifest-current
                    npm run runtime-integration
          EOF
          sed -i 's/^          //' .github/workflows/business-timed-manufacturing-v2.yml
          rm .github/workflows/business-phase6-deterministic-repair.yml
          git diff --check
      - name: Commit normalized Phase 6 head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git commit -m "chore(business): normalize Phase 6 verification head"
          git push origin HEAD:feat/business-timed-manufacturing-v2
