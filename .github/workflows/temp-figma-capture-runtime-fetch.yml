name: Temporary Figma Capture Runtime Fetch

on:
  push:
    branches:
      - feat/econovaria-marketing-site-v1
    paths:
      - .github/workflows/temp-figma-capture-runtime-fetch.yml

permissions:
  contents: read

jobs:
  fetch-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch public Figma capture runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            https://mcp.figma.com/mcp/html-to-design/capture.js \
            --output capture.js
          test -s capture.js
          wc -c capture.js
          sha256sum capture.js > capture.js.sha256

      - name: Upload isolated runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: figma-capture-runtime
          path: |
            capture.js
            capture.js.sha256
          if-no-files-found: error
          retention-days: 1
