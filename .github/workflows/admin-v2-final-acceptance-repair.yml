name: Admin V2 Final Acceptance Repair

on:
  push:
    branches:
      - refactor/admin-v2-ux-root-v1
    paths:
      - .github/workflows/admin-v2-final-acceptance-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/admin-v2-ux-root-v1
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Instrument News narrow overflow
        shell: python
        run: |
          from pathlib import Path
          path = Path("scripts/admin-v2-news-events-browser-smoke.mjs")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "assert.match(body, /Authoritative supervisory surface/);",
              "assert.match(body, /Read-only publication monitor/);",
              1,
          )
          old = '''  const metrics = await page.evaluate(() => ({\n    viewport: document.documentElement.clientWidth,\n    document: document.documentElement.scrollWidth,\n    body: document.body.scrollWidth,\n  }));'''
          new = '''  const metrics = await page.evaluate(() => {\n    const viewport = document.documentElement.clientWidth;\n    const offenders = [...document.body.querySelectorAll("*")].map((element) => {\n      const rect = element.getBoundingClientRect();\n      const style = getComputedStyle(element);\n      return { tag: element.tagName, cls: element.className || "", role: element.getAttribute("role") || "", left: Math.round(rect.left * 10) / 10, right: Math.round(rect.right * 10) / 10, width: Math.round(rect.width * 10) / 10, scrollWidth: element.scrollWidth, clientWidth: element.clientWidth, minWidth: style.minWidth, overflowX: style.overflowX, position: style.position };\n    }).filter((entry) => entry.right > viewport + 1).sort((a,b) => b.right - a.right).slice(0, 30);\n    return { viewport, document: document.documentElement.scrollWidth, body: document.body.scrollWidth, offenders };\n  });'''
          if old not in text:
              raise SystemExit("News overflow metrics block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Create browser-safe fixture runtime config
        run: |
          cat > runtime-config.env.js <<'EOF'
          window.__ECONOVARIA_RUNTIME_CONFIG__ = Object.freeze({
            environment: "development",
            projectRef: "runtimefixture123456",
            supabaseUrl: "https://runtimefixture123456.supabase.co",
            supabasePublishableKey: "sb_" + "publishable_runtime_fixture_1234567890"
          });
          EOF
      - name: Diagnose News acceptance
        run: node scripts/admin-v2-news-events-browser-smoke.mjs
