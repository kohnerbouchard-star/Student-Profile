name: Stock Market Staging Candidate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Exact current main commit to deploy"
        required: true
        type: string
      confirm_project_ref:
        description: "Type the exact staging project ref"
        required: true
        type: string
      confirm_action:
        description: "Type DEPLOY STOCK MARKET STAGING"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: stock-market-staging-candidate
  cancel-in-progress: false

env:
  EXPECTED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  DENIED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  SUPABASE_CLI_VERSION: 2.109.1
  FUNCTION_MANIFEST: backend/supabase/stock-market-edge-function-manifest.json

jobs:
  deploy:
    name: Deploy signed stock runtime to staging
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Enforce explicit staging authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "${{ inputs.confirm_project_ref }}" = "$EXPECTED_STAGING_PROJECT_REF"
          test "${{ inputs.confirm_action }}" = "DEPLOY STOCK MARKET STAGING"
          test "$EXPECTED_STAGING_PROJECT_REF" != "$DENIED_PRODUCTION_PROJECT_REF"
          [[ "${{ inputs.source_commit }}" =~ ^[a-f0-9]{40}$ ]]

      - name: Check out exact merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source is exact current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_commit }}"
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -f "$FUNCTION_MANIFEST"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install repository tooling
        run: npm ci

      - name: Validate signed stock runtime contracts
        run: |
          set -euo pipefail
          node scripts/high-priority-boundary-ratchet.mjs
          node --test \
            scripts/internal-runner-auth-contract.test.mjs \
            scripts/trigger-stock-market-tick.test.mjs

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1
        with:
          version: 2.109.1

      - name: Verify staging secret names without revealing values
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"
          names="$RUNNER_TEMP/staging-secret-names.txt"
          supabase secrets list \
            --project-ref "$EXPECTED_STAGING_PROJECT_REF" \
            > "$names"
          grep -q 'STOCK_MARKET_RUNNER_SECRET' "$names"
          rm -f "$names"

      - name: Capture pre-deploy function identities
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/functions-before.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = require(`./${process.env.FUNCTION_MANIFEST}`);
          const rows = require(process.env.FUNCTIONS_PATH);
          const bounded = manifest.functions.map(({ slug }) => {
            const row = rows.find((value) => value.slug === slug);
            return row ? {
              slug,
              version: row.version,
              digest: row.ezbr_sha256,
              verifyJwt: row.verify_jwt,
            } : { slug, missing: true };
          });
          fs.writeFileSync(process.env.ROLLBACK_PATH, `${JSON.stringify(bounded, null, 2)}\n`);
          NODE
        env:
          FUNCTIONS_PATH: ${{ runner.temp }}/functions-before.json
          ROLLBACK_PATH: ${{ runner.temp }}/stock-market-staging-before.json

      - name: Deploy exact tracked stock function sources
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > "$RUNNER_TEMP/stock-functions.txt"
          const manifest = require(`./${process.env.FUNCTION_MANIFEST}`);
          for (const entry of manifest.functions) {
            if (entry.verifyJwt !== false) throw new Error(`${entry.slug} must disable platform JWT verification.`);
            if (entry.authorizationModel !== 'publishable-key-plus-hmac-sha256-plus-nonce') {
              throw new Error(`${entry.slug} authorization model mismatch.`);
            }
            process.stdout.write(`${entry.slug}\n`);
          }
          NODE
          while IFS= read -r function_name; do
            test -n "$function_name"
            supabase functions deploy "$function_name" \
              --workdir backend \
              --project-ref "$EXPECTED_STAGING_PROJECT_REF" \
              --no-verify-jwt
          done < "$RUNNER_TEMP/stock-functions.txt"

      - name: Verify deployed inventory and JWT settings
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/functions-after.json"
          node - <<'NODE'
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');
          const manifest = require(`./${process.env.FUNCTION_MANIFEST}`);
          const rows = require(process.env.FUNCTIONS_PATH);
          const sourcePaths = [
            process.env.FUNCTION_MANIFEST,
            'backend/src',
            'backend/supabase/functions/_shared',
            ...manifest.functions.map((entry) => path.dirname(entry.entrypoint)),
          ];
          const files = execFileSync('git', ['ls-files', '-z', '--', ...sourcePaths])
            .toString('utf8')
            .split('\0')
            .filter(Boolean)
            .sort();
          if (!files.length) throw new Error('No tracked stock runtime source files were found.');
          const sourceHash = crypto.createHash('sha256');
          for (const file of files) {
            sourceHash.update(file);
            sourceHash.update('\0');
            sourceHash.update(fs.readFileSync(file));
            sourceHash.update('\0');
          }
          const sourceDigest = sourceHash.digest('hex');
          const deployed = manifest.functions.map(({ slug, runnerName }) => {
            const row = rows.find((value) => value.slug === slug);
            if (!row) throw new Error(`Missing deployed function: ${slug}`);
            if (row.verify_jwt !== false) throw new Error(`${slug} verify_jwt drifted.`);
            if (!/^[a-f0-9]{64}$/.test(String(row.ezbr_sha256 || ''))) {
              throw new Error(`${slug} digest is invalid.`);
            }
            return {
              slug,
              runnerName,
              version: row.version,
              digest: row.ezbr_sha256,
              verifyJwt: row.verify_jwt,
            };
          });
          const inventoryDigest = crypto
            .createHash('sha256')
            .update(JSON.stringify(deployed))
            .digest('hex');
          const evidence = {
            schemaVersion: 1,
            environment: 'staging',
            projectRef: process.env.EXPECTED_STAGING_PROJECT_REF,
            sourceCommit: process.env.SOURCE_COMMIT,
            sourceDigest,
            inventoryDigest,
            deployed,
          };
          fs.writeFileSync(process.env.EVIDENCE_PATH, `${JSON.stringify(evidence, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_digest=${sourceDigest}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `inventory_digest=${inventoryDigest}\n`);
          NODE
        env:
          FUNCTIONS_PATH: ${{ runner.temp }}/functions-after.json
          EVIDENCE_PATH: ${{ runner.temp }}/stock-market-staging-candidate.json
          SOURCE_COMMIT: ${{ inputs.source_commit }}

      - name: Upload staging deployment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stock-market-staging-${{ inputs.source_commit }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/stock-market-staging-candidate.json
            ${{ runner.temp }}/stock-market-staging-before.json
