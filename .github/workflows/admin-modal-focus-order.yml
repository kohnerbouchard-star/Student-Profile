name: Admin Modal Focus Order

on:
  pull_request:
    paths:
      - "admin/index.html"
      - "admin/modal-focus-order-guard.js"
      - "scripts/admin-modal-focus-order-contract.test.mjs"
      - "scripts/admin-modal-focus-order-browser-smoke.mjs"
      - ".github/workflows/admin-modal-focus-order.yml"
  push:
    branches:
      - main
    paths:
      - "admin/index.html"
      - "admin/modal-focus-order-guard.js"
      - "scripts/admin-modal-focus-order-contract.test.mjs"
      - "scripts/admin-modal-focus-order-browser-smoke.mjs"
      - ".github/workflows/admin-modal-focus-order.yml"

permissions:
  contents: read

concurrency:
  group: admin-modal-focus-order-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Modal focus-order verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate source and load-order contract
        run: node --test scripts/admin-modal-focus-order-contract.test.mjs

      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify focus transfer before background inertness
        run: node scripts/admin-modal-focus-order-browser-smoke.mjs
