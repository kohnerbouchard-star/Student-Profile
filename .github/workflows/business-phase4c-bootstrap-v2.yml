name: Business Phase 4C Bootstrap V2

on:
  push:
    branches:
      - feat/business-workforce-hiring-v2
    paths:
      - ".github/workflows/business-phase4c-bootstrap-v2.yml"
      - "docs/roadmaps/business-v2-development-execution-log-v1.md"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: business-phase4c-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PARENT_BRANCH: feat/business-workforce-hiring-v2
      PHASE_BRANCH: feat/business-payroll-settlement-v2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-workforce-hiring-v2
          fetch-depth: 0

      - name: Require durable Phase 4B certification
        id: gate
        run: |
          log=docs/roadmaps/business-v2-development-execution-log-v1.md
          if grep -q 'Phase 4B COMPLETE: candidate pools and server-owned hiring' "$log" && \
             grep -q 'Phase 4C — bounded recurring payroll settlement is OPEN' "$log"; then
            echo ready=true >> "$GITHUB_OUTPUT"
          else
            echo ready=false >> "$GITHUB_OUTPUT"
            echo 'Phase 4B is not certified; leaving Phase 4C closed.'
          fi

      - name: Create branch, draft PR, and source bundle workflow
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/business-phase4c-bootstrap.yml \
            .github/workflows/business-phase4c-bootstrap-v2.yml
          git config user.name econovaria-phase4c-bootstrap
          git config user.email actions@users.noreply.github.com
          git add -u .github/workflows/business-phase4c-bootstrap.yml \
            .github/workflows/business-phase4c-bootstrap-v2.yml || true
          git commit -m 'chore(business): close Phase 4C bootstrap'
          git push origin HEAD:"$PARENT_BRANCH"

          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.error, urllib.parse, urllib.request
          repo=os.environ['REPOSITORY']; token=os.environ['GH_TOKEN']; branch=os.environ['PHASE_BRANCH']; parent=os.environ['PARENT_BRANCH']; owner=repo.split('/')[0]
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'}
          def request(url,method='GET',payload=None):
            req=urllib.request.Request(url,data=json.dumps(payload).encode() if payload is not None else None,method=method,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=30) as response:
                return response.status, json.load(response) if response.status != 204 else None
            except urllib.error.HTTPError as error:
              return error.code, error.read().decode('utf-8','replace')
          status,_=request(f'https://api.github.com/repos/{repo}/git/refs','POST',{'ref':f'refs/heads/{branch}','sha':sha})
          if status not in (201,422): raise SystemExit(f'branch create failed: {status}')
          status,pulls=request(f'https://api.github.com/repos/{repo}/pulls?state=open&head={owner}:{urllib.parse.quote(branch,safe="")}&base={urllib.parse.quote(parent,safe="")}')
          if status != 200: raise SystemExit(f'PR lookup failed: {status}')
          if not pulls:
            body='''## Scope\n\nPhase 4C implements bounded recurring payroll settlement, stacked on durably certified Phase 4B.\n\nThis PR remains **draft, open, unmerged, and undeployed**. No staging or production deployment or live data mutation is authorized.\n\n## Required authority boundary\n\n- exactly one payroll run per Business and period;\n- obligations derived only from active candidate-backed employees;\n- first-class Business cash debited through canonical ledger authority;\n- explicit paid, partially paid, and unpaid outcomes;\n- idempotency, concurrency safety, currency/game/Business scope, and immutable evidence;\n- employees paid every payroll cycle regardless of production utilization;\n- no second payroll debit during production;\n- production-labor integration remains closed.\n\n## Merge and release boundary\n\nPR #648 and all stacked Business V2 PRs remain draft and unmerged. No deployment or live mutation is authorized.'''
            status,result=request(f'https://api.github.com/repos/{repo}/pulls','POST',{'title':'Draft: Business V2 Phase 4C recurring payroll settlement','head':branch,'base':parent,'body':body,'draft':True})
            if status != 201: raise SystemExit(f'PR create failed: {status} {result}')
          workflow='''name: Business Phase 4C Source Bundle\n\non:\n  push:\n    branches:\n      - feat/business-payroll-settlement-v2\n    paths:\n      - ".github/workflows/business-phase4c-source-bundle.yml"\n\npermissions:\n  contents: read\n\njobs:\n  bundle:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - uses: actions/checkout@v7\n        with:\n          ref: feat/business-payroll-settlement-v2\n          fetch-depth: 0\n      - name: Package source\n        run: tar --exclude=.git --exclude=node_modules --exclude='**/node_modules' -czf "$RUNNER_TEMP/student-profile-phase4c-source.tar.gz" .\n      - uses: actions/upload-artifact@v4\n        with:\n          name: student-profile-phase4c-source\n          path: ${{ runner.temp }}/student-profile-phase4c-source.tar.gz\n          retention-days: 2\n'''
          path='.github/workflows/business-phase4c-source-bundle.yml'
          status,_=request(f'https://api.github.com/repos/{repo}/contents/{path}','PUT',{'message':'ci(business): add Phase 4C source bundle','content':base64.b64encode(workflow.encode()).decode(),'branch':branch})
          if status not in (200,201): raise SystemExit(f'workflow create failed: {status}')
          PY
