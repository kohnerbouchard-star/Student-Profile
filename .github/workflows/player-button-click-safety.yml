name: Player Button Click Safety

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/player-button-click-safety.yml"
      - "player-terminal/**"
      - "frontend/**"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player-button-click-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: player-terminal
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: player-terminal/package-lock.json

      - name: Install Player dependencies
        run: npm ci

      - name: Materialize browser-only runtime fixture
        run: |
          set -euo pipefail
          mkdir -p frontend/src/core
          cp ../frontend/src/core/runtime-config.js frontend/src/core/runtime-config.js
          cat > runtime-config.env.js <<'EOF'
          window.__ECONOVARIA_RUNTIME_CONFIG__ = Object.freeze({
            environment: "development",
            projectRef: "runtimefixture123456",
            supabaseUrl: "https://runtimefixture123456.supabase.co",
            supabasePublishableKey: "sb_publishable_runtime_fixture_1234567890"
          });
          EOF

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Sweep enabled Player content buttons
        run: npx playwright test tests/browser/player-button-click-safety.spec.mjs --project=chromium-desktop --fully-parallel --workers=4

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: player-button-click-safety-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            player-terminal/playwright-report/
            player-terminal/test-results/
          if-no-files-found: warn
          retention-days: 30
