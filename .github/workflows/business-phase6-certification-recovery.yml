name: Business Phase 6 Certification Recovery

on:
  push:
    branches:
      - feat/business-timed-manufacturing-v2
    paths:
      - ".github/workflows/business-phase6-certification-recovery.yml"

permissions:
  actions: write
  contents: write

concurrency:
  group: business-phase6-certification-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0
      - name: Repair exact-source workflow evidence
        shell: bash
        run: |
          set -euo pipefail
          IMPLEMENTATION_SHA="$(git log -1 --format=%H --grep='fix(player): converge static Edge manufacturing boundary')"
          test -n "$IMPLEMENTATION_SHA"
          SHORT_SHA="${IMPLEMENTATION_SHA:0:12}"
          TEMP_BRANCH="verify/phase6-${SHORT_SHA}"

          REQUIRED_NAMES=(
            "Admin API Check"
            "Backend Typecheck"
            "Beta Security Contract"
            "Business Banking Runtime"
            "Business Economy V2"
            "Business Manufacturing Completion V2"
            "Business Manufacturing Recovery V2"
            "Business Manufacturing Resource Hold V2"
            "Business Timed Manufacturing V2"
            "Business Workforce Hiring V2"
            "Business Workforce Payroll V2"
            "Business Workforce Production Payroll V2"
            "Database Replay"
            "Environment Neutral Browser"
            "Exchange Calendar Runtime"
            "Player Terminal Verify"
            "Progression Runtime"
            "Repository Quality"
            "Required Game Market Timezone"
            "Runtime Interaction Wiring"
            "Staging Readiness Preflight"
            "Supply Chain Security"
            "World Runtime"
          )

          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows" -f per_page=100 > /tmp/workflows.json
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
            -f head_sha="$IMPLEMENTATION_SHA" -f per_page=100 > /tmp/runs.json
          jq '[.workflow_runs | sort_by(.created_at) | group_by(.name)[] | .[-1]]' /tmp/runs.json > /tmp/latest.json

          create_temp_ref=0
          for name in "${REQUIRED_NAMES[@]}"; do
            row="$(jq -c --arg name "$name" '.[] | select(.name == $name)' /tmp/latest.json | tail -n 1)"
            if [ -n "$row" ]; then
              status="$(jq -r '.status' <<<"$row")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$row")"
              run_id="$(jq -r '.id' <<<"$row")"
              if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
                gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/rerun-failed-jobs" || true
              fi
              continue
            fi

            workflow_id="$(jq -r --arg name "$name" '.workflows[] | select(.name == $name and .state == "active") | .id' /tmp/workflows.json | head -n 1)"
            if [ -z "$workflow_id" ]; then
              echo "Required workflow is not registered: $name" >&2
              exit 1
            fi
            create_temp_ref=1
          done

          load_row="$(jq -c '[.[] | select(.name | test("(multiplayer|load|40[ -]?player|two[ -]?game)"; "i"))] | sort_by(.created_at) | .[-1] // empty' /tmp/latest.json)"
          if [ -z "$load_row" ]; then
            load_workflow_id="$(jq -r '.workflows[] | select((.name | test("(multiplayer|load|40[ -]?player|two[ -]?game)"; "i")) and .state == "active") | .id' /tmp/workflows.json | head -n 1)"
            if [ -z "$load_workflow_id" ]; then
              echo "Protected multiplayer/load workflow is not registered." >&2
              exit 1
            fi
            create_temp_ref=1
          else
            load_status="$(jq -r '.status' <<<"$load_row")"
            load_conclusion="$(jq -r '.conclusion // ""' <<<"$load_row")"
            load_run_id="$(jq -r '.id' <<<"$load_row")"
            if [ "$load_status" = "completed" ] && [ "$load_conclusion" != "success" ]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${load_run_id}/rerun-failed-jobs" || true
            fi
          fi

          if [ "$create_temp_ref" -eq 1 ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${TEMP_BRANCH}" -f sha="$IMPLEMENTATION_SHA" \
              >/dev/null 2>&1 || \
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${TEMP_BRANCH}" \
                -f sha="$IMPLEMENTATION_SHA" -F force=true >/dev/null

            for name in "${REQUIRED_NAMES[@]}"; do
              if jq -e --arg name "$name" '.[] | select(.name == $name)' /tmp/latest.json >/dev/null; then
                continue
              fi
              workflow_id="$(jq -r --arg name "$name" '.workflows[] | select(.name == $name and .state == "active") | .id' /tmp/workflows.json | head -n 1)"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/dispatches" \
                -f ref="$TEMP_BRANCH" || true
            done

            if [ -z "$load_row" ]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${load_workflow_id}/dispatches" \
                -f ref="$TEMP_BRANCH" || true
            fi
          fi

          ready=0
          for attempt in $(seq 1 180); do
            gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
              -f head_sha="$IMPLEMENTATION_SHA" -f per_page=100 > /tmp/runs-current.json
            jq '[.workflow_runs | sort_by(.created_at) | group_by(.name)[] | .[-1]]' \
              /tmp/runs-current.json > /tmp/latest-current.json
            missing=0
            pending=0
            failed=0
            for name in "${REQUIRED_NAMES[@]}"; do
              row="$(jq -c --arg name "$name" '.[] | select(.name == $name)' /tmp/latest-current.json | tail -n 1)"
              if [ -z "$row" ]; then missing=$((missing + 1)); continue; fi
              status="$(jq -r '.status' <<<"$row")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$row")"
              if [ "$status" != "completed" ]; then pending=$((pending + 1));
              elif [ "$conclusion" != "success" ]; then failed=$((failed + 1)); fi
            done
            load_row="$(jq -c '[.[] | select(.name | test("(multiplayer|load|40[ -]?player|two[ -]?game)"; "i"))] | sort_by(.created_at) | .[-1] // empty' /tmp/latest-current.json)"
            if [ -z "$load_row" ]; then
              missing=$((missing + 1))
            else
              status="$(jq -r '.status' <<<"$load_row")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$load_row")"
              if [ "$status" != "completed" ]; then pending=$((pending + 1));
              elif [ "$conclusion" != "success" ]; then failed=$((failed + 1)); fi
            fi
            if [ "$missing" -eq 0 ] && [ "$pending" -eq 0 ] && [ "$failed" -eq 0 ]; then
              ready=1
              break
            fi
            if [ "$pending" -eq 0 ] && [ "$failed" -gt 0 ]; then break; fi
            sleep 10
          done

          if [ "$ready" -ne 1 ]; then
            jq -r '.[] | [.name, .status, (.conclusion // ""), (.id|tostring)] | @tsv' /tmp/latest-current.json
            echo "Exact-source workflow recovery did not converge." >&2
            exit 1
          fi

          cert_run_id="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
            -f branch=feat/business-timed-manufacturing-v2 -f per_page=100 \
            --jq '.workflow_runs | map(select(.name == "Business Phase 6 Certification Controller")) | sort_by(.created_at) | .[-1].id')"
          test -n "$cert_run_id"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${cert_run_id}/rerun-failed-jobs" || \
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${cert_run_id}/rerun"

          for attempt in $(seq 1 120); do
            git fetch origin feat/business-timed-manufacturing-v2 --quiet
            git reset --hard origin/feat/business-timed-manufacturing-v2 --quiet
            if [ -f docs/operations/evidence/business-phase6-certified-v1.json ]; then
              break
            fi
            sleep 10
          done
          test -f docs/operations/evidence/business-phase6-certified-v1.json

          rm -f .github/workflows/business-phase6-certification-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(business): remove Phase 6 certification recovery"
            git push origin HEAD:feat/business-timed-manufacturing-v2
          fi

          if [ "$create_temp_ref" -eq 1 ]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${TEMP_BRANCH}" || true
          fi
