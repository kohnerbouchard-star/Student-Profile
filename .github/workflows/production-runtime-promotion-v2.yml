name: Production Runtime Promotion V2 (Retired)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-runtime-promotion-v2-retired
  cancel-in-progress: false

jobs:
  retired:
    name: Block unsafe legacy production promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed
        shell: bash
        run: |
          echo "Production Runtime Promotion V2 is retired." >&2
          echo "Run the protected Release Integrity live-parity workflow and implement promotion only from a passing exact-source attestation." >&2
          exit 1
