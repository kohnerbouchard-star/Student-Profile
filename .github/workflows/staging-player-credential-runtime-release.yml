name: Staging Player Credential Runtime Release

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Type the exact staging project ref"
        required: true
        type: string
      confirm_source_sha:
        description: "Type the exact 40-character main commit SHA"
        required: true
        type: string
      confirm_active_v2_credentials:
        description: "Type the verified active pbkdf2-sha256-v2 credential count"
        required: true
        type: string
      confirm_action:
        description: "Type DEPLOY PLAYER CREDENTIAL RUNTIME TO STAGING"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-player-credential-runtime-release
  cancel-in-progress: false

env:
  EXPECTED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  DENIED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  REQUIRED_SECRET_NAME: ECONOVARIA_PLAYER_CREDENTIAL_PEPPER
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  deploy:
    name: Deploy Player credential runtime to staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Enforce staging-only authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$SUPABASE_ACCESS_TOKEN"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "${{ inputs.confirm_project_ref }}" = "$EXPECTED_STAGING_PROJECT_REF"
          test "${{ inputs.confirm_source_sha }}" = "$GITHUB_SHA"
          test "${{ inputs.confirm_active_v2_credentials }}" = "0"
          test "${{ inputs.confirm_action }}" = "DEPLOY PLAYER CREDENTIAL RUNTIME TO STAGING"
          test "$EXPECTED_STAGING_PROJECT_REF" != "$DENIED_PRODUCTION_PROJECT_REF"
          [[ "$EXPECTED_STAGING_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]

      - name: Check out exact authorized main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main source and bounded release scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -f backend/src/security/playerCredentialHashing.ts
          test -f backend/supabase/functions/admin-api/index.ts
          test -f backend/supabase/functions/classroom-api/index.ts
          test -f backend/supabase/functions/player-api/index.ts
          grep -q 'player_credential_runtime_unavailable' backend/src/security/playerCredentialHashing.ts
          grep -q 'request.headers.get("idempotency-key")' \
            backend/supabase/functions/admin-api/gameProvisioningOperations.ts
          grep -q 'request.headers.get("idempotency-key")' \
            backend/src/domains/messaging/api/playerMessagingHttpHandler.ts
          grep -q 'request.headers.get("idempotency-key")' \
            backend/src/domains/messaging/api/playerMessageThreadLifecycleHttpHandler.ts
          grep -q 'request.headers.get("idempotency-key")' \
            backend/src/domains/progression/api/playerProgressionHttpHandler.ts

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate credential release contract
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test scripts/player-credential-runtime-readiness-contract.test.mjs

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1
        with:
          version: 2.109.1

      - name: Provision only a missing staging Player credential pepper
        id: pepper
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"
          names="$RUNNER_TEMP/staging-secret-names.txt"
          supabase secrets list \
            --project-ref "$EXPECTED_STAGING_PROJECT_REF" \
            > "$names"

          if grep -Eq '(^|[[:space:]])ECONOVARIA_PLAYER_CREDENTIAL_PEPPER([[:space:]]|$)' "$names"; then
            echo "mode=preserved" >> "$GITHUB_OUTPUT"
            echo "Existing staging Player credential pepper preserved."
          else
            player_credential_pepper="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(64).toString("base64url"))')"
            test "${#player_credential_pepper}" -eq 86
            PLAYER_CREDENTIAL_PEPPER="$player_credential_pepper" node - <<'NODE'
          const value = process.env.PLAYER_CREDENTIAL_PEPPER || '';
          if (!/^[A-Za-z0-9_-]{86}$/.test(value) || new Set(value).size < 20) {
            throw new Error('Generated staging Player credential pepper failed validation.');
          }
          NODE
            echo "::add-mask::$player_credential_pepper"
            supabase secrets set \
              "ECONOVARIA_PLAYER_CREDENTIAL_PEPPER=$player_credential_pepper" \
              --project-ref "$EXPECTED_STAGING_PROJECT_REF"
            unset player_credential_pepper
            echo "mode=created" >> "$GITHUB_OUTPUT"
          fi

          supabase secrets list \
            --project-ref "$EXPECTED_STAGING_PROJECT_REF" \
            > "$names"
          grep -Eq '(^|[[:space:]])ECONOVARIA_PLAYER_CREDENTIAL_PEPPER([[:space:]]|$)' "$names"
          rm -f "$names"

      - name: Capture pre-deploy function identities
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/functions-before.json"

      - name: Deploy only the required staging functions
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy admin-api \
            --workdir backend \
            --project-ref "$EXPECTED_STAGING_PROJECT_REF"
          supabase functions deploy classroom-api \
            --workdir backend \
            --project-ref "$EXPECTED_STAGING_PROJECT_REF"
          supabase functions deploy player-api \
            --workdir backend \
            --project-ref "$EXPECTED_STAGING_PROJECT_REF" \
            --no-verify-jwt

      - name: Verify staging function inventory and source markers
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 20); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_PROJECT_REF/functions" \
              > "$RUNNER_TEMP/functions-after.json"
            if FUNCTIONS_PATH="$RUNNER_TEMP/functions-after.json" node - <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync(process.env.FUNCTIONS_PATH, 'utf8'));
          const rows = Array.isArray(parsed) ? parsed : (parsed.functions || []);
          const expected = new Map([
            ['admin-api', true],
            ['classroom-api', true],
            ['player-api', false],
          ]);
          for (const [slug, verifyJwt] of expected) {
            const row = rows.find((entry) => entry.slug === slug);
            if (!row || row.status !== 'ACTIVE' || row.verify_jwt !== verifyJwt) process.exit(1);
            if (!/^[a-f0-9]{64}$/.test(String(row.ezbr_sha256 || ''))) process.exit(1);
          }
          NODE
            then
              ready=true
              break
            fi
            sleep 3
          done
          test "$ready" = true

          for function_name in admin-api classroom-api player-api; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_PROJECT_REF/functions/$function_name/body" \
              > "$RUNNER_TEMP/$function_name-body.json"
            grep -q 'player_credential_runtime_unavailable' "$RUNNER_TEMP/$function_name-body.json"
          done
          grep -q 'idempotency-key' "$RUNNER_TEMP/admin-api-body.json"
          grep -q 'idempotency-key' "$RUNNER_TEMP/classroom-api-body.json"
          grep -q 'idempotency-key' "$RUNNER_TEMP/player-api-body.json"

      - name: Verify Player API health
        shell: bash
        run: |
          set -euo pipefail
          health="$RUNNER_TEMP/player-api-health.json"
          status="$(curl --silent --show-error \
            --output "$health" \
            --write-out '%{http_code}' \
            "https://$EXPECTED_STAGING_PROJECT_REF.supabase.co/functions/v1/player-api/health")"
          test "$status" = "200"
          HEALTH_PATH="$health" node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.env.HEALTH_PATH, 'utf8'));
          if (body.ok !== true || body.service !== 'player-api' || body.status !== 'ready') {
            throw new Error('Staging Player API health response is invalid.');
          }
          NODE

      - name: Record bounded staging release result
        shell: bash
        run: |
          {
            echo '## Staging Player credential runtime released'
            echo "- Exact source SHA: \`$GITHUB_SHA\`"
            echo "- Project: \`$EXPECTED_STAGING_PROJECT_REF\`"
            echo '- Production project denied: `true`'
            echo '- Active v2 credentials confirmed: `0`'
            echo "- Pepper mode: \`${{ steps.pepper.outputs.mode }}\`"
            echo '- Functions deployed: `admin-api`, `classroom-api`, `player-api`'
            echo '- Database migrations: `none`'
            echo '- Vercel deployment: `none`'
            echo '- Function security metadata: `verified`'
            echo '- Player API health: `ready`'
          } >> "$GITHUB_STEP_SUMMARY"
