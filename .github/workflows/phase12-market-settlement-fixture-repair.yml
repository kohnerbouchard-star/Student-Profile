name: Phase 12 market settlement fixture repair

on:
  push:
    branches:
      - feat/player-business-workspace-v2
    paths:
      - ".github/workflows/phase12-market-settlement-fixture-repair.yml"

permissions:
  contents: write

concurrency:
  group: phase12-market-settlement-fixture-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: Install deterministic market settlement fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out triggering head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Confirm branch has not moved
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/feat/player-business-workspace-v2 | cut -f1)" = "$GITHUB_SHA"

      - name: Patch isolated browser fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/business-banking-player-market-browser-acceptance.core.mjs")
          source = path.read_text(encoding="utf-8")

          evidence_anchor = "  deterministicCalendarFixtureRestored: false,\n"
          evidence_insert = evidence_anchor + "  deterministicSettlementAccountFixtureInstalled: false,\n"
          if source.count(evidence_anchor) != 1:
              raise SystemExit("expected one evidence anchor")
          if "deterministicSettlementAccountFixtureInstalled" in source:
              raise SystemExit("settlement fixture evidence already present")
          source = source.replace(evidence_anchor, evidence_insert, 1)

          function_anchor = "\nfunction installOpenCalendarFixture() {\n"
          fixture_function = r'''
function installSettlementAccountFixture() {
  const accountKey = psql(`
    with scoped_player as (
      select
        player_row.game_session_id,
        player_row.id as player_id
      from public.players as player_row
      join public.game_sessions as game_row
        on game_row.id = player_row.game_session_id
      where game_row.name = 'Player Multiplayer E2E'
        and game_row.status = 'active'
        and lower(player_row.player_identifier) = lower('BROWSER-PLAYER-ALPHA')
        and player_row.status = 'active'
      order by player_row.created_at desc, player_row.id desc
      limit 1
    ), seeded as (
      select
        scoped_player.game_session_id,
        scoped_player.player_id,
        ledger_result.account_balance_id
      from scoped_player
      cross join lateral public.record_player_ledger_entry(
        scoped_player.game_session_id,
        scoped_player.player_id,
        'checking',
        10000,
        'ECO',
        'credit',
        'setup',
        'initial_balance_seed',
        null,
        'system',
        null,
        jsonb_build_object(
          'bankTransactionIdempotencyKey', 'phase12-player-market-eco-checking-v1',
          'fixture', 'player_multiplayer_market_acceptance',
          'isolated', true
        )
      ) as ledger_result
    )
    select account_row.public_key
    from seeded
    join public.economic_parties as party_row
      on party_row.game_session_id = seeded.game_session_id
     and party_row.party_kind = 'player'
     and party_row.player_id = seeded.player_id
     and party_row.status = 'active'
    join public.bank_accounts as account_row
      on account_row.game_session_id = seeded.game_session_id
     and account_row.party_id = party_row.id
     and account_row.account_kind = 'checking'
     and account_row.currency_code = 'ECO'
     and account_row.status = 'active'
    join public.account_balances as balance_row
      on balance_row.game_session_id = account_row.game_session_id
     and balance_row.bank_account_id = account_row.id
     and balance_row.balance >= 10000
    limit 1;
  `);
  if (!ACCOUNT_KEY.test(accountKey)) {
    throw new Error("Could not install the isolated ECO Checking settlement fixture.");
  }
  evidence.deterministicSettlementAccountFixtureInstalled = true;
}
'''
          if source.count(function_anchor) != 1:
              raise SystemExit("expected one calendar-function anchor")
          source = source.replace(function_anchor, "\n" + fixture_function + function_anchor, 1)

          call_anchor = "  const fixture = await gameFixture();\n  browser = await chromium.launch({ headless: true });\n"
          call_insert = "  const fixture = await gameFixture();\n  installSettlementAccountFixture();\n  browser = await chromium.launch({ headless: true });\n"
          if source.count(call_anchor) != 1:
              raise SystemExit("expected one fixture-call anchor")
          source = source.replace(call_anchor, call_insert, 1)

          path.write_text(source, encoding="utf-8")
          PY

          rm .github/workflows/phase12-market-settlement-fixture-repair.yml

      - name: Verify bounded repair
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/business-banking-player-market-browser-acceptance.core.mjs
          grep -F 'function installSettlementAccountFixture()' scripts/business-banking-player-market-browser-acceptance.core.mjs
          grep -F "'phase12-player-market-eco-checking-v1'" scripts/business-banking-player-market-browser-acceptance.core.mjs
          grep -F 'installSettlementAccountFixture();' scripts/business-banking-player-market-browser-acceptance.core.mjs
          test ! -e .github/workflows/phase12-market-settlement-fixture-repair.yml
          git diff --check

      - name: Commit permanent fixture repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(player): provision listing-currency settlement account"
          git push origin HEAD:feat/player-business-workspace-v2
