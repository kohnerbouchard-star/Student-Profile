name: Temporary Phase 3B Observed Finalization

on:
  push:
    branches:
      - feat/business-store-procurement-v2
    paths:
      - ".github/workflows/temporary-phase3b-finalize-observed.yml"

permissions:
  contents: write

concurrency:
  group: temporary-phase3b-finalization
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/business-store-procurement-v2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Execute observed finalization steps
        shell: bash
        run: |
          ruby -ropen3 -ryaml <<'RUBY'
          workflow = YAML.load_file(".github/workflows/temporary-phase3b-finalize.yml")
          steps = workflow.fetch("jobs").fetch("finalize").fetch("steps")
          start = steps.index { |step| step["name"] == "Materialize reviewed Phase 3B settlement hardening" }
          finish = steps.index { |step| step["name"] == "Commit and push bounded finalization" }
          abort("Observed finalization step range is incomplete.") unless start && finish

          File.write("/tmp/phase3b-finalization.log", "")
          steps[start..finish].each_with_index do |step, index|
            script = step["run"]
            next unless script
            name = step.fetch("name", "unnamed step")
            File.write("/tmp/phase3b-failed-step", name + "\n")

            if name == "Restore bounded Business architecture and PR-scoped authority"
              script += "\nrm -f .github/workflows/temporary-phase3b-finalize-observed.yml\n"
            elsif name == "Commit and push bounded finalization"
              script = script.sub(
                "          approved=(\n",
                "          approved=(\n            \".github/workflows/temporary-phase3b-finalize-observed.yml\"\n",
              )
            end

            path = "/tmp/phase3b-observed-step-#{index}.sh"
            File.write(path, "#!/usr/bin/env bash\nset -euo pipefail\n" + script + "\n")
            File.open("/tmp/phase3b-finalization.log", "a") do |log|
              log.puts("\n===== #{name} =====")
              Open3.popen2e("bash", path) do |_stdin, output, wait|
                output.each do |line|
                  print(line)
                  log.write(line)
                end
                abort("Observed finalization failed in: #{name}") unless wait.value.success?
              end
            end
          end
          RUBY

      - name: Publish bounded failure evidence
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          failed_step="$(cat /tmp/phase3b-failed-step 2>/dev/null || echo unknown)"
          log_tail="$(tail -n 220 /tmp/phase3b-finalization.log 2>/dev/null || true)"
          git reset --hard HEAD
          git clean -fd
          cat > .github/phase3b-finalization-failure.md <<EOF
          # Phase 3B finalization failure

          Failed step: ${failed_step}

          \`\`\`text
          ${log_tail}
          \`\`\`
          EOF
          git config user.name "econovaria-phase3b-observer"
          git config user.email "actions@users.noreply.github.com"
          git add -- .github/phase3b-finalization-failure.md
          git commit -m "chore(ci): record Phase 3B finalization failure"
          git push origin HEAD:feat/business-store-procurement-v2
