name: Business Phase 4B Converge

on:
  push:
    branches:
      - feat/business-workforce-hiring-v2
    paths:
      - ".github/workflows/business-phase4b-converge.yml"

permissions:
  contents: write

concurrency:
  group: business-phase4b-converge
  cancel-in-progress: true

jobs:
  converge:
    if: ${{ !contains(github.event.head_commit.message, 'remediate Phase 4B workforce hiring') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-workforce-hiring-v2
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            player-terminal/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3
      - run: npm install --global npm@10.9.8

      - name: Converge Phase 4B capability and runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f backend/supabase/migrations/20260822120000_business_workforce_candidate_hiring_v2.sql
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("player-terminal/src/integrations/student-profile-capability-manifest.js"),
              Path("player-terminal/tests/current-capability-manifest.mjs"),
              Path("player-terminal/tests/student-profile-adapter.mjs"),
              Path("player-terminal/tests/business-banking-surface.mjs"),
          ]
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              text = text.replace("businessHire", "businessCandidateHire")
              text = text.replace(
                  "/players/me/business/employees/hire",
                  "/players/me/business/workforce/candidates/:candidateKey/hire",
              )
              text = text.replace("2026-08-21.2", "2026-08-22.1")
              path.write_text(text, encoding="utf-8")

          runtime = Path("scripts/business-banking-runtime-contract.mjs")
          text = runtime.read_text(encoding="utf-8")
          text = text.replace("businessHire", "businessCandidateHire")
          text = re.sub(
              r'assert\.(?:match|ok|equal|deepEqual)\([^;]*hire_business_employee_v1[^;]*;\s*',
              "",
              text,
              flags=re.S,
          )
          declaration = '''
const phase4bWorkforceHiringSource = readFileSync(
  "backend/src/domains/business/api/playerBusinessWorkforce.ts",
  "utf8",
);
assert.match(
  phase4bWorkforceHiringSource,
  /hire_business_workforce_candidate_v2/u,
  "Candidate-only workforce hiring must remain wired to the Phase 4B RPC.",
);
'''
          if "phase4bWorkforceHiringSource" not in text:
              text = text.rstrip() + "\n" + declaration
          runtime.write_text(text, encoding="utf-8")

          contracts = Path("backend/src/domains/business/contracts/playerBusinessContracts.ts")
          text = contracts.read_text(encoding="utf-8")
          text = text.replace("  readWorkforceCandidates(input: {\n", "  readWorkforceCandidates?(input: {\n", 1)
          contracts.write_text(text, encoding="utf-8")

          api = Path("backend/src/domains/business/api/playerBusinessWorkforce.ts")
          text = api.read_text(encoding="utf-8")
          if "PlayerBusinessError," not in text:
              text = text.replace(
                  '  type PlayerBusinessRepository,\n} from "../contracts/playerBusinessContracts.ts";',
                  '  PlayerBusinessError,\n  type PlayerBusinessRepository,\n} from "../contracts/playerBusinessContracts.ts";',
                  1,
              )
          if "business_workforce_unavailable" not in text:
              text = text.replace(
                  "  return repository.readWorkforceCandidates(scope);",
                  '''  if (!repository.readWorkforceCandidates) {
    throw new PlayerBusinessError(
      "business_workforce_unavailable",
      "The Business workforce market is not available.",
      503,
      true,
    );
  }
  return repository.readWorkforceCandidates(scope);''',
                  1,
              )
          api.write_text(text, encoding="utf-8")

          surface = Path("player-terminal/tests/business-banking-surface.mjs")
          text = surface.read_text(encoding="utf-8")
          text = re.sub(
              r'candidateKey:\s*["\'][^"\']*["\']',
              'candidateKey: "wfc_' + ('d' * 32) + '"',
              text,
          )
          surface.write_text(text, encoding="utf-8")
          PY

      - name: Regenerate architecture inventory
        run: node scripts/architecture/build-architecture-inventory.mjs

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm --prefix backend ci --ignore-scripts
          npm --prefix player-terminal ci --no-audit --no-fund

      - name: Run convergence verification
        shell: bash
        run: |
          set -euo pipefail
          node scripts/business-workforce-hiring-contract.mjs
          node scripts/business-banking-runtime-contract.mjs
          node scripts/validate-supabase-migrations.mjs
          npm test
          npm --prefix backend run typecheck
          cd backend
          deno test --config supabase/functions/classroom-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            src/domains/business/api/playerBusinessWorkforceHiring.test.ts \
            src/domains/business/api/playerBusinessRoutePaths.test.ts
          cd ../player-terminal
          npm run check
          node tests/business-banking-surface.mjs
          npm run adapter
          npm run capability-manifest-current
          npm run runtime-integration
          cd ..
          git diff --check

      - name: Publish converged implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/roadmaps/business-phase4b-implementation-diagnostics.md
          rm -f scripts/business-phase4b-payload.py
          rm -f .github/workflows/business-phase4b-implement.yml
          rm -f .github/workflows/business-phase4b-implement-v2.yml
          rm -f .github/workflows/business-phase4b-controller.yml
          rm -f .github/workflows/business-phase4b-remediate.yml
          rm -f .github/workflows/business-phase4b-converge.yml
          rm -f .github/workflows/business-phase4b-finalize.yml
          rm -f .github/workflows/business-phase4b-source-bundle.yml
          git diff --check
          git config user.name "econovaria-phase4b-convergence"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(business): remediate Phase 4B workforce hiring"
          git push origin HEAD:feat/business-workforce-hiring-v2
