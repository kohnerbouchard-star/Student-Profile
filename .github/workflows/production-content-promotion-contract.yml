name: Production Content Promotion Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/production-canonical-content-bootstrap-v1.yml"
      - ".github/workflows/production-content-promotion-contract.yml"
      - "backend/supabase/migrations/20260730123000_add_production_content_promotion_ledger_v1.sql"
      - "scripts/production-canonical-content-bootstrap.mjs"
      - "scripts/production-content-promotion-contract.test.mjs"
      - "docs/operations/evidence/production-content-promotion-v1.json"

permissions:
  contents: read

jobs:
  verify:
    name: Verify production content promotion remains bounded
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
      - run: node --check scripts/production-canonical-content-bootstrap.mjs
      - run: node scripts/production-content-promotion-contract.test.mjs
      - run: git diff --check
