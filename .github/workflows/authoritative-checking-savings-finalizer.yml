name: Authoritative Checking and Savings Finalizer

on:
  push:
    branches:
      - fix/checking-savings-wallet-convergence-v1
    paths:
      - .github/workflows/authoritative-checking-savings-finalizer.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/checking-savings-wallet-convergence-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.3

      - name: Install pinned tooling
        run: |
          npm install --global npm@10.9.8
          npm ci
          npm --prefix backend ci

      - name: Canonicalize active Admin and Player account contracts
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          from pathlib import Path

          ROOT = Path.cwd()
          BASELINE = '4e587552855099ae6bb6a9da3407b55268ab4cb3'
          active_roots = [
              ROOT / 'admin',
              ROOT / 'backend/src',
              ROOT / 'backend/supabase/functions',
              ROOT / 'player-terminal/src',
              ROOT / 'player-terminal/tests',
              ROOT / 'player-terminal/tools',
              ROOT / 'scripts',
          ]
          suffixes = {'.ts', '.tsx', '.js', '.mjs', '.cjs', '.json', '.yml', '.yaml', '.md'}
          exact_retired = re.compile(r"(?P<quote>['\"`])cash(?P=quote)", re.IGNORECASE)
          route_retired = re.compile(
              r"(?P<quote>['\"`])(?P<before>[^'\"`]*?(?:^|[/.:_-]))cash(?P<after>(?:[/.:_-]|$)[^'\"`]*)?(?P=quote)",
              re.IGNORECASE,
          )
          public_replacements = (
              (re.compile(r'\bcashBalance\b'), 'checkingBalance'),
              (re.compile(r'\bcashCurrencyCode\b'), 'checkingCurrencyCode'),
              (re.compile(r'\bcashAccountType\b'), 'checkingAccountType'),
              (re.compile(r'\bcashAccountId\b'), 'checkingAccountId'),
              (re.compile(r'\bcashAccount\b'), 'checkingAccount'),
              (re.compile(r'\bcashWallet\b'), 'checkingWallet'),
              (re.compile(r'\bCash Balance\b'), 'Checking Balance'),
              (re.compile(r'\bcash balance\b'), 'checking balance'),
              (re.compile(r'\bCash Account\b'), 'Checking Account'),
              (re.compile(r'\bcash account\b'), 'checking account'),
              (re.compile(r'\bCash Wallet\b'), 'Checking Wallet'),
              (re.compile(r'\bcash wallet\b'), 'checking wallet'),
          )
          non_account_markers = (
              'assetclass', 'asset_class', 'cash flow', 'cash-flow',
              'cash equivalent', 'cash-equivalent', 'cash instrument',
              'cash market', 'cash price', 'cash rate', 'cash yield',
              'paymentmethod', 'payment_method',
          )

          def baseline_text(path: Path) -> str | None:
              result = subprocess.run(
                  ['git', 'show', f'{BASELINE}:{path.relative_to(ROOT).as_posix()}'],
                  text=True,
                  capture_output=True,
              )
              return result.stdout if result.returncode == 0 else None

          def is_non_account_context(lines: list[str], index: int) -> bool:
              context = '\n'.join(lines[max(0, index - 3):index + 4]).lower()
              compact = context.replace(' ', '')
              return any(marker.replace(' ', '') in compact for marker in non_account_markers)

          # Replace exact personal account keys and public account contracts.
          for base in active_roots:
              if not base.exists():
                  continue
              for path in base.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in suffixes:
                      continue
                  source = path.read_text(encoding='utf-8')
                  lines = source.splitlines()
                  updated_lines = []
                  for index, line in enumerate(lines):
                      updated = line
                      if not is_non_account_context(lines, index):
                          updated = exact_retired.sub(
                              lambda match: f"{match.group('quote')}checking{match.group('quote')}",
                              updated,
                          )
                          for pattern, replacement in public_replacements:
                              updated = pattern.sub(replacement, updated)
                      updated_lines.append(updated)
                  updated = '\n'.join(updated_lines) + ('\n' if source.endswith('\n') else '')
                  updated = updated.replace('["checking", "checking"]', '["checking"]')
                  updated = updated.replace("['checking', 'checking']", "['checking']")
                  updated = updated.replace(
                      'if (normalized === "checking" || normalized === "checking") return "checking";',
                      'if (normalized === "checking") return "checking";',
                  )
                  updated = updated.replace(
                      'if (account === "checking") return "checking";\n  if (account === "checking" || account === "savings") return account;',
                      'if (account === "checking" || account === "savings") return account;',
                  )
                  updated = updated.replace(
                      'return ["checking"].includes(accountType)',
                      'return accountType === "checking"',
                  )
                  updated = updated.replace(
                      '// Checking is the product-facing account. "checking" remains the canonical\n  // persistence key until the historical ledger schema is fully renamed.',
                      '// Checking is the canonical personal transaction account.',
                  )
                  if updated != source:
                      path.write_text(updated, encoding='utf-8')

          # Restore baseline occurrences that are clearly unrelated economic concepts.
          for base in active_roots:
              if not base.exists():
                  continue
              for path in base.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in suffixes:
                      continue
                  base_source = baseline_text(path)
                  if base_source is None:
                      continue
                  current_source = path.read_text(encoding='utf-8')
                  current_lines = current_source.splitlines()
                  base_lines = base_source.splitlines()
                  changed = False
                  for index, base_line in enumerate(base_lines):
                      if not exact_retired.search(base_line) or not is_non_account_context(base_lines, index):
                          continue
                      converted = exact_retired.sub(
                          lambda match: f"{match.group('quote')}checking{match.group('quote')}",
                          base_line,
                      )
                      if converted in current_lines:
                          current_lines[current_lines.index(converted)] = base_line
                          changed = True
                  if changed:
                      path.write_text(
                          '\n'.join(current_lines) + ('\n' if current_source.endswith('\n') else ''),
                          encoding='utf-8',
                      )

          # Enforce the canonical behavior in the known cross-surface boundaries.
          required_files = {
              'admin/ledger-adjustment-wiring.js': (
                  ('const CHECKING_LEDGER_ACCOUNT_TYPE = "checking";',),
                  ('const CHECKING_LEDGER_ACCOUNT_TYPE = "cash";',),
              ),
              'backend/supabase/functions/admin-api/playerOperations.ts': (
                  ('p_account_type: text(body.accountType, "checking")',),
                  ('p_account_type: text(body.accountType, "cash")',),
              ),
              'backend/src/domains/business-banking/api/playerBusinessBankingHttpHandler.ts': (
                  ('account === "checking" || account === "savings"',),
                  ('account === "cash"', 'return "cash"'),
              ),
          }
          for relative, (required, forbidden) in required_files.items():
              text = (ROOT / relative).read_text(encoding='utf-8')
              missing = [token for token in required if token not in text]
              present = [token for token in forbidden if token in text]
              if missing or present:
                  raise SystemExit(f'{relative} account contract mismatch; missing={missing}, forbidden={present}')
          PY

      - name: Write invariant-preserving forward migration
        shell: bash
        run: |
          cat > backend/supabase/migrations/20260806070000_canonicalize_player_checking_wallet_v1.sql <<'SQL'
          -- Canonicalize personal Player banking onto Checking and Savings.
          -- The legacy cash account type is retired. Validated business operating
          -- accounts retain their business:biz_... keys.

          begin;

          lock table public.account_balances in share row exclusive mode;
          lock table public.ledger_entries in share row exclusive mode;
          lock table public.banking_transfer_requests in share row exclusive mode;

          -- Capture only legacy CHECK constraints containing the retired account
          -- literal. Recreate each complete expression after conversion so unrelated
          -- invariants remain intact.
          create temporary table legacy_account_check_definitions (
            schema_name text not null,
            table_name text not null,
            constraint_name text not null,
            constraint_definition text not null,
            primary key (schema_name, table_name, constraint_name)
          ) on commit drop;

          insert into legacy_account_check_definitions (
            schema_name,
            table_name,
            constraint_name,
            constraint_definition
          )
          select
            namespace_row.nspname,
            table_row.relname,
            constraint_row.conname,
            pg_get_constraintdef(constraint_row.oid)
          from pg_constraint as constraint_row
          join pg_class as table_row
            on table_row.oid = constraint_row.conrelid
          join pg_namespace as namespace_row
            on namespace_row.oid = table_row.relnamespace
          where constraint_row.contype = 'c'
            and constraint_row.conrelid in (
              'public.account_balances'::regclass,
              'public.ledger_entries'::regclass,
              'public.banking_transfer_requests'::regclass
            )
            and lower(pg_get_constraintdef(constraint_row.oid)) like '%account_type%'
            and position('''cash''' in pg_get_constraintdef(constraint_row.oid)) > 0;

          do $drop_legacy_account_checks$
          declare
            legacy_constraint record;
          begin
            for legacy_constraint in
              select * from legacy_account_check_definitions
            loop
              execute format(
                'alter table %I.%I drop constraint %I',
                legacy_constraint.schema_name,
                legacy_constraint.table_name,
                legacy_constraint.constraint_name
              );
            end loop;
          end;
          $drop_legacy_account_checks$;

          -- Preserve all value when both legacy and canonical projections exist.
          update public.account_balances as checking_row
          set
            balance = round(checking_row.balance + cash_row.balance, 2),
            last_ledger_entry_id = (
              select candidate.id
              from public.ledger_entries as candidate
              where candidate.id in (
                checking_row.last_ledger_entry_id,
                cash_row.last_ledger_entry_id
              )
              order by candidate.created_at desc, candidate.id desc
              limit 1
            ),
            updated_at = greatest(checking_row.updated_at, cash_row.updated_at)
          from public.account_balances as cash_row
          where checking_row.game_session_id = cash_row.game_session_id
            and checking_row.player_id = cash_row.player_id
            and checking_row.currency_code = cash_row.currency_code
            and checking_row.account_type = 'checking'
            and cash_row.account_type = 'cash';

          delete from public.account_balances as cash_row
          using public.account_balances as checking_row
          where checking_row.game_session_id = cash_row.game_session_id
            and checking_row.player_id = cash_row.player_id
            and checking_row.currency_code = cash_row.currency_code
            and checking_row.account_type = 'checking'
            and cash_row.account_type = 'cash';

          update public.account_balances
          set account_type = 'checking'
          where account_type = 'cash';

          update public.ledger_entries
          set account_type = 'checking'
          where account_type = 'cash';

          update public.banking_transfer_requests
          set from_account_type = 'checking'
          where from_account_type = 'cash';

          update public.banking_transfer_requests
          set to_account_type = 'checking'
          where to_account_type = 'cash';

          -- Preserve each legacy CHECK expression, changing only the account literal.
          do $recreate_account_checks$
          declare
            legacy_constraint record;
            transformed_definition text;
          begin
            for legacy_constraint in
              select * from legacy_account_check_definitions
            loop
              transformed_definition := replace(
                legacy_constraint.constraint_definition,
                '''cash''',
                '''checking'''
              );
              execute format(
                'alter table %I.%I add constraint %I %s',
                legacy_constraint.schema_name,
                legacy_constraint.table_name,
                legacy_constraint.constraint_name,
                transformed_definition
              );
            end loop;
          end;
          $recreate_account_checks$;

          alter table public.account_balances
            alter column account_type set default 'checking';

          alter table public.account_balances
            drop constraint if exists account_balances_checking_alias_forbidden;
          alter table public.account_balances
            drop constraint if exists account_balances_cash_account_forbidden;
          alter table public.account_balances
            drop constraint if exists account_balances_account_model_v2;
          alter table public.account_balances
            add constraint account_balances_account_model_v2
            check (
              lower(btrim(account_type)) in ('checking', 'savings')
              or lower(btrim(account_type)) ~ '^business:biz_[0-9a-f]{32}$'
            ) not valid;
          alter table public.account_balances
            validate constraint account_balances_account_model_v2;

          alter table public.ledger_entries
            drop constraint if exists ledger_entries_account_model_v2;
          alter table public.ledger_entries
            add constraint ledger_entries_account_model_v2
            check (
              lower(btrim(account_type)) in ('checking', 'savings')
              or lower(btrim(account_type)) ~ '^business:biz_[0-9a-f]{32}$'
            ) not valid;
          alter table public.ledger_entries
            validate constraint ledger_entries_account_model_v2;

          alter table public.banking_transfer_requests
            drop constraint if exists banking_transfer_requests_account_model_v2;
          alter table public.banking_transfer_requests
            add constraint banking_transfer_requests_account_model_v2
            check (
              (from_account_type is null or lower(btrim(from_account_type)) in ('checking', 'savings'))
              and
              (to_account_type is null or lower(btrim(to_account_type)) in ('checking', 'savings'))
            ) not valid;
          alter table public.banking_transfer_requests
            validate constraint banking_transfer_requests_account_model_v2;

          create or replace function public.record_player_ledger_entry(
            p_game_session_id uuid,
            p_player_id uuid,
            p_account_type text,
            p_amount numeric,
            p_currency_code text default 'ECO',
            p_entry_type text default 'adjustment',
            p_source_domain text default 'ledger',
            p_source_action text default 'staff_player_balance_adjustment',
            p_source_id uuid default null,
            p_created_by_type text default 'staff_user',
            p_created_by_id uuid default null,
            p_audit_metadata jsonb default '{}'::jsonb
          )
          returns table (
            ledger_entry_id uuid,
            account_balance_id uuid,
            account_type text,
            balance numeric,
            currency_code text,
            created_at timestamptz
          )
          language plpgsql
          security definer
          set search_path = public, pg_temp
          as $function$
          declare
            v_player public.players%rowtype;
            v_ledger public.ledger_entries%rowtype;
            v_balance public.account_balances%rowtype;
            v_account_type text := lower(btrim(coalesce(p_account_type, 'checking')));
            v_currency_code text := upper(btrim(coalesce(p_currency_code, 'ECO')));
            v_entry_type text := btrim(coalesce(p_entry_type, 'adjustment'));
            v_source_domain text := btrim(coalesce(p_source_domain, 'ledger'));
            v_source_action text := btrim(coalesce(p_source_action, 'staff_player_balance_adjustment'));
            v_created_by_type text := btrim(coalesce(p_created_by_type, 'staff_user'));
          begin
            if p_game_session_id is null then
              raise exception 'GAME_SESSION_REQUIRED' using errcode = 'P0001';
            end if;
            if p_player_id is null then
              raise exception 'PLAYER_REQUIRED' using errcode = 'P0001';
            end if;
            if v_account_type not in ('checking', 'savings')
               and v_account_type !~ '^business:biz_[0-9a-f]{32}$' then
              raise exception 'INVALID_ACCOUNT_TYPE' using errcode = 'P0001';
            end if;
            if p_amount is null or p_amount = 0 then
              raise exception 'LEDGER_AMOUNT_REQUIRED' using errcode = 'P0001';
            end if;
            if length(v_currency_code) < 3 or length(v_currency_code) > 16 then
              raise exception 'INVALID_CURRENCY_CODE' using errcode = 'P0001';
            end if;
            if v_entry_type not in ('credit', 'debit', 'adjustment') then
              raise exception 'INVALID_LEDGER_ENTRY_TYPE' using errcode = 'P0001';
            end if;
            if length(v_source_domain) = 0 then
              raise exception 'SOURCE_DOMAIN_REQUIRED' using errcode = 'P0001';
            end if;
            if length(v_source_action) = 0 then
              raise exception 'SOURCE_ACTION_REQUIRED' using errcode = 'P0001';
            end if;
            if v_created_by_type not in ('staff_user', 'player', 'system') then
              raise exception 'INVALID_CREATED_BY_TYPE' using errcode = 'P0001';
            end if;

            select * into v_player
            from public.players
            where game_session_id = p_game_session_id
              and id = p_player_id
              and status = 'active';
            if not found then
              raise exception 'PLAYER_NOT_FOUND' using errcode = 'P0001';
            end if;

            insert into public.ledger_entries (
              game_session_id, player_id, account_type, amount, currency_code,
              entry_type, source_domain, source_action, source_id,
              created_by_type, created_by_id
            ) values (
              p_game_session_id, p_player_id, v_account_type, p_amount,
              v_currency_code, v_entry_type, v_source_domain, v_source_action,
              p_source_id, v_created_by_type, p_created_by_id
            ) returning * into v_ledger;

            insert into public.account_balances (
              game_session_id, player_id, account_type, balance,
              currency_code, last_ledger_entry_id
            ) values (
              p_game_session_id, p_player_id, v_account_type, p_amount,
              v_currency_code, v_ledger.id
            )
            on conflict on constraint account_balances_scope_unique
            do update set
              balance = public.account_balances.balance + excluded.balance,
              last_ledger_entry_id = excluded.last_ledger_entry_id
            returning * into v_balance;

            insert into public.audit_log (
              game_session_id, actor_type, actor_id, action,
              target_type, target_id, metadata
            ) values (
              p_game_session_id, v_created_by_type, p_created_by_id,
              v_source_domain || '.' || v_source_action,
              'player', p_player_id,
              jsonb_build_object(
                'ledger_entry_id', v_ledger.id,
                'account_balance_id', v_balance.id,
                'account_type', v_balance.account_type,
                'amount', v_ledger.amount,
                'balance', v_balance.balance,
                'currency_code', v_balance.currency_code,
                'source_id', p_source_id
              ) || coalesce(p_audit_metadata, '{}'::jsonb)
            );

            return query select
              v_ledger.id, v_balance.id, v_balance.account_type,
              v_balance.balance, v_balance.currency_code, v_ledger.created_at;
          end;
          $function$;

          comment on function public.record_player_ledger_entry(
            uuid, uuid, text, numeric, text, text, text, text,
            uuid, text, uuid, jsonb
          ) is
            'Atomically writes Player ledger and balance projections. Personal accounts are Checking or Savings; validated business operating accounts retain business:biz_ keys.';

          revoke all on function public.record_player_ledger_entry(
            uuid, uuid, text, numeric, text, text, text, text,
            uuid, text, uuid, jsonb
          ) from public, anon, authenticated;
          grant execute on function public.record_player_ledger_entry(
            uuid, uuid, text, numeric, text, text, text, text,
            uuid, text, uuid, jsonb
          ) to service_role;

          -- Supersede installed economic functions that still use the retired exact
          -- account literal. CREATE OR REPLACE preserves ownership and grants.
          do $account_routes$
          declare
            route record;
            definition text;
          begin
            for route in
              select function_row.oid
              from pg_proc as function_row
              join pg_namespace as namespace_row
                on namespace_row.oid = function_row.pronamespace
              where namespace_row.nspname = 'public'
                and function_row.prokind = 'f'
                and function_row.proname <> 'record_player_ledger_entry'
                and position('''cash''' in pg_get_functiondef(function_row.oid)) > 0
                and (
                  position('account_balances' in pg_get_functiondef(function_row.oid)) > 0
                  or position('record_player_ledger_entry' in pg_get_functiondef(function_row.oid)) > 0
                  or position('account_type' in pg_get_functiondef(function_row.oid)) > 0
                )
            loop
              definition := replace(pg_get_functiondef(route.oid), '''cash''', '''checking''');
              execute definition;
            end loop;

            if exists (
              select 1
              from pg_proc as function_row
              join pg_namespace as namespace_row
                on namespace_row.oid = function_row.pronamespace
              where namespace_row.nspname = 'public'
                and function_row.prokind = 'f'
                and position('''cash''' in pg_get_functiondef(function_row.oid)) > 0
                and (
                  position('account_balances' in pg_get_functiondef(function_row.oid)) > 0
                  or position('record_player_ledger_entry' in pg_get_functiondef(function_row.oid)) > 0
                  or position('account_type' in pg_get_functiondef(function_row.oid)) > 0
                )
            ) then
              raise exception 'CASH_ACCOUNT_ROUTE_REMAINS' using errcode = 'P0001';
            end if;
          end;
          $account_routes$;

          do $account_assertions$
          begin
            if exists (
              select 1 from public.account_balances
              where lower(btrim(account_type)) = 'cash'
            ) then
              raise exception 'CASH_BALANCE_PROJECTION_REMAINS' using errcode = 'P0001';
            end if;
            if exists (
              select 1 from public.ledger_entries
              where lower(btrim(account_type)) = 'cash'
            ) then
              raise exception 'CASH_LEDGER_CLASSIFICATION_REMAINS' using errcode = 'P0001';
            end if;
            if exists (
              select 1 from public.banking_transfer_requests
              where lower(btrim(coalesce(from_account_type, ''))) = 'cash'
                 or lower(btrim(coalesce(to_account_type, ''))) = 'cash'
            ) then
              raise exception 'CASH_TRANSFER_CLASSIFICATION_REMAINS' using errcode = 'P0001';
            end if;
          end;
          $account_assertions$;

          commit;
          SQL

      - name: Install permanent account and route guard
        shell: bash
        run: |
          cat > scripts/checking-savings-account-type-contract.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readdirSync, readFileSync, statSync } from "node:fs";
          import path from "node:path";

          const retiredAccount = ["ca", "sh"].join("");
          const roots = [
            "admin",
            "backend/src",
            "backend/supabase/functions",
            "player-terminal/src",
            "player-terminal/tests",
            "player-terminal/tools",
            "scripts",
          ];
          const extensions = new Set([".ts", ".tsx", ".js", ".mjs", ".cjs", ".json", ".yml", ".yaml", ".md"]);
          const accountKeywords = [
            "account", "accounttype", "account_type", "p_account_type",
            "fromaccount", "toaccount", "from_account", "to_account",
            "balance", "ledger", "wallet", "banking", "checking", "savings",
            "transfer", "settlement", "store", "business", "loan", "travel",
            "stock order", "marketplace", "reward", "capitalization",
            "spendable", "available funds", "insufficient funds",
          ];
          const nonAccountMarkers = [
            "assetclass", "asset_class", "cash flow", "cash-flow",
            "cash equivalent", "cash-equivalent", "cash instrument",
            "cash market", "cash price", "cash rate", "cash yield",
            "paymentmethod", "payment_method",
          ];
          const escaped = retiredAccount.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const quotedRetired = new RegExp(`(["'\\x60])${escaped}\\1`, "i");
          const retiredPublicContract = new RegExp(`\\b${escaped}(?:Balance|CurrencyCode|AccountType|AccountId|Account|Wallet)\\b`);
          const retiredRoute = new RegExp(`(["'\\x60])[^"'\\x60]*(?:[/.:_-])${escaped}(?=(?:[/.:_-]|$))[^"'\\x60]*\\1`, "i");
          const violations = [];

          function isAccountContext(lines, index) {
            const context = lines.slice(Math.max(0, index - 3), index + 4).join("\n").toLowerCase();
            const compact = context.replaceAll(" ", "");
            if (nonAccountMarkers.some((marker) => compact.includes(marker.replaceAll(" ", "")))) return false;
            return accountKeywords.some((keyword) => compact.includes(keyword.replaceAll(" ", "")));
          }

          function walk(directory) {
            for (const entry of readdirSync(directory)) {
              const target = path.join(directory, entry);
              const details = statSync(target);
              if (details.isDirectory()) {
                walk(target);
                continue;
              }
              if (!extensions.has(path.extname(entry).toLowerCase())) continue;
              const lines = readFileSync(target, "utf8").split(/\r?\n/);
              lines.forEach((line, index) => {
                if (!isAccountContext(lines, index)) return;
                if (quotedRetired.test(line) || retiredPublicContract.test(line) || retiredRoute.test(line)) {
                  violations.push(`${target}:${index + 1}`);
                }
              });
            }
          }

          for (const root of roots) walk(root);
          assert.deepEqual(
            violations,
            [],
            `Retired personal account key, public contract, or route remains:\n${violations.join("\n")}`,
          );
          console.log("Checking/Savings account and route guard passed across active Admin, Player, API, runners, and tests.");
          EOF

