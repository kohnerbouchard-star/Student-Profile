name: Business Phase 4B Trigger Consolidation Fix

on:
  push:
    branches:
      - feat/business-workforce-hiring-v2
    paths:
      - ".github/workflows/business-phase4b-trigger-consolidation-fix.yml"

permissions:
  contents: write

concurrency:
  group: business-phase4b-trigger-consolidation-fix
  cancel-in-progress: false

jobs:
  repair-and-trigger:
    if: ${{ !contains(github.event.head_commit.message, 'apply Phase 4B consolidation fixes') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-workforce-hiring-v2
          fetch-depth: 0

      - name: Repair deterministic generator defects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          payload = Path("scripts/business-phase4b-payload.py")
          payload_text = payload.read_text(encoding="utf-8")
          old_route_assertion = r'''assert.match(routes, /business\/workforce\/candidates/u);'''
          new_route_assertion = r'''assert.match(
  routes,
  /tail\[1\] === "workforce" && tail\[2\] === "candidates"/u,
);'''
          if old_route_assertion not in payload_text:
              raise SystemExit("Phase 4B route assertion marker was not found")
          payload.write_text(
              payload_text.replace(old_route_assertion, new_route_assertion, 1),
              encoding="utf-8",
          )

          consolidator = Path(
              ".github/workflows/business-phase4b-consolidate-v4.yml"
          )
          consolidator_text = consolidator.read_text(encoding="utf-8")
          old_reader = "const phase4bWorkforceHiringSource = readFileSync("
          new_reader = "const phase4bWorkforceHiringSource = await readFile("
          if old_reader not in consolidator_text:
              raise SystemExit("Phase 4B runtime contract reader marker was not found")
          consolidator_text = consolidator_text.replace(
              old_reader,
              new_reader,
              1,
          )
          marker = "# Consolidation generator defects repaired on 2026-08-22.\n"
          if not consolidator_text.startswith(marker):
              consolidator_text = marker + consolidator_text
          consolidator.write_text(consolidator_text, encoding="utf-8")
          PY

          rm .github/workflows/business-phase4b-trigger-consolidation-fix.yml
          git diff --check
          git config user.name econovaria-phase4b-repair
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "ci(business): apply Phase 4B consolidation fixes"
          git push origin HEAD:feat/business-workforce-hiring-v2
