name: C2 selector repair once

on:
  push:
    branches:
      - feat/multicurrency-marketplace-funding-v1
    paths:
      - .github/workflows/c2-selector-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/multicurrency-marketplace-funding-v1
          fetch-depth: 0
      - name: Repair exact lifecycle selector
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path("player-terminal/tests/marketplace-connected-lifecycle.mjs")
          source = path.read_text()
          old = '  `value="${listingId}"`,\n'
          new = '  `data-listing-id="${listingId}"`,\n'
          if source.count(old) != 1:
              raise SystemExit("expected exactly one obsolete listing value selector")
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player-terminal/tests/marketplace-connected-lifecycle.mjs
          git commit -m "test(marketplace-funding): follow quote form listing selector"
          git push origin HEAD:feat/multicurrency-marketplace-funding-v1
