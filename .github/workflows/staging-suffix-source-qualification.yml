name: Source-only staging suffix qualification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/staging-suffix-source-qualification.yml'
      - 'scripts/operations/staging-suffix-qualification/**'
      - 'scripts/operations/live-migration-reconciliation/**'
      - 'backend/supabase/migrations/**'
      - 'backend/supabase/config.toml'
  push:
    branches: ['fix/staging-suffix-source-*']
    paths:
      - '.github/workflows/staging-suffix-source-qualification.yml'
      - 'scripts/operations/staging-suffix-qualification/**'
      - 'scripts/operations/live-migration-reconciliation/**'
      - 'backend/supabase/migrations/**'
      - 'backend/supabase/config.toml'
permissions:
  contents: read
jobs:
  qualify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: '2.109.1'
      - name: Source-only contracts
        run: node --test scripts/operations/staging-suffix-qualification/contract.test.mjs
      - name: Fenced repository-only PostgreSQL qualification
        run: node scripts/operations/staging-suffix-qualification/run.mjs
      - name: Keep bounded synthetic result only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-only-suffix-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/suffix-source-result.json
          if-no-files-found: error
          retention-days: 7
