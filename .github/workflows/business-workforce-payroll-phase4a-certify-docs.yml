name: Business Workforce Payroll Phase 4A Certify Docs

on:
  pull_request:
    paths:
      - ".github/workflows/business-workforce-payroll-phase4a-certify-docs.yml"

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  certify-docs:
    if: github.event.pull_request.number == 657
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      FEATURE_BRANCH: feat/business-workforce-payroll-foundation-v2
      IMPLEMENTATION_SHA: f72626f055004007823eb8de22569035ac897797
      EXACT_HEAD_SHA: 1c405c86d773d133fb13da268a95a32eb46a9bd7
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-workforce-payroll-foundation-v2
          fetch-depth: 0

      - name: Verify gates and record certification
        shell: bash
        run: |
          set -euo pipefail
          current_sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$IMPLEMENTATION_SHA" "$EXACT_HEAD_SHA"
          git merge-base --is-ancestor "$EXACT_HEAD_SHA" "$current_sha"
          test "$(git diff --name-only "$EXACT_HEAD_SHA" "$current_sha")" = ".github/workflows/business-workforce-payroll-phase4a-certify-docs.yml"

          CURRENT_SHA="$current_sha" python3 - <<'PY'
          import json, os, re, urllib.request
          from datetime import date
          from pathlib import Path

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          impl = os.environ["IMPLEMENTATION_SHA"]
          exact = os.environ["EXACT_HEAD_SHA"]
          current = os.environ["CURRENT_SHA"]
          required = [
              "Business Workforce Payroll V2", "Database Replay",
              "Backend Typecheck", "Business Banking Runtime",
              "Repository Quality", "Runtime Interaction Wiring",
              "Supply Chain Security", "Admin API Check",
              "Staging Readiness Preflight",
              "Required Game Market Timezone", "Exchange Calendar Runtime",
          ]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?head_sha={exact}&per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              runs = json.load(response).get("workflow_runs", [])
          evidence = {}
          for name in required:
              ok = [r for r in runs if r.get("name") == name and
                    r.get("head_sha") == exact and
                    r.get("status") == "completed" and
                    r.get("conclusion") == "success"]
              if not ok:
                  raise SystemExit(f"Missing successful exact-head gate: {name}")
              ok.sort(key=lambda r: (r.get("created_at") or "", r.get("run_attempt") or 0), reverse=True)
              evidence[name] = ok[0]["id"]

          plan_path = Path("docs/roadmaps/business-v2-development-execution-plan-v1.md")
          log_path = Path("docs/roadmaps/business-v2-development-execution-log-v1.md")
          plan = plan_path.read_text(encoding="utf-8")
          start = plan.index("## Phase 4 — Workforce capacity and payroll")
          end = plan.index("\n## Phase 5 — Equipment capacity", start)
          phase = plan[start:end]
          phase, count = re.subn(
              r"\*\*Status:\*\*[^\n]*",
              "**Status:** IN PROGRESS — checkpoint A complete; candidate pools and server-owned hiring remain open",
              phase, count=1,
          )
          if count != 1:
              raise SystemExit("Phase 4 status not found")
          checkpoint = f"- **4A:** canonical workforce/payroll authority foundation and scope hardening, certified source `{impl}`."
          if checkpoint not in phase:
              phase = phase.replace("\nExit:", "\nCertified checkpoints:\n\n" + checkpoint + "\n\nExit:", 1)
          plan_path.write_text((plan[:start] + phase + plan[end:]).rstrip() + "\n", encoding="utf-8")

          log = log_path.read_text(encoding="utf-8")
          if impl not in log:
              lines = [
                  "", "---",
                  f"## {date.today().isoformat()} — Phase 4A COMPLETE: workforce and payroll authority foundation",
                  "", "### Certified state", "",
                  f"- **Exact implementation SHA:** `{impl}`.",
                  f"- **Exact required-gate head:** `{exact}`.",
                  f"- **Certification workflow source:** `{current}`.",
                  "- Feature branch: `feat/business-workforce-payroll-foundation-v2`; stacked draft PR #657.",
                  "- PR #648 and parent Phase 3 PR #656 remained open, draft, and unmerged.",
                  "- No staging or production deployment or live data mutation was performed.",
                  "", "### What changed", "",
                  "- Added canonical workforce roles, game-scoped candidate offers, recipe labor requirements, finite labor reservations, payroll runs, and payroll entries.",
                  "- Bound labor and payroll evidence to one Business, employee, role, run, game, country, and currency scope.",
                  "- Preserved service-owned economics, public-key browser contracts, game isolation, immutable payroll evidence, and the no-settlement/no-production-integration boundary.",
                  "", "### Exact-head verification", "",
              ]
              lines += [f"- **{name} — PASS** (`{evidence[name]}`, head `{exact}`)." for name in required]
              lines += [
                  "- **Player Terminal Verify and Chromium browser verification — PASS** in finalizer run `32544375336` attempt 2.",
                  "", "### Blocker resolution", "",
                  "- The original finalizer passed all implementation, browser, and exact-head gates but failed in its workflow-file cleanup/certification write.",
                  "- This bounded docs-only certifier independently revalidated every required exact-head run and recorded the certification without weakening any gate or ratchet.",
                  "", "### Decisions and remaining work", "",
                  "- Workforce economics and finite capacity remain server authority; Phase 4A records payroll evidence but performs no settlement and no production-labor integration.",
                  "- Phase 4 remains incomplete. Payroll settlement and production-labor integration remain closed.",
                  "", "### Next authorized step", "",
                  "**Phase 4B — candidate pools and server-owned hiring is OPEN.** Expose role-grouped, game-scoped candidates; derive wage, skill, productivity, capacity, country, and currency from server-owned candidate rows; atomically reserve candidates; prevent duplicate active hires; and retire new Player execution through the legacy free-text hiring RPC.",
              ]
              log_path.write_text(log.rstrip() + "\n" + "\n".join(lines) + "\n", encoding="utf-8")
          PY

          git diff --check
          git fetch origin "$FEATURE_BRANCH"
          test "$(git rev-parse origin/$FEATURE_BRANCH)" = "$current_sha"
          git config user.name "econovaria-phase4a-certifier"
          git config user.email "actions@users.noreply.github.com"
          git add docs/roadmaps/business-v2-development-execution-plan-v1.md docs/roadmaps/business-v2-development-execution-log-v1.md
          git commit -m "docs(business): certify Phase 4A workforce foundation"
          git push origin HEAD:feat/business-workforce-payroll-foundation-v2
