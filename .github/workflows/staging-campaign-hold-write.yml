name: Staging Campaign Exclusive Hold
on:
  push:
    branches: [chore/staging-suffix-permission-preflight-20261126]
    paths: [scripts/operations/staging-campaign-hold-admission/operation.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: staging-campaign-exclusive-hold
  cancel-in-progress: false
jobs:
  admit:
    if: >-
      github.event_name == 'push' && github.repository == 'kohnerbouchard-star/Student-Profile' &&
      github.repository_id == '1264495890' && github.event.repository.private == false &&
      github.actor_id == '287640607' && github.event.sender.id == 287640607 &&
      github.event.repository.owner.id == 287640607 && github.event.sender.type == 'User' &&
      !github.event.created && !github.event.deleted && !github.event.forced && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    outputs:
      admitted: ${{ steps.admit.outputs.admitted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - id: admit
        run: node scripts/operations/staging-campaign-hold-admission/run.mjs admit
  operate:
    needs: admit
    if: success() && needs.admit.outputs.admitted != ''
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Verify native owner approval for exact evidence and operation
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPAIGN_ADMITTED: ${{ needs.admit.outputs.admitted }}
        run: node scripts/operations/staging-campaign-hold-admission/run.mjs verify-review
      - name: Verify exact staging provider runtime and fence flag
        id: provider
        if: success() && steps.review.outputs.reviewed == needs.admit.outputs.admitted
        env:
          CAMPAIGN_ADMITTED: ${{ needs.admit.outputs.admitted }}
          CAMPAIGN_REVIEWED: ${{ steps.review.outputs.reviewed }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/operations/staging-campaign-hold-admission/run.mjs verify-provider
      - name: Run the exact staging Campaign operation
        if: success() && steps.provider.outputs.gate != ''
        env:
          CAMPAIGN_ADMITTED: ${{ needs.admit.outputs.admitted }}
          CAMPAIGN_REVIEWED: ${{ steps.review.outputs.reviewed }}
          CAMPAIGN_PROVIDER_GATE: ${{ steps.provider.outputs.gate }}
          STAGING_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/operations/staging-campaign-hold-admission/run.mjs execute
