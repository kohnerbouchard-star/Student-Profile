name: Story Narrative S3 Implement And Verify
# attempt 4: generated-test typing fixes

on:
  push:
    branches:
      - feat/story-narrative-convergence-v1
    paths:
      - ".github/workflows/story-narrative-s3-implement.yml"

permissions:
  contents: write

concurrency:
  group: story-narrative-s3-implement
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact story branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard S2 boundary and S3 inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/story-narrative-convergence-v1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 25aeb0bfdc7908180dcfe20e78589b7a3091a942 HEAD
          test -f docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md
          test -f docs/story/relationship-state-v1.sql.body
          test -f scripts/story-narrative-s3-apply.py
          test -f scripts/story-narrative-s3-normalize.py
          python3 -m py_compile scripts/story-narrative-s3-apply.py scripts/story-narrative-s3-normalize.py

      - name: Persist S3 attempt 3 evidence before retry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md")
          text = path.read_text(encoding="utf-8")
          heading = "### Run 2026-08-11 — S3 verification attempt 3"
          if heading not in text:
              marker = "\n## Run-completion rule\n"
              entry = '''
### Run 2026-08-11 — S3 verification attempt 3

Workflow run: `31447867568`  
Workflow head: `315de96898a68d04c3098427d87d1ae31dfb072e`  
Ephemeral generated migration: `20260811005947_add_story_relationship_state_v1.sql`

Result: FULL S3 SOURCE TRANSFORM APPLIED EPHEMERALLY; FAILED AT TYPECHECK; NO S3 IMPLEMENTATION COMMIT WAS PUBLISHED.

Passed before failure:

- exact branch/S2 ancestry and staged-input guard;
- pinned Node, Deno, and Supabase CLI setup;
- CLI-generated migration placement;
- guarded pre-normalization, complete S3 source transform, and post-normalization;
- `git diff --check`;
- `npm ci` with zero reported vulnerabilities.

Typecheck failure was limited to generated tests:

- `supabasePlayerStoryContextRepository.test.ts` accessed optional `relationships` without optional chaining;
- `supabaseStoryRelationshipWriter.test.ts` used a concrete fake RPC function that did not satisfy the writer client's generic RPC signature;
- no S3 runtime implementation file produced the reported compiler errors.

Correction:

- generated context test now uses optional chaining for the compatibility-optional relationship map;
- generated writer test casts its intentionally minimal fake client at the test boundary while preserving the runtime generic client contract.

Next: rerun full S3 verification and proceed to focused relationship/runtime tests if typecheck clears.
'''
              if marker not in text:
                  raise SystemExit("roadmap run-completion marker missing")
              path.write_text(text.replace(marker, entry + marker, 1), encoding="utf-8")
          PY
          git diff --check
          if ! git diff --quiet -- docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md; then
            git add docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(story): record S3 verification attempt 3"
            git push origin HEAD:feat/story-narrative-convergence-v1
          fi

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.3

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.109.1

      - name: Generate S3 migration and apply guarded source transform
        shell: bash
        run: |
          set -euo pipefail
          find backend/supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/migrations-before.txt"
          (cd backend && supabase migration new add_story_relationship_state_v1)
          find backend/supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/migrations-after.txt"
          MIGRATION_NAME="$(comm -13 "$RUNNER_TEMP/migrations-before.txt" "$RUNNER_TEMP/migrations-after.txt" | grep '_add_story_relationship_state_v1.sql$')"
          test -n "$MIGRATION_NAME"
          test "$(printf '%s\n' "$MIGRATION_NAME" | wc -l)" = "1"
          MIGRATION="backend/supabase/migrations/$MIGRATION_NAME"
          cat docs/story/relationship-state-v1.sql.body > "$MIGRATION"
          echo "MIGRATION=$MIGRATION" >> "$GITHUB_ENV"
          echo "MIGRATION_NAME=$MIGRATION_NAME" >> "$GITHUB_ENV"
          python3 scripts/story-narrative-s3-normalize.py --pre
          python3 scripts/story-narrative-s3-apply.py
          python3 scripts/story-narrative-s3-normalize.py --post
          git diff --check

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Verify backend and Edge types
        working-directory: backend
        run: npm run typecheck:all

      - name: Verify S3 relationship contracts and writer
        working-directory: backend
        run: npm run test:story-relationships

      - name: Verify Player context, conditions, and effect engine
        working-directory: backend
        run: deno test --config supabase/functions/deno.json --lock=supabase/functions/deno.lock --frozen src/domains/storylines/infrastructure/supabasePlayerStoryContextRepository.test.ts src/domains/storylines/services/storyConditionEngine.test.ts src/domains/storylines/services/storyEffectEngine.test.ts

      - name: Verify S3 migration contract
        working-directory: backend
        shell: bash
        run: deno test --allow-read="$MIGRATION" --config supabase/functions/deno.json --lock=supabase/functions/deno.lock --frozen src/domains/storylines/tests/storyRelationshipMigrationContract.test.ts -- "$MIGRATION"

      - name: Verify story scheduler integration
        working-directory: backend
        run: npm run test:stock-market-calendar

      - name: Update persistent roadmap for S3 success
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path("docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md")
          text = path.read_text(encoding="utf-8")
          old = "### S3 — Relationship state\n\nStatus: IN PROGRESS"
          new = "### S3 — Relationship state\n\nStatus: COMPLETE ON BRANCH / CONNECTED STAGING PENDING"
          if old not in text:
              raise SystemExit("S3 roadmap status anchor missing")
          text = text.replace(old, new, 1)
          marker = "\n## Run-completion rule\n"
          entry = f'''\n### Run 2026-08-11 — S3 relationship state landed\n\nWorkflow run: `{os.environ["GITHUB_RUN_ID"]}`  \nSource head verified by runner: `{os.environ["GITHUB_SHA"]}`  \nMigration: `{os.environ["MIGRATION_NAME"]}`\n\nResult: SOURCE + FOCUSED REGRESSION GREEN ON BRANCH.\n\nImplemented:\n\n- private relationship state keyed by `(game, Player, characterKey)`;\n- bounded trust/respect/affinity/obligation/suspicion metrics and derived standing tiers;\n- immutable adjustment history with exact Story event/effect replay authority;\n- authored `relationship_adjust` Story effect;\n- relationship metric/standing Story conditions;\n- relationship hydration into authoritative `PlayerStoryContext`;\n- existing Story runner wiring through `SupabaseStoryRelationshipWriter`;\n- no browser write surface and no raw numeric Player relationship meter.\n\nVerification: `git diff --check`, `npm run typecheck:all`, S3 contract/writer/context/condition/effect/migration tests, and `npm run test:stock-market-calendar`.\n\nRemaining S3 acceptance: connected staging database replay plus one event -> relationship mutation -> later condition match before merge.\n\nNext: S4 authoritative choice consequences and delayed callbacks.\n'''
          if marker not in text:
              raise SystemExit("roadmap run-completion marker missing")
          path.write_text(text.replace(marker, entry + marker, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Remove temporary S3 transport
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/story-narrative-s3-implement.yml
          rm -f .github/workflows/story-narrative-s3-bootstrap.yml
          rm -f docs/story/relationship-state-v1.sql.body
          rm -f scripts/story-narrative-s3-apply.py
          rm -f scripts/story-narrative-s3-normalize.py

      - name: Commit verified S3 implementation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(story): add recurring character relationship state"
          git push origin HEAD:feat/story-narrative-convergence-v1
