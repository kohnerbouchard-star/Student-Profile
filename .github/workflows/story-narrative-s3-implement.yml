name: Story Narrative S3 Implement And Verify

on:
  push:
    branches:
      - feat/story-narrative-convergence-v1
    paths:
      - ".github/workflows/story-narrative-s3-implement.yml"

permissions:
  contents: write

concurrency:
  group: story-narrative-s3-implement
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact story branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify S2 boundary and S3 staged schema
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/story-narrative-convergence-v1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 25aeb0bfdc7908180dcfe20e78589b7a3091a942 HEAD
          test -f docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md
          test -f docs/story/relationship-state-v1.sql.body

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.3

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.109.1

      - name: Generate relationship migration
        shell: bash
        run: |
          set -euo pipefail
          find backend/supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/migrations-before.txt"
          (
            cd backend
            supabase migration new add_story_relationship_state_v1
          )
          find backend/supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/migrations-after.txt"
          MIGRATION_NAME="$(comm -13 "$RUNNER_TEMP/migrations-before.txt" "$RUNNER_TEMP/migrations-after.txt" | grep '_add_story_relationship_state_v1.sql$')"
          test -n "$MIGRATION_NAME"
          MIGRATION="backend/supabase/migrations/$MIGRATION_NAME"
          cat docs/story/relationship-state-v1.sql.body > "$MIGRATION"
          echo "MIGRATION=$MIGRATION" >> "$GITHUB_ENV"
          echo "MIGRATION_NAME=$MIGRATION_NAME" >> "$GITHUB_ENV"

      - name: Apply S3 domain and runtime source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
          def replace_once(path, old, new):
              text = read(path)
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {text.count(old)}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))
          def insert_before(path, marker, addition):
              text = read(path)
              if text.count(marker) != 1:
                  raise SystemExit(f'{path}: expected one marker, found {text.count(marker)}: {marker[:100]!r}')
              write(path, text.replace(marker, addition + marker, 1))

          # New relationship contracts.
          write('backend/src/domains/storylines/contracts/storyRelationshipContracts.ts', '''export const STORY_RELATIONSHIP_METRICS = [
  "trust",
  "respect",
  "affinity",
  "obligation",
  "suspicion",
] as const;

export const STORY_RELATIONSHIP_STANDINGS = [
  "hostile",
  "strained",
  "neutral",
  "trusted",
  "allied",
] as const;

export type StoryRelationshipMetric = typeof STORY_RELATIONSHIP_METRICS[number];
export type StoryRelationshipStanding = typeof STORY_RELATIONSHIP_STANDINGS[number];

export interface StoryRelationshipState {
  readonly characterKey: string;
  readonly trust: number;
  readonly respect: number;
  readonly affinity: number;
  readonly obligation: number;
  readonly suspicion: number;
  readonly standing: StoryRelationshipStanding;
}

export type PlayerStoryRelationships = Readonly<Record<string, StoryRelationshipState>>;

export function relationshipStandingForScore(score: number): StoryRelationshipStanding {
  if (score <= -50) return "hostile";
  if (score <= -15) return "strained";
  if (score < 35) return "neutral";
  if (score < 70) return "trusted";
  return "allied";
}

export function relationshipStandingScore(state: StoryRelationshipState): number {
  return Math.round(
    state.trust * 0.35 +
    state.respect * 0.25 +
    state.affinity * 0.2 +
    state.obligation * 0.1 -
    state.suspicion * 0.35
  );
}
''')

