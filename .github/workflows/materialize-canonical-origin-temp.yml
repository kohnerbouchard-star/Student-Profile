name: Materialize Canonical Econovaria Origin

on:
  push:
    branches:
      - fix/econovaria-canonical-origin-v1
    paths:
      - ".github/workflows/materialize-canonical-origin-temp.yml"

permissions:
  contents: write

concurrency:
  group: materialize-canonical-origin-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/econovaria-canonical-origin-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"

      - name: Replace active canonical-origin references
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const canonical = 'https://econovaria.com';
          const legacy = 'https://econovaria.vercel.app';

          function read(file) {
            return fs.readFileSync(file, 'utf8');
          }

          function write(file, value) {
            fs.writeFileSync(file, value);
          }

          function replaceExact(file, before, after, expectedCount = 1) {
            const source = read(file);
            const count = source.split(before).length - 1;
            if (count !== expectedCount) {
              throw new Error(`${file}: expected ${expectedCount} occurrence(s), found ${count}: ${before}`);
            }
            write(file, source.split(before).join(after));
          }

          replaceExact(
            'backend/src/platform/supabase/edgeResponse.ts',
            `const PRODUCTION_BROWSER_ORIGIN = "${legacy}";`,
            `const PRODUCTION_BROWSER_ORIGIN = "${canonical}";`,
          );

          replaceExact(
            'backend/supabase/functions/admin-email-verification/index.ts',
            `const DEFAULT_RETURN_URL = "${legacy}/?mode=admin&reason=email-verified";`,
            `const DEFAULT_RETURN_URL = "${canonical}/?mode=admin&reason=email-verified";`,
          );

          replaceExact(
            'backend/supabase/functions/admin-password-recovery/index.ts',
            legacy,
            canonical,
            3,
          );

          replaceExact(
            'backend/supabase/auth-email-template-manifest.json',
            legacy,
            canonical,
            3,
          );

          replaceExact(
            'scripts/password-recovery-frontend-contract.test.mjs',
            legacy,
            canonical,
            2,
          );

          replaceExact(
            'scripts/admin-bff-request-auth.test.mjs',
            legacy,
            canonical,
            2,
          );

          replaceExact(
            '.github/workflows/admin-password-recovery-release.yml',
            legacy,
            canonical,
            6,
          );
          replaceExact(
            '.github/workflows/admin-password-recovery-release.yml',
            'replace the recovery email ConfirmationURL with the Vercel TokenHash confirmation link',
            'replace the recovery email ConfirmationURL with the canonical TokenHash confirmation link',
          );

          replaceExact(
            'docs/operations/release-requests/admin-password-recovery-release-v1.json',
            legacy,
            canonical,
            3,
          );
          replaceExact(
            'docs/operations/release-requests/admin-password-recovery-release-v1.json',
            'replace the recovery email ConfirmationURL with the Vercel TokenHash confirmation link',
            'replace the recovery email ConfirmationURL with the canonical TokenHash confirmation link',
          );

          const oldAllowed = [
            legacy,
            'https://econovaria-econovaria.vercel.app',
            'https://econovaria-git-main-econovaria.vercel.app',
          ].join(',');
          const newAllowed = [
            canonical,
            'https://www.econovaria.com',
            legacy,
            'https://econovaria-econovaria.vercel.app',
            'https://econovaria-git-main-econovaria.vercel.app',
          ].join(',');

          replaceExact(
            '.github/workflows/production-web-session-secrets.yml',
            `  PRODUCTION_ORIGIN: ${legacy}`,
            `  PRODUCTION_ORIGIN: ${canonical}`,
          );
          replaceExact(
            '.github/workflows/production-web-session-secrets.yml',
            `  PRODUCTION_ALLOWED_ORIGINS: ${oldAllowed}`,
            `  PRODUCTION_ALLOWED_ORIGINS: ${newAllowed}`,
          );
          replaceExact(
            '.github/workflows/production-web-session-secrets.yml',
            `          test "$PRODUCTION_ORIGIN" = "${legacy}"`,
            `          test "$PRODUCTION_ORIGIN" = "${canonical}"`,
          );
          replaceExact(
            '.github/workflows/production-web-session-secrets.yml',
            `          test "$PRODUCTION_ALLOWED_ORIGINS" = "${oldAllowed}"`,
            `          test "$PRODUCTION_ALLOWED_ORIGINS" = "${newAllowed}"`,
          );
          replaceExact(
            '.github/workflows/production-web-session-secrets.yml',
            "            echo '- Allowed production origins configured: `3 exact Vercel aliases`'",
            "            echo '- Allowed production origins configured: `5 exact migration origins`'",
          );

          replaceExact(
            'scripts/web-session-release-contract.test.mjs',
            `    "${oldAllowed}";`,
            `    "${newAllowed}";`,
          );

          replaceExact(
            'package.json',
            'scripts/internal-runner-auth-contract.test.mjs && node --experimental-strip-types --test scripts/admin-bff-request-auth.test.mjs',
            'scripts/internal-runner-auth-contract.test.mjs scripts/canonical-production-origin-contract.test.mjs && node --experimental-strip-types --test scripts/admin-bff-request-auth.test.mjs',
          );

          const contract = `import assert from "node:assert/strict";
import fs from "node:fs";
import path from "node:path";
import test from "node:test";
import { fileURLToPath } from "node:url";

const ROOT = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");
const CANONICAL_ORIGIN = "https://econovaria.com";
const LEGACY_ORIGIN = "https://econovaria.vercel.app";

function read(relativePath) {
  return fs.readFileSync(path.join(ROOT, relativePath), "utf8");
}

const canonicalOnlyFiles = [
  "backend/src/platform/supabase/edgeResponse.ts",
  "backend/supabase/functions/admin-email-verification/index.ts",
  "backend/supabase/functions/admin-password-recovery/index.ts",
  "backend/supabase/auth-email-template-manifest.json",
  ".github/workflows/admin-password-recovery-release.yml",
  "docs/operations/release-requests/admin-password-recovery-release-v1.json",
  "scripts/password-recovery-frontend-contract.test.mjs",
  "scripts/admin-bff-request-auth.test.mjs",
];

test("active Auth and browser source uses the custom Econovaria origin", () => {
  for (const relativePath of canonicalOnlyFiles) {
    const source = read(relativePath);
    assert.ok(source.includes(CANONICAL_ORIGIN), relativePath + " is missing the canonical origin");
    assert.equal(source.includes(LEGACY_ORIGIN), false, relativePath + " still emits the legacy origin");
  }
});

test("Auth email environment routes target the custom domain", () => {
  const manifest = JSON.parse(read("backend/supabase/auth-email-template-manifest.json"));
  assert.equal(manifest.environments.staging.appSignInUrl, CANONICAL_ORIGIN + "/?mode=admin");
  assert.equal(manifest.environments.production.appSignInUrl, CANONICAL_ORIGIN + "/?mode=admin");
  assert.equal(
    manifest.environments.production.recoveryReviewUrl,
    CANONICAL_ORIGIN + "/auth/recovery-start.html",
  );
});

test("production CORS provisioning prefers the custom domain and retains bounded migration aliases", () => {
  const workflow = read(".github/workflows/production-web-session-secrets.yml");
  const expected = [
    CANONICAL_ORIGIN,
    "https://www.econovaria.com",
    LEGACY_ORIGIN,
    "https://econovaria-econovaria.vercel.app",
    "https://econovaria-git-main-econovaria.vercel.app",
  ].join(",");
  assert.ok(workflow.includes("PRODUCTION_ORIGIN: " + CANONICAL_ORIGIN));
  assert.ok(workflow.includes("PRODUCTION_ALLOWED_ORIGINS: " + expected));
  assert.equal(workflow.includes("ECONOVARIA_WEB_ALLOWED_ORIGINS=*"), false);
});

test("the domain cutover keeps the legacy origin only as an explicit migration fallback", () => {
  const workflow = read(".github/workflows/econovaria-domain-cutover.yml");
  assert.ok(workflow.includes("PRODUCTION_ORIGIN: " + CANONICAL_ORIGIN));
  assert.ok(workflow.includes("LEGACY_PRODUCTION_ORIGIN: " + LEGACY_ORIGIN));
  assert.ok(workflow.includes("WWW_ORIGIN: https://www.econovaria.com"));
});
`;
          write('scripts/canonical-production-origin-contract.test.mjs', contract);
          NODE

      - name: Validate canonical-origin contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/canonical-production-origin-contract.test.mjs
          node --test \
            scripts/canonical-production-origin-contract.test.mjs \
            scripts/password-recovery-frontend-contract.test.mjs \
            scripts/web-session-release-contract.test.mjs \
            scripts/verified-staff-onboarding-contract.test.mjs \
            scripts/auth-email-template-contract.test.mjs
          node --experimental-strip-types --test scripts/admin-bff-request-auth.test.mjs
          git diff --check

      - name: Commit reviewed source migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            backend/src/platform/supabase/edgeResponse.ts \
            backend/supabase/functions/admin-email-verification/index.ts \
            backend/supabase/functions/admin-password-recovery/index.ts \
            backend/supabase/auth-email-template-manifest.json \
            .github/workflows/admin-password-recovery-release.yml \
            .github/workflows/production-web-session-secrets.yml \
            docs/operations/release-requests/admin-password-recovery-release-v1.json \
            package.json \
            scripts/admin-bff-request-auth.test.mjs \
            scripts/canonical-production-origin-contract.test.mjs \
            scripts/password-recovery-frontend-contract.test.mjs \
            scripts/web-session-release-contract.test.mjs
          git rm -- .github/workflows/materialize-canonical-origin-temp.yml
          git diff --cached --check
          git commit -m "fix(origin): make econovaria.com canonical"
          git push origin HEAD:fix/econovaria-canonical-origin-v1
