name: Temporary Phase 3B Hardening Instrumentation V2

on:
  push:
    branches:
      - feat/business-store-procurement-v2
    paths:
      - ".github/workflows/temporary-phase3b-instrument-hardening-v2.yml"

permissions:
  contents: write

jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/business-store-procurement-v2
          fetch-depth: 0

      - name: Instrument native hardening and remove opaque runners
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          reporter = base64.b64decode(
              ""
          ).decode("utf-8")
          hardening = Path(".github/workflows/temporary-phase3b-ci-repair.yml")
          source = hardening.read_text(encoding="utf-8")
          if "Publish bounded hardening failure evidence" not in source:
              hardening.write_text(source.rstrip() + reporter + "\n", encoding="utf-8")

          for temporary in (
              ".github/workflows/temporary-phase3b-finalize.yml",
              ".github/workflows/temporary-phase3b-finalize-observed.yml",
              ".github/workflows/temporary-phase3b-instrument-hardening.yml",
              ".github/workflows/temporary-phase3b-instrument-hardening-v2.yml",
              ".github/phase3b-finalization-failure.md",
          ):
              Path(temporary).unlink(missing_ok=True)
          PY
          git diff --check

      - name: Commit and trigger native hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "econovaria-phase3b-instrumenter"
          git config user.email "actions@users.noreply.github.com"
          for path in \
            .github/workflows/temporary-phase3b-ci-repair.yml \
            .github/workflows/temporary-phase3b-finalize.yml \
            .github/workflows/temporary-phase3b-finalize-observed.yml \
            .github/workflows/temporary-phase3b-instrument-hardening.yml \
            .github/workflows/temporary-phase3b-instrument-hardening-v2.yml \
            .github/phase3b-finalization-failure.md
          do
            if [[ -e "$path" ]] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git add -- "$path"
            fi
          done
          git diff --cached --check
          git commit -m "chore(ci): expose Phase 3B hardening failures"
          git push origin HEAD:feat/business-store-procurement-v2
