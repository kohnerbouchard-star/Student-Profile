name: Admin Auth Email Staging Candidate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Exact current main commit containing the email templates"
        required: true
        type: string
      confirm_project_ref:
        description: "Type the exact staging Supabase project ref"
        required: true
        type: string
      confirm_action:
        description: "Type DEPLOY ADMIN AUTH EMAIL STAGING"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: admin-auth-email-staging
  cancel-in-progress: false

env:
  EXPECTED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  DENIED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  deploy:
    name: Configure SMTP and apply branded Auth email templates to staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ECONOVARIA_AUTH_EMAIL_FROM: ${{ secrets.ECONOVARIA_AUTH_EMAIL_FROM }}
    steps:
      - name: Enforce explicit staging authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$RESEND_API_KEY"
          test -n "$ECONOVARIA_AUTH_EMAIL_FROM"
          test "${{ inputs.confirm_project_ref }}" = "$EXPECTED_STAGING_PROJECT_REF"
          test "${{ inputs.confirm_action }}" = "DEPLOY ADMIN AUTH EMAIL STAGING"
          test "$EXPECTED_STAGING_PROJECT_REF" != "$DENIED_PRODUCTION_PROJECT_REF"
          [[ "${{ inputs.source_commit }}" =~ ^[a-f0-9]{40}$ ]]

      - name: Check out exact current main source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current main binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_commit }}"
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Validate canonical email design and deployment compilers
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"
          node --test \
            scripts/auth-email-template-contract.test.mjs \
            scripts/configure-supabase-auth-smtp.test.mjs \
            scripts/staff-signup-email-brand-contract.test.mjs
          node scripts/build-supabase-auth-email-config.mjs --check

      - name: Build exact staging Auth email payload
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-supabase-auth-email-config.mjs \
            --environment staging \
            --output "$RUNNER_TEMP/admin-auth-email-staging-payload.json" \
            --batch-directory "$RUNNER_TEMP/admin-auth-email-staging-patches" \
            --evidence-output "$RUNNER_TEMP/admin-auth-email-staging-build.json"
          test "$(jq -r '.projectRef' "$RUNNER_TEMP/admin-auth-email-staging-build.json")" = \
            "$EXPECTED_STAGING_PROJECT_REF"

      - name: Configure Resend policy and Supabase Auth SMTP
        shell: bash
        run: |
          set -euo pipefail
          node scripts/configure-supabase-auth-smtp.mjs \
            --environment staging \
            --mode apply \
            --before-output "$RUNNER_TEMP/admin-auth-email-staging-smtp-before.json" \
            --evidence-output "$RUNNER_TEMP/admin-auth-email-staging-smtp-evidence.json"
          test "$(jq -r '.smtp.configured' "$RUNNER_TEMP/admin-auth-email-staging-smtp-evidence.json")" = "true"
          test "$(jq -r '.smtp.host' "$RUNNER_TEMP/admin-auth-email-staging-smtp-evidence.json")" = "smtp.resend.com"
          test "$(jq -r '.resend.trackingUpdateApplied' "$RUNNER_TEMP/admin-auth-email-staging-smtp-evidence.json")" = "true"
          sender_email="$(jq -r '.sender.email' "$RUNNER_TEMP/admin-auth-email-staging-smtp-evidence.json")"
          sender_name="$(jq -r '.sender.name' "$RUNNER_TEMP/admin-auth-email-staging-smtp-evidence.json")"
          test -n "$sender_email"
          test "$sender_name" = "Econovaria Security"
          {
            echo "AUTH_EMAIL_ADDRESS=$sender_email"
            echo "AUTH_EMAIL_SENDER_NAME=$sender_name"
          } >> "$GITHUB_ENV"

      - name: Provision direct signup delivery secrets in staging
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/admin-auth-email-staging-secrets.env"
          umask 077
          {
            printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
            printf 'ECONOVARIA_AUTH_EMAIL_FROM="%s"\n' "$ECONOVARIA_AUTH_EMAIL_FROM"
            printf 'ECONOVARIA_DEPLOYMENT_ENVIRONMENT=staging\n'
          } > "$secrets_file"
          supabase secrets set \
            --env-file "$secrets_file" \
            --project-ref "$EXPECTED_STAGING_PROJECT_REF"
          rm -f "$secrets_file"

      - name: Capture current managed staging template fields
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_PROJECT_REF/config/auth" \
            > "$RUNNER_TEMP/admin-auth-email-staging-before-raw.json"
          jq -e \
            --arg email "$AUTH_EMAIL_ADDRESS" \
            --arg sender "$AUTH_EMAIL_SENDER_NAME" \
            '.smtp_host == "smtp.resend.com" and
             (.smtp_port | tostring) == "465" and
             .smtp_user == "resend" and
             .smtp_admin_email == $email and
             .smtp_sender_name == $sender' \
            "$RUNNER_TEMP/admin-auth-email-staging-before-raw.json" > /dev/null
          node scripts/snapshot-supabase-auth-email-config.mjs \
            --environment staging \
            --actual "$RUNNER_TEMP/admin-auth-email-staging-before-raw.json" \
            --output "$RUNNER_TEMP/admin-auth-email-staging-template-before.json"
          rm -f "$RUNNER_TEMP/admin-auth-email-staging-before-raw.json"

      - name: Apply only the canonical staging email fields
        shell: bash
        run: |
          set -euo pipefail
          for patch in "$RUNNER_TEMP/admin-auth-email-staging-patches"/*.json; do
            response="$RUNNER_TEMP/$(basename "$patch" .json)-response.json"
            status="$(curl --silent --show-error \
              -o "$response" \
              -w "%{http_code}" \
              -X PATCH \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @"$patch" \
              "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_PROJECT_REF/config/auth")"
            if [[ "$status" != "200" ]]; then
              echo "::error::Supabase rejected Auth email patch $(basename "$patch") with HTTP $status."
              jq -c '{code, error, message}' "$response" 2>/dev/null || true
              exit 1
            fi
            rm -f "$response"
          done

      - name: Verify hosted staging templates exactly match source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_PROJECT_REF/config/auth" \
            > "$RUNNER_TEMP/admin-auth-email-staging-after.json"
          node scripts/verify-supabase-auth-email-config.mjs \
            --environment staging \
            --actual "$RUNNER_TEMP/admin-auth-email-staging-after.json" \
            --evidence-output "$RUNNER_TEMP/admin-auth-email-staging-verified-base.json"
          jq \
            --arg sourceCommit "${{ inputs.source_commit }}" \
            --slurpfile smtp "$RUNNER_TEMP/admin-auth-email-staging-smtp-evidence.json" \
            '. + {
              sourceCommit: $sourceCommit,
              smtpBootstrap: $smtp[0]
            }' \
            "$RUNNER_TEMP/admin-auth-email-staging-verified-base.json" \
            > "$RUNNER_TEMP/admin-auth-email-staging-candidate.json"
          rm -f \
            "$RUNNER_TEMP/admin-auth-email-staging-after.json" \
            "$RUNNER_TEMP/admin-auth-email-staging-payload.json" \
            "$RUNNER_TEMP/admin-auth-email-staging-build.json" \
            "$RUNNER_TEMP/admin-auth-email-staging-smtp-evidence.json" \
            "$RUNNER_TEMP/admin-auth-email-staging-verified-base.json"
          rm -rf "$RUNNER_TEMP/admin-auth-email-staging-patches"

      - name: Upload staging template, SMTP, and rollback evidence
        uses: actions/upload-artifact@v7
        with:
          name: admin-auth-email-staging-${{ inputs.source_commit }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/admin-auth-email-staging-candidate.json
            ${{ runner.temp }}/admin-auth-email-staging-template-before.json
            ${{ runner.temp }}/admin-auth-email-staging-smtp-before.json
