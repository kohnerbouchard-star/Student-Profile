name: C3E Source Export

on:
  push:
    branches:
      - feat/multicurrency-stock-funding-v1
    paths:
      - .github/workflows/c3e-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c3e-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export exact C3E branch source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Archive exact source tree
        shell: bash
        run: git archive --format=tar.gz --output=c3e-source.tar.gz HEAD

      - name: Upload exact source tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c3e-source-${{ github.sha }}
          path: c3e-source.tar.gz
          if-no-files-found: error
          retention-days: 1
