name: Phase 3D Roadmap Certification

on:
  pull_request:
    paths:
      - ".github/workflows/phase3d-roadmap-certification.yml"

permissions:
  contents: read

concurrency:
  group: phase3d-roadmap-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    if: github.event.pull_request.number == 656
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact Phase 3D branch
        uses: actions/checkout@v7
        with:
          ref: refactor/business-abstract-input-retirement-v2
          fetch-depth: 0

      - name: Verify certified source and clean-head ancestry
        shell: bash
        run: |
          set -euo pipefail
          implementation="bd186ba86b4952bff7f4ab9b34c5e067dbd70116"
          clean_head="832c609679e4d423e968ee2e42bd810d7aa6a862"
          git merge-base --is-ancestor "$implementation" "$clean_head"
          git merge-base --is-ancestor "$clean_head" HEAD
          IMPLEMENTATION="$implementation" CLEAN_HEAD="$clean_head" python3 - <<'PY'
          import os
          import subprocess

          implementation = os.environ["IMPLEMENTATION"]
          clean_head = os.environ["CLEAN_HEAD"]

          expected_after_implementation = {
              ".github/workflows/business-economy-v2.yml",
              "backend/src/domains/business/api/playerBusinessInputPurchaseRetirement.test.ts",
              "docs/architecture/inventories/econovaria-architecture-inventory-v2.json",
          }
          actual_after_implementation = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", implementation, clean_head],
                  text=True,
              ).splitlines()
          )
          if actual_after_implementation != expected_after_implementation:
              raise SystemExit(
                  "Unexpected source drift after implementation SHA:\n"
                  f"expected={sorted(expected_after_implementation)}\n"
                  f"actual={sorted(actual_after_implementation)}"
              )

          actual_after_clean = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", clean_head, "HEAD"],
                  text=True,
              ).splitlines()
          )
          expected_after_clean = {
              ".github/workflows/phase3d-roadmap-certification.yml",
          }
          if actual_after_clean != expected_after_clean:
              raise SystemExit(
                  "Unexpected drift after clean verification head:\n"
                  f"expected={sorted(expected_after_clean)}\n"
                  f"actual={sorted(actual_after_clean)}"
              )
          PY

      - name: Record Phase 3D and Phase 3 completion
        shell: bash
        env:
          PHASE3D_LOG_ENTRY_B64: ""
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          plan_path = Path("docs/roadmaps/business-v2-development-execution-plan-v1.md")
          log_path = Path("docs/roadmaps/business-v2-development-execution-log-v1.md")

          plan = plan_path.read_text(encoding="utf-8")
          replacements = [
              (
                  "**Status:** IN PROGRESS — checkpoints A, B, and C complete; legacy abstract input-purchase retirement remains open",
                  "**Status:** COMPLETE — checkpoints A through D certified",
              ),
              (
                  "- [ ] Remove new reliance on abstract `unit_input_cost` purchasing.",
                  "- [x] Remove new reliance on abstract `unit_input_cost` purchasing.",
              ),
              (
                  "## Phase 4 — Workforce capacity and payroll\n\n**Status:** NOT STARTED",
                  "## Phase 4 — Workforce capacity and payroll\n\n**Status:** OPEN — Phase 3 complete; workforce/payroll is the next authorized phase",
              ),
          ]
          for old, new in replacements:
              if old in plan:
                  plan = plan.replace(old, new, 1)
              elif new not in plan:
                  raise SystemExit(f"Roadmap replacement target missing: {old}")

          checkpoint = (
              "- **3D:** live abstract input-purchase authority retired while preserving "
              "authenticated `410 Gone` compatibility handling and historical records; "
              "certified implementation source `bd186ba86b4952bff7f4ab9b34c5e067dbd70116`, "
              "clean verification head `832c609679e4d423e968ee2e42bd810d7aa6a862`."
          )
          if checkpoint not in plan:
              anchor = (
                  "- **3C:** coherent location-complete canonical Business Stockroom read, "
                  "certified source `6799c0b44025dd71b54ed75636dd8f2af3358150`."
              )
              if anchor not in plan:
                  raise SystemExit("Phase 3C checkpoint anchor missing")
              plan = plan.replace(anchor, anchor + "\n" + checkpoint, 1)

          plan_path.write_text(plan.rstrip() + "\n", encoding="utf-8")

          entry = base64.b64decode(
              os.environ["PHASE3D_LOG_ENTRY_B64"]
          ).decode("utf-8")
          log = log_path.read_text(encoding="utf-8")
          heading = "## 2026-08-22 — Phase 3D COMPLETE and Phase 3 COMPLETE"
          if heading not in log:
              log = log.rstrip() + "\n\n" + entry.lstrip()
          log_path.write_text(log.rstrip() + "\n", encoding="utf-8")
          PY
          git diff --check

      - name: Commit durable Phase 3D certification
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/roadmaps/business-v2-development-execution-plan-v1.md docs/roadmaps/business-v2-development-execution-log-v1.md; then
            echo "Phase 3D roadmap certification is already current."
            exit 0
          fi
          git config user.name "econovaria-roadmap-certifier"
          git config user.email "actions@users.noreply.github.com"
          git add -- docs/roadmaps/business-v2-development-execution-plan-v1.md docs/roadmaps/business-v2-development-execution-log-v1.md
          git commit -m "docs(business): certify Phase 3D and complete Phase 3"
          git push origin HEAD:refactor/business-abstract-input-retirement-v2
