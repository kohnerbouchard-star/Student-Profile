name: Admin V2 World Management Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Focused World and Admin V2 regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install repository dependencies
        run: npm ci

      - name: Run focused World Management tests
        run: node --test scripts/admin-v2-world-management.test.mjs

      - name: Run Admin V2 regressions
        run: npm run test:admin-v2
