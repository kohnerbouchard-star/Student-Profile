name: Story Narrative S2 Archive Diagnose And Log

on:
  push:
    branches:
      - feat/story-narrative-convergence-v1
    paths:
      - ".github/workflows/story-narrative-s2-archive-diagnose-and-log.yml"

permissions:
  contents: write

jobs:
  diagnose-and-log:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct archive, verify members, and persist roadmap evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import json
          import os
          import tarfile

          parts = [Path(f"scripts/story-narrative/s2/bootstrap.part{i:02d}").read_bytes() for i in range(5)]
          encoded = b"".join(parts)
          archive = base64.b64decode(encoded, validate=True)
          archive_sha = hashlib.sha256(archive).hexdigest()
          archive_valid = False
          member_results = []
          manifest_verified = False
          error = None
          try:
              with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as tf:
                  names = tf.getnames()
                  archive_valid = True
                  manifest_member = tf.extractfile("MANIFEST.json")
                  if manifest_member is None:
                      raise RuntimeError("MANIFEST.json missing")
                  manifest = json.loads(manifest_member.read().decode("utf-8"))
                  ok = True
                  for item in manifest["files"]:
                      member = tf.extractfile(item["path"])
                      if member is None:
                          member_results.append((item["path"], False, "missing"))
                          ok = False
                          continue
                      data = member.read()
                      digest = hashlib.sha256(data).hexdigest()
                      good = len(data) == item["bytes"] and digest == item["sha256"]
                      member_results.append((item["path"], good, f"{len(data)} bytes sha256={digest}"))
                      ok = ok and good
                  manifest_verified = ok
          except Exception as exc:
              error = f"{type(exc).__name__}: {exc}"

          roadmap = Path("docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md")
          text = roadmap.read_text(encoding="utf-8")
          marker = "\n## Run-completion rule\n"
          if marker not in text:
              raise SystemExit("roadmap marker not found")
          lines = [
              "",
              "### Run 2026-08-10 — S2 reconstructed archive diagnostic",
              "",
              f"Workflow run: `{os.environ['GITHUB_RUN_ID']}`",
              f"Diagnostic source head: `{os.environ['GITHUB_SHA']}`",
              "",
              f"Reconstructed archive SHA-256: `{archive_sha}`",
              f"gzip/tar readable: `{str(archive_valid).lower()}`",
              f"per-member MANIFEST verification: `{str(manifest_verified).lower()}`",
              "",
          ]
          for path, good, detail in member_results:
              lines.append(f"- `{path}`: verified `{str(good).lower()}` ({detail});")
          if error:
              lines += ["", f"Archive diagnostic error: `{error}`"]
          lines += [
              "",
              "Next: if archive/member verification is green, update the temporary S2 verification runner to the actual stored chunk hashes plus this reconstructed archive hash; retain per-member manifest verification before migration generation.",
              "",
          ]
          text = text.replace(marker, "\n".join(lines) + marker, 1)
          roadmap.write_text(text, encoding="utf-8")

          if not archive_valid or not manifest_verified:
              print("S2 reconstructed archive is not safe to apply; evidence recorded in roadmap.")
          else:
              print("S2 reconstructed archive and every manifest member are verified.")
          PY
          git diff --check
          rm -f .github/workflows/story-narrative-s2-archive-diagnose-and-log.yml
          git add -A -- docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md .github/workflows/story-narrative-s2-archive-diagnose-and-log.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(story): record S2 reconstructed archive verification"
          git push origin HEAD:feat/story-narrative-convergence-v1
