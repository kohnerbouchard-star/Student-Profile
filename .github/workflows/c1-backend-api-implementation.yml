      - name: Expand C1 source contract to bind authenticated API paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/multicurrency-store-funding-contract.mjs")
          text = path.read_text()
          old = '''  assertions: "backend/supabase/migrations/20260827094500_multicurrency_store_funding_assertions_v1.sql",
          });'''
          new = '''  assertions: "backend/supabase/migrations/20260827094500_multicurrency_store_funding_assertions_v1.sql",
            handler: "backend/src/domains/store/api/playerStorePublicHttpHandler.ts",
            validation: "backend/src/domains/store/api/playerStorePublicRequestValidation.ts",
            fundingContracts: "backend/src/domains/store/contracts/playerStoreFundingPublicContracts.ts",
            fundingRepository: "backend/src/domains/store/infrastructure/supabasePlayerStoreFundingPublicRepository.ts",
          });'''
          if old not in text:
              raise SystemExit("source contract paths marker missing")
          text = text.replace(old, new, 1)
          old_reads = '''const assertions = text(paths.assertions);
          '''
          new_reads = '''const assertions = text(paths.assertions);
          const handler = text(paths.handler);
          const validation = text(paths.validation);
          const fundingContracts = text(paths.fundingContracts);
          const fundingRepository = text(paths.fundingRepository);
          '''
          text = text.replace(old_reads, new_reads, 1)
          marker = 'assert.match(assertions, /has_function_privilege/u);\n'
          additions = '''assert.match(assertions, /read_business_store_offer_funding_receipt_v1/u);
          assert.match(handler, /createFundingRepository/u);
          assert.match(handler, /readPlayerStoreFundingAllocations/u);
          assert.match(fundingContracts, /one|PlayerStoreFundingAllocationInput/u);
          assert.match(fundingRepository, /create_seeded_store_funding_quote_v1/u);
          assert.match(fundingRepository, /settle_seeded_store_funding_v1/u);
          assert.match(fundingRepository, /create_business_store_offer_funding_quote_v1/u);
          assert.match(fundingRepository, /settle_business_store_offer_funding_v1/u);
          assert.match(fundingRepository, /read_business_store_offer_funding_receipt_v1/u);
          assert.match(validation, /allocations must contain one to three Checking accounts/u);
          assert.doesNotMatch(handler, /repository\.purchase\(/u);
          assert.doesNotMatch(handler, /repository\.createQuote\(/u);
          '''
          if marker not in text:
              raise SystemExit("source contract assertion marker missing")
          text = text.replace(marker, marker + additions, 1)
          path.write_text(text)
          PY

