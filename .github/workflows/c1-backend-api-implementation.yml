name: C1 backend API implementation

on:
  push:
    branches:
      - feat/multicurrency-store-funding-v1
    paths:
      - .github/workflows/c1-backend-api-implementation.yml

permissions:
  contents: write

concurrency:
  group: c1-backend-api-implementation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact implementation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Materialize C1 funded Store contracts and repository
        shell: bash
        run: |
          set -euo pipefail
          cat > backend/src/domains/store/contracts/playerStoreFundingPublicContracts.ts <<'EOF'
          import type { PlayerStoreOfferPublicQuoteDto, PlayerStoreOfferPublicReceiptDto } from "./playerStoreOfferPublicContracts.ts";
          import type { PlayerStorePublicQuoteDto, PlayerStorePublicReceiptDto } from "./playerStorePublicContracts.ts";

          export const PLAYER_STORE_FUNDING_ACCOUNT_KEY_PATTERN = /^bac_[0-9a-f]{32}$/u;
          export const PLAYER_STORE_FUNDING_QUOTE_KEY_PATTERN = /^pfq_[0-9a-f]{32}$/u;
          export const PLAYER_STORE_FUNDING_RECEIPT_KEY_PATTERN = /^pfr_[0-9a-f]{32}$/u;

          export interface PlayerStoreFundingAllocationInput {
            readonly sourceAccountKey: string;
            readonly targetAmount: number;
          }

          export interface PlayerStoreFundingQuoteLineDto {
            readonly lineNumber: number;
            readonly sourceAccountKey: string;
            readonly sourceCurrencyCode: string;
            readonly sourceMinorUnit: number;
            readonly targetCurrencyCode: string;
            readonly targetMinorUnit: number;
            readonly postedAmount: number;
            readonly heldAmount: number;
            readonly availableAmount: number;
            readonly targetContribution: number;
            readonly sourceDebit: number;
            readonly referenceRate: number;
            readonly customerRate: number;
            readonly effectiveRate: number;
            readonly spreadRate: number;
            readonly requiresFx: boolean;
            readonly roundingDisclosure: string;
          }

          export interface PlayerStoreFundingQuoteDto {
            readonly quoteKey: string;
            readonly fundingContextKind: string;
            readonly fundingContextKey: string;
            readonly targetCurrencyCode: string;
            readonly targetMinorUnit: number;
            readonly targetAmount: number;
            readonly fixingKey: string;
            readonly policyVersion: string;
            readonly requiresFx: boolean;
            readonly expiresAt: string;
            readonly lines: readonly PlayerStoreFundingQuoteLineDto[];
          }

          export interface PlayerStoreFundingReceiptLineDto {
            readonly lineNumber: number;
            readonly sourceAccountKey: string;
            readonly sourceCurrencyCode: string;
            readonly targetContribution: number;
            readonly sourceDebit: number;
            readonly referenceRate: number;
            readonly customerRate: number;
            readonly effectiveRate: number;
            readonly spreadRate: number;
            readonly requiresFx: boolean;
          }

          export interface PlayerStoreFundingReceiptDto {
            readonly receiptKey: string;
            readonly quoteKey: string;
            readonly bankTransactionKey: string;
            readonly targetAccountKey: string;
            readonly fundingContextKind: string;
            readonly fundingContextKey: string;
            readonly targetCurrencyCode: string;
            readonly targetAmount: number;
            readonly targetReserveDrawAmount: number;
            readonly sourceDomain: string;
            readonly sourceAction: string;
            readonly createdAt: string;
            readonly lines: readonly PlayerStoreFundingReceiptLineDto[];
          }

          export type PlayerStoreSeededFundingQuoteDto = PlayerStorePublicQuoteDto & {
            readonly quoteStatus: "created" | "used" | "expired" | "cancelled";
            readonly replayed: boolean;
            readonly fundingQuote: PlayerStoreFundingQuoteDto;
          };

          export type PlayerStoreSeededFundingReceiptDto = PlayerStorePublicReceiptDto & {
            readonly fundingReceipt: PlayerStoreFundingReceiptDto;
          };

          export type PlayerStoreBusinessFundingQuoteDto = PlayerStoreOfferPublicQuoteDto & {
            readonly fundingQuote: PlayerStoreFundingQuoteDto;
          };

          export type PlayerStoreBusinessFundingReceiptDto = PlayerStoreOfferPublicReceiptDto & {
            readonly fundingReceipt: PlayerStoreFundingReceiptDto;
          };

          export interface PlayerStoreFundingPublicScope {
            readonly gameSessionId: string;
            readonly playerId: string;
          }

          export interface PlayerStoreFundingPublicRepository {
            createSeededQuote(input: PlayerStoreFundingPublicScope & {
              readonly itemKey: string;
              readonly quantity: number;
              readonly allocations: readonly PlayerStoreFundingAllocationInput[];
              readonly idempotencyKey: string;
              readonly effectiveAt: string;
            }): Promise<PlayerStoreSeededFundingQuoteDto>;
            settleSeededPurchase(input: PlayerStoreFundingPublicScope & {
              readonly quoteKey: string;
              readonly idempotencyKey: string;
              readonly clientSubmittedAt: string | null;
            }): Promise<PlayerStoreSeededFundingReceiptDto>;
            createBusinessOfferQuote(input: PlayerStoreFundingPublicScope & {
              readonly offerKey: string;
              readonly quantity: number;
              readonly expectedVersion: number;
              readonly allocations: readonly PlayerStoreFundingAllocationInput[];
              readonly idempotencyKey: string;
            }): Promise<PlayerStoreBusinessFundingQuoteDto>;
            settleBusinessOfferPurchase(input: PlayerStoreFundingPublicScope & {
              readonly offerKey: string;
              readonly quoteKey: string;
              readonly quantity: number;
              readonly expectedVersion: number;
              readonly idempotencyKey: string;
            }): Promise<PlayerStoreBusinessFundingReceiptDto>;
            readBusinessOfferReceipt(input: PlayerStoreFundingPublicScope & {
              readonly receiptKey: string;
            }): Promise<PlayerStoreBusinessFundingReceiptDto>;
          }
          EOF

          cat > backend/src/domains/store/infrastructure/supabasePlayerStoreFundingPublicRepository.ts <<'EOF'
          import {
            PLAYER_STORE_FUNDING_ACCOUNT_KEY_PATTERN,
            PLAYER_STORE_FUNDING_QUOTE_KEY_PATTERN,
            PLAYER_STORE_FUNDING_RECEIPT_KEY_PATTERN,
            type PlayerStoreBusinessFundingQuoteDto,
            type PlayerStoreBusinessFundingReceiptDto,
            type PlayerStoreFundingAllocationInput,
            type PlayerStoreFundingPublicRepository,
            type PlayerStoreFundingPublicScope,
            type PlayerStoreFundingQuoteDto,
            type PlayerStoreFundingQuoteLineDto,
            type PlayerStoreFundingReceiptDto,
            type PlayerStoreFundingReceiptLineDto,
            type PlayerStoreSeededFundingQuoteDto,
            type PlayerStoreSeededFundingReceiptDto,
          } from "../contracts/playerStoreFundingPublicContracts.ts";
          import {
            PLAYER_STORE_OFFER_KEY_PATTERN,
            PLAYER_STORE_OFFER_QUOTE_KEY_PATTERN,
            PLAYER_STORE_OFFER_RECEIPT_KEY_PATTERN,
          } from "../contracts/playerStoreOfferPublicContracts.ts";
          import {
            PLAYER_STORE_ITEM_KEY_PATTERN,
            PLAYER_STORE_QUOTE_KEY_PATTERN,
            PLAYER_STORE_RECEIPT_KEY_PATTERN,
            PlayerStorePublicError,
          } from "../contracts/playerStorePublicContracts.ts";
          import {
            type PlayerStoreOfferClient,
            PlayerStoreOfferPublicReadStore,
            type PlayerStoreOfferQueryResponse,
          } from "./playerStoreOfferPublicReadStore.ts";

          const UUID = /[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/iu;
          const GAME_UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/u;
          const CURRENCY = /^[A-Z0-9_]{3,16}$/u;
          const FIXING_KEY = /^fxf_[0-9a-f]{32}$/u;
          const BANK_TRANSACTION_KEY = /^btx_[0-9a-f]{32}$/u;
          const BUSINESS_KEY = /^biz_[0-9a-f]{32}$/u;
          const PARTY_KEY = /^pty_[0-9a-f]{32}$/u;
          const CATALOG_ITEM_KEY = /^itm_[0-9a-f]{32}$/u;
          const CANONICAL_ITEM_KEY = /^[a-z0-9][a-z0-9._-]{0,159}$/u;

          export class SupabasePlayerStoreFundingPublicRepository
            implements PlayerStoreFundingPublicRepository {
            private readonly readStore: PlayerStoreOfferPublicReadStore;

            constructor(private readonly client: PlayerStoreOfferClient) {
              this.readStore = new PlayerStoreOfferPublicReadStore(client);
            }

            async createSeededQuote(input: PlayerStoreFundingPublicScope & {
              readonly itemKey: string;
              readonly quantity: number;
              readonly allocations: readonly PlayerStoreFundingAllocationInput[];
              readonly idempotencyKey: string;
              readonly effectiveAt: string;
            }): Promise<PlayerStoreSeededFundingQuoteDto> {
              const scope = normalizeScope(input);
              const raw = await this.call(
                "create_seeded_store_funding_quote_v1",
                {
                  p_game_session_id: scope.gameSessionId,
                  p_player_id: scope.playerId,
                  p_item_key: input.itemKey,
                  p_quantity: input.quantity,
                  p_allocations: input.allocations,
                  p_idempotency_key: input.idempotencyKey,
                  p_effective_at: input.effectiveAt,
                },
                "quote",
              );
              return parseSeededQuote(raw);
            }

            async settleSeededPurchase(input: PlayerStoreFundingPublicScope & {
              readonly quoteKey: string;
              readonly idempotencyKey: string;
              readonly clientSubmittedAt: string | null;
            }): Promise<PlayerStoreSeededFundingReceiptDto> {
              const scope = normalizeScope(input);
              const raw = await this.call(
                "settle_seeded_store_funding_v1",
                {
                  p_game_session_id: scope.gameSessionId,
                  p_player_id: scope.playerId,
                  p_quote_key: input.quoteKey,
                  p_idempotency_key: input.idempotencyKey,
                  p_client_submitted_at: input.clientSubmittedAt,
                  p_request_metadata: {},
                },
                "purchase",
              );
              return parseSeededReceipt(raw);
            }

            async createBusinessOfferQuote(input: PlayerStoreFundingPublicScope & {
              readonly offerKey: string;
              readonly quantity: number;
              readonly expectedVersion: number;
              readonly allocations: readonly PlayerStoreFundingAllocationInput[];
              readonly idempotencyKey: string;
            }): Promise<PlayerStoreBusinessFundingQuoteDto> {
              const scope = normalizeScope(input);
              const raw = record(await this.call(
                "create_business_store_offer_funding_quote_v1",
                {
                  p_game_session_id: scope.gameSessionId,
                  p_buyer_player_id: scope.playerId,
                  p_offer_key: input.offerKey,
                  p_quantity: input.quantity,
                  p_expected_offer_version: input.expectedVersion,
                  p_allocations: input.allocations,
                  p_idempotency_key: input.idempotencyKey,
                },
                "quote",
              ));
              const sellerPartyKey = key(raw.sellerPartyKey, PARTY_KEY, "sellerPartyKey");
              const businessKey = key(raw.businessKey, BUSINESS_KEY, "businessKey");
              const identity = await this.readStore.requireBusinessIdentity(
                scope.gameSessionId,
                sellerPartyKey,
                businessKey,
              );
              return parseBusinessQuote(raw, identity.businessName);
            }

            async settleBusinessOfferPurchase(input: PlayerStoreFundingPublicScope & {
              readonly offerKey: string;
              readonly quoteKey: string;
              readonly quantity: number;
              readonly expectedVersion: number;
              readonly idempotencyKey: string;
            }): Promise<PlayerStoreBusinessFundingReceiptDto> {
              const scope = normalizeScope(input);
              const raw = record(await this.call(
                "settle_business_store_offer_funding_v1",
                {
                  p_game_session_id: scope.gameSessionId,
                  p_buyer_player_id: scope.playerId,
                  p_offer_key: input.offerKey,
                  p_quote_key: input.quoteKey,
                  p_quantity: input.quantity,
                  p_expected_offer_version: input.expectedVersion,
                  p_idempotency_key: input.idempotencyKey,
                },
                "purchase",
              ));
              const sellerPartyKey = key(raw.sellerPartyKey, PARTY_KEY, "sellerPartyKey");
              const businessKey = key(raw.businessKey, BUSINESS_KEY, "businessKey");
              const identity = await this.readStore.requireBusinessIdentity(
                scope.gameSessionId,
                sellerPartyKey,
                businessKey,
                { requireActive: false },
              );
              return parseBusinessReceipt(raw, identity.businessName);
            }

            async readBusinessOfferReceipt(input: PlayerStoreFundingPublicScope & {
              readonly receiptKey: string;
            }): Promise<PlayerStoreBusinessFundingReceiptDto> {
              const scope = normalizeScope(input);
              const raw = record(await this.call(
                "read_business_store_offer_funding_receipt_v1",
                {
                  p_game_session_id: scope.gameSessionId,
                  p_buyer_player_id: scope.playerId,
                  p_receipt_key: input.receiptKey,
                },
                "receipt",
              ));
              const sellerPartyKey = key(raw.sellerPartyKey, PARTY_KEY, "sellerPartyKey");
              const businessKey = key(raw.businessKey, BUSINESS_KEY, "businessKey");
              const identity = await this.readStore.requireBusinessIdentity(
                scope.gameSessionId,
                sellerPartyKey,
                businessKey,
                { requireActive: false },
              );
              return parseBusinessReceipt(raw, identity.businessName);
            }

            private async call(
              functionName: string,
              args: Record<string, unknown>,
              phase: "quote" | "purchase" | "receipt",
            ): Promise<unknown> {
              const response = await this.client.rpc<unknown>(functionName, args) as
                PlayerStoreOfferQueryResponse<unknown>;
              if (response.error) throw mapRpcError(response.error, phase);
              if (!response.data) throw invalidResponse();
              return response.data;
            }
          }

          function normalizeScope(input: PlayerStoreFundingPublicScope): PlayerStoreFundingPublicScope {
            const gameSessionId = String(input.gameSessionId || "").trim().toLowerCase();
            const playerId = String(input.playerId || "").trim().toLowerCase();
            if (!GAME_UUID.test(gameSessionId) || !GAME_UUID.test(playerId)) {
              throw new PlayerStorePublicError(
                "player_store_funding_scope_invalid",
                "Player Store funding scope is invalid.",
                500,
                false,
              );
            }
            return { gameSessionId, playerId };
          }

          function parseSeededQuote(value: unknown): PlayerStoreSeededFundingQuoteDto {
            const row = record(value);
            return {
              quoteKey: key(row.quoteKey, PLAYER_STORE_QUOTE_KEY_PATTERN, "quoteKey"),
              quoteStatus: status(row.quoteStatus),
              itemKey: key(row.itemKey, PLAYER_STORE_ITEM_KEY_PATTERN, "itemKey"),
              itemName: text(row.itemName, "itemName"),
              quantity: integer(row.quantity, "quantity", 1),
              baseUnitPrice: amount(row.baseUnitPrice, "baseUnitPrice", 0),
              inflationMultiplier: amount(row.inflationMultiplier, "inflationMultiplier", 0),
              locationMultiplier: amount(row.locationMultiplier, "locationMultiplier", 0),
              scarcityMultiplier: amount(row.scarcityMultiplier, "scarcityMultiplier", 0),
              discountAmount: amount(row.discountAmount, "discountAmount", 0),
              finalUnitPrice: amount(row.finalUnitPrice, "finalUnitPrice", 0),
              finalTotalPrice: amount(row.finalTotalPrice, "finalTotalPrice", 0),
              currencyCode: currency(row.currencyCode),
              itemCurrencyCode: currency(row.itemCurrencyCode),
              playerCurrencyCode: currency(row.playerCurrencyCode),
              exchangeRate: amount(row.exchangeRate, "exchangeRate", 0),
              itemLocalFinalUnitPrice: amount(row.itemLocalFinalUnitPrice, "itemLocalFinalUnitPrice", 0),
              itemLocalFinalTotalPrice: amount(row.itemLocalFinalTotalPrice, "itemLocalFinalTotalPrice", 0),
              pricingVersion: text(row.pricingVersion, "pricingVersion"),
              expiresAt: iso(row.expiresAt, "expiresAt"),
              replayed: bool(row.replayed, "replayed"),
              fundingQuote: parseFundingQuote(row.fundingQuote),
            };
          }

          function parseSeededReceipt(value: unknown): PlayerStoreSeededFundingReceiptDto {
            const row = record(value);
            return {
              receiptKey: key(row.receiptKey, PLAYER_STORE_RECEIPT_KEY_PATTERN, "receiptKey"),
              quoteKey: key(row.quoteKey, PLAYER_STORE_QUOTE_KEY_PATTERN, "quoteKey"),
              itemKey: key(row.itemKey, PLAYER_STORE_ITEM_KEY_PATTERN, "itemKey"),
              itemName: text(row.itemName, "itemName"),
              quantity: integer(row.quantity, "quantity", 1),
              finalUnitPrice: amount(row.finalUnitPrice, "finalUnitPrice", 0),
              finalTotalPrice: amount(row.finalTotalPrice, "finalTotalPrice", 0),
              currencyCode: currency(row.currencyCode),
              inventoryQuantityOwned: integer(row.inventoryQuantityOwned, "inventoryQuantityOwned", 0),
              completedAt: iso(row.completedAt, "completedAt"),
              alreadyCompleted: bool(row.alreadyCompleted, "alreadyCompleted"),
              fundingReceipt: parseFundingReceipt(row.fundingReceipt),
            };
          }

          function parseBusinessQuote(
            row: Record<string, unknown>,
            businessName: string,
          ): PlayerStoreBusinessFundingQuoteDto {
            return {
              quoteKey: key(row.quoteKey, PLAYER_STORE_OFFER_QUOTE_KEY_PATTERN, "quoteKey"),
              quoteStatus: status(row.quoteStatus),
              offerKey: key(row.offerKey, PLAYER_STORE_OFFER_KEY_PATTERN, "offerKey"),
              offerVersion: integer(row.offerVersion, "offerVersion", 1),
              businessKey: key(row.businessKey, BUSINESS_KEY, "businessKey"),
              businessName,
              sellerPartyKey: key(row.sellerPartyKey, PARTY_KEY, "sellerPartyKey"),
              sellerName: businessName,
              catalogItemKey: key(row.catalogItemKey, CATALOG_ITEM_KEY, "catalogItemKey"),
              canonicalItemKey: key(row.canonicalItemKey, CANONICAL_ITEM_KEY, "canonicalItemKey"),
              storeItemKey: key(row.storeItemKey, PLAYER_STORE_ITEM_KEY_PATTERN, "storeItemKey"),
              quantity: integer(row.quantity, "quantity", 1),
              availableQuantityAtQuote: integer(row.availableQuantityAtQuote, "availableQuantityAtQuote", 1),
              unitPrice: amount(row.finalUnitPrice, "unitPrice", 0),
              totalPrice: amount(row.finalTotalPrice, "totalPrice", 0),
              currencyCode: currency(row.buyerCurrencyCode),
              expiresAt: iso(row.expiresAt, "expiresAt"),
              pricingVersion: pricingVersion(row.pricingVersion),
              replayed: bool(row.replayed, "replayed"),
              fundingQuote: parseFundingQuote(row.fundingQuote),
            };
          }

          function parseBusinessReceipt(
            row: Record<string, unknown>,
            businessName: string,
          ): PlayerStoreBusinessFundingReceiptDto {
            return {
              receiptKey: key(row.receiptKey, PLAYER_STORE_OFFER_RECEIPT_KEY_PATTERN, "receiptKey"),
              quoteKey: key(row.quoteKey, PLAYER_STORE_OFFER_QUOTE_KEY_PATTERN, "quoteKey"),
              offerKey: key(row.offerKey, PLAYER_STORE_OFFER_KEY_PATTERN, "offerKey"),
              businessKey: key(row.businessKey, BUSINESS_KEY, "businessKey"),
              businessName,
              sellerPartyKey: key(row.sellerPartyKey, PARTY_KEY, "sellerPartyKey"),
              sellerName: businessName,
              catalogItemKey: key(row.catalogItemKey, CATALOG_ITEM_KEY, "catalogItemKey"),
              canonicalItemKey: key(row.canonicalItemKey, CANONICAL_ITEM_KEY, "canonicalItemKey"),
              storeItemKey: key(row.storeItemKey, PLAYER_STORE_ITEM_KEY_PATTERN, "storeItemKey"),
              quantity: integer(row.quantity, "quantity", 1),
              unitPrice: amount(row.unitPrice, "unitPrice", 0),
              totalPrice: amount(row.totalPrice, "totalPrice", 0),
              currencyCode: currency(row.currencyCode),
              offerVersionBefore: integer(row.offerVersionBefore, "offerVersionBefore", 1),
              offerVersionAfter: integer(row.offerVersionAfter, "offerVersionAfter", 2),
              remainingListedQuantity: integer(row.remainingListedQuantity, "remainingListedQuantity", 0),
              completedAt: iso(row.completedAt, "completedAt"),
              alreadyCompleted: bool(row.replayed, "replayed"),
              fundingReceipt: parseFundingReceipt(row.fundingReceipt),
            };
          }

          function parseFundingQuote(value: unknown): PlayerStoreFundingQuoteDto {
            const row = record(value);
            const lines = array(row.lines, "lines").map(parseFundingQuoteLine);
            if (lines.length < 1 || lines.length > 3) throw invalidResponse();
            return {
              quoteKey: key(row.quote_key, PLAYER_STORE_FUNDING_QUOTE_KEY_PATTERN, "fundingQuoteKey"),
              fundingContextKind: text(row.funding_context_kind, "fundingContextKind"),
              fundingContextKey: publicContextKey(row.funding_context_key),
              targetCurrencyCode: currency(row.target_currency_code),
              targetMinorUnit: integer(row.target_minor_unit, "targetMinorUnit", 0, 18),
              targetAmount: amount(row.target_amount, "targetAmount", 0),
              fixingKey: key(row.fixing_key, FIXING_KEY, "fixingKey"),
              policyVersion: policy(row.policy_version),
              requiresFx: bool(row.requires_fx, "requiresFx"),
              expiresAt: iso(row.expires_at, "expiresAt"),
              lines,
            };
          }

          function parseFundingQuoteLine(value: unknown): PlayerStoreFundingQuoteLineDto {
            const row = record(value);
            return {
              lineNumber: integer(row.line_number, "lineNumber", 1, 3),
              sourceAccountKey: key(row.source_account_key, PLAYER_STORE_FUNDING_ACCOUNT_KEY_PATTERN, "sourceAccountKey"),
              sourceCurrencyCode: currency(row.source_currency_code),
              sourceMinorUnit: integer(row.source_minor_unit, "sourceMinorUnit", 0, 18),
              targetCurrencyCode: currency(row.target_currency_code),
              targetMinorUnit: integer(row.target_minor_unit, "targetMinorUnit", 0, 18),
              postedAmount: amount(row.posted_amount, "postedAmount"),
              heldAmount: amount(row.held_amount, "heldAmount", 0),
              availableAmount: amount(row.available_amount, "availableAmount"),
              targetContribution: amount(row.target_contribution, "targetContribution", 0),
              sourceDebit: amount(row.source_debit, "sourceDebit", 0),
              referenceRate: amount(row.reference_rate, "referenceRate", 0),
              customerRate: amount(row.customer_rate, "customerRate", 0),
              effectiveRate: amount(row.effective_rate, "effectiveRate", 0),
              spreadRate: amount(row.spread_rate, "spreadRate", 0),
              requiresFx: bool(row.requires_fx, "requiresFx"),
              roundingDisclosure: text(row.rounding_disclosure, "roundingDisclosure"),
            };
          }

          function parseFundingReceipt(value: unknown): PlayerStoreFundingReceiptDto {
            const row = record(value);
            const lines = array(row.lines, "lines").map(parseFundingReceiptLine);
            if (lines.length < 1 || lines.length > 3) throw invalidResponse();
            return {
              receiptKey: key(row.receipt_key, PLAYER_STORE_FUNDING_RECEIPT_KEY_PATTERN, "fundingReceiptKey"),
              quoteKey: key(row.quote_key, PLAYER_STORE_FUNDING_QUOTE_KEY_PATTERN, "fundingQuoteKey"),
              bankTransactionKey: key(row.bank_transaction_key, BANK_TRANSACTION_KEY, "bankTransactionKey"),
              targetAccountKey: key(row.target_account_key, PLAYER_STORE_FUNDING_ACCOUNT_KEY_PATTERN, "targetAccountKey"),
              fundingContextKind: text(row.funding_context_kind, "fundingContextKind"),
              fundingContextKey: publicContextKey(row.funding_context_key),
              targetCurrencyCode: currency(row.target_currency_code),
              targetAmount: amount(row.target_amount, "targetAmount", 0),
              targetReserveDrawAmount: amount(row.target_reserve_draw_amount, "targetReserveDrawAmount", 0),
              sourceDomain: text(row.source_domain, "sourceDomain"),
              sourceAction: text(row.source_action, "sourceAction"),
              createdAt: iso(row.created_at, "createdAt"),
              lines,
            };
          }

          function parseFundingReceiptLine(value: unknown): PlayerStoreFundingReceiptLineDto {
            const row = record(value);
            return {
              lineNumber: integer(row.line_number, "lineNumber", 1, 3),
              sourceAccountKey: key(row.source_account_key, PLAYER_STORE_FUNDING_ACCOUNT_KEY_PATTERN, "sourceAccountKey"),
              sourceCurrencyCode: currency(row.source_currency_code),
              targetContribution: amount(row.target_contribution, "targetContribution", 0),
              sourceDebit: amount(row.source_debit, "sourceDebit", 0),
              referenceRate: amount(row.reference_rate, "referenceRate", 0),
              customerRate: amount(row.customer_rate, "customerRate", 0),
              effectiveRate: amount(row.effective_rate, "effectiveRate", 0),
              spreadRate: amount(row.spread_rate, "spreadRate", 0),
              requiresFx: bool(row.requires_fx, "requiresFx"),
            };
          }

          function mapRpcError(
            error: { readonly message?: string; readonly code?: string },
            phase: "quote" | "purchase" | "receipt",
          ): PlayerStorePublicError {
            const source = `${error.code || ""} ${error.message || ""}`.toUpperCase();
            const code = [...source.matchAll(/[A-Z][A-Z0-9_]{4,}/gu)]
              .map((match) => match[0])
              .find((candidate) => /^(?:STORE|PURCHASE|FUNDING|BANK|FX|PLAYER)_/u.test(candidate)) || "";
            if (/REQUEST_INVALID|ALLOCATIONS?_INVALID|PRECISION_INVALID|CURRENCY_PRECISION/u.test(code)) {
              return publicError("invalid_player_store_request", "Store funding request is invalid.", 400);
            }
            if (code.includes("SELF_PURCHASE")) {
              return publicError("store_offer_self_purchase_forbidden", "A Player cannot purchase from their own Business.", 403);
            }
            if (code.includes("IDEMPOTENCY") || code.endsWith("_CONFLICT")) {
              return publicError("store_idempotency_conflict", "This idempotency key was already used for another Store request.", 409);
            }
            if (code.includes("VERSION_CONFLICT") || code.includes("OFFER_CONFLICT")) {
              return publicError("store_offer_version_conflict", "The Store offer changed before the request could complete.", 409);
            }
            if (code.includes("INSUFFICIENT_STOCK")) {
              return publicError("store_insufficient_stock", "Store stock is insufficient.", 409);
            }
            if (code.includes("FUNDING_INSUFFICIENT") || code.includes("INSUFFICIENT_FUNDS")) {
              return publicError("store_insufficient_balance", "Available Checking funds are insufficient for this purchase.", 409);
            }
            if (/LIQUIDITY|FACILITY|CLEARING|RESERVE|CAP_/u.test(code)) {
              return publicError("store_fx_liquidity_unavailable", "Retail checkout FX capacity is unavailable.", 409);
            }
            if (code.includes("TOTAL_MISMATCH")) {
              return publicError("store_funding_total_mismatch", "The selected account allocations must equal the Store bill.", 409);
            }
            if (code.includes("QUOTE_EXPIRED") || code.includes("RATE_VERSION_STALE")) {
              return publicError("store_quote_expired", "The Store funding quote has expired.", 409);
            }
            if (code.includes("RECEIPT_NOT_FOUND")) {
              return publicError("store_offer_receipt_not_found", "Store offer receipt was not found.", 404);
            }
            if (/NOT_FOUND|UNAVAILABLE|STATUS_INVALID|MISMATCH|RESERVED/u.test(code)) {
              return publicError(
                phase === "quote" ? "store_quote_not_available" : "store_purchase_unavailable",
                phase === "quote" ? "Store funding quote is not available." : "Store purchase is not available.",
                409,
              );
            }
            return publicError(
              phase === "quote" ? "player_store_funding_quote_failed" :
                phase === "receipt" ? "player_store_funding_receipt_failed" :
                "player_store_funding_purchase_failed",
              phase === "quote" ? "Store funding quote could not be created." :
                phase === "receipt" ? "Store funding receipt could not be loaded." :
                "Store purchase could not be completed.",
              500,
            );
          }

          function record(value: unknown): Record<string, unknown> {
            if (!value || typeof value !== "object" || Array.isArray(value) || UUID.test(JSON.stringify(value))) {
              throw invalidResponse();
            }
            return value as Record<string, unknown>;
          }

          function array(value: unknown, field: string): readonly unknown[] {
            if (!Array.isArray(value)) throw new Error(`Invalid ${field}`);
            return value;
          }

          function text(value: unknown, field: string): string {
            const candidate = typeof value === "string" ? value.trim() : "";
            if (!candidate || candidate.length > 400) throw new Error(`Invalid ${field}`);
            return candidate;
          }

          function key(value: unknown, pattern: RegExp, field: string): string {
            const candidate = text(value, field);
            if (!pattern.test(candidate)) throw new Error(`Invalid ${field}`);
            return candidate;
          }

          function publicContextKey(value: unknown): string {
            const candidate = text(value, "fundingContextKey");
            if (UUID.test(candidate) || candidate.length > 240) throw invalidResponse();
            return candidate;
          }

          function currency(value: unknown): string {
            return key(value, CURRENCY, "currencyCode");
          }

          function amount(value: unknown, field: string, minimum = Number.NEGATIVE_INFINITY): number {
            const candidate = typeof value === "number" ? value :
              typeof value === "string" && /^-?[0-9]+(?:\.[0-9]+)?$/u.test(value) ? Number(value) : Number.NaN;
            if (!Number.isFinite(candidate) || candidate < minimum || Math.abs(candidate) >= 1_000_000_000_000_000) {
              throw new Error(`Invalid ${field}`);
            }
            return candidate;
          }

          function integer(value: unknown, field: string, minimum: number, maximum = Number.MAX_SAFE_INTEGER): number {
            const candidate = Number(value);
            if (!Number.isSafeInteger(candidate) || candidate < minimum || candidate > maximum) {
              throw new Error(`Invalid ${field}`);
            }
            return candidate;
          }

          function bool(value: unknown, field: string): boolean {
            if (typeof value !== "boolean") throw new Error(`Invalid ${field}`);
            return value;
          }

          function iso(value: unknown, field: string): string {
            const candidate = text(value, field);
            const timestamp = Date.parse(candidate);
            if (!Number.isFinite(timestamp)) throw new Error(`Invalid ${field}`);
            return new Date(timestamp).toISOString();
          }

          function status(value: unknown): "created" | "used" | "expired" | "cancelled" {
            const candidate = text(value, "quoteStatus").toLowerCase();
            if (!new Set(["created", "used", "expired", "cancelled"]).has(candidate)) throw invalidResponse();
            return candidate as "created" | "used" | "expired" | "cancelled";
          }

          function policy(value: unknown): string {
            return key(value, /^fx-policy-v[1-9][0-9]*$/u, "policyVersion");
          }

          function pricingVersion(value: unknown): "business-offer-fixed-price-v2" {
            if (value !== "business-offer-fixed-price-v2") throw invalidResponse();
            return value;
          }

          function invalidResponse(): PlayerStorePublicError {
            return publicError("player_store_funding_response_invalid", "Store funding returned an invalid public response.", 500);
          }

          function publicError(code: string, message: string, status: number): PlayerStorePublicError {
            return new PlayerStorePublicError(code, message, status, false);
          }
          EOF

