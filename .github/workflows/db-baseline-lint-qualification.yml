name: Baseline Name Resolution Qualification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]
    paths:
      - "backend/tests/sql/baseline_temporary_context_lint_v1.sql"
      - ".github/workflows/db-baseline-lint-qualification.yml"
      - "scripts/db-baseline-lint-qualification.mjs"
      - "backend/supabase/migrations/20261117050144_baseline_function_name_resolution_v1.sql"
      - "backend/tests/sql/baseline_function_name_resolution_v1.sql"
      - "scripts/tests/test_db_baseline_name_resolution.py"
      - "docs/roadmaps/econovaria-beta-completion-roadmap-v1.md"
      - "docs/operations/evidence/db-baseline-lint-v1/scope.md"
      - "docs/operations/evidence/db-baseline-lint-v1/qualification-authority.json"

permissions:
  contents: read

concurrency:
  group: db-baseline-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  disposable-postgres:
    name: Baseline name resolution disposable PostgreSQL qualification
    if: github.event.pull_request.head.ref == 'fix/db-baseline-lint-20261117' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact scoped draft PR before installing or running anything
        run: node scripts/db-baseline-lint-qualification.mjs --event
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install lockfile-pinned tools
        run: |
          npm install --global npm@10.9.8
          npm ci --ignore-scripts
      - name: Validate scope and migrations
        run: |
          node scripts/db-baseline-lint-qualification.mjs
          node scripts/validate-supabase-migrations.mjs
      - name: Require disposable local database tools
        run: |
          docker info >/dev/null
          psql --version
      - name: Check source-only regression cases
        run: python3 scripts/tests/test_db_baseline_name_resolution.py
      - name: Replay uncorrected baseline in disposable Supabase
        run: |
          migration=backend/supabase/migrations/20261117050144_baseline_function_name_resolution_v1.sql
          held="$RUNNER_TEMP/baseline-name-resolution.sql"
          mv "$migration" "$held"
          trap 'mv "$held" "$migration"' EXIT
          npx --no-install supabase start --workdir backend --exclude studio,imgproxy,inbucket,storage-api,edge-runtime,logflare,vector,supavisor
          npx --no-install supabase db reset --workdir backend --local
      - name: Apply twice and check exact definitions, security metadata and lint
        run: psql -X 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f backend/tests/sql/baseline_function_name_resolution_v1.sql
      - name: Replay complete corrected migration chain
        run: npx --no-install supabase db reset --workdir backend --local
      - name: Prove temporary context and check complete CLI-covered function scope
        run: psql -X 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f backend/tests/sql/baseline_temporary_context_lint_v1.sql
      - name: Prove actual quote lifecycle, replay and game isolation
        run: node scripts/multicurrency-funding-database.mjs
      - name: Lint rebuilt local schema
        run: npx --no-install supabase db lint --workdir backend --local --level warning --fail-on error
      - name: Destroy disposable stack
        if: always()
        run: npx --no-install supabase stop --workdir backend --no-backup || true
