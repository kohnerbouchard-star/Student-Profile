name: Phase 12 Architecture Ratchet Repair

on:
  push:
    branches:
      - feat/player-business-workspace-v2

permissions:
  contents: write

concurrency:
  group: phase12-architecture-ratchet-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.repository == 'kohnerbouchard-star/Student-Profile' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact Phase 12 branch
        uses: actions/checkout@v7
        with:
          ref: feat/player-business-workspace-v2
          fetch-depth: 0

      - name: Set up pinned Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1

      - name: Remove the new compatibility marker and regenerate inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('player-terminal/src/pages/business-workspace-sections.js')
          source = path.read_text()
          before = source
          source = source.replace('function fallbackWorldModel(data) {', 'function buildCountryOnlyWorldModel(data) {')
          source = source.replace('view.model||liveModel||fallbackWorldModel(data)', 'view.model||liveModel||buildCountryOnlyWorldModel(data)')
          if source == before:
              raise SystemExit('Expected World model compatibility marker was not found.')
          if source.count('buildCountryOnlyWorldModel') != 2 or 'fallbackWorldModel' in source:
              raise SystemExit('World model helper rename was incomplete.')
          path.write_text(source)
          PY
          node scripts/architecture/build-architecture-inventory.mjs
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            docs/architecture/inventories/econovaria-architecture-inventory-v2.json
            player-terminal/src/pages/business-workspace-sections.js
          )
          if [ "${#changed[@]}" -ne "${#expected[@]}" ]; then
            printf 'Unexpected generated change count: %s\n' "${changed[*]}" >&2
            exit 1
          fi
          for index in "${!expected[@]}"; do
            if [ "${changed[$index]}" != "${expected[$index]}" ]; then
              printf 'Unexpected generated changes: %s\n' "${changed[*]}" >&2
              exit 1
            fi
          done

      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "econovaria-phase12-ratchet"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            player-terminal/src/pages/business-workspace-sections.js \
            docs/architecture/inventories/econovaria-architecture-inventory-v2.json
          git commit -m "refactor(phase12): avoid new compatibility marker debt"
          git push origin HEAD:feat/player-business-workspace-v2
