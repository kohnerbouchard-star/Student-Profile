name: PR377 Source Contract Fix Runner

on:
  push:
    branches:
      - agent/runtime-stability-button-integrity-v1
    paths:
      - .github/pr377-source-contract-fix.trigger
      - .github/workflows/pr377-source-contract-fix-runner.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-stability-button-integrity-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Correct mounted readiness semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/admin-mounted-keyboard-navigation-smoke.mjs")
          text = path.read_text()
          old = '''      const busy = Boolean(document.querySelector('[aria-busy="true"], [data-admin-shape-skeleton-stage], .admin-shape-surface-overlay'));
          '''
          new = '''      const transitioning = Boolean(document.querySelector(
        "[data-admin-shape-skeleton-stage], [data-admin-shape-surface-overlay], .admin-shape-skeleton-stage, .admin-shape-surface-overlay",
      ));
          '''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one mounted readiness match, found {text.count(old)}")
          text = text.replace(old, new, 1)
          old = '''      return { busy, count };
    }, EXCLUDED_SELECTOR);
    if (!snapshot.busy && snapshot.count === previousCount) stableSamples += 1;
          '''
          new = '''      return { transitioning, count };
    }, EXCLUDED_SELECTOR);
    if (!snapshot.transitioning && snapshot.count === previousCount) stableSamples += 1;
          '''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one mounted readiness result match, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))

          world = Path("player-terminal/src/features/world/world-runtime-flow.js")
          text = world.read_text()
          old = 'const STALE_AFTER_MS = 60_000;\n\n'
          if text.count(old) != 1:
              raise SystemExit(f"Expected one stale constant match, found {text.count(old)}")
          world.write_text(text.replace(old, '', 1))
          PY

          node --check scripts/admin-mounted-keyboard-navigation-smoke.mjs
          node --check player-terminal/src/features/world/world-runtime-flow.js
          node scripts/admin-keyboard-navigation-source-smoke.mjs

          rm -f \
            .github/pr377-source-contract-fix.trigger \
            .github/workflows/pr377-source-contract-fix-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: scope Admin focus readiness to mounted transitions"
          git push origin HEAD:agent/runtime-stability-button-integrity-v1
