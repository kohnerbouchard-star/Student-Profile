name: Finalize CodeQL security remediation

on:
  push:
    branches:
      - agent/codeql-security-remediation-v1
    paths:
      - .github/workflows/security-remediation-finalize.yml

permissions:
  contents: write

concurrency:
  group: security-remediation-finalize-v1
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/codeql-security-remediation-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Rebase onto merged main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main agent/codeql-security-remediation-v1
          git checkout -B agent/codeql-security-remediation-v1 origin/agent/codeql-security-remediation-v1
          git rebase --empty=drop --onto origin/main fdde6c023eab21e641463843a636fac7ee66a04e agent/codeql-security-remediation-v1

      - name: Apply compatibility and type-safety corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, value):
              Path(path).write_text(value, encoding="utf-8")

          def replace_once(path, old, new):
              value = read(path)
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}: {old[:80]!r}")
              write(path, value.replace(old, new, 1))

          def replace_count(path, old, new, expected):
              value = read(path)
              count = value.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} anchors, found {count}: {old[:80]!r}")
              write(path, value.replace(old, new))

          replace_once(
              "scripts/admin-shell-identity-v2-smoke.mjs",
              '  "../frontend/src/core/runtime-config.js",\n  "./auth-session-manager.js",',
              '  "../frontend/src/core/runtime-config.js",\n  "../frontend/src/core/admin-game-selection.js",\n  "./auth-session-manager.js",',
          )

          replace_once(
              "scripts/admin-explicit-mounted-event-smoke.mjs",
              '  const storage = new Map([\n    ["econovaria.admin.selected-game.v1", "game-1"],\n  ]);',
              '  const storage = new Map();',
          )
          replace_once(
              "scripts/admin-explicit-mounted-event-smoke.mjs",
              '    EconovariaAdminAuthSession: sessionManager,\n    sessionStorage:',
              '    EconovariaAdminAuthSession: sessionManager,\n    EconovariaAdminGameSelection: Object.freeze({\n      read: () => "game-1",\n      clear() {},\n    }),\n    sessionStorage:',
          )

          replace_once(
              "scripts/admin-quality-smoke-fixture.mjs",
              '    sessionStorage.setItem("econovaria.admin.selected-game.v1", gameId);',
              '    window.name = `econovaria:admin-game:v1:${gameId}`;',
          )

          path = "scripts/admin-session-manager-smoke.mjs"
          replace_once(
              path,
              '  const localValues = new Map();\n  const sessionStorage = {',
              '  const localValues = new Map();\n  let selectedGameId = "";\n  const sessionStorage = {',
          )
          replace_once(
              path,
              '  const window = {\n    fetch: fetchImpl,',
              '  const gameSelection = Object.freeze({\n    read: () => selectedGameId,\n    write(value) {\n      selectedGameId = String(value || "").trim();\n      return selectedGameId;\n    },\n    clear() {\n      selectedGameId = "";\n    },\n  });\n  const window = {\n    fetch: fetchImpl,',
          )
          replace_once(
              path,
              '    localStorage,\n    crypto:',
              '    localStorage,\n    EconovariaAdminGameSelection: gameSelection,\n    crypto:',
          )
          replace_once(
              path,
              '  return { manager: window.EconovariaAdminAuthSession, sessionStorage };',
              '  return { manager: window.EconovariaAdminAuthSession, sessionStorage, gameSelection };',
          )
          replace_count(
              path,
              'const { manager, sessionStorage } = createRuntime(',
              'const { manager, sessionStorage, gameSelection } = createRuntime(',
              4,
          )
          replace_count(
              path,
              '  sessionStorage.setItem("econovaria.admin.selected-game.v1", "game-1");',
              '  gameSelection.write("game-1");',
              3,
          )
          value = read(path)
          old_assert = '  assert.equal(sessionStorage.getItem("econovaria.admin.selected-game.v1"), null);'
          if value.count(old_assert) != 3:
              raise SystemExit(f"{path}: expected three selected-game assertions")
          value = value.replace(old_assert, '  assert.equal(gameSelection.read(), "");', 2)
          write(path, value)

          replace_once(
              "backend/src/security/adminBffRequestAuth.ts",
              'interface JsonWebKeySet {\n  readonly keys?: readonly JsonWebKey[];\n}',
              'interface VercelJsonWebKey extends JsonWebKey {\n  readonly kid?: string;\n  readonly alg?: string;\n  readonly use?: string;\n}\n\ninterface JsonWebKeySet {\n  readonly keys?: readonly VercelJsonWebKey[];\n}',
          )

          path = "backend/supabase/functions/staff-mfa-api/index.ts"
          replace_once(
              path,
              '      iv,\n      additionalData: new TextEncoder().encode("econovaria-mfa-factor-v1"),',
              '      iv: ownedArrayBuffer(iv),\n      additionalData: ownedArrayBuffer(new TextEncoder().encode("econovaria-mfa-factor-v1")),',
          )
          replace_once(
              path,
              '    key,\n    payload,\n  );',
              '    key,\n    ownedArrayBuffer(payload),\n  );',
          )
          replace_once(
              path,
              '        iv: fromBase64Url(parts[1]),\n        additionalData: new TextEncoder().encode("econovaria-mfa-factor-v1"),',
              '        iv: ownedArrayBuffer(fromBase64Url(parts[1])),\n        additionalData: ownedArrayBuffer(new TextEncoder().encode("econovaria-mfa-factor-v1")),',
          )
          replace_once(
              path,
              '      key,\n      fromBase64Url(parts[2]),\n    );',
              '      key,\n      ownedArrayBuffer(fromBase64Url(parts[2])),\n    );',
          )
          replace_once(
              path,
              'function base64Url(bytes: Uint8Array): string {',
              'function ownedArrayBuffer(bytes: Uint8Array): ArrayBuffer {\n  const copy = new Uint8Array(bytes.byteLength);\n  copy.set(bytes);\n  return copy.buffer;\n}\n\nfunction base64Url(bytes: Uint8Array): string {',
          )

          replace_once(
              "backend/supabase/functions/password-reset-api/index.ts",
              '    return json(request, 400, errorBody(policy.code, policy.message));',
              '    return json(request, 400, errorBody(\n      policy.code || "invalid_password",\n      policy.message || "Password does not meet the administrator security policy.",\n    ));',
          )

          path = "backend/supabase/functions/web-session-api/index.ts"
          replace_once(
              path,
              '      body: bodyResult.body && routeContract.mutation\n        ? bodyResult.body\n        : undefined,',
              '      body: bodyResult.body && routeContract.mutation\n        ? ownedArrayBuffer(bodyResult.body)\n        : undefined,',
          )
          replace_once(
              path,
              '  return new Response(responseBody.body, {',
              '  return new Response(ownedArrayBuffer(responseBody.body), {',
          )
          replace_once(
              path,
              '  return new Response(method === "HEAD" ? null : responseBody.body, {',
              '  return new Response(\n    method === "HEAD" ? null : ownedArrayBuffer(responseBody.body),\n    {',
          )
          replace_once(
              path,
              '    status: upstream.status,\n    headers,\n  });\n}\n\nasync function resolveCurrentSession(',
              '      status: upstream.status,\n      headers,\n    },\n  );\n}\n\nasync function resolveCurrentSession(',
          )
          replace_once(
              path,
              'async function sendAdminRequest(',
              'function ownedArrayBuffer(bytes: Uint8Array): ArrayBuffer {\n  const copy = new Uint8Array(bytes.byteLength);\n  copy.set(bytes);\n  return copy.buffer;\n}\n\nasync function sendAdminRequest(',
          )
          replace_once(
              path,
              '    body: body && !["GET", "HEAD"].includes(source.method) ? body : undefined,',
              '    body: body && !["GET", "HEAD"].includes(source.method)\n      ? ownedArrayBuffer(body)\n      : undefined,',
          )

          print("Applied rebase compatibility and Deno type-safety corrections.")
          PY

      - name: Install pinned tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          npm ci
          npm --prefix backend ci

      - name: Run focused remediation contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/admin-explicit-mounted-event-smoke.mjs
          node scripts/admin-shell-identity-v2-smoke.mjs
          node scripts/admin-session-manager-smoke.mjs
          node --test \
            scripts/admin-game-selection-memory.test.mjs \
            scripts/codeql-security-remediation.test.mjs \
            scripts/local-staging-gateway-contract.test.mjs
          npm --prefix backend run typecheck:all

      - name: Run full repository test suite
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/security-remediation-repository-test.log

      - name: Run Admin lifecycle browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/security-remediation-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/admin/ >/dev/null; then
              break
            fi
            sleep 1
          done
          ADMIN_SMOKE_BASE_URL=http://127.0.0.1:4173/admin/ \
            ADMIN_SMOKE_ARTIFACT_DIR=/tmp/security-remediation-browser \
            node scripts/admin-game-lifecycle-smoke.mjs

      - name: Commit validated branch state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/security-remediation-finalize.yml
          rm -rf admin-browser-smoke-artifacts
          git clean -fd
          git add -A
          git diff --cached --check
          git commit -m "security: rebase remediation and repair compatibility contracts"
          git push --force-with-lease origin HEAD:agent/codeql-security-remediation-v1

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-remediation-finalize-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            /tmp/security-remediation-repository-test.log
            /tmp/security-remediation-http.log
            /tmp/security-remediation-browser
