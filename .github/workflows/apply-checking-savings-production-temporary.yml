name: Apply Checking Savings Production Patch Temporary

on:
  push:
    branches:
      - fix/checking-savings-wallet-convergence-v1
    paths:
      - ".github/workflows/apply-checking-savings-production-temporary.yml"

permissions:
  contents: write

concurrency:
  group: apply-checking-savings-production-temporary
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply reviewed Checking and Savings conversion
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/account-migration/checking-savings-production.patch.xz.b64 \
            | xz --decompress > /tmp/checking-savings-production.patch
          git apply --check /tmp/checking-savings-production.patch
          git apply /tmp/checking-savings-production.patch

          rm -f \
            .github/account-migration/checking-savings-final.patch.xz.b64.part-00 \
            .github/account-migration/checking-savings-final.patch.xz.b64.part-01 \
            .github/account-migration/checking-savings-production.patch.xz.b64 \
            .github/workflows/apply-checking-savings-final-temporary.yml \
            .github/workflows/audit-checking-savings-convergence-temporary.yml \
            .github/workflows/canonicalize-checking-savings-one-time-v2.yml \
            .github/workflows/canonicalize-checking-savings-one-time-v3.yml \
            .github/workflows/canonicalize-checking-savings-one-time-v4.yml \
            .github/workflows/canonicalize-checking-savings-one-time.yml \
            .github/workflows/export-pr-source-temporary.yml \
            .github/workflows/final-checking-savings-audit-temporary.yml \
            .github/workflows/finalize-checking-savings-ownership-temporary.yml \
            .github/workflows/monitor-checking-savings-ci-temporary.yml \
            .github/workflows/reconcile-checking-savings-semantics-temporary.yml \
            .github/workflows/apply-checking-savings-production-temporary.yml
          rmdir .github/account-migration 2>/dev/null || true

      - name: Validate focused banking contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/business-banking-runtime-contract.mjs
          node --experimental-strip-types --test scripts/business-banking-economic-simulation.test.mjs
          node player-terminal/tests/store-local-currency.mjs
          node --test scripts/player-local-currency-authority-contract.test.mjs
          node scripts/validate-supabase-migrations.mjs
          git diff --check

      - name: Commit clean release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Canonicalize personal banking to Checking and Savings"
          git push origin "HEAD:${GITHUB_REF_NAME}"
