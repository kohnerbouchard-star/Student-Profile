name: Production Admin Bootstrap 503 Hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-admin-bootstrap-503-hotfix.yml
      - docs/operations/evidence/production-admin-bootstrap-503-hotfix-v1.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-admin-bootstrap-503-hotfix-v1
  cancel-in-progress: false

env:
  AUTHORIZATION_PATH: docs/operations/evidence/production-admin-bootstrap-503-hotfix-v1.json
  EXPECTED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  DENIED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  FUNCTION_NAME: admin-api
  SOURCE_BASELINE_COMMIT: 09269bd2c47293e7290e791c63ba082165fc4c1b
  EXPECTED_BEFORE_VERSION: "27"
  EXPECTED_BEFORE_DIGEST: bbb0fb15e46ffce134bccd9439136bc9a14ce721476eaf4f48621a6835d5a0da
  EXPECTED_RATE_LIMIT_BLOB: 6d20e3fa85a8aed2e8c4444896f73443c6fde4de
  SUPABASE_CLI_VERSION: 2.109.1
  DENO_VERSION: 2.1.4

jobs:
  deploy:
    name: Reconcile production admin bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Enforce bounded production scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "kohnerbouchard-star/Student-Profile"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$EXPECTED_PRODUCTION_PROJECT_REF" != "$DENIED_STAGING_PROJECT_REF"
          test "$FUNCTION_NAME" = "admin-api"
          test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Check out authorized source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify authorization and source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$AUTHORIZATION_PATH"
          git merge-base --is-ancestor "$SOURCE_BASELINE_COMMIT" HEAD
          git diff --quiet "$SOURCE_BASELINE_COMMIT" -- backend
          test "$(git hash-object backend/supabase/functions/admin-api/progressionRateLimit.ts)" = "$EXPECTED_RATE_LIMIT_BLOB"
          grep -q 'bindGatewayTrustedClientIp' backend/supabase/functions/admin-api/progressionRateLimit.ts
          grep -q 'consume_request_rate_limits_v1' backend/supabase/functions/admin-api/progressionRateLimit.ts
          grep -q '{ p_buckets: buckets }' backend/supabase/functions/admin-api/progressionRateLimit.ts
          node - <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.env.AUTHORIZATION_PATH, 'utf8'));
          const failures = [];
          if (value.schemaVersion !== 'econovaria.production-admin-bootstrap-503-hotfix.v1') failures.push('schemaVersion');
          if (value.targetProjectRef !== process.env.EXPECTED_PRODUCTION_PROJECT_REF) failures.push('targetProjectRef');
          if (value.deniedProjectRef !== process.env.DENIED_STAGING_PROJECT_REF) failures.push('deniedProjectRef');
          if (value.functionName !== process.env.FUNCTION_NAME) failures.push('functionName');
          if (String(value.expectedBeforeVersion) !== process.env.EXPECTED_BEFORE_VERSION) failures.push('expectedBeforeVersion');
          if (value.expectedBeforeDigest !== process.env.EXPECTED_BEFORE_DIGEST) failures.push('expectedBeforeDigest');
          if (value.sourceBaselineCommit !== process.env.SOURCE_BASELINE_COMMIT) failures.push('sourceBaselineCommit');
          if (value.expectedProgressionRateLimitBlob !== process.env.EXPECTED_RATE_LIMIT_BLOB) failures.push('expectedProgressionRateLimitBlob');
          if (value.verifyJwtRequired !== true) failures.push('verifyJwtRequired');
          if (value.databaseMigrationsAllowed !== false) failures.push('databaseMigrationsAllowed');
          if (value.otherFunctionsAllowed !== false) failures.push('otherFunctionsAllowed');
          const markers = new Set(value.requiredSourceMarkers || []);
          for (const marker of ['bindGatewayTrustedClientIp', 'consume_request_rate_limits_v1', 'p_buckets']) {
            if (!markers.has(marker)) failures.push(`requiredSourceMarkers:${marker}`);
          }
          if (failures.length) throw new Error(`Authorization mismatch: ${failures.join(', ')}`);
          NODE

      - name: Verify production baseline
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/functions-before.json"
          FUNCTIONS_PATH="$RUNNER_TEMP/functions-before.json" node - <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync(process.env.FUNCTIONS_PATH, 'utf8'));
          const rows = Array.isArray(parsed) ? parsed : (parsed.functions || []);
          const row = rows.find((entry) => entry.slug === process.env.FUNCTION_NAME);
          if (!row) throw new Error('Production admin-api is missing.');
          if (String(row.version) !== process.env.EXPECTED_BEFORE_VERSION) throw new Error(`Unexpected production version: ${row.version}`);
          if (row.ezbr_sha256 !== process.env.EXPECTED_BEFORE_DIGEST) throw new Error('Production admin-api digest drifted.');
          if (row.verify_jwt !== true || row.status !== 'ACTIVE') throw new Error('Production admin-api security metadata is invalid.');
          NODE

      - name: Install pinned Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Run admin rate-limit contract tests
        shell: bash
        run: |
          set -euo pipefail
          deno test backend/supabase/functions/admin-api/progressionRateLimit.contract.test.ts

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Deploy only production admin-api
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"
          supabase functions deploy "$FUNCTION_NAME" \
            --workdir backend \
            --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF" \
            --use-api

      - name: Verify deployment and security metadata
        shell: bash
        run: |
          set -euo pipefail
          deployed=false
          for attempt in $(seq 1 20); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/functions" \
              > "$RUNNER_TEMP/functions-after.json"
            if FUNCTIONS_PATH="$RUNNER_TEMP/functions-after.json" node - <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync(process.env.FUNCTIONS_PATH, 'utf8'));
          const rows = Array.isArray(parsed) ? parsed : (parsed.functions || []);
          const row = rows.find((entry) => entry.slug === process.env.FUNCTION_NAME);
          if (!row) process.exit(1);
          if (Number(row.version) <= Number(process.env.EXPECTED_BEFORE_VERSION)) process.exit(1);
          if (row.ezbr_sha256 === process.env.EXPECTED_BEFORE_DIGEST) process.exit(1);
          if (row.verify_jwt !== true || row.status !== 'ACTIVE') process.exit(1);
          NODE
            then
              deployed=true
              break
            fi
            sleep 3
          done
          test "$deployed" = true

          FUNCTIONS_PATH="$RUNNER_TEMP/functions-after.json" node - <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync(process.env.FUNCTIONS_PATH, 'utf8'));
          const rows = Array.isArray(parsed) ? parsed : (parsed.functions || []);
          const row = rows.find((entry) => entry.slug === process.env.FUNCTION_NAME);
          if (!row || Number(row.version) <= Number(process.env.EXPECTED_BEFORE_VERSION)) throw new Error('Production admin-api version did not advance.');
          if (row.ezbr_sha256 === process.env.EXPECTED_BEFORE_DIGEST) throw new Error('Production admin-api digest did not change.');
          if (row.verify_jwt !== true || row.status !== 'ACTIVE') throw new Error('Production admin-api security metadata changed unexpectedly.');
          console.log(`admin-api version ${row.version}; verify_jwt=true; status=ACTIVE`);
          NODE

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/functions/$FUNCTION_NAME/body" \
            > "$RUNNER_TEMP/function-body.json"
          grep -q 'bindGatewayTrustedClientIp' "$RUNNER_TEMP/function-body.json"
          grep -q 'consume_request_rate_limits_v1' "$RUNNER_TEMP/function-body.json"
          grep -q 'p_buckets' "$RUNNER_TEMP/function-body.json"
          if grep -q 'p_actor_type' "$RUNNER_TEMP/function-body.json"; then
            echo 'Legacy rate-limit RPC arguments remain in the deployed bundle.' >&2
            exit 1
          fi

          auth_status="$(curl --silent --output "$RUNNER_TEMP/unauthenticated.json" --write-out '%{http_code}' \
            "https://$EXPECTED_PRODUCTION_PROJECT_REF.supabase.co/functions/v1/$FUNCTION_NAME/session/bootstrap")"
          test "$auth_status" = "401"

      - name: Record release result
        shell: bash
        run: |
          {
            echo "### Production Admin Bootstrap 503 Hotfix"
            echo ""
            echo "- Target: production project only"
            echo "- Function changed: admin-api only"
            echo "- Source: reviewed main baseline $SOURCE_BASELINE_COMMIT"
            echo "- Previous production version: $EXPECTED_BEFORE_VERSION"
            echo "- JWT verification: preserved and verified"
            echo "- Database migrations: none"
            echo "- Regression contract: passed"
            echo "- Legacy RPC arguments: absent"
          } >> "$GITHUB_STEP_SUMMARY"
