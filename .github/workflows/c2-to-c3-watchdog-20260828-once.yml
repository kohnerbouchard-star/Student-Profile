name: C2 to C3 roadmap watchdog once

on:
  push:
    branches:
      - automation/c0-certification-fallback-20260827
    paths:
      - .github/workflows/c2-to-c3-watchdog-20260828-once.yml

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  continue-roadmap:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      C2_BRANCH: feat/multicurrency-marketplace-funding-v1
      C2_PR: "675"
      C3_BRANCH: feat/multicurrency-stock-funding-v1
      AUTOMATION_BRANCH: automation/c0-certification-fallback-20260827
    steps:
      - name: Check out automation carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: automation/c0-certification-fallback-20260827
          fetch-depth: 0

      - name: Wait for durable C2 exact-head handoff
        id: c2
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for ATTEMPT in $(seq 1 720); do
            PR_JSON="$(gh api --method GET "/repos/${REPOSITORY}/pulls/${C2_PR}")"
            C2_HEAD="$(jq -r '.head.sha' <<<"$PR_JSON")"
            C2_STATE="$(jq -r '.state' <<<"$PR_JSON")"
            C2_DRAFT="$(jq -r '.draft' <<<"$PR_JSON")"
            C2_MERGED="$(jq -r '.merged' <<<"$PR_JSON")"

            HANDOFF="$(gh api --method GET -H 'Accept: application/vnd.github.raw+json' "/repos/${REPOSITORY}/contents/docs/roadmaps/multicurrency-marketplace-funding-implementation-handoff-v1.md?ref=${C2_BRANCH}" 2>/dev/null || true)"
            WORKFLOWS="$(gh api --method GET "/repos/${REPOSITORY}/contents/.github/workflows?ref=${C2_BRANCH}" 2>/dev/null || echo '[]')"
            TEMP_COUNT="$(jq '[.[]? | select(.name | test("^c2-.*(once|finalizer|repair|diagnostic).*\\.ya?ml$"; "i"))] | length' <<<"$WORKFLOWS")"
            RUNS="$(gh api --method GET "/repos/${REPOSITORY}/actions/runs?branch=${C2_BRANCH}&per_page=100")"
            FINALIZER_STATUS="$(jq -r '[.workflow_runs[] | select(.name == "C2 exact-head finalizer once")][0].status // ""' <<<"$RUNS")"
            FINALIZER_CONCLUSION="$(jq -r '[.workflow_runs[] | select(.name == "C2 exact-head finalizer once")][0].conclusion // ""' <<<"$RUNS")"

            if [[ "$C2_STATE" == "open" && "$C2_DRAFT" == "true" && "$C2_MERGED" == "false" \
               && "$TEMP_COUNT" == "0" \
               && "$FINALIZER_STATUS" == "completed" \
               && "$FINALIZER_CONCLUSION" == "success" \
               && "$HANDOFF" == *'IMPLEMENTED_NOT_MERGED'* \
               && "$HANDOFF" == *'Exact implementation and verification source:'* ]]; then
              printf '%s' "$HANDOFF" > /tmp/c2-handoff.md
              echo "head=${C2_HEAD}" >> "$GITHUB_OUTPUT"
              READY=1
              break
            fi
            sleep 15
          done
          test "$READY" = "1"
          C2_IMPLEMENTATION="$(sed -n 's/.*Exact implementation and verification source:\*\* `\([0-9a-f]\{40\}\)`.*/\1/p' /tmp/c2-handoff.md | head -n1)"
          test -n "$C2_IMPLEMENTATION"
          echo "implementation=${C2_IMPLEMENTATION}" >> "$GITHUB_OUTPUT"

      - name: Establish C3 branch from clean C2 handoff
        id: c3
        shell: bash
        env:
          C2_HEAD: ${{ steps.c2.outputs.head }}
          C2_IMPLEMENTATION: ${{ steps.c2.outputs.implementation }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$C2_BRANCH"

          if git ls-remote --exit-code --heads origin "refs/heads/${C3_BRANCH}" >/dev/null 2>&1; then
            EXISTING_PR="$(gh pr list --repo "$REPOSITORY" --head "$C3_BRANCH" --state all --json number --jq '.[0].number // empty')"
            if [[ -n "$EXISTING_PR" ]]; then
              echo "C3 already exists as PR #${EXISTING_PR}; no duplicate branch or PR will be created."
              echo "pr_number=${EXISTING_PR}" >> "$GITHUB_OUTPUT"
              echo "existing=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "C3 branch exists without a traceable PR; failing closed." >&2
            exit 1
          fi

          git checkout -B "$C3_BRANCH" "$C2_HEAD"
          test "$(git rev-parse HEAD)" = "$C2_HEAD"

          mkdir -p docs/roadmaps
          STOCK_PATHS="$(find backend/src/domains backend/supabase/migrations player-terminal/src player-terminal/tests scripts .github/workflows -type f \
            \( -iname '*stock*' -o -iname '*market*' -o -iname '*portfolio*' -o -iname '*trade*' \) 2>/dev/null | sort -u)"
          STOCK_MIGRATIONS="$(find backend/supabase/migrations -maxdepth 1 -type f \
            \( -iname '*stock*' -o -iname '*market*' -o -iname '*trade*' -o -iname '*portfolio*' \) | sort -u)"
          AUTHORITY_MARKERS="$(grep -RIlE 'stock_orders|stock_trades|stock_holdings|portfolio_holdings|place.*stock.*order|settle.*stock|execute.*trade|listing_currency|currency_code' \
            backend/src/domains/stocks backend/supabase/migrations player-terminal/src 2>/dev/null | sort -u || true)"

          cat > docs/roadmaps/multicurrency-stock-funding-scope-v1.md <<EOF
          # Multi-Currency Stock Market Funding Scope v1

          **Roadmap checkpoint:** \`BUSINESS-V2-10A4C3\`  
          **Status:** \`SCOPE_ONLY — IMPLEMENTATION_NOT_STARTED\`  
          **Branch:** \`${C3_BRANCH}\`  
          **Parent C2 branch:** \`${C2_BRANCH}\`  
          **Exact parent C2 implementation source:** \`${C2_IMPLEMENTATION}\`  
          **Exact parent C2 clean handoff:** \`${C2_HEAD}\`  
          **Merge/deployment authorized:** No

          ## Decision

          C3 integrates the certified C0 multi-account purchase-funding authority into Financial Markets without creating another order book, securities registry, portfolio model, FX engine, Banking balance authority, or client-authored settlement path.

          Financial Markets remain authoritative for security identity, exchange/listing identity, listing currency, order lifecycle, price-time priority, matching, fills, trades, fees, holdings, cost basis, realized/unrealized P&L, cancellations, market sessions, and replay. C0 remains authoritative for one-to-three-Checking-account purchase funding and retail checkout FX. B1 remains authoritative for the daily accepted fixing. B2 remains authoritative for accounts, holds, clearing, reserve capacity, liquidity, and balanced journals.

          ## Locked product contract

          - Every security has one authoritative listing currency for new orders and trades.
          - Existing securities without a listing currency are backfilled deterministically to ECO; historical orders, fills, trades, holdings, and P&L are not economically rewritten.
          - Buy intent may use one to three unique active Player Checking accounts.
          - Same-currency funding lines use rate 1; foreign lines consume the C0 1.00% retail-checkout policy and B1/B2 fixing/clearing authority.
          - Market and limit orders must reserve a bounded maximum listing-currency exposure before becoming matchable.
          - Partial fills consume exposure proportionally under one reviewed precision rule; cancellation, expiry, or terminal rejection releases the exact unused amount once.
          - A fill commits buyer funding, seller proceeds, explicit market fees, security transfer, order/fill/trade mutation, holdings/cost basis, and immutable evidence atomically.
          - The browser submits public security/order/account keys, side, quantity, bounded order type/limit intent, allocations, and idempotency only. It cannot author listing currency, trusted price, fee, rate, balance, hold, counterparty, exchange, fill, trade, or settlement evidence.

          ## Required authority audit before C3A

          The current buy-order root, hold/reservation semantics, matching transaction, partial-fill rule, fee recipient, sell-side proceeds account, listing-currency source, historical compatibility path, and cancellation/release ordering must be resolved against the exact parent tree before a migration is added.

          ## Ordered implementation

          1. **C3A — listing-currency and immutable funding bindings.**
          2. **C3B — server-authoritative maximum-exposure funding quote and reservation.**
          3. **C3C — atomic match/fill settlement, partial-fill consumption, and exact release.**
          4. **C3D — authenticated Player API/UI cutover and legacy-path retirement.**
          5. **C3E — exact-head serial, concurrency, browser, privacy, two-game, retained-stack, and migration certification.**

          ## Explicit exclusions

          C3 does not implement Business-owned foreign Checking accounts, Business treasury/procurement FX, Store or Marketplace changes, B1 fixing changes, B2 standard/instant FX changes, automatic demand, IPO publication, final 10A.4D Store/FX convergence, merge, deployment, schedulers, secrets, staging/production SQL, or live-database mutation.

          ## Completion boundary

          C3 may become \`IMPLEMENTED_NOT_MERGED\` only after one exact implementation SHA passes its permanent source, disposable-database, concurrency, and Chromium lanes plus the inherited B1/B2/C0/C1/C2 and Financial Market matrix. A later documentation-only head must not replace the tested implementation SHA.
          EOF
          sed -i 's/^          //' docs/roadmaps/multicurrency-stock-funding-scope-v1.md

          cat > docs/roadmaps/multicurrency-stock-funding-authority-audit-v1.md <<EOF
          # Multi-Currency Stock Funding Authority Audit v1

          **Parent tree:** \`${C2_HEAD}\`  
          **Parent certified C2 source:** \`${C2_IMPLEMENTATION}\`

          ## Repository-observed Stock and Financial Market paths

          \`\`\`text
          ${STOCK_PATHS}
          \`\`\`

          ## Initial authority findings

          - The Stock/Financial Market domain must remain owner of order, match, fill, trade, holding, price, exchange-session, and portfolio semantics.
          - C3 must consume Banking and C0 through narrow composition boundaries; it must not write a second cash, wallet, treasury, FX-rate, or portfolio authority.
          - Existing code containing monetary, order, trade, holding, or listing-currency markers requires exact-function review before C3A.
          - Market-order maximum exposure, limit-order exposure, partial-fill allocation, fee distribution, seller proceeds, cancellation release, and historical compatibility are unresolved intake questions rather than browser policy.

          ## Files containing authority markers

          \`\`\`text
          ${AUTHORITY_MARKERS}
          \`\`\`

          ## Fail-closed boundary

          No C3 runtime or migration implementation is authorized until each unresolved authority has one named owner, one lock order, one idempotency boundary, one public identity contract, and one rollback/release rule.
          EOF
          sed -i 's/^          //' docs/roadmaps/multicurrency-stock-funding-authority-audit-v1.md

          cat > docs/roadmaps/multicurrency-stock-funding-schema-inventory-v1.md <<EOF
          # Multi-Currency Stock Funding Schema and Runtime Inventory v1

          **Exact parent tree:** \`${C2_HEAD}\`

          ## Stock/market/trade migrations observed

          \`\`\`text
          ${STOCK_MIGRATIONS}
          \`\`\`

          ## Required C3 resolution matrix

          | Concern | Existing owner to preserve | C3 decision required |
          |---|---|---|
          | Security and exchange identity | Financial Markets | Locate canonical listing-currency field and deterministic ECO backfill boundary. |
          | Buy-order admission | Stocks order command | Bind immutable maximum listing-currency exposure and C0 funding intent. |
          | Price-time matching | Existing matcher | Preserve matching algorithm; insert funding composition only at the owning transaction boundary. |
          | Partial fills | Order/fill/trade authority | Define exact exposure consumption, residual reservation, and terminal release precision. |
          | Sell proceeds | Banking + trade settlement | Resolve seller canonical target Checking account and explicit fee recipients. |
          | Holdings and P&L | Portfolio/holdings authority | Preserve quantity, cost basis, realized/unrealized P&L, and historical evidence. |
          | Cancellation/expiry | Order lifecycle | Release exact unused funded exposure once under the same order lock. |
          | Browser contract | Player Stocks API/UI | Public keys and bounded intent only; no trusted monetary or market outcome fields. |
          | Historical compatibility | Existing orders/trades | Do not rewrite historical economics; bounded readers/wrappers only. |

          C3A must cite the exact tables, functions, routes, repositories, workflows, and lock order that satisfy this matrix before schema mutation begins.
          EOF
          sed -i 's/^          //' docs/roadmaps/multicurrency-stock-funding-schema-inventory-v1.md

          cat > docs/roadmaps/multicurrency-stock-funding-implementation-plan-v1.md <<'EOF'
          # Multi-Currency Stock Funding Implementation Plan v1

          ## C3A — authority bindings

          Resolve and document the canonical security listing currency, order root, fill/trade transaction, holdings authority, fee recipients, seller target account, and historical compatibility path. Add only compatibility-safe public identities and immutable funding references required by later tranches.

          ## C3B — funded order admission

          Introduce one server-authoritative funding quote/reservation for the maximum listing-currency exposure of a buy order. Validate one to three Checking allocations, current fixing, balances, holds, liquidity, order intent, exchange session, and trusted exposure. A quote does not alter the order book.

          ## C3C — match and fill settlement

          Compose buyer funding, seller credit, fees, security transfer, order/fill/trade mutation, holdings/cost basis, and receipt evidence inside the existing Financial Market transaction. Prove partial fills, opposite account order, cancel-versus-fill, expiry, insufficient balance, hold/facility races, rollback at every stage, replay, conflict, and two-game isolation.

          ## C3D — Player cutover

          Add constrained Checking selectors, exact allocation controls, quote/rate/rounding disclosure, order confirmation, residual exposure status, cancellation release, receipt history, and specific recovery states. Retire direct single-balance or browser-authored settlement paths with explicit compatibility behavior.

          ## C3E — certification

          Require source/static, two zero-to-head database replays, rebuilt-schema lint, serial and observed concurrency, authenticated two-browser/two-game journeys, public-key privacy, responsive/accessibility coverage, and retained B1/B2/C0/C1/C2/Financial Market gates on one exact source.
          EOF
          sed -i 's/^          //' docs/roadmaps/multicurrency-stock-funding-implementation-plan-v1.md

          cat > docs/roadmaps/multicurrency-stock-funding-scope-handoff-v1.md <<EOF
          # Multi-Currency Stock Funding Scope Handoff v1

          **Roadmap item:** \`BUSINESS-V2-10A4C3\`  
          **Status:** \`SCOPE_ONLY — IMPLEMENTATION_NOT_STARTED\`  
          **Branch:** \`${C3_BRANCH}\`  
          **Exact parent C2 implementation:** \`${C2_IMPLEMENTATION}\`  
          **Exact parent C2 clean handoff:** \`${C2_HEAD}\`

          C3 intake is established with a controlling scope, repository-observed authority audit, schema/runtime inventory, and ordered implementation plan. Runtime implementation remains blocked until the C3A resolution matrix names the exact order, matching, Banking, holdings, fee, cancellation, and compatibility authorities.

          No merge, deployment, scheduler, secret, staging/production SQL, or live-database operation is authorized.
          EOF
          sed -i 's/^          //' docs/roadmaps/multicurrency-stock-funding-scope-handoff-v1.md

          MARKER='## BUSINESS-V2-10A4C3 — Multi-Currency Stock Market Funding Intake'
          for FILE in docs/roadmaps/business-v2-development-execution-plan-v1.md docs/roadmaps/business-v2-development-execution-log-v1.md; do
            if ! grep -qF "$MARKER" "$FILE"; then
              cat >> "$FILE" <<EOF

          ${MARKER}

          **Status:** \`SCOPE_ONLY — IMPLEMENTATION_NOT_STARTED\`  
          **Branch:** \`${C3_BRANCH}\`  
          **Parent C2 implementation:** \`${C2_IMPLEMENTATION}\`  
          **Parent C2 clean handoff:** \`${C2_HEAD}\`

          C3 intake establishes the Stock Market multi-currency funding scope, authority audit, schema/runtime inventory, and C3A–C3E implementation order. Financial Markets retain securities/order/match/fill/trade/holdings authority; C0/B1/B2 retain funding, fixing, Banking, clearing, reserve, and liquidity authority. Runtime implementation remains blocked on exact authority resolution. No merge or deployment is authorized.
          EOF
              sed -i 's/^          //' "$FILE"
            fi
          done

          git diff --check
          git add \
            docs/roadmaps/multicurrency-stock-funding-scope-v1.md \
            docs/roadmaps/multicurrency-stock-funding-authority-audit-v1.md \
            docs/roadmaps/multicurrency-stock-funding-schema-inventory-v1.md \
            docs/roadmaps/multicurrency-stock-funding-implementation-plan-v1.md \
            docs/roadmaps/multicurrency-stock-funding-scope-handoff-v1.md \
            docs/roadmaps/business-v2-development-execution-plan-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md
          git commit -m "docs(c3): establish Stock Market funding scope"
          git push origin "HEAD:${C3_BRANCH}"

          PR_URL="$(gh pr create --repo "$REPOSITORY" --draft --base "$C2_BRANCH" --head "$C3_BRANCH" --title 'Draft: Multi-currency Stock Market funding v1' --body 'C3 scope intake is being bound to a PR-specific authority record.')"
          C3_PR="$(gh pr view "$C3_BRANCH" --repo "$REPOSITORY" --json number --jq '.number')"
          test -n "$C3_PR"

          mkdir -p docs/operations/contracts/player-cross-cutting
          cat > "docs/operations/contracts/player-cross-cutting/pr-${C3_PR}.json" <<EOF
          {
            "schemaVersion": 1,
            "authorityId": "econovaria.multicurrency-stock-funding-pr-${C3_PR}.v1",
            "purpose": "authorize-cross-cutting-player-verification",
            "pullRequestNumber": ${C3_PR},
            "baseRef": "${C2_BRANCH}",
            "scopeLock": "exact-path-allowlist",
            "productionDeploymentAllowed": false,
            "productionMutationAllowed": false,
            "secretValuesAllowed": false,
            "allowedPaths": [
              "docs/operations/contracts/player-cross-cutting/pr-${C3_PR}.json",
              "docs/roadmaps/business-v2-development-execution-log-v1.md",
              "docs/roadmaps/business-v2-development-execution-plan-v1.md",
              "docs/roadmaps/multicurrency-stock-funding-authority-audit-v1.md",
              "docs/roadmaps/multicurrency-stock-funding-implementation-plan-v1.md",
              "docs/roadmaps/multicurrency-stock-funding-schema-inventory-v1.md",
              "docs/roadmaps/multicurrency-stock-funding-scope-handoff-v1.md",
              "docs/roadmaps/multicurrency-stock-funding-scope-v1.md"
            ],
            "requiredFiles": [
              "docs/operations/contracts/player-cross-cutting/pr-${C3_PR}.json",
              "scripts/player-cross-cutting-authority.test.mjs",
              "scripts/verify-player-cross-cutting-authority.mjs"
            ],
            "requiredChecks": [
              "player-terminal-verify",
              "database-replay",
              "banking-fx-clearing-v1",
              "multicurrency-funding-core-v1",
              "multicurrency-marketplace-funding-v1"
            ]
          }
          EOF
          sed -i 's/^          //' "docs/operations/contracts/player-cross-cutting/pr-${C3_PR}.json"
          git add "docs/operations/contracts/player-cross-cutting/pr-${C3_PR}.json"
          git commit -m "chore(c3): bind PR-specific Stock funding authority"
          git push origin "HEAD:${C3_BRANCH}"

          cat > /tmp/c3-pr-body.md <<EOF
          ## Roadmap checkpoint

          \`BUSINESS-V2-10A4C3\` — Multi-Currency Stock Market Funding.

          ## Exact ancestry

          - Base: \`${C2_BRANCH}\` / draft PR #675.
          - Exact parent C2 implementation: \`${C2_IMPLEMENTATION}\`.
          - Exact parent C2 clean handoff: \`${C2_HEAD}\`.
          - Controlling scope: \`docs/roadmaps/multicurrency-stock-funding-scope-v1.md\`.
          - Authority audit: \`docs/roadmaps/multicurrency-stock-funding-authority-audit-v1.md\`.
          - Schema/runtime inventory: \`docs/roadmaps/multicurrency-stock-funding-schema-inventory-v1.md\`.
          - Implementation plan: \`docs/roadmaps/multicurrency-stock-funding-implementation-plan-v1.md\`.
          - PR authority: \`docs/operations/contracts/player-cross-cutting/pr-${C3_PR}.json\`.

          ## Locked boundary

          Financial Markets retain security, exchange, listing currency, order, matching, fill, trade, fee, holding, cost-basis, P&L, cancellation, session, and replay authority. C0 owns one-to-three-Checking-account purchase funding and retail checkout FX; B1 owns accepted fixings; B2 owns accounts, holds, clearing, reserve, liquidity, and balanced journals.

          ## Current status

          \`SCOPE_ONLY — IMPLEMENTATION_NOT_STARTED\`. C3A is blocked until the exact buy-order root, maximum-exposure rule, matching transaction, partial-fill consumption, fee/seller recipients, cancellation release, and historical compatibility path are resolved against this branch.

          No merge, deployment, scheduler installation, secret mutation, staging/production SQL, or live-database operation is authorized.
          EOF
          sed -i 's/^          //' /tmp/c3-pr-body.md
          gh pr edit "$C3_PR" --repo "$REPOSITORY" --body-file /tmp/c3-pr-body.md

          echo "pr_number=${C3_PR}" >> "$GITHUB_OUTPUT"
          echo "existing=false" >> "$GITHUB_OUTPUT"

      - name: Remove automation carrier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$AUTOMATION_BRANCH"
          git checkout -B "$AUTOMATION_BRANCH" "origin/${AUTOMATION_BRANCH}"
          if [[ -f .github/workflows/c2-to-c3-watchdog-20260828-once.yml ]]; then
            rm .github/workflows/c2-to-c3-watchdog-20260828-once.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(roadmap): remove C2 to C3 watchdog"
            git push origin "HEAD:${AUTOMATION_BRANCH}"
          fi
