name: Checking and Savings Verdict Temporary

on:
  push:
    branches:
      - fix/checking-savings-wallet-convergence-v1
    paths:
      - .github/workflows/checking-savings-verdict-temporary.yml

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  verdict:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact verdict head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/checking-savings-wallet-convergence-v1
          fetch-depth: 0

      - name: Resolve exact code evidence commit
        id: evidence
        shell: bash
        run: |
          EVIDENCE_SHA="$(git rev-parse HEAD^)"
          EVIDENCE_MESSAGE="$(git log -1 --format=%s "${EVIDENCE_SHA}")"
          if [ "${EVIDENCE_MESSAGE}" != "Trigger exact CI for Checking and Savings convergence" ]; then
            echo "Expected exact-CI trigger parent, received: ${EVIDENCE_MESSAGE}" >&2
            exit 1
          fi
          echo "sha=${EVIDENCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "message=${EVIDENCE_MESSAGE}" >> "$GITHUB_OUTPUT"

      - name: Wait for and verify exact repository CI
        id: ci
        shell: bash
        run: |
          EVIDENCE_SHA="${{ steps.evidence.outputs.sha }}"
          workflows=(
            "Database Replay"
            "Player Local Currency Authority"
            "Player Terminal Verify"
            "Backend Typecheck"
            "Admin API Check"
            "Admin Browser E2E"
          )
          : > /tmp/checking-savings-ci.tsv
          for workflow in "${workflows[@]}"; do
            run_id=""
            for attempt in $(seq 1 80); do
              run_id="$(gh run list \
                --repo kohnerbouchard-star/Student-Profile \
                --workflow "${workflow}" \
                --commit "${EVIDENCE_SHA}" \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty')"
              if [ -n "${run_id}" ]; then break; fi
              sleep 15
            done
            if [ -z "${run_id}" ]; then
              printf '%s\t%s\t%s\n' "${workflow}" "missing" "missing" | tee -a /tmp/checking-savings-ci.tsv
              exit 1
            fi
            gh run watch "${run_id}" --repo kohnerbouchard-star/Student-Profile --exit-status
            conclusion="$(gh run view "${run_id}" \
              --repo kohnerbouchard-star/Student-Profile \
              --json conclusion \
              --jq '.conclusion')"
            printf '%s\t%s\t%s\n' "${workflow}" "${run_id}" "${conclusion}" | tee -a /tmp/checking-savings-ci.tsv
            test "${conclusion}" = "success"
          done

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.3

      - name: Install pinned tooling
        run: |
          npm install --global npm@10.9.8
          npm ci
          npm --prefix backend ci

      - name: Re-run focused source verification
        run: |
          node --test scripts/player-local-currency-authority-contract.test.mjs
          node --test scripts/checking-savings-account-type-contract.test.mjs
          node player-terminal/tests/store-local-currency.mjs
          npm --prefix backend run test:player-banking-public
          node scripts/validate-supabase-migrations.mjs
          node scripts/verify-player-cross-cutting-authority.mjs
          npm --prefix backend run typecheck
          git diff --check origin/main...HEAD

      - name: Write exact PASS evidence and remove temporary verdict
        shell: bash
        run: |
          python <<'PY'
          import json
          import os
          from pathlib import Path

          rows = []
          for line in Path('/tmp/checking-savings-ci.tsv').read_text(encoding='utf-8').splitlines():
              workflow, run_id, conclusion = line.split('\t')
              rows.append({
                  'workflow': workflow,
                  'runId': int(run_id),
                  'conclusion': conclusion,
              })
          evidence = {
              'schemaVersion': 'econovaria-checking-savings-exact-ci-v1',
              'decision': 'PASS',
              'evidenceCommit': '${{ steps.evidence.outputs.sha }}',
              'accountModel': {
                  'personalTransactionAccount': 'checking',
                  'personalSavingsAccount': 'savings',
                  'legacyCashAccountAllowed': False,
                  'businessOperatingAccountPattern': 'business:biz_[0-9a-f]{32}',
              },
              'requiredWorkflowRuns': rows,
              'focusedVerificationRepeated': True,
              'productionMutationPerformed': False,
          }
          target = Path('docs/operations/evidence/checking-savings-exact-ci-v1.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
          Path('.github/workflows/checking-savings-verdict-temporary.yml').unlink()
          PY

      - name: Refresh release authority for evidence file
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/operations/contracts/player-cross-cutting-verification-authority-v1.json')
          authority = json.loads(path.read_text(encoding='utf-8'))
          evidence = 'docs/operations/evidence/checking-savings-exact-ci-v1.json'
          authority['allowedPaths'] = sorted(set(authority.get('allowedPaths', [])) | {evidence})
          authority['requiredFiles'] = sorted(set(authority.get('requiredFiles', [])) | {evidence})
          path.write_text(json.dumps(authority, indent=2) + '\n', encoding='utf-8')
          PY
          node scripts/verify-player-cross-cutting-authority.mjs

      - name: Commit exact PASS evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/checking-savings-verdict-temporary.yml \
            docs/operations/contracts/player-cross-cutting-verification-authority-v1.json \
            docs/operations/evidence/checking-savings-exact-ci-v1.json
          git commit -m "Record exact Checking and Savings CI evidence"
          git push origin HEAD:fix/checking-savings-wallet-convergence-v1

      - name: Post PASS verdict
        run: |
          {
            echo "## Checking and Savings release verdict: PASS"
            echo
            echo "Exact code evidence commit: \`${{ steps.evidence.outputs.sha }}\`"
            echo
            echo "| Workflow | Run | Conclusion |"
            echo "|---|---:|---|"
            while IFS=$'\t' read -r workflow run conclusion; do
              echo "| ${workflow} | ${run} | ${conclusion} |"
            done < /tmp/checking-savings-ci.tsv
            echo
            echo "Focused Admin/Player account contracts, Store, Player Banking, migration validation, release authority, and backend typecheck were also repeated successfully."
            echo
            echo "No staging or production mutation was performed."
          } > /tmp/checking-savings-verdict-pass.md
          gh pr comment 501 --repo kohnerbouchard-star/Student-Profile --body-file /tmp/checking-savings-verdict-pass.md

      - name: Post FAIL verdict
        if: failure()
        run: |
          {
            echo "## Checking and Savings release verdict: FAIL"
            echo
            echo "PR #501 remains draft and must not be merged or deployed. At least one exact-commit workflow or repeated focused verification did not pass."
            if [ -f /tmp/checking-savings-ci.tsv ]; then
              echo
              echo '```text'
              cat /tmp/checking-savings-ci.tsv
              echo '```'
            fi
          } > /tmp/checking-savings-verdict-fail.md
          gh pr comment 501 --repo kohnerbouchard-star/Student-Profile --body-file /tmp/checking-savings-verdict-fail.md
