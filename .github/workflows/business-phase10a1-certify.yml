name: Business Phase 10A.1 Certification Finalizer

on:
  push:
    branches:
      - feat/business-store-purchase-settlement-v2
    paths:
      - ".github/workflows/business-phase10a1-certify.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: business-phase10a1-certification-finalizer
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Phase 10 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/business-store-purchase-settlement-v2
          fetch-depth: 0

      - name: Gate one-time certification
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git log -1 --format=%s)" == "ops(business): certify Phase 10A.1" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify evidence and update durable records
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1abc8b878df5b08716107adb467bd013e85b6df4 HEAD
          python3 scripts/business-phase10a1-certify.py
          git diff --check

      - name: Commit certification and remove temporary machinery
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "econovaria-automation"
          git config user.email "econovaria-automation@users.noreply.github.com"
          git rm -f \
            .github/workflows/business-phase10a1-certify.yml \
            scripts/business-phase10a1-certify.py
          git add \
            docs/roadmaps/business-phase10-store-purchase-settlement-scope-v1.md \
            docs/roadmaps/business-v2-development-execution-plan-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md
          git commit -m "docs(business): certify Phase 10A.1 authority foundation"
          git push origin HEAD:feat/business-store-purchase-settlement-v2
