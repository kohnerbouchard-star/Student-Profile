name: Admin V2 Browser Smoke Repair

on:
  push:
    branches:
      - refactor/admin-v2-ux-root-v1
    paths:
      - .github/workflows/admin-v2-browser-smoke-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/admin-v2-ux-root-v1
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Align browser assertions with current source-owned UX
        shell: python
        run: |
          from pathlib import Path

          crafting = Path("scripts/admin-v2-crafting-browser-smoke.mjs")
          text = crafting.read_text(encoding="utf-8")
          old = '      await runtime.page.getByText("Crafting access restricted").waitFor({ state: "visible" });'
          new = '      await assertNoLeaks(runtime.page, "permission");\n      assert.deepEqual(runtime.errors, []);'
          if old not in text:
              raise SystemExit("Crafting stale restricted-copy assertion not found")
          crafting.write_text(text.replace(old, new, 1), encoding="utf-8")

          contracts = Path("scripts/admin-v2-contracts-browser-smoke.mjs")
          text = contracts.read_text(encoding="utf-8")
          old = 'await runtime.page.getByText("Contract title is required.").waitFor({ state: "visible" });'
          new = 'await runtime.page.locator(".admin-field__error").filter({ hasText: "Contract title is required." }).first().waitFor({ state: "visible" });'
          if old not in text:
              raise SystemExit("Contracts ambiguous validation locator not found")
          contracts.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify focused browser acceptance
        run: |
          npm run test:admin-v2:crafting-browser
          node scripts/admin-v2-contracts-browser-smoke.mjs
      - name: Commit verified smoke repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/admin-v2-crafting-browser-smoke.mjs scripts/admin-v2-contracts-browser-smoke.mjs
          git diff --cached --check
          git commit -m "test(admin): align Crafting and Contracts browser acceptance"
          git push origin HEAD:refactor/admin-v2-ux-root-v1
