name: Temporary Marketplace V2 convergence

on:
  push:
    branches: [refactor/admin-ui-v2-marketplace-v1]
    paths:
      - ".github/workflows/_converge-marketplace-temp.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Replay Marketplace and close final V2 registry gap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin backup/admin-ui-v2-marketplace-preconvergence-20260810
          BASE=4c17b942fcf4b2a6f60b629549f192d066053ba4
          BACKUP=origin/backup/admin-ui-v2-marketplace-preconvergence-20260810
          git diff --binary "$BASE...$BACKUP" -- \
            admin/v2.html \
            admin/v2/src/app.js \
            admin/v2/src/core/navigation-registry.js \
            admin/v2/src/routes/marketplace/MarketplaceApiClient.js \
            admin/v2/src/routes/marketplace/MarketplaceController.js \
            admin/v2/src/routes/marketplace/MarketplaceRoute.js \
            admin/v2/src/routes/marketplace/MarketplaceSkeleton.js \
            admin/v2/styles/routes/marketplace.css \
            docs/architecture/admin-ui-v2-marketplace.md \
            docs/operations/evidence/admin-ui-v2-marketplace/contract-audit.md \
            docs/operations/evidence/admin-ui-v2-marketplace/validation.md \
            scripts/admin-v2-marketplace.test.mjs > /tmp/marketplace.patch
          set +e
          git apply --3way --index /tmp/marketplace.patch
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U | sort | tr '\n' ' ')"
            test "$unresolved" = "admin/v2.html admin/v2/src/app.js "
            git checkout --ours -- admin/v2.html admin/v2/src/app.js
            python - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text: raise SystemExit(f"missing Marketplace convergence anchor in {path}: {old[:120]!r}")
              p.write_text(text.replace(old,new,1))
          replace_once("admin/v2.html", '  <link rel="stylesheet" href="./v2/styles/routes/business.css" />\n', '  <link rel="stylesheet" href="./v2/styles/routes/business.css" />\n  <link rel="stylesheet" href="./v2/styles/routes/marketplace.css" />\n')
          replace_once("admin/v2/src/app.js", 'import { createBusinessController } from "./routes/business/BusinessController.js";\n', 'import { createBusinessController } from "./routes/business/BusinessController.js";\nimport { createMarketplaceApiClient } from "./routes/marketplace/MarketplaceApiClient.js";\nimport { createMarketplaceController } from "./routes/marketplace/MarketplaceController.js";\n')
          replace_once("admin/v2/src/app.js", '  const businessApi = createBusinessApi({ fetchImpl: transport });\n', '  const businessApi = createBusinessApi({ fetchImpl: transport });\n  const marketplaceApi = createMarketplaceApiClient({ fetchImpl: transport });\n')
          replace_once("admin/v2/src/app.js", '  const banking = createBankingController({\n', '  const marketplace = createMarketplaceController({\n    api: marketplaceApi,\n    selectedGameId,\n    hasPermission,\n    onChange: () => renderControllerChange("marketplace"),\n    notify: (notification) => toast?.push(notification),\n  });\n  const banking = createBankingController({\n')
          replace_once("admin/v2/src/app.js", '    banking: Object.freeze({\n', '    marketplace: Object.freeze({\n      controller: marketplace,\n      render: () => marketplace.render(),\n    }),\n    banking: Object.freeze({\n')
          old='Overview, Players, Attendance, Contracts, Store, Market, Inventory, Crafting, Business, Banking, Loans, World Management, News & Events, Messages, Progression, Settings, and Logs are native Admin v2 routes.'
          new='All Admin product destinations are now native Admin v2 routes, including Market and the separate Marketplace moderation surface.'
          replace_once("admin/v2/src/app.js", old, new)
          replace_once("admin/v2/src/app.js", '      business.destroy();\n', '      business.destroy();\n      marketplace.destroy();\n')

          replace_once("scripts/admin-v2-unit.test.mjs", '["overview", "players", "attendance", "market", "banking", "loans", "contracts", "business", "crafting", "store", "inventory", "world-management", "news-events", "messages", "progression", "settings", "logs"]', '["overview", "players", "attendance", "market", "banking", "loans", "contracts", "business", "crafting", "store", "marketplace", "inventory", "world-management", "news-events", "messages", "progression", "settings", "logs"]')
          replace_once("scripts/admin-v2-unit.test.mjs", '    ["marketplace"],\n', '    [],\n')
          replace_once("scripts/admin-v2-unit.test.mjs", '  assert.equal(isMigratedAdminRoute("inventory"), true);\n', '  assert.equal(isMigratedAdminRoute("marketplace"), true);\n  assert.equal(isMigratedAdminRoute("inventory"), true);\n')
          replace_once("scripts/admin-v2-unit.test.mjs", '  assert.equal(marketplace.migration, "planned");', '  assert.equal(marketplace.migration, "v2");')
          replace_once("scripts/admin-v2-unit.test.mjs", '  assert.equal(resolveAdminRouteBoundary({ routeId: "inventory" }).kind, "migrated");\n', '  assert.equal(resolveAdminRouteBoundary({ routeId: "marketplace" }).kind, "migrated");\n  assert.equal(resolveAdminRouteBoundary({ routeId: "inventory" }).kind, "migrated");\n')
          replace_once("package.json", 'scripts/admin-v2-business-api.test.mjs scripts/admin-v2-logs-api.test.mjs', 'scripts/admin-v2-business-api.test.mjs scripts/admin-v2-marketplace.test.mjs scripts/admin-v2-logs-api.test.mjs')
          PY
            git add -- admin/v2.html admin/v2/src/app.js scripts/admin-v2-unit.test.mjs package.json
          fi

          # The pre-convergence Marketplace test carried two source-shape assumptions
          # superseded by the merged authoritative contracts. Policy timestamps are
          # read metadata, not writable policy fields, and financial Market URLs are
          # now composed through marketBasePath(). Keep the behavioral separation
          # assertions while binding them to current source authority.
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/admin-v2-marketplace.test.mjs")
          text = p.read_text()
          old_policy = '    blockedCountryCodes: [],\n    updatedAt: "2026-08-07T00:00:00.000Z",\n  };\n}\n'
          new_policy = '    blockedCountryCodes: [],\n  };\n}\n'
          if old_policy not in text:
              raise SystemExit("missing Marketplace writable-policy fixture anchor")
          text = text.replace(old_policy, new_policy, 1)
          old_market = '  assert.match(marketClient, /\\/market\\/assets\\?include=quotes/);'
          new_market = '  assert.match(marketClient, /function marketBasePath\\(gameId\\)/);\n  assert.match(marketClient, /\\/assets\\?include=quotes/);'
          if old_market not in text:
              raise SystemExit("missing Marketplace financial-Market source anchor")
          text = text.replace(old_market, new_market, 1)
          p.write_text(text)
          PY
          git add -- scripts/admin-v2-marketplace.test.mjs

          rm .github/workflows/_converge-marketplace-temp.yml
          git add -u -- .github/workflows/_converge-marketplace-temp.yml
          git diff --cached --check
          node --check admin/v2/src/app.js
          node --check admin/v2/src/routes/marketplace/MarketplaceApiClient.js
          node --check admin/v2/src/routes/marketplace/MarketplaceController.js
          node --check admin/v2/src/routes/marketplace/MarketplaceRoute.js
          node --check admin/v2/src/routes/marketplace/MarketplaceSkeleton.js
          node --test scripts/admin-v2-marketplace.test.mjs
          node --test scripts/admin-v2-unit.test.mjs
          git commit -m "refactor(admin-v2): reconcile Marketplace and complete route migration"
          git push origin HEAD:refactor/admin-ui-v2-marketplace-v1
