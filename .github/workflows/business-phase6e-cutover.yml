name: Business Phase 6E Cutover

on:
  push:
    branches:
      - feat/business-timed-manufacturing-v2
    paths:
      - .github/workflows/business-phase6e-cutover.yml

permissions:
  contents: write

concurrency:
  group: business-phase6e-cutover
  cancel-in-progress: false

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            player-terminal/package-lock.json

      - name: Apply bounded Phase 6E cutover
        env:
          PHASE6E_PATCH_GZIP_BASE64: >-
            
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/business-timed-manufacturing-v2 feat/business-equipment-capacity-v2
          git reset --hard origin/feat/business-timed-manufacturing-v2
          printf '%s' "$PHASE6E_PATCH_GZIP_BASE64" | base64 --decode | gzip --decompress > /tmp/phase6e_cutover.py
          test "$(sha256sum /tmp/phase6e_cutover.py | awk '{print $1}')" = "1169570ebc7bee657159393e80b51efc6aac13f3389346e712bb66a9d738b98c"
          python3 /tmp/phase6e_cutover.py

      - name: Install root dependencies
        run: |
          npm install --global npm@10.9.8
          npm ci --ignore-scripts

      - name: Regenerate architecture inventory
        run: node scripts/architecture/build-architecture-inventory.mjs

      - name: Verify Phase 6 authority and Player cutover
        shell: bash
        run: |
          set -euo pipefail
          node scripts/business-phase6-manufacturing-foundation-contract.mjs
          node scripts/business-phase6-manufacturing-lifecycle-simulation.mjs
          node scripts/business-phase6-manufacturing-start-contract.mjs
          node scripts/business-phase6-manufacturing-start-simulation.mjs
          node scripts/business-phase6-manufacturing-completion-contract.mjs
          node scripts/business-phase6-manufacturing-completion-simulation.mjs
          node scripts/business-phase6-manufacturing-recovery-contract.mjs
          node scripts/business-phase6-manufacturing-recovery-simulation.mjs
          node scripts/business-phase6e-player-api-contract.mjs
          node scripts/validate-supabase-migrations.mjs
          node --test scripts/player-cross-cutting-authority.test.mjs
          git diff --name-only origin/feat/business-equipment-capacity-v2...HEAD > /tmp/phase6e-changed-files.txt
          node scripts/verify-player-cross-cutting-authority.mjs             --changed-files /tmp/phase6e-changed-files.txt             --pr-number 661             --base-ref feat/business-equipment-capacity-v2
          git diff --check

      - name: Run repository quality suite
        run: npm test

      - name: Verify backend and Edge TypeScript
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          npm run typecheck:all

      - name: Verify Player Terminal
        working-directory: player-terminal
        run: |
          npm ci --no-audit --no-fund
          npm run check
          node tests/business-banking-surface.mjs
          npm run adapter
          npm run capability-manifest-current
          npm run runtime-integration

      - name: Commit permanent Phase 6E source
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/business-phase6e-cutover.yml
          test ! -e .github/workflows/business-phase6e-inspection.yml
          test ! -e docs/roadmaps/.phase6e-inspection.json
          git add -A
          git diff --cached --check
          git commit -m "feat(business): cut over Player timed manufacturing"
          git push origin HEAD:feat/business-timed-manufacturing-v2
