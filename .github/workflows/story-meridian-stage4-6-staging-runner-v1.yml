name: Story Meridian Stage 4-6 Staging Runner V1

on:
  push:
    branches:
      - ops/story-meridian-stage4-6-staging-runner-v1
    paths:
      - ".github/workflows/story-meridian-stage4-6-staging-runner-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: story-meridian-stage4-6-staging-runner-v1
  cancel-in-progress: false

env:
  EXPECTED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  DENIED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  SOURCE_BASE_SHA: 6dbb7c0264ebe7f0d33222f7e686eaea07413acb
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  release:
    name: Deploy Stage 4-6 Story runner to staging
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      STOCK_MARKET_RUNNER_SECRET: ${{ secrets.STOCK_MARKET_RUNNER_SECRET }}

    steps:
      - name: Check out exact staging runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce source and staging-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_PASSWORD"
          test "$SUPABASE_PROJECT_REF" = "$EXPECTED_STAGING_PROJECT_REF"
          test "$SUPABASE_PROJECT_REF" != "$DENIED_PRODUCTION_PROJECT_REF"
          git merge-base --is-ancestor "$SOURCE_BASE_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$SOURCE_BASE_SHA"...HEAD)
          test "${#changed[@]}" = "1"
          test "${changed[0]}" = ".github/workflows/story-meridian-stage4-6-staging-runner-v1.yml"
          for path in \
            backend/supabase/functions/stock-market-runner/index.ts \
            backend/supabase/functions/stock-market-runner/storylineRunnerAfterTick.ts \
            backend/src/domains/storylines/contracts/storyEffectContracts.ts \
            backend/src/domains/storylines/services/storyEffectEngine.ts \
            backend/src/domains/storylines/infrastructure/supabaseStoryWorldFxWriter.ts
          do
            test -f "$path"
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$SOURCE_BASE_SHA:$path")"
          done

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.109.1

      - name: Link protected staging project
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"
          cp backend/supabase/config.next.toml backend/supabase/config.toml
          (
            cd backend
            supabase --yes link \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --password "$SUPABASE_DB_PASSWORD"
          )
          pooler_url="$(tr -d '\r\n' < backend/supabase/.temp/pooler-url)"
          case "$pooler_url" in
            "postgresql://postgres.${SUPABASE_PROJECT_REF}@"*:5432/postgres) ;;
            *) echo 'Invalid linked staging identity.' >&2; exit 1 ;;
          esac
          echo "::add-mask::$pooler_url"
          printf 'DATABASE_URL=%s\n' "$pooler_url" >> "$GITHUB_ENV"
          printf 'PGPASSWORD=%s\n' "$SUPABASE_DB_PASSWORD" >> "$GITHUB_ENV"
          printf 'PGSSLMODE=require\n' >> "$GITHUB_ENV"

      - name: Verify exact Stage 4-6 migration prerequisites
        shell: bash
        run: |
          set -euo pipefail
          count="$(psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select count(*) from supabase_migrations.schema_migrations where version in ('20260812103000','20260812110000','20260812111000','20260812114000')")"
          test "$count" = "4"
          test "$(psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select count(*) from supabase_migrations.schema_migrations where version = '20260812114000'")" = "1"

      - name: Ensure protected staging runner secret exists
        shell: bash
        run: |
          set -euo pipefail
          names="$RUNNER_TEMP/staging-secret-names.txt"
          supabase secrets list --project-ref "$EXPECTED_STAGING_PROJECT_REF" > "$names"
          if ! grep -q 'STOCK_MARKET_RUNNER_SECRET' "$names"; then
            test -n "$STOCK_MARKET_RUNNER_SECRET"
            supabase secrets set \
              "STOCK_MARKET_RUNNER_SECRET=$STOCK_MARKET_RUNNER_SECRET" \
              --project-ref "$EXPECTED_STAGING_PROJECT_REF"
            supabase secrets list --project-ref "$EXPECTED_STAGING_PROJECT_REF" > "$names"
          fi
          grep -q 'STOCK_MARKET_RUNNER_SECRET' "$names"
          rm -f "$names"

      - name: Capture pre-deploy runner identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/functions-before.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync(process.env.FUNCTIONS_PATH, 'utf8'));
          const row = rows.find((value) => value.slug === 'stock-market-runner');
          if (!row) throw new Error('stock-market-runner is missing before deployment.');
          fs.writeFileSync(process.env.EVIDENCE_PATH, `${JSON.stringify({
            version: row.version,
            digest: row.ezbr_sha256,
            verifyJwt: row.verify_jwt,
          }, null, 2)}\n`);
          NODE
        env:
          FUNCTIONS_PATH: ${{ runner.temp }}/functions-before.json
          EVIDENCE_PATH: ${{ runner.temp }}/stock-market-runner-before.json

      - name: Deploy exact current stock-market-runner to staging
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy stock-market-runner \
            --workdir backend \
            --project-ref "$EXPECTED_STAGING_PROJECT_REF" \
            --no-verify-jwt

      - name: Verify runner deployment advanced
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/functions-after.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync(process.env.BEFORE_PATH, 'utf8'));
          const rows = JSON.parse(fs.readFileSync(process.env.AFTER_PATH, 'utf8'));
          const row = rows.find((value) => value.slug === 'stock-market-runner');
          if (!row) throw new Error('stock-market-runner is missing after deployment.');
          if (row.verify_jwt !== false) throw new Error('stock-market-runner verify_jwt drifted.');
          if (!Number.isInteger(row.version) || row.version <= before.version) {
            throw new Error(`stock-market-runner version did not advance: ${before.version} -> ${row.version}`);
          }
          if (!/^[a-f0-9]{64}$/.test(String(row.ezbr_sha256 || ''))) {
            throw new Error('stock-market-runner digest is invalid.');
          }
          fs.writeFileSync(process.env.EVIDENCE_PATH, `${JSON.stringify({
            environment: 'staging',
            sourceBaseSha: process.env.SOURCE_BASE_SHA,
            version: row.version,
            priorVersion: before.version,
            digest: row.ezbr_sha256,
            verifyJwt: row.verify_jwt,
          }, null, 2)}\n`);
          NODE
        env:
          BEFORE_PATH: ${{ runner.temp }}/stock-market-runner-before.json
          AFTER_PATH: ${{ runner.temp }}/functions-after.json
          EVIDENCE_PATH: ${{ runner.temp }}/stock-market-runner-after.json

      - name: Run rollback-scoped Stage 5 to Stage 6 World and FX acceptance
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 --no-psqlrc <<'SQL' \
            2>&1 | tee /tmp/meridian-stage4-6-staging-runner-acceptance.log
          begin;
          do $accept$
          declare
            v_game uuid;
            v_revision bigint;
            v_storyline uuid;
            v_event_count integer;
            v_outcome text;
            v_rates integer;
          begin
            select g.id into v_game
            from public.game_sessions g
            join public.world_runtime_instances wr on wr.game_session_id = g.id
            where g.status in ('active','paused')
              and (select count(*) from public.world_route_states r where r.game_session_id = g.id) = 13
              and (select count(distinct (fx.from_currency_code, fx.to_currency_code))
                   from public.currency_exchange_rates fx
                   where fx.game_session_id = g.id
                     and fx.from_currency_code in ('NRC','YRC','THD','SLV','ELD','VAL','LUM','SYN','XAL','DRV')
                     and fx.to_currency_code in ('NRC','YRC','THD','SLV','ELD','VAL','LUM','SYN','XAL','DRV')
                     and fx.from_currency_code <> fx.to_currency_code) = 90
            order by g.created_at desc
            limit 1;
            if v_game is null then
              raise exception 'MERIDIAN_STAGING_WORLD_FX_FIXTURE_MISSING';
            end if;

            perform public.initialize_meridian_customs_security_intrusion_v1(v_game);
            perform public.initialize_meridian_security_center_attack_v1(v_game);
            perform public.initialize_meridian_emergency_response_v1(v_game);

            select id into v_storyline
            from public.storylines
            where lower(key) = lower('econovaria_demo_act_1') and is_active
            limit 1;
            select count(*)::integer into v_event_count
            from public.storyline_events
            where storyline_id = v_storyline
              and event_key in (
                'meridian_customs_security_intrusion',
                'meridian_security_center_attack',
                'meridian_emergency_response'
              )
              and is_active;
            if v_event_count <> 3 then
              raise exception 'MERIDIAN_STAGING_EVENT_COUNT_FAILED:%', v_event_count;
            end if;

            select revision into v_revision from public.world_runtime_instances where game_session_id = v_game;
            perform public.apply_world_location_state_v1(
              v_game, v_revision, 'story-staging-stage5-location-v1',
              '["loc_syndalis_meridian_security_center_v1"]'::jsonb,
              'conflict', clock_timestamp()
            );
            select revision into v_revision from public.world_runtime_instances where game_session_id = v_game;
            perform public.apply_world_route_state_v1(
              v_game, v_revision, 'story-staging-stage5-direct-route-v1',
              '["rte_meridian_syndalis_lumenor_v1"]'::jsonb,
              'closed', 'meridian_disruption', 18000, 26000, clock_timestamp()
            );
            select revision into v_revision from public.world_runtime_instances where game_session_id = v_game;
            perform public.apply_world_route_state_v1(
              v_game, v_revision, 'story-staging-stage5-alt-routes-v1',
              '["rte_meridian_dravenlok_syndalis_v1","rte_meridian_xalvoria_syndalis_v1"]'::jsonb,
              'restricted', 'meridian_disruption', 13500, 16000, clock_timestamp()
            );
            select command_outcome into v_outcome
            from public.apply_story_currency_volatility_v1(
              v_game, 'story-staging-stage5-fx-v1',
              '{"NRC":120,"YRC":-100,"THD":-150,"SLV":80,"ELD":-100,"VAL":0,"LUM":-250,"SYN":-500,"XAL":-180,"DRV":-160}'::jsonb,
              clock_timestamp()
            );
            if v_outcome <> 'applied' then
              raise exception 'MERIDIAN_STAGING_STAGE5_FX_FAILED:%', v_outcome;
            end if;

            select revision into v_revision from public.world_runtime_instances where game_session_id = v_game;
            perform public.apply_world_location_state_v1(
              v_game, v_revision, 'story-staging-stage6-location-v1',
              '["loc_syndalis_meridian_security_center_v1"]'::jsonb,
              'shortage', clock_timestamp()
            );
            select revision into v_revision from public.world_runtime_instances where game_session_id = v_game;
            perform public.apply_world_route_state_v1(
              v_game, v_revision, 'story-staging-stage6-direct-route-v1',
              '["rte_meridian_syndalis_lumenor_v1"]'::jsonb,
              'restricted', 'recovery', 13500, 17500, clock_timestamp()
            );
            select revision into v_revision from public.world_runtime_instances where game_session_id = v_game;
            perform public.apply_world_route_state_v1(
              v_game, v_revision, 'story-staging-stage6-alt-routes-v1',
              '["rte_meridian_dravenlok_syndalis_v1","rte_meridian_xalvoria_syndalis_v1"]'::jsonb,
              'restricted', 'recovery', 11250, 13000, clock_timestamp()
            );
            select revision into v_revision from public.world_runtime_instances where game_session_id = v_game;
            perform public.apply_world_route_state_v1(
              v_game, v_revision, 'story-staging-stage6-overflow-routes-v1',
              '["rte_meridian_lumenor_xalvoria_v1","rte_meridian_xalvoria_dravenlok_v1"]'::jsonb,
              'restricted', 'meridian_disruption', 11000, 12500, clock_timestamp()
            );
            select command_outcome into v_outcome
            from public.apply_story_currency_volatility_v1(
              v_game, 'story-staging-stage6-fx-v1',
              '{"NRC":40,"YRC":-30,"THD":-50,"SLV":20,"ELD":-30,"VAL":0,"LUM":-90,"SYN":-180,"XAL":-70,"DRV":-60}'::jsonb,
              clock_timestamp() + interval '1 second'
            );
            if v_outcome <> 'applied' then
              raise exception 'MERIDIAN_STAGING_STAGE6_FX_FAILED:%', v_outcome;
            end if;

            if not exists (
              select 1 from public.world_location_states
              where game_session_id = v_game
                and public_location_id = 'loc_syndalis_meridian_security_center_v1'
                and availability = 'shortage'
            ) then raise exception 'MERIDIAN_STAGING_STAGE6_LOCATION_FAILED'; end if;
            if not exists (
              select 1 from public.world_route_states
              where game_session_id = v_game
                and public_route_id = 'rte_meridian_syndalis_lumenor_v1'
                and status = 'restricted'
                and reason = 'recovery'
                and cost_multiplier_basis_points = 13500
                and duration_multiplier_basis_points = 17500
            ) then raise exception 'MERIDIAN_STAGING_STAGE6_DIRECT_ROUTE_FAILED'; end if;

            select count(*)::integer into v_rates
            from public.currency_exchange_rates
            where game_session_id = v_game
              and source in (
                'story-fx:story-staging-stage5-fx-v1',
                'story-fx:story-staging-stage6-fx-v1'
              );
            if v_rates <> 180 then
              raise exception 'MERIDIAN_STAGING_FX_ROW_COUNT_FAILED:%', v_rates;
            end if;

            raise notice 'MERIDIAN_STAGE4_6_STAGING_RUNNER_ACCEPTANCE_PASS game=% events=% fx_rows=%',
              v_game, v_event_count, v_rates;
          end
          $accept$;
          rollback;
          SQL
          grep -F 'MERIDIAN_STAGE4_6_STAGING_RUNNER_ACCEPTANCE_PASS' /tmp/meridian-stage4-6-staging-runner-acceptance.log

      - name: Verify staging-only final state
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = "$EXPECTED_STAGING_PROJECT_REF"
          test "$SUPABASE_PROJECT_REF" != "$DENIED_PRODUCTION_PROJECT_REF"
          count="$(psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select count(*) from supabase_migrations.schema_migrations where version in ('20260812103000','20260812110000','20260812111000','20260812114000')")"
          test "$count" = "4"

      - name: Upload staging runner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: story-meridian-stage4-6-runner-${{ github.sha }}
          path: |
            /tmp/meridian-stage4-6-staging-runner-acceptance.log
            ${{ runner.temp }}/stock-market-runner-before.json
            ${{ runner.temp }}/stock-market-runner-after.json
          if-no-files-found: warn
          retention-days: 30
