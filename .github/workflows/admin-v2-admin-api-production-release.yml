name: Admin V2 Admin API Production Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/admin-v2-admin-api-production-release.yml

permissions:
  contents: read

concurrency:
  group: admin-v2-admin-api-production-release-20260814
  cancel-in-progress: false

env:
  EXPECTED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  DENIED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  FUNCTION_NAME: admin-api
  SOURCE_COMMIT: 1cd3b19dc9222b00109f0cbc760a3c36057bad32
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  deploy:
    name: Deploy exact Admin API source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Enforce bounded production scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$EXPECTED_PRODUCTION_PROJECT_REF" = "cgiukdjwicykrmtkhudh"
          test "$EXPECTED_PRODUCTION_PROJECT_REF" != "$DENIED_STAGING_PROJECT_REF"
          test "$FUNCTION_NAME" = "admin-api"

      - name: Check out exact merged application source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact Admin API source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -f backend/supabase/functions/admin-api/index.ts
          test -f backend/supabase/functions/admin-api/localGameMutations.ts
          test -f backend/supabase/functions/admin-api/common.ts
          test -f backend/src/domains/contracts/application/adminContractMutation.ts
          grep -q '"admin_mutate_contract_v1"' backend/src/domains/contracts/application/adminContractMutation.ts
          grep -q 'operation: "update"' backend/supabase/functions/admin-api/localGameMutations.ts
          git diff --check
          git hash-object backend/src/domains/contracts/application/adminContractMutation.ts
          git hash-object backend/supabase/functions/admin-api/index.ts
          git hash-object backend/supabase/functions/admin-api/localGameMutations.ts
          git hash-object backend/supabase/functions/admin-api/common.ts

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Capture protected production baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/functions-before.json"
          FUNCTIONS_PATH="$RUNNER_TEMP/functions-before.json" node - <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync(process.env.FUNCTIONS_PATH, 'utf8'));
          const rows = Array.isArray(parsed) ? parsed : (parsed.functions || []);
          const row = rows.find((entry) => entry.slug === process.env.FUNCTION_NAME);
          if (!row) throw new Error('Production admin-api is missing.');
          if (row.verify_jwt !== true || row.status !== 'ACTIVE') throw new Error('Production admin-api security metadata is invalid.');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/admin-api-before-version.txt', String(row.version));
          fs.writeFileSync(process.env.RUNNER_TEMP + '/admin-api-before-digest.txt', String(row.ezbr_sha256 || ''));
          console.log(`Production admin-api baseline version ${row.version}; verify_jwt=true; status=ACTIVE`);
          NODE

      - name: Deploy only production admin-api
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy "$FUNCTION_NAME" \
            --workdir backend \
            --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF" \
            --use-api

      - name: Verify version, digest, JWT, and status advanced safely
        shell: bash
        run: |
          set -euo pipefail
          before_version="$(cat "$RUNNER_TEMP/admin-api-before-version.txt")"
          before_digest="$(cat "$RUNNER_TEMP/admin-api-before-digest.txt")"
          success=0
          for attempt in $(seq 1 20); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/functions" \
              > "$RUNNER_TEMP/functions-after.json"
            if BEFORE_VERSION="$before_version" BEFORE_DIGEST="$before_digest" FUNCTIONS_PATH="$RUNNER_TEMP/functions-after.json" node - <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync(process.env.FUNCTIONS_PATH, 'utf8'));
          const rows = Array.isArray(parsed) ? parsed : (parsed.functions || []);
          const row = rows.find((entry) => entry.slug === process.env.FUNCTION_NAME);
          if (!row) process.exit(1);
          if (Number(row.version) <= Number(process.env.BEFORE_VERSION)) process.exit(1);
          if (!row.ezbr_sha256 || row.ezbr_sha256 === process.env.BEFORE_DIGEST) process.exit(1);
          if (row.verify_jwt !== true || row.status !== 'ACTIVE') process.exit(1);
          NODE
            then
              success=1
              break
            fi
            sleep 3
          done
          test "$success" -eq 1
          BEFORE_VERSION="$before_version" BEFORE_DIGEST="$before_digest" FUNCTIONS_PATH="$RUNNER_TEMP/functions-after.json" node - <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync(process.env.FUNCTIONS_PATH, 'utf8'));
          const rows = Array.isArray(parsed) ? parsed : (parsed.functions || []);
          const row = rows.find((entry) => entry.slug === process.env.FUNCTION_NAME);
          if (!row || Number(row.version) <= Number(process.env.BEFORE_VERSION)) throw new Error('Production admin-api version did not advance.');
          if (!row.ezbr_sha256 || row.ezbr_sha256 === process.env.BEFORE_DIGEST) throw new Error('Production admin-api digest did not change.');
          if (row.verify_jwt !== true || row.status !== 'ACTIVE') throw new Error('Production admin-api security metadata changed unexpectedly.');
          console.log(`Production admin-api promoted to version ${row.version}; verify_jwt=true; status=ACTIVE`);
          NODE

      - name: Record bounded production release
        shell: bash
        run: |
          {
            echo "### Admin V2 admin-api production release"
            echo ""
            echo "- Source commit: $SOURCE_COMMIT"
            echo "- Production project: $EXPECTED_PRODUCTION_PROJECT_REF"
            echo "- Function: admin-api only"
            echo "- JWT verification: required"
            echo "- Database writes: none in this workflow"
            echo "- Staging project: explicitly denied"
          } >> "$GITHUB_STEP_SUMMARY"
