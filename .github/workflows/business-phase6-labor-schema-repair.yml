name: Business Phase 6 Labor Schema Repair

on:
  pull_request:
    branches:
      - feat/business-equipment-capacity-v2
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/business-phase6-labor-schema-repair.yml

permissions:
  contents: write

concurrency:
  group: business-phase6-labor-schema-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 661 && github.event.pull_request.head.ref == 'feat/business-timed-manufacturing-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0

      - name: Repair canonical labor reservation bindings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/business-timed-manufacturing-v2
          git reset --hard origin/feat/business-timed-manufacturing-v2

          python - <<'PY'
          from pathlib import Path

          path = Path("backend/supabase/migrations/20260823110200_business_manufacturing_start_resources_v2.sql")
          sql = path.read_text()

          replacements = [
            (
              """    select requirement.id,
      requirement.fixed_labor_minutes_per_run,
      requirement.labor_minutes_per_unit,
      requirement.minimum_headcount
""",
              """    select requirement.id,
      requirement.role_definition_id,
      requirement.fixed_labor_minutes_per_run,
      requirement.labor_minutes_per_unit,
      requirement.minimum_headcount
""",
              "labor validator requirement identity",
            ),
            (
              """      and reservation.requirement_id = v_requirement.id
      and reservation.manufacturing_job_id = v_job.id
      and reservation.status in ('reserved','active');
""",
              """      and reservation.role_definition_id = v_requirement.role_definition_id
      and reservation.manufacturing_job_id = v_job.id
      and reservation.reservation_kind = 'production_job'
      and reservation.status in ('reserved','active');
""",
              "labor validator reservation binding",
            ),
            (
              """        employee_id,
        requirement_id,
        manufacturing_job_id,
        period_key,
        intent_ref,
        reserved_minutes,
        status,
        idempotency_key,
        request_hash
""",
              """        employee_id,
        role_definition_id,
        manufacturing_job_id,
        period_key,
        reservation_kind,
        source_reference_key,
        reserved_minutes,
        status,
        idempotency_key,
        request_hash,
        metadata
""",
              "labor reservation columns",
            ),
            (
              """        v_employee.id,
        v_requirement.id,
        v_job.id,
        v_period_key,
        v_intent_ref,
        v_allocate,
        'reserved',
        v_reservation_idempotency,
        v_reservation_hash
""",
              """        v_employee.id,
        v_requirement.role_definition_id,
        v_job.id,
        v_period_key,
        'production_job',
        v_intent_ref,
        v_allocate,
        'reserved',
        v_reservation_idempotency,
        v_reservation_hash,
        jsonb_build_object(
          'requirementKey', v_requirement.public_key,
          'jobKey', v_job.public_key
        )
""",
              "labor reservation values",
            ),
          ]

          for old, new, label in replacements:
              count = sql.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label}; found {count}")
              sql = sql.replace(old, new, 1)

          path.write_text(sql)

          contract_path = Path("scripts/business-phase6-manufacturing-start-contract.mjs")
          contract = contract_path.read_text()
          anchor = """requireTokens(sql, \"Commit-time resource proof\", [
  \"validate_business_manufacturing_resources_v2\",
  \"deferrable initially deferred\",
  \"BUSINESS_MANUFACTURING_MATERIAL_HOLD_INCOMPLETE\",
  \"BUSINESS_MANUFACTURING_LABOR_HOLD_INCOMPLETE\",
  \"BUSINESS_MANUFACTURING_EQUIPMENT_HOLD_INCOMPLETE\",
  \"set constraints validate_business_manufacturing_resources_v2 immediate\",
]);
"""
          addition = anchor + """

requireTokens(sql, \"Canonical manufacturing labor reservation binding\", [
  \"requirement.role_definition_id\",
  \"reservation.role_definition_id = v_requirement.role_definition_id\",
  \"reservation.reservation_kind = 'production_job'\",
  \"role_definition_id,\\n        manufacturing_job_id\",
  \"reservation_kind,\\n        source_reference_key\",
  \"'requirementKey', v_requirement.public_key\",
]);
forbidTokens(sql, \"Retired manufacturing labor reservation columns\", [
  \"reservation.requirement_id = v_requirement.id\\n      and reservation.manufacturing_job_id\",
  \"employee_id,\\n        requirement_id,\\n        manufacturing_job_id\",
]);
"""
          if contract.count(anchor) != 1:
              raise SystemExit("Unexpected Phase 6 start contract anchor")
          contract = contract.replace(anchor, addition, 1)
          contract_path.write_text(contract)
          PY

          rm -f .github/workflows/business-phase6-labor-schema-repair.yml

          node scripts/business-phase6-manufacturing-start-contract.mjs
          node scripts/business-phase6-manufacturing-start-simulation.mjs
          node scripts/business-phase6-manufacturing-completion-contract.mjs
          node scripts/business-phase6-manufacturing-completion-simulation.mjs
          node scripts/business-phase6-manufacturing-recovery-contract.mjs
          node scripts/business-phase6-manufacturing-recovery-simulation.mjs
          node scripts/business-phase6-manufacturing-lifecycle-simulation.mjs
          node scripts/validate-supabase-migrations.mjs
          git diff --check

          git add -A
          git commit -m "fix(business): bind manufacturing labor to canonical schema"
          git push origin HEAD:feat/business-timed-manufacturing-v2
