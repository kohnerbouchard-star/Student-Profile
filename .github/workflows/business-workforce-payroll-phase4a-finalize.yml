name: Business Workforce Payroll Phase 4A Finalize

on:
  pull_request:
    paths:
      - "backend/supabase/migrations/20260822*.sql"
      - "scripts/business-workforce-payroll-*.mjs"
      - "docs/architecture/business-workforce-payroll-*.md"
      - "docs/architecture/inventories/econovaria-architecture-inventory-v2.json"
      - ".github/workflows/business-workforce-payroll-phase4a-finalize.yml"
      - ".github/workflows/business-banking-runtime.yml"
      - ".github/workflows/runtime-interaction-wiring.yml"
      - ".github/workflows/staging-readiness-preflight.yml"

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: business-workforce-payroll-phase4a-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  certify:
    if: github.event.pull_request.number == 657
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      FEATURE_BRANCH: feat/business-workforce-payroll-foundation-v2
      IMMUTABLE_SOURCE_SHA: f72626f055004007823eb8de22569035ac897797
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/business-workforce-payroll-foundation-v2
          fetch-depth: 0

      - name: Resolve immutable implementation and verification heads
        id: source
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/business-workforce-payroll-phase4a-finalize.yml
          workflow_add_commit=$(
            git log --diff-filter=A --format=%H -- "$workflow" | tail -n 1
          )
          test -n "$workflow_add_commit"
          source_sha=$(git rev-parse "${workflow_add_commit}^")
          verification_sha=$(git rev-parse "$workflow_add_commit")
          current_sha=$(git rev-parse HEAD)

          test "$source_sha" = "$IMMUTABLE_SOURCE_SHA"

          source_delta=$(git diff --name-only "$source_sha" "$verification_sha")
          test "$source_delta" = "$workflow"

          current_delta=$(
            git diff --name-only "$verification_sha" "$current_sha"
          )
          while IFS= read -r changed_path; do
            test -z "$changed_path" && continue
            case "$changed_path" in
              "$workflow"|.github/workflows/business-banking-runtime.yml|.github/workflows/runtime-interaction-wiring.yml|.github/workflows/staging-readiness-preflight.yml) ;;
              *)
                echo "Unexpected post-verification change: $changed_path" >&2
                exit 1
                ;;
            esac
          done <<< "$current_delta"
          grep -qx "$workflow" <<< "$current_delta"

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "verification_sha=$verification_sha" >> "$GITHUB_OUTPUT"
          echo "current_sha=$current_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            player-terminal/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Validate Phase 4A authority and migration source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/business-workforce-payroll-foundation-contract.mjs
          node scripts/business-workforce-payroll-scope-hardening-contract.mjs
          node scripts/business-banking-runtime-contract.mjs
          node scripts/validate-supabase-migrations.mjs
          node scripts/architecture/build-architecture-inventory.mjs
          git diff --exit-code -- \
            docs/architecture/inventories/econovaria-architecture-inventory-v2.json

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Run repository quality suite
        run: npm test

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Run backend typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Install Player Terminal dependencies
        working-directory: player-terminal
        run: npm ci --no-audit --no-fund

      - name: Run complete Player Terminal verification
        working-directory: player-terminal
        run: npm run verify

      - name: Install Chromium
        working-directory: player-terminal
        run: npx playwright install --with-deps chromium

      - name: Materialize browser-only runtime fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p player-terminal/frontend/src/core
          cp frontend/src/core/runtime-config.js \
            player-terminal/frontend/src/core/runtime-config.js
          cat > player-terminal/runtime-config.env.js <<'EOF'
          window.__ECONOVARIA_RUNTIME_CONFIG__ = Object.freeze({
            environment: "development",
            projectRef: "runtimefixture123456",
            supabaseUrl: "https://runtimefixture123456.supabase.co",
            supabasePublishableKey: "sb_publishable_runtime_fixture_1234567890"
          });
          EOF

      - name: Run Chromium Player verification
        working-directory: player-terminal
        run: npm run browser

      - name: Dispatch exact-head path-filtered workflows
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = os.environ["FEATURE_BRANCH"]
          workflows = [
              "business-banking-runtime.yml",
              "runtime-interaction-wiring.yml",
          ]
          for workflow in workflows:
              url = (
                  f"https://api.github.com/repos/{repository}/actions/"
                  f"workflows/{workflow}/dispatches"
              )
              request = urllib.request.Request(
                  url,
                  data=json.dumps({"ref": branch}).encode("utf-8"),
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 204:
                      raise SystemExit(
                          f"Unexpected dispatch response for {workflow}: "
                          f"{response.status}"
                      )
          PY

      - name: Wait for required exact-head workflows
        env:
          VERIFICATION_SHA: ${{ steps.source.outputs.verification_sha }}
          CURRENT_SHA: ${{ steps.source.outputs.current_sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          heads = [
              os.environ["VERIFICATION_SHA"],
              os.environ["CURRENT_SHA"],
          ]
          required = [
              "Business Workforce Payroll V2",
              "Database Replay",
              "Backend Typecheck",
              "Business Banking Runtime",
              "Repository Quality",
              "Runtime Interaction Wiring",
              "Supply Chain Security",
              "Admin API Check",
              "Staging Readiness Preflight",
              "Required Game Market Timezone",
              "Exchange Calendar Runtime",
          ]

          def request_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          deadline = time.time() + 40 * 60
          last_state = None
          while time.time() < deadline:
              runs = []
              for head in heads:
                  url = (
                      f"https://api.github.com/repos/{repository}/actions/runs"
                      f"?head_sha={head}&per_page=100"
                  )
                  runs.extend(request_json(url).get("workflow_runs", []))

              state = {}
              for name in required:
                  candidates = [
                      run for run in runs
                      if run.get("name") == name
                  ]
                  candidates.sort(
                      key=lambda run: (
                          run.get("created_at") or "",
                          int(run.get("run_attempt") or 0),
                      ),
                      reverse=True,
                  )
                  successful = next(
                      (
                          run for run in candidates
                          if run.get("status") == "completed"
                          and run.get("conclusion") == "success"
                      ),
                      None,
                  )
                  active = next(
                      (
                          run for run in candidates
                          if run.get("status") != "completed"
                      ),
                      None,
                  )
                  latest = candidates[0] if candidates else None
                  state[name] = {
                      "ok": successful is not None,
                      "active": active is not None,
                      "runId": (
                          successful.get("id") if successful else None
                      ),
                      "headSha": (
                          successful.get("head_sha") if successful else None
                      ),
                      "latestStatus": (
                          latest.get("status") if latest else "missing"
                      ),
                      "latestConclusion": (
                          latest.get("conclusion") if latest else None
                      ),
                  }

              if state != last_state:
                  print(
                      json.dumps(state, indent=2, sort_keys=True),
                      flush=True,
                  )
                  last_state = state

              if all(item["ok"] for item in state.values()):
                  Path("/tmp/phase4a-exact-head-gates.json").write_text(
                      json.dumps(state, indent=2, sort_keys=True) + "\n",
                      encoding="utf-8",
                  )
                  break

              terminal_failures = [
                  name
                  for name, item in state.items()
                  if not item["ok"]
                  and not item["active"]
                  and item["latestStatus"] == "completed"
                  and item["latestConclusion"]
                  not in (None, "success", "cancelled", "action_required")
              ]
              if terminal_failures:
                  raise SystemExit(
                      "Required exact-head workflows failed: "
                      + ", ".join(terminal_failures)
                  )
              time.sleep(20)
          else:
              raise SystemExit(
                  "Timed out waiting for required exact-head workflows: "
                  + json.dumps(last_state, sort_keys=True)
              )
          PY

      - name: Record durable Phase 4A certification
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          VERIFICATION_SHA: ${{ steps.source.outputs.verification_sha }}
          CURRENT_SHA: ${{ steps.source.outputs.current_sha }}
          CERTIFICATION_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from datetime import date
          from pathlib import Path

          source_sha = os.environ["SOURCE_SHA"]
          verification_sha = os.environ["VERIFICATION_SHA"]
          current_sha = os.environ["CURRENT_SHA"]
          certification_run_id = os.environ["CERTIFICATION_RUN_ID"]
          gates = json.loads(
              Path("/tmp/phase4a-exact-head-gates.json").read_text(
                  encoding="utf-8"
              )
          )

          plan_path = Path(
              "docs/roadmaps/business-v2-development-execution-plan-v1.md"
          )
          log_path = Path(
              "docs/roadmaps/business-v2-development-execution-log-v1.md"
          )

          plan = plan_path.read_text(encoding="utf-8")
          phase_start = plan.index("## Phase 4")
          phase_end = plan.find("\n## Phase 5", phase_start)
          if phase_end < 0:
              phase_end = len(plan)
          phase = plan[phase_start:phase_end]
          phase, count = re.subn(
              r"\*\*Status:\*\*[^\n]*",
              (
                  "**Status:** IN PROGRESS — checkpoint A complete; "
                  "candidate pools and server-owned hiring remain open"
              ),
              phase,
              count=1,
          )
          if count != 1:
              raise SystemExit("Phase 4 roadmap status was not found")

          checkpoint = (
              "- **4A:** canonical workforce/payroll authority foundation "
              f"and scope hardening, certified source `{source_sha}`."
          )
          if checkpoint not in phase:
              anchor = "\nExit:"
              if anchor not in phase:
                  raise SystemExit("Phase 4 exit anchor was not found")
              certification = (
                  "\nCertified checkpoints:\n\n"
                  f"{checkpoint}\n"
              )
              phase = phase.replace(anchor, certification + anchor, 1)

          plan = plan[:phase_start] + phase + plan[phase_end:]
          plan_path.write_text(plan.rstrip() + "\n", encoding="utf-8")

          if source_sha not in log_path.read_text(encoding="utf-8"):
              verification_lines = "\n".join(
                  (
                      f"- **{name} — PASS** (`{item['runId']}`, "
                      f"head `{item['headSha']}`)."
                  )
                  for name, item in gates.items()
              )
              entry = f"""

---
## {date.today().isoformat()} — Phase 4A COMPLETE: workforce and payroll authority foundation

### Certified implementation and verification sources

- **Exact implementation SHA:** `{source_sha}`.
- **Exact workflow verification SHA:** `{verification_sha}`.
- **Exact trigger-only verification SHA:** `{current_sha}`.
- Feature branch: `feat/business-workforce-payroll-foundation-v2`.
- Stacked draft PR: #657, based on `refactor/business-abstract-input-retirement-v2`.
- Integration PR #648 and parent Phase 3 PR #656 remained open, draft, and unmerged.
- No staging or production deployment or live data mutation was performed.
- The verification heads differ from the implementation only by one-use certification orchestration and temporary workflow-dispatch triggers; neither replaces the implementation SHA.

### What changed

- Added canonical workforce-role definitions, game-scoped candidate offers, recipe labor requirements, finite labor reservations, payroll runs, and payroll entries.
- Migrated active legacy employees into canonical workforce roles with integer productivity basis points, skill basis points, and finite labor capacity.
- Added server-authoritative functions for role publication, candidate publication, recipe labor configuration, labor reservation/consumption/release, and payroll evidence recording.
- Added a forward hardening migration that binds labor reservations and payroll entries to one Business, employee, role, run, and currency scope through composite foreign keys.
- Enforced canonical role skill floors for candidate offers, recipe labor requirements, and later role-minimum increases.
- Revoked direct service-role DELETE authority from durable workforce and payroll evidence tables; status transitions remain the operational lifecycle.
- Preserved browser denial, service-role-only function authority, stable public keys, game isolation, immutable payroll-entry checksums, and the Phase 4A no-settlement/no-production-integration boundary.

### Exact-head verification

{verification_lines}
- **Repository source tests, migration validation, architecture inventory, and backend typecheck — PASS** in certification run `{certification_run_id}`.
- **Player Terminal Verify and Chromium browser verification — PASS** in certification run `{certification_run_id}`.

### Architecture and gameplay decisions

- Workforce roles, candidate economics, finite capacity, recipe labor requirements, and payroll evidence are database authority, not browser-authored state.
- Phase 4A records payroll evidence but does not debit Business cash, post ledger entries, or execute payroll settlement.
- Phase 4A provides labor-reservation authority but does not yet attach it to production execution.
- Relational scope is enforced by composite foreign keys rather than application-only checks.
- Durable workforce and payroll evidence is retired through status transitions, not direct service-role deletion.

### Remaining Phase 4 work

Phase 4 is not complete. Candidate-pool reads and server-owned hiring remain open, followed by bounded payroll settlement and production-labor integration.

### Next authorized step

**Phase 4B — candidate pools and server-owned hiring is OPEN.** Expose role-grouped, game-scoped candidates; derive wage, skill, productivity, capacity, country, and currency exclusively from server-owned candidate rows; reserve a candidate atomically before hire; prevent duplicate active hires; and retire new Player execution through the legacy free-text hiring RPC. Payroll settlement and production-labor integration remain closed.
"""
              with log_path.open("a", encoding="utf-8") as handle:
                  handle.write(entry.rstrip() + "\n")
          PY

          git checkout "$VERIFICATION_SHA" -- \
            .github/workflows/business-banking-runtime.yml \
            .github/workflows/runtime-interaction-wiring.yml \
            .github/workflows/staging-readiness-preflight.yml
          rm .github/workflows/business-workforce-payroll-phase4a-finalize.yml
          git diff --check
          git fetch origin "$FEATURE_BRANCH"
          test "$(git rev-parse origin/$FEATURE_BRANCH)" = "$CURRENT_SHA"
          git config user.name "econovaria-phase4a-certifier"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            docs/roadmaps/business-v2-development-execution-plan-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md \
            .github/workflows/business-banking-runtime.yml \
            .github/workflows/runtime-interaction-wiring.yml \
            .github/workflows/staging-readiness-preflight.yml
          git add -u -- \
            .github/workflows/business-workforce-payroll-phase4a-finalize.yml
          git commit -m "docs(business): certify Phase 4A workforce foundation"
          git push origin HEAD:feat/business-workforce-payroll-foundation-v2
