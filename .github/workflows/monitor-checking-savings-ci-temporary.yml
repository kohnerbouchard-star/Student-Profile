name: Monitor Checking and Savings CI Temporary

on:
  push:
    branches:
      - fix/checking-savings-wallet-convergence-v1
    paths:
      - .github/workflows/monitor-checking-savings-ci-temporary.yml

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  monitor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/checking-savings-wallet-convergence-v1
          fetch-depth: 0

      - name: Wait for exact code-commit workflows
        shell: bash
        run: |
          TARGET_SHA="$(git rev-parse HEAD^)"
          echo "Monitoring exact code commit: ${TARGET_SHA}"
          workflows=(
            "Database Replay"
            "Player Local Currency Authority"
            "Player Terminal Verify"
            "Backend Typecheck"
            "Admin API Check"
            "Admin Browser E2E"
          )
          : > /tmp/checking-savings-ci-results.tsv
          for workflow in "${workflows[@]}"; do
            run_id=""
            for attempt in $(seq 1 45); do
              run_id="$(gh run list \
                --repo kohnerbouchard-star/Student-Profile \
                --workflow "${workflow}" \
                --commit "${TARGET_SHA}" \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty')"
              if [ -n "${run_id}" ]; then
                break
              fi
              sleep 20
            done
            if [ -z "${run_id}" ]; then
              printf '%s\t%s\t%s\n' "${workflow}" "missing" "not_found" | tee -a /tmp/checking-savings-ci-results.tsv
              exit 1
            fi
            gh run watch "${run_id}" --repo kohnerbouchard-star/Student-Profile --exit-status
            conclusion="$(gh run view "${run_id}" \
              --repo kohnerbouchard-star/Student-Profile \
              --json conclusion \
              --jq '.conclusion')"
            printf '%s\t%s\t%s\n' "${workflow}" "${run_id}" "${conclusion}" | tee -a /tmp/checking-savings-ci-results.tsv
            test "${conclusion}" = "success"
          done
          echo "TARGET_SHA=${TARGET_SHA}" >> "$GITHUB_ENV"

      - name: Record exact CI PASS
        run: |
          {
            echo "## Exact Checking and Savings CI: PASS"
            echo
            echo "Exact code commit: \`${TARGET_SHA}\`"
            echo
            echo "| Workflow | Run | Conclusion |"
            echo "|---|---:|---|"
            while IFS=$'\t' read -r workflow run conclusion; do
              echo "| ${workflow} | ${run} | ${conclusion} |"
            done < /tmp/checking-savings-ci-results.tsv
            echo
            echo "The database replay, account authority, Admin/Player application checks, and typecheck all passed on the exact coordinated code commit. No staging or production database mutation was performed by this monitor."
          } > /tmp/checking-savings-ci-pass.md
          gh pr comment 501 --repo kohnerbouchard-star/Student-Profile --body-file /tmp/checking-savings-ci-pass.md

      - name: Remove temporary monitor
        run: |
          rm -- .github/workflows/monitor-checking-savings-ci-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/monitor-checking-savings-ci-temporary.yml
          git commit -m "Remove temporary Checking and Savings CI monitor"
          git push origin HEAD:fix/checking-savings-wallet-convergence-v1

      - name: Record exact CI FAIL
        if: failure()
        run: |
          {
            echo "## Exact Checking and Savings CI: FAIL"
            echo
            echo "At least one required workflow for the exact code commit was missing or failed. PR #501 remains draft and must not be merged or deployed."
            if [ -f /tmp/checking-savings-ci-results.tsv ]; then
              echo
              echo '```text'
              cat /tmp/checking-savings-ci-results.tsv
              echo '```'
            fi
          } > /tmp/checking-savings-ci-fail.md
          gh pr comment 501 --repo kohnerbouchard-star/Student-Profile --body-file /tmp/checking-savings-ci-fail.md
