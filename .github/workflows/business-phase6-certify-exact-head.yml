name: Business Phase 6 Exact-Head Certification

on:
  push:
    branches:
      - feat/business-timed-manufacturing-v2
    paths:
      - .github/workflows/business-phase6-certify-exact-head.yml

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: business-phase6-exact-head-certification
  cancel-in-progress: false

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BRANCH: feat/business-timed-manufacturing-v2
      PR_NUMBER: "661"
    steps:
      - name: Check out exact Phase 6 branch
        uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            player-terminal/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Normalize final Player Edge authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def export_handler(path_value: str, handler_name: str) -> None:
              path = Path(path_value)
              source = path.read_text()
              if f"export async function {handler_name}" in source:
                  return
              replaced = 0
              for pattern in (
                  r"Deno\.serve\(async \(request: Request\) => \{",
                  r"Deno\.serve\(async \(request\) => \{",
              ):
                  source, replaced = re.subn(
                      pattern,
                      f"export async function {handler_name}(request: Request): Promise<Response> {{",
                      source,
                      count=1,
                  )
                  if replaced:
                      break
              if replaced != 1:
                  raise SystemExit(f"Could not locate Deno.serve registration in {path_value}")
              trimmed = source.rstrip()
              if not trimmed.endswith("});"):
                  raise SystemExit(f"Unexpected runtime terminator in {path_value}")
              path.write_text(trimmed[:-3] + "}\n")

          export_handler(
              "backend/supabase/functions/player-api/runtime.ts",
              "handlePlayerApiRequest",
          )
          export_handler(
              "backend/supabase/functions/player-web-session-api/runtime.ts",
              "handlePlayerWebSessionApiRequest",
          )

          Path("backend/supabase/functions/player-api/trustedClientIpServe.ts").write_text(
              '''import { bindGatewayTrustedClientIp } from "../../../src/security/edgeGatewayClientIp.ts";\n\nexport function preparePlayerApiRequest(incomingRequest: Request): Request {\n  return bindGatewayTrustedClientIp(\n    incomingRequest,\n    Deno.env.get("ECONOVARIA_TRUSTED_CLIENT_IP_HEADER"),\n  );\n}\n'''
          )
          Path("backend/supabase/functions/player-api/index.ts").write_text(
              '''import { handlePlayerApiRequest } from "./runtime.ts";\nimport { preparePlayerApiRequest } from "./trustedClientIpServe.ts";\n\nDeno.serve((incomingRequest: Request) =>\n  handlePlayerApiRequest(preparePlayerApiRequest(incomingRequest))\n);\n'''
          )
          Path("backend/supabase/functions/player-web-session-api/trustedClientIpServe.ts").write_text(
              '''import { bindGatewayTrustedClientIp } from "../../../src/security/edgeGatewayClientIp.ts";\n\nconst MAX_MATERIALIZED_BODY_BYTES = 1_048_577;\n\nasync function materializeBoundedRequestBody(request: Request): Promise<Request> {\n  const method = request.method.toUpperCase();\n  if (request.body === null || method === "GET" || method === "HEAD" || method === "OPTIONS") return request;\n  const reader = request.body.getReader();\n  const chunks: Uint8Array[] = [];\n  let totalBytes = 0;\n  try {\n    while (true) {\n      const { done, value } = await reader.read();\n      if (done) break;\n      if (!value?.byteLength) continue;\n      const remainingBytes = MAX_MATERIALIZED_BODY_BYTES - totalBytes;\n      const chunk = value.byteLength > remainingBytes ? value.subarray(0, remainingBytes) : value;\n      chunks.push(chunk);\n      totalBytes += chunk.byteLength;\n      if (totalBytes >= MAX_MATERIALIZED_BODY_BYTES) {\n        await reader.cancel("Player request body capture limit reached").catch(() => {});\n        break;\n      }\n    }\n  } finally {\n    reader.releaseLock();\n  }\n  const body = new Uint8Array(totalBytes);\n  let offset = 0;\n  for (const chunk of chunks) {\n    body.set(chunk, offset);\n    offset += chunk.byteLength;\n  }\n  const headers = new Headers(request.headers);\n  headers.delete("content-length");\n  return new Request(request.url, { method: request.method, headers, body, signal: request.signal });\n}\n\nexport async function preparePlayerWebSessionRequest(\n  incomingRequest: Request,\n): Promise<Request> {\n  const materializedRequest = await materializeBoundedRequestBody(incomingRequest);\n  return bindGatewayTrustedClientIp(\n    materializedRequest,\n    Deno.env.get("ECONOVARIA_TRUSTED_CLIENT_IP_HEADER"),\n  );\n}\n'''
          )
          Path("backend/supabase/functions/player-web-session-api/index.ts").write_text(
              '''import { handlePlayerWebSessionApiRequest } from "./runtime.ts";\nimport { preparePlayerWebSessionRequest } from "./trustedClientIpServe.ts";\n\nDeno.serve(async (incomingRequest: Request) =>\n  handlePlayerWebSessionApiRequest(await preparePlayerWebSessionRequest(incomingRequest))\n);\n'''
          )

          authority_path = Path(
              "docs/operations/contracts/player-cross-cutting-verification-authority-v1.json"
          )
          authority = json.loads(authority_path.read_text())
          authority["allowedPaths"] = sorted(set(authority["allowedPaths"]) | {
              "backend/supabase/functions/_shared/playerBusinessDispatch.ts",
              "backend/supabase/functions/player-api/index.ts",
              "backend/supabase/functions/player-api/runtime.ts",
              "backend/supabase/functions/player-api/trustedClientIpServe.ts",
              "backend/supabase/functions/player-web-session-api/index.ts",
              "backend/supabase/functions/player-web-session-api/runtime.ts",
              "backend/supabase/functions/player-web-session-api/trustedClientIpServe.ts",
              "scripts/player-edge-trusted-ip-entrypoint-contract.test.mjs",
          })
          authority_path.write_text(json.dumps(authority, indent=2) + "\n")
          PY

      - name: Write final direct-entrypoint contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/player-edge-trusted-ip-entrypoint-contract.test.mjs")
          source = path.read_text()
          start = source.find('for (const functionName of functions) {')
          if start >= 0:
              end = source.index('\ntest("Player read resilience', start)
              replacement = '''for (const functionName of functions) {
            test(`${functionName} prepares trusted IP before invoking its exported handler`, async () => {
              const root = `backend/supabase/functions/${functionName}`;
              const entrypoint = await readFile(`${root}/index.ts`, "utf8");
              const trustedServe = await readFile(`${root}/trustedClientIpServe.ts`, "utf8");
              const runtime = await readFile(`${root}/runtime.ts`, "utf8");
              const definition = functionName === "player-api"
                ? { handler: "handlePlayerApiRequest", prepare: "preparePlayerApiRequest" }
                : { handler: "handlePlayerWebSessionApiRequest", prepare: "preparePlayerWebSessionRequest" };
              assert.match(entrypoint, /Deno\\.serve\\(/u);
              assert.match(entrypoint, new RegExp(definition.prepare, "u"));
              assert.match(entrypoint, new RegExp(definition.handler, "u"));
              assert.ok(entrypoint.indexOf(definition.prepare) < entrypoint.lastIndexOf(definition.handler));
              assert.doesNotMatch(entrypoint, /await import\\(/u);
              assert.match(trustedServe, /bindGatewayTrustedClientIp\\(/u);
              assert.match(trustedServe, /ECONOVARIA_TRUSTED_CLIENT_IP_HEADER/u);
              assert.match(runtime, new RegExp(`export async function ${definition.handler}`, "u"));
              assert.doesNotMatch(runtime, /Deno\\.serve\\(/u);
              assert.doesNotMatch(runtime, /raw\\.githubusercontent\\.com/u);
              if (functionName === "player-web-session-api") {
                assert.match(trustedServe, /materializeBoundedRequestBody/u);
                assert.match(trustedServe, /MAX_MATERIALIZED_BODY_BYTES/u);
              }
            });
          }
          '''
              path.write_text(source[:start] + replacement + source[end:])
          PY

      - name: Remove all temporary recovery files
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f -name 'business-phase6-*.yml' \
            ! -name 'business-phase6-certify-exact-head.yml' -print -delete || true
          find scripts -maxdepth 1 -type f \( -name 'business-phase6-certification-*.mjs' -o -name 'business-phase6-convergence-*.mjs' -o -name 'business-phase6-repair-*.mjs' \) -print -delete || true
          find docs/roadmaps -maxdepth 1 -type f -name '.phase6-*' -print -delete || true
          rm -f pathlib.py sitecustomize.py

      - name: Verify and boot exact implementation tree
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node scripts/architecture/build-architecture-inventory.mjs
          node scripts/business-phase6e-player-api-contract.mjs
          node --test scripts/player-edge-trusted-ip-entrypoint-contract.test.mjs
          deno check backend/supabase/functions/player-api/index.ts
          deno check backend/supabase/functions/player-web-session-api/index.ts
          npm --prefix backend ci --ignore-scripts
          npm --prefix backend run typecheck:all
          npm --prefix player-terminal ci --no-audit --no-fund
          npm --prefix player-terminal run check
          npm --prefix player-terminal run adapter
          npm --prefix player-terminal run capability-manifest-current
          npm --prefix player-terminal run runtime-integration
          git diff --check

          {
            node -e "process.stdout.write('ECONOVARIA_RATE_LIMIT_HMAC_SECRET=' + require('node:crypto').randomBytes(48).toString('base64url') + '\n')"
            node -e "process.stdout.write('ECONOVARIA_WEB_SESSION_ENCRYPTION_KEY=' + require('node:crypto').randomBytes(32).toString('base64url') + '\n')"
            node -e "process.stdout.write('ECONOVARIA_PLAYER_CREDENTIAL_PEPPER=' + require('node:crypto').randomBytes(48).toString('base64url') + '\n')"
            printf '%s\n' 'ECONOVARIA_TRUSTED_CLIENT_IP_HEADER=x-real-ip'
          } > backend/supabase/functions/.env
          chmod 600 backend/supabase/functions/.env
          trap 'rm -f backend/supabase/functions/.env; npx supabase stop --workdir backend --no-backup >/dev/null 2>&1 || true' EXIT
          npx supabase start --workdir backend --exclude studio,imgproxy,storage-api,logflare,vector,supavisor,realtime,postgres-meta,mailpit
          eval "$(npx supabase status --workdir backend -o env)"
          KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          test -n "$KEY"
          for FUNCTION in player-api player-web-session-api; do
            STATUS=000
            for ATTEMPT in $(seq 1 30); do
              STATUS="$(curl --silent --show-error --output "/tmp/${FUNCTION}.json" --write-out '%{http_code}' --max-time 5 --request OPTIONS --header "apikey: ${KEY}" "http://127.0.0.1:54321/functions/v1/${FUNCTION}" || true)"
              test "$STATUS" = "204" && break
              sleep 1
            done
            if test "$STATUS" != "204"; then
              echo "${FUNCTION} preflight returned HTTP ${STATUS}." >&2
              head -c 4000 "/tmp/${FUNCTION}.json" >&2 || true
              for CONTAINER in $(docker ps --format '{{.Names}}' | grep -E 'edge_runtime|kong' || true); do
                docker logs --since 15m "$CONTAINER" 2>&1 | tail -n 1200 >&2
              done
              exit 1
            fi
          done
          rm -f backend/supabase/functions/.env
          npx supabase stop --workdir backend --no-backup
          trap - EXIT

      - name: Freeze and push implementation source
        id: implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/business-phase6-certify-exact-head.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            SHA="$(git rev-parse HEAD)"
          else
            git commit -m "fix(player): close Phase 6 exact-head blockers"
            SHA="$(git rev-parse HEAD)"
            git push origin HEAD:${BRANCH}
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$SHA" > /tmp/phase6-implementation-sha

      - name: Wait for protected exact-head workflows
        id: gates
        shell: bash
        env:
          IMPLEMENTATION_SHA: ${{ steps.implementation.outputs.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["REPOSITORY"]
          sha = os.environ["IMPLEMENTATION_SHA"]
          token = os.environ["GH_TOKEN"]
          required = [
              "Admin API Check",
              "Backend Typecheck",
              "Beta Security Contract",
              "Business Banking Runtime",
              "Business Economy V2",
              "Business Manufacturing Completion V2",
              "Business Manufacturing Recovery V2",
              "Business Manufacturing Resource Hold V2",
              "Business Timed Manufacturing V2",
              "Business Workforce Hiring V2",
              "Business Workforce Payroll V2",
              "Business Workforce Production Payroll V2",
              "Database Replay",
              "Environment Neutral Browser",
              "Exchange Calendar Runtime",
              "Player Terminal Verify",
              "Progression Runtime",
              "Repository Quality",
              "Required Game Market Timezone",
              "Runtime Interaction Wiring",
              "Staging Readiness Preflight",
              "Supply Chain Security",
              "World Runtime",
          ]

          def read_runs():
              url = f"https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100"
              request = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              latest = {}
              for run in sorted(payload.get("workflow_runs", []), key=lambda value: value["id"]):
                  latest[run["name"]] = run
              return latest

          deadline = time.time() + 60 * 55
          last = {}
          while time.time() < deadline:
              latest = read_runs()
              last = latest
              missing = [name for name in required if name not in latest]
              failures = [
                  name for name in required
                  if name in latest and latest[name]["status"] == "completed"
                  and latest[name]["conclusion"] not in ("success", "neutral", "skipped")
              ]
              pending = [
                  name for name in required
                  if name in latest and latest[name]["status"] != "completed"
              ]
              if not missing and not failures and not pending:
                  evidence = {
                      name: {
                          "runId": latest[name]["id"],
                          "runNumber": latest[name]["run_number"],
                          "conclusion": latest[name]["conclusion"],
                      }
                      for name in required
                  }
                  with open("/tmp/phase6-workflow-evidence.json", "w") as handle:
                      json.dump(evidence, handle, indent=2, sort_keys=True)
                      handle.write("\n")
                  print(json.dumps(evidence, indent=2, sort_keys=True))
                  raise SystemExit(0)
              print(json.dumps({"missing": missing, "pending": pending, "failures": failures}))
              time.sleep(20)

          summary = {
              name: {
                  "id": value["id"],
                  "status": value["status"],
                  "conclusion": value["conclusion"],
              }
              for name, value in last.items()
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          raise SystemExit("Timed out before the exact-head workflow set became green")
          PY

      - name: Write durable Phase 6 certification
        shell: bash
        env:
          IMPLEMENTATION_SHA: ${{ steps.implementation.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin "${BRANCH}"
          git checkout --detach "${IMPLEMENTATION_SHA}"
          python - <<'PY'
          from pathlib import Path
          import datetime
          import json
          import os
          import re

          sha = os.environ["IMPLEMENTATION_SHA"]
          evidence = json.loads(Path("/tmp/phase6-workflow-evidence.json").read_text())
          certified_at = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat()
          certificate = {
              "schemaVersion": 1,
              "phase": "Business V2 Phase 6 timed manufacturing",
              "status": "complete",
              "implementationSha": sha,
              "certifiedAt": certified_at,
              "pullRequest": 661,
              "branch": "feat/business-timed-manufacturing-v2",
              "baseBranch": "feat/business-equipment-capacity-v2",
              "merged": False,
              "deployed": False,
              "workflowEvidence": evidence,
              "nextAuthorizedPhase": "Phase 7 — Store seller offers and multi-offer catalog presentation",
          }
          Path("docs/roadmaps/business-phase6-certified-v1.json").write_text(
              json.dumps(certificate, indent=2, sort_keys=True) + "\n"
          )

          evidence_lines = "\n".join(
              f"- **{name}: PASS** (run `{data['runId']}`)."
              for name, data in sorted(evidence.items())
          )
          certification = f'''\n\n---\n\n## Phase 6 COMPLETE — exact-head timed manufacturing certification\n\n- **Immutable implementation source:** `{sha}`.\n- **Pull request:** #661, open, draft, unmerged, and undeployed at certification.\n- **Certified at:** `{certified_at}`.\n- The Player browser submits only public Business/product/job keys plus bounded quantity, priority, cancellation, and idempotency intent.\n- The server owns recipe resolution, BOM/WIP movement, labor and equipment reservations, job start and due time, leases, exact-once Finished Goods settlement, cost basis, cancellation, failure recovery, and terminal state.\n- The retired instant-production route remains fail-closed.\n- No merge, staging deployment, production deployment, secret mutation, or live database mutation occurred.\n\n### Exact-head workflow evidence\n\n{evidence_lines}\n\n### Exit decision\n\nAll Phase 6A–6E lifecycle, resource, completion, recovery, Player API, browser, database, security, and retained Phase 4/5 regression requirements are met on one frozen implementation SHA. **Phase 6 is COMPLETE. Phase 7 is OPEN.**\n'''

          scope_path = Path("docs/roadmaps/business-phase6-timed-manufacturing-scope-v1.md")
          scope = scope_path.read_text()
          scope = re.sub(
              r"\*\*Status:\*\*[^\n]*",
              "**Status:** COMPLETE — exact-head implementation and protected verification certified",
              scope,
              count=1,
          )
          if "## Phase 6 COMPLETE — exact-head timed manufacturing certification" not in scope:
              scope += certification
          scope_path.write_text(scope)

          plan_path = Path("docs/roadmaps/business-v2-development-execution-plan-v1.md")
          plan = plan_path.read_text()
          phase6 = re.search(r"(?ms)^##+ Phase 6\b.*?(?=^##+ Phase 7\b|\Z)", plan)
          if phase6:
              section = phase6.group(0)
              section = re.sub(
                  r"\*\*Status:\*\*[^\n]*",
                  "**Status:** COMPLETE — certified on exact implementation source",
                  section,
                  count=1,
              )
              section = section.replace("- [ ]", "- [x]")
              plan = plan[:phase6.start()] + section + plan[phase6.end():]
          marker = "## Certified checkpoint — Phase 6 timed manufacturing"
          if marker not in plan:
              plan += f'''\n\n---\n\n{marker}\n\n- **Status:** COMPLETE.\n- **Implementation source:** `{sha}`.\n- **Evidence:** `docs/roadmaps/business-phase6-certified-v1.json`.\n- **Next authorized work:** Phase 7 — Store seller offers and multi-offer catalog presentation.\n- Merge and deployment remain separately unauthorized.\n'''
          plan_path.write_text(plan)

          log_path = Path("docs/roadmaps/business-v2-development-execution-log-v1.md")
          log = log_path.read_text()
          if "## Phase 6 COMPLETE — exact-head timed manufacturing certification" not in log:
              log += certification
          log_path.write_text(log)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmaps/business-phase6-certified-v1.json \
            docs/roadmaps/business-phase6-timed-manufacturing-scope-v1.md \
            docs/roadmaps/business-v2-development-execution-plan-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md
          git commit -m "docs(business): certify Phase 6 timed manufacturing"
          git push origin HEAD:${BRANCH}
          echo "certification_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Update draft PR certification summary
        shell: bash
        env:
          IMPLEMENTATION_SHA: ${{ steps.implementation.outputs.sha }}
        run: |
          set -euo pipefail
          CERTIFICATION_SHA="$(git rev-parse HEAD)"
          RUNS="$(python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('/tmp/phase6-workflow-evidence.json').read_text())
          for name, data in sorted(evidence.items()):
              print(f"- {name}: PASS (`{data['runId']}`)")
          PY
          )"
          BODY="$(cat <<EOF
          ## Certified scope

          Business V2 Phase 6 timed manufacturing is complete.

          - **Immutable implementation source:** \`${IMPLEMENTATION_SHA}\`
          - **Documentation-only certification head:** \`${CERTIFICATION_SHA}\`
          - **Base:** \`feat/business-equipment-capacity-v2\`
          - **State:** draft, open, unmerged, and undeployed

          The certified lifecycle includes atomic Warehouse-to-WIP material holds, deterministic labor and installed-equipment reservations, server-derived timing, lease-based due-job processing, exact-once Finished Goods completion, cost-basis carryforward without duplicate payroll cash debit, cancellation, failure recovery, authenticated Player API cutover, browser workspace state, and retirement of instant production.

          ## Exact-head verification

          ${RUNS}

          No merge, staging deployment, production deployment, secret mutation, or live database mutation occurred.

          **Next authorized phase: Phase 7 — Store seller offers and multi-offer catalog presentation.**
          EOF
          )"
          gh api --method PATCH "/repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            -f title='Draft: Business V2 Phase 6 timed manufacturing — certified' \
            -f body="$BODY" >/dev/null
