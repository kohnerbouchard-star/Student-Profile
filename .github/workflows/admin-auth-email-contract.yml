name: Admin Auth Email Contract

on:
  pull_request:
    paths:
      - ".github/workflows/admin-auth-email-*.yml"
      - "backend/src/domains/auth/application/staffSignupVerificationEmail.ts"
      - "backend/supabase/auth-email-template-manifest.json"
      - "backend/supabase/auth-email-templates/**"
      - "scripts/auth-email-template-contract.test.mjs"
      - "scripts/staff-signup-email-brand-contract.test.mjs"
      - "scripts/configure-supabase-auth-smtp.mjs"
      - "scripts/configure-supabase-auth-smtp.test.mjs"
      - "scripts/build-supabase-auth-email-config.mjs"
      - "scripts/snapshot-supabase-auth-email-config.mjs"
      - "scripts/verify-supabase-auth-email-config.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/admin-auth-email-*.yml"
      - "backend/src/domains/auth/application/staffSignupVerificationEmail.ts"
      - "backend/supabase/auth-email-template-manifest.json"
      - "backend/supabase/auth-email-templates/**"
      - "scripts/auth-email-template-contract.test.mjs"
      - "scripts/staff-signup-email-brand-contract.test.mjs"
      - "scripts/configure-supabase-auth-smtp.mjs"
      - "scripts/configure-supabase-auth-smtp.test.mjs"
      - "scripts/build-supabase-auth-email-config.mjs"
      - "scripts/snapshot-supabase-auth-email-config.mjs"
      - "scripts/verify-supabase-auth-email-config.mjs"

permissions:
  contents: read

concurrency:
  group: admin-auth-email-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate branded Supabase Auth email catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"

      - name: Validate scripts and branded email contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/build-supabase-auth-email-config.mjs
          node --check scripts/snapshot-supabase-auth-email-config.mjs
          node --check scripts/verify-supabase-auth-email-config.mjs
          node --check scripts/configure-supabase-auth-smtp.mjs
          node --check scripts/configure-supabase-auth-smtp.test.mjs
          node --check scripts/staff-signup-email-brand-contract.test.mjs
          node --test \
            scripts/auth-email-template-contract.test.mjs \
            scripts/configure-supabase-auth-smtp.test.mjs \
            scripts/staff-signup-email-brand-contract.test.mjs
          node scripts/build-supabase-auth-email-config.mjs --check

      - name: Build deterministic staging and production payload evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/auth-email-contract
          node scripts/build-supabase-auth-email-config.mjs \
            --environment staging \
            --output dist/auth-email-contract/staging-payload.json \
            --evidence-output dist/auth-email-contract/staging-evidence.json
          node scripts/build-supabase-auth-email-config.mjs \
            --environment production \
            --output dist/auth-email-contract/production-payload.json \
            --evidence-output dist/auth-email-contract/production-evidence.json
          test "$(jq -r '.sourceDigest' dist/auth-email-contract/staging-evidence.json)" = \
            "$(jq -r '.sourceDigest' dist/auth-email-contract/production-evidence.json)"
          test "$(jq -r '.renderedDigest' dist/auth-email-contract/staging-evidence.json)" != \
            "$(jq -r '.renderedDigest' dist/auth-email-contract/production-evidence.json)"

      - name: Upload sanitized template evidence
        uses: actions/upload-artifact@v7
        with:
          name: admin-auth-email-contract-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/auth-email-contract/staging-evidence.json
            dist/auth-email-contract/production-evidence.json
