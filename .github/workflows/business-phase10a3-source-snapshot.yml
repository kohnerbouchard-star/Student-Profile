name: Business Phase 10A.3 Source Snapshot

on:
  push:
    branches:
      - feat/business-store-atomic-settlement-v2
    paths:
      - ".github/workflows/business-phase10a3-source-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create source archive
        run: tar --exclude=.git -czf /tmp/student-profile-phase10a3-source.tgz .
      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: business-phase10a3-source-snapshot
          path: /tmp/student-profile-phase10a3-source.tgz
          retention-days: 1
          if-no-files-found: error
