name: Business Phase 4B Finalize V3

on:
  pull_request:
    paths:
      - ".github/workflows/business-phase4b-finalize-v3.yml"

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: business-phase4b-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  certify:
    if: github.event.pull_request.number == 658
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      FEATURE_BRANCH: feat/business-workforce-hiring-v2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-workforce-hiring-v2
          fetch-depth: 0

      - name: Resolve bounded source and fail closed on residue
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(
            git log --format=%H --extended-regexp \
              --grep='feat\(business\): (implement|remediate) Phase 4B workforce hiring' \
              -n 1
          )
          test -n "$source_sha"
          current_sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$source_sha" "$current_sha"
          allowed='^(\.github/workflows/business-workforce-hiring-v2\.yml|\.github/workflows/business-phase4b-finalize(-v2|-v3)?\.yml)$'
          while IFS= read -r path; do
            test -z "$path" && continue
            grep -Eq "$allowed" <<< "$path" || {
              echo "Unexpected post-source path: $path" >&2
              exit 1
            }
          done < <(git diff --name-only "$source_sha" "$current_sha")
          test -f backend/supabase/migrations/20260822120000_business_workforce_candidate_hiring_v2.sql
          test -f scripts/business-workforce-hiring-contract.mjs
          test -f .github/workflows/business-workforce-hiring-v2.yml
          test ! -f docs/roadmaps/business-phase4b-implementation-diagnostics.md
          test ! -f scripts/business-phase4b-payload.py
          for path in \
            .github/workflows/business-phase4b-controller.yml \
            .github/workflows/business-phase4b-converge.yml \
            .github/workflows/business-phase4b-remediate.yml \
            .github/workflows/business-phase4b-implement.yml \
            .github/workflows/business-phase4b-implement-v2.yml; do
            test ! -f "$path"
          done
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "current_sha=$current_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            player-terminal/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3
      - run: npm install --global npm@10.9.8
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix backend ci --ignore-scripts
          npm --prefix player-terminal ci --no-audit --no-fund
      - name: Run complete Phase 4B verification
        shell: bash
        run: |
          set -euo pipefail
          node scripts/business-workforce-hiring-contract.mjs
          node scripts/business-banking-runtime-contract.mjs
          node scripts/validate-supabase-migrations.mjs
          node scripts/architecture/build-architecture-inventory.mjs
          git diff --exit-code -- docs/architecture/inventories/econovaria-architecture-inventory-v2.json
          npm test
          npm --prefix backend run typecheck
          cd backend
          deno test --config supabase/functions/classroom-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            src/domains/business/api/playerBusinessWorkforceHiring.test.ts \
            src/domains/business/api/playerBusinessRoutePaths.test.ts
          cd ../player-terminal
          npm run verify
      - name: Install Chromium
        working-directory: player-terminal
        run: npx playwright install --with-deps chromium
      - name: Materialize runtime fixture
        run: |
          mkdir -p player-terminal/frontend/src/core
          cp frontend/src/core/runtime-config.js player-terminal/frontend/src/core/runtime-config.js
          cat > player-terminal/runtime-config.env.js <<'EOF'
          window.__ECONOVARIA_RUNTIME_CONFIG__ = Object.freeze({
            environment: "development",
            projectRef: "runtimefixture123456",
            supabaseUrl: "https://runtimefixture123456.supabase.co",
            supabasePublishableKey: "sb_publishable_runtime_fixture_1234567890"
          });
          EOF
      - name: Run Chromium
        working-directory: player-terminal
        run: npm run browser

      - name: Wait for exact source workflows
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          repo=os.environ['REPOSITORY']; token=os.environ['GH_TOKEN']; source=os.environ['SOURCE_SHA']
          required=[
            'Business Workforce Hiring V2','Business Workforce Payroll V2','Database Replay',
            'Backend Typecheck','Business Banking Runtime','Repository Quality',
            'Runtime Interaction Wiring','Supply Chain Security','Admin API Check',
            'Staging Readiness Preflight','Required Game Market Timezone','Exchange Calendar Runtime'
          ]
          def runs():
            req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs?head_sha={source}&per_page=100',
              headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'})
            with urllib.request.urlopen(req,timeout=30) as response: return json.load(response).get('workflow_runs',[])
          deadline=time.time()+45*60; last=None
          while time.time()<deadline:
            all_runs=runs(); evidence={}
            for name in required:
              candidates=[r for r in all_runs if r.get('name')==name]
              candidates.sort(key=lambda r:(r.get('created_at') or '',int(r.get('run_attempt') or 0)),reverse=True)
              success=next((r for r in candidates if r.get('status')=='completed' and r.get('conclusion')=='success'),None)
              active=next((r for r in candidates if r.get('status')!='completed'),None)
              latest=candidates[0] if candidates else None
              evidence[name]={'ok':success is not None,'active':active is not None,'runId':success.get('id') if success else None,'headSha':success.get('head_sha') if success else None,'latestStatus':latest.get('status') if latest else 'missing','latestConclusion':latest.get('conclusion') if latest else None}
            if evidence!=last: print(json.dumps(evidence,indent=2,sort_keys=True),flush=True); last=evidence
            if all(item['ok'] for item in evidence.values()):
              Path('/tmp/phase4b-gates.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n'); break
            failed=[name for name,item in evidence.items() if not item['ok'] and not item['active'] and item['latestStatus']=='completed' and item['latestConclusion'] not in (None,'success','cancelled','action_required')]
            if failed: raise SystemExit('Exact source workflows failed: '+', '.join(failed))
            time.sleep(20)
          else: raise SystemExit('Timed out: '+json.dumps(last,sort_keys=True))
          PY

      - name: Write durable certification
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          CURRENT_SHA: ${{ steps.source.outputs.current_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json,os,re
          from datetime import date
          from pathlib import Path
          source=os.environ['SOURCE_SHA']; current=os.environ['CURRENT_SHA']; run_id=os.environ['RUN_ID']
          evidence=json.loads(Path('/tmp/phase4b-gates.json').read_text())
          plan_path=Path('docs/roadmaps/business-v2-development-execution-plan-v1.md')
          log_path=Path('docs/roadmaps/business-v2-development-execution-log-v1.md')
          plan=plan_path.read_text(); start=plan.index('## Phase 4 — Workforce capacity and payroll'); end=plan.index('\n## Phase 5 — Equipment capacity',start)
          phase=plan[start:end]
          phase,count=re.subn(r'\*\*Status:\*\*[^\n]*','**Status:** IN PROGRESS — checkpoints A and B complete; payroll settlement and production-labor integration remain open',phase,count=1)
          if count!=1: raise SystemExit('Phase 4 status missing')
          checkpoint=f'- **4B:** public candidate pools and atomic server-owned hiring, certified source `{source}`.'
          if checkpoint not in phase: phase=phase.replace('\nExit:',checkpoint+'\n\nExit:',1)
          plan_path.write_text((plan[:start]+phase+plan[end:]).rstrip()+'\n')
          log=log_path.read_text()
          if source not in log:
            gates='\n'.join(f"- **{name} — PASS** (`{item['runId']}`, head `{item['headSha']}`)." for name,item in evidence.items())
            entry=f'''

---
## {date.today().isoformat()} — Phase 4B COMPLETE: candidate pools and server-owned hiring

### Certified state

- **Exact implementation SHA:** `{source}`.
- **Finalizer verification SHA:** `{current}`.
- Feature branch: `feat/business-workforce-hiring-v2`; stacked draft PR #658.
- PR #648 and all parent Business V2 PRs remained open, draft, and unmerged.
- No staging or production deployment or live data mutation was performed.

### Authority delivered

- Public-key-only, role-grouped candidate reads are filtered by Business country and currency.
- Atomic hiring locks Business and candidate state and copies all labor economics and contract terms from trusted candidate rows.
- Idempotent replay, candidate reuse prevention, duplicate active employment prevention, ownership, availability, game isolation, and audit evidence are enforced.
- The free-text Player hiring endpoint remains authenticated compatibility handling and returns `410 Gone`; it is absent from current capabilities and browser controls.
- Payroll settlement and production-labor integration remain closed.

### Verification

{gates}
- **Source contracts, migration validation, repository quality, backend typecheck, focused Deno tests, complete Player Terminal Verify, and Chromium — PASS** in finalizer run `{run_id}`.

### Next authorized step

**Phase 4C — bounded recurring payroll settlement is OPEN.** Create exactly one payroll run per Business and period, derive obligations from active candidate-backed employees, settle through first-class Business cash and canonical ledger authority, preserve explicit unpaid/partial outcomes, and never charge production for payroll a second time. Production-labor integration remains closed.
'''
            log_path.write_text(log.rstrip()+entry.rstrip()+'\n')
          PY
          rm -f .github/workflows/business-phase4b-finalize.yml \
            .github/workflows/business-phase4b-finalize-v2.yml \
            .github/workflows/business-phase4b-finalize-v3.yml
          git diff --check
          git fetch origin "$FEATURE_BRANCH"
          test "$(git rev-parse origin/$FEATURE_BRANCH)" = "$CURRENT_SHA"
          git config user.name econovaria-phase4b-certifier
          git config user.email actions@users.noreply.github.com
          git add docs/roadmaps/business-v2-development-execution-plan-v1.md docs/roadmaps/business-v2-development-execution-log-v1.md
          git add -u .github/workflows/business-phase4b-finalize.yml .github/workflows/business-phase4b-finalize-v2.yml .github/workflows/business-phase4b-finalize-v3.yml || true
          git commit -m "docs(business): certify Phase 4B workforce hiring"
          git push origin HEAD:feat/business-workforce-hiring-v2
