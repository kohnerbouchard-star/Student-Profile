name: Story Narrative S5 Source Integrity

on:
  pull_request:
    paths:
      - "docs/seed-content/story/content/**"
      - "scripts/story-content/build-act1-august-pack.py"
      - "scripts/story-content/build-act2-september-pack.py"
      - "scripts/story-content/build-act2-october-pack.py"
      - "scripts/story-content/build-act3-act8-packs.py"
      - "scripts/story-content-all-packs-contract.test.mjs"
      - "backend/src/domains/storylines/tests/act1AugustStoryContentPack.test.ts"
      - "backend/src/domains/storylines/tests/monthlyStoryContentPackContract.test.ts"
      - "backend/src/domains/storylines/contracts/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - ".github/workflows/story-narrative-s5-source-integrity.yml"
  push:
    branches:
      - main
      - feat/story-narrative-convergence-v1
    paths:
      - "docs/seed-content/story/content/**"
      - "scripts/story-content/build-act1-august-pack.py"
      - "scripts/story-content/build-act2-september-pack.py"
      - "scripts/story-content/build-act2-october-pack.py"
      - "scripts/story-content/build-act3-act8-packs.py"
      - "scripts/story-content-all-packs-contract.test.mjs"
      - "backend/src/domains/storylines/tests/act1AugustStoryContentPack.test.ts"
      - "backend/src/domains/storylines/tests/monthlyStoryContentPackContract.test.ts"
      - "backend/src/domains/storylines/contracts/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - ".github/workflows/story-narrative-s5-source-integrity.yml"

permissions:
  contents: read

concurrency:
  group: story-narrative-s5-source-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.3

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Verify deterministic builders and committed source parity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/story-content/build-act1-august-pack.py \
            scripts/story-content/build-act2-september-pack.py \
            scripts/story-content/build-act2-october-pack.py \
            scripts/story-content/build-act3-act8-packs.py
          python3 scripts/story-content/build-act1-august-pack.py
          python3 scripts/story-content/build-act2-september-pack.py
          python3 scripts/story-content/build-act2-october-pack.py
          python3 scripts/story-content/build-act3-act8-packs.py
          test "$(find docs/seed-content/story/content -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')" = "11"
          test -z "$(git status --porcelain --untracked-files=all -- docs/seed-content/story/content)"
          git diff --exit-code -- docs/seed-content/story/content

      - name: Verify backend and Edge types
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm run typecheck:all; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "typecheck:all failed after 3 attempts" >&2
              exit 1
            fi
            echo "typecheck:all attempt $attempt failed; retrying transient dependency fetch" >&2
            sleep $((attempt * 5))
          done

      - name: Verify August Story pack
        working-directory: backend
        run: deno test --allow-read=../docs/seed-content/story/content/act1-august-content-pack-v1.json --config supabase/functions/deno.json --lock=supabase/functions/deno.lock --frozen src/domains/storylines/tests/act1AugustStoryContentPack.test.ts

      - name: Verify September-June Story packs
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            act2-september-content-pack-v1.json \
            act2-october-content-pack-v1.json \
            act3-november-content-pack-v1.json \
            act3-december-content-pack-v1.json \
            act4-january-content-pack-v1.json \
            act4-february-content-pack-v1.json \
            act5-march-content-pack-v1.json \
            act6-april-content-pack-v1.json \
            act7-may-content-pack-v1.json \
            act8-june-content-pack-v1.json; do
            deno test --allow-read="../docs/seed-content/story/content/$f" --config supabase/functions/deno.json --lock=supabase/functions/deno.lock --frozen src/domains/storylines/tests/monthlyStoryContentPackContract.test.ts -- "../docs/seed-content/story/content/$f"
          done

      - name: Verify whole-campaign Story source
        run: node scripts/story-content-all-packs-contract.test.mjs

      - name: Verify S4 choice callbacks
        working-directory: backend
        run: npm run test:story-choice-callbacks

      - name: Verify Player Messaging
        working-directory: backend
        run: npm run test:player-messaging

      - name: Verify stock Story scheduler integration
        working-directory: backend
        run: npm run test:stock-market-calendar
