name: Business Phase 10A.2 Durable Finalizer

on:
  push:
    branches:
      - feat/business-store-offer-aware-quote-v2
    paths:
      - ".github/workflows/business-phase10a2-durable-finalizer.yml"

permissions:
  contents: write

concurrency:
  group: business-phase10a2-durable-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.head_commit.message == 'ops(business): finalize Phase 10A.2 certification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/business-store-offer-aware-quote-v2
          fetch-depth: 0

      - name: Verify frozen implementation lineage
        shell: bash
        run: |
          set -euo pipefail
          TESTED_SHA="ad57d5b9307178229a6b47b3206d258f1bd9b70d"
          test "$(git rev-parse HEAD^)" = "$TESTED_SHA"
          test "$(git diff --name-only "$TESTED_SHA" HEAD)" = ".github/workflows/business-phase10a2-durable-finalizer.yml"

      - name: Verify exact-head certification workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN="repos/kohnerbouchard-star/Student-Profile/actions/runs/32790518745"
          test "$(gh api "$RUN" --jq .name)" = "Business Store Offer-Aware Quotes V2"
          test "$(gh api "$RUN" --jq .head_sha)" = "ad57d5b9307178229a6b47b3206d258f1bd9b70d"
          test "$(gh api "$RUN" --jq .head_branch)" = "feat/business-store-offer-aware-quote-v2"
          test "$(gh api "$RUN" --jq .status)" = "completed"
          test "$(gh api "$RUN" --jq .conclusion)" = "success"
          test "$(gh api "$RUN/jobs?per_page=100" --jq .total_count)" = "4"
          test "$(gh api "$RUN/jobs?per_page=100" --jq '[.jobs[] | select(.status == "completed" and .conclusion == "success")] | length')" = "4"

      - name: Write durable Phase 10A.2 records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = "ad57d5b9307178229a6b47b3206d258f1bd9b70d"
          workflow_run = "32790518745"

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          scope_path = Path("docs/roadmaps/business-phase10-offer-aware-quote-scope-v1.md")
          scope = scope_path.read_text()
          scope = replace_once(
              scope,
              "**Status:** IN PROGRESS — implementation prepared for exact-head verification\n",
              "**Status:** COMPLETE — checkpoint 10A.2 durably certified\n",
              "scope status",
          )
          scope = replace_once(
              scope,
              "**Parent draft PR:** #665\n",
              "**Parent draft PR:** #665\n**Stacked draft PR:** #666\n",
              "scope PR identity",
          )
          scope = replace_once(
              scope,
              "**Clean parent handoff:** `34776a124e6595b67ffb7e52357fd5a1d9194435`\n",
              "**Clean parent handoff:** `34776a124e6595b67ffb7e52357fd5a1d9194435`\n"
              f"**Exact certified implementation and verification source:** `{source}`\n"
              f"**Dedicated exact-head workflow:** Business Store Offer-Aware Quotes V2 `{workflow_run}`\n"
              "**Certification date:** 2026-08-25\n",
              "scope certification identity",
          )
          evidence = f"""## Certification evidence

The exact implementation source `{source}` passed the complete dedicated workflow `Business Store Offer-Aware Quotes V2` run `{workflow_run}`:

- `contract-and-quality`: Phase 10A.2 structural authority, typed contract, replay/race simulation, retained 10A.1/9A/8A/7A contracts, migration validation, deterministic architecture inventory, Repository Quality, and Supply Chain Security — **PASS**;
- `retained-runtime`: Business formation/economy/domain/stockroom/procurement/Banking, workforce/payroll, equipment, timed manufacturing, Store and Inventory lifecycle tests, all Backend/Edge TypeScript, and Player Edge entrypoints — **PASS**;
- `database-replay`: complete database replay from zero twice plus rebuilt-database lint — **PASS**;
- `player-and-browser`: standalone Player Terminal verification, adapter/capability/runtime integration, and Chromium browser verification — **PASS**.

PR #666 remained open, draft, mergeable, unmerged, and undeployed. The one-time durable finalizer is removed in the certification commit. No Buyer debit, Business credit, Inventory movement or reservation, revenue/COGS posting, purchase receipt, Player route/UI, merge, deployment, secret mutation, or live database mutation occurred.

"""
          scope = replace_once(
              scope,
              "## Completion rule\n",
              evidence + "## Completion rule\n",
              "scope evidence insertion",
          )
          scope = replace_once(
              scope,
              "Certification of 10A.2 does not certify purchase settlement. The next authorized checkpoint is **Phase 10A.3**, which must atomically debit Buyer Checking, credit Business cash, transfer the exact listing quantity to Buyer Inventory, recognize revenue and COGS, consume the quote, advance the offer version, and complete one immutable `spr_...` receipt.\n",
              "Checkpoint 10A.2 is complete. Purchase settlement remains uncertified. The next authorized checkpoint is **Phase 10A.3 — atomic economic settlement**, limited to one service-owned transaction that revalidates the locked quote and offer, debits Buyer Checking, credits Business cash, transfers exact Store-listing stock to Buyer Inventory, records revenue and COGS evidence, consumes the quote, advances the offer version, and completes one immutable `spr_...` receipt. Player route/UI cutover, automatic sales convergence, equity/IPO, merge, deployment, secrets, and live database mutation remain closed.\n",
              "scope next step",
          )
          scope_path.write_text(scope)

          plan_path = Path("docs/roadmaps/business-v2-development-execution-plan-v1.md")
          plan = plan_path.read_text()
          plan = replace_once(
              plan,
              "**Status:** FOUNDATION COMPLETE — checkpoint 10A.1 certified exact-head source `1abc8b878df5b08716107adb467bd013e85b6df4`; checkpoint 10A.2 offer-aware quote authority is OPEN\n",
              f"**Status:** QUOTE FOUNDATION COMPLETE — checkpoint 10A.1 certified exact-head source `1abc8b878df5b08716107adb467bd013e85b6df4`; checkpoint 10A.2 certified exact-head source `{source}`; checkpoint 10A.3 atomic settlement is OPEN\n",
              "plan Phase 10 status",
          )
          plan = replace_once(
              plan,
              "- [ ] Add immutable offer-aware quote authority bound to exact offer, version, seller, custody, quantity, price, currency, and expiry.\n",
              "- [x] Add immutable offer-aware quote authority bound to exact offer, version, seller, custody, quantity, price, currency, and expiry.\n",
              "plan quote checkbox",
          )
          phase10a1 = "- **10A.1:** non-mutating Store settlement authority foundation; immutable public `spr_...` receipt contract; trusted command boundary; fixed offer-first lock order; deterministic purchase/withdrawal ordering, replay, conflict, rollback, and two-game simulations; complete retained database, Business, Store, Inventory, backend/Edge, repository, security, Player, and Chromium matrix. **Certified implementation and exact-head verification source:** `1abc8b878df5b08716107adb467bd013e85b6df4`. Dedicated workflow: `32753253910`.\n"
          phase10a2 = f"\n- **10A.2:** Store-owned immutable Business-offer quote authority; exact Buyer/offer/version/Business/seller/catalog/item/custody binding; same-currency fixed-price evidence; two-minute expiry; non-reserving canonical availability snapshot; replay-before-mutable-state validation; seller-offer-first quote/withdrawal ordering; concurrency, conflict, expiry, reserved-stock, sold-out, self-purchase, cross-currency, rollback, and two-game isolation coverage. **Certified implementation and exact-head verification source:** `{source}`. Dedicated workflow: `{workflow_run}`.\n"
          plan = replace_once(
              plan,
              phase10a1,
              phase10a1 + phase10a2,
              "plan certified checkpoint insertion",
          )
          plan = replace_once(
              plan,
              "Exit: no paid-without-item or item-without-payment state is possible. **Not yet met; quote and settlement runtime remain open.**\n",
              "Exit: no paid-without-item or item-without-payment state is possible. **Not yet met; immutable quote authority is certified, while atomic settlement and authenticated Player cutover remain open.**\n",
              "plan Phase 10 exit",
          )
          plan_path.write_text(plan)

          log_path = Path("docs/roadmaps/business-v2-development-execution-log-v1.md")
          log = log_path.read_text()
          marker = "## 2026-08-25 — Phase 10A.2 COMPLETE: immutable Business seller-offer quote authority"
          if marker in log:
              raise SystemExit("execution log already contains Phase 10A.2 certification")
          entry = f"""

---

{marker}

### Certified source and repository state

- **Exact certified implementation and verification source:** `{source}`.
- Feature branch: `feat/business-store-offer-aware-quote-v2`.
- Stacked draft PR: #666, based on the clean certified Phase 10A.1 handoff `34776a124e6595b67ffb7e52357fd5a1d9194435` / PR #665.
- PR #666 remained open, draft, mergeable, unmerged, and undeployed at certification.
- Integration PR #648 remained open, draft, and unmerged.
- No merge, staging deployment, production deployment, secret mutation, or live database mutation was performed.
- The later documentation-only certification commit does not replace `{source}` as the exact tested implementation source.

### What is now authoritative

- `public.store_offer_purchase_quotes` is a separate Store-owned quote authority for Business seller offers; the retained seeded Store quote table retains its historical compatibility meaning.
- One immutable public `quote_...` record binds trusted game and Buyer scope to one exact active Business offer/version, Business, seller party, Store item, canonical item, offer-scoped listing account, quantity, availability snapshot, unit/total price, currency, pricing version, creation time, expiry, and request hash.
- Quote creation accepts only trusted game/Buyer scope plus offer key, quantity, expected version, and idempotency key. Business, seller, catalog, item, custody, country, currency, pricing, and expiry values remain server derived.
- Quotes are non-reserving. Phase 10A.3 must re-lock and revalidate the offer/version and exact canonical availability before any economic mutation.
- The first Business-offer purchase path is same-currency only with `exchangeRate = 1`; cross-currency settlement remains closed until a named FX-clearing authority and two-sided immutable evidence exist.
- Durable Buyer-scoped replay resolves before mutable state validation; exact retries converge to one quote, conflicting key reuse fails closed, and replay cannot extend, reprice, reserve, or reactivate a quote.
- Seller-offer-first locking makes quote-first snapshot the pre-mutation version while withdrawal-first changes the offer to `withdrawal_pending` and causes the later quote to reject.
- Service-role-only persistence, forced RLS, immutable identity/lifecycle guards, public-key-only contracts, and two-game isolation remain enforced.

### Exact-head verification on `{source}`

- **Business Store Offer-Aware Quotes V2 — PASS** (`{workflow_run}`).
- `contract-and-quality` — **PASS**: Phase 10A.2 contracts/types/simulations, retained 10A.1/9A/8A/7A authority, migration validation, deterministic architecture inventory, Repository Quality, and Supply Chain Security.
- `retained-runtime` — **PASS**: Business formation/economy/domain/stockroom/procurement/Banking, workforce/payroll, equipment, timed manufacturing, Store/Inventory lifecycle, all Backend/Edge TypeScript, and Player Edge entrypoints.
- `database-replay` — **PASS**: complete replay from zero twice plus rebuilt-database lint.
- `player-and-browser` — **PASS**: standalone Player Terminal verification, adapter/capability/runtime integration, and Chromium.

### Phase 10A.2 exit result

- Immutable quote identity and exact offer/version/seller/custody scope: **met**.
- Trusted Buyer/game scope and server-derived economic identity: **met**.
- Same-currency deterministic pricing and exact two-minute expiry: **met**.
- Non-reserving canonical availability snapshot: **met**.
- Replay, idempotency conflict, concurrency, quote/withdrawal ordering, expiry, reserved-stock, sold-out, self-purchase, cross-currency, and two-game guards: **met**.
- Complete database, backend/all Edge, retained Business/Banking/Store/Inventory/workforce/equipment/manufacturing, repository, security, Player, and Chromium matrix: **met**.
- No economic settlement, Player cutover, deployment, or live mutation: **met**.

### Decisions and unresolved boundaries

- A quote is price evidence, not an Inventory reservation. Settlement must revalidate current offer status/version and exact unreserved listing quantity.
- Cross-currency Business Store settlement remains unsupported by design.
- The retained seeded quote/purchase authority remains unchanged until an explicit later cutover.
- Buyer Checking debit, Business cash credit, Store Listing-to-Buyer transfer, revenue/COGS, receipt completion, Player routes/UI, automatic demand convergence, equity/IPO, merge, staging, and production remain unauthorized.
- The one-time durable finalizer has zero net presence in the final branch tree.

### Next authorized step

**Phase 10A.3 — atomic economic settlement is OPEN.** Create a separate stacked draft branch/PR from the clean Phase 10A.2 handoff. Implement one service-owned transaction with the fixed offer-first lock order: replay resolution, quote and offer revalidation, listing holding, Buyer Checking, Business cash, Buyer Inventory, canonical ledger/Inventory posting, immutable `spr_...` receipt completion, quote consumption, and offer-version advancement. Prove paid-without-item, item-without-payment, one-sided money movement, settlement-without-receipt, purchase/withdrawal inversion, conflicting replay, rollback, and cross-game mutation are impossible. Do not include authenticated Player route/UI cutover, automatic sales convergence, equity/IPO, merge, deployment, secrets, or live database mutation.
"""
          log_path.write_text(log.rstrip() + entry + "\n")
          PY

          git diff --check
          git diff -- docs/roadmaps/business-phase10-offer-aware-quote-scope-v1.md \
            docs/roadmaps/business-v2-development-execution-plan-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md

      - name: Commit durable records and remove one-time finalizer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "econovaria-automation"
          git config user.email "econovaria-automation@users.noreply.github.com"
          git rm .github/workflows/business-phase10a2-durable-finalizer.yml
          git add \
            docs/roadmaps/business-phase10-offer-aware-quote-scope-v1.md \
            docs/roadmaps/business-v2-development-execution-plan-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md
          if find .github/workflows scripts -maxdepth 1 -type f \
            \( -iname '*phase10a2*finalizer*' -o -iname '*phase10a2*certifier*' -o -iname '*phase10a2*controller*' -o -iname '*phase10a2*repair*' \) \
            | grep -q .; then
            echo "Temporary Phase 10A.2 machinery remains." >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m "docs(business): certify Phase 10A.2 offer-aware quotes"
          git push origin HEAD:feat/business-store-offer-aware-quote-v2
