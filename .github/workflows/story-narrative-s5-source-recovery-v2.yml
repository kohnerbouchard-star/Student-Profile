name: Story Narrative S5 Cleanup Roadmap Finalizer

on:
  push:
    branches:
      - feat/story-narrative-convergence-v1
    paths:
      - ".github/workflows/story-narrative-s5-source-recovery-v2.yml"

permissions:
  contents: write

concurrency:
  group: story-narrative-s5-cleanup-roadmap-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact Story branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/story-narrative-convergence-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Record S5 cleanup verification and publication boundary
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin feat/story-narrative-convergence-v1
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path('docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## Run-completion rule\n'
          heading = '### Run 2026-08-11 — S5 permanent source-integrity cleanup'
          if heading not in text:
              body = '\n'.join([
                  '', heading, '',
                  f"Roadmap finalizer workflow: `{os.environ['GITHUB_RUN_ID']}`", '',
                  'Verification source:', '',
                  '- S5 cleanup verification run `31468132122` regenerated all 11 committed monthly packs and proved deterministic source parity.',
                  '- The same run passed backend/Edge typecheck, all monthly Story content contracts, whole-campaign Day 1–334 integrity, S4 choice callbacks, Player Messaging, and stock/Story scheduler integration.',
                  '- Its local cleanup commit was rejected only because the GitHub Actions token lacked permission to update workflow files; no source or test assertion failed.',
                  '- The connected GitHub authority then installed the permanent read-only S5 source-integrity workflow and removed the obsolete self-writing monthly generation/planning workflows plus the one-time recovery patch scripts.', '',
                  'Current boundary:', '',
                  '- S5 authored source is recovered and protected by deterministic read-only CI.',
                  '- Runtime News/Contract/system binding, forward S2/S3 replay repairs, Story runner retry/idempotency hardening, connected staging, S6 reachability, and S7 acceptance remain pending.', '',
                  'Next implementation tranche: forward-only S2/S3 database replay repairs. Historical migrations remain immutable.', ''
              ])
              if marker not in text:
                  raise SystemExit('roadmap marker missing')
              text = text.replace(marker, body + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git add docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(story): record permanent S5 source-integrity cleanup"
            git push origin HEAD:feat/story-narrative-convergence-v1
          fi
