name: Story Narrative S5 Source Recovery V4

on:
  push:
    branches:
      - feat/story-narrative-convergence-v1
    paths:
      - ".github/workflows/story-narrative-s5-source-recovery-v2.yml"
      - "scripts/story-content/fix-authored-key-spoilers.py"

permissions:
  contents: write

concurrency:
  group: story-narrative-s5-source-recovery-v4
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact recovery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Record recovery retry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path('docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## Run-completion rule\n'
          heading = '### Run 2026-08-11 — S5 source recovery retry after Day 323 stable-key dedupe'
          if heading not in text:
              body = '\n'.join([
                  '', heading, '',
                  f"Source head: `{os.environ['GITHUB_SHA']}`", '',
                  'The prior retry passed full backend/Edge typecheck and all eleven monthly parser contracts, then the whole-campaign uniqueness gate found Day 323 emitted `event.campaign.d323.personal-future.v1` twice: once as an empty anchor and once as the actual structured Player choice.', '',
                  'This retry removes only the redundant empty anchor. The structured personal-future choice retains the canonical Day-323 key and all fixed-anchor, callback, privacy, coverage, and hidden-canon assertions remain unchanged.', ''
              ])
              if marker not in text:
                  raise SystemExit('roadmap marker missing')
              text = text.replace(marker, body + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git add docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(story): record Day 323 dedupe recovery retry"
            git push origin HEAD:feat/story-narrative-convergence-v1
          fi

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.3

      - name: Apply deterministic S5 recovery corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/story-content/fix-authored-key-spoilers.py
          python3 scripts/story-content/fix-story-content-test-narrowing.py
          python3 -m py_compile \
            scripts/story-content/fix-authored-key-spoilers.py \
            scripts/story-content/fix-story-content-test-narrowing.py \
            scripts/story-content/build-act1-august-pack.py \
            scripts/story-content/build-act2-september-pack.py \
            scripts/story-content/build-act2-october-pack.py \
            scripts/story-content/build-act3-act8-packs.py
          git diff --check

      - name: Regenerate all 11 monthly packs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/seed-content/story/content
          python3 scripts/story-content/build-act1-august-pack.py
          python3 scripts/story-content/build-act2-september-pack.py
          python3 scripts/story-content/build-act2-october-pack.py
          python3 scripts/story-content/build-act3-act8-packs.py
          for f in \
            act1-august-content-pack-v1.json \
            act2-september-content-pack-v1.json \
            act2-october-content-pack-v1.json \
            act3-november-content-pack-v1.json \
            act3-december-content-pack-v1.json \
            act4-january-content-pack-v1.json \
            act4-february-content-pack-v1.json \
            act5-march-content-pack-v1.json \
            act6-april-content-pack-v1.json \
            act7-may-content-pack-v1.json \
            act8-june-content-pack-v1.json; do
            test -s "docs/seed-content/story/content/$f"
          done
          git diff --check

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Verify backend and Edge types
        working-directory: backend
        run: npm run typecheck:all

      - name: Verify August pack contract
        working-directory: backend
        run: deno test --allow-read=../docs/seed-content/story/content/act1-august-content-pack-v1.json --config supabase/functions/deno.json --lock=supabase/functions/deno.lock --frozen src/domains/storylines/tests/act1AugustStoryContentPack.test.ts

      - name: Verify September-June monthly pack contracts
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            act2-september-content-pack-v1.json \
            act2-october-content-pack-v1.json \
            act3-november-content-pack-v1.json \
            act3-december-content-pack-v1.json \
            act4-january-content-pack-v1.json \
            act4-february-content-pack-v1.json \
            act5-march-content-pack-v1.json \
            act6-april-content-pack-v1.json \
            act7-may-content-pack-v1.json \
            act8-june-content-pack-v1.json; do
            deno test --allow-read="../docs/seed-content/story/content/$f" --config supabase/functions/deno.json --lock=supabase/functions/deno.lock --frozen src/domains/storylines/tests/monthlyStoryContentPackContract.test.ts -- "../docs/seed-content/story/content/$f"
          done

      - name: Verify whole-campaign source integrity
        run: node scripts/story-content-all-packs-contract.test.mjs

      - name: Verify S4 callbacks
        working-directory: backend
        run: npm run test:story-choice-callbacks

      - name: Verify Player Messaging
        working-directory: backend
        run: npm run test:player-messaging

      - name: Verify stock Story scheduler integration
        working-directory: backend
        run: npm run test:stock-market-calendar

      - name: Publish recovered S5 source
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path('docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md')
          text = path.read_text(encoding='utf-8')
          s5 = text.index('### S5 — Narrative content saturation tranche')
          s6 = text.index('### S6 — Campaign saturation/reachability audit', s5)
          section = text[s5:s6]
          old = 'Status: SOURCE RECOVERY IN PROGRESS / RUNTIME BINDING + CONNECTED STAGING PENDING'
          new = 'Status: AUTHORED SOURCE RECOVERED / RUNTIME BINDING + CONNECTED STAGING PENDING'
          if old in section:
              section = section.replace(old, new, 1)
              text = text[:s5] + section + text[s6:]
          elif new not in section:
              raise SystemExit('unexpected S5 status')
          marker = '\n## Run-completion rule\n'
          heading = '### Run 2026-08-11 — S5 authored source recovery green'
          if heading not in text:
              body = '\n'.join([
                  '', heading, '',
                  f"Workflow run: `{os.environ['GITHUB_RUN_ID']}`", '',
                  'Result: GREEN FOR THE AUTHORED-SOURCE RECOVERY BOUNDARY.', '',
                  '- All 11 monthly JSON packs were regenerated from deterministic builders and physically committed.',
                  '- Monthly parser/coverage/privacy contracts and whole-campaign Day 1–334 integrity checks passed.',
                  '- All four cross-month handoffs resolve to executable target Story rules with `player_story_choice_is` conditions and `relationship_adjust` effects.',
                  '- Backend/Edge typecheck, S4 callbacks, Player Messaging, and stock/Story scheduler integration passed.', '',
                  'S5 is not complete overall. `news`, `contractPlans`, and `systemBindingPlans` remain intentionally unbound until authoritative adapters are implemented. Forward S2/S3 replay repairs and Story runner retry/idempotency hardening remain next.', ''
              ])
              if marker not in text:
                  raise SystemExit('roadmap marker missing')
              text = text.replace(marker, body + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git add \
            docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md \
            docs/seed-content/story/content \
            scripts/story-content/build-act2-october-pack.py \
            scripts/story-content/build-act3-act8-packs.py \
            scripts/story-content-all-packs-contract.test.mjs \
            backend/src/domains/storylines/tests/act1AugustStoryContentPack.test.ts \
            backend/src/domains/storylines/tests/monthlyStoryContentPackContract.test.ts
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(story): recover deterministic CEE100 authored source"
          git push origin HEAD:feat/story-narrative-convergence-v1

      - name: Record recovery retry failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path('docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## Run-completion rule\n'
          heading = f"### Run 2026-08-11 — S5 source recovery V4 failure `{os.environ['GITHUB_RUN_ID']}`"
          if heading not in text:
              body = '\n'.join([
                  '', heading, '',
                  f"Source head: `{os.environ['GITHUB_SHA']}`", '',
                  'Result: FAILED; generated packs and local recovery edits were discarded before publication.', '',
                  'Inspect the exact failed job log. Preserve all parser, callback, privacy, coverage, hidden-canon, density, Messaging, and scheduler assertions.', ''
              ])
              if marker not in text:
                  raise SystemExit('roadmap marker missing')
              text = text.replace(marker, body + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git add docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(story): record S5 recovery V4 failure"
            git push origin HEAD:feat/story-narrative-convergence-v1
          fi