name: Phase 3D Inventory Convergence

on:
  pull_request:
    paths:
      - "backend/src/domains/business/api/playerBusinessInputPurchaseRetirement.test.ts"
      - "docs/architecture/inventories/econovaria-architecture-inventory-v2.json"
      - ".github/workflows/phase3d-inventory-convergence.yml"

permissions:
  contents: read

concurrency:
  group: phase3d-inventory-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  converge:
    if: github.event.pull_request.number == 656
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Phase 3D branch
        uses: actions/checkout@v7
        with:
          ref: refactor/business-abstract-input-retirement-v2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Verify retirement response contract
        run: |
          deno test --config backend/supabase/functions/classroom-api/deno.json \
            --lock=backend/supabase/functions/deno.lock --frozen \
            backend/src/domains/business/api/playerBusinessInputPurchaseRetirement.test.ts

      - name: Regenerate and ratchet architecture inventory
        run: |
          node scripts/architecture/build-architecture-inventory.mjs
          node scripts/architecture/architecture-ratchet-v2.mjs
          git diff --check

      - name: Commit deterministic inventory
        shell: bash
        run: |
          if git diff --quiet -- \
            docs/architecture/inventories/econovaria-architecture-inventory-v2.json; then
            echo "Architecture inventory is already current."
            exit 0
          fi
          git config user.name "econovaria-phase3d-inventory"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            docs/architecture/inventories/econovaria-architecture-inventory-v2.json
          git commit -m "docs(architecture): converge Phase 3D inventory"
          git push origin HEAD:refactor/business-abstract-input-retirement-v2
