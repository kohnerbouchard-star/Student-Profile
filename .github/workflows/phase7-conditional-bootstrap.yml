name: Phase 7 Conditional Bootstrap

on:
  push:
    branches:
      - feat/business-timed-manufacturing-v2
    paths:
      - .github/workflows/phase7-conditional-bootstrap.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
      - name: Verify Phase 6 durable handoff
        id: phase6
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/roadmaps/business-phase6-certified-v1.json
          implementation_sha="$(node -e "const e=require('./docs/roadmaps/business-phase6-certified-v1.json'); if(e.phase!=='business-v2-phase-6'||e.missingWorkflows.length||e.failedWorkflows.length) process.exit(1); process.stdout.write(e.implementationSha)")"
          test -n "$implementation_sha"
          grep -q '^\*\*Status:\*\* COMPLETE' docs/roadmaps/business-phase6-timed-manufacturing-scope-v1.md
          title="$(gh pr view 661 --repo "$GITHUB_REPOSITORY" --json title --jq .title)"
          case "$title" in *certified*) ;; *) echo "PR #661 is not finalized as certified" >&2; exit 1;; esac
          echo "implementation_sha=${implementation_sha}" >> "$GITHUB_OUTPUT"
          echo "phase6_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create bounded Phase 7 branch and scope
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE6_IMPLEMENTATION_SHA: ${{ steps.phase6.outputs.implementation_sha }}
          PHASE6_HEAD: ${{ steps.phase6.outputs.phase6_head }}
        shell: bash
        run: |
          set -euo pipefail
          branch=feat/business-store-seller-offers-v2
          if git ls-remote --exit-code origin "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "${branch} already exists; no duplicate branch created."
          else
            git switch -c "$branch"
            cat > docs/roadmaps/business-phase7-store-seller-offers-scope-v1.md <<EOF
          # Business V2 Phase 7 — Store Seller Offers Scope v1

          **Status:** IN PROGRESS — Phase 7A seller-offer authority and multi-offer catalog is the active bounded checkpoint  
          **Branch:** \`${branch}\`  
          **Parent branch:** \`feat/business-timed-manufacturing-v2\`  
          **Certified Phase 6 implementation:** \`${PHASE6_IMPLEMENTATION_SHA}\`  
          **Phase 6 durable handoff head:** \`${PHASE6_HEAD}\`  

          ## Purpose

          Phase 7 separates Store catalog identity from seller-offer identity. A catalog item remains one canonical product definition while seeded sellers and Player Businesses may publish separate offers beneath that item with independent price, finite stock, lifecycle state, and version evidence.

          ## Phase 7A authorized boundary

          The first checkpoint may add:

          - one game-scoped seller-offer authority beneath canonical Store catalog identity;
          - seeded-system and Player-Business seller kinds without duplicating item identity;
          - at most one current offer per seller and catalog item;
          - finite offered stock, active/sold-out/paused/withdrawn state, exact price and offer versions;
          - append-only offer-version evidence;
          - compatibility backfill for existing seeded Store items;
          - a public-key-only multi-offer catalog read model.

          ## Closed boundaries

          Phase 7A does not authorize:

          - movement of Business Finished Goods into Store-listing custody;
          - Player listing or withdrawal mutations;
          - buyer inventory transfer, buyer debit, seller credit, tax, fees, refunds, or disputes;
          - automatic Business revenue or COGS convergence;
          - corporate equity, IPO, or Financial Market publication;
          - merge, staging deployment, production deployment, secret mutation, or live database mutation.

          Player-Business offers must remain presentation-only until physical custody and atomic purchase settlement are separately implemented and certified.

          ## Completion rule

          Phase 7A is complete only when the offer schema, seeded compatibility migration, lifecycle/version invariants, public multi-offer read, privacy boundary, concurrency/idempotency simulations, database replay twice, backend/Edge/repository/security/Player regressions, exact implementation SHA, and durable plan/log certification are all present.

          ## Next authorized implementation

          Implement the Phase 7A seller-offer foundation and multi-offer read on this stacked draft branch. Do not add listing custody or purchase settlement in the same checkpoint.
          EOF
            git config user.name "econovaria-phase7-bootstrap"
            git config user.email "actions@users.noreply.github.com"
            git add docs/roadmaps/business-phase7-store-seller-offers-scope-v1.md
            git commit -m "docs(business): open Phase 7 seller-offer scope"
            git push origin "$branch"
          fi
          if ! gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq 'length > 0' | grep -q true; then
            gh pr create --repo "$GITHUB_REPOSITORY" --draft --base feat/business-timed-manufacturing-v2 --head "$branch" --title "Draft: Business V2 Phase 7 Store seller offers" --body "## Scope\n\nPhase 7A introduces seller-offer identity beneath canonical Store catalog identity. It is stacked on durably certified Phase 6 PR #661.\n\nThis draft opens only the bounded seller-offer schema, seeded compatibility, lifecycle/version evidence, and public multi-offer read. Store-listing custody, Player listing/withdrawal mutations, buyer settlement, sales convergence, IPO integration, merge, staging, and production deployment remain closed."
          fi
      - name: Remove conditional bootstrap from Phase 6 branch
        shell: bash
        run: |
          set -euo pipefail
          git switch feat/business-timed-manufacturing-v2
          git pull --ff-only origin feat/business-timed-manufacturing-v2
          rm .github/workflows/phase7-conditional-bootstrap.yml
          git config user.name "econovaria-phase7-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/phase7-conditional-bootstrap.yml
          git commit -m "chore(business): remove Phase 7 bootstrap controller"
          git push origin HEAD:feat/business-timed-manufacturing-v2
