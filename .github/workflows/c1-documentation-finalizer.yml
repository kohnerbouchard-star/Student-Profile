name: C1 documentation finalizer

on:
  push:
    branches:
      - feat/multicurrency-store-funding-v1
    paths:
      - .github/workflows/c1-documentation-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact documentation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Update scope and append execution log
        shell: bash
        env:
          SECTION_B64: ""
          ENTRY_B64: ""
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          scope_path = Path("docs/roadmaps/multicurrency-store-funding-scope-v1.md")
          log_path = Path("docs/roadmaps/business-v2-development-execution-log-v1.md")
          handoff_path = Path("docs/roadmaps/multicurrency-store-funding-implementation-handoff-v1.md")
          if not handoff_path.is_file():
              raise SystemExit("C1 handoff file is missing")

          scope = scope_path.read_text()
          old_status = "**Status:** `IMPLEMENTATION_IN_PROGRESS` — database authority under verification; no certification claimed"
          new_status = "**Status:** `IMPLEMENTED_NOT_MERGED` — exact-head implementation certified; PR #674 remains draft, open, unmerged, and undeployed"
          if old_status in scope:
              scope = scope.replace(old_status, new_status, 1)
          elif new_status not in scope:
              raise SystemExit("C1 scope status marker was not found")
          section = base64.b64decode(os.environ["SECTION_B64"]).decode()
          marker = "## Completion boundary\n"
          if section.strip() not in scope:
              if marker not in scope:
                  raise SystemExit("C1 scope completion marker was not found")
              scope = scope.replace(marker, section + marker, 1)
          scope_path.write_text(scope)

          log = log_path.read_text()
          entry = base64.b64decode(os.environ["ENTRY_B64"]).decode()
          entry_marker = "## 2026-08-28 — Multi-Currency Store Funding C1 EXACT-HEAD VERIFIED"
          if entry_marker not in log:
              if not log.endswith("\n"):
                  log += "\n"
              log += "\n" + entry
              log_path.write_text(log)
          PY

      - name: Commit durable C1 records
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/roadmaps/business-v2-development-execution-log-v1.md \
            docs/roadmaps/multicurrency-store-funding-scope-v1.md
          if git diff --cached --quiet; then
            echo "C1 records are already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(store-funding): certify C1 exact implementation"
          git push origin HEAD:feat/multicurrency-store-funding-v1
