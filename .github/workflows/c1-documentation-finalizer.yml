name: C1 documentation finalizer

on:
  push:
    branches:
      - feat/multicurrency-store-funding-v1
    paths:
      - .github/workflows/c1-documentation-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact documentation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Write durable C1 certification records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          implementation_sha = "1cf6f413f10a761265cdec6076ceb9b2b3afcbf5"
          scope_path = Path("docs/roadmaps/multicurrency-store-funding-scope-v1.md")
          handoff_path = Path("docs/roadmaps/multicurrency-store-funding-implementation-handoff-v1.md")
          log_path = Path("docs/roadmaps/business-v2-development-execution-log-v1.md")

          scope = scope_path.read_text()
          old_status = "**Status:** `IMPLEMENTATION_IN_PROGRESS` — database authority under verification; no certification claimed"
          new_status = "**Status:** `IMPLEMENTED_NOT_MERGED` — exact-head implementation certified; PR #674 remains draft, open, unmerged, and undeployed"
          if old_status not in scope and new_status not in scope:
              raise SystemExit("C1 scope status marker was not found")
          scope = scope.replace(old_status, new_status, 1)

          certification_section = '''## Certified implementation and evidence

- **Exact C1 implementation and verification source:** `1cf6f413f10a761265cdec6076ceb9b2b3afcbf5`.
- **Permanent C1 certification workflow:** `multicurrency-store-funding-v1`, run `33114174603` — source/scope job `98664460581` and disposable-database job `98664460167`, both successful.
- **Retained connected Store certification:** `Business Player Store Cutover V2`, run `33114174711`. The exact-SHA connected two-browser job rerun `98676659699` completed successfully without changing implementation or weakening the browser assertion.
- All 20 pull-request-triggered workflows returned for the exact implementation source completed successfully. This includes C1, C0, B2, complete Database Replay, Store seller-offer/listing/withdrawal/quote/atomic-settlement/cutover gates, Player Chromium, Backend Typecheck, Repository Quality, Supply Chain Security, runtime wiring, Business economy/workforce/manufacturing, timezone/calendar, Admin API, and staging preflight.
- The first connected Store attempt recorded two transient local-runtime `503` responses for independent `contracts` and `messages` reads; both requests recovered to `200` on their built-in retry and all Store settlement/isolation evidence was already true. The same exact SHA then passed the strict zero-console-error journey on rerun. No production source, C0/B1/B2 monetary invariant, or test expectation was relaxed.
- The durable implementation handoff is `docs/roadmaps/multicurrency-store-funding-implementation-handoff-v1.md`. This and later documentation-only commits must never replace `1cf6f413f10a761265cdec6076ceb9b2b3afcbf5` as the C1 certification identity.
- No merge, deployment, scheduler installation, secret mutation, staging/production SQL, or live database mutation is authorized or claimed.

'''
          marker = "## Completion boundary\n"
          if certification_section.strip() not in scope:
              if marker not in scope:
                  raise SystemExit("C1 scope completion marker was not found")
              scope = scope.replace(marker, certification_section + marker, 1)
          scope_path.write_text(scope)

          handoff = '''# Multi-Currency Store Funding Implementation Handoff v1

## Canonical status

- Roadmap item: `BUSINESS-V2-10A4C1`.
- Owner branch: `feat/multicurrency-store-funding-v1`.
- Stacked draft PR: #674, base `feat/multicurrency-funding-core-v1` / draft PR #673.
- Parent C0 exact implementation and verification source: `fd1511d716c1efd291cf6f45415a32a8d7550db4`.
- Parent C0 clean documentation handoff/base: `0aec6cd3b97058a918ff60acdef0143cfcd97d06`.
- **Exact C1 implementation and verification source:** `1cf6f413f10a761265cdec6076ceb9b2b3afcbf5`.
- **Permanent C1 certification run:** `33114174603`.
- **Retained connected Store certification run:** `33114174711`.
- Canonical status: `IMPLEMENTED_NOT_MERGED`, not `VERIFIED_COMPLETE`.
- This and every later documentation-only handoff is later than the tested implementation source and must never replace `1cf6f413f10a761265cdec6076ceb9b2b3afcbf5` as the C1 certification identity.
