## Certification issue resolved without source change

The first exact-head connected Store job completed the commercial journey and recorded successful payment, inventory, receipt, replay, withdrawal-ordering, and two-game-isolation evidence, but its strict browser assertion rejected two console errors. The sanitized artifact showed one bodyless `503` for `GET /players/me/contracts` and one for `GET /players/me/messages` during the second-game login fan-out. Each independent read automatically retried and returned `200` one second later; neither request was a Store quote, purchase, settlement, receipt, Banking, FX, or Inventory operation.

The failed job was rerun at the unchanged exact implementation SHA. Rerun job `98676659699` passed the two-browser journey, evidence-privacy scan, artifact publication, and final enforcement. No application code, workflow assertion, resilience policy, Store settlement rule, C0 funding rule, B1 fixing rule, B2 clearing rule, or architecture ratchet was weakened. The original artifact remains evidence of the diagnosed local-runtime transient; the successful exact-SHA rerun is the certification result.

## Implemented authority

C1 makes both retained Store supply classes consume the shared C0 purchase-funding authority while preserving Store ownership of commercial and Inventory semantics:

- seeded/NPC bills remain denominated in the authoritative Store item currency and credit a named game-scoped `store.seeded-revenue` Checking account;
- Business seller-offer bills remain denominated in the offer currency and credit the seller Business's canonical active Checking account;
- the Buyer selects one to three unique canonical active Player Checking accounts and supplies positive allocations expressed in the Store bill currency;
- exact allocations must equal the authoritative Store total, with no browser-authored price, currency, recipient, rate, fee, balance, hold, fixing, facility, or transaction identity;
- same-currency legs use rate `1`, zero spread, and no FX facility;
- foreign legs consume the certified C0 retail checkout policy and B1/B2 fixing, clearing, reserve, and bounded-liquidity authorities;
- Store quote identity remains separate from `pfq_...` funding identity, and Store receipt identity remains separate from `pfr_...` funding evidence;
- Store item/offer, stock, withdrawal eligibility, quote lifecycle, Inventory custody/delivery, Buyer acquisition basis, Business COGS/margin, and offer/item-first lock order remain Store authority;
- C0 remains the only funding quote/composer authority and B2 remains the only balanced Banking/clearing authority;
- matching replay resolves before mutable price, stock, balance, hold, fixing, or facility reinterpretation, while conflicting reuse fails closed;
- payment, target credit, FX effects, Inventory movement, Store receipt, funding receipt, quote consumption, and seller/system evidence commit atomically or roll back together.

C1 creates no Store wallet, no duplicate FX engine, no reusable foreign balance, no Savings checkout path, no parallel Inventory projection, and no alternate Store money journal.

## Durable implementation surface

### Forward migrations

- `backend/supabase/migrations/20260827093000_multicurrency_store_funding_schema_v1.sql`
- `backend/supabase/migrations/20260827093500_multicurrency_store_funding_quote_commands_v1.sql`
- `backend/supabase/migrations/20260827094000_multicurrency_store_funding_settlement_v1.sql`
- `backend/supabase/migrations/20260827094500_multicurrency_store_funding_assertions_v1.sql`

The schema migration binds existing seeded and Business Store quotes/receipts to C0 quote, receipt, Banking transaction, recipient-account, context-hash, and idempotency evidence. Compatibility rows remain readable, but a funded Store receipt cannot fabricate the former single-ledger-entry model.

The quote commands preserve Store quote identity, normalize Store bills to the target currency's supported minor unit, resolve the canonical recipient account, bind immutable Store context to one C0 quote, and cap Store usability at the earlier commercial/funding expiry.

The settlement commands preserve Store-root-first locking, validate Store and C0 context equality, invoke the private C0 composer inside the Store transaction, deliver canonical Inventory, preserve Buyer acquisition basis and Business COGS/margin, consume both quote authorities once, and publish bounded Store plus nested funding evidence.

### Public Store integration

- `backend/src/domains/store/contracts/playerStoreFundingPublicContracts.ts`
- `backend/src/domains/store/infrastructure/playerStoreFundingPublicResponse.ts`
- `backend/src/domains/store/infrastructure/supabasePlayerStoreFundingPublicRepository.ts`

These files enforce public-key-only input/output, one-to-three-account allocation parsing, trusted server scope, bounded C0 evidence projection, stable error mapping, and no internal UUID publication. The inherited authenticated Store surface and connected browser journey consume this authority without introducing a second client-side balance or exchange-rate cache.

### Permanent verification

