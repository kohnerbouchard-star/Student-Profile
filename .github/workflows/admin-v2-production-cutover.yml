name: Admin V2 Production Cutover

on:
  pull_request:
    branches: [main]
    paths:
      - "vercel.json"
      - ".github/workflows/admin-v2-production-cutover.yml"
      - "admin/v2.html"
      - "admin/v2/**"
  push:
    branches: [main]
    paths:
      - "vercel.json"
      - ".github/workflows/admin-v2-production-cutover.yml"
      - "admin/v2.html"
      - "admin/v2/**"

permissions:
  contents: read

concurrency:
  group: admin-v2-production-cutover-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: "58.1.0"
  PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh

jobs:
  contract:
    name: Verify Admin V2 cutover contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify canonical Admin V2 edge routing
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          if (config.git?.deploymentEnabled?.main !== false) {
            throw new Error('Automatic main deployment must remain disabled.');
          }
          const rewrites = Array.isArray(config.rewrites) ? config.rewrites : [];
          for (const source of ['/admin', '/admin/']) {
            const matches = rewrites.filter((entry) => entry?.source === source);
            if (matches.length !== 1 || matches[0].destination !== '/admin/v2.html') {
              throw new Error(`Canonical Admin V2 rewrite missing or ambiguous for ${source}`);
            }
          }
          const v2 = fs.readFileSync('admin/v2.html', 'utf8');
          if (!v2.includes('data-admin-ui-version="2"')) throw new Error('Admin V2 version marker is missing.');
          if (!v2.includes('id="adminPreview"')) throw new Error('Admin V2 mount target is missing.');
          if (!v2.includes('./v2/src/main.js')) throw new Error('Admin V2 entrypoint is missing.');
          if (v2.includes('id="app-shell"') || v2.includes('./admin.js')) {
            throw new Error('Admin V2 shell contains a legacy bootstrap marker.');
          }
          NODE

      - name: Run Admin V2 contract suite
        run: npm run test:admin-v2

      - name: Verify deployment and security contracts
        run: |
          set -euo pipefail
          node --test scripts/vercel-deployment-contract.test.mjs
          npm run security:secrets

      - name: Verify diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          if test "${{ github.event_name }}" = "pull_request"; then
            git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
          else
            git diff --check HEAD^ HEAD
          fi

  production:
    name: Build, verify, and switch production Admin to V2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Enforce protected production boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Check out exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current main binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Re-run Admin V2 release contracts
        run: |
          set -euo pipefail
          npm run test:admin-v2
          node --test scripts/vercel-deployment-contract.test.mjs

      - name: Link exact Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          umask 077
          node - <<'NODE' > .vercel/project.json
          process.stdout.write(JSON.stringify({
            orgId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
          }));
          NODE

      - name: Pull production environment and build exact source
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"
          ECONOVARIA_SOURCE_SHA="$SOURCE_COMMIT" npx --yes "vercel@$VERCEL_CLI_VERSION" build \
            --prod \
            --token="$VERCEL_TOKEN"

      - name: Create unaliased staged production deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/vercel-deploy-output.txt"
          npx --yes "vercel@$VERCEL_CLI_VERSION" deploy \
            --prebuilt \
            --prod \
            --skip-domain \
            --yes \
            --env "ECONOVARIA_SOURCE_SHA=$SOURCE_COMMIT" \
            --token="$VERCEL_TOKEN" \
            | tee "$output"
          deployment_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' "$output" | tail -n 1)"
          test -n "$deployment_url"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Prove staged canonical Admin route is V2 on first response
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="${{ steps.deploy.outputs.deployment_url }}"
          npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "$deployment_url" --token="$VERCEL_TOKEN"
          for path in /admin /admin/ /admin/v2.html; do
            file="$RUNNER_TEMP/$(echo "$path" | tr '/.' '__').html"
            npx --yes "vercel@$VERCEL_CLI_VERSION" curl "$path" \
              --deployment "$deployment_url" \
              --token="$VERCEL_TOKEN" > "$file"
            grep -Fq 'data-admin-ui-version="2"' "$file"
            grep -Fq 'id="adminPreview"' "$file"
            grep -Fq './v2/src/main.js' "$file"
            if grep -Fq 'id="app-shell"' "$file" || grep -Fq './admin.js' "$file"; then
              echo "Legacy Admin bootstrap detected at $path" >&2
              exit 1
            fi
          done
          npx --yes "vercel@$VERCEL_CLI_VERSION" curl /api/health \
            --deployment "$deployment_url" \
            --token="$VERCEL_TOKEN" > "$RUNNER_TEMP/health.json"
          node - <<'NODE'
          const health = require(process.env.HEALTH_PATH);
          if (health.ok !== true || health.status !== 'ready') throw new Error('Staged health is not ready.');
          if (health.environment !== 'production') throw new Error('Staged deployment is not production-bound.');
          if (health.projectRef !== process.env.PRODUCTION_PROJECT_REF) throw new Error('Production project binding mismatch.');
          if (health.sourceCommit !== process.env.SOURCE_COMMIT) throw new Error('Source commit mismatch.');
          NODE
        env:
          HEALTH_PATH: ${{ runner.temp }}/health.json

      - name: Promote verified Admin V2 deployment
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="${{ steps.deploy.outputs.deployment_url }}"
          npx --yes "vercel@$VERCEL_CLI_VERSION" promote \
            "$deployment_url" \
            --yes \
            --token="$VERCEL_TOKEN"
          npx --yes "vercel@$VERCEL_CLI_VERSION" promote status --token="$VERCEL_TOKEN"

      - name: Verify canonical production Admin V2 cutover
        shell: bash
        run: |
          set -euo pipefail
          for path in /admin /admin/; do
            file="$RUNNER_TEMP/production-$(echo "$path" | tr '/.' '__').html"
            npx --yes "vercel@$VERCEL_CLI_VERSION" curl "$path" \
              --token="$VERCEL_TOKEN" > "$file"
            grep -Fq 'data-admin-ui-version="2"' "$file"
            grep -Fq 'id="adminPreview"' "$file"
            grep -Fq './v2/src/main.js' "$file"
            if grep -Fq 'id="app-shell"' "$file" || grep -Fq './admin.js' "$file"; then
              echo "Legacy Admin bootstrap detected in promoted production at $path" >&2
              exit 1
            fi
          done
          npx --yes "vercel@$VERCEL_CLI_VERSION" curl /api/health \
            --token="$VERCEL_TOKEN" > "$RUNNER_TEMP/production-health.json"
          node - <<'NODE'
          const health = require(process.env.HEALTH_PATH);
          if (health.ok !== true || health.status !== 'ready') throw new Error('Production health is not ready.');
          if (health.environment !== 'production') throw new Error('Production environment mismatch.');
          if (health.projectRef !== process.env.PRODUCTION_PROJECT_REF) throw new Error('Production project binding mismatch.');
          if (health.sourceCommit !== process.env.SOURCE_COMMIT) throw new Error('Promoted source commit mismatch.');
          NODE
          echo '## ADMIN V2 PRODUCTION CUTOVER: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- /admin and /admin/ serve V2 on the first response.' >> "$GITHUB_STEP_SUMMARY"
          echo '- No legacy app-shell/admin.js bootstrap is present on canonical Admin routes.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production health and source binding are PASS.' >> "$GITHUB_STEP_SUMMARY"
        env:
          HEALTH_PATH: ${{ runner.temp }}/production-health.json
