name: Admin V2 Players

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/admin-v2-players.yml"
      - "admin/v2.html"
      - "admin/v2/src/api/admin-api-client.js"
      - "admin/v2/src/app.js"
      - "admin/v2/src/core/navigation-registry.js"
      - "admin/v2/src/routes/players/**"
      - "admin/v2/styles/routes/players.css"
      - "scripts/admin-v2-unit.test.mjs"
      - "scripts/admin-v2-players-api.test.mjs"
      - "scripts/admin-v2-players-browser-smoke.mjs"

permissions:
  contents: read

concurrency:
  group: admin-v2-players-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  players-v2:
    name: Players V2 contract and browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install repository dependencies
        run: npm ci

      - name: Validate Players V2 syntax and diff
        shell: bash
        run: |
          set -euo pipefail
          node --check admin/v2/src/api/admin-api-client.js
          node --check admin/v2/src/app.js
          node --check admin/v2/src/core/navigation-registry.js
          node --check admin/v2/src/routes/players/PlayerForms.js
          node --check admin/v2/src/routes/players/PlayersController.js
          node --check admin/v2/src/routes/players/PlayersRoute.js
          node --check admin/v2/src/routes/players/PlayersSkeleton.js
          node --check scripts/admin-v2-unit.test.mjs
          node --check scripts/admin-v2-players-api.test.mjs
          node --check scripts/admin-v2-players-browser-smoke.mjs
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA"...HEAD
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Scan repository for committed credentials
        run: npm run security:secrets

      - name: Run standard Admin V2 tests
        run: npm run test:admin-v2

      - name: Run Overview, Store, Market, and Players V2 contract regressions
        run: >-
          node --test
          scripts/admin-v2-store-api.test.mjs
          scripts/admin-v2-store-media.test.mjs
          scripts/admin-v2-market-api.test.mjs
          scripts/admin-v2-players-api.test.mjs

      - name: Run authentication-boundary regressions
        run: npm run test:auth-boundaries

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Materialize browser-only runtime fixture
        shell: bash
        run: |
          set -euo pipefail
          cat > runtime-config.env.js <<'EOF'
          window.__ECONOVARIA_RUNTIME_CONFIG__ = Object.freeze({
            environment: "development",
            projectRef: "runtimefixture123456",
            supabaseUrl: "https://runtimefixture123456.supabase.co",
            supabasePublishableKey: "sb_" + "publishable_runtime_fixture_1234567890"
          });
          EOF

      - name: Exercise Players V2 browser states and mutations
        run: node scripts/admin-v2-players-browser-smoke.mjs

      - name: Upload Players V2 browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-v2-players-evidence
          path: |
            docs/operations/evidence/admin-ui-v2-players/admin-v2-players-browser-results.json
            docs/operations/evidence/admin-ui-v2-players/players-*.png
          if-no-files-found: warn
          retention-days: 7
