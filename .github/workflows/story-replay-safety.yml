  pull_request:
    paths:
      - "docs/operations/contracts/player-cross-cutting/pr-955.json"
      - "docs/operations/contracts/player-cross-cutting/pr-954.json"
      - "docs/operations/contracts/player-cross-cutting/pr-953.json"
      - "docs/operations/contracts/player-cross-cutting/pr-952.json"
      - "docs/operations/contracts/player-cross-cutting/pr-946.json"
      - "docs/operations/contracts/player-cross-cutting/pr-951.json"
      - "docs/operations/contracts/player-cross-cutting/pr-945.json"
      - "docs/operations/contracts/player-cross-cutting/pr-950.json"
      - "docs/operations/contracts/player-cross-cutting/pr-949.json"
      - "docs/operations/contracts/player-cross-cutting/pr-944.json"
      - "docs/operations/contracts/player-cross-cutting/pr-943.json"
      - "docs/operations/contracts/player-cross-cutting/pr-948.json"
      - "docs/operations/contracts/player-cross-cutting/pr-942.json"
      - "docs/operations/contracts/player-cross-cutting/pr-947.json"
      - "docs/operations/contracts/player-cross-cutting/pr-940.json"
      - "docs/operations/contracts/player-cross-cutting/pr-927.json"
      - "docs/operations/contracts/player-cross-cutting/pr-936.json"
      - "docs/operations/contracts/player-cross-cutting/pr-939.json"
      - "docs/operations/contracts/player-cross-cutting/pr-941.json"
      - "docs/operations/contracts/player-cross-cutting/pr-924.json"
      - "docs/operations/contracts/player-cross-cutting/pr-916.json"
      - "docs/operations/contracts/player-cross-cutting/pr-913.json"
      - "backend/src/domains/storylines/**"
      - "backend/src/domains/stocks/news.ts"
      - "backend/src/domains/stocks/news.test.ts"
      - "backend/src/domains/stocks/contracts/stockMarketNewsContracts.ts"
      - "backend/src/domains/stocks/contracts/stockMarketNewsContracts.test.ts"
      - "backend/supabase/functions/stock-market-runner/storylineRunnerAfterTick.ts"
      - "backend/supabase/functions/stock-market-orchestrator/index.ts"
      - "backend/supabase/migrations/20260812115000_add_story_effect_replay_safety_v1.sql"
      - "backend/supabase/migrations/20260812120000_add_story_event_execution_lease_v1.sql"
      - "backend/supabase/migrations/20260816090100_seed_meridian_competing_models_v1.sql"
      - "backend/supabase/migrations/20260816090200_seed_meridian_outbreak_of_war_v1.sql"
      - "backend/supabase/migrations/20260816090300_seed_meridian_fortune_during_war_v1.sql"
      - "backend/supabase/migrations/20260816090400_seed_meridian_question_of_belonging_v1.sql"
      - "backend/supabase/migrations/20260816090500_seed_meridian_reckoning_v1.sql"
      - "backend/supabase/migrations/20260816090600_seed_meridian_local_friend_relationships_v1.sql"
      - "backend/supabase/migrations/20260816090700_harden_meridian_arrival_clock_gate_v1.sql"
      - ".github/workflows/story-replay-safety.yml"
      - "docs/operations/contracts/player-cross-cutting/pr-914.json"
  push:
    branches:
      - main
    paths:
      - "backend/src/domains/storylines/**"
      - "backend/src/domains/stocks/news.ts"
      - "backend/src/domains/stocks/news.test.ts"
      - "backend/src/domains/stocks/contracts/stockMarketNewsContracts.ts"
      - "backend/src/domains/stocks/contracts/stockMarketNewsContracts.test.ts"
      - "backend/supabase/functions/stock-market-runner/storylineRunnerAfterTick.ts"
      - "backend/supabase/functions/stock-market-orchestrator/index.ts"
      - "backend/supabase/migrations/20260812115000_add_story_effect_replay_safety_v1.sql"
      - "backend/supabase/migrations/20260812120000_add_story_event_execution_lease_v1.sql"
      - "backend/supabase/migrations/20260816090100_seed_meridian_competing_models_v1.sql"
      - "backend/supabase/migrations/20260816090200_seed_meridian_outbreak_of_war_v1.sql"
      - "backend/supabase/migrations/20260816090300_seed_meridian_fortune_during_war_v1.sql"
      - "backend/supabase/migrations/20260816090400_seed_meridian_question_of_belonging_v1.sql"
      - "backend/supabase/migrations/20260816090500_seed_meridian_reckoning_v1.sql"
      - "backend/supabase/migrations/20260816090600_seed_meridian_local_friend_relationships_v1.sql"
      - "backend/supabase/migrations/20260816090700_harden_meridian_arrival_clock_gate_v1.sql"
      - ".github/workflows/story-replay-safety.yml"

permissions:
  contents: read

concurrency:
  group: story-replay-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Check Story replay and execution safety source
        run: |
          deno check \
            --config supabase/functions/deno.json \
            --lock=supabase/functions/deno.lock \
            --frozen \
            supabase/functions/stock-market-runner/storylineRunnerAfterTick.ts \
            src/domains/storylines/infrastructure/supabaseStoryEffectLedgerWriter.ts \
            src/domains/storylines/infrastructure/supabaseStoryImpactWriter.ts \
            src/domains/storylines/infrastructure/supabaseStoryContractWriter.ts \
            src/domains/storylines/infrastructure/supabaseStoryEventExecutionRepository.ts \
            src/domains/storylines/contracts/storyConditionContracts.ts \
            src/domains/storylines/services/storyConditionEngine.ts \
            src/domains/storylines/services/storyEventExecutionPlan.ts \
            src/domains/storylines/services/storylineRunner.ts

      - name: Run Story replay and execution safety tests
        run: |
          deno test \
            --allow-read=supabase/migrations/20260812115000_add_story_effect_replay_safety_v1.sql,supabase/migrations/20260812120000_add_story_event_execution_lease_v1.sql,supabase/migrations/20260816090100_seed_meridian_competing_models_v1.sql,supabase/migrations/20260816090200_seed_meridian_outbreak_of_war_v1.sql,supabase/migrations/20260816090300_seed_meridian_fortune_during_war_v1.sql,supabase/migrations/20260816090400_seed_meridian_question_of_belonging_v1.sql,supabase/migrations/20260816090500_seed_meridian_reckoning_v1.sql,supabase/migrations/20260816090600_seed_meridian_local_friend_relationships_v1.sql,supabase/migrations/20260816090700_harden_meridian_arrival_clock_gate_v1.sql \
            --config supabase/functions/deno.json \
            --lock=supabase/functions/deno.lock \
            --frozen \
            src/domains/stocks/news.test.ts \
            src/domains/stocks/contracts/stockMarketNewsContracts.test.ts \
            src/domains/storylines/contracts/storylineContracts.test.ts \
            src/domains/storylines/infrastructure/stockMarketStoryNewsWriter.test.ts \
            src/domains/storylines/infrastructure/supabaseStoryEffectLedgerWriter.test.ts \
            src/domains/storylines/infrastructure/supabaseStoryImpactWriter.test.ts \
            src/domains/storylines/infrastructure/supabaseStoryContractWriter.test.ts \
            src/domains/storylines/infrastructure/supabaseStoryEventExecutionRepository.test.ts \
            src/domains/storylines/services/storylineRunnerGameScope.test.ts \
            src/domains/storylines/services/storylineRunnerReplayIdentity.test.ts \
            src/domains/storylines/services/storyConditionEngine.test.ts \
            src/domains/storylines/services/prepareStoryEffects.test.ts \
            src/domains/storylines/services/storyCompletedContractCondition.test.ts \
            src/domains/storylines/services/storyMeridianCompetingModelsMigrationContract.test.ts \
            src/domains/storylines/services/storyMeridianOutbreakOfWarMigrationContract.test.ts \
            src/domains/storylines/services/storyMeridianFortuneDuringWarMigrationContract.test.ts \
            src/domains/storylines/services/storyMeridianQuestionOfBelongingMigrationContract.test.ts \
            src/domains/storylines/services/storyMeridianReckoningMigrationContract.test.ts \
            src/domains/storylines/services/storyMeridianLocalFriendRelationshipsMigrationContract.test.ts \
            src/domains/storylines/services/storyMeridianArrivalClockGateMigrationContract.test.ts \
            src/domains/storylines/services/storyMeridianCampaignContinuationReleaseSafety.test.ts \
            src/domains/storylines/services/storylineRunnerLease.test.ts \
            src/domains/storylines/tests/storyEffectReplaySafetyMigration.test.ts \
            src/domains/storylines/tests/storyEventExecutionLeaseMigration.test.ts \
            src/domains/storylines/services/econovariaStorylineLoopSmoke.test.ts
