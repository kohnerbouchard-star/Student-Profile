name: Production Player Credential Runtime Release

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Type the exact production project ref"
        required: true
        type: string
      confirm_staging_project_ref:
        description: "Type the exact staging project ref"
        required: true
        type: string
      confirm_source_sha:
        description: "Type the exact 40-character main commit SHA"
        required: true
        type: string
      confirm_active_v2_credentials:
        description: "Type the verified active pbkdf2-sha256-v2 credential count"
        required: true
        type: string
      staging_admin_api_digest:
        description: "Paste the accepted staging admin-api SHA-256 digest"
        required: true
        type: string
      staging_classroom_api_digest:
        description: "Paste the accepted staging classroom-api SHA-256 digest"
        required: true
        type: string
      staging_player_api_digest:
        description: "Paste the accepted staging player-api SHA-256 digest"
        required: true
        type: string
      confirm_action:
        description: "Type PROMOTE PLAYER CREDENTIAL RUNTIME TO PRODUCTION"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-player-credential-runtime-release
  cancel-in-progress: false

env:
  EXPECTED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  EXPECTED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  REQUIRED_SECRET_NAME: ECONOVARIA_PLAYER_CREDENTIAL_PEPPER
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  deploy:
    name: Promote accepted Player credential runtime to production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ACCEPTED_ADMIN_DIGEST: ${{ inputs.staging_admin_api_digest }}
      ACCEPTED_CLASSROOM_DIGEST: ${{ inputs.staging_classroom_api_digest }}
      ACCEPTED_PLAYER_DIGEST: ${{ inputs.staging_player_api_digest }}
    steps:
      - name: Enforce production promotion boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$SUPABASE_ACCESS_TOKEN"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "${{ inputs.confirm_project_ref }}" = "$EXPECTED_PRODUCTION_PROJECT_REF"
          test "${{ inputs.confirm_staging_project_ref }}" = "$EXPECTED_STAGING_PROJECT_REF"
          test "${{ inputs.confirm_source_sha }}" = "$GITHUB_SHA"
          test "${{ inputs.confirm_active_v2_credentials }}" = "0"
          test "${{ inputs.confirm_action }}" = "PROMOTE PLAYER CREDENTIAL RUNTIME TO PRODUCTION"
          test "$EXPECTED_PRODUCTION_PROJECT_REF" != "$EXPECTED_STAGING_PROJECT_REF"
          for digest in "$ACCEPTED_ADMIN_DIGEST" "$ACCEPTED_CLASSROOM_DIGEST" "$ACCEPTED_PLAYER_DIGEST"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          done

      - name: Check out exact authorized main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main source and bounded function scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -f backend/src/security/playerCredentialHashing.ts
          test -f backend/supabase/functions/admin-api/index.ts
          test -f backend/supabase/functions/classroom-api/index.ts
          test -f backend/supabase/functions/player-api/index.ts
          grep -q 'player_credential_runtime_unavailable' backend/src/security/playerCredentialHashing.ts
          grep -q 'request.headers.get("idempotency-key")' \
            backend/supabase/functions/admin-api/gameProvisioningOperations.ts
          grep -q 'request.headers.get("idempotency-key")' \
            backend/src/domains/messaging/api/playerMessagingHttpHandler.ts
          grep -q 'request.headers.get("idempotency-key")' \
            backend/src/domains/messaging/api/playerMessageThreadLifecycleHttpHandler.ts
          grep -q 'request.headers.get("idempotency-key")' \
            backend/src/domains/progression/api/playerProgressionHttpHandler.ts

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate credential release contract
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test scripts/player-credential-runtime-readiness-contract.test.mjs

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1
        with:
          version: 2.109.1

      - name: Require the production pepper without modifying secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"
          names="$RUNNER_TEMP/production-secret-names.txt"
          supabase secrets list \
            --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF" \
            > "$names"
          grep -Eq '(^|[[:space:]])ECONOVARIA_PLAYER_CREDENTIAL_PEPPER([[:space:]]|$)' "$names"
          rm -f "$names"

      - name: Verify accepted staging bundle identities
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/staging-functions.json"
          FUNCTIONS_PATH="$RUNNER_TEMP/staging-functions.json" node - <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync(process.env.FUNCTIONS_PATH, 'utf8'));
          const rows = Array.isArray(parsed) ? parsed : (parsed.functions || []);
          const expected = [
            ['admin-api', true, process.env.ACCEPTED_ADMIN_DIGEST],
            ['classroom-api', true, process.env.ACCEPTED_CLASSROOM_DIGEST],
            ['player-api', false, process.env.ACCEPTED_PLAYER_DIGEST],
          ];
          for (const [slug, verifyJwt, digest] of expected) {
            const row = rows.find((entry) => entry.slug === slug);
            if (!row) throw new Error(`Accepted staging function is missing: ${slug}`);
            if (row.status !== 'ACTIVE' || row.verify_jwt !== verifyJwt) {
              throw new Error(`Accepted staging security metadata is invalid: ${slug}`);
            }
            if (row.ezbr_sha256 !== digest) {
              throw new Error(`Accepted staging digest changed: ${slug}`);
            }
          }
          NODE

      - name: Capture production function identities before promotion
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/production-functions-before.json"

      - name: Deploy only the accepted production functions
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy admin-api \
            --workdir backend \
            --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF"
          supabase functions deploy classroom-api \
            --workdir backend \
            --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF"
          supabase functions deploy player-api \
            --workdir backend \
            --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF" \
            --no-verify-jwt

      - name: Verify production matches accepted staging digests
        shell: bash
        run: |
          set -euo pipefail
          matched=false
          for attempt in $(seq 1 20); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/functions" \
              > "$RUNNER_TEMP/production-functions-after.json"
            if FUNCTIONS_PATH="$RUNNER_TEMP/production-functions-after.json" node - <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync(process.env.FUNCTIONS_PATH, 'utf8'));
          const rows = Array.isArray(parsed) ? parsed : (parsed.functions || []);
          const expected = [
            ['admin-api', true, process.env.ACCEPTED_ADMIN_DIGEST],
            ['classroom-api', true, process.env.ACCEPTED_CLASSROOM_DIGEST],
            ['player-api', false, process.env.ACCEPTED_PLAYER_DIGEST],
          ];
          for (const [slug, verifyJwt, digest] of expected) {
            const row = rows.find((entry) => entry.slug === slug);
            if (!row || row.status !== 'ACTIVE' || row.verify_jwt !== verifyJwt || row.ezbr_sha256 !== digest) {
              process.exit(1);
            }
          }
          NODE
            then
              matched=true
              break
            fi
            sleep 3
          done
          test "$matched" = true

          for function_name in admin-api classroom-api player-api; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/functions/$function_name/body" \
              > "$RUNNER_TEMP/$function_name-body.json"
            grep -q 'player_credential_runtime_unavailable' "$RUNNER_TEMP/$function_name-body.json"
            grep -q 'idempotency-key' "$RUNNER_TEMP/$function_name-body.json"
          done

      - name: Verify production Player API health
        shell: bash
        run: |
          set -euo pipefail
          health="$RUNNER_TEMP/player-api-health.json"
          status="$(curl --silent --show-error \
            --output "$health" \
            --write-out '%{http_code}' \
            "https://$EXPECTED_PRODUCTION_PROJECT_REF.supabase.co/functions/v1/player-api/health")"
          test "$status" = "200"
          HEALTH_PATH="$health" node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.env.HEALTH_PATH, 'utf8'));
          if (body.ok !== true || body.service !== 'player-api' || body.status !== 'ready') {
            throw new Error('Production Player API health response is invalid.');
          }
          NODE

      - name: Record exact-digest production promotion
        shell: bash
        run: |
          {
            echo '## Production Player credential runtime promoted'
            echo "- Exact source SHA: \`$GITHUB_SHA\`"
            echo "- Production project: \`$EXPECTED_PRODUCTION_PROJECT_REF\`"
            echo "- Accepted staging project: \`$EXPECTED_STAGING_PROJECT_REF\`"
            echo '- Active v2 credentials confirmed: `0`'
            echo "- admin-api digest: \`$ACCEPTED_ADMIN_DIGEST\`"
            echo "- classroom-api digest: \`$ACCEPTED_CLASSROOM_DIGEST\`"
            echo "- player-api digest: \`$ACCEPTED_PLAYER_DIGEST\`"
            echo '- Production secret changes: `none`'
            echo '- Database migrations: `none`'
            echo '- Vercel deployment: `none`'
            echo '- Production digest parity: `verified`'
            echo '- Player API health: `ready`'
          } >> "$GITHUB_STEP_SUMMARY"
