name: Production Player Credential Pepper Provision

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Type the exact production project ref"
        required: true
        type: string
      confirm_source_sha:
        description: "Type the exact 40-character main commit SHA"
        required: true
        type: string
      confirm_active_v2_credentials:
        description: "Type the verified active pbkdf2-sha256-v2 credential count"
        required: true
        type: string
      confirm_action:
        description: "Type PROVISION PLAYER CREDENTIAL PEPPER"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-player-credential-pepper-provision
  cancel-in-progress: false

env:
  AUTHORIZATION_PATH: docs/operations/evidence/production-player-credential-pepper-preflight-v1.json
  EXPECTED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  DENIED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  REQUIRED_SECRET_NAME: ECONOVARIA_PLAYER_CREDENTIAL_PEPPER
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  provision:
    name: Provision missing Player credential pepper
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Enforce production authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "${{ inputs.confirm_project_ref }}" = "$EXPECTED_PRODUCTION_PROJECT_REF"
          test "${{ inputs.confirm_source_sha }}" = "$GITHUB_SHA"
          test "${{ inputs.confirm_active_v2_credentials }}" = "0"
          test "${{ inputs.confirm_action }}" = "PROVISION PLAYER CREDENTIAL PEPPER"
          test "$EXPECTED_PRODUCTION_PROJECT_REF" != "$DENIED_STAGING_PROJECT_REF"
          [[ "$EXPECTED_PRODUCTION_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]

      - name: Check out exact authorized source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"

      - name: Validate bounded production preflight evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f "$AUTHORIZATION_PATH"
          node - <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.env.AUTHORIZATION_PATH, 'utf8'));
          const history = value.credentialHistory || {};
          if (
            value.schemaVersion !== 1 ||
            value.purpose !== 'provision-missing-player-credential-pepper' ||
            value.targetProjectRef !== process.env.EXPECTED_PRODUCTION_PROJECT_REF ||
            !value.deniedProjectRefs?.includes(process.env.DENIED_STAGING_PROJECT_REF) ||
            value.requiredSecret !== process.env.REQUIRED_SECRET_NAME ||
            value.sourceBranch !== 'main' ||
            history.activePbkdf2Sha256V2Credentials !== 0 ||
            history.revokedPbkdf2Sha256V2Credentials !== 2 ||
            history.legacySha256V1Credentials !== 14 ||
            value.continuityDecision !== 'new-pepper-authorized-no-active-v2-credentials' ||
            value.manualDispatchOnly !== true ||
            value.protectedEnvironmentRequired !== true ||
            value.exactSourceShaConfirmationRequired !== true ||
            value.activeV2CountConfirmationRequired !== true ||
            value.createOnlyWhenMissing !== true ||
            value.overwriteExistingCryptographicKeys !== false ||
            value.recordSecretValues !== false ||
            value.databaseChangesAllowed !== false ||
            value.edgeFunctionDeploymentsAllowed !== false ||
            value.vercelDeploymentsAllowed !== false
          ) {
            throw new Error('Player credential pepper preflight evidence is invalid.');
          }
          NODE

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1
        with:
          version: 2.109.1

      - name: Validate create-only secret command surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"
          supabase secrets list --help > "$RUNNER_TEMP/secrets-list-help.txt"
          supabase secrets set --help > "$RUNNER_TEMP/secrets-set-help.txt"
          grep -q -- "--project-ref" "$RUNNER_TEMP/secrets-list-help.txt"
          grep -q -- "--project-ref" "$RUNNER_TEMP/secrets-set-help.txt"

      - name: Provision only the missing Player credential pepper
        shell: bash
        run: |
          set -euo pipefail
          names="$RUNNER_TEMP/production-secret-names.txt"
          supabase secrets list \
            --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF" \
            > "$names"

          if grep -Eq '(^|[[:space:]])ECONOVARIA_PLAYER_CREDENTIAL_PEPPER([[:space:]]|$)' "$names"; then
            echo "Player credential pepper already exists; refusing to overwrite it."
            exit 1
          fi

          player_credential_pepper="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(64).toString("base64url"))')"
          test "${#player_credential_pepper}" -eq 86
          PLAYER_CREDENTIAL_PEPPER="$player_credential_pepper" node - <<'NODE'
          const value = process.env.PLAYER_CREDENTIAL_PEPPER || '';
          if (!/^[A-Za-z0-9_-]{86}$/.test(value) || new Set(value).size < 20) {
            throw new Error('Generated Player credential pepper failed validation.');
          }
          NODE
          echo "::add-mask::$player_credential_pepper"
          supabase secrets set \
            "ECONOVARIA_PLAYER_CREDENTIAL_PEPPER=$player_credential_pepper" \
            --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF"
          unset player_credential_pepper

          supabase secrets list \
            --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF" \
            > "$names"
          grep -Eq '(^|[[:space:]])ECONOVARIA_PLAYER_CREDENTIAL_PEPPER([[:space:]]|$)' "$names"
          rm -f "$names"

      - name: Record bounded evidence
        shell: bash
        run: |
          {
            echo '## Production Player credential pepper provisioned'
            echo "- Source ref: \`$GITHUB_REF\`"
            echo "- Exact source SHA confirmed: \`$GITHUB_SHA\`"
            echo "- Project: \`$EXPECTED_PRODUCTION_PROJECT_REF\`"
            echo '- Active v2 credentials confirmed: `0`'
            echo '- Manual dispatch only: `true`'
            echo '- Protected production environment: `true`'
            echo '- Staging denied: `true`'
            echo '- Secret scope: `ECONOVARIA_PLAYER_CREDENTIAL_PEPPER only`'
            echo '- Existing cryptographic keys overwritten: `false`'
            echo '- Secret values recorded: `false`'
            echo '- Database schema or rows changed: `false`'
            echo '- Edge Functions deployed: `false`'
            echo '- Vercel deployed: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
