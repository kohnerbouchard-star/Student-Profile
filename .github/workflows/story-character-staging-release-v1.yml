name: Story Character Staging Release V1

on:
  push:
    branches:
      - ops/story-character-staging-release-v1
    paths:
      - ".github/workflows/story-character-staging-release-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: story-character-staging-release-v1
  cancel-in-progress: false

env:
  EXPECTED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  DENIED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  SOURCE_BASE_SHA: b949ebb86c8b7c0fe2f4ff5840a1fc17e445c738
  CREATED_BY: story-character-release-v1

jobs:
  release:
    name: Rehearse and apply exact story migrations to staging
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out exact staging release candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce source and staging-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_PASSWORD"
          test "$SUPABASE_PROJECT_REF" = "$EXPECTED_STAGING_PROJECT_REF"
          test "$SUPABASE_PROJECT_REF" != "$DENIED_PRODUCTION_PROJECT_REF"
          git merge-base --is-ancestor "$SOURCE_BASE_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$SOURCE_BASE_SHA"...HEAD)
          test "${#changed[@]}" = "1"
          test "${changed[0]}" = ".github/workflows/story-character-staging-release-v1.yml"
          for path in \
            backend/supabase/migrations/20260811110000_story_character_messaging_v1.sql \
            backend/supabase/migrations/20260811111000_story_character_message_render_v1.sql \
            backend/supabase/migrations/20260811112000_northreach_character_opening_seed_v1.sql \
            backend/supabase/migrations/20260812090000_add_story_relationship_memory_v1.sql \
            backend/supabase/migrations/20260812091000_seed_remaining_country_character_openings_v1.sql \
            scripts/build-exact-migration-bundle.mjs
          do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$SOURCE_BASE_SHA:$path")"
          done

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"

      - name: Validate exact-migration tooling
        run: |
          set -euo pipefail
          node --check scripts/build-exact-migration-bundle.mjs
          node --test scripts/build-exact-migration-bundle.test.mjs

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Link protected staging project
        shell: bash
        run: |
          set -euo pipefail
          cp backend/supabase/config.next.toml backend/supabase/config.toml
          (
            cd backend
            supabase --yes link \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --password "$SUPABASE_DB_PASSWORD"
          )
          pooler_url="$(tr -d '\r\n' < backend/supabase/.temp/pooler-url)"
          case "$pooler_url" in
            "postgresql://postgres.${SUPABASE_PROJECT_REF}@"*:5432/postgres) ;;
            *) echo 'Invalid linked staging identity.' >&2; exit 1 ;;
          esac
          echo "::add-mask::$pooler_url"
          printf 'DATABASE_URL=%s\n' "$pooler_url" >> "$GITHUB_ENV"
          printf 'PGPASSWORD=%s\n' "$SUPABASE_DB_PASSWORD" >> "$GITHUB_ENV"
          printf 'PGSSLMODE=require\n' >> "$GITHUB_ENV"

      - name: Preflight story migration state
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 --no-psqlrc <<'SQL'
          do $preflight$
          declare
            v_partial integer;
          begin
            select count(*)::integer into v_partial
            from supabase_migrations.schema_migrations
            where version in (
              '20260811110000','20260811111000','20260811112000',
              '20260812090000','20260812091000'
            );
            if v_partial not between 0 and 5 then
              raise exception 'STORY_STAGING_LEDGER_PREFLIGHT_INVALID:%', v_partial;
            end if;
          end
          $preflight$;
          SQL

      - name: Rehearse, apply, and verify exact story migrations
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            backend/supabase/migrations/20260811110000_story_character_messaging_v1.sql
            backend/supabase/migrations/20260811111000_story_character_message_render_v1.sql
            backend/supabase/migrations/20260811112000_northreach_character_opening_seed_v1.sql
            backend/supabase/migrations/20260812090000_add_story_relationship_memory_v1.sql
            backend/supabase/migrations/20260812091000_seed_remaining_country_character_openings_v1.sql
          )
          : > /tmp/story-staging-release.log
          for migration in "${migrations[@]}"; do
            filename="$(basename "$migration")"
            version="${filename%%_*}"
            applied="$(psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select count(*) from supabase_migrations.schema_migrations where version = '$version'")"
            if [ "$applied" = "0" ]; then
              node scripts/build-exact-migration-bundle.mjs \
                --migration "$migration" \
                --output "/tmp/${version}-rollback.sql" \
                --mode rollback \
                --created-by "$CREATED_BY"
              psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 --no-psqlrc \
                --file "/tmp/${version}-rollback.sql" \
                2>&1 | tee -a /tmp/story-staging-release.log

              node scripts/build-exact-migration-bundle.mjs \
                --migration "$migration" \
                --output "/tmp/${version}-commit.sql" \
                --mode commit \
                --created-by "$CREATED_BY"
              psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 --no-psqlrc \
                --file "/tmp/${version}-commit.sql" \
                2>&1 | tee -a /tmp/story-staging-release.log
            elif [ "$applied" != "1" ]; then
              echo "Unexpected migration ledger count for $version: $applied" >&2
              exit 1
            fi

            node scripts/build-exact-migration-bundle.mjs \
              --migration "$migration" \
              --output "/tmp/${version}-verify.sql" \
              --mode verify \
              --created-by "$CREATED_BY"
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 --no-psqlrc \
              --file "/tmp/${version}-verify.sql" \
              2>&1 | tee -a /tmp/story-staging-release.log
          done

      - name: Run rollback-scoped story runtime acceptance
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 --no-psqlrc <<'SQL' \
            2>&1 | tee /tmp/story-staging-acceptance.log
          begin;
          do $accept$
          declare
            v_game uuid;
            v_player uuid;
            v_thread uuid;
            v_joined_at timestamptz;
            v_payload jsonb;
            v_storyline uuid;
            v_arrival_count integer;
            v_relationship_stage text;
          begin
            if to_regclass('public.player_story_relationships') is null then
              raise exception 'STORY_RELATIONSHIP_TABLE_MISSING';
            end if;
            if to_regprocedure('public.deliver_story_character_message_v1(uuid,uuid,text,text,text,text,text,boolean,text)') is null then
              raise exception 'STORY_CHARACTER_DELIVERY_FUNCTION_MISSING';
            end if;
            if to_regprocedure('public.initialize_northreach_character_opening_v1(uuid)') is null
              or to_regprocedure('public.initialize_remaining_country_character_openings_v1(uuid)') is null then
              raise exception 'STORY_COUNTRY_OPENING_FUNCTION_MISSING';
            end if;

            select g.id, p.id into v_game, v_player
            from public.game_sessions g
            join public.players p on p.game_session_id = g.id and p.status = 'active'
            where g.status = 'active'
            order by g.created_at desc, p.created_at asc
            limit 1;
            if v_game is null or v_player is null then
              raise exception 'STORY_STAGING_ACTIVE_GAME_PLAYER_FIXTURE_MISSING';
            end if;

            perform public.deliver_story_character_message_v1(
              v_game, v_player,
              'character.staging.release.v1', 'Staging Release Character',
              'relationship.staging.release.v1', 'Story staging acceptance',
              'Rollback-only story character delivery acceptance.', true,
              'story-staging-release-v1'
            );

            select t.id, mp.joined_at into v_thread, v_joined_at
            from public.message_threads t
            join public.message_thread_participants mp
              on mp.thread_id = t.id
             and mp.game_session_id = t.game_session_id
             and mp.player_id = v_player
            where t.game_session_id = v_game
              and t.story_player_id = v_player
              and t.story_conversation_key = 'relationship.staging.release.v1';

            v_payload := public.private_player_message_thread_payload_v1(
              v_game, v_player, v_thread, v_joined_at, null, 10
            );
            if v_payload ->> 'storyCharacterKey' <> 'character.staging.release.v1'
              or v_payload ->> 'storyCharacterName' <> 'Staging Release Character' then
              raise exception 'STORY_CHARACTER_RENDER_ACCEPTANCE_FAILED:%', v_payload;
            end if;

            perform public.record_player_story_relationship_memory_v1(
              v_game, v_player,
              'character.staging.release.v1', 'Staging Release Character',
              null, 'other', 'engaged', 7,
              jsonb_build_object('acceptance', true), now()
            );
            select stage into v_relationship_stage
            from public.player_story_relationships
            where game_session_id = v_game
              and player_id = v_player
              and character_key = 'character.staging.release.v1';
            if v_relationship_stage <> 'engaged' then
              raise exception 'STORY_RELATIONSHIP_ACCEPTANCE_FAILED:%', v_relationship_stage;
            end if;

            v_storyline := public.initialize_northreach_character_opening_v1(v_game);
            perform public.initialize_remaining_country_character_openings_v1(v_game);
            select count(*)::integer into v_arrival_count
            from public.storyline_events e
            where e.storyline_id = v_storyline
              and e.is_active
              and e.event_key like 'arrival_%';
            if v_arrival_count < 40 then
              raise exception 'STORY_COUNTRY_OPENING_COUNT_FAILED:%', v_arrival_count;
            end if;

            raise notice 'STORY_CHARACTER_STAGING_ACCEPTANCE_PASS game=% player=% arrivals=%',
              v_game, v_player, v_arrival_count;
          end
          $accept$;
          rollback;
          SQL
          grep -F 'STORY_CHARACTER_STAGING_ACCEPTANCE_PASS' /tmp/story-staging-acceptance.log

      - name: Verify exact story migration ledger
        shell: bash
        run: |
          set -euo pipefail
          count="$(psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select count(*) from supabase_migrations.schema_migrations where version in ('20260811110000','20260811111000','20260811112000','20260812090000','20260812091000')")"
          test "$count" = "5"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 --no-psqlrc -c "select version, name, created_by from supabase_migrations.schema_migrations where version in ('20260811110000','20260811111000','20260811112000','20260812090000','20260812091000') order by version;"

      - name: Upload staging release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-character-staging-release-${{ github.sha }}
          path: |
            /tmp/story-staging-release.log
            /tmp/story-staging-acceptance.log
            /tmp/*-verify.sql
          if-no-files-found: warn
          retention-days: 30
