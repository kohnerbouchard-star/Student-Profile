name: Business Phase 7A PR Finalizer

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/business-phase7a-pr-finalizer.yml"
      - ".github/workflows/business-phase7a-durable-finalizer.yml"

permissions:
  contents: write

concurrency:
  group: business-phase7a-pr-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 662 &&
      github.event.pull_request.head.ref == 'feat/business-store-seller-offers-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/business-store-seller-offers-v2
          fetch-depth: 0

      - name: Verify frozen implementation lineage
        shell: bash
        run: |
          set -euo pipefail
          IMPLEMENTATION_SHA="04db81436e75cea6c52d0c720508c3ea12baab05"
          git merge-base --is-ancestor "$IMPLEMENTATION_SHA" HEAD
          test -z "$(git diff --name-only "$IMPLEMENTATION_SHA" HEAD -- . \
            ':(exclude).github/workflows/business-phase7a-durable-finalizer.yml' \
            ':(exclude).github/workflows/business-phase7a-pr-finalizer.yml')"

      - name: Extract and execute durable-record transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEXTRACT'
          from pathlib import Path

          source = Path('.github/workflows/business-phase7a-durable-finalizer.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 - <<'PY'")
          end = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'PY')
          body = []
          for line in source[start + 1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/business-phase7a-finalize.py').write_text('\n'.join(body) + '\n')
          PYEXTRACT
          python3 /tmp/business-phase7a-finalize.py
          python3 - <<'PYFORMAT'
          from pathlib import Path

          implementation_sha = '04db81436e75cea6c52d0c720508c3ea12baab05'
          scope_path = Path('docs/roadmaps/business-phase7-store-seller-offers-scope-v1.md')
          scope = scope_path.read_text()
          scope = scope.replace(
              f'**Exact certified implementation SHA:** `{implementation_sha}`  \n',
              f'**Exact certified implementation SHA:** `{implementation_sha}`\n',
              1,
          )
          scope_path.write_text(scope)

          log_path = Path('docs/roadmaps/business-v2-development-execution-log-v1.md')
          log_path.write_text(log_path.read_text().rstrip() + '\n')
          PYFORMAT
          git diff --check

      - name: Commit durable records and remove temporary finalizers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "econovaria-automation"
          git config user.email "econovaria-automation@users.noreply.github.com"
          git rm \
            .github/workflows/business-phase7a-durable-finalizer.yml \
            .github/workflows/business-phase7a-pr-finalizer.yml
          git add \
            docs/roadmaps/business-phase7-store-seller-offers-scope-v1.md \
            docs/roadmaps/business-v2-development-execution-plan-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md
          git diff --cached --quiet && { echo "No durable record changes were produced." >&2; exit 1; }
          git commit -m "docs(business): certify Phase 7A seller-offer foundation"
          git push origin HEAD:feat/business-store-seller-offers-v2
