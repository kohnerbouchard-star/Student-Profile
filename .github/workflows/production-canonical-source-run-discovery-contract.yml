name: Production Canonical Source Run Discovery Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/production-canonical-source-run-discovery.yml"
      - ".github/workflows/production-canonical-source-run-discovery-contract.yml"
      - "scripts/production-canonical-source-run-discovery-contract.test.mjs"

permissions:
  contents: read

jobs:
  verify:
    name: Verify protected run discovery remains read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
      - run: node scripts/production-canonical-source-run-discovery-contract.test.mjs
      - run: git diff --check
