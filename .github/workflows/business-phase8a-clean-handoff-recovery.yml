name: Business Phase 8A Clean Handoff Recovery

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/business-phase8a-clean-handoff-recovery.yml"

permissions:
  contents: write

concurrency:
  group: business-phase8a-clean-handoff-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.pull_request.number == 663 &&
      github.event.pull_request.head.ref == 'feat/business-store-listing-inventory-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out live Phase 8A branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/business-store-listing-inventory-v2
          fetch-depth: 0

      - name: Gate exact recovery commit
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git log -1 --format=%s)" == "ops(business): restore clean Phase 8A handoff" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore certified clean tree without rewriting history
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CERTIFIED_SOURCE="c0fd8650987a332f99b8173395dcf84fc3518c15"
          CLEAN_HANDOFF="42e52c38eea7402aefadb4ec3fad0b6743a22588"
          git merge-base --is-ancestor "$CERTIFIED_SOURCE" HEAD
          git merge-base --is-ancestor "$CLEAN_HANDOFF" HEAD

          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            if git cat-file -e "$CLEAN_HANDOFF:$path" 2>/dev/null; then
              git checkout "$CLEAN_HANDOFF" -- "$path"
            else
              rm -rf -- "$path"
            fi
          done < <(git diff --name-only "$CLEAN_HANDOFF" HEAD)

          rm -f .github/workflows/business-phase8a-clean-handoff-recovery.yml
          git add -A
          git diff --cached --quiet && {
            echo "Live Phase 8A branch already matches the clean handoff tree.";
            exit 0;
          }
          git config user.name "econovaria-automation"
          git config user.email "econovaria-automation@users.noreply.github.com"
          git commit -m "chore(business): restore clean Phase 8A handoff"
          test -z "$(git diff --name-only "$CLEAN_HANDOFF" HEAD)"
          git push origin HEAD:feat/business-store-listing-inventory-v2
