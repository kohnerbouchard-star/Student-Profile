name: Phase 12 market negative-probe repair

on:
  push:
    branches:
      - feat/player-business-workspace-v2
    paths:
      - ".github/workflows/phase12-market-negative-probe-repair.yml"

permissions:
  contents: write

concurrency:
  group: phase12-market-negative-probe-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: Repair and verify market negative probes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v7
        with:
          ref: feat/player-business-workspace-v2
          fetch-depth: 0

      - name: Patch idempotency-consistent negative probes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/business-banking-player-market-browser-acceptance.core.mjs")
          source = path.read_text(encoding="utf-8")

          helper_anchor = '''async function preservedSubmitValue(locator) {
            const preserved = await locator.getAttribute("data-player-market-submit-value");
            return preserved === null ? locator.inputValue() : preserved;
          }

          async function authenticatedContextRequest'''
          helper_replacement = '''async function preservedSubmitValue(locator) {
            const preserved = await locator.getAttribute("data-player-market-submit-value");
            return preserved === null ? locator.inputValue() : preserved;
          }

          function withIdempotencyHeader(headers, idempotencyKey) {
            const next = Object.fromEntries(
              Object.entries(headers || {}).filter(([name]) => name.toLowerCase() !== "idempotency-key"),
            );
            next["idempotency-key"] = idempotencyKey;
            return next;
          }

          async function authenticatedContextRequest'''

          stale_anchor = '''  const stale = await authenticatedContextRequest(page, quotePath, {
            method: "POST",
            headers: buy.quoteOriginal.headers,
            body: {
              ...quoteBody,
              expectedPrice: Number(quoteBody.expectedPrice) + 1,
              idempotencyKey: `${quoteBody.idempotencyKey}-stale`,
            },
          });'''
          stale_replacement = '''  const staleIdempotencyKey = `${quoteBody.idempotencyKey}-stale`;
          const stale = await authenticatedContextRequest(page, quotePath, {
            method: "POST",
            headers: withIdempotencyHeader(buy.quoteOriginal.headers, staleIdempotencyKey),
            body: {
              ...quoteBody,
              expectedPrice: Number(quoteBody.expectedPrice) + 1,
              idempotencyKey: staleIdempotencyKey,
            },
          });'''

          forbidden_anchor = '''  const forbidden = await authenticatedContextRequest(page, quotePath, {
            method: "POST",
            headers: buy.quoteOriginal.headers,
            body: {
              ...quoteBody,
              playerId: "attacker-controlled",
              idempotencyKey: `${quoteBody.idempotencyKey}-scope`,
            },
          });'''
          forbidden_replacement = '''  const forbiddenIdempotencyKey = `${quoteBody.idempotencyKey}-scope`;
          const forbidden = await authenticatedContextRequest(page, quotePath, {
            method: "POST",
            headers: withIdempotencyHeader(buy.quoteOriginal.headers, forbiddenIdempotencyKey),
            body: {
              ...quoteBody,
              playerId: "attacker-controlled",
              idempotencyKey: forbiddenIdempotencyKey,
            },
          });'''

          replacements = [
              (helper_anchor, helper_replacement, "header helper"),
              (stale_anchor, stale_replacement, "stale-price probe"),
              (forbidden_anchor, forbidden_replacement, "ownership-scope probe"),
          ]
          for before, after, label in replacements:
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact source match, found {count}")
              source = source.replace(before, after, 1)

          path.write_text(source, encoding="utf-8")
          PY

          rm .github/workflows/phase12-market-negative-probe-repair.yml

      - name: Verify bounded repair
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/business-banking-player-market-browser-acceptance.core.mjs
          grep -F 'withIdempotencyHeader(buy.quoteOriginal.headers, staleIdempotencyKey)' scripts/business-banking-player-market-browser-acceptance.core.mjs
          grep -F 'withIdempotencyHeader(buy.quoteOriginal.headers, forbiddenIdempotencyKey)' scripts/business-banking-player-market-browser-acceptance.core.mjs
          git diff --check

      - name: Commit permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(player): reach intended market rejection boundaries"
          git push origin HEAD:feat/player-business-workspace-v2
