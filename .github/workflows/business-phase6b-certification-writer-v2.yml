name: Business Phase 6B Certification Writer V2

on:
  pull_request:
    paths:
      - ".github/workflows/business-phase6b-certification-writer-v2.yml"

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Phase 6 branch
        uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0
      - name: Resolve tested implementation source
        id: source
        shell: bash
        run: |
          source_sha=$(git rev-list -1 HEAD -- \
            backend/supabase/migrations/20260823110200_business_manufacturing_resource_holds_v2.sql \
            scripts/business-phase6-manufacturing-resource-hold-contract.mjs \
            scripts/business-phase6-manufacturing-resource-hold-simulation.mjs \
            .github/workflows/business-timed-manufacturing-resource-hold-v2.yml \
            docs/operations/contracts/player-cross-cutting-verification-authority-v1.json)
          test -n "$source_sha"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Require exact-source workflow evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import time

          repository = os.environ["REPOSITORY"]
          source_sha = os.environ["SOURCE_SHA"]
          required = [
              "Business Timed Manufacturing Resource Hold V2",
              "Business Timed Manufacturing V2",
              "Database Replay",
              "Backend Typecheck",
              "Player Terminal Verify",
              "Business Banking Runtime",
              "Business Economy V2",
              "Business Workforce Production Payroll V2",
              "Repository Quality",
              "Supply Chain Security",
              "Admin API Check",
              "Staging Readiness Preflight",
              "Required Game Market Timezone",
              "Exchange Calendar Runtime",
          ]

          selected = {}
          for _ in range(90):
              raw = subprocess.check_output(
                  ["gh", "api", f"repos/{repository}/actions/runs?head_sha={source_sha}&per_page=100"],
                  text=True,
              )
              runs = json.loads(raw).get("workflow_runs", [])
              selected = {}
              for run in sorted(runs, key=lambda row: int(row["id"]), reverse=True):
                  name = run.get("name")
                  if name in required and name not in selected:
                      selected[name] = run
              if all(name in selected for name in required) and all(
                  selected[name].get("status") == "completed" for name in required
              ):
                  break
              time.sleep(10)
          else:
              raise SystemExit("Timed out waiting for exact-source Phase 6B workflows.")

          failures = {
              name: selected[name].get("conclusion")
              for name in required
              if selected[name].get("conclusion") != "success"
          }
          if failures:
              raise SystemExit(f"Phase 6B exact-source workflow failure: {failures}")

          evidence = "\n".join(
              f"- **{name} — PASS** (`{selected[name]['id']}`)."
              for name in required
          )
          with open("/tmp/phase6b-run-evidence.md", "w", encoding="utf-8") as handle:
              handle.write(evidence + "\n")
          PY
      - name: Write durable Phase 6B checkpoint
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          source_sha = os.environ["SOURCE_SHA"]
          evidence = Path("/tmp/phase6b-run-evidence.md").read_text(encoding="utf-8").rstrip()

          log_path = Path("docs/roadmaps/business-v2-development-execution-log-v1.md")
          log = log_path.read_text(encoding="utf-8")
          marker = "Phase 6B COMPLETE: atomic manufacturing start and resource hold"
          if marker not in log:
              fragment = Path("docs/roadmaps/.business-phase6b-certification-fragment.md").read_text(encoding="utf-8")
              fragment = fragment.replace("__IMPLEMENTATION_SHA__", source_sha)
              fragment = fragment.replace("__RUN_EVIDENCE__", evidence)
              log_path.write_text(log.rstrip() + "\n" + fragment, encoding="utf-8")

          scope_path = Path("docs/roadmaps/business-phase6-timed-manufacturing-scope-v1.md")
          scope = scope_path.read_text(encoding="utf-8")
          scope = re.sub(
              r"\*\*Status:\*\* .*?  \n",
              "**Status:** IN PROGRESS — checkpoints 6A and 6B certified; completion and recovery remain open  \n",
              scope,
              count=1,
          )
          checkpoint = f"""## Phase 6B certified resource hold\n\n**Exact certified implementation and verification source:** `{source_sha}`.\n\nThe service-owned queue transaction now:\n\n- resolves one exact Business-owned canonical recipe and output;\n- derives manufacturing duration server-side;\n- moves exact BOM quantities from canonical Warehouse inventory into Work in Progress;\n- reserves eligible employee minutes in deterministic public-key order;\n- reserves installed equipment minutes in deterministic installation-key order;\n- links immutable material, labor, and equipment evidence to one queued job;\n- rolls the whole transaction back when any prerequisite fails;\n- replays matching idempotency without moving or reserving twice; and\n- leaves the live Player instant-production route unchanged until completion and recovery are certified.\n\n"""
          if "## Phase 6B certified resource hold" not in scope:
              scope = scope.replace("## Locked lifecycle\n", checkpoint + "## Locked lifecycle\n")
          scope = re.sub(
              r"## Next authorized checkpoint\n\n.*\Z",
              "## Next authorized checkpoint\n\n"
              "**Phase 6C — exact-once completion settlement is OPEN.** Implement a lease-validated service-owned completion transaction that consumes exact WIP, posts the canonical output into Finished Goods with material plus labor cost basis, consumes labor/equipment reservations exactly once, and marks the job complete only after every settlement commits. Do not add Player cutover, cancellation, Store sales, or deployment in the same checkpoint.\n",
              scope,
              flags=re.S,
          )
          scope_path.write_text(scope, encoding="utf-8")

          plan_path = Path("docs/roadmaps/business-v2-development-execution-plan-v1.md")
          plan = plan_path.read_text(encoding="utf-8")
          phase6 = f"""## Phase 6 — Timed manufacturing\n\n**Status:** IN PROGRESS — checkpoints 6A and 6B certified\n\n- [x] Add server-owned manufacturing-job lifecycle, timing, transition evidence, and bounded due-job leases.\n- [ ] Replace legacy instant physical production with the authenticated V2 manufacturing route.\n- [x] Validate exact canonical recipe/material/labor/equipment prerequisites in the trusted start transaction.\n- [x] Atomically move exact BOM materials from Warehouse into Work in Progress.\n- [x] Reserve labor and installed-equipment capacity across the queued/running job lifecycle.\n- [x] Calculate server-owned manufacturing duration and completion time.\n- [ ] Complete due jobs through the bounded shared worker, never a client timer.\n- [ ] Consume WIP and post the exact catalog output into Finished Goods.\n- [ ] Consume or release labor/equipment capacity exactly once at terminal settlement.\n- [ ] Add cancellation/failure recovery and replay protection.\n\nCertified checkpoints:\n\n- **6A:** server-owned manufacturing lifecycle, duration authority, deterministic queue start, due-job leases, retry release, append-only transitions, and public-key-only job read; exact-head verification source `0589e8015736a8b770622be6ad0e5abedda24c26`.\n- **6B:** exact canonical recipe/output resolution; atomic Warehouse -> WIP material movement; deterministic finite labor/equipment reservations; immutable job hold links; whole-transaction rollback; and idempotent queued-job creation; certified source `{source_sha}`.\n\nExit: one end-to-end manufactured catalog item reliably reaches Finished Goods after authoritative server time. **NOT YET MET.**\n\n"""
          updated, count = re.subn(
              r"## Phase 6 — Timed manufacturing\n.*?(?=## Phase 7 — Store seller offers and multi-offer catalog presentation)",
              phase6,
              plan,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("Unable to update Phase 6 execution-plan section.")
          plan_path.write_text(updated, encoding="utf-8")
          PY
      - name: Update draft PR record
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          source_sha = os.environ["SOURCE_SHA"]
          body = f"""## Scope

Phase 6 replaces instant physical Business production with an authoritative server-timed manufacturing lifecycle. This draft PR is stacked on certified Phase 5 branch `feat/business-equipment-capacity-v2`.

- Certified Phase 5 implementation: `6f936abd61c6cd903f6e839790ceab24ed570748`.
- Phase 5 durable certification head: `614be4f7d4eee2848e2c6140b643893fbac23834`.
- Phase 6A exact-head source: `0589e8015736a8b770622be6ad0e5abedda24c26`.
- **Phase 6B certified source: `{source_sha}`.**

This PR remains **draft, open, unmerged, and undeployed**.

## Certified checkpoints

**6A — lifecycle and worker foundation:** server-derived duration, bounded job states, append-only transitions, deterministic queue start, exclusive due-job leases, retry backoff, and public-key-only job reads.

**6B — atomic resource hold:** exact canonical recipe/output validation; Warehouse-to-WIP BOM movement; deterministic finite labor and installed-equipment reservation; immutable hold links; whole-transaction rollback; and idempotent queued-job creation.

All exact-source workflows required by the Phase 6B scope passed and are recorded in the durable execution log.

## Remaining Phase 6 work

- exact-once due-job completion into Finished Goods;
- material-plus-labor cost-basis settlement;
- exact-once labor/equipment consumption;
- cancellation and terminal-failure resource recovery;
- operating-period rollover safety;
- authenticated Player API/UI cutover and explicit instant-production retirement.

Store seller offers, sales convergence, durability/repair settlement, equity/IPO, merge, staging, production deployment, and live data mutation remain outside this PR.
"""
          Path("/tmp/phase6-pr-body.md").write_text(body, encoding="utf-8")
          PY
          gh pr edit 661 --repo "$REPOSITORY" --body-file /tmp/phase6-pr-body.md
      - name: Commit certification and remove one-shot files
        shell: bash
        run: |
          rm -f .github/workflows/business-phase6b-certification-writer.yml
          rm -f .github/workflows/business-phase6b-certification-writer-v2.yml
          rm -f docs/roadmaps/.business-phase6b-certification-fragment.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/roadmaps/business-v2-development-execution-log-v1.md \
            docs/roadmaps/business-v2-development-execution-plan-v1.md \
            docs/roadmaps/business-phase6-timed-manufacturing-scope-v1.md \
            .github/workflows/business-phase6b-certification-writer.yml \
            .github/workflows/business-phase6b-certification-writer-v2.yml \
            docs/roadmaps/.business-phase6b-certification-fragment.md
          git commit -m "docs(business): certify Phase 6B resource hold"
          git push origin HEAD:feat/business-timed-manufacturing-v2
