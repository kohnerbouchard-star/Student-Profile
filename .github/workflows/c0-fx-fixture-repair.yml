name: C0 FX fixture repair

on:
  push:
    branches:
      - feat/multicurrency-funding-core-v1
    paths:
      - .github/workflows/c0-fx-fixture-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact repair controller head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Guard source head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/multicurrency-funding-core-v1"
          test "$(git rev-parse HEAD^)" = "486a1209c02261f4952248472c85399b2c551a60"

      - name: Stabilize the retained FX bootstrap fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/multicurrency-funding-database.mjs')
          text = path.read_text()

          old_snapshot = "      clock_timestamp() - interval '2 minutes',"
          old_created = "      clock_timestamp() - interval '3 minutes'"
          if text.count(old_snapshot) < 1 or text.count(old_created) < 1:
              raise SystemExit('C0 snapshot timestamp markers missing')
          text = text.replace(
              old_snapshot,
              "      statement_timestamp() - interval '2 minutes',",
              1,
          )
          text = text.replace(
              old_created,
              "      statement_timestamp() - interval '3 minutes'",
              1,
          )

          old_bootstrap = '''    select public.initialize_fx_authority_for_game_v1(
                ${sqlLiteral(game.id)}::uuid,
                clock_timestamp() - interval '1 minute',
                true
              )::text;
            `);

            const state = runJson(`
          '''
          new_bootstrap = '''  `);

            const bootstrap = runJson(`
              select public.initialize_fx_authority_for_game_v1(
                ${sqlLiteral(game.id)}::uuid,
                statement_timestamp() - interval '1 minute',
                true
              )::text;
            `);
            assert.equal(
              bootstrap.cutoverStatus,
              "ready",
              `FX bootstrap did not become ready: ${JSON.stringify(bootstrap)}`,
            );

            const state = runJson(`
          '''
          if old_bootstrap not in text:
              raise SystemExit('C0 initializer marker missing')
          text = text.replace(old_bootstrap, new_bootstrap, 1)
          path.write_text(text)
          PY

          test "$(git diff --name-only)" = "scripts/multicurrency-funding-database.mjs"
          git diff --check
          node --check scripts/multicurrency-funding-database.mjs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install pinned tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          npm ci --ignore-scripts

      - name: Start disposable Postgres service
        shell: bash
        run: |
          set -euo pipefail
          EXCLUDED="studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,gotrue,postgrest,realtime,kong,mailpit,postgres-meta"
          npx supabase start --workdir backend --exclude "$EXCLUDED"

      - name: Verify repaired C0 database and observed races
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          npx supabase db reset --workdir backend --local
          npx supabase db reset --workdir backend --local
          node scripts/banking-fx-database-acceptance.mjs
          node scripts/multicurrency-funding-database.mjs
          npx supabase db reset --workdir backend --local
          node scripts/multicurrency-funding-concurrency.mjs
          npx supabase db lint --workdir backend --local --level warning

      - name: Commit and push verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/multicurrency-funding-database.mjs
          git commit -m "test(funding): stabilize FX bootstrap fixture"
          git push origin HEAD:feat/multicurrency-funding-core-v1

      - name: Stop disposable stack
        if: always()
        run: npx supabase stop --workdir backend --no-backup || true
