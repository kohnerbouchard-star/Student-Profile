name: Admin Password Recovery Release

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/admin-password-recovery-release.yml"
      - "auth/recovery-start.html"
      - "auth/recovery-start.js"
      - "auth/reset-password.html"
      - "auth/reset-password.js"
      - "docs/operations/release-requests/admin-password-recovery-release-v1.json"
      - "scripts/password-recovery-frontend-contract.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/admin-password-recovery-release.yml"
      - "auth/recovery-start.html"
      - "auth/recovery-start.js"
      - "auth/reset-password.html"
      - "auth/reset-password.js"
      - "docs/operations/release-requests/admin-password-recovery-release-v1.json"
      - "scripts/password-recovery-frontend-contract.test.mjs"

permissions:
  contents: read
  actions: read

concurrency:
  group: admin-password-recovery-release
  cancel-in-progress: false

env:
  REQUEST_PATH: docs/operations/release-requests/admin-password-recovery-release-v1.json
  EXPECTED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  PRODUCTION_ORIGIN: https://econovaria.vercel.app
  PRODUCTION_RECOVERY_URL: https://econovaria.vercel.app/auth/recovery-start.html
  PRODUCTION_RESET_URL: https://econovaria.vercel.app/auth/reset-password.html

jobs:
  validate:
    name: Validate browser recovery artifact and authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_commit: ${{ steps.identity.outputs.source_commit }}
      frontend_sha256: ${{ steps.identity.outputs.frontend_sha256 }}
      request_id: ${{ steps.identity.outputs.request_id }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact release request and frontend identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          frontend_sha256="$(sha256sum \
            auth/recovery-start.html \
            auth/recovery-start.js \
            auth/reset-password.html \
            auth/reset-password.js | sha256sum | awk '{print $1}')"
          node - <<'NODE'
          const fs = require('node:fs');
          const request = JSON.parse(fs.readFileSync(process.env.REQUEST_PATH, 'utf8'));
          const expected = {
            schemaVersion: 2,
            state: 'approved',
            sourceMode: 'trigger_commit',
            sourceRef: 'refs/heads/main',
            productionProjectRef: process.env.EXPECTED_PRODUCTION_PROJECT_REF,
            productionOrigin: process.env.PRODUCTION_ORIGIN,
            productionRecoveryUrl: process.env.PRODUCTION_RECOVERY_URL,
            productionResetUrl: process.env.PRODUCTION_RESET_URL,
            productionEnvironmentApprovalRequired: true,
            databaseChangesAllowed: false,
            edgeFunctionDeploymentsAllowed: false,
            realAdministratorCredentialsAllowed: false,
            recoveryEmailSendAllowed: false,
          };
          for (const [key, value] of Object.entries(expected)) {
            if (request[key] !== value) throw new Error(`Recovery release request mismatch: ${key}`);
          }
          const mutations = [
            'verify the browser-rendered recovery confirmation page is live',
            'set production Auth Site URL',
            'add the production recovery and reset pages to the Auth redirect allow list',
            'replace the recovery email ConfirmationURL with the Vercel TokenHash confirmation link',
          ];
          if (JSON.stringify(request.allowedProductionMutations) !== JSON.stringify(mutations)) {
            throw new Error('Recovery release mutation scope mismatch.');
          }
          if (!/^[a-z0-9][a-z0-9._-]{7,127}$/u.test(String(request.requestId || ''))) {
            throw new Error('Recovery release request ID is invalid.');
          }
          NODE
          request_id="$(node -p "require('./$REQUEST_PATH').requestId")"
          {
            echo "source_commit=$source_commit"
            echo "frontend_sha256=$frontend_sha256"
            echo "request_id=$request_id"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install repository tooling
        run: npm ci

      - name: Test scanner-safe browser recovery
        run: node --test scripts/password-recovery-frontend-contract.test.mjs

      - name: Scan committed source for credentials
        run: npm run security:secrets

  reconcile-production:
    name: Approve and reconcile production recovery
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Enforce protected production boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$EXPECTED_PRODUCTION_PROJECT_REF" = "cgiukdjwicykrmtkhudh"
          test "$PRODUCTION_ORIGIN" = "https://econovaria.vercel.app"
          test "$PRODUCTION_RECOVERY_URL" = "https://econovaria.vercel.app/auth/recovery-start.html"
          test "$PRODUCTION_RESET_URL" = "https://econovaria.vercel.app/auth/reset-password.html"
          [[ "${{ needs.validate.outputs.source_commit }}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${{ needs.validate.outputs.frontend_sha256 }}" =~ ^[a-f0-9]{64}$ ]]

      - name: Check out exact authorized source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact frontend identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.validate.outputs.source_commit }}"
          actual="$(sha256sum \
            auth/recovery-start.html \
            auth/recovery-start.js \
            auth/reset-password.html \
            auth/reset-password.js | sha256sum | awk '{print $1}')"
          test "$actual" = "${{ needs.validate.outputs.frontend_sha256 }}"

      - name: Wait for browser-rendered recovery page deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            status="$(curl --silent --show-error \
              --header 'Cache-Control: no-cache' \
              --dump-header "$RUNNER_TEMP/recovery-headers.txt" \
              --output "$RUNNER_TEMP/recovery.html" \
              --write-out '%{http_code}' \
              "$PRODUCTION_RECOVERY_URL?deployment_probe=$GITHUB_SHA" || true)"
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' "$RUNNER_TEMP/recovery-headers.txt")"
            if [[ "$status" == "200" ]] \
              && [[ "$content_type" == text/html* ]] \
              && grep -q 'id="continueRecovery"' "$RUNNER_TEMP/recovery.html" \
              && grep -q 'src="./recovery-start.js"' "$RUNNER_TEMP/recovery.html"; then
              break
            fi
            if [[ "$attempt" == "180" ]]; then
              cat "$RUNNER_TEMP/recovery-headers.txt" >&2 || true
              cat "$RUNNER_TEMP/recovery.html" >&2 || true
              exit 1
            fi
            sleep 5
          done
          script_status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/recovery-start.js" \
            --write-out '%{http_code}' \
            "$PRODUCTION_ORIGIN/auth/recovery-start.js?deployment_probe=$GITHUB_SHA")"
          test "$script_status" = "200"
          grep -q '/auth/v1/verify' "$RUNNER_TEMP/recovery-start.js"
          ! grep -q 'functions/v1/admin-password-recovery' "$RUNNER_TEMP/recovery-start.js"
          reset_status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/reset.html" \
            --write-out '%{http_code}' \
            "$PRODUCTION_RESET_URL?deployment_probe=$GITHUB_SHA")"
          test "$reset_status" = "200"
          grep -q 'Set a new password' "$RUNNER_TEMP/reset.html"

      - name: Build bounded production Auth patch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/config/auth" \
            > "$RUNNER_TEMP/auth-before.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const current = JSON.parse(fs.readFileSync(process.env.AUTH_BEFORE_PATH, 'utf8'));
          const raw = current.uri_allow_list;
          const redirects = Array.isArray(raw)
            ? raw.map(String)
            : String(raw || '').split(',').map((value) => value.trim()).filter(Boolean);
          redirects.push(process.env.PRODUCTION_RECOVERY_URL, process.env.PRODUCTION_RESET_URL);
          const uniqueRedirects = [...new Set(redirects)];
          const template = [
            '<h2>Reset your Econovaria administrator password</h2>',
            '<p>We received a request to reset your administrator password.</p>',
            `<p><a href="${process.env.PRODUCTION_RECOVERY_URL}?token_hash={{ .TokenHash }}&type=recovery" rel="noreferrer">Continue password recovery</a></p>`,
            '<p>The link opens a confirmation page and is not consumed until you press Continue.</p>',
            '<p>If you did not request this, you can safely ignore this email.</p>',
          ].join('');
          if (template.includes('{{ .ConfirmationURL }}')) throw new Error('Direct recovery ConfirmationURL is prohibited.');
          if (template.includes('.supabase.co/functions/v1/')) throw new Error('Supabase Edge HTML recovery links are prohibited.');
          fs.writeFileSync(process.env.AUTH_PATCH_PATH, JSON.stringify({
            site_url: process.env.PRODUCTION_ORIGIN,
            uri_allow_list: uniqueRedirects.join(','),
            mailer_subjects_recovery: 'Reset your Econovaria administrator password',
            mailer_templates_recovery_content: template,
          }));
          NODE
        env:
          AUTH_BEFORE_PATH: ${{ runner.temp }}/auth-before.json
          AUTH_PATCH_PATH: ${{ runner.temp }}/auth-patch.json

      - name: Apply production Auth recovery configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$AUTH_PATCH_PATH" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/config/auth" \
            > "$RUNNER_TEMP/auth-result.json"
        env:
          AUTH_PATCH_PATH: ${{ runner.temp }}/auth-patch.json

      - name: Verify exact production recovery configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/config/auth" \
            > "$RUNNER_TEMP/auth-after.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync(process.env.AUTH_AFTER_PATH, 'utf8'));
          const raw = config.uri_allow_list;
          const redirects = Array.isArray(raw)
            ? raw.map(String)
            : String(raw || '').split(',').map((value) => value.trim()).filter(Boolean);
          const template = String(config.mailer_templates_recovery_content || '');
          const expectedLink = `${process.env.PRODUCTION_RECOVERY_URL}?token_hash={{ .TokenHash }}&type=recovery`;
          if (config.site_url !== process.env.PRODUCTION_ORIGIN) throw new Error('Production Site URL mismatch.');
          if (!redirects.includes(process.env.PRODUCTION_RECOVERY_URL)) throw new Error('Recovery page is not allow-listed.');
          if (!redirects.includes(process.env.PRODUCTION_RESET_URL)) throw new Error('Reset page is not allow-listed.');
          if (!template.includes(expectedLink)) throw new Error('Browser recovery template mismatch.');
          if (template.includes('{{ .ConfirmationURL }}')) throw new Error('Direct recovery ConfirmationURL remains configured.');
          if (template.includes('.supabase.co/functions/v1/')) throw new Error('Supabase Edge HTML recovery link remains configured.');
          NODE
        env:
          AUTH_AFTER_PATH: ${{ runner.temp }}/auth-after.json
