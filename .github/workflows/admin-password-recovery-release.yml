name: Admin Password Recovery Release

on:
  pull_request:
    branches: [main]
    paths: &recovery-paths
      - ".github/workflows/admin-password-recovery-release.yml"
      - "auth/recovery-start.*"
      - "auth/reset-password.*"
      - "scripts/staging-auth-recovery-release*.mjs"
      - "scripts/password-recovery-frontend-contract.test.mjs"
      - "scripts/build-supabase-auth-email-config.mjs"
      - "backend/supabase/auth-email-template-manifest.json"
      - "backend/supabase/auth-email-templates/**"
      - "docs/operations/release-requests/admin-password-recovery-release-v1.json"
  push:
    branches: [main]
    paths: *recovery-paths
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Exact current main SHA reviewed for staging"
        required: true
        type: string
      confirm_project_ref:
        description: "Type eecvbssdvarfcykcfrny (staging only)"
        required: true
        type: string
      confirm_action:
        description: "Type RECONCILE STAGING RECOVERY after separate staging approval"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: admin-password-recovery-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate browser recovery and release boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - run: node --test scripts/password-recovery-frontend-contract.test.mjs scripts/staging-auth-recovery-release.test.mjs
      - run: npm run security:secrets

  reconcile-staging:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_project_ref == 'eecvbssdvarfcykcfrny' && inputs.confirm_action == 'RECONCILE STAGING RECOVERY'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
      - name: Reconcile only explicitly approved staging recovery settings
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
          CONFIRM_ACTION: ${{ inputs.confirm_action }}
          STAGING_ORIGIN: ${{ vars.ECONOVARIA_STAGING_ORIGIN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/staging-auth-recovery-release.mjs
