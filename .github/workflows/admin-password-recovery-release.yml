name: Admin Password Recovery Release

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/admin-password-recovery-release.yml"
      - "backend/supabase/functions/admin-password-recovery/**"
      - "backend/supabase/config.toml"
      - "docs/operations/release-requests/admin-password-recovery-release-v1.json"
      - "scripts/admin-password-recovery-contract.test.mjs"
  push:
    branches: [main]
    paths:
      - "docs/operations/release-requests/admin-password-recovery-release-v1.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: admin-password-recovery-release
  cancel-in-progress: false

env:
  REQUEST_PATH: docs/operations/release-requests/admin-password-recovery-release-v1.json
  FUNCTION_NAME: admin-password-recovery
  FUNCTION_SOURCE: backend/supabase/functions/admin-password-recovery/index.ts
  EXPECTED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  EXPECTED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  PRODUCTION_ORIGIN: https://econovaria.vercel.app
  PRODUCTION_RESET_URL: https://econovaria.vercel.app/auth/reset-password.html
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  validate:
    name: Validate recovery artifact and authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_commit: ${{ steps.identity.outputs.source_commit }}
      source_sha256: ${{ steps.identity.outputs.source_sha256 }}
      request_id: ${{ steps.identity.outputs.request_id }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact release request
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          source_sha256="$(sha256sum "$FUNCTION_SOURCE" | awk '{print $1}')"
          SOURCE_COMMIT="$source_commit" SOURCE_SHA256="$source_sha256" node - <<'NODE'
          const fs = require('node:fs');
          const request = JSON.parse(fs.readFileSync(process.env.REQUEST_PATH, 'utf8'));
          const expected = {
            schemaVersion: 1,
            state: 'approved',
            sourceMode: 'trigger_commit',
            sourceRef: 'refs/heads/main',
            functionName: process.env.FUNCTION_NAME,
            verifyJwt: false,
            stagingProjectRef: process.env.EXPECTED_STAGING_PROJECT_REF,
            productionProjectRef: process.env.EXPECTED_PRODUCTION_PROJECT_REF,
            productionOrigin: process.env.PRODUCTION_ORIGIN,
            productionResetUrl: process.env.PRODUCTION_RESET_URL,
            productionEnvironmentApprovalRequired: true,
            databaseChangesAllowed: false,
            realAdministratorCredentialsAllowed: false,
            recoveryEmailSendAllowed: false,
          };
          for (const [key, value] of Object.entries(expected)) {
            if (request[key] !== value) throw new Error(`Recovery release request mismatch: ${key}`);
          }
          const mutations = [
            'deploy exact staging-verified admin-password-recovery Edge Function',
            'set production Auth Site URL',
            'add the production reset page to the Auth redirect allow list',
            'replace the recovery email ConfirmationURL with a scanner-safe TokenHash link',
          ];
          if (JSON.stringify(request.allowedProductionMutations) !== JSON.stringify(mutations)) {
            throw new Error('Recovery release mutation scope mismatch.');
          }
          if (!/^[a-z0-9][a-z0-9._-]{7,127}$/u.test(String(request.requestId || ''))) {
            throw new Error('Recovery release request ID is invalid.');
          }
          NODE
          request_id="$(node -p "require('./$REQUEST_PATH').requestId")"
          {
            echo "source_commit=$source_commit"
            echo "source_sha256=$source_sha256"
            echo "request_id=$request_id"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install repository tooling
        run: npm ci

      - name: Run recovery security contract
        run: node --test scripts/admin-password-recovery-contract.test.mjs

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.10

      - name: Type-check recovery function
        run: deno check "$FUNCTION_SOURCE"

      - name: Scan committed source for credentials
        run: npm run security:secrets

  deploy-staging:
    name: Deploy and verify staging recovery
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    outputs:
      candidate_digest: ${{ steps.metadata.outputs.candidate_digest }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Enforce staging boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$EXPECTED_STAGING_PROJECT_REF" != "$EXPECTED_PRODUCTION_PROJECT_REF"
          [[ "${{ needs.validate.outputs.source_commit }}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${{ needs.validate.outputs.source_sha256 }}" =~ ^[a-f0-9]{64}$ ]]

      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.validate.outputs.source_commit }}"
          test "$(sha256sum "$FUNCTION_SOURCE" | awk '{print $1}')" = "${{ needs.validate.outputs.source_sha256 }}"

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Deploy exact function to staging
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"
          supabase functions deploy "$FUNCTION_NAME" \
            --workdir backend \
            --project-ref "$EXPECTED_STAGING_PROJECT_REF" \
            --no-verify-jwt \
            --use-api

      - name: Verify scanner-safe staging behavior
        shell: bash
        run: |
          set -euo pipefail
          base="https://${EXPECTED_STAGING_PROJECT_REF}.supabase.co/functions/v1/${FUNCTION_NAME}"
          fake_token="abcdefghijklmnopqrstuvwxyzABCDEFGH0123456789_-abcdefghij"
          for attempt in $(seq 1 18); do
            status="$(curl --silent --show-error --output "$RUNNER_TEMP/invalid.html" --write-out '%{http_code}' "$base" || true)"
            if [[ "$status" == "400" ]]; then break; fi
            if [[ "$attempt" == "18" ]]; then cat "$RUNNER_TEMP/invalid.html" >&2 || true; exit 1; fi
            sleep 5
          done
          status="$(curl --silent --show-error \
            --cookie-jar "$RUNNER_TEMP/cookies.txt" \
            --output "$RUNNER_TEMP/confirm.html" \
            --write-out '%{http_code}' \
            "$base?token_hash=$fake_token&type=recovery")"
          test "$status" = "200"
          grep -q 'Continue to Password Reset' "$RUNNER_TEMP/confirm.html"
          grep -q 'method="post"' "$RUNNER_TEMP/confirm.html"
          ! grep -q '/auth/v1/verify' "$RUNNER_TEMP/confirm.html"
          challenge="$(sed -n 's/.*name="challenge" value="\([A-Za-z0-9_-]*\)".*/\1/p' "$RUNNER_TEMP/confirm.html")"
          [[ "$challenge" =~ ^[A-Za-z0-9_-]{43}$ ]]
          cross_status="$(curl --silent --show-error \
            --cookie "$RUNNER_TEMP/cookies.txt" \
            --output "$RUNNER_TEMP/cross.html" \
            --write-out '%{http_code}' \
            --request POST "$base" \
            --header 'Origin: https://attacker.invalid' \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "token_hash=$fake_token" \
            --data-urlencode 'type=recovery' \
            --data-urlencode "challenge=$challenge")"
          test "$cross_status" = "403"
          curl --silent --show-error \
            --cookie-jar "$RUNNER_TEMP/cookies.txt" \
            --output "$RUNNER_TEMP/confirm.html" \
            "$base?token_hash=$fake_token&type=recovery"
          challenge="$(sed -n 's/.*name="challenge" value="\([A-Za-z0-9_-]*\)".*/\1/p' "$RUNNER_TEMP/confirm.html")"
          same_status="$(curl --silent --show-error \
            --cookie "$RUNNER_TEMP/cookies.txt" \
            --output "$RUNNER_TEMP/used.html" \
            --write-out '%{http_code}' \
            --request POST "$base" \
            --header "Origin: https://${EXPECTED_STAGING_PROJECT_REF}.supabase.co" \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "token_hash=$fake_token" \
            --data-urlencode 'type=recovery' \
            --data-urlencode "challenge=$challenge")"
          test "$same_status" = "400"
          grep -q 'invalid, expired, or already used' "$RUNNER_TEMP/used.html"

      - name: Record staging bundle identity
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/functions.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync(process.env.FUNCTIONS_PATH, 'utf8'));
          const row = rows.find((value) => value.slug === process.env.FUNCTION_NAME);
          const digest = String(row?.ezbr_sha256 || '');
          if (!/^[a-f0-9]{64}$/u.test(digest) || row?.verify_jwt !== false || row?.status !== 'ACTIVE') {
            throw new Error('Staging recovery function metadata is invalid.');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `candidate_digest=${digest}\n`);
          NODE
        env:
          FUNCTIONS_PATH: ${{ runner.temp }}/functions.json

  deploy-production:
    name: Approve, deploy, and configure production recovery
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, deploy-staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Enforce protected production boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$EXPECTED_PRODUCTION_PROJECT_REF" = "cgiukdjwicykrmtkhudh"
          test "$PRODUCTION_ORIGIN" = "https://econovaria.vercel.app"
          test "$PRODUCTION_RESET_URL" = "https://econovaria.vercel.app/auth/reset-password.html"
          [[ "${{ needs.deploy-staging.outputs.candidate_digest }}" =~ ^[a-f0-9]{64}$ ]]

      - name: Check out exact staging-verified source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.validate.outputs.source_commit }}"
          test "$(sha256sum "$FUNCTION_SOURCE" | awk '{print $1}')" = "${{ needs.validate.outputs.source_sha256 }}"

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Deploy exact recovery function to production
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy "$FUNCTION_NAME" \
            --workdir backend \
            --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF" \
            --no-verify-jwt \
            --use-api

      - name: Verify production bundle identity and confirmation page
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/functions.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync(process.env.FUNCTIONS_PATH, 'utf8'));
          const row = rows.find((value) => value.slug === process.env.FUNCTION_NAME);
          const digest = String(row?.ezbr_sha256 || '');
          if (
            digest !== process.env.EXPECTED_DIGEST ||
            row?.verify_jwt !== false ||
            row?.status !== 'ACTIVE'
          ) throw new Error('Production recovery function does not match staging.');
          NODE
          base="https://${EXPECTED_PRODUCTION_PROJECT_REF}.supabase.co/functions/v1/${FUNCTION_NAME}"
          fake_token="abcdefghijklmnopqrstuvwxyzABCDEFGH0123456789_-abcdefghij"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/confirm.html" --write-out '%{http_code}' "$base?token_hash=$fake_token&type=recovery")"
          test "$status" = "200"
          grep -q 'Continue to Password Reset' "$RUNNER_TEMP/confirm.html"
        env:
          FUNCTIONS_PATH: ${{ runner.temp }}/functions.json
          EXPECTED_DIGEST: ${{ needs.deploy-staging.outputs.candidate_digest }}

      - name: Build bounded production Auth patch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/config/auth" \
            > "$RUNNER_TEMP/auth-before.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const current = JSON.parse(fs.readFileSync(process.env.AUTH_BEFORE_PATH, 'utf8'));
          const raw = current.uri_allow_list;
          const redirects = Array.isArray(raw)
            ? raw.map(String)
            : String(raw || '').split(',').map((value) => value.trim()).filter(Boolean);
          redirects.push(process.env.PRODUCTION_RESET_URL);
          const uniqueRedirects = [...new Set(redirects)];
          const recoveryUrl = `https://${process.env.EXPECTED_PRODUCTION_PROJECT_REF}.supabase.co/functions/v1/${process.env.FUNCTION_NAME}`;
          const template = [
            '<h2>Reset your Econovaria administrator password</h2>',
            '<p>We received a request to reset your administrator password.</p>',
            `<p><a href="${recoveryUrl}?token_hash={{ .TokenHash }}&type=recovery" rel="noreferrer">Continue password recovery</a></p>`,
            '<p>The link opens a confirmation page. The one-time recovery token is used only after you press Continue.</p>',
            '<p>If you did not request this, you can safely ignore this email.</p>',
          ].join('');
          if (template.includes('{{ .ConfirmationURL }}')) throw new Error('Direct recovery ConfirmationURL is prohibited.');
          fs.writeFileSync(process.env.AUTH_PATCH_PATH, JSON.stringify({
            site_url: process.env.PRODUCTION_ORIGIN,
            uri_allow_list: uniqueRedirects.join(','),
            mailer_subjects_recovery: 'Reset your Econovaria administrator password',
            mailer_templates_recovery_content: template,
          }));
          NODE
        env:
          AUTH_BEFORE_PATH: ${{ runner.temp }}/auth-before.json
          AUTH_PATCH_PATH: ${{ runner.temp }}/auth-patch.json

      - name: Apply production Auth URL and recovery template
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$AUTH_PATCH_PATH" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/config/auth" \
            > "$RUNNER_TEMP/auth-result.json"
        env:
          AUTH_PATCH_PATH: ${{ runner.temp }}/auth-patch.json

      - name: Verify exact production recovery configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/config/auth" \
            > "$RUNNER_TEMP/auth-after.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync(process.env.AUTH_AFTER_PATH, 'utf8'));
          const raw = config.uri_allow_list;
          const redirects = Array.isArray(raw)
            ? raw.map(String)
            : String(raw || '').split(',').map((value) => value.trim()).filter(Boolean);
          const template = String(config.mailer_templates_recovery_content || '');
          const expectedLink = `https://${process.env.EXPECTED_PRODUCTION_PROJECT_REF}.supabase.co/functions/v1/${process.env.FUNCTION_NAME}?token_hash={{ .TokenHash }}&type=recovery`;
          if (config.site_url !== process.env.PRODUCTION_ORIGIN) throw new Error('Production Site URL mismatch.');
          if (!redirects.includes(process.env.PRODUCTION_RESET_URL)) throw new Error('Production reset URL is not allow-listed.');
          if (!template.includes(expectedLink)) throw new Error('Scanner-safe recovery template mismatch.');
          if (template.includes('{{ .ConfirmationURL }}')) throw new Error('Direct recovery ConfirmationURL remains configured.');
          NODE
        env:
          AUTH_AFTER_PATH: ${{ runner.temp }}/auth-after.json

      - name: Confirm existing production reset page remains reachable
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/reset.html" --write-out '%{http_code}' "$PRODUCTION_RESET_URL")"
          test "$status" = "200"
          grep -q 'Reset Administrator Password' "$RUNNER_TEMP/reset.html"
