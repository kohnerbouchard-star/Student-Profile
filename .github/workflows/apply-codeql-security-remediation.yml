name: Apply CodeQL security remediation

on:
  push:
    branches:
      - agent/codeql-security-remediation-v1
  pull_request:
    branches:
      - agent/verified-admin-onboarding-and-game-selector
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: codeql-security-remediation-v1
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          ref: agent/codeql-security-remediation-v1
          fetch-depth: 0

      - name: Set up repository Node version
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Repair codemod bootstrap and drift handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-codeql-security-remediation.mjs")
          source = path.read_text()

          replacements = [
              (
                  r"\\`|~0-9A-Za-z",
                  r"\\x60|~0-9A-Za-z",
              ),
              (
                  '  if (first < 0) throw new Error(`Missing remediation anchor: ${label}`);',
                  '  if (first < 0) { console.log(`Already remediated or moved: ${label}`); return source; }',
              ),
              (
                  '  if (next === source) throw new Error(`Remediation produced no change: ${relativePath}`);',
                  '  if (next === source) return;',
              ),
          ]
          for before, after in replacements:
              if before not in source:
                  raise SystemExit(f"Expected codemod bootstrap anchor was not found: {before}")
              source = source.replace(before, after, 1)
          path.write_text(source)
          PY

      - name: Apply bounded remediation
        run: node scripts/apply-codeql-security-remediation.mjs

      - name: Patch reformatted live findings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          auth_path = Path("backend/src/security/adminBffRequestAuth.ts")
          auth = auth_path.read_text()
          before_auth = '''  const audience = Array.isArray(payload.aud)
            ? payload.aud
            : [payload.aud];
          const exp = Number(payload.exp);
          const nbf = payload.nbf === undefined ? null : Number(payload.nbf);
          const iat = payload.iat === undefined ? null : Number(payload.iat);
          return payload.iss === VERCEL_ISSUER &&
            audience.includes(VERCEL_AUDIENCE) &&'''
          after_auth = '''  const audience = Array.isArray(payload.aud)
            ? payload.aud
            : [payload.aud];
          const hasExpectedAudience = audience.some(
            (candidate) => typeof candidate === "string" && candidate === VERCEL_AUDIENCE,
          );
          const exp = Number(payload.exp);
          const nbf = payload.nbf === undefined ? null : Number(payload.nbf);
          const iat = payload.iat === undefined ? null : Number(payload.iat);
          return payload.iss === VERCEL_ISSUER &&
            hasExpectedAudience &&'''
          if before_auth in auth:
              auth_path.write_text(auth.replace(before_auth, after_auth, 1))
          elif "audience.includes(VERCEL_AUDIENCE)" in auth:
              raise SystemExit("The live audience check moved to an unreviewed form")

          player_path = Path("backend/src/domains/players/api/playerLoginHttpHandler.ts")
          player = player_path.read_text()
          before_player = '''function generateCompactCode(length: number): string {
            const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            const bytes = crypto.getRandomValues(new Uint8Array(length));
            return [...bytes]
              .map((byte) => alphabet[byte % alphabet.length])
              .join("");
          }'''
          after_player = '''function generateCompactCode(length: number): string {
            const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            const maximumUnbiasedByte = 256 - (256 % alphabet.length);
            let output = "";

            while (output.length < length) {
              const bytes = crypto.getRandomValues(new Uint8Array(length - output.length));
              for (const byte of bytes) {
                if (byte >= maximumUnbiasedByte) continue;
                output += alphabet[byte % alphabet.length];
                if (output.length === length) break;
              }
            }

            return output;
          }'''
          if before_player in player:
              player_path.write_text(player.replace(before_player, after_player, 1))
          elif "byte % alphabet.length" in player and "maximumUnbiasedByte" not in player:
              raise SystemExit("The live random-code generator moved to an unreviewed form")
          PY

      - name: Verify focused security contracts
        run: |
          node --test scripts/admin-game-selection-memory.test.mjs scripts/codeql-security-remediation.test.mjs
          node --experimental-strip-types --test scripts/admin-mfa-qr-code.test.mjs scripts/admin-bff-request-auth.test.mjs
          node --test scripts/local-staging-gateway-contract.test.mjs
          node --check scripts/player-login-identity-smoke.mjs

      - name: Commit verified remediation
        run: |
          if git diff --quiet; then
            echo "No remediation changes were produced." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/supabase/functions/staff-mfa-api/mfaQrCode.ts \
            backend/src/security/adminBffRequestAuth.ts \
            backend/src/domains/players/api/playerLoginHttpHandler.ts \
            scripts/player-login-identity-smoke.mjs \
            scripts/local-staging-gateway.py \
            frontend/src/core/admin-game-selection.js \
            frontend/src/core/login.js \
            frontend/src/core/api.js \
            admin \
            auth/reset-password.js \
            index.html \
            scripts/admin-game-selection-memory.test.mjs \
            scripts/codeql-security-remediation.test.mjs
          git commit -m "fix(security): remediate active CodeQL findings"
          git push origin HEAD:agent/codeql-security-remediation-v1
