name: Vercel Attested Production Promote

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Exact current main commit to promote"
        required: true
        type: string
      release_integrity_run_id:
        description: "Successful Release Integrity live-parity run ID"
        required: true
        type: string
      edge_inventory_run_id:
        description: "Successful Edge Function Inventory live-attestation run ID"
        required: true
        type: string
      confirm_action:
        description: "Type PROMOTE ATTESTED VERCEL PRODUCTION"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: vercel-attested-production-promote
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 58.1.0
  PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  STAGING_PROJECT_REF: eecvbssdvarfcykcfrny

jobs:
  promote:
    name: Build, verify, and promote exact attested source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Enforce explicit production authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "${{ inputs.confirm_action }}" = "PROMOTE ATTESTED VERCEL PRODUCTION"
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "${{ inputs.release_integrity_run_id }}" =~ ^[0-9]+$ ]]
          [[ "${{ inputs.edge_inventory_run_id }}" =~ ^[0-9]+$ ]]
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test "$PRODUCTION_PROJECT_REF" != "$STAGING_PROJECT_REF"

      - name: Check out exact current main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current main binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          node -e '
            const config = require("./vercel.json");
            if (config.git?.deploymentEnabled?.main !== false) {
              throw new Error("Automatic main deployments are not disabled.");
            }
          '

      - name: Download exact live release-integrity evidence
        uses: actions/download-artifact@v8
        with:
          name: release-integrity-live-${{ inputs.source_commit }}
          run-id: ${{ inputs.release_integrity_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/release-integrity

      - name: Download exact live Edge Function evidence
        uses: actions/download-artifact@v8
        with:
          name: edge-function-inventory-${{ inputs.source_commit }}
          run-id: ${{ inputs.edge_inventory_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/edge-inventory

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install locked repository dependencies
        run: npm ci

      - name: Enforce database and Edge Function attestations
        shell: bash
        run: |
          set -euo pipefail
          release_attestation="dist/release-integrity/release-attestation.json"
          edge_attestation="dist/edge-inventory/edge-function-attestation.json"
          test -f "$release_attestation"
          test -f "$edge_attestation"
          node scripts/release-integrity/cli.mjs enforce-attestation \
            --input "$release_attestation"
          node - <<'NODE'
          const release = require(`./${process.env.RELEASE_ATTESTATION}`);
          const edge = require(`./${process.env.EDGE_ATTESTATION}`);
          if (release.sourceSha !== process.env.SOURCE_COMMIT) {
            throw new Error('Release attestation source mismatch.');
          }
          if (edge.sourceCommit !== process.env.SOURCE_COMMIT) {
            throw new Error('Edge Function attestation source mismatch.');
          }
          if (edge.ok !== true) {
            throw new Error('Edge Function inventory attestation is not PASS.');
          }
          NODE
        env:
          RELEASE_ATTESTATION: dist/release-integrity/release-attestation.json
          EDGE_ATTESTATION: dist/edge-inventory/edge-function-attestation.json

      - name: Run release and health contracts
        run: |
          set -euo pipefail
          node --test \
            scripts/runtime-health-contract.test.mjs \
            scripts/live-runtime-attestation-contract.test.mjs \
            scripts/vercel-deployment-contract.test.mjs \
            scripts/release-integrity/workflow-contract.test.mjs \
            scripts/production-runtime-promotion-contract.test.mjs

      - name: Link exact Vercel project without exposing identifiers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          umask 077
          node - <<'NODE' > .vercel/project.json
          process.stdout.write(JSON.stringify({
            orgId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
          }));
          NODE

      - name: Pull production environment and build staged production output
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"
          npx --yes "vercel@$VERCEL_CLI_VERSION" build \
            --prod \
            --token="$VERCEL_TOKEN"

      - name: Create unaliased staged production deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/vercel-deploy-output.txt"
          npx --yes "vercel@$VERCEL_CLI_VERSION" deploy \
            --prebuilt \
            --prod \
            --skip-domain \
            --yes \
            --env "ECONOVARIA_SOURCE_SHA=$SOURCE_COMMIT" \
            --token="$VERCEL_TOKEN" \
            | tee "$output"
          deployment_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' "$output" | tail -n 1)"
          test -n "$deployment_url"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify staged deployment before promotion
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="${{ steps.deploy.outputs.deployment_url }}"
          npx --yes "vercel@$VERCEL_CLI_VERSION" inspect \
            "$deployment_url" \
            --token="$VERCEL_TOKEN"
          npx --yes "vercel@$VERCEL_CLI_VERSION" curl \
            /api/health \
            --deployment "$deployment_url" \
            --token="$VERCEL_TOKEN" \
            > "$RUNNER_TEMP/staged-health.json"
          node - <<'NODE'
          const health = require(process.env.HEALTH_PATH);
          if (health.ok !== true || health.status !== 'ready') {
            throw new Error('Staged deployment health is not ready.');
          }
          if (health.environment !== 'production') {
            throw new Error('Staged deployment is not bound to production configuration.');
          }
          if (health.projectRef !== process.env.PRODUCTION_PROJECT_REF) {
            throw new Error('Staged deployment Supabase project binding is invalid.');
          }
          if (health.sourceCommit !== process.env.SOURCE_COMMIT) {
            throw new Error('Staged deployment source commit is invalid.');
          }
          NODE
          npx --yes "vercel@$VERCEL_CLI_VERSION" logs \
            "$deployment_url" \
            --level error \
            --limit 50 \
            --token="$VERCEL_TOKEN" \
            > "$RUNNER_TEMP/staged-error-logs.txt"
          test ! -s "$RUNNER_TEMP/staged-error-logs.txt"
        env:
          HEALTH_PATH: ${{ runner.temp }}/staged-health.json

      - name: Promote verified staged deployment
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="${{ steps.deploy.outputs.deployment_url }}"
          npx --yes "vercel@$VERCEL_CLI_VERSION" promote \
            "$deployment_url" \
            --yes \
            --token="$VERCEL_TOKEN"
          npx --yes "vercel@$VERCEL_CLI_VERSION" promote status \
            --token="$VERCEL_TOKEN"

      - name: Verify promoted production runtime
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" curl \
            /api/health \
            --token="$VERCEL_TOKEN" \
            > "$RUNNER_TEMP/production-health.json"
          node - <<'NODE'
          const health = require(process.env.HEALTH_PATH);
          if (health.ok !== true || health.status !== 'ready') {
            throw new Error('Promoted production health is not ready.');
          }
          if (health.environment !== 'production') {
            throw new Error('Promoted production environment is invalid.');
          }
          if (health.projectRef !== process.env.PRODUCTION_PROJECT_REF) {
            throw new Error('Promoted production Supabase project binding is invalid.');
          }
          if (health.sourceCommit !== process.env.SOURCE_COMMIT) {
            throw new Error('Promoted production source commit is invalid.');
          }
          NODE
          npx --yes "vercel@$VERCEL_CLI_VERSION" logs \
            --environment production \
            --level error \
            --since 5m \
            --token="$VERCEL_TOKEN" \
            > "$RUNNER_TEMP/production-error-logs.txt"
          test ! -s "$RUNNER_TEMP/production-error-logs.txt"
        env:
          HEALTH_PATH: ${{ runner.temp }}/production-health.json

      - name: Write sanitized promotion evidence
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = process.env.EVIDENCE_PATH;
          const readJson = (file) => {
            try { return JSON.parse(fs.readFileSync(file, 'utf8')); } catch { return null; }
          };
          const evidence = {
            schemaVersion: 1,
            sourceCommit: process.env.SOURCE_COMMIT,
            releaseIntegrityRunId: process.env.RELEASE_RUN_ID,
            edgeInventoryRunId: process.env.EDGE_RUN_ID,
            stagedDeploymentUrl: process.env.DEPLOYMENT_URL || null,
            stagedHealth: readJson(process.env.STAGED_HEALTH),
            productionHealth: readJson(process.env.PRODUCTION_HEALTH),
          };
          fs.writeFileSync(path, `${JSON.stringify(evidence, null, 2)}\n`);
          NODE
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/vercel-production-promotion.json
          RELEASE_RUN_ID: ${{ inputs.release_integrity_run_id }}
          EDGE_RUN_ID: ${{ inputs.edge_inventory_run_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          STAGED_HEALTH: ${{ runner.temp }}/staged-health.json
          PRODUCTION_HEALTH: ${{ runner.temp }}/production-health.json

      - name: Upload sanitized promotion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-production-promotion-${{ inputs.source_commit }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/vercel-production-promotion.json
