name: Admin V2 UX CI Repair

on:
  push:
    branches:
      - refactor/admin-v2-ux-root-v1

permissions:
  contents: write

concurrency:
  group: admin-v2-ux-ci-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: |
          npm install --global npm@10.9.8
          npm ci

      - name: Repair Crafting flow and align intentional UX contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          crafting = Path('admin/v2/src/routes/crafting/CraftingRoute.js')
          source = crafting.read_text(encoding='utf-8')
          start = source.index('    const proposed = {')
          end_marker = '\n  });\n\n  dialog.open(opener);'
          end = source.index(end_marker, start)
          replacement = '''    const proposed = {
      countryCode: country || null,
      scarcityBand: scarcityBand.getValue(),
      availableQuantity: available,
      eventMultiplier: eventValue,
      routeMultiplier: routeValue,
      sourceEventKey: sourceEvent || null,
      expiresAt: expiry || null,
    };
    const before = item ? [
      `Scarcity: ${titleCase(item.scarcityBand)}`,
      `Available: ${item.availableQuantity === null ? "unbounded" : displayNumber(item.availableQuantity)}`,
      `Event multiplier: ${displayDecimal(item.eventMultiplier)}`,
      `Route multiplier: ${displayDecimal(item.routeMultiplier)}`,
      `Expires: ${item.expiresAt ? displayDate(item.expiresAt) : "no expiry"}`,
    ].join(" · ") : "No existing override";
    const after = [
      `Scarcity: ${titleCase(proposed.scarcityBand)}`,
      `Available: ${proposed.availableQuantity === null ? "unbounded" : displayNumber(proposed.availableQuantity)}`,
      `Event multiplier: ${displayDecimal(proposed.eventMultiplier)}`,
      `Route multiplier: ${displayDecimal(proposed.routeMultiplier)}`,
      `Expires: ${proposed.expiresAt ? displayDate(proposed.expiresAt) : "no expiry"}`,
    ].join(" · ");
    const review = AdminConfirmDialog({
      title: editing ? "Review supply change" : "Review supply override",
      message: `Apply this ${country || "global"} supply state for ${key}?`,
      detail: "This changes availability used by the physical economy. It does not change player-owned Inventory.",
      changes: [{ label: "Supply state", before, after }],
      confirmLabel: "Apply supply state",
      tone: "neutral",
      async onConfirm() {
        const result = await onApplySupply(key, proposed);
        if (result?.ok !== true) throw new Error("CRAFTING_SUPPLY_FAILED");
        return true;
      },
    });
    const accepted = await review.open(submit);
    review.destroy();
    if (accepted) dialog.close("committed");'''
          crafting.write_text(source[:start] + replacement + source[end:], encoding='utf-8')

          unit = Path('scripts/admin-v2-unit.test.mjs')
          text = unit.read_text(encoding='utf-8')
          replacements = {
            '["market", "Market"]': '["market", "Market Monitor"]',
            '["business", "Business"]': '["business", "Business Oversight"]',
            '["crafting", "Crafting"]': '["crafting", "Crafting Operations"]',
            '["news-events", "News & Events"]': '["news-events", "News & Event Monitor"]',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'missing navigation assertion: {old}')
            text = text.replace(old, new, 1)
          unit.write_text(text, encoding='utf-8')

          loans = Path('scripts/admin-v2-loans-api.test.mjs')
          text = loans.read_text(encoding='utf-8')
          old = '  assert.match(route, /Authoritative lending portfolio/);\n  assert.match(route, /Internal ownership UUIDs/);'
          new = '  assert.match(route, /Loan authority boundary/);\n  assert.match(route, /Internal ownership and ledger identifiers are not exposed/);'
          if old not in text:
            raise SystemExit('missing Loans authority assertions')
          loans.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check admin/v2/src/routes/crafting/CraftingRoute.js
          git diff --check
          npm run test:admin-v2
          node --test scripts/admin-v2-contracts-api.test.mjs scripts/admin-v2-loans-api.test.mjs

      - name: Commit repair and remove runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/admin-v2-ux-ci-repair.yml
          git add admin/v2/src/routes/crafting/CraftingRoute.js scripts/admin-v2-unit.test.mjs scripts/admin-v2-loans-api.test.mjs
          git diff --cached --check
          git commit -m 'fix(admin): repair Crafting UX flow and regressions'
          git push origin HEAD:refactor/admin-v2-ux-root-v1
