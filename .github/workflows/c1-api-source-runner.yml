name: C1 API source runner

on:
  push:
    branches:
      - feat/multicurrency-store-funding-v1
    paths:
      - .github/workflows/c1-api-source-runner.yml
      - scripts/c1-materialize-api-source-from-workflow.py

permissions:
  contents: write

concurrency:
  group: c1-api-source-runner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact materializer head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.3

      - name: Install pinned tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8 >/dev/null
          npm ci --ignore-scripts >/dev/null

      - name: Materialize authenticated C1 Store API source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/c1-materialize-api-source-from-workflow.py

      - name: Verify generated source and migrations
        shell: bash
        run: |
          set -euo pipefail
          deno check \
            backend/src/domains/store/api/playerStorePublicHttpHandler.ts \
            backend/src/domains/store/infrastructure/supabasePlayerStoreFundingPublicRepository.ts
          node scripts/multicurrency-store-funding-contract.mjs
          node scripts/validate-supabase-migrations.mjs
          git diff --check
          test "$(git diff --name-only | grep -Ev '^$' | wc -l)" -ge 8
          ! git diff --name-only | grep -E '^\.github/workflows/'

      - name: Commit authenticated C1 Store API source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/domains/store/api/playerStorePublicHttpHandler.ts \
            backend/src/domains/store/api/playerStorePublicRequestValidation.ts \
            backend/src/domains/store/contracts/playerStoreFundingPublicContracts.ts \
            backend/src/domains/store/contracts/playerStoreOfferPublicContracts.ts \
            backend/src/domains/store/infrastructure/supabasePlayerStoreFundingPublicRepository.ts \
            backend/src/domains/store/infrastructure/supabasePlayerStoreOfferPublicRepository.ts \
            backend/supabase/migrations/20260827094000_multicurrency_store_funding_settlement_v1.sql \
            backend/supabase/migrations/20260827094500_multicurrency_store_funding_assertions_v1.sql \
            docs/operations/contracts/player-cross-cutting/pr-674.json \
            scripts/multicurrency-store-funding-contract.mjs
          git commit -m "feat(store-funding): cut authenticated Store API to C1"
          git push origin HEAD:refs/heads/feat/multicurrency-store-funding-v1
