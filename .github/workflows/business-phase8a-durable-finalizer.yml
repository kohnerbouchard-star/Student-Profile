name: Business Phase 8A Durable Finalizer

on:
  push:
    branches:
      - feat/business-store-listing-inventory-v2
    paths:
      - ".github/workflows/business-phase8a-durable-finalizer.yml"

permissions:
  contents: write

concurrency:
  group: business-phase8a-durable-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.head_commit.message == 'ops(business): trigger Phase 8A durable finalizer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact Phase 8A branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/business-store-listing-inventory-v2
          fetch-depth: 0

      - name: Verify frozen certified implementation lineage
        shell: bash
        run: |
          set -euo pipefail
          IMPLEMENTATION_SHA="c0fd8650987a332f99b8173395dcf84fc3518c15"
          git merge-base --is-ancestor "$IMPLEMENTATION_SHA" HEAD
          test -z "$(git diff --name-only "$IMPLEMENTATION_SHA" HEAD -- . \
            ':(exclude).github/workflows/business-phase8a-durable-finalizer.yml')"

      - name: Write durable Phase 8A certification records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          implementation_sha = "c0fd8650987a332f99b8173395dcf84fc3518c15"
          dedicated_run = "32691204140"

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          scope_path = Path("docs/roadmaps/business-phase8-store-listing-inventory-scope-v1.md")
          scope = scope_path.read_text()
          scope = replace_once(
              scope,
              "**Status:** IN PROGRESS — checkpoint 8A scope locked; implementation not certified\n",
              "**Status:** COMPLETE — checkpoint 8A certified\n"
              f"**Certified implementation and exact-head verification source:** `{implementation_sha}`\n"
              f"**Dedicated certification workflow:** `{dedicated_run}`\n"
              "**Certification date:** 2026-08-24\n",
              "scope status",
          )
          evidence = f"""## Certification evidence

**Exact certified implementation SHA:** `{implementation_sha}`
**Dedicated workflow:** Business Store Listing Inventory V2 `{dedicated_run}`

- Phase 8A structural contract, custody/concurrency/economic simulation, typed command/result contract, deterministic architecture inventory, and Repository Quality: **PASS**;
- retained Phase 7A seller-offer authority, aggregation, Banking, Store, Inventory, and Business contracts: **PASS** (`32691204160`);
- retained Player Terminal plus Chromium verification: **PASS** in both the Phase 8A and Phase 7A workflows;
- Database Replay from zero twice and rebuilt-database lint: **PASS** (`32691204293`);
- Backend Typecheck and backend smoke: **PASS** (`32691204167`);
- retained timed manufacturing, workforce/equipment resource regressions, all Backend/Edge TypeScript, Player Business surface, and local Player Edge boot/preflight: **PASS** (`32691204313`);
- Business Workforce Payroll V2: **PASS** (`32691204210`);
- Business Economy V2: **PASS** (`32691204214`);
- Repository Quality: **PASS** (`32691204184`);
- Supply Chain Security: **PASS** (`32691204146`);
- Runtime Interaction Wiring: **PASS** (`32691204273`);
- Admin API Check: **PASS** (`32691204138`);
- Required Game Market Timezone: **PASS** (`32691204157`);
- Exchange Calendar Runtime: **PASS** (`32691204255`).

No merge, staging deployment, production deployment, secret mutation, or live database mutation occurred. Later documentation-only commits do not replace `{implementation_sha}` as the exact certified implementation source.

"""
          scope = replace_once(
              scope,
              "## Completion rule\n",
              evidence + "## Completion rule\n",
              "scope certification evidence",
          )
          next_header = "## Next step after scope lock\n"
          next_index = scope.find(next_header)
          if next_index < 0:
              raise SystemExit("scope next-step heading missing")
          scope = scope[:next_index] + f"""## Next authorized step

Checkpoint 8A is complete. Open a bounded Phase 9 checkpoint for five-minute Store withdrawal safety: introduce withdrawal-pending state/timestamps, disable purchase eligibility immediately, serialize request and due processing on the offer version, and return only remaining unsold units `Store Listing -> Finished Goods` after the minimum cooling-off period while preserving cost, provenance, retained stockroom convergence, idempotency, and two-game isolation. Offer-aware buyer settlement, Player routes/UI, automatic sales convergence, equity/IPO, merge, deployment, secrets, and live database mutation remain unauthorized.
"""
          scope_path.write_text(scope)

          plan_path = Path("docs/roadmaps/business-v2-development-execution-plan-v1.md")
          plan = plan_path.read_text()
          old_phase8 = """## Phase 8 — Physical Store-listing inventory

**Status:** NOT STARTED

- [ ] Create/resolve canonical Store-listing stock account scoped to the offer.
- [ ] Listing quantity physically moves `Finished Goods -> Store Listing`.
- [ ] Increasing stock moves additional units immediately.
- [ ] Purchasing moves exact units `Store Listing -> Buyer Inventory`.
- [ ] Store-listed goods cannot be consumed by another Business workflow.
- [ ] Preserve cost/provenance/audit journal.

Exit: offer availability equals actual inventory held in its Store-listing account.
"""
          new_phase8 = f"""## Phase 8 — Physical Store-listing inventory

**Status:** FOUNDATION COMPLETE — checkpoint 8A certified exact-head source `{implementation_sha}`; buyer inventory transfer remains deferred to atomic Store purchase settlement

- [x] Create/resolve one canonical immutable Store-listing stock account scoped to the Business offer.
- [x] Listing quantity physically moves exact available units `Finished Goods -> Store Listing`.
- [x] Increasing stock moves additional units immediately under optimistic offer concurrency.
- [ ] Purchasing moves exact units `Store Listing -> Buyer Inventory` — deferred to Phase 10 so payment and inventory cannot diverge.
- [x] Store-listed goods cannot be consumed by another Business workflow because they leave canonical Finished Goods custody.
- [x] Preserve average cost, currency, public-key provenance, append-only Inventory evidence, retained stockroom convergence, and two-game isolation.

Certified checkpoint:

- **8A:** canonical poster support for Business-owned offer custody; deterministic offer-scoped `store_stock` account; service-only idempotent stock command; exact Finished Goods-to-Store transfer; reserved-quantity exclusion; optimistic offer versioning; canonical/retained stockroom convergence; typed Store contracts/repository; deterministic concurrency, cost, rollback, aggregation, and two-game tests. **Certified implementation and exact-head verification source:** `{implementation_sha}`. Dedicated workflow: `{dedicated_run}`.

Exit: offer availability equals actual canonical inventory held in its Store-listing account. The physical listing foundation is **MET**; buyer transfer remains part of Phase 10 atomic settlement.
"""
          plan = replace_once(plan, old_phase8, new_phase8, "execution plan Phase 8")
          plan = replace_once(
              plan,
              "## Phase 9 — Five-minute Store withdrawal safety\n\n**Status:** NOT STARTED\n",
              "## Phase 9 — Five-minute Store withdrawal safety\n\n**Status:** OPEN — bounded checkpoint 9A authorized\n",
              "execution plan Phase 9 status",
          )
          plan_path.write_text(plan)

          log_path = Path("docs/roadmaps/business-v2-development-execution-log-v1.md")
          log = log_path.read_text()
          marker = "## 2026-08-24 — Phase 8A COMPLETE: physical Store-listing inventory foundation"
          if marker in log:
              raise SystemExit("execution log already contains Phase 8A certification")
          entry = f"""

---

{marker}

### Certified source and repository state

- **Exact certified implementation and verification source:** `{implementation_sha}`.
- Feature branch: `feat/business-store-listing-inventory-v2`.
- Stacked draft PR: #663, based on the durably certified Phase 7A handoff `462e6083c5b2d2b3b5d515c67bc7a8d71a2e43fb` / PR #662.
- PR #663 remained open, draft, mergeable, unmerged, and undeployed at certification.
- Integration PR #648 remained open, draft, and unmerged on `refactor/business-ux-mechanics-v1`.
- No merge, staging deployment, production deployment, secret mutation, or live database mutation was performed.
- Later documentation-only commits record certification and do not replace `{implementation_sha}` as the exact tested source.

### What is now authoritative

- The canonical Inventory poster accepts the retained seeded Store compatibility account and a Business-owned `store_stock` account only when that account is bound to one same-game, non-retired Business seller offer for the exact canonical item.
- Each Business offer resolves to one deterministic immutable Store-listing account owned by the Business economic party, with public Business/offer provenance and no parallel offer quantity.
- `public.stock_business_store_offer_v2` is service-only and moves positive integer units from canonical Finished Goods into the offer account under trusted game scope, public Business/offer keys, optimistic offer versioning, and idempotency.
- A matching committed retry replays before current-version rejection; conflicting key reuse, stale versions, retired offers, wrong seller/game/item/account, unavailable custody, and insufficient unreserved Finished Goods fail closed.
- The canonical transfer carries average unit cost and cost currency into Store-listing custody and records one append-only Inventory transaction; it does not create cash, revenue, tax, wage, expense, or COGS entries.
- The retained `business_inventory` Finished Goods row is locked, verified against canonical Inventory, and synchronized to the canonical post-state in the same transaction, preventing stale stockroom reads or re-inflation of already-listed units.
- Phase 7A aggregation now observes real Business offer availability from canonical Store-listing holdings without changing existing Player Store reads, quotes, purchases, buyer Inventory delivery, or Banking settlement.

### Exact-head verification on `{implementation_sha}`

- **Business Store Listing Inventory V2 — PASS** (`{dedicated_run}`): Phase 8A structural/type contracts, deterministic custody/concurrency/cost/projection simulation, deterministic architecture inventory, retained Business/Store/Inventory runtime, all Backend/Edge TypeScript, standalone Player Terminal, and Chromium.
- **Business Store Seller Offers V2 — PASS** (`32691204160`): retained Phase 7A authority, aggregation, Banking/Store/Inventory/Business contracts, standalone Player Terminal, and Chromium.
- **Database Replay — PASS** (`32691204293`): complete replay from zero twice plus rebuilt-database lint.
- **Backend Typecheck — PASS** (`32691204167`): backend typecheck and backend smoke.
- **Business Timed Manufacturing V2 — PASS** (`32691204313`): retained manufacturing, workforce/equipment regressions, all Backend/Edge TypeScript, Player Business surface, and local Player Edge boot/preflight.
- **Business Workforce Payroll V2 — PASS** (`32691204210`).
- **Business Economy V2 — PASS** (`32691204214`).
- **Repository Quality — PASS** (`32691204184`).
- **Supply Chain Security — PASS** (`32691204146`).
- **Runtime Interaction Wiring — PASS** (`32691204273`).
- **Admin API Check — PASS** (`32691204138`).
- **Required Game Market Timezone — PASS** (`32691204157`).
- **Exchange Calendar Runtime — PASS** (`32691204255`).

### Phase 8A exit result

- Canonical Business Store-listing account identity and immutable offer custody: **met**.
- Exact available Finished Goods-to-Store movement with reserved-quantity exclusion: **met**.
- Idempotent replay, conflicting-retry rejection, optimistic versioning, and concurrent-command serialization: **met**.
- Average cost, currency, transaction provenance, and public-key privacy: **met**.
- Canonical holdings and retained Business stockroom projection convergence: **met**.
- Phase 7A aggregation reflects physical Business offer inventory without parallel quantity: **met**.
- Database, backend, all Edge, retained Business/Banking/Store/Inventory/workforce/equipment/manufacturing, repository, security, Player, and Chromium gates: **met**.
- No withdrawal, buyer settlement, Player mutation/read cutover, deployment, or live mutation: **met**.

### Decisions and unresolved boundaries

- Stock placement is additive only. Reduction, cancellation, return to Finished Goods, and cooling-off state remain Phase 9 authority.
- Listing does not activate an offer automatically; offer lifecycle remains explicit and optimistic.
- Buyer-visible reads remain on the retained Store compatibility channel until displayed offer, quote, payment, seller revenue, and transferred inventory can settle against one locked offer.
- Store-listing inventory is not cash or revenue. Seller cash, COGS, tax, and buyer Inventory remain untouched until Phase 10.
- Withdrawal/purchase race ordering, simulated demand convergence, Player UX, equity/IPO, merge, staging, and production remain unauthorized.

### Next authorized step

**Phase 9 checkpoint 9A — five-minute Store withdrawal safety is OPEN.** Create a stacked draft branch/PR from the durably certified Phase 8A lineage. Introduce withdrawal-pending state and timestamps, disable purchase eligibility immediately, serialize request and due processing on the offer row/version, and return only remaining unsold units `Store Listing -> Finished Goods` after the minimum cooling-off period while preserving cost/provenance, retained stockroom convergence, idempotency, and two-game isolation. Do not include offer-aware buyer settlement, Player routes/UI, automatic sales convergence, equity/IPO, merge, staging, production deployment, secrets, or live database mutation.
"""
          log_path.write_text(log.rstrip() + entry + "\n")
          PY

          git diff --check
          git diff -- \
            docs/roadmaps/business-phase8-store-listing-inventory-scope-v1.md \
            docs/roadmaps/business-v2-development-execution-plan-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md

      - name: Commit durable records and remove one-time finalizer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "econovaria-automation"
          git config user.email "econovaria-automation@users.noreply.github.com"
          git rm .github/workflows/business-phase8a-durable-finalizer.yml
          git add \
            docs/roadmaps/business-phase8-store-listing-inventory-scope-v1.md \
            docs/roadmaps/business-v2-development-execution-plan-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md
          git diff --cached --quiet && { echo "No durable record changes were produced." >&2; exit 1; }
          git commit -m "docs(business): certify Phase 8A Store-listing inventory"
          git push origin HEAD:feat/business-store-listing-inventory-v2
