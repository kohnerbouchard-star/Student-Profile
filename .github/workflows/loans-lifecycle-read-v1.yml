name: Loans Lifecycle Read

on:
  pull_request:
    paths:
      - 'backend/src/domains/business-banking/api/playerBusinessBankingRoutePaths.test.ts'
      - 'backend/src/domains/business-banking/contracts/playerBusinessBankingContracts.ts'
      - 'backend/src/domains/business-banking/domain/loanCurrencyProjection.ts'
      - 'backend/src/domains/business-banking/infrastructure/supabasePlayerBusinessBankingRepository.ts'
      - 'scripts/business-banking-loan-lifecycle.test.ts'
      - 'docs/operations/evidence/loans-lifecycle-read-v1/**'
      - '.github/workflows/loans-lifecycle-read-v1.yml'

permissions:
  contents: read

jobs:
  loans-lifecycle-read:
    name: Loans Lifecycle Read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Set up pinned Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.3
      - name: Install locked tooling
        run: |
          npm install --global npm@10.9.8
          npm ci --ignore-scripts
      - name: Verify recorded lifecycle and unchanged read behavior
        run: |
          deno test --deny-net --config backend/supabase/functions/classroom-api/deno.json \
            --lock=backend/supabase/functions/deno.lock --frozen \
            scripts/business-banking-loan-lifecycle.test.ts \
            backend/src/domains/business-banking/api/playerBusinessBankingRoutePaths.test.ts
          node scripts/business-banking-runtime-contract.mjs
          node player-terminal/tests/business-banking-surface.mjs
      - name: Typecheck both unchanged Player composition roots
        run: |
          deno check --config backend/supabase/functions/classroom-api/deno.json \
            --lock=backend/supabase/functions/deno.lock --frozen \
            backend/supabase/functions/classroom-api/index.ts
          deno check --config backend/supabase/functions/player-api/deno.json \
            --lock=backend/supabase/functions/deno.lock --frozen \
            backend/supabase/functions/player-api/index.ts
