name: C1 backend API source implementation v2

on:
  push:
    branches:
      - feat/multicurrency-store-funding-v1
    paths:
      - .github/workflows/c1-backend-api-source-implementation-v2.yml

permissions:
  contents: write

concurrency:
  group: c1-backend-api-source-implementation-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source implementation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.3

      - name: Install pinned source tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8 >/dev/null
          npm ci --ignore-scripts >/dev/null

      - name: Materialize C1 funded Store contracts
        shell: bash
        run: |
          set -euo pipefail
          cat > backend/src/domains/store/contracts/playerStoreFundingPublicContracts.ts <<'EOF'
          import type {
            PlayerStoreOfferPublicQuoteDto,
            PlayerStoreOfferPublicReceiptDto,
          } from "./playerStoreOfferPublicContracts.ts";
          import type {
            PlayerStorePublicQuoteDto,
            PlayerStorePublicReceiptDto,
          } from "./playerStorePublicContracts.ts";

          export const PLAYER_STORE_FUNDING_ACCOUNT_KEY_PATTERN =
            /^bac_[0-9a-f]{32}$/u;
          export const PLAYER_STORE_FUNDING_QUOTE_KEY_PATTERN =
            /^pfq_[0-9a-f]{32}$/u;
          export const PLAYER_STORE_FUNDING_RECEIPT_KEY_PATTERN =
            /^pfr_[0-9a-f]{32}$/u;

          export interface PlayerStoreFundingAllocationInput {
            readonly sourceAccountKey: string;
            readonly targetAmount: number;
          }

          export interface PlayerStoreFundingQuoteLineDto {
            readonly lineNumber: number;
            readonly sourceAccountKey: string;
            readonly sourceCurrencyCode: string;
            readonly sourceMinorUnit: number;
            readonly targetCurrencyCode: string;
            readonly targetMinorUnit: number;
            readonly postedAmount: number;
            readonly heldAmount: number;
            readonly availableAmount: number;
            readonly targetContribution: number;
            readonly sourceDebit: number;
            readonly referenceRate: number;
            readonly customerRate: number;
            readonly effectiveRate: number;
            readonly spreadRate: number;
            readonly requiresFx: boolean;
            readonly roundingDisclosure: string;
          }

          export interface PlayerStoreFundingQuoteDto {
            readonly quoteKey: string;
            readonly fundingContextKind: string;
            readonly fundingContextKey: string;
            readonly targetCurrencyCode: string;
            readonly targetMinorUnit: number;
            readonly targetAmount: number;
            readonly fixingKey: string;
            readonly policyVersion: string;
            readonly requiresFx: boolean;
            readonly expiresAt: string;
            readonly lines: readonly PlayerStoreFundingQuoteLineDto[];
          }

          export interface PlayerStoreFundingReceiptLineDto {
            readonly lineNumber: number;
            readonly sourceAccountKey: string;
            readonly sourceCurrencyCode: string;
            readonly targetContribution: number;
            readonly sourceDebit: number;
            readonly referenceRate: number;
            readonly customerRate: number;
            readonly effectiveRate: number;
            readonly spreadRate: number;
            readonly requiresFx: boolean;
          }

          export interface PlayerStoreFundingReceiptDto {
            readonly receiptKey: string;
            readonly quoteKey: string;
            readonly bankTransactionKey: string;
            readonly targetAccountKey: string;
            readonly fundingContextKind: string;
            readonly fundingContextKey: string;
            readonly targetCurrencyCode: string;
            readonly targetAmount: number;
            readonly targetReserveDrawAmount: number;
            readonly sourceDomain: string;
            readonly sourceAction: string;
            readonly createdAt: string;
            readonly lines: readonly PlayerStoreFundingReceiptLineDto[];
          }

          export type PlayerStoreSeededFundingQuoteDto =
            PlayerStorePublicQuoteDto & {
              readonly quoteStatus: "created" | "used" | "expired" | "cancelled";
              readonly replayed: boolean;
              readonly fundingQuote: PlayerStoreFundingQuoteDto;
            };

          export type PlayerStoreSeededFundingReceiptDto =
            PlayerStorePublicReceiptDto & {
              readonly fundingReceipt: PlayerStoreFundingReceiptDto;
            };

          export type PlayerStoreBusinessFundingQuoteDto =
            PlayerStoreOfferPublicQuoteDto & {
              readonly fundingQuote: PlayerStoreFundingQuoteDto;
            };

          export type PlayerStoreBusinessFundingReceiptDto =
            PlayerStoreOfferPublicReceiptDto & {
              readonly fundingReceipt: PlayerStoreFundingReceiptDto;
            };

          export interface PlayerStoreFundingPublicScope {
            readonly gameSessionId: string;
            readonly playerId: string;
          }

          export interface PlayerStoreFundingPublicRepository {
            createSeededQuote(
              input: PlayerStoreFundingPublicScope & {
                readonly itemKey: string;
                readonly quantity: number;
                readonly allocations: readonly PlayerStoreFundingAllocationInput[];
                readonly idempotencyKey: string;
                readonly effectiveAt: string;
              },
            ): Promise<PlayerStoreSeededFundingQuoteDto>;
            settleSeededPurchase(
              input: PlayerStoreFundingPublicScope & {
                readonly quoteKey: string;
                readonly idempotencyKey: string;
                readonly clientSubmittedAt: string | null;
              },
            ): Promise<PlayerStoreSeededFundingReceiptDto>;
            createBusinessOfferQuote(
              input: PlayerStoreFundingPublicScope & {
                readonly offerKey: string;
                readonly quantity: number;
                readonly expectedVersion: number;
                readonly allocations: readonly PlayerStoreFundingAllocationInput[];
                readonly idempotencyKey: string;
              },
            ): Promise<PlayerStoreBusinessFundingQuoteDto>;
            settleBusinessOfferPurchase(
              input: PlayerStoreFundingPublicScope & {
                readonly offerKey: string;
                readonly quoteKey: string;
                readonly quantity: number;
                readonly expectedVersion: number;
                readonly idempotencyKey: string;
              },
            ): Promise<PlayerStoreBusinessFundingReceiptDto>;
            readBusinessOfferReceipt(
              input: PlayerStoreFundingPublicScope & {
                readonly receiptKey: string;
              },
            ): Promise<PlayerStoreBusinessFundingReceiptDto>;
          }
          EOF

      - name: Materialize C1 funded Store repository
        shell: bash
        run: |
          set -euo pipefail
          cat > backend/src/domains/store/infrastructure/supabasePlayerStoreFundingPublicRepository.ts <<'EOF'
          import {
            PLAYER_STORE_FUNDING_ACCOUNT_KEY_PATTERN,
            PLAYER_STORE_FUNDING_QUOTE_KEY_PATTERN,
            PLAYER_STORE_FUNDING_RECEIPT_KEY_PATTERN,
            type PlayerStoreBusinessFundingQuoteDto,
            type PlayerStoreBusinessFundingReceiptDto,
            type PlayerStoreFundingPublicRepository,
            type PlayerStoreFundingPublicScope,
            type PlayerStoreFundingQuoteDto,
            type PlayerStoreFundingQuoteLineDto,
            type PlayerStoreFundingReceiptDto,
            type PlayerStoreFundingReceiptLineDto,
            type PlayerStoreSeededFundingQuoteDto,
            type PlayerStoreSeededFundingReceiptDto,
          } from "../contracts/playerStoreFundingPublicContracts.ts";
          import {
            projectPlayerStoreOfferQuote,
            projectPlayerStoreOfferReceipt,
          } from "../contracts/playerStoreOfferPublicContracts.ts";
          import {
            PLAYER_STORE_ITEM_KEY_PATTERN,
            PLAYER_STORE_QUOTE_KEY_PATTERN,
            PLAYER_STORE_RECEIPT_KEY_PATTERN,
            PlayerStorePublicError,
          } from "../contracts/playerStorePublicContracts.ts";
          import {
            parseBusinessStoreOfferQuote,
          } from "../contracts/storeOfferQuoteContracts.ts";
          import {
            parseBusinessStoreOfferReceipt,
          } from "../contracts/storeOfferSettlementContracts.ts";
          import {
            type PlayerStoreOfferClient,
            PlayerStoreOfferPublicReadStore,
          } from "./playerStoreOfferPublicReadStore.ts";

          const UUID_ANY =
            /[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/iu;
          const UUID_EXACT =
            /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/u;
          const FIXING_KEY = /^fxf_[0-9a-f]{32}$/u;
          const BANK_TRANSACTION_KEY = /^btx_[0-9a-f]{32}$/u;
          const BUSINESS_KEY = /^biz_[0-9a-f]{32}$/u;
          const PARTY_KEY = /^pty_[0-9a-f]{32}$/u;
          const CURRENCY = /^[A-Z0-9_]{3,16}$/u;

          export class SupabasePlayerStoreFundingPublicRepository
            implements PlayerStoreFundingPublicRepository {
            private readonly readStore: PlayerStoreOfferPublicReadStore;

            constructor(private readonly client: PlayerStoreOfferClient) {
              this.readStore = new PlayerStoreOfferPublicReadStore(client);
            }

            async createSeededQuote(
              input: Parameters<PlayerStoreFundingPublicRepository["createSeededQuote"]>[0],
            ): Promise<PlayerStoreSeededFundingQuoteDto> {
              const scope = normalizeScope(input);
              const raw = await this.callRpc(
                "create_seeded_store_funding_quote_v1",
                {
                  p_game_session_id: scope.gameSessionId,
                  p_player_id: scope.playerId,
                  p_item_key: input.itemKey,
                  p_quantity: input.quantity,
                  p_allocations: input.allocations,
                  p_idempotency_key: input.idempotencyKey,
                  p_effective_at: input.effectiveAt,
                },
                "quote",
              );
              return parseSeededQuote(raw);
            }

            async settleSeededPurchase(
              input: Parameters<PlayerStoreFundingPublicRepository["settleSeededPurchase"]>[0],
            ): Promise<PlayerStoreSeededFundingReceiptDto> {
              const scope = normalizeScope(input);
              const raw = await this.callRpc(
                "settle_seeded_store_funding_v1",
                {
                  p_game_session_id: scope.gameSessionId,
                  p_player_id: scope.playerId,
                  p_quote_key: input.quoteKey,
                  p_idempotency_key: input.idempotencyKey,
                  p_client_submitted_at: input.clientSubmittedAt,
                  p_request_metadata: {},
                },
                "purchase",
              );
              return parseSeededReceipt(raw);
            }

            async createBusinessOfferQuote(
              input: Parameters<PlayerStoreFundingPublicRepository["createBusinessOfferQuote"]>[0],
            ): Promise<PlayerStoreBusinessFundingQuoteDto> {
              const scope = normalizeScope(input);
              const row = publicRecord(await this.callRpc(
                "create_business_store_offer_funding_quote_v1",
                {
                  p_game_session_id: scope.gameSessionId,
                  p_buyer_player_id: scope.playerId,
                  p_offer_key: input.offerKey,
                  p_quantity: input.quantity,
                  p_expected_offer_version: input.expectedVersion,
                  p_allocations: input.allocations,
                  p_idempotency_key: input.idempotencyKey,
                },
                "quote",
              ));
              const fundingQuote = parseFundingQuote(row.fundingQuote);
              const { fundingQuote: _fundingQuote, ...quotePayload } = row;
              const quote = parseBusinessStoreOfferQuote(quotePayload);
              const identity = await this.readStore.requireBusinessIdentity(
                scope.gameSessionId,
                quote.sellerPartyKey,
                quote.businessKey,
              );
              return Object.freeze({
                ...projectPlayerStoreOfferQuote(quote, identity),
                fundingQuote,
              });
            }

            async settleBusinessOfferPurchase(
              input: Parameters<PlayerStoreFundingPublicRepository["settleBusinessOfferPurchase"]>[0],
            ): Promise<PlayerStoreBusinessFundingReceiptDto> {
              const scope = normalizeScope(input);
              const raw = await this.callRpc(
                "settle_business_store_offer_funding_v1",
                {
                  p_game_session_id: scope.gameSessionId,
                  p_buyer_player_id: scope.playerId,
                  p_offer_key: input.offerKey,
                  p_quote_key: input.quoteKey,
                  p_quantity: input.quantity,
                  p_expected_offer_version: input.expectedVersion,
                  p_idempotency_key: input.idempotencyKey,
                },
                "purchase",
              );
              return await this.parseBusinessReceipt(scope, raw);
            }

            async readBusinessOfferReceipt(
              input: Parameters<PlayerStoreFundingPublicRepository["readBusinessOfferReceipt"]>[0],
            ): Promise<PlayerStoreBusinessFundingReceiptDto> {
              const scope = normalizeScope(input);
              const raw = await this.callRpc(
                "read_business_store_offer_funding_receipt_v1",
                {
                  p_game_session_id: scope.gameSessionId,
                  p_buyer_player_id: scope.playerId,
                  p_receipt_key: input.receiptKey,
                },
                "receipt",
              );
              return await this.parseBusinessReceipt(scope, raw);
            }

            private async parseBusinessReceipt(
              scope: PlayerStoreFundingPublicScope,
              raw: unknown,
            ): Promise<PlayerStoreBusinessFundingReceiptDto> {
              const row = publicRecord(raw);
              const fundingReceipt = parseFundingReceipt(row.fundingReceipt);
              const { fundingReceipt: _fundingReceipt, ...receiptPayload } = row;
              const receipt = parseBusinessStoreOfferReceipt(receiptPayload);
              const identity = await this.readStore.requireBusinessIdentity(
                scope.gameSessionId,
                receipt.sellerPartyKey,
                receipt.businessKey,
                { requireActive: false },
              );
              return Object.freeze({
                ...projectPlayerStoreOfferReceipt(receipt, identity),
                fundingReceipt,
              });
            }

            private async callRpc(
              functionName: string,
              args: Record<string, unknown>,
              phase: "quote" | "purchase" | "receipt",
            ): Promise<unknown> {
              const response = await this.client.rpc<unknown>(functionName, args);
              if (response.error) throw mapFundingRpcError(response.error, phase);
              if (response.data === null || response.data === undefined) {
                throw invalidPublicResponse();
              }
              return response.data;
            }
          }

          function normalizeScope(
            input: PlayerStoreFundingPublicScope,
          ): PlayerStoreFundingPublicScope {
            const gameSessionId = String(input.gameSessionId ?? "")
              .trim().toLowerCase();
            const playerId = String(input.playerId ?? "").trim().toLowerCase();
            if (!UUID_EXACT.test(gameSessionId) || !UUID_EXACT.test(playerId)) {
              throw new PlayerStorePublicError(
                "player_store_funding_scope_invalid",
                "Player Store funding scope is invalid.",
                500,
                false,
              );
            }
            return Object.freeze({ gameSessionId, playerId });
          }

          function parseSeededQuote(value: unknown): PlayerStoreSeededFundingQuoteDto {
            const row = publicRecord(value);
            return Object.freeze({
              quoteKey: publicKey(row.quoteKey, PLAYER_STORE_QUOTE_KEY_PATTERN),
              quoteStatus: quoteStatus(row.quoteStatus),
              itemKey: publicKey(row.itemKey, PLAYER_STORE_ITEM_KEY_PATTERN),
              itemName: publicText(row.itemName),
              quantity: boundedInteger(row.quantity, 1),
              baseUnitPrice: finiteNumber(row.baseUnitPrice, 0),
              inflationMultiplier: finiteNumber(row.inflationMultiplier, 0),
              locationMultiplier: finiteNumber(row.locationMultiplier, 0),
              scarcityMultiplier: finiteNumber(row.scarcityMultiplier, 0),
              discountAmount: finiteNumber(row.discountAmount, 0),
              finalUnitPrice: finiteNumber(row.finalUnitPrice, 0),
              finalTotalPrice: finiteNumber(row.finalTotalPrice, 0),
              currencyCode: currency(row.currencyCode),
              itemCurrencyCode: currency(row.itemCurrencyCode),
              playerCurrencyCode: currency(row.playerCurrencyCode),
              exchangeRate: finiteNumber(row.exchangeRate, 0),
              itemLocalFinalUnitPrice: finiteNumber(
                row.itemLocalFinalUnitPrice,
                0,
              ),
              itemLocalFinalTotalPrice: finiteNumber(
                row.itemLocalFinalTotalPrice,
                0,
              ),
              expiresAt: isoTimestamp(row.expiresAt),
              pricingVersion: publicText(row.pricingVersion),
              replayed: boolean(row.replayed),
              fundingQuote: parseFundingQuote(row.fundingQuote),
            });
          }

          function parseSeededReceipt(
            value: unknown,
          ): PlayerStoreSeededFundingReceiptDto {
            const row = publicRecord(value);
            return Object.freeze({
              receiptKey: publicKey(row.receiptKey, PLAYER_STORE_RECEIPT_KEY_PATTERN),
              quoteKey: publicKey(row.quoteKey, PLAYER_STORE_QUOTE_KEY_PATTERN),
              itemKey: publicKey(row.itemKey, PLAYER_STORE_ITEM_KEY_PATTERN),
              itemName: publicText(row.itemName),
              quantity: boundedInteger(row.quantity, 1),
              finalUnitPrice: finiteNumber(row.finalUnitPrice, 0),
              finalTotalPrice: finiteNumber(row.finalTotalPrice, 0),
              currencyCode: currency(row.currencyCode),
              inventoryQuantityOwned: boundedInteger(
                row.inventoryQuantityOwned,
                0,
              ),
              completedAt: isoTimestamp(row.completedAt),
              alreadyCompleted: boolean(row.alreadyCompleted),
              fundingReceipt: parseFundingReceipt(row.fundingReceipt),
            });
          }

          function parseFundingQuote(value: unknown): PlayerStoreFundingQuoteDto {
            const row = publicRecord(value);
            const lines = publicArray(row.lines).map(parseFundingQuoteLine);
            if (lines.length < 1 || lines.length > 3) throw invalidPublicResponse();
            return Object.freeze({
              quoteKey: publicKey(
                row.quote_key,
                PLAYER_STORE_FUNDING_QUOTE_KEY_PATTERN,
              ),
              fundingContextKind: publicText(row.funding_context_kind),
              fundingContextKey: publicContextKey(row.funding_context_key),
              targetCurrencyCode: currency(row.target_currency_code),
              targetMinorUnit: boundedInteger(row.target_minor_unit, 0, 18),
              targetAmount: finiteNumber(row.target_amount, 0),
              fixingKey: publicKey(row.fixing_key, FIXING_KEY),
              policyVersion: publicText(row.policy_version),
              requiresFx: boolean(row.requires_fx),
              expiresAt: isoTimestamp(row.expires_at),
              lines: Object.freeze(lines),
            });
          }

          function parseFundingQuoteLine(value: unknown): PlayerStoreFundingQuoteLineDto {
            const row = publicRecord(value);
            return Object.freeze({
              lineNumber: boundedInteger(row.line_number, 1, 3),
              sourceAccountKey: publicKey(
                row.source_account_key,
                PLAYER_STORE_FUNDING_ACCOUNT_KEY_PATTERN,
              ),
              sourceCurrencyCode: currency(row.source_currency_code),
              sourceMinorUnit: boundedInteger(row.source_minor_unit, 0, 18),
              targetCurrencyCode: currency(row.target_currency_code),
              targetMinorUnit: boundedInteger(row.target_minor_unit, 0, 18),
              postedAmount: finiteNumber(row.posted_amount),
              heldAmount: finiteNumber(row.held_amount, 0),
              availableAmount: finiteNumber(row.available_amount),
              targetContribution: finiteNumber(row.target_contribution, 0),
              sourceDebit: finiteNumber(row.source_debit, 0),
              referenceRate: finiteNumber(row.reference_rate, 0),
              customerRate: finiteNumber(row.customer_rate, 0),
              effectiveRate: finiteNumber(row.effective_rate, 0),
              spreadRate: finiteNumber(row.spread_rate, 0),
              requiresFx: boolean(row.requires_fx),
              roundingDisclosure: publicText(row.rounding_disclosure),
            });
          }

          function parseFundingReceipt(value: unknown): PlayerStoreFundingReceiptDto {
            const row = publicRecord(value);
            const lines = publicArray(row.lines).map(parseFundingReceiptLine);
            if (lines.length < 1 || lines.length > 3) throw invalidPublicResponse();
            return Object.freeze({
              receiptKey: publicKey(
                row.receipt_key,
                PLAYER_STORE_FUNDING_RECEIPT_KEY_PATTERN,
              ),
              quoteKey: publicKey(
                row.quote_key,
                PLAYER_STORE_FUNDING_QUOTE_KEY_PATTERN,
              ),
              bankTransactionKey: publicKey(
                row.bank_transaction_key,
                BANK_TRANSACTION_KEY,
              ),
              targetAccountKey: publicKey(
                row.target_account_key,
                PLAYER_STORE_FUNDING_ACCOUNT_KEY_PATTERN,
              ),
              fundingContextKind: publicText(row.funding_context_kind),
              fundingContextKey: publicContextKey(row.funding_context_key),
              targetCurrencyCode: currency(row.target_currency_code),
              targetAmount: finiteNumber(row.target_amount, 0),
              targetReserveDrawAmount: finiteNumber(
                row.target_reserve_draw_amount,
                0,
              ),
              sourceDomain: publicText(row.source_domain),
              sourceAction: publicText(row.source_action),
              createdAt: isoTimestamp(row.created_at),
              lines: Object.freeze(lines),
            });
          }

          function parseFundingReceiptLine(
            value: unknown,
          ): PlayerStoreFundingReceiptLineDto {
            const row = publicRecord(value);
            return Object.freeze({
              lineNumber: boundedInteger(row.line_number, 1, 3),
              sourceAccountKey: publicKey(
                row.source_account_key,
                PLAYER_STORE_FUNDING_ACCOUNT_KEY_PATTERN,
              ),
              sourceCurrencyCode: currency(row.source_currency_code),
              targetContribution: finiteNumber(row.target_contribution, 0),
              sourceDebit: finiteNumber(row.source_debit, 0),
              referenceRate: finiteNumber(row.reference_rate, 0),
              customerRate: finiteNumber(row.customer_rate, 0),
              effectiveRate: finiteNumber(row.effective_rate, 0),
              spreadRate: finiteNumber(row.spread_rate, 0),
              requiresFx: boolean(row.requires_fx),
            });
          }

          function mapFundingRpcError(
            error: { readonly code?: string; readonly message?: string },
            phase: "quote" | "purchase" | "receipt",
          ): PlayerStorePublicError {
            const source = `${error.code ?? ""} ${error.message ?? ""}`
              .toUpperCase();
            const code = [...source.matchAll(/[A-Z][A-Z0-9_]{4,}/gu)]
              .map((match) => match[0])
              .find((candidate) =>
                /^(?:STORE|PURCHASE|FUNDING|BANK|FX|PLAYER)_/u.test(candidate)
              ) ?? "";
            if (/REQUEST_INVALID|ALLOCATIONS?_INVALID|PRECISION_INVALID/u.test(code)) {
              return publicError(
                "invalid_player_store_request",
                "Store funding request is invalid.",
                400,
              );
            }
            if (code.includes("SELF_PURCHASE")) {
              return publicError(
                "store_offer_self_purchase_forbidden",
                "A Player cannot purchase from their own Business.",
                403,
              );
            }
            if (code.includes("IDEMPOTENCY") || code.endsWith("_CONFLICT")) {
              return publicError(
                "store_idempotency_conflict",
                "This idempotency key was already used for another Store request.",
                409,
              );
            }
            if (code.includes("INSUFFICIENT_STOCK")) {
              return publicError(
                "store_insufficient_stock",
                "Store stock is insufficient.",
                409,
              );
            }
            if (
              code.includes("FUNDING_INSUFFICIENT") ||
              code.includes("INSUFFICIENT_FUNDS")
            ) {
              return publicError(
                "store_insufficient_balance",
                "Available Checking funds are insufficient for this purchase.",
                409,
              );
            }
            if (/LIQUIDITY|FACILITY|CLEARING|RESERVE|CAP_/u.test(code)) {
              return publicError(
                "store_fx_liquidity_unavailable",
                "Retail checkout FX capacity is unavailable.",
                409,
              );
            }
            if (code.includes("TOTAL_MISMATCH")) {
              return publicError(
                "store_funding_total_mismatch",
                "The selected account allocations must equal the Store bill.",
                409,
              );
            }
            if (code.includes("QUOTE_EXPIRED") || code.includes("RATE_VERSION_STALE")) {
              return publicError(
                "store_quote_expired",
                "The Store funding quote has expired.",
                409,
              );
            }
            if (code.includes("RECEIPT_NOT_FOUND")) {
              return publicError(
                "store_offer_receipt_not_found",
                "Store offer receipt was not found.",
                404,
              );
            }
            if (/NOT_FOUND|UNAVAILABLE|STATUS_INVALID|MISMATCH|RESERVED/u.test(code)) {
              return publicError(
                phase === "quote"
                  ? "store_quote_not_available"
                  : "store_purchase_unavailable",
                phase === "quote"
                  ? "Store funding quote is not available."
                  : "Store purchase is not available.",
                409,
              );
            }
            return publicError(
              phase === "quote"
                ? "player_store_funding_quote_failed"
                : phase === "receipt"
                ? "player_store_funding_receipt_failed"
                : "player_store_funding_purchase_failed",
              phase === "quote"
                ? "Store funding quote could not be created."
                : phase === "receipt"
                ? "Store funding receipt could not be loaded."
                : "Store purchase could not be completed.",
              500,
            );
          }

          function publicRecord(value: unknown): Record<string, unknown> {
            if (!value || typeof value !== "object" || Array.isArray(value)) {
              throw invalidPublicResponse();
            }
            const serialized = JSON.stringify(value);
            if (UUID_ANY.test(serialized)) throw invalidPublicResponse();
            return value as Record<string, unknown>;
          }

          function publicArray(value: unknown): readonly unknown[] {
            if (!Array.isArray(value)) throw invalidPublicResponse();
            return value;
          }

          function publicText(value: unknown): string {
            const candidate = typeof value === "string" ? value.trim() : "";
            if (!candidate || candidate.length > 400 || UUID_ANY.test(candidate)) {
              throw invalidPublicResponse();
            }
            return candidate;
          }

          function publicContextKey(value: unknown): string {
            const candidate = publicText(value);
            if (candidate.length > 240) throw invalidPublicResponse();
            return candidate;
          }

          function publicKey(value: unknown, pattern: RegExp): string {
            const candidate = publicText(value);
            if (!pattern.test(candidate)) throw invalidPublicResponse();
            return candidate;
          }

          function currency(value: unknown): string {
            return publicKey(value, CURRENCY);
          }

          function finiteNumber(
            value: unknown,
            minimum = Number.NEGATIVE_INFINITY,
          ): number {
            const candidate = typeof value === "number"
              ? value
              : typeof value === "string" && /^-?[0-9]+(?:\.[0-9]+)?$/u.test(value)
              ? Number(value)
              : Number.NaN;
            if (
              !Number.isFinite(candidate) || candidate < minimum ||
              Math.abs(candidate) >= 1_000_000_000_000_000
            ) {
              throw invalidPublicResponse();
            }
            return candidate;
          }

          function boundedInteger(
            value: unknown,
            minimum: number,
            maximum = Number.MAX_SAFE_INTEGER,
          ): number {
            const candidate = Number(value);
            if (
              !Number.isSafeInteger(candidate) || candidate < minimum ||
              candidate > maximum
            ) {
              throw invalidPublicResponse();
            }
            return candidate;
          }

          function boolean(value: unknown): boolean {
            if (typeof value !== "boolean") throw invalidPublicResponse();
            return value;
          }

          function isoTimestamp(value: unknown): string {
            const candidate = publicText(value);
            if (!Number.isFinite(Date.parse(candidate))) throw invalidPublicResponse();
            return new Date(candidate).toISOString();
          }

          function quoteStatus(
            value: unknown,
          ): "created" | "used" | "expired" | "cancelled" {
            const candidate = publicText(value).toLowerCase();
            if (
              candidate !== "created" && candidate !== "used" &&
              candidate !== "expired" && candidate !== "cancelled"
            ) {
              throw invalidPublicResponse();
            }
            return candidate;
          }

          function invalidPublicResponse(): PlayerStorePublicError {
            return publicError(
              "player_store_funding_response_invalid",
              "Store funding returned an invalid public response.",
              500,
            );
          }

          function publicError(
            code: string,
            message: string,
            status: number,
          ): PlayerStorePublicError {
            return new PlayerStorePublicError(code, message, status, false);
          }
          EOF

      - name: Patch C1 authenticated handler and request boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"marker missing in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          validation = "backend/src/domains/store/api/playerStorePublicRequestValidation.ts"
          replace(
              validation,
              'import type { PlayerStorePublicRoute } from "./playerStorePublicRoutePaths.ts";',
              'import type { PlayerStoreFundingAllocationInput } from "../contracts/playerStoreFundingPublicContracts.ts";\nimport type { PlayerStorePublicRoute } from "./playerStorePublicRoutePaths.ts";',
          )
          replace(
              validation,
              'assertAllowedFields(body, ["itemKey", "quantity"]);',
              'assertAllowedFields(body, ["itemKey", "quantity", "allocations", "idempotencyKey"]);',
          )
          replace(
              validation,
              '      "expectedVersion",\n      "idempotencyKey",',
              '      "expectedVersion",\n      "allocations",\n      "idempotencyKey",',
          )
          marker = 'export function readPlayerStoreIdempotencyKey(value: unknown): string {'
          helper = '''export function readPlayerStoreFundingAllocations(
            value: unknown,
          ): readonly PlayerStoreFundingAllocationInput[] {
            if (!Array.isArray(value) || value.length < 1 || value.length > 3) {
              throw invalidRequest(
                "allocations must contain one to three Checking accounts.",
              );
            }
            const seen = new Set<string>();
            return Object.freeze(value.map((entry, index) => {
              if (
                !isRecord(entry) ||
                Object.keys(entry).sort().join(",") !==
                  "sourceAccountKey,targetAmount"
              ) {
                throw invalidRequest(`allocations[${index}] is invalid.`);
              }
              const sourceAccountKey = typeof entry.sourceAccountKey === "string"
                ? entry.sourceAccountKey.trim().toLowerCase()
                : "";
              if (
                !/^bac_[0-9a-f]{32}$/u.test(sourceAccountKey) ||
                seen.has(sourceAccountKey)
              ) {
                throw invalidRequest(
                  "Allocation Checking account keys must be unique public bac_ keys.",
                );
              }
              const targetAmount = entry.targetAmount;
              const decimal = typeof targetAmount === "number"
                ? String(targetAmount)
                : "";
              if (
                typeof targetAmount !== "number" ||
                !Number.isFinite(targetAmount) ||
                targetAmount <= 0 ||
                targetAmount >= 1_000_000_000_000_000 ||
                !/^[0-9]+(?:\\.[0-9]{1,18})?$/u.test(decimal)
              ) {
                throw invalidRequest(
                  "Each targetAmount must be a positive decimal number.",
                );
              }
              seen.add(sourceAccountKey);
              return Object.freeze({ sourceAccountKey, targetAmount });
            }));
          }

          '''
          replace(validation, marker, helper + marker)

          handler = "backend/src/domains/store/api/playerStorePublicHttpHandler.ts"
          replace(
              handler,
              'import type { PlayerStoreOfferPublicRepository } from "../contracts/playerStoreOfferPublicContracts.ts";',
              'import type { PlayerStoreFundingPublicRepository } from "../contracts/playerStoreFundingPublicContracts.ts";\nimport type { PlayerStoreOfferPublicRepository } from "../contracts/playerStoreOfferPublicContracts.ts";',
          )
          replace(
              handler,
              'import { SupabasePlayerStoreOfferPublicRepository } from "../infrastructure/supabasePlayerStoreOfferPublicRepository.ts";',
              'import { SupabasePlayerStoreFundingPublicRepository } from "../infrastructure/supabasePlayerStoreFundingPublicRepository.ts";\nimport { SupabasePlayerStoreOfferPublicRepository } from "../infrastructure/supabasePlayerStoreOfferPublicRepository.ts";',
          )
          replace(
              handler,
              '  readPlayerStoreExpectedVersion,\n  readPlayerStoreIdempotencyKey,',
              '  readPlayerStoreExpectedVersion,\n  readPlayerStoreFundingAllocations,\n  readPlayerStoreIdempotencyKey,',
          )
          replace(
              handler,
              '  projectPlayerStorePublicOfferProduct,\n  projectPlayerStorePublicOfferQuote,\n  projectPlayerStorePublicOfferReceipt,',
              '  projectPlayerStorePublicOfferProduct,',
          )
          replace(
              handler,
              '  readonly createOfferRepository?: (\n    client: EdgeSupabaseClient,\n  ) => PlayerStoreOfferPublicRepository;\n  readonly now?: () => string;',
              '  readonly createOfferRepository?: (\n    client: EdgeSupabaseClient,\n  ) => PlayerStoreOfferPublicRepository;\n  readonly createFundingRepository?: (\n    client: EdgeSupabaseClient,\n  ) => PlayerStoreFundingPublicRepository;\n  readonly now?: () => string;',
          )
          replace(
              handler,
              '    const createOfferRepository = () =>\n      dependencies.createOfferRepository\n        ? dependencies.createOfferRepository(client)\n        : new SupabasePlayerStoreOfferPublicRepository(client as never);',
              '    const createOfferRepository = () =>\n      dependencies.createOfferRepository\n        ? dependencies.createOfferRepository(client)\n        : new SupabasePlayerStoreOfferPublicRepository(client as never);\n    const createFundingRepository = () =>\n      dependencies.createFundingRepository\n        ? dependencies.createFundingRepository(client)\n        : new SupabasePlayerStoreFundingPublicRepository(client as never);',
          )
          replace(
              handler,
              '''      const quote = await repository.createQuote({
                ...publicScope,
                itemKey: readPlayerStoreItemKey(body.itemKey),
                quantity: readPlayerStoreQuantity(body.quantity),
                nowIso: (dependencies.now ?? (() => new Date().toISOString()))(),
              });''',
              '''      const quote = await createFundingRepository().createSeededQuote({
                ...publicScope,
                itemKey: readPlayerStoreItemKey(body.itemKey),
                quantity: readPlayerStoreQuantity(body.quantity),
                allocations: readPlayerStoreFundingAllocations(body.allocations),
                idempotencyKey: readPlayerStoreIdempotencyKey(body.idempotencyKey),
                effectiveAt: (dependencies.now ?? (() => new Date().toISOString()))(),
              });''',
          )
          replace(
              handler,
              '''      const receipt = await repository.purchase({
                ...publicScope,
                quoteKey: readPlayerStoreQuoteKey(body.quoteKey),
                idempotencyKey: readPlayerStoreIdempotencyKey(body.idempotencyKey),
                clientSubmittedAt: readPlayerStoreOptionalTimestamp(
                  body.clientSubmittedAt,
                ),
              });''',
              '''      const receipt = await createFundingRepository().settleSeededPurchase({
                ...publicScope,
                quoteKey: readPlayerStoreQuoteKey(body.quoteKey),
                idempotencyKey: readPlayerStoreIdempotencyKey(body.idempotencyKey),
                clientSubmittedAt: readPlayerStoreOptionalTimestamp(
                  body.clientSubmittedAt,
                ),
              });''',
          )
          replace(
              handler,
              '      const quote = await offerRepository.createBusinessOfferQuote({',
              '      const quote = await createFundingRepository().createBusinessOfferQuote({',
          )
          replace(
              handler,
              '        expectedVersion: readPlayerStoreExpectedVersion(body.expectedVersion),\n        idempotencyKey: readPlayerStoreIdempotencyKey(body.idempotencyKey),',
              '        expectedVersion: readPlayerStoreExpectedVersion(body.expectedVersion),\n        allocations: readPlayerStoreFundingAllocations(body.allocations),\n        idempotencyKey: readPlayerStoreIdempotencyKey(body.idempotencyKey),',
          )
          replace(
              handler,
              '        quote: projectPlayerStorePublicOfferQuote(quote),',
              '        quote,',
          )
          replace(
              handler,
              '      const receipt = await offerRepository.purchaseBusinessOffer({',
              '      const receipt = await createFundingRepository().settleBusinessOfferPurchase({',
          )
          replace(
              handler,
              '      const publicReceipt = projectPlayerStorePublicOfferReceipt(receipt);',
              '      const publicReceipt = receipt;',
          )
          replace(
              handler,
              '    const receipt = await offerRepository.readBusinessOfferReceipt({',
              '    const receipt = await createFundingRepository().readBusinessOfferReceipt({',
          )
          replace(
              handler,
              '      receipt: projectPlayerStorePublicOfferReceipt(receipt),',
              '      receipt,',
          )
          Path(handler).write_text(Path(handler).read_text().replace(
              '    const offerRepository = createOfferRepository();\n',
              '',
              1,
          ))
          PY

