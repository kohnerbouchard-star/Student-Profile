          PY

      - name: Add funded Business receipt read RPC and assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          settlement = Path(
              "backend/supabase/migrations/20260827094000_multicurrency_store_funding_settlement_v1.sql"
          )
          source = settlement.read_text()
          if "read_business_store_offer_funding_receipt_v1" not in source:
              body = r'''

          create or replace function public.read_business_store_offer_funding_receipt_v1(
            p_game_session_id uuid,
            p_buyer_player_id uuid,
            p_receipt_key text
          )
          returns jsonb
          language plpgsql
          stable
          security definer
          set search_path = pg_catalog, public, private, economy_private, pg_temp
          as $function$
          declare
            v_receipt_key text := lower(btrim(coalesce(p_receipt_key, '')));
            v_receipt_id uuid;
          begin
            if p_game_session_id is null
               or p_buyer_player_id is null
               or v_receipt_key !~ '^spr_[0-9a-f]{32}$'
            then
              raise exception 'STORE_OFFER_FUNDED_RECEIPT_READ_REQUEST_INVALID'
                using errcode = '22023';
            end if;

            select receipt_row.id
            into v_receipt_id
            from public.store_offer_purchase_receipts as receipt_row
            where receipt_row.game_session_id = p_game_session_id
              and receipt_row.buyer_player_id = p_buyer_player_id
              and receipt_row.public_key = v_receipt_key
              and receipt_row.funding_receipt_id is not null;
            if not found then
              raise exception 'STORE_OFFER_FUNDED_RECEIPT_NOT_FOUND'
                using errcode = 'P0001';
            end if;

            return economy_private.read_store_offer_funding_receipt_result_v1(
              v_receipt_id,
              true
            );
          end
          $function$;

          revoke all on function public.read_business_store_offer_funding_receipt_v1(
            uuid, uuid, text
          ) from public, anon, authenticated;
          grant execute on function public.read_business_store_offer_funding_receipt_v1(
            uuid, uuid, text
          ) to service_role;
          '''
              prefix, marker, suffix = source.rpartition("commit;")
              if not marker or suffix.strip():
                  raise SystemExit("settlement commit marker missing")
              settlement.write_text(prefix.rstrip() + body + "\n\ncommit;\n")

          assertions = Path(
              "backend/supabase/migrations/20260827094500_multicurrency_store_funding_assertions_v1.sql"
          )
          text = assertions.read_text()
          marker = """  if to_regprocedure(
            'public.settle_business_store_offer_funding_v1(uuid,uuid,text,text,integer,bigint,text)'
          ) is null then
            raise exception 'C1_ASSERT_BUSINESS_SETTLEMENT_MISSING';
          end if;
          """
          addition = marker + """

          if to_regprocedure(
            'public.read_business_store_offer_funding_receipt_v1(uuid,uuid,text)'
          ) is null then
            raise exception 'C1_ASSERT_BUSINESS_RECEIPT_READ_MISSING';
          end if;
          """
          if "C1_ASSERT_BUSINESS_RECEIPT_READ_MISSING" not in text:
              if marker not in text:
                  raise SystemExit("assertion function marker missing")
              text = text.replace(marker, addition, 1)
          privilege_marker = """  if has_function_privilege(
            'service_role',
            'private.store_funding_normalize_allocations_v1(jsonb)',
          """
          privilege = """  if has_function_privilege(
            'anon',
            'public.read_business_store_offer_funding_receipt_v1(uuid,uuid,text)',
            'EXECUTE'
          ) or has_function_privilege(
            'authenticated',
            'public.read_business_store_offer_funding_receipt_v1(uuid,uuid,text)',
            'EXECUTE'
          ) or not has_function_privilege(
            'service_role',
            'public.read_business_store_offer_funding_receipt_v1(uuid,uuid,text)',
            'EXECUTE'
          ) then
            raise exception 'C1_ASSERT_BUSINESS_RECEIPT_READ_GRANTS_INVALID';
          end if;

          """ + privilege_marker
          if "C1_ASSERT_BUSINESS_RECEIPT_READ_GRANTS_INVALID" not in text:
              if privilege_marker not in text:
                  raise SystemExit("assertion privilege marker missing")
              text = text.replace(privilege_marker, privilege, 1)
          assertions.write_text(text)
          PY

      - name: Expand C1 PR authority and source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          authority_path = Path(
              "docs/operations/contracts/player-cross-cutting/pr-674.json"
          )
          authority = json.loads(authority_path.read_text())
          additions = [
            "backend/src/domains/store/api/playerStorePublicHttpHandler.ts",
            "backend/src/domains/store/api/playerStorePublicRequestValidation.ts",
            "backend/src/domains/store/contracts/playerStoreFundingPublicContracts.ts",
            "backend/src/domains/store/contracts/playerStoreOfferPublicContracts.ts",
            "backend/src/domains/store/infrastructure/supabasePlayerStoreFundingPublicRepository.ts",
            "backend/src/domains/store/infrastructure/supabasePlayerStoreOfferPublicRepository.ts",
          ]
          authority["allowedPaths"] = sorted(set(authority["allowedPaths"] + additions))
          authority_path.write_text(json.dumps(authority, indent=2) + "\n")

          contract = Path("scripts/multicurrency-store-funding-contract.mjs")
          text = contract.read_text()
          text = text.replace(
              '  assertions: "backend/supabase/migrations/20260827094500_multicurrency_store_funding_assertions_v1.sql",\n});',
              '  assertions: "backend/supabase/migrations/20260827094500_multicurrency_store_funding_assertions_v1.sql",\n  handler: "backend/src/domains/store/api/playerStorePublicHttpHandler.ts",\n  validation: "backend/src/domains/store/api/playerStorePublicRequestValidation.ts",\n  fundingContracts: "backend/src/domains/store/contracts/playerStoreFundingPublicContracts.ts",\n  fundingRepository: "backend/src/domains/store/infrastructure/supabasePlayerStoreFundingPublicRepository.ts",\n});',
              1,
          )
          text = text.replace(
              'const assertions = text(paths.assertions);\n',
              'const assertions = text(paths.assertions);\nconst handler = text(paths.handler);\nconst validation = text(paths.validation);\nconst fundingContracts = text(paths.fundingContracts);\nconst fundingRepository = text(paths.fundingRepository);\n',
              1,
          )
          marker = 'assert.match(assertions, /has_function_privilege/u);\n'
          checks = marker + '''assert.match(assertions, /read_business_store_offer_funding_receipt_v1/u);
          assert.match(handler, /createFundingRepository/u);
          assert.match(handler, /readPlayerStoreFundingAllocations/u);
          assert.match(fundingContracts, /PlayerStoreFundingAllocationInput/u);
          assert.match(fundingRepository, /create_seeded_store_funding_quote_v1/u);
          assert.match(fundingRepository, /settle_seeded_store_funding_v1/u);
          assert.match(fundingRepository, /create_business_store_offer_funding_quote_v1/u);
          assert.match(fundingRepository, /settle_business_store_offer_funding_v1/u);
          assert.match(fundingRepository, /read_business_store_offer_funding_receipt_v1/u);
          assert.match(validation, /one to three Checking accounts/u);
          assert.doesNotMatch(handler, /repository\.purchase\(/u);
          assert.doesNotMatch(handler, /repository\.createQuote\(/u);
          '''
          if "createFundingRepository" not in text:
              if marker not in text:
                  raise SystemExit("source contract marker missing")
              text = text.replace(marker, checks, 1)
          contract.write_text(text)
          PY

