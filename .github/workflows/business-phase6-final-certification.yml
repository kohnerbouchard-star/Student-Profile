name: Business Phase 6 Final Certification

on:
  push:
    branches:
      - feat/business-timed-manufacturing-v2
    paths:
      - .github/workflows/business-phase6-final-certification.yml

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out exact Phase 6 branch
        uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0

      - name: Synchronize exact-path verification authority
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/business-equipment-capacity-v2
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          path = Path("docs/operations/contracts/player-cross-cutting-verification-authority-v1.json")
          authority = json.loads(path.read_text())
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "origin/feat/business-equipment-capacity-v2...HEAD"],
              text=True,
          ).splitlines()
          temporary = {
              ".github/workflows/business-phase6-deterministic-repair.yml",
              ".github/workflows/business-phase6-source-correction.yml",
              ".github/workflows/business-phase6-authority-sync.yml",
              ".github/workflows/business-phase6-head-corrector.yml",
              "docs/roadmaps/.phase6-head-correction-trigger",
              "sitecustomize.py",
              "pathlib.py",
          }
          allowed = {item for item in changed if item and item not in temporary}
          allowed.update({
              ".github/workflows/business-phase6-final-certification.yml",
              "docs/operations/contracts/player-cross-cutting-verification-authority-v1.json",
              "scripts/player-cross-cutting-authority.test.mjs",
              "scripts/verify-player-cross-cutting-authority.mjs",
          })
          authority["pullRequestNumber"] = 661
          authority["baseRef"] = "feat/business-equipment-capacity-v2"
          authority["scopeLock"] = "exact-path-allowlist"
          authority["productionDeploymentAllowed"] = False
          authority["productionMutationAllowed"] = False
          authority["secretValuesAllowed"] = False
          authority["allowedPaths"] = sorted(allowed)
          path.write_text(json.dumps(authority, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/contracts/player-cross-cutting-verification-authority-v1.json
          if ! git diff --cached --quiet; then
            git commit -m "test(player): freeze Phase 6 certification authority"
            git push origin HEAD:feat/business-timed-manufacturing-v2
          fi
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "Frozen Phase 6 implementation source: ${source_sha}"

      - name: Wait for exact-source required workflows
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          repo = os.environ["REPOSITORY"]
          sha = os.environ["SOURCE_SHA"]
          token = os.environ["GH_TOKEN"]
          required = [
              "Business Timed Manufacturing V2",
              "Business Manufacturing Resource Hold V2",
              "Business Timed Manufacturing Resource Hold V2",
              "Business Manufacturing Completion V2",
              "Database Replay",
              "Backend Typecheck",
              "Player Terminal Verify",
              "Business Banking Runtime",
              "Business Economy V2",
              "Business Workforce Production Payroll V2",
              "Repository Quality",
              "Supply Chain Security",
              "Admin API Check",
              "Staging Readiness Preflight",
              "Required Game Market Timezone",
              "Exchange Calendar Runtime",
          ]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "econovaria-phase6-certifier",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          deadline = time.time() + 48 * 60
          latest = {}
          while time.time() < deadline:
              payload = get_json(
                  f"https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100"
              )
              latest = {}
              for run in payload.get("workflow_runs", []):
                  name = run.get("name")
                  current = latest.get(name)
                  if current is None or run.get("created_at", "") > current.get("created_at", ""):
                      latest[name] = run

              missing = [name for name in required if name not in latest]
              pending = [
                  name for name in required
                  if name in latest and latest[name].get("status") != "completed"
              ]
              failed = [
                  name for name in required
                  if name in latest
                  and latest[name].get("status") == "completed"
                  and latest[name].get("conclusion") != "success"
              ]
              print(json.dumps({
                  "sourceSha": sha,
                  "missing": missing,
                  "pending": pending,
                  "failed": failed,
              }, sort_keys=True))
              if failed:
                  details = {
                      name: {
                          "id": latest[name].get("id"),
                          "conclusion": latest[name].get("conclusion"),
                          "htmlUrl": latest[name].get("html_url"),
                      }
                      for name in failed
                  }
                  Path("phase6-gate-failure.json").write_text(
                      json.dumps({"sourceSha": sha, "failed": details}, indent=2) + "\n"
                  )
                  raise SystemExit(f"Phase 6 exact-source gate failed: {json.dumps(details)}")
              if not missing and not pending:
                  break
              time.sleep(20)
          else:
              raise SystemExit("Timed out waiting for the complete Phase 6 exact-source gate.")

          evidence = {
              name: {
                  "runId": latest[name]["id"],
                  "conclusion": latest[name]["conclusion"],
                  "htmlUrl": latest[name]["html_url"],
              }
              for name in required
          }
          Path("phase6-gate-evidence.json").write_text(
              json.dumps({"sourceSha": sha, "workflows": evidence}, indent=2) + "\n"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"source_sha={sha}\n")
              output.write("evidence_json<<EOF\n")
              output.write(json.dumps(evidence, sort_keys=True))
              output.write("\nEOF\n")
          PY

      - name: Write durable Phase 6 certification
        env:
          SOURCE_SHA: ${{ steps.gates.outputs.source_sha }}
          EVIDENCE_JSON: ${{ steps.gates.outputs.evidence_json }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import datetime
          import json
          import os
          import re

          source = os.environ["SOURCE_SHA"]
          evidence = json.loads(os.environ["EVIDENCE_JSON"])
          date = datetime.date.today().isoformat()
          evidence_lines = "\n".join(
              f"- **{name} — PASS** (`{payload['runId']}`)."
              for name, payload in evidence.items()
          )

          scope_path = Path("docs/roadmaps/business-phase6-timed-manufacturing-scope-v1.md")
          scope = scope_path.read_text()
          scope = re.sub(
              r"\*\*Status:\*\*[^\n]*",
              "**Status:** COMPLETE — timed manufacturing lifecycle, atomic resource holds, exact-once completion, cancellation/failure recovery, Player cutover, and full verification certified",
              scope,
              count=1,
          )
          if "## Certified Phase 6 result" not in scope:
              scope += f"""

## Certified Phase 6 result

- **Exact implementation and verification source:** `{source}`.
- Timed manufacturing jobs are server-owned and derive start/completion timing from canonical recipe, game difficulty, and current availability policy.
- Atomic start moves exact canonical BOM quantities from Business Warehouse into WIP, reserves eligible labor and installed equipment, and creates one idempotent queued job only after all holds commit.
- Bounded workers start and lease jobs in deterministic same-game order with `FOR UPDATE SKIP LOCKED`, lease expiry, retry backoff, and attempt ceilings.
- Completion consumes exact WIP, creates canonical output in Finished Goods, carries material plus labor allocation into cost basis without a second payroll debit, and consumes labor/equipment holds exactly once.
- Cancellation and terminal failure release or reverse material, labor, and equipment resources exactly once without leaking capacity or output.
- Player reads and mutations use public keys only; internal UUIDs, accounts, leases, request hashes, ownership metadata, and worker tokens remain private.
- The legacy instant-production path is retired behind the explicit timed-manufacturing compatibility boundary.
- Store seller offers, automatic sales convergence, durability/repair economics, equity/IPO, merge, staging, and production deployment remain outside Phase 6.

### Exact-source verification

{evidence_lines}

### Phase 6 exit result

Every Phase 6 completion rule in this scope is met on `{source}`. Phase 7 — Business Store seller offers and sellable Finished Goods — is the next authorized phase.
"""
          scope_path.write_text(scope)

          plan_path = Path("docs/roadmaps/business-v2-development-execution-plan-v1.md")
          plan = plan_path.read_text()
          plan = re.sub(
              r"(## Phase 6[^\n]*\n)(?:\*\*Status:\*\*[^\n]*\n)?",
              r"\1**Status:** COMPLETE — certified on `" + source + "`\n",
              plan,
              count=1,
              flags=re.IGNORECASE,
          )
          if "Phase 6 certified checkpoint" not in plan:
              plan += f"""

### Phase 6 certified checkpoint

- Exact implementation and verification source: `{source}`.
- Atomic canonical Warehouse → WIP material holds, deterministic labor/equipment reservations, server-derived timing, bounded queue/due-job workers, exact-once Finished Goods completion, and cancellation/failure recovery are complete.
- Player manufacturing reads and mutations are public-key-only and the instant-production compatibility path is retired.
- **Phase 7 — Store seller offers and sellable Finished Goods is OPEN.**
"""
          plan_path.write_text(plan)

          log_path = Path("docs/roadmaps/business-v2-development-execution-log-v1.md")
          log = log_path.read_text()
          marker = f"Phase 6 COMPLETE: timed manufacturing (`{source}`)"
          if marker not in log:
              log += f"""

---

## {date} — Phase 6 COMPLETE: timed manufacturing (`{source}`)

### Certified source and repository state

- **Exact certified implementation and verification source:** `{source}`.
- Feature branch: `feat/business-timed-manufacturing-v2`.
- Stacked draft PR: #661, based on certified Phase 5 branch `feat/business-equipment-capacity-v2`.
- PR #661 remained open, draft, unmerged, and undeployed at certification.
- Integration PR #648 remained open, draft, and unmerged.
- No merge, staging deployment, production deployment, secret mutation, or live database mutation occurred.
- Documentation commits after the tested source record certification only and must not replace `{source}` as implementation evidence.

### What is now authoritative

- `business_manufacturing_jobs` is the sole timed Business manufacturing lifecycle authority.
- The server resolves one active Business-owned physical product to one canonical recipe and exact canonical output; ambiguous or unavailable recipes fail closed.
- Atomic job start moves exact BOM quantities from canonical Business Warehouse into WIP and reserves role/headcount/skill-constrained labor plus capability-constrained installed equipment before a queued job exists.
- Matching idempotency replays one job; conflicting reuse is rejected; concurrent requests cannot double-spend materials or double-book labor/equipment.
- Queue start and due completion claims use bounded deterministic ordering, row locks, `FOR UPDATE SKIP LOCKED`, expiring leases, retry backoff, and attempt limits.
- Completion consumes exact WIP, creates exact canonical output in Finished Goods, carries actual material basis and labor allocation into output basis, and consumes reservations exactly once without another wage cash debit.
- Cancellation/failure recovery reverses or releases every held resource exactly once and terminal jobs are immutable.
- Player manufacturing APIs and reads expose public keys and stable lifecycle data only; trusted IDs, accounts, leases, hashes, and raw snapshots remain server-private.

### Exact-source verification

{evidence_lines}

### Phase 6 exit result

- Atomic material/WIP, labor, and equipment job start: **met**.
- Server-owned timing and bounded worker lifecycle: **met**.
- Exact-once completion into Finished Goods and cost basis: **met**.
- Cancellation/failure release and recovery: **met**.
- Authenticated Player cutover and public-key-only read/UI boundary: **met**.
- Concurrency, idempotency, two-game isolation, database replay, backend, Edge, security, repository, Player, and Chromium gates: **met**.
- Exact source and durable scope/plan/log evidence: **met**.
- No production deployment or live mutation: **met**.

### Remaining exclusions and next authorized step

Store seller offers, Store-listing inventory, withdrawal safety, automatic sales convergence, durability/repair economics, corporate equity/IPO publication, merge, staging, and production deployment remain unauthorized. **Phase 7 — Store seller offers and sellable Finished Goods is OPEN.**
"""
          log_path.write_text(log)
          PY

          rm -f \
            .github/workflows/business-phase6-final-certification.yml \
            .github/workflows/business-phase6-deterministic-repair.yml \
            .github/workflows/business-phase6-source-correction.yml \
            .github/workflows/business-phase6-authority-sync.yml \
            .github/workflows/business-phase6-head-corrector.yml \
            docs/roadmaps/.phase6-head-correction-trigger \
            sitecustomize.py \
            pathlib.py \
            phase6-gate-evidence.json \
            phase6-gate-failure.json
          git diff --check

      - name: Commit durable certification
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(business): certify Phase 6 timed manufacturing"
          git push origin HEAD:feat/business-timed-manufacturing-v2
          echo "certification_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Update draft PR certification record
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.gates.outputs.source_sha }}
          CERTIFICATION_SHA: ${{ steps.commit.outputs.certification_sha }}
          EVIDENCE_JSON: ${{ steps.gates.outputs.evidence_json }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = os.environ["SOURCE_SHA"]
          certification = os.environ["CERTIFICATION_SHA"]
          evidence = json.loads(os.environ["EVIDENCE_JSON"])
          checks = "\n".join(
              f"- {name} (`{payload['runId']}`)"
              for name, payload in evidence.items()
          )
          body = f"""## Certified scope

Phase 6 replaces instant physical Business production with an authoritative server-timed manufacturing lifecycle. It remains stacked on certified Phase 5 branch `feat/business-equipment-capacity-v2`.

- **Exact Phase 6 implementation and verification source:** `{source}`.
- **Durable Phase 6 certification head:** `{certification}`.
- Parent PR: #660.

This PR remains intentionally **draft, open, unmerged, and undeployed**. It does not authorize merge, staging deployment, production deployment, secret mutation, or live database mutation.

## Certified authority boundary

- exact canonical Warehouse → WIP material movement, labor reservations, and installed-equipment reservations commit atomically before one queued manufacturing job exists;
- start and completion timing are server-derived; the browser cannot declare timestamps, resource use, output, or success;
- queue and due-job workers are bounded, game-scoped, deterministically ordered, lease-based, and safe under concurrent claims;
- exact WIP consumption, Finished Goods output, material/labor cost basis, and labor/equipment consumption commit once;
- cancellation and terminal failure release every held resource once;
- Player mutations and reads use public keys only, and internal UUIDs/accounts/leases/hashes remain private;
- the legacy instant-production path is retired behind the timed-manufacturing compatibility boundary.

## Exact-source verification

{checks}

## Explicit exclusions

Store seller offers, Store-listing inventory, automatic sales convergence, durability/repair economics, equity/IPO publication, merge, staging deployment, production deployment, secret changes, and live data mutation remain outside Phase 6.

**Next authorized phase: Phase 7 — Store seller offers and sellable Finished Goods.**
"""
          Path("/tmp/pr-body.md").write_text(body)
          PY
          gh pr edit 661 \
            --repo "${{ github.repository }}" \
            --title "Draft: Business V2 Phase 6 timed manufacturing — certified" \
            --body-file /tmp/pr-body.md
