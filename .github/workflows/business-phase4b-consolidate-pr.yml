name: Business Phase 4B Consolidate PR

on:
  pull_request:
    paths:
      - ".github/workflows/business-phase4b-consolidate-pr.yml"
      - "scripts/business-phase4b-ratchet-normalize.py"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: business-phase4b-consolidate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  consolidate:
    if: github.event.pull_request.number == 658
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FEATURE_BRANCH: feat/business-workforce-hiring-v2
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/business-workforce-hiring-v2
          fetch-depth: 0

      - name: Capture starting head
        id: start
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            player-terminal/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Materialize normalized Phase 4B source
        shell: bash
        run: |
          python3 scripts/business-phase4b-consolidate.py
          python3 scripts/business-phase4b-ratchet-normalize.py

      - name: Remove one-use orchestration residue
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/roadmaps/business-phase4b-implementation-diagnostics.md
          rm -f scripts/business-phase4b-payload.py
          rm -f scripts/business-phase4b-consolidate.py
          rm -f scripts/business-phase4b-ratchet-normalize.py
          rm -f .github/workflows/business-phase4b-source-bundle.yml
          rm -f .github/workflows/business-phase4b-implement.yml
          rm -f .github/workflows/business-phase4b-implement-v2.yml
          rm -f .github/workflows/business-phase4b-controller.yml
          rm -f .github/workflows/business-phase4b-remediate.yml
          rm -f .github/workflows/business-phase4b-converge.yml
          rm -f .github/workflows/business-phase4b-finalize.yml
          rm -f .github/workflows/business-phase4b-finalize-v2.yml
          rm -f .github/workflows/business-phase4b-finalize-v3.yml
          rm -f .github/workflows/business-phase4b-consolidate-v4.yml
          rm -f .github/workflows/business-phase4b-trigger-consolidation-fix.yml
          rm -f .github/workflows/business-phase4c-bootstrap.yml
          rm -f .github/workflows/business-phase4c-bootstrap-v2.yml
          rm -f .github/workflows/business-phase4b-consolidate-pr.yml
          test -f .github/workflows/business-workforce-hiring-v2.yml

      - name: Regenerate deterministic architecture inventory
        shell: bash
        run: |
          node scripts/architecture/build-architecture-inventory.mjs
          git add docs/architecture/inventories/econovaria-architecture-inventory-v2.json

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm --prefix backend ci --ignore-scripts
          npm --prefix player-terminal ci --no-audit --no-fund

      - name: Verify Phase 4B source contracts and migrations
        shell: bash
        run: |
          set -euo pipefail
          node scripts/business-workforce-hiring-contract.mjs
          node scripts/business-banking-runtime-contract.mjs
          node scripts/validate-supabase-migrations.mjs
          git diff --check

      - name: Run repository quality suite
        run: npm test

      - name: Run backend typecheck and focused tests
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix backend run typecheck
          cd backend
          deno test --config supabase/functions/classroom-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            src/domains/business/api/playerBusinessWorkforceHiring.test.ts \
            src/domains/business/api/playerBusinessRoutePaths.test.ts

      - name: Run complete Player Terminal verification
        run: npm --prefix player-terminal run verify

      - name: Commit immutable Phase 4B implementation source
        env:
          START_SHA: ${{ steps.start.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git fetch origin "$FEATURE_BRANCH"
          test "$(git rev-parse origin/$FEATURE_BRANCH)" = "$START_SHA"
          git config user.name econovaria-phase4b-consolidator
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "feat(business): Phase 4B candidate hiring source"
          git push origin HEAD:"$FEATURE_BRANCH"
