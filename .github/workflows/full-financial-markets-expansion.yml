name: Full Financial Markets Expansion

on:
  push:
    branches:
      - agent/full-financial-markets-expansion-v1
    paths:
      - ".github/workflows/full-financial-markets-expansion.yml"
      - "backend/src/domains/markets/**"
      - "docs/markets/**"
      - "docs/seed-content/markets/universe/**"
      - "scripts/validate-full-market-universe*.mjs"
      - "scripts/review-full-market-universe*.mjs"
      - "scripts/lib/full-market-universe-validator.mjs"
      - "scripts/lib/full-market-editorial-review.mjs"
  pull_request:
    branches:
      - main
    paths:
      - "docs/operations/contracts/player-cross-cutting/pr-981.json"
      - "docs/operations/contracts/player-cross-cutting/pr-980.json"
      - "docs/operations/contracts/player-cross-cutting/pr-979.json"
      - "docs/operations/contracts/player-cross-cutting/pr-978.json"
      - "docs/operations/contracts/player-cross-cutting/pr-977.json"
      - ".github/workflows/full-financial-markets-expansion.yml"
      - "backend/src/domains/markets/**"
      - "docs/markets/**"
      - "docs/seed-content/markets/universe/**"
      - "scripts/validate-full-market-universe*.mjs"
      - "scripts/review-full-market-universe*.mjs"
      - "scripts/lib/full-market-universe-validator.mjs"
      - "scripts/lib/full-market-editorial-review.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-financial-markets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-domain-and-universe:
    name: Validate safe-hold financial-markets tranche
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install root dependencies
        run: npm ci

      - name: Install Backend dependencies
        run: npm --prefix backend ci

      - name: Enforce controller-hold file boundary
        env:
          HELD14_EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            [[ "$HELD14_EVENT_BASE" =~ ^[a-f0-9]{40}$ ]]
            git fetch origin "$HELD14_EVENT_BASE" --no-tags
            merge_base="$HELD14_EVENT_BASE"
            node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const pr = event.pull_request;
          const repository = 'kohnerbouchard-star/Student-Profile';
          assert.equal(process.env.GITHUB_REPOSITORY, repository);
          assert.equal(event.repository?.full_name, repository);
          assert.equal(pr?.base?.repo?.full_name, repository);
          assert.equal(pr?.head?.repo?.full_name, repository);
          assert.equal(pr?.base?.ref, 'main');
          assert(Number.isSafeInteger(event.number) && event.number > 0);
          assert.equal(pr.number, event.number);
          assert.equal(pr.base.sha, process.env.HELD14_EVENT_BASE);
          assert(/^[a-f0-9]{40}$/.test(pr.head.sha));
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          assert.equal(git('rev-parse', 'HEAD'), pr.head.sha);
          assert.equal(git('merge-base', pr.base.sha, pr.head.sha), pr.base.sha);
          NODE
          else
            git fetch origin main --no-tags
            merge_base="$(git merge-base HEAD origin/main)"
          fi
          admit_reviewed_snapshot() {
            test "$GITHUB_EVENT_NAME" = "pull_request"
            trusted_directory="$(mktemp -d)"
            trusted_validator="$trusted_directory/verify-held14-admission.mjs"
            trap 'rm -rf "$trusted_directory"' EXIT
            if git cat-file -e "$merge_base:scripts/verify-held14-admission.mjs"; then
              git show "$merge_base:scripts/verify-held14-admission.mjs" > "$trusted_validator"
              git show "$merge_base:scripts/held14-admission-contracts.mjs" > "$trusted_directory/held14-admission-contracts.mjs"
              node "$trusted_validator" --mode markets
            else
              # Initial CI-policy review is the bootstrap trust root, not this PR's digest.
              # This verifier accepts ONLY control PR979 on exact f5db; never source PRs.
              bootstrap_pr="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.env.GITHUB_EVENT_PATH,"utf8")).number')"
              if [ "$merge_base" != "f5db830bca8aab9fad2b04c028563b32dfd38ef2" ] || [ "$bootstrap_pr" != "979" ]; then
                echo "Initial bootstrap is restricted to control PR979 on exact f5db." >&2
                return 1
              fi
              node scripts/verify-held14-control-bootstrap.mjs
            fi
          }
          git diff --no-renames --name-only -z "$merge_base" HEAD > held14-changed-paths.bin
          git diff --raw --no-abbrev --no-renames -z "$merge_base" HEAD > held14-changed-entries.bin
          node --input-type=module <<'NODE' > full-market-changed-files.txt
          import { readFileSync } from 'node:fs';
          const entries = readFileSync('held14-changed-entries.bin', 'utf8').split('\0');
          for (let index = 0; index < entries.length - 1; index += 2) {
            if (!/^:(000000|100644|100755) (000000|100644|100755) /.test(entries[index])) throw new Error('Symlink/submodule file boundary violation');
          }
          const paths = readFileSync('held14-changed-paths.bin', 'utf8').split('\0').filter(Boolean);
          if (!paths.every((path) => /^[A-Za-z0-9_./-]+$/.test(path))) throw new Error('Non-canonical changed path');
          process.stdout.write(paths.map((path) => `${path}\n`).join(''));
          NODE
          forbidden='^(backend/supabase/migrations/|backend/supabase/functions/classroom-api/|backend/supabase/functions/admin-api/|backend/src/domains/players/contracts/playerCapabilityManifestContracts\.ts$|backend/src/security/playerRateLimitDispatch\.ts$|player-terminal/src/api/backend-routes\.js$|player-terminal/src/integrations/student-profile-capability-manifest\.js$)'
          if grep -E "$forbidden" full-market-changed-files.txt; then
            echo "Controller-hold boundary violation detected."
            admit_reviewed_snapshot
          fi

      - name: Test finite held14 admission boundary
        run: node --test scripts/held14-admission.test.mjs scripts/held14-control-bootstrap.test.mjs

      - name: Validate complete inactive definition library
        run: |
          node scripts/validate-full-market-universe.mjs \
            --report full-market-universe-validation.json \
            > full-market-universe-validation.stdout.json

      - name: Build deterministic editorial reports
        run: |
          node scripts/review-full-market-universe.mjs \
            --report full-market-editorial-review.json \
            --transformation-plan full-market-editorial-transformation-plan.json \
            > full-market-editorial-review.stdout.json

      - name: Run universe and editorial validator tests
        run: |
          node --test scripts/validate-full-market-universe.test.mjs
          node --test scripts/review-full-market-universe.test.mjs
          node --test scripts/validate-full-market-universe-source-reader.test.mjs

      - name: Run financial-market domain tests
        run: |
          set +e
          deno test --no-lock backend/src/domains/markets \
            > financial-market-domain-tests.log 2>&1
          status=$?
          cat financial-market-domain-tests.log
          echo "$status" > financial-market-domain-tests.status
          exit "$status"

      - name: Run relevant existing stock engine tests
        run: |
          deno test --no-lock \
            backend/src/domains/stocks/calculations/stockMarketEngine.test.ts

      - name: Generate deterministic reference simulation
        run: |
          deno run --allow-write \
            backend/src/domains/markets/simulations/runReferenceMarketSimulation.ts \
            --output full-financial-markets-reference-simulation.json \
            > full-financial-markets-reference-simulation.stdout.json

      - name: Run Backend typecheck
        run: npm --prefix backend run typecheck:all

      - name: Run Backend smoke
        run: npm --prefix backend run smoke

      - name: Verify continuation formatting and source quality
        run: |
          deno fmt --check \
            backend/src/domains/markets/simulations/runReferenceMarketSimulation.ts
          git diff --check

      - name: Verify prohibited features remain disabled
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const contracts = [
            'backend/src/domains/markets/contracts/financialMarketContracts.ts',
            'backend/src/domains/markets/contracts/financialMarketTradingContracts.ts',
            'backend/src/domains/markets/contracts/financialMarketInvestmentContracts.ts',
          ].map((file) => fs.readFileSync(file, 'utf8')).join('\n');
          const guards = fs.readFileSync(
            'backend/src/domains/markets/validation/publicContractGuards.ts',
            'utf8',
          );
          const required = [
            'shortSellingSupported: false',
            'derivativesSupported: false',
            'physicalDeliverySupported: false',
            'complexPricingSupported: false',
            'activationAuthorized: false',
            'realWorldFeedsSupported: false',
            'automaticFullUniverseActivationSupported: false',
          ];
          const source = `${contracts}\n${guards}`;
          for (const marker of required) {
            if (!source.includes(marker)) {
              throw new Error(`Missing fail-closed contract marker: ${marker}`);
            }
          }
          NODE

      - name: Upload deterministic validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-financial-markets-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            full-market-changed-files.txt
            full-market-universe-validation.json
            full-market-universe-validation.stdout.json
            full-market-editorial-review.json
            full-market-editorial-review.stdout.json
            full-market-editorial-transformation-plan.json
            full-financial-markets-reference-simulation.json
            full-financial-markets-reference-simulation.stdout.json
            financial-market-domain-tests.log
            financial-market-domain-tests.status
          if-no-files-found: warn
          retention-days: 30
