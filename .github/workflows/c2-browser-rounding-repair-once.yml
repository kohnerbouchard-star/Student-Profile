              endpoints,
            };
          }

          function dashboard() {
            return {
              ok: true,
              gameSession: {
                id: GAME_ID,
                name: "Marketplace Browser Game",
                status: "active",
                marketStatus: "open",
                currentTick: 42,
                updatedAt: NOW,
              },
              me: {
                playerId: "PLAYER-42",
                displayName: "Marketplace Tester",
                rosterLabel: "Trader 42",
                countryCode: "LUMENOR",
                netWorth: 1000,
                cash: {
                  balances: [{ accountType: "checking", currencyCode: "LUM", balance: 500 }],
                  primaryCurrencyCode: "LUM",
                  totalBalance: 500,
                },
                stocks: {
                  portfolio: {
                    totalMarketValue: 0,
                    totalCostBasis: 0,
                    totalRealizedPnl: 0,
                    totalUnrealizedPnl: 0,
                    totalPnl: 0,
                  },
                  holdings: [],
                  orders: [],
                  trades: [],
                },
                store: { currencyCode: "LUM", listings: [], inventory: [], recentPurchases: [] },
                contracts: { available: [], progress: [] },
              },
              public: {
                leaderboard: [],
                players: [],
                market: { stocks: [], news: [] },
                contracts: [],
                storeListings: [],
              },
              unseenCutscenes: [],
              realtime: { publicChannel: `game:${GAME_ID}:public`, lastSequence: null, events: [] },
            };
          }

          function marketplace() {
            return {
              ok: true,
              marketplace: {
                policy: {
                  marketplaceEnabled: true,
                  crossCountryTradingEnabled: true,
                  moderationRequired: false,
                  feeRate: 0.025,
                  taxRate: 0.01,
                  listingDurationHours: 168,
                  purchaseReservationMinutes: 5,
                  disputeWindowDays: 7,
                  disputesEnabled: true,
                },
                listings: [{
                  id: LISTING_ID,
                  itemId: "data-chip",
                  name: "Data Chip",
                  description: "Encrypted market data used for browser verification.",
                  category: "Equipment",
                  image: null,
                  country: "lumenor",
                  condition: "Like New",
                  seller: "Nova Trader",
                  sellerReference: "PLAYER-77",
                  unitPrice: 15,
                  currencyCode: "LUM",
                  quantity: 2,
                  status: "active",
                  version: 7,
                  expiresAt: "2099-08-29T01:00:00.000Z",
                  createdAt: NOW,
                  updatedAt: NOW,
                  moderationReason: null,
                  mine: false,
                }],
                myListings: [],
                reservations: [],
                orders: [],
                disputes: [],
                summary: { listingCount: 1, activeSellers: 1, volume: 30 },
              },
            };
          }

          function inventory() {
            return {
              ok: true,
              inventory: {
                items: [{
                  inventoryId: "inv_11111111111111111111111111111111",
                  itemId: "itm_11111111111111111111111111111111",
                  itemKey: "data-chip",
                  name: "Data Chip",
                  description: "Encrypted market data.",
                  category: "Equipment",
                  quantity: 3,
                  quantityReserved: 1,
                  quantityAvailable: 2,
                  image: null,
                }],
                capacityUsed: 3,
                capacityMax: 100,
              },
            };
          }

          function bankingFx() {
            return {
              configured: true,
              generatedAt: NOW,
              currencies: [{ currencyCode: "LUM", minorUnit: 2 }],
              balances: [{
                accountKey: ACCOUNT_ID,
                accountKind: "checking",
                currencyCode: "LUM",
                postedAmount: 500,
                heldAmount: 0,
                availableAmount: 500,
              }],
              fixing: {
                fixingKey: FIXING_ID,
                effectiveAt: NOW,
                calculatedAt: NOW,
                nextFixingAt: "2099-08-29T08:00:00.000Z",
                overdue: false,
                policyVersion: "daily-fixing-v1",
              },
