name: C2 browser and rounding repair once

on:
  push:
    branches:
      - feat/multicurrency-marketplace-funding-v1
    paths:
      - .github/workflows/c2-browser-rounding-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/multicurrency-marketplace-funding-v1
          fetch-depth: 0

      - name: Repair Marketplace currency precision and browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              target.write_text(source.replace(old, new, 1))

          page = "player-terminal/src/pages/marketplace-page.js"
          replace_once(
              page,
              '''function decimalInput(value) {
                const number = Number(value);
                if (!Number.isFinite(number) || number <= 0) return "";
                return number.toFixed(4).replace(/0+$/u, "").replace(/\\.$/u, "");
              }
          ''',
              '''function currencyMinorUnit(data, currencyCode) {
                const code = String(currencyCode || "").trim().toUpperCase();
                const currencies = Array.isArray(data?.bankingFx?.currencies)
                  ? data.bankingFx.currencies
                  : [];
                const minorUnit = Number(
                  currencies.find((entry) => entry?.currencyCode === code)?.minorUnit,
                );
                return Number.isSafeInteger(minorUnit) && minorUnit >= 0 && minorUnit <= 4
                  ? minorUnit
                  : 2;
              }
              function roundCurrency(value, minorUnit) {
                const factor = 10 ** minorUnit;
                return Math.round((Number(value) + Number.EPSILON) * factor) / factor;
              }
              function estimatedMarketplaceBill(data, market, listing, quantity = 1) {
                const minorUnit = currencyMinorUnit(data, listing?.currencyCode);
                const subtotal = roundCurrency(
                  Math.max(0, Number(listing?.unitPrice) || 0) * Math.max(0, Number(quantity) || 0),
                  minorUnit,
                );
                const feeAmount = roundCurrency(
                  subtotal * Math.max(0, Number(market?.platformFeeRate) || 0) / 100,
                  minorUnit,
                );
                const taxAmount = roundCurrency(
                  subtotal * Math.max(0, Number(market?.taxRate) || 0) / 100,
                  minorUnit,
                );
                return roundCurrency(subtotal + feeAmount + taxAmount, minorUnit);
              }
              function decimalInput(value, minorUnit = 4) {
                const number = Number(value);
                if (!Number.isFinite(number) || number <= 0) return "";
                const precision = Number.isSafeInteger(minorUnit)
                  ? Math.min(4, Math.max(0, minorUnit))
                  : 4;
                return number.toFixed(precision).replace(/0+$/u, "").replace(/\\.$/u, "");
              }
          ''',
          )
          replace_once(
              page,
              '''function fundingAccountRows(accounts, estimatedTotal) {
                return [0, 1, 2].map((index) => {
                  const first = index === 0 ? accounts[0] : null;
                  return `<fieldset data-player-marketplace-funding-row><legend>ACCOUNT ${index + 1}</legend><label>CHECKING ACCOUNT<select name="sourceAccountKey" ${index === 0 ? "required" : ""}>${accountOptions(accounts, first?.accountKey || "")}</select></label><label>LISTING-CURRENCY ALLOCATION<input name="targetAmount" type="number" min="0.0001" step="0.0001" value="${index === 0 ? escapeHtml(decimalInput(estimatedTotal)) : ""}" ${index === 0 ? "required" : ""} /></label></fieldset>`;
                }).join("");
              }
          ''',
              '''function fundingAccountRows(accounts, estimatedTotal, minorUnit) {
                const increment = decimalInput(10 ** -minorUnit, minorUnit);
                return [0, 1, 2].map((index) => {
                  const first = index === 0 ? accounts[0] : null;
                  return `<fieldset data-player-marketplace-funding-row><legend>ACCOUNT ${index + 1}</legend><label>CHECKING ACCOUNT<select name="sourceAccountKey" ${index === 0 ? "required" : ""}>${accountOptions(accounts, first?.accountKey || "")}</select></label><label>LISTING-CURRENCY ALLOCATION<input name="targetAmount" type="number" min="${escapeHtml(increment)}" step="${escapeHtml(increment)}" value="${index === 0 ? escapeHtml(decimalInput(estimatedTotal, minorUnit)) : ""}" ${index === 0 ? "required" : ""} /></label></fieldset>`;
                }).join("");
              }
          ''',
          )
          replace_once(
              page,
              '''  const feeRate = Number.isFinite(Number(market.feeRate)) ? Number(market.feeRate) : 0;
                const estimatedTotal = selected.unitPrice * (1 + feeRate / 100);
          ''',
              '''  const minorUnit = currencyMinorUnit(data, selected.currencyCode);
                const estimatedTotal = estimatedMarketplaceBill(data, market, selected, 1);
          ''',
          )
          replace_once(
              page,
              '${fundingAccountRows(accounts, estimatedTotal)}',
              '${fundingAccountRows(accounts, estimatedTotal, minorUnit)}',
          )

          flow = "player-terminal/src/features/marketplace/marketplace-funding-flow.js"
          replace_once(
              flow,
              '''function list(value) {
                return Array.isArray(value) ? value : [];
              }
          ''',
              '''function list(value) {
                return Array.isArray(value) ? value : [];
              }
              function currencyMinorUnit(terminal, currencyCode) {
                const code = String(currencyCode || "").trim().toUpperCase();
                const currencies = list(terminal.getState()?.data?.bankingFx?.currencies);
                const minorUnit = Number(
                  currencies.find((entry) => entry?.currencyCode === code)?.minorUnit,
                );
                return Number.isSafeInteger(minorUnit) && minorUnit >= 0 && minorUnit <= 4
                  ? minorUnit
                  : 2;
              }
              function roundCurrency(value, minorUnit) {
                const factor = 10 ** minorUnit;
                return Math.round((Number(value) + Number.EPSILON) * factor) / factor;
              }
              function estimatedMarketplaceBill(terminal, listing, quantity) {
                const market = currentMarketplace(terminal);
                const minorUnit = currencyMinorUnit(terminal, listing?.currencyCode);
                const subtotal = roundCurrency(
                  Math.max(0, Number(listing?.unitPrice) || 0) * Math.max(0, Number(quantity) || 0),
                  minorUnit,
                );
                const feeAmount = roundCurrency(
                  subtotal * Math.max(0, Number(market.platformFeeRate) || 0) / 100,
                  minorUnit,
                );
                const taxAmount = roundCurrency(
                  subtotal * Math.max(0, Number(market.taxRate) || 0) / 100,
                  minorUnit,
                );
                return roundCurrency(subtotal + feeAmount + taxAmount, minorUnit);
              }
          ''',
          )
          replace_once(
              flow,
              '''function estimatedBill(terminal, form) {
                const listing = selectedListing(terminal, form);
                const quantity = Math.max(0, Number(form.elements.namedItem("quantity")?.value) || 0);
                const feeRate = Math.max(0, Number(currentMarketplace(terminal).feeRate) || 0);
                return listing ? quantity * Number(listing.unitPrice) * (1 + feeRate / 100) : 0;
              }
          ''',
              '''function estimatedBill(terminal, form) {
                const listing = selectedListing(terminal, form);
                const quantity = Math.max(0, Number(form.elements.namedItem("quantity")?.value) || 0);
                return listing ? estimatedMarketplaceBill(terminal, listing, quantity) : 0;
              }
          ''',
          )
          replace_once(
              flow,
              '''  const listing = selectedListing(terminal, form);
                const currencyCode = String(listing?.currencyCode || "ECO").toUpperCase();
          ''',
              '''  const listing = selectedListing(terminal, form);
                const currencyCode = String(listing?.currencyCode || "ECO").toUpperCase();
                const minorUnit = currencyMinorUnit(terminal, currencyCode);
          ''',
          )
          replace_once(
              flow,
              '''    remainingNode.textContent = formatCurrency(Math.max(estimate - funded, 0), currencyCode);
                }
                const submit = form.querySelector('button[type="submit"]');
                const coherent = !allocation.error && estimate > 0 && Math.abs(funded - estimate) <= 0.005;
          ''',
              '''    remainingNode.textContent = formatCurrency(
                  Math.max(roundCurrency(estimate - funded, minorUnit), 0),
                  currencyCode,
                );
                }
                const submit = form.querySelector('button[type="submit"]');
                const coherent = !allocation.error && estimate > 0 &&
                  Math.abs(roundCurrency(funded, minorUnit) - estimate) <= 10 ** -(minorUnit + 6);
          ''',
          )
          replace_once(
              flow,
              '''    if (quantity > Number(listing.quantity)) {
                  showError(mount, "The requested quantity exceeds the available listing quantity.");
                  return;
                }
          ''',
              '''    if (quantity > Number(listing.quantity)) {
                  showError(mount, "The requested quantity exceeds the available listing quantity.");
                  return;
                }
                const minorUnit = currencyMinorUnit(terminal, listing.currencyCode);
                if (allocation.allocations.some((row) =>
                  Math.abs(row.targetAmount - roundCurrency(row.targetAmount, minorUnit)) >
                    10 ** -(minorUnit + 6)
                )) {
                  showError(mount, `Use ${minorUnit} decimal places for ${listing.currencyCode}.`);
                  return;
                }
                const expectedTotal = estimatedMarketplaceBill(terminal, listing, quantity);
                const allocatedTotal = roundCurrency(
                  allocation.allocations.reduce((sum, row) => sum + row.targetAmount, 0),
                  minorUnit,
                );
                if (Math.abs(allocatedTotal - expectedTotal) > 10 ** -(minorUnit + 6)) {
                  showError(mount, "Funding allocations must pay the exact listing-currency bill.");
                  return;
                }
          ''',
          )

          connected = "player-terminal/tests/marketplace-connected-lifecycle.mjs"
          source = Path(connected).read_text()
          source = source.replace("targetAmount: 15.525", "targetAmount: 15.53")
          source = source.replace("{ sourceAccountKey: accountKey, targetAmount: 15.525 }", "{ sourceAccountKey: accountKey, targetAmount: 15.53 }")
          source = source.replace(
              'bankingFx: {\n      balances:',
              'bankingFx: {\n      currencies: [{ currencyCode: "LUM", minorUnit: 2 }],\n      balances:',
          )
          source = source.replace(
              '    "name=\\\"targetAmount\\\"",\n',
              '    "name=\\\"targetAmount\\\"",\n    "value=\\\"15.53\\\"",\n',
          )
          Path(connected).write_text(source)

          Path("player-terminal/tests/browser/marketplace-lifecycle-core.mjs").write_text(r'''import { expect, test } from "@playwright/test";

          const GAME_ID = "00000000-0000-4000-8000-000000000001";
          const LISTING_ID = "lst_11111111111111111111111111111111";
          const RESERVATION_ID = "mpr_22222222222222222222222222222222";
          const ORDER_ID = "ord_33333333333333333333333333333333";
          const ACCOUNT_ID = "bac_44444444444444444444444444444444";
          const TARGET_ACCOUNT_ID = "bac_55555555555555555555555555555555";
          const QUOTE_ID = "pfq_66666666666666666666666666666666";
          const RECEIPT_ID = "pfr_77777777777777777777777777777777";
          const BANK_TRANSACTION_ID = "btx_88888888888888888888888888888888";
          const DISTRIBUTION_TRANSACTION_ID = "btx_99999999999999999999999999999999";
          const FIXING_ID = "fxf_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa";
          const CSRF_TOKEN = "M".repeat(43);
          const NOW = "2026-08-28T01:00:00.000Z";
          const EXPIRES = "2099-08-28T01:02:00.000Z";

          function session() {
            return {
              ok: true,
              player: {
                playerId: "PLAYER-42",
                displayName: "Marketplace Tester",
                rosterLabel: "Trader 42",
                countryCode: "LUMENOR",
                countryName: "Lumenor",
                currencyCode: "LUM",
                status: "active",
              },
              gameSession: {
                name: "Marketplace Browser Game",
                code: "MARKET42",
                status: "active",
              },
              session: { status: "active", expiresAt: "2099-08-28T03:00:00.000Z" },
              balances: [],
