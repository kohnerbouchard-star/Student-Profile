              completedOrders: [],
            };
          }

          function fundedQuote() {
            return {
              ok: true,
              outcome: "applied",
              reservation: {
                reservationKey: RESERVATION_ID,
                listingKey: LISTING_ID,
                itemKey: "data-chip",
                quantity: 1,
                unitPrice: 15,
                subtotal: 15,
                feeRate: 0.025,
                taxRate: 0.01,
                feeAmount: 0.38,
                taxAmount: 0.15,
                buyerTotal: 15.53,
                sellerProceeds: 15,
                currencyCode: "LUM",
                status: "reserved",
                version: 1,
                listingVersion: 7,
                expiresAt: EXPIRES,
                replayed: false,
                fundingQuote: {
                  quoteKey: QUOTE_ID,
                  fundingContextKind: "marketplace.purchase",
                  fundingContextKey: RESERVATION_ID,
                  targetCurrencyCode: "LUM",
                  targetMinorUnit: 2,
                  targetAmount: 15.53,
                  fixingKey: FIXING_ID,
                  policyVersion: "retail-checkout-v1",
                  requiresFx: false,
                  expiresAt: EXPIRES,
                  lines: [{
                    lineNumber: 1,
                    sourceAccountKey: ACCOUNT_ID,
                    sourceCurrencyCode: "LUM",
                    sourceMinorUnit: 2,
                    targetCurrencyCode: "LUM",
                    targetMinorUnit: 2,
                    postedAmount: 500,
                    heldAmount: 0,
                    availableAmount: 500,
                    targetContribution: 15.53,
                    sourceDebit: 15.53,
                    referenceRate: 1,
                    customerRate: 1,
                    effectiveRate: 1,
                    spreadRate: 0,
                    requiresFx: false,
                    roundingDisclosure: "Same-currency source debit equals the listing-currency contribution.",
                  }],
                },
              },
            };
          }

          function fundedOrder() {
            return {
              ok: true,
              outcome: "applied",
              order: {
                orderKey: ORDER_ID,
                reservationKey: RESERVATION_ID,
                listingKey: LISTING_ID,
                itemKey: "data-chip",
                quantity: 1,
                unitPrice: 15,
                subtotal: 15,
                feeAmount: 0.38,
                taxAmount: 0.15,
                buyerTotal: 15.53,
                sellerProceeds: 15,
                currencyCode: "LUM",
                status: "completed",
                version: 2,
                completedAt: NOW,
                refundedAt: null,
                replayed: false,
                fundingReceipt: {
                  receiptKey: RECEIPT_ID,
                  quoteKey: QUOTE_ID,
                  bankTransactionKey: BANK_TRANSACTION_ID,
                  targetAccountKey: TARGET_ACCOUNT_ID,
                  fundingContextKind: "marketplace.purchase",
                  fundingContextKey: RESERVATION_ID,
                  targetCurrencyCode: "LUM",
                  targetAmount: 15.53,
                  targetReserveDrawAmount: 0,
                  sourceDomain: "marketplace",
                  sourceAction: "marketplace_purchase_funding",
                  createdAt: NOW,
                  lines: [{
                    lineNumber: 1,
                    sourceAccountKey: ACCOUNT_ID,
                    sourceCurrencyCode: "LUM",
                    targetContribution: 15.53,
                    sourceDebit: 15.53,
                    referenceRate: 1,
