name: Temporary Figma Desktop Capture Submit

on:
  push:
    branches:
      - feat/econovaria-marketing-site-v1
    paths:
      - .github/workflows/temp-figma-desktop-capture-submit.yml

permissions:
  contents: read

jobs:
  submit-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CAPTURE_ID: ead6f6ff-6a51-404e-afb7-f7c32a8b4932
      CAPTURE_ENDPOINT: https://mcp.figma.com/mcp/capture/ead6f6ff-6a51-404e-afb7-f7c32a8b4932/submit?bindVariables=true
      PAYLOAD_URL: https://at.adobe.com/ORpbst8cBlcPNpOn
    steps:
      - name: Download isolated capture request
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            "$PAYLOAD_URL" \
            --output capture-request.json.gz
          test -s capture-request.json.gz
          gzip --test capture-request.json.gz
          gunzip --stdout capture-request.json.gz > capture-request.json
          test -s capture-request.json
          node - <<'NODE'
          const fs = require('node:fs');
          const request = JSON.parse(fs.readFileSync('capture-request.json', 'utf8'));
          if (request.captureId !== process.env.CAPTURE_ID) {
            throw new Error('Capture request ID does not match the authorized capture ID.');
          }
          if (typeof request.payload !== 'string' || request.payload.length < 1000) {
            throw new Error('Capture payload is missing or unexpectedly small.');
          }
          if (request.captureIndex !== 0) {
            throw new Error('Only the first bounded capture is authorized.');
          }
          console.log(`Validated ${request.payload.length} payload characters.`);
          NODE

      - name: Submit exact capture to Figma
        shell: bash
        run: |
          set -euo pipefail
          http_code="$(curl --silent --show-error --location \
            --output capture-response.json \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data-binary @capture-request.json \
            "$CAPTURE_ENDPOINT")"
          cat capture-response.json
          test "$http_code" -ge 200
          test "$http_code" -lt 300

      - name: Upload bounded response evidence
        uses: actions/upload-artifact@v4
        with:
          name: figma-desktop-capture-response
          path: capture-response.json
          if-no-files-found: error
          retention-days: 1
