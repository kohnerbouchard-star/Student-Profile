name: Admin V2 Loans

on:
  pull_request:
    paths:
      - "admin/v2/src/routes/loans/**"
      - "admin/v2/src/app.js"
      - "admin/v2/src/core/navigation-registry.js"
      - "backend/supabase/functions/admin-api/businessBankingOperations.ts"
      - "backend/supabase/functions/admin-api/businessBankingOperations.test.ts"
      - "scripts/admin-v2-loans-api.test.mjs"
      - "scripts/admin-v2-unit.test.mjs"
      - "docs/architecture/admin-ui-v2-loans.md"
      - "docs/operations/evidence/admin-ui-v2-loans/**"
      - ".github/workflows/admin-v2-loans.yml"
  push:
    branches: [main]
    paths:
      - "admin/v2/src/routes/loans/**"
      - "backend/supabase/functions/admin-api/businessBankingOperations.ts"
      - "backend/supabase/functions/admin-api/businessBankingOperations.test.ts"
      - "scripts/admin-v2-loans-api.test.mjs"
      - "scripts/admin-v2-unit.test.mjs"
      - ".github/workflows/admin-v2-loans.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3
      - name: Install repository dependencies
        run: npm ci --ignore-scripts
      - name: Verify Loans V2 contract
        run: node --test scripts/admin-v2-loans-api.test.mjs
      - name: Verify accumulated Admin V2 units
        run: node --test scripts/admin-v2-unit.test.mjs
      - name: Check Loans browser modules
        run: |
          node --check admin/v2/src/routes/loans/LoansApiClient.js
          node --check admin/v2/src/routes/loans/LoansController.js
          node --check admin/v2/src/routes/loans/LoansRoute.js
      - name: Verify Admin loan publication
        working-directory: backend
        run: |
          deno test --config supabase/functions/admin-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            supabase/functions/admin-api/businessBankingOperations.test.ts
          deno check --config supabase/functions/admin-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            supabase/functions/admin-api/index.ts
