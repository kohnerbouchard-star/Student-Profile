name: Business Phase 4B Implement

on:
  push:
    branches:
      - feat/business-workforce-hiring-v2
    paths:
      - "scripts/business-phase4b-payload.py"
      - ".github/workflows/business-phase4b-implement.yml"

permissions:
  contents: write

concurrency:
  group: business-phase4b-implement
  cancel-in-progress: false

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, 'implement Phase 4B workforce hiring') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-workforce-hiring-v2
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            player-terminal/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Apply Phase 4B implementation
        run: python3 scripts/business-phase4b-payload.py

      - name: Regenerate architecture inventory
        run: node scripts/architecture/build-architecture-inventory.mjs

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Run Phase 4B authority contract
        run: node scripts/business-workforce-hiring-contract.mjs

      - name: Validate migration ledger
        run: node scripts/validate-supabase-migrations.mjs

      - name: Run repository quality suite
        run: npm test

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Run backend typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Run focused Business workforce tests
        working-directory: backend
        run: |
          deno test --config supabase/functions/classroom-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            src/domains/business/api/playerBusinessWorkforceHiring.test.ts \
            src/domains/business/api/playerBusinessRoutePaths.test.ts

      - name: Install Player Terminal dependencies
        working-directory: player-terminal
        run: npm ci --no-audit --no-fund

      - name: Run Player Business surface verification
        working-directory: player-terminal
        run: |
          npm run check
          node tests/business-banking-surface.mjs
          npm run adapter
          npm run capability-manifest-current
          npm run runtime-integration

      - name: Verify clean patch
        run: git diff --check

      - name: Publish bounded Phase 4B implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/business-phase4b-payload.py
          rm -f .github/workflows/business-phase4b-implement.yml
          rm -f .github/workflows/business-phase4b-source-bundle.yml
          git diff --check
          git config user.name "econovaria-phase4b-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(business): implement Phase 4B workforce hiring"
          git push origin HEAD:feat/business-workforce-hiring-v2
