                      '- Next: `BUSINESS-V2-10A4C3F`.\n'
                  )
              log_path.write_text(log_text)

              authority_path = ROOT / 'docs/operations/contracts/player-cross-cutting/pr-676.json'
              authority = json.loads(authority_path.read_text())
              for path in (
                  'docs/roadmaps/multicurrency-stock-funding-c3e-handoff-v1.md',
                  str(log_path.relative_to(ROOT)),
              ):
                  if path not in authority['allowedPaths']:
                      authority['allowedPaths'].append(path)
                  if path not in authority.get('requiredFiles', []):
                      authority.setdefault('requiredFiles', []).append(path)
              authority['allowedPaths'] = sorted(authority['allowedPaths'])
              authority['requiredFiles'] = sorted(authority['requiredFiles'])
              authority_path.write_text(json.dumps(authority, indent=2) + '\n')

              regenerate_architecture()
              run(['python', '-m', 'json.tool', str(manifest_path)])
              run(['python', '-m', 'json.tool', str(authority_path)])
              run(['git', 'diff', '--check'])
              checked = authority_check()
              if checked.returncode != 0:
                  raise RuntimeError(checked.stdout)

          def documentation_ci_loop(
              implementation_sha: str,
              implementation_runs: dict[str, dict[str, Any]],
              candidate: str,
          ) -> tuple[str, dict[str, dict[str, Any]]]:
              sha = candidate
              for cycle in range(1, 4):
                  state, runs = wait_matrix(sha, f'documentation-{cycle}')
                  if state == 'green':
                      return sha, runs
                  rerun_failed(runs)
                  state, rerun_runs = wait_matrix(
                      sha, f'documentation-rerun-{cycle}'
                  )
                  if state == 'green':
                      return sha, rerun_runs
                  raise RuntimeError(
                      'final documentation head has persistent failures:\n'
                      + collect_failed_logs(rerun_runs)[-100000:]
                  )
              raise RuntimeError('documentation CI cycles exhausted')

          def final_pr_body(
              implementation_sha: str, documentation_sha: str,
              implementation_runs: dict[str, dict[str, Any]],
              documentation_runs: dict[str, dict[str, Any]],
          ) -> str:
              def lines(runs: dict[str, dict[str, Any]]) -> str:
                  return '\n'.join(
                      f'- `{name}` — run `{runs[name]["id"]}` — '
                      f'`{runs[name].get("conclusion")}`'
                      for name in sorted(REQUIRED, key=str.lower)
                  )
              return f'''## Roadmap checkpoint

          `BUSINESS-V2-10A4C3E` — authenticated Player Stock multi-currency funding cutover.

          ## Certified identities

          - Certified predecessor C3D: `{C3D_SHA}`.
          - Exact certified C3E implementation: `{implementation_sha}`.
          - Final exact-head certification documentation: `{documentation_sha}`.
          - Durable handoff: `docs/roadmaps/multicurrency-stock-funding-c3e-handoff-v1.md`.
          - Current checkpoint manifest: `docs/roadmaps/business-v2-current-checkpoint-v1.json`.
          - Next authorized checkpoint: `BUSINESS-V2-10A4C3F`.

          ## Certified C3E result

          The connected Market adapter uses `buy_now` / `settle_sell`, canonical Banking Checking funding/proceeds, public evidence keys, server-derived scope, fail-closed C3B/C3C/C3D validation, and per-listing-currency portfolio subtotals. Unsupported limit, queued, partial-fill, margin, short, and fee-estimate behavior remains absent. Retained Store, Banking, browser, privacy, security, database, and architecture gates were not weakened.

          ## Exact implementation workflow matrix

          {lines(implementation_runs)}

          ## Final documentation-head workflow matrix

          {lines(documentation_runs)}

          ## Safety state

          PR #676 remains draft, open, unmerged, and undeployed. No merge, deployment, scheduler/secret/domain/infrastructure change, staging/production SQL, or live-data mutation was performed or authorized.
          '''

          def cleanup_after_failure(message: str) -> None:
              log(f'controller stopped: {message}')
              try:
                  pr = pr_snapshot()
                  marker = '\n\n---\n\n### C3E v4 controller status\n'
                  body = (pr.get('body') or '').split(marker)[0]
                  body += marker + (
                      'Stopped without certification. Evidence: `'
                      + message[:1800].replace('`', "'")
                      + '`. C3D remains the certified checkpoint. No merge or '
                      'deployment was performed.'
                  )
                  api('PATCH', f'/pulls/{PR}', body={'body': body}, write=True)
              except Exception as exc:
                  log(f'failure beacon could not be written: {exc}')

          def main() -> None:
              configure_git()
              if already_certified():
                  return
              wait_for_older_controllers()
              configure_git()
              enforce_pr_safety()
              remove_target_tooling()
              repair_implementation()
              implementation_candidate = commit_and_push(
                  'fix(stocks): complete C3E connected funding cutover'
              )
              implementation_sha, implementation_runs = implementation_ci_loop(
                  implementation_candidate
              )
              log(f'implementation matrix green at {implementation_sha}')

              author_certification_docs(
                  implementation_sha, implementation_runs
              )
              documentation_candidate = commit_and_push(
                  'docs(stocks): certify C3E Player funding cutover'
              )
              documentation_sha, documentation_runs = documentation_ci_loop(
                  implementation_sha, implementation_runs,
                  documentation_candidate,
              )
              log(f'documentation matrix green at {documentation_sha}')

              api(
                  'PATCH', f'/pulls/{PR}', write=True,
                  body={
                      'body': final_pr_body(
                          implementation_sha, documentation_sha,
                          implementation_runs, documentation_runs,
                      )
                  },
              )
              final = enforce_pr_safety()
              if final['head']['sha'] != documentation_sha:
                  raise RuntimeError('final PR head does not equal green docs SHA')
              result = {
                  'status': 'certified',
                  'checkpoint': 'BUSINESS-V2-10A4C3E',
                  'implementation_sha': implementation_sha,
                  'documentation_sha': documentation_sha,
                  'implementation_runs': evidence_map(implementation_runs),
                  'documentation_runs': evidence_map(documentation_runs),
                  'next_checkpoint': 'BUSINESS-V2-10A4C3F',
                  'pr': {
                      'number': PR, 'state': 'open', 'draft': True,
                      'merged': False, 'deployed': False,
                  },
              }
              Path('/tmp/c3e-v4-result.json').write_text(
                  json.dumps(result, indent=2)
              )
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  Path(summary).write_text(
                      '## C3E certified\n\n```json\n'
                      + json.dumps(result, indent=2) + '\n```\n'
                  )
              log(json.dumps(result, indent=2))

          try:
              main()
          except Exception as exc:
              traceback.print_exc()
              cleanup_after_failure(str(exc))
              raise
          PY

          python /tmp/c3e_controller_v4.py

      - name: Upload bounded diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c3e-v4-failure-${{ github.sha }}
          path: |
            /tmp/c3e-v4-changed-files.txt
          if-no-files-found: ignore
          retention-days: 7
