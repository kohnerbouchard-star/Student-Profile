              reconciliation = ROOT / 'docs/roadmaps/business-v2-roadmap-reconciliation-20260829.md'
              reconciliation_text = reconciliation.read_text()
              marker = '## C3E certification reconciliation'
              if marker not in reconciliation_text:
                  reconciliation_text += (
                      f'\n\n{marker} — {datetime.now(timezone.utc).date()}\n\n'
                      f'The current machine-readable checkpoint is now '
                      f'`BUSINESS-V2-10A4C3E` at exact implementation '
                      f'`{implementation_sha}`. Earlier C3A/C3D current-state '
