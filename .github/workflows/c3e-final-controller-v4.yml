name: C3E Final Certification Controller v4

on:
  push:
    branches:
      - automation/c3e-final-controller-20260830-v4
    paths:
      - .github/workflows/c3e-final-controller-v4.yml
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  models: read
  pull-requests: write

concurrency:
  group: c3e-final-controller-v4
  cancel-in-progress: false

jobs:
  certify:
    name: Repair and certify the isolated C3E target branch
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      REPOSITORY: kohnerbouchard-star/Student-Profile
      TARGET_BRANCH: feat/multicurrency-stock-funding-v1
      BASE_BRANCH: feat/multicurrency-marketplace-funding-v1
      CONTROLLER_BRANCH: automation/c3e-final-controller-20260830-v4
      PR_NUMBER: '676'
      GH_TOKEN: ${{ github.token }}
      PUSH_TOKEN: ${{ secrets.C3E_AUTOMATION_TOKEN || secrets.CODEX_GITHUB_TOKEN || secrets.GH_PAT || secrets.PAT || secrets.PERSONAL_ACCESS_TOKEN || github.token }}
    steps:
      - name: Check out the target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/multicurrency-stock-funding-v1
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.3

      - name: Install pinned tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests
          npm install --global npm@10.9.8
          npm ci --ignore-scripts
          npm --prefix backend ci --ignore-scripts
          if [[ -f player-terminal/package-lock.json ]]; then
            npm --prefix player-terminal ci --ignore-scripts
          fi

      - name: Run isolated C3E controller
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/c3e_controller_v4.py <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import subprocess
          import time
          import traceback
          import zipfile
          from datetime import datetime, timezone
          from io import BytesIO
          from pathlib import Path
          from typing import Any, Iterable

          import requests

          ROOT = Path.cwd()
          REPO = os.environ['REPOSITORY']
          BRANCH = os.environ['TARGET_BRANCH']
          BASE = os.environ['BASE_BRANCH']
          CONTROL = os.environ['CONTROLLER_BRANCH']
          PR = int(os.environ['PR_NUMBER'])
          GH_TOKEN = os.environ['GH_TOKEN']
          PUSH_TOKEN = os.environ['PUSH_TOKEN']
          API = f'https://api.github.com/repos/{REPO}'
          C3D_SHA = '9b502b9ffa5e8aaf2f7c8d93d9cd3ccda3a10f15'
          REQUIRED = [
              'Required Game Market Timezone', 'Staging Readiness Preflight',
              'Business Banking Runtime', 'Runtime Interaction Wiring',
              'Exchange Calendar Runtime', 'Supply Chain Security',
              'Environment Neutral Browser', 'Business Economy V2',
              'Business Workforce Hiring V2', 'Admin API Check',
              'Business Workforce Payroll V2', 'World Runtime',
              'Repository Quality', 'Backend Typecheck', 'Database Replay',
              'Progression Runtime', 'Business Timed Manufacturing V2',
              'multicurrency-store-funding-v1',
              'multicurrency-marketplace-funding-v1',
              'multicurrency-stock-funding-v1', 'Player Terminal Verify',
              'Business Store Withdrawal Safety V2', 'banking-fx-clearing-v1',
              'Business Store Listing Inventory V2',
              'Business Store Seller Offers V2',
              'Business Store Atomic Settlement V2',
              'Business Player Store Cutover V2',
          ]
          TEMP_TARGET_PATHS = [
              '.github/workflows/c3e-source-export.yml',
              '.github/workflows/c3e-autonomous-controller-v2.yml',
              '.github/workflows/c3e-autonomous-controller-v3.yml',
          ]
          READ_HEADERS = {
              'Authorization': f'Bearer {GH_TOKEN}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          WRITE_HEADERS = {
              'Authorization': f'Bearer {PUSH_TOKEN}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          SAFE_PREFIXES = (
              'api/', 'backend/src/domains/stocks/', 'player-terminal/', 'scripts/',
              'docs/roadmaps/', 'docs/operations/contracts/player-cross-cutting/',
              'docs/architecture/inventories/',
          )
          FORBIDDEN = (
              '.env', 'secret', 'scheduler', 'domain', 'vercel.json',
              'wrangler.toml', 'backend/supabase/migrations/',
          )

          def log(message: str) -> None:
              print(f'[{datetime.now(timezone.utc).isoformat()}] {message}', flush=True)

          def run(command: str | list[str], *, check: bool = True,
                  timeout: int = 2400) -> subprocess.CompletedProcess[str]:
              shown = command if isinstance(command, str) else ' '.join(command)
              log(f'RUN {shown}')
              result = subprocess.run(
                  command, shell=isinstance(command, str), cwd=ROOT, text=True,
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                  timeout=timeout,
              )
              print(result.stdout[-50000:], flush=True)
              if check and result.returncode != 0:
                  raise RuntimeError(
                      f'command failed ({result.returncode}): {shown}\n'
                      f'{result.stdout[-30000:]}'
                  )
              return result

          def api(method: str, path: str, *, body: Any | None = None,
                  write: bool = False,
                  allow: Iterable[int] = (200, 201, 202, 204)) -> requests.Response:
              response = requests.request(
                  method, f'{API}{path}',
                  headers=WRITE_HEADERS if write else READ_HEADERS,
                  json=body, timeout=120, allow_redirects=True,
              )
              if response.status_code not in set(allow):
                  raise RuntimeError(
                      f'GitHub API {method} {path}: {response.status_code} '
                      f'{response.text[:2500]}'
                  )
              return response

          def configure_git() -> None:
              run(['git', 'config', 'user.name', 'Econovaria C3E Controller'])
              run(['git', 'config', 'user.email',
                   'c3e-controller@users.noreply.github.com'])
              run(['git', 'remote', 'set-url', 'origin',
                   f'https://x-access-token:{PUSH_TOKEN}@github.com/{REPO}.git'])
              run(['git', 'fetch', '--no-tags', 'origin', BASE, BRANCH])
              run(['git', 'checkout', '-B', BRANCH, f'origin/{BRANCH}'])

          def pr_snapshot() -> dict[str, Any]:
              return api('GET', f'/pulls/{PR}').json()

          def enforce_pr_safety() -> dict[str, Any]:
              pr = pr_snapshot()
              if pr.get('state') != 'open' or not pr.get('draft') or pr.get('merged'):
                  raise RuntimeError('PR #676 is not open, draft, and unmerged')
              if pr['head']['ref'] != BRANCH or pr['base']['ref'] != BASE:
                  raise RuntimeError('PR #676 branch/base drift')
              return pr

          def remove_target_tooling() -> None:
              for raw in TEMP_TARGET_PATHS:
                  path = ROOT / raw
                  if path.exists():
                      path.unlink()
                      log(f'removed target-branch tooling debris: {raw}')

          def git_status() -> str:
              return run(['git', 'status', '--porcelain'], check=False).stdout

          def changed_paths() -> list[str]:
              output = run(
                  ['git', 'diff', '--name-only', f'origin/{BASE}'],
                  check=False,
              ).stdout
              return sorted({line.strip() for line in output.splitlines()
                             if line.strip()})

          def latest_run_map(sha: str) -> dict[str, dict[str, Any]]:
              runs = api(
                  'GET',
                  f'/actions/runs?head_sha={sha}&event=pull_request&per_page=100',
              ).json().get('workflow_runs', [])
              latest: dict[str, dict[str, Any]] = {}
              for item in sorted(
                  runs,
                  key=lambda row: (
                      row.get('name', ''), row.get('run_attempt', 0),
                      row.get('created_at', ''),
                  ),
              ):
                  latest[item['name']] = item
              return latest

          def matrix_state(sha: str) -> tuple[str, dict[str, dict[str, Any]], dict[str, Any]]:
              runs = latest_run_map(sha)
              missing = [name for name in REQUIRED if name not in runs]
              pending = [
                  name for name in REQUIRED
                  if name in runs and runs[name].get('status') != 'completed'
              ]
              failed = [
                  name for name in REQUIRED
                  if name in runs and runs[name].get('status') == 'completed'
                  and runs[name].get('conclusion') != 'success'
              ]
              extra_failed = [
                  row['name'] for row in runs.values()
                  if row.get('status') == 'completed'
                  and row.get('conclusion') not in ('success', 'skipped', 'neutral')
              ]
              detail = {
                  'missing': missing, 'pending': pending, 'failed': failed,
                  'extra_failed': extra_failed,
              }
              if failed or extra_failed:
                  return 'failed', runs, detail
              if missing or pending:
                  return 'pending', runs, detail
              return 'green', runs, detail

          def parse_certified_shas(body: str) -> tuple[str | None, str | None]:
              implementation = re.search(
                  r'Exact certified C3E implementation:\s*`([0-9a-f]{40})`', body
              )
              documentation = re.search(
                  r'Final exact-head certification documentation:\s*`([0-9a-f]{40})`',
                  body,
              )
              return (
                  implementation.group(1) if implementation else None,
                  documentation.group(1) if documentation else None,
              )

          def already_certified() -> bool:
              pr = enforce_pr_safety()
              implementation, documentation = parse_certified_shas(pr.get('body') or '')
              if not implementation or not documentation:
                  return False
              if documentation != pr['head']['sha']:
                  return False
              implementation_state, _, _ = matrix_state(implementation)
              documentation_state, _, _ = matrix_state(documentation)
              if implementation_state == documentation_state == 'green':
                  log(
                      f'C3E already independently certified: implementation '
                      f'{implementation}, docs {documentation}'
                  )
                  return True
              return False

          def wait_for_older_controllers() -> None:
              deadline = time.time() + 1800
              while time.time() < deadline:
                  runs = api(
                      'GET',
                      f'/actions/runs?branch={BRANCH}&per_page=30',
                  ).json().get('workflow_runs', [])
                  active = [
                      row for row in runs
                      if row.get('status') in ('queued', 'in_progress')
                      and row.get('name') in (
                          'C3E Autonomous Certification Controller',
                          'C3E Autonomous Certification Controller v3',
                      )
                  ]
                  if not active:
                      return
                  log(f'waiting for older controller runs: {[x["id"] for x in active]}')
                  time.sleep(30)
              log('older-controller wait expired; proceeding with remote-head guard')

          def validate_model_path(path: str, *, docs_only: bool = False) -> None:
              normalized = Path(path).as_posix().lstrip('/')
              if normalized != path or '..' in Path(normalized).parts:
                  raise RuntimeError(f'unsafe model path: {path}')
              lower = normalized.lower()
              if normalized.startswith('.github/'):
                  raise RuntimeError(f'model may not edit workflows: {path}')
              if any(part in lower for part in FORBIDDEN):
                  raise RuntimeError(f'model attempted forbidden path: {path}')
              if docs_only:
                  allowed = (
                      'docs/roadmaps/',
                      'docs/operations/contracts/player-cross-cutting/',
                      'docs/architecture/inventories/',
                  )
                  if not normalized.startswith(allowed):
                      raise RuntimeError(f'documentation stage attempted source path: {path}')
              elif not normalized.startswith(SAFE_PREFIXES):
                  raise RuntimeError(f'model path outside bounded C3E scope: {path}')

          def read_text(path: str, limit: int = 90000) -> str:
              target = ROOT / path
              if not target.is_file():
                  return ''
              text = target.read_text(encoding='utf-8', errors='replace')
              return text if len(text) <= limit else text[:limit] + '\n...[truncated]'

          def grep_paths(pattern: str, roots: list[str], maximum: int = 55) -> list[str]:
              output = run(
                  ['git', 'grep', '-Il', '-E', pattern, '--', *roots],
                  check=False,
              ).stdout
              return [line.strip() for line in output.splitlines()
                      if line.strip()][:maximum]

          def source_context(extra: str = '') -> str:
              paths = [
                  'docs/roadmaps/multicurrency-stock-funding-c3d-handoff-v1.md',
                  'docs/roadmaps/multicurrency-stock-funding-c3e-execution-note-v1.md',
                  'docs/roadmaps/multicurrency-stock-funding-implementation-plan-v1.md',
                  'docs/roadmaps/business-v2-current-checkpoint-v1.json',
                  'docs/roadmaps/business-v2-roadmap-reconciliation-20260829.md',
                  'docs/operations/contracts/player-cross-cutting/pr-676.json',
                  'player-terminal/src/api/payload-normalizer.js',
                  'player-terminal/src/api/resource-plan.js',
                  'player-terminal/src/pages/market-page.js',
                  'player-terminal/tests/browser/player-terminal-core.mjs',
                  'player-terminal/tests/portfolio-market-holdings.mjs',
                  'player-terminal/tests/stock-multicurrency-funding.mjs',
                  'package.json',
              ]
              paths += grep_paths(
                  r'market-order|orderType|side|buy_now|settle_sell|'
                  r'listingCurrency|listing_currency|portfolio|holdings',
                  ['api', 'player-terminal', 'backend/src/domains/stocks', 'scripts'],
              )
              blocks: list[str] = []
              total = 0
              for path in dict.fromkeys(paths):
                  text = read_text(path)
                  if not text:
                      continue
                  block = f'\n===== FILE {path} =====\n{text}\n'
                  if total + len(block) > 460000:
                      break
                  blocks.append(block)
                  total += len(block)
              grep_index = run(
                  "git grep -n -E 'market-order|orderType|buy_now|settle_sell|listingCurrency|listing_currency|portfolio' -- api player-terminal backend/src/domains/stocks scripts | head -n 1400",
                  check=False,
              ).stdout
              return (
                  ''.join(blocks) + '\n===== GREP INDEX =====\n' + grep_index
                  + '\n===== FAILURE EVIDENCE =====\n' + extra[-150000:]
              )

          def select_model() -> tuple[str, str]:
              candidates = ['openai/gpt-5', 'openai/gpt-4.1', 'openai/gpt-4o']
              try:
                  response = requests.get(
                      'https://models.github.ai/catalog/models',
                      headers={'Authorization': f'Bearer {GH_TOKEN}'}, timeout=60,
                  )
                  if response.ok:
                      ids = [
                          item.get('id') or item.get('name')
                          for item in response.json() if isinstance(item, dict)
                      ]
                      preferred = [
                          item for item in ids if item
                          and ('gpt-5' in item or 'gpt-4.1' in item)
                      ]
                      candidates = preferred + [
                          item for item in candidates if item not in preferred
                      ]
              except Exception as exc:
                  log(f'model catalog lookup failed: {exc}')
              endpoint = 'https://models.github.ai/inference/chat/completions'
              for model in candidates:
                  try:
                      response = requests.post(
                          endpoint,
                          headers={
                              'Authorization': f'Bearer {GH_TOKEN}',
                              'Content-Type': 'application/json',
                          },
                          json={
                              'model': model,
                              'messages': [
                                  {'role': 'user', 'content': 'Reply with exactly OK.'}
                              ],
                              'max_tokens': 16,
                          },
                          timeout=120,
                      )
                      if response.ok:
                          log(f'using GitHub Models model {model}')
                          return endpoint, model
                      log(
                          f'model probe failed {model}: {response.status_code} '
                          f'{response.text[:500]}'
                      )
                  except Exception as exc:
                      log(f'model probe exception {model}: {exc}')
              raise RuntimeError('no approved GitHub Models coding model is available')

          MODEL_ENDPOINT, MODEL_ID = select_model()

          def model_json(system: str, user: str,
                         max_tokens: int = 55000) -> dict[str, Any]:
              response = requests.post(
                  MODEL_ENDPOINT,
                  headers={
                      'Authorization': f'Bearer {GH_TOKEN}',
                      'Content-Type': 'application/json',
                  },
                  json={
                      'model': MODEL_ID,
                      'messages': [
                          {'role': 'system', 'content': system},
                          {'role': 'user', 'content': user},
                      ],
                      'max_tokens': max_tokens,
                  },
                  timeout=1200,
              )
              if not response.ok:
                  raise RuntimeError(
                      f'model request failed: {response.status_code} '
                      f'{response.text[:3500]}'
                  )
              content = response.json()['choices'][0]['message']['content']
              if isinstance(content, list):
                  content = ''.join(
                      part.get('text', '') for part in content
                      if isinstance(part, dict)
                  )
              text = str(content).strip()
              fenced = re.search(r'```(?:json)?\s*(\{.*\})\s*```', text, re.S)
              if fenced:
                  text = fenced.group(1)
              else:
                  first, last = text.find('{'), text.rfind('}')
                  if first >= 0 and last > first:
                      text = text[first:last + 1]
              try:
                  return json.loads(text)
              except json.JSONDecodeError as exc:
                  raise RuntimeError(
                      f'model returned invalid JSON: {exc}: {text[:6000]}'
                  ) from exc

          def apply_model_result(result: dict[str, Any], *, docs_only: bool = False) -> int:
              files = result.get('files', {})
              if isinstance(files, list):
                  files = {item['path']: item['content'] for item in files}
              if not isinstance(files, dict):
                  raise RuntimeError('model files must be a path/content object')
              changed = 0
              for path, content in files.items():
                  validate_model_path(path, docs_only=docs_only)
                  if not isinstance(content, str):
                      raise RuntimeError(f'non-text model content for {path}')
                  target = ROOT / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if target.exists() and target.read_text(
                      encoding='utf-8', errors='replace'
                  ) == content:
                      continue
                  target.write_text(content, encoding='utf-8')
                  changed += 1
              for path in result.get('delete', []) or []:
                  validate_model_path(path, docs_only=docs_only)
                  target = ROOT / path
                  if target.exists():
                      target.unlink()
                      changed += 1
              log(
                  f'applied {changed} model file changes; '
                  f'summary={str(result.get("summary", ""))[:1800]}'
              )
              return changed

          def regenerate_architecture() -> None:
              candidates = [
                  'scripts/generate-architecture-inventory.mjs',
                  'scripts/generate-econovaria-architecture-inventory.mjs',
              ]
              for candidate in candidates:
                  if (ROOT / candidate).exists():
                      run(['node', candidate])
                      return
              package = json.loads((ROOT / 'package.json').read_text())
              for name in package.get('scripts', {}):
                  lowered = name.lower()
                  if 'architecture' in lowered and (
                      'inventory' in lowered or 'generate' in lowered
                  ):
                      run(['npm', 'run', name])
                      return

          def authority_check() -> subprocess.CompletedProcess[str]:
              changed_file = Path('/tmp/c3e-v4-changed-files.txt')
              changed_file.write_text('\n'.join(changed_paths()) + '\n')
              return run(
                  [
                      'node', 'scripts/verify-player-cross-cutting-authority.mjs',
                      '--changed-files', str(changed_file), '--pr-number', str(PR),
                      '--base-ref', BASE,
                  ],
                  check=False,
              )

          def local_checks() -> str:
              regenerate_architecture()
              commands = [
                  ['node', '--test', 'scripts/player-cross-cutting-authority.test.mjs'],
                  [
                      'node', '--test',
                      'player-terminal/tests/stock-multicurrency-funding.mjs',
                      'player-terminal/tests/portfolio-market-holdings.mjs',
                  ],
                  ['npm', '--prefix', 'backend', 'run', 'typecheck'],
              ]
              logs: list[str] = []
              for command in commands:
                  result = run(command, check=False, timeout=2400)
                  logs.append(f'$ {" ".join(command)}\n{result.stdout}')
                  if result.returncode != 0:
                      return '\n'.join(logs)[-150000:]
              authority = authority_check()
              logs.append(authority.stdout)
              if authority.returncode != 0:
                  return '\n'.join(logs)[-150000:]
              diff_check = run(['git', 'diff', '--check'], check=False)
              logs.append(diff_check.stdout)
              if diff_check.returncode != 0:
                  return '\n'.join(logs)[-150000:]
              package = json.loads((ROOT / 'package.json').read_text())
              for script in ('test:repo', 'quality'):
                  if script in package.get('scripts', {}):
                      result = run(
                          ['npm', 'run', script], check=False, timeout=3000
                      )
                      logs.append(result.stdout)
                      if result.returncode != 0:
                          return '\n'.join(logs)[-150000:]
              return ''

          def implementation_prompt(evidence: str = '') -> tuple[str, str]:
              system = (
                  'You are a senior engineer repairing a high-integrity economic '
                  'simulation. Return only one JSON object with keys summary, files '
                  '(path to complete UTF-8 replacement content), and delete (array). '
                  'Do not return patches or markdown fences. Make the smallest correct '
                  'change. Preserve security, accounting, replay, accessibility, and '
                  'architecture invariants.'
              )
              user = f'''
          Complete Econovaria checkpoint BUSINESS-V2-10A4C3E on PR #676.
          Certified predecessor C3D is {C3D_SHA}.

          Repair and prove these audited gaps:
          1. The C3E Market forms use `buy_now` and `settle_sell`. The connected
             Player route/form adapter must not require the retired `side` /
             `orderType` body. Align connected submission with the authenticated
             Stock gateway.
          2. Browser-authored values remain constrained public ticker/evidence/account
             keys only. Game and Player scope and every monetary outcome are derived
             server-side. Preserve public `bac_*`, `sbq_*`, `pfr_*`, and `btx_*`
             evidence and reject UUID/private-scope injection.
          3. Immediate buys use one-to-three unique canonical Checking accounts with
             exact listing-currency allocations. Immediate sells use exactly one
             canonical Checking destination. Preserve C3B quote, C3C buy settlement,
             C3D sell settlement, idempotency/replay/conflict behavior, and fail-closed
             price, tick, ownership, balance, holdings, liquidity, and FX validation.
          4. Portfolio and holding reads/presentation must never sum unrelated listing
             currencies under one currency label. Use per-listing-currency subtotals
             unless an already-authoritative evidenced B1 conversion truly exists.
             Preserve listing currency through board/detail/portfolio/holdings/orders/
             trades, cost basis, position value, and realized/unrealized values.
          5. Add or update connected buy/sell, confirmation/receipt/proceeds, privacy,
             Banking FX, keyboard/focus/mobile/reduced-motion/screen-reader tests.
             Do not weaken retained Store, Banking, browser, security, privacy,
             database, or architecture tests.
          6. Limit/queued/partial-fill execution, margin, short selling, the retired
             fee estimate, Stock wallets, and Stock balance caches remain absent.
          7. Narrowly update PR #676's exact-path authority manifest for any additional
             source/test path. Regenerate architecture inventory through repository
             tooling, not hand-authored metrics. Keep C3E marked not certified until
             exact-head CI is green.

          Do not modify workflows, migrations, secrets, schedulers, domains,
          deployment files, staging/production data, or unrelated domains. Do not
          merge or deploy.

          Repository context:
          {source_context(evidence)}
          '''
              return system, user

          def repair_implementation(evidence: str = '') -> None:
              current_evidence = evidence
              for attempt in range(1, 5):
                  system, user = implementation_prompt(current_evidence)
                  result = model_json(system, user)
                  apply_model_result(result)
                  remove_target_tooling()
                  failure = local_checks()
                  if not failure:
                      log(f'local implementation checks passed on attempt {attempt}')
                      return
                  current_evidence = (
                      f'LOCAL CHECK FAILURE ATTEMPT {attempt}:\n{failure}\n'
                      f'CURRENT DIFF:\n'
                      f'{run(["git", "diff", "--stat"], check=False).stdout}'
                  )
              raise RuntimeError('implementation repair did not pass local gates')

          def remote_head() -> str:
              run(['git', 'fetch', '--no-tags', 'origin', BRANCH])
              return run(['git', 'rev-parse', f'origin/{BRANCH}']).stdout.strip()

          def commit_and_push(message: str) -> str:
              remove_target_tooling()
              expected = run(['git', 'rev-parse', 'HEAD']).stdout.strip()
              current = remote_head()
              if current != expected:
                  raise RuntimeError(
                      f'target branch moved during bounded repair: local {expected}, '
                      f'remote {current}'
                  )
              run(['git', 'add', '-A'])
              if not git_status():
                  return expected
              run(['git', 'commit', '-m', message])
              sha = run(['git', 'rev-parse', 'HEAD']).stdout.strip()
              run(['git', 'push', 'origin', f'HEAD:{BRANCH}'], timeout=600)
              log(f'pushed target commit {sha}')
              request_pull_request_event()
              return sha

          def request_pull_request_event() -> None:
              try:
                  api(
                      'PATCH', f'/pulls/{PR}', body={'state': 'closed'},
                      write=True,
                  )
                  api(
                      'PATCH', f'/pulls/{PR}', body={'state': 'open'},
                      write=True,
                  )
                  log('requested ordinary pull-request reopen event')
              except Exception as exc:
                  log(
                      'automatic reopen event failed or was token-suppressed; '
                      f'external controller may trigger it: {exc}'
                  )

          def signal_wait(phase: str, sha: str, detail: dict[str, Any]) -> None:
              try:
                  pr = pr_snapshot()
                  marker = '\n\n---\n\n### C3E v4 controller status\n'
                  body = (pr.get('body') or '').split(marker)[0]
                  body += marker + (
                      f'Phase: `{phase}`  \nHead: `{sha}`  \n'
                      f'Matrix: `{json.dumps(detail, sort_keys=True)}`  \n'
                      'Waiting for the ordinary pull-request workflow event. '
                      'No merge or deployment is authorized.'
                  )
                  api('PATCH', f'/pulls/{PR}', body={'body': body}, write=True)
              except Exception as exc:
                  log(f'could not update wait beacon: {exc}')

          def wait_matrix(sha: str, phase: str,
                          timeout_seconds: int = 7200) -> tuple[str, dict[str, dict[str, Any]]]:
              started = time.time()
              last_signal = 0.0
              while time.time() - started < timeout_seconds:
                  state, runs, detail = matrix_state(sha)
                  log(f'{phase} matrix {state}: {detail}')
                  if state != 'pending':
                      return state, runs
                  if time.time() - last_signal > 600:
                      signal_wait(phase, sha, detail)
                      request_pull_request_event()
                      last_signal = time.time()
                  time.sleep(30)
              raise RuntimeError(f'{phase} matrix timed out for {sha}')

          def collect_failed_logs(runs: dict[str, dict[str, Any]]) -> str:
              chunks: list[str] = []
              for workflow in runs.values():
                  if workflow.get('status') != 'completed' or workflow.get(
                      'conclusion'
                  ) in ('success', 'skipped', 'neutral'):
                      continue
                  chunks.append(
                      f'===== WORKFLOW {workflow["name"]} RUN {workflow["id"]} ====='
                  )
                  jobs = api(
                      'GET', f'/actions/runs/{workflow["id"]}/jobs?per_page=100'
                  ).json().get('jobs', [])
                  for job in jobs:
                      if job.get('conclusion') != 'failure':
                          continue
                      chunks.append(
                          f'--- JOB {job.get("name")} ID {job.get("id")} ---'
                      )
                      try:
                          response = requests.get(
                              f'{API}/actions/jobs/{job["id"]}/logs',
                              headers=READ_HEADERS, timeout=150,
                              allow_redirects=True,
                          )
                          data = response.content
                          if data[:2] == b'PK':
                              with zipfile.ZipFile(BytesIO(data)) as archive:
                                  for name in archive.namelist():
                                      chunks.append(
                                          archive.read(name).decode(
                                              'utf-8', errors='replace'
                                          )[-80000:]
                                      )
                          else:
                              chunks.append(
                                  data.decode('utf-8', errors='replace')[-80000:]
                              )
                      except Exception as exc:
                          chunks.append(f'log download failed: {exc}')
              return '\n'.join(chunks)[-240000:]

          def rerun_failed(runs: dict[str, dict[str, Any]]) -> None:
              for workflow in runs.values():
                  if workflow.get('status') == 'completed' and workflow.get(
                      'conclusion'
                  ) not in ('success', 'skipped', 'neutral'):
                      try:
                          api(
                              'POST',
                              f'/actions/runs/{workflow["id"]}/rerun-failed-jobs',
                              write=True, allow=(201,),
                          )
                      except Exception as exc:
                          log(f'failed to rerun {workflow["name"]}: {exc}')

          def implementation_ci_loop(candidate: str) -> tuple[str, dict[str, dict[str, Any]]]:
              sha = candidate
              for cycle in range(1, 7):
                  state, runs = wait_matrix(sha, f'implementation-{cycle}')
                  if state == 'green':
                      return sha, runs
                  evidence = collect_failed_logs(runs)
                  before = git_status()
                  repair_implementation('EXACT-HEAD CI FAILURES:\n' + evidence)
                  if not git_status() and not before:
                      rerun_failed(runs)
                      state, rerun_runs = wait_matrix(
                          sha, f'implementation-rerun-{cycle}'
                      )
                      if state == 'green':
                          return sha, rerun_runs
                      repair_implementation(
                          'PERSISTENT CI FAILURES AFTER RERUN:\n'
                          + collect_failed_logs(rerun_runs)
                      )
                  sha = commit_and_push(
                      'fix(stocks): repair C3E exact-head verification'
                  )
              raise RuntimeError('C3E implementation CI cycles exhausted')

          def evidence_map(runs: dict[str, dict[str, Any]]) -> dict[str, Any]:
              return {
                  name: {
                      'run_id': runs[name]['id'],
                      'conclusion': runs[name].get('conclusion'),
                      'url': runs[name].get('html_url'),
                  }
                  for name in REQUIRED
              }

          def execution_log_path() -> Path:
              preferred = ROOT / 'docs/roadmaps/business-v2-development-execution-log-v1.md'
              if preferred.exists():
                  return preferred
              matches = sorted((ROOT / 'docs/roadmaps').glob('*execution-log*.md'))
              if not matches:
                  raise RuntimeError('authoritative Business V2 execution log not found')
              return matches[0]

          def author_certification_docs(
              implementation_sha: str,
