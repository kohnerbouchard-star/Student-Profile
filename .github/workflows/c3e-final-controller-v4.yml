                  'recorded in `multicurrency-stock-funding-c3e-handoff-v1.md`. The '
                  'next authorized checkpoint is `BUSINESS-V2-10A4C3F`.\n'
              )
              if '## Certified completion' not in note:
                  note += completion
              note_path.write_text(note)

              manifest_path = ROOT / 'docs/roadmaps/business-v2-current-checkpoint-v1.json'
              manifest = json.loads(manifest_path.read_text())
              manifest.update({
                  'status': 'IMPLEMENTED_NOT_MERGED',
                  'audited_at': datetime.now(timezone.utc).isoformat(),
                  'latest_checkpoint': 'BUSINESS-V2-10A4C3E',
                  'latest_checkpoint_branch': BRANCH,
                  'latest_checkpoint_pr': PR,
                  'exact_implementation_sha': implementation_sha,
                  'parent_checkpoint': 'BUSINESS-V2-10A4C3D',
                  'parent_implementation_sha': C3D_SHA,
