                      'is authorized.\n'
                  )
              reconciliation.write_text(reconciliation_text)

              log_path = execution_log_path()
              log_text = log_path.read_text()
              log_marker = '## BUSINESS-V2-10A4C3E — certified'
              if log_marker not in log_text:
                  log_text += (
                      f'\n\n{log_marker} {datetime.now(timezone.utc).date()}\n\n'
                      f'- Exact implementation: `{implementation_sha}`.\n'
                      f'- Complete required exact-head matrix: {len(REQUIRED)} '
                      'workflows green.\n'
