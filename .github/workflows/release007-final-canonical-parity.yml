name: RELEASE-007 Final Canonical Parity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release007-final-canonical-parity.yml

permissions:
  contents: read

concurrency:
  group: release007-final-canonical-parity
  cancel-in-progress: false

env:
  STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  SUPABASE_CLI_VERSION: "2.109.1"

jobs:
  staging:
    name: Canonicalize staging routines
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    outputs:
      schema_sha256: ${{ steps.fingerprint.outputs.sha256 }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Enforce staging boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test "$SUPABASE_PROJECT_REF" = "$STAGING_PROJECT_REF"
          test "$SUPABASE_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
      - name: Check out exact merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install tooling
        run: npm ci
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.109.1
      - name: Link protected staging
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"
          cp backend/supabase/config.next.toml backend/supabase/config.toml
          (cd backend && supabase --yes link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD")
          url="$(tr -d '\r\n' < backend/supabase/.temp/pooler-url)"
          case "$url" in "postgresql://postgres.${STAGING_PROJECT_REF}@"*:5432/postgres) ;; *) exit 1 ;; esac
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "PGPASSWORD=$SUPABASE_DB_PASSWORD" >> "$GITHUB_ENV"
          echo "PGSSLMODE=require" >> "$GITHUB_ENV"
      - name: Build exact canonical routine source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat \
            backend/supabase/migrations/20260725091000_restore_rate_limit_json_compat_and_grants_v1.sql \
            backend/supabase/migrations/20260725123000_persist_memorable_game_join_codes_v1.sql \
            backend/supabase/migrations/20260726095100_exempt_default_staff_grants_from_version_bump_v2.sql \
            backend/supabase/migrations/20260727090000_bound_arrival_class_grant_idempotency_v1.sql \
            backend/supabase/migrations/20260727130000_harden_purchase_code_hmac_upgrade_v1.sql \
            backend/supabase/migrations/20260728054000_replay_marketplace_purchase_before_resource_checks_v1.sql \
            backend/supabase/migrations/20260731131000_harden_onboarding_cleanup_and_license_replay_v1.sql \
            > "$RUNNER_TEMP/canonical-routines.sql"
          python3 - <<'PY' >> "$RUNNER_TEMP/canonical-routines.sql"
          from pathlib import Path
          text=Path('backend/supabase/migrations/20260617133000_create_store_items_v1.sql').read_text()
          start=text.index('create or replace function public.seed_default_store_items(')
          marker='grant execute on function public.seed_default_store_items(uuid) to service_role;'
          end=text.index(marker,start)+len(marker)
          print('\n'+text[start:end]+'\n')
          PY
      - name: Apply exact canonical routine source to staging
        shell: bash
        run: psql "$DATABASE_URL" -X --set=ON_ERROR_STOP=1 --no-psqlrc --file "$RUNNER_TEMP/canonical-routines.sql"
      - name: Validate staging runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select count(*) from public.account_balances where lower(btrim(account_type))='cash'")" = 0
          test "$(psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select to_regprocedure('public.read_player_credential_pepper_recovery_v1()') is null")" = t
          psql "$DATABASE_URL" -X --set=ON_ERROR_STOP=1 --no-psqlrc <<'SQL'
          do $validation$
          declare r record; result jsonb;
          begin
            for r in select id from public.game_sessions order by id loop
              result := public.validate_economic_asset_core_v2(r.id);
              if coalesce((result->>'valid')::boolean,false) is not true then
                raise exception 'ECONOMIC_ASSET_CORE_VALIDATION_FAILED:%',result;
              end if;
            end loop;
          end
          $validation$;
          SQL
      - name: Export staging semantic fingerprint
        id: fingerprint
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -qAt --set=ON_ERROR_STOP=1 --no-psqlrc --file scripts/release-integrity/export-schema-fingerprint.sql > "$RUNNER_TEMP/staging-raw.json"
          node scripts/release-integrity/cli.mjs normalize-schema --input "$RUNNER_TEMP/staging-raw.json" --output "$RUNNER_TEMP/staging.json" >/dev/null
          sha="$(sha256sum "$RUNNER_TEMP/staging.json" | awk '{print $1}')"
          [[ "$sha" =~ ^[a-f0-9]{64}$ ]]
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

  production:
    name: Canonicalize production routines
    needs: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      STAGING_SCHEMA_SHA256: ${{ needs.staging.outputs.schema_sha256 }}
    steps:
      - name: Enforce production boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test -n "$SUPABASE_DB_URL"
          [[ "$STAGING_SCHEMA_SHA256" =~ ^[a-f0-9]{64}$ ]]
      - name: Check out exact merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install tooling and verify production identity
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          SUPABASE_DB_URL="$SUPABASE_DB_URL" node scripts/release-integrity/cli.mjs validate-db-url --url-env SUPABASE_DB_URL --expected-project-ref "$PRODUCTION_PROJECT_REF"
      - name: Build exact canonical routine source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat \
            backend/supabase/migrations/20260725091000_restore_rate_limit_json_compat_and_grants_v1.sql \
            backend/supabase/migrations/20260725123000_persist_memorable_game_join_codes_v1.sql \
            backend/supabase/migrations/20260726095100_exempt_default_staff_grants_from_version_bump_v2.sql \
            backend/supabase/migrations/20260727090000_bound_arrival_class_grant_idempotency_v1.sql \
            backend/supabase/migrations/20260727130000_harden_purchase_code_hmac_upgrade_v1.sql \
            backend/supabase/migrations/20260728054000_replay_marketplace_purchase_before_resource_checks_v1.sql \
            backend/supabase/migrations/20260731131000_harden_onboarding_cleanup_and_license_replay_v1.sql \
            > "$RUNNER_TEMP/canonical-routines.sql"
          python3 - <<'PY' >> "$RUNNER_TEMP/canonical-routines.sql"
          from pathlib import Path
          text=Path('backend/supabase/migrations/20260617133000_create_store_items_v1.sql').read_text()
          start=text.index('create or replace function public.seed_default_store_items(')
          marker='grant execute on function public.seed_default_store_items(uuid) to service_role;'
          end=text.index(marker,start)+len(marker)
          print('\n'+text[start:end]+'\n')
          PY
      - name: Apply exact canonical routine source to production
        shell: bash
        run: psql "$SUPABASE_DB_URL" -X --set=ON_ERROR_STOP=1 --no-psqlrc --file "$RUNNER_TEMP/canonical-routines.sql"
      - name: Validate production runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select count(*) from public.account_balances where lower(btrim(account_type))='cash'")" = 0
          test "$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select to_regprocedure('public.read_player_credential_pepper_recovery_v1()') is null")" = t
          psql "$SUPABASE_DB_URL" -X --set=ON_ERROR_STOP=1 --no-psqlrc <<'SQL'
          do $validation$
          declare r record; result jsonb;
          begin
            for r in select id from public.game_sessions order by id loop
              result := public.validate_economic_asset_core_v2(r.id);
              if coalesce((result->>'valid')::boolean,false) is not true then
                raise exception 'ECONOMIC_ASSET_CORE_VALIDATION_FAILED:%',result;
              end if;
            end loop;
          end
          $validation$;
          SQL
      - name: Require exact semantic schema and authorization parity
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -qAt --set=ON_ERROR_STOP=1 --no-psqlrc --file scripts/release-integrity/export-schema-fingerprint.sql > "$RUNNER_TEMP/production-raw.json"
          node scripts/release-integrity/cli.mjs normalize-schema --input "$RUNNER_TEMP/production-raw.json" --output "$RUNNER_TEMP/production.json" >/dev/null
          sha="$(sha256sum "$RUNNER_TEMP/production.json" | awk '{print $1}')"
          echo "staging=$STAGING_SCHEMA_SHA256 production=$sha"
          test "$sha" = "$STAGING_SCHEMA_SHA256"

  staging_ledger:
    name: Normalize staging migration ledger
    needs: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out exact merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.109.1
      - name: Link staging
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = "$STAGING_PROJECT_REF"
          cp backend/supabase/config.next.toml backend/supabase/config.toml
          (cd backend && supabase --yes link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD")
          url="$(tr -d '\r\n' < backend/supabase/.temp/pooler-url)"
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "PGPASSWORD=$SUPABASE_DB_PASSWORD" >> "$GITHUB_ENV"
          echo "PGSSLMODE=require" >> "$GITHUB_ENV"
      - name: Archive and normalize staging ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/expected.sql"
          from pathlib import Path
          rows=[]
          for p in sorted(Path('backend/supabase/migrations').glob('*.sql')):
              version,name=p.stem.split('_',1)
              if len(version)==14 and version.isdigit(): rows.append((version,name))
          print('create temp table expected_migrations(version text primary key,name text not null);')
          print('insert into expected_migrations(version,name) values')
          print(',\n'.join("('%s','%s')"%(v,n.replace("'","''")) for v,n in rows)+';')
          PY
          psql "$DATABASE_URL" -X --set=ON_ERROR_STOP=1 --no-psqlrc -v env_name="staging" -v source_commit="$GITHUB_SHA" -v run_id="$GITHUB_RUN_ID" <<SQL
          begin;
          \i $RUNNER_TEMP/expected.sql
          insert into private.migration_ledger_history_archive(archive_batch_id,environment,source_commit,workflow_run_id,version,statements,name,created_by,idempotency_key,rollback)
          select 'release007-final-' || :'source_commit', :'env_name', :'source_commit', :'run_id', version,statements,name,created_by,idempotency_key,rollback
          from supabase_migrations.schema_migrations on conflict (archive_batch_id,version) do nothing;
          create temp table old_migrations as table supabase_migrations.schema_migrations;
          delete from supabase_migrations.schema_migrations;
          insert into supabase_migrations.schema_migrations(version,statements,name,created_by,idempotency_key,rollback)
          select e.version,o.statements,e.name,o.created_by,o.idempotency_key,o.rollback from expected_migrations e left join old_migrations o using(version) order by e.version;
          do \$verify\$ begin
            if exists (select version from expected_migrations except select version from supabase_migrations.schema_migrations)
               or exists (select version from supabase_migrations.schema_migrations except select version from expected_migrations)
               or exists (select 1 from supabase_migrations.schema_migrations m join expected_migrations e using(version) where m.name is distinct from e.name)
            then raise exception 'MIGRATION_LEDGER_RECONCILIATION_FAILED'; end if;
          end \$verify\$;
          commit;
          SQL

  production_ledger:
    name: Normalize production migration ledger
    needs: staging_ledger
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check out exact merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive and normalize production ledger
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          python3 - <<'PY' > "$RUNNER_TEMP/expected.sql"
          from pathlib import Path
          rows=[]
          for p in sorted(Path('backend/supabase/migrations').glob('*.sql')):
              version,name=p.stem.split('_',1)
              if len(version)==14 and version.isdigit(): rows.append((version,name))
          print('create temp table expected_migrations(version text primary key,name text not null);')
          print('insert into expected_migrations(version,name) values')
          print(',\n'.join("('%s','%s')"%(v,n.replace("'","''")) for v,n in rows)+';')
          PY
          psql "$SUPABASE_DB_URL" -X --set=ON_ERROR_STOP=1 --no-psqlrc -v env_name="production" -v source_commit="$GITHUB_SHA" -v run_id="$GITHUB_RUN_ID" <<SQL
          begin;
          \i $RUNNER_TEMP/expected.sql
          insert into private.migration_ledger_history_archive(archive_batch_id,environment,source_commit,workflow_run_id,version,statements,name,created_by,idempotency_key,rollback)
          select 'release007-final-' || :'source_commit', :'env_name', :'source_commit', :'run_id', version,statements,name,created_by,idempotency_key,rollback
          from supabase_migrations.schema_migrations on conflict (archive_batch_id,version) do nothing;
          create temp table old_migrations as table supabase_migrations.schema_migrations;
          delete from supabase_migrations.schema_migrations;
          insert into supabase_migrations.schema_migrations(version,statements,name,created_by,idempotency_key,rollback)
          select e.version,o.statements,e.name,o.created_by,o.idempotency_key,o.rollback from expected_migrations e left join old_migrations o using(version) order by e.version;
          do \$verify\$ begin
            if exists (select version from expected_migrations except select version from supabase_migrations.schema_migrations)
               or exists (select version from supabase_migrations.schema_migrations except select version from expected_migrations)
               or exists (select 1 from supabase_migrations.schema_migrations m join expected_migrations e using(version) where m.name is distinct from e.name)
            then raise exception 'MIGRATION_LEDGER_RECONCILIATION_FAILED'; end if;
          end \$verify\$;
          commit;
          SQL
      - name: Final release assertion
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select count(*) from public.account_balances where lower(btrim(account_type))='cash'")" = 0
          echo '## RELEASE-007 FINAL: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Canonical routine source parity: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Structural + authorization fingerprint parity: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Migration ledger forensic archive: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Migration ledger repository identity: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Economic core validation: PASS' >> "$GITHUB_STEP_SUMMARY"
