name: Story Narrative S2 Member Diagnose And Log

on:
  push:
    branches:
      - feat/story-narrative-convergence-v1
    paths:
      - ".github/workflows/story-narrative-s2-member-diagnose-and-log.yml"

permissions:
  contents: write

jobs:
  diagnose-and-log:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify prefixed archive members and persist roadmap evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import json
          import os
          import tarfile

          encoded = b"".join(Path(f"scripts/story-narrative/s2/bootstrap.part{i:02d}").read_bytes() for i in range(5))
          archive = base64.b64decode(encoded, validate=True)
          archive_sha = hashlib.sha256(archive).hexdigest()
          member_results = []
          error = None
          manifest_verified = False
          prefix = None
          try:
              with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as tf:
                  names = tf.getnames()
                  manifest_names = [name for name in names if name.endswith("/MANIFEST.json") or name == "MANIFEST.json"]
                  if len(manifest_names) != 1:
                      raise RuntimeError(f"expected one manifest, found {manifest_names}")
                  manifest_name = manifest_names[0]
                  prefix = manifest_name[:-len("MANIFEST.json")]
                  manifest_member = tf.extractfile(manifest_name)
                  if manifest_member is None:
                      raise RuntimeError("manifest member unavailable")
                  manifest = json.loads(manifest_member.read().decode("utf-8"))
                  ok = True
                  for item in manifest["files"]:
                      member_name = prefix + item["path"]
                      member = tf.extractfile(member_name)
                      if member is None:
                          member_results.append((item["path"], False, "missing"))
                          ok = False
                          continue
                      data = member.read()
                      digest = hashlib.sha256(data).hexdigest()
                      good = len(data) == item["bytes"] and digest == item["sha256"]
                      member_results.append((item["path"], good, f"{len(data)} bytes sha256={digest}"))
                      ok = ok and good
                  manifest_verified = ok
          except Exception as exc:
              error = f"{type(exc).__name__}: {exc}"

          roadmap = Path("docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md")
          text = roadmap.read_text(encoding="utf-8")
          marker = "\n## Run-completion rule\n"
          if marker not in text:
              raise SystemExit("roadmap marker not found")
          lines = [
              "",
              "### Run 2026-08-10 — S2 prefixed archive member diagnostic",
              "",
              f"Workflow run: `{os.environ['GITHUB_RUN_ID']}`",
              f"Diagnostic source head: `{os.environ['GITHUB_SHA']}`",
              "",
              "Correction to prior diagnostic: the tar archive intentionally stores payloads under top-level `s2bundle/`; the prior check looked for the manifest at archive root.",
              "",
              f"Reconstructed archive SHA-256: `{archive_sha}`",
              f"Resolved archive prefix: `{prefix}`",
              f"per-member MANIFEST verification: `{str(manifest_verified).lower()}`",
              "",
          ]
          for path, good, detail in member_results:
              lines.append(f"- `{path}`: verified `{str(good).lower()}` ({detail});")
          if error:
              lines += ["", f"Archive diagnostic error: `{error}`"]
          lines += [
              "",
              "Next: if every member verifies, correct the temporary S2 landing workflow to use the actual stored chunk hashes, reconstructed archive hash, and resolved top-level payload directory; keep all manifest checks before migration generation.",
              "",
          ]
          text = text.replace(marker, "\n".join(lines) + marker, 1)
          roadmap.write_text(text, encoding="utf-8")

          if not manifest_verified:
              print("S2 member verification is not green; evidence persisted.")
          else:
              print("S2 archive member verification is green.")
          PY
          git diff --check
          rm -f .github/workflows/story-narrative-s2-member-diagnose-and-log.yml
          git add -A -- docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md .github/workflows/story-narrative-s2-member-diagnose-and-log.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(story): record S2 archive member verification"
          git push origin HEAD:feat/story-narrative-convergence-v1
