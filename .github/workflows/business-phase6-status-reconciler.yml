name: Business Phase 6 Status Reconciler

on:
  push:
    branches:
      - feat/business-timed-manufacturing-v2
    paths:
      - .github/workflows/business-phase6-status-reconciler.yml

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0
      - name: Wait for authoritative status and reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import re
          import time
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "econovaria-phase6-reconciler",
          }
          required = [
              "Business Timed Manufacturing V2",
              "Business Manufacturing Resource Hold V2",
              "Business Timed Manufacturing Resource Hold V2",
              "Business Manufacturing Completion V2",
              "Database Replay",
              "Backend Typecheck",
              "Player Terminal Verify",
              "Business Banking Runtime",
              "Business Economy V2",
              "Business Workforce Production Payroll V2",
              "Repository Quality",
              "Supply Chain Security",
              "Admin API Check",
              "Staging Readiness Preflight",
              "Required Game Market Timezone",
              "Exchange Calendar Runtime",
          ]

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          deadline = time.time() + 58 * 60
          while time.time() < deadline:
              scope = Path("docs/roadmaps/business-phase6-timed-manufacturing-scope-v1.md").read_text()
              log = Path("docs/roadmaps/business-v2-development-execution-log-v1.md").read_text()
              plan = Path("docs/roadmaps/business-v2-development-execution-plan-v1.md").read_text()
              match = re.findall(
                  r"Exact certified implementation and verification source:\*\* `([0-9a-f]{40})`|Exact implementation and verification source:\*\* `([0-9a-f]{40})`",
                  log + "\n" + scope,
              )
              source = ""
              for pair in reversed(match):
                  source = pair[0] or pair[1]
                  if source:
                      break
              durable = (
                  "**Status:** COMPLETE" in scope
                  and "Phase 6 COMPLETE: timed manufacturing" in log
                  and "Phase 7" in plan
                  and bool(source)
              )
              latest = {}
              if source:
                  payload = get_json(
                      f"https://api.github.com/repos/{repo}/actions/runs?head_sha={source}&per_page=100"
                  )
                  for run in payload.get("workflow_runs", []):
                      name = run.get("name")
                      current = latest.get(name)
                      if current is None or run.get("created_at", "") > current.get("created_at", ""):
                          latest[name] = run
              missing = [name for name in required if name not in latest]
              pending = [
                  name for name in required
                  if name in latest and latest[name].get("status") != "completed"
              ]
              failed = [
                  name for name in required
                  if name in latest
                  and latest[name].get("status") == "completed"
                  and latest[name].get("conclusion") != "success"
              ]
              if durable and not missing and not pending and not failed:
                  evidence = {
                      name: {
                          "runId": latest[name]["id"],
                          "conclusion": latest[name]["conclusion"],
                          "htmlUrl": latest[name]["html_url"],
                      }
                      for name in required
                  }
                  marker = {
                      "schemaVersion": 1,
                      "status": "CERTIFIED",
                      "implementationSourceSha": source,
                      "prNumber": 661,
                      "branch": "feat/business-timed-manufacturing-v2",
                      "workflows": evidence,
                      "mergeAuthorized": False,
                      "deploymentAuthorized": False,
                      "nextAuthorizedPhase": "Phase 7 — Store seller offers and sellable Finished Goods",
                  }
                  Path("docs/roadmaps/business-phase6-certified-v1.json").write_text(
                      json.dumps(marker, indent=2, sort_keys=True) + "\n"
                  )
                  checks = "\n".join(
                      f"- {name} (`{payload['runId']}`)"
                      for name, payload in evidence.items()
                  )
                  Path("/tmp/phase6-pr.md").write_text(f"""## Certified scope

Phase 6 provides the authoritative server-timed Business manufacturing lifecycle on the certified Phase 5 stack.

- **Exact Phase 6 implementation and verification source:** `{source}`.
- Parent PR: #660.

PR #661 remains intentionally **draft, open, unmerged, and undeployed**. It does not authorize merge, staging deployment, production deployment, secret mutation, or live database mutation.

## Certified behavior

- atomic canonical Warehouse → WIP material, eligible-labor, and installed-equipment holds before one job exists;
- server-owned timing and bounded deterministic queue/due-job workers;
- exact-once WIP consumption, Finished Goods output, cost basis, and reservation settlement;
- exact-once cancellation/failure release and terminal immutability;
- authenticated public-key-only Player mutations, reads, and UI lifecycle state;
- explicit retirement of instant physical production.

## Exact-source verification

{checks}

## Exclusions

Store seller offers, Store-listing inventory, automatic sales convergence, durability/repair economics, equity/IPO publication, merge, staging, production deployment, secret changes, and live data mutation remain outside Phase 6.

**Next authorized phase: Phase 7 — Store seller offers and sellable Finished Goods.**
""")
                  break
              if failed:
                  Path("docs/roadmaps/business-phase6-blocked-v1.json").write_text(
                      json.dumps({
                          "schemaVersion": 1,
                          "status": "BLOCKED",
                          "sourceSha": source or None,
                          "failedWorkflows": {
                              name: {
                                  "runId": latest[name]["id"],
                                  "conclusion": latest[name].get("conclusion"),
                                  "htmlUrl": latest[name].get("html_url"),
                              }
                              for name in failed
                          },
                      }, indent=2, sort_keys=True) + "\n"
                  )
                  raise SystemExit(
                      "Phase 6 remains blocked: " + json.dumps(failed)
                  )
              time.sleep(20)
              os.system("git pull --ff-only origin feat/business-timed-manufacturing-v2 >/dev/null 2>&1")
          else:
              raise SystemExit("Timed out waiting for a certifiable Phase 6 durable state.")
          PY
          rm .github/workflows/business-phase6-status-reconciler.yml
          rm -f docs/roadmaps/business-phase6-blocked-v1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(business): confirm Phase 6 certified state"
          git push origin HEAD:feat/business-timed-manufacturing-v2
          gh pr edit 661 \
            --repo "${{ github.repository }}" \
            --title "Draft: Business V2 Phase 6 timed manufacturing — certified" \
            --body-file /tmp/phase6-pr.md
