name: FX Temporal Cutover Qualification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]
    paths:
      - ".github/workflows/fx-temporal-cutover-qualification.yml"
      - "scripts/fx-temporal-cutover-qualification.mjs"
      - "scripts/fx-temporal-cutover-concurrency.mjs"
      - "scripts/fx-temporal-cutover-concurrency.test.mjs"
      - "backend/supabase/migrations/20261117035856_fx_bootstrap_temporal_provenance.sql"
      - "scripts/canonical-fx-authority-database.mjs"
      - "docs/roadmaps/econovaria-beta-completion-roadmap-v1.md"
      - "docs/operations/evidence/fx-temporal-cutover/scope.md"
      - "docs/operations/evidence/fx-temporal-cutover/qualification-plan.md"
      - "docs/operations/evidence/fx-temporal-cutover/qualification-authority.json"

permissions:
  contents: read

concurrency:
  group: fx-temporal-cutover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  disposable-postgres:
    name: FX temporal disposable PostgreSQL qualification
    if: github.event.pull_request.head.ref == 'fix/fx-bootstrap-temporal-provenance' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact scoped draft PR before installing or running anything
        run: node scripts/fx-temporal-cutover-qualification.mjs --event
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install lockfile-pinned tools
        run: |
          npm install --global npm@10.9.8
          npm ci --ignore-scripts
      - name: Validate scope and migrations
        run: |
          node scripts/fx-temporal-cutover-qualification.mjs
          node scripts/validate-supabase-migrations.mjs
          node --check scripts/canonical-fx-authority-database.mjs
          node --test scripts/fx-temporal-cutover-concurrency.test.mjs
      - name: Require disposable local database tools
        run: |
          docker info >/dev/null
          psql --version
      - name: Start disposable Supabase
        run: npx --no-install supabase start --workdir backend --exclude studio,imgproxy,inbucket,storage-api,edge-runtime,logflare,vector,supavisor
      - name: Replay all forward migrations once
        run: npx --no-install supabase db reset --workdir backend --local
      - name: Replay all forward migrations twice
        run: npx --no-install supabase db reset --workdir backend --local
      - name: Run rollback-only FX acceptance and bounded real-clock Story consumption
        run: node scripts/canonical-fx-authority-database.mjs --real-clock-story-proof
      - name: Exercise real independent-session FX lifecycle races
        run: node scripts/fx-temporal-cutover-concurrency.mjs
      - name: Lint rebuilt local schema
        run: npx --no-install supabase db lint --workdir backend --local --level warning --fail-on error
      - name: Destroy disposable stack
        if: always()
        run: npx --no-install supabase stop --workdir backend --no-backup || true
