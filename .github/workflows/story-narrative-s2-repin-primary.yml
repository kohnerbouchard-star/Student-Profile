name: Story Narrative S2 Repin Primary Patcher

on:
  push:
    branches:
      - feat/story-narrative-convergence-v1
    paths:
      - ".github/workflows/story-narrative-s2-repin-primary.yml"

permissions:
  contents: write

jobs:
  repin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact story branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Repin primary patcher and trigger full S2 verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/story-narrative-s2-verify-and-land-v2.yml')
          text = path.read_text(encoding='utf-8')
          old = 'bdbe19e9a0b8f6fb793defdfe94da9a91ab8d471'
          new = 'f44a0fad07243a30f4922bda4fc055a54fc65da0'
          if text.count(old) != 1:
              raise SystemExit('old S2 primary patcher pin did not match exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          rm -f .github/workflows/story-narrative-s2-repin-primary.yml
          git add -A -- .github/workflows/story-narrative-s2-verify-and-land-v2.yml .github/workflows/story-narrative-s2-repin-primary.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(story): repin repaired S2 primary patcher"
          git push origin HEAD:feat/story-narrative-convergence-v1
