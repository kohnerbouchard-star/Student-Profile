name: C3E Inventory Finalize

on:
  push:
    branches:
      - feat/multicurrency-stock-funding-v1

permissions:
  contents: write

concurrency:
  group: c3e-inventory-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"

      - name: Generate inventory for final tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/c3e-inventory-finalize.yml
          node scripts/architecture/build-architecture-inventory.mjs

      - name: Commit inventory and self-removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/c3e-inventory-finalize.yml docs/architecture/inventories/econovaria-architecture-inventory-v2.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(architecture): finalize C3E inventory"
          git push origin "HEAD:${GITHUB_REF_NAME}"
