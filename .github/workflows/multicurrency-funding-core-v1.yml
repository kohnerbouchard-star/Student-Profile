name: multicurrency-funding-core-v1

on:
  pull_request:
    paths:
      - .github/workflows/multicurrency-funding-core-v1.yml
      - .github/workflows/banking-fx-clearing-v1.yml
      - backend/supabase/migrations/20260827090000_multicurrency_funding_quote_v1.sql
      - backend/supabase/migrations/20260827090500_multicurrency_funding_quote_stage_isolation_v1.sql
      - backend/supabase/migrations/20260827091000_multicurrency_funding_composer_v1.sql
      - backend/supabase/migrations/20260827092000_multicurrency_funding_assertions_v1.sql
      - docs/operations/contracts/player-cross-cutting/pr-673.json
      - docs/roadmaps/multicurrency-funding-core-scope-v1.md
      - scripts/multicurrency-funding-core-contract.mjs
      - scripts/multicurrency-funding-core-simulation.mjs
      - scripts/multicurrency-funding-database.mjs
      - scripts/multicurrency-funding-concurrency.mjs
  push:
    branches:
      - feat/multicurrency-funding-core-v1
    paths:
      - .github/workflows/multicurrency-funding-core-v1.yml
      - backend/supabase/migrations/20260827090000_multicurrency_funding_quote_v1.sql
      - backend/supabase/migrations/20260827090500_multicurrency_funding_quote_stage_isolation_v1.sql
      - backend/supabase/migrations/20260827091000_multicurrency_funding_composer_v1.sql
      - backend/supabase/migrations/20260827092000_multicurrency_funding_assertions_v1.sql
      - scripts/multicurrency-funding-*.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multicurrency-funding-core-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Verify multi-currency funding source and scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          npm ci --ignore-scripts
          npm ci --prefix backend --ignore-scripts

      - name: Verify PR-bound authority and source contracts
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '673' }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'feat/banking-fx-clearing-v1' }}
        run: |
          set -euo pipefail
          node --test scripts/player-cross-cutting-authority.test.mjs
          git diff --name-only "origin/${BASE_REF}...HEAD" | sort -u > /tmp/c0-changed-files.txt
          node scripts/verify-player-cross-cutting-authority.mjs \
            --changed-files /tmp/c0-changed-files.txt \
            --pr-number "$PR_NUMBER" \
            --base-ref "$BASE_REF"
          node scripts/multicurrency-funding-core-contract.mjs
          node scripts/multicurrency-funding-core-simulation.mjs
          npm run --prefix backend test:banking-fx-clearing
          node scripts/validate-supabase-migrations.mjs
          node scripts/local-edge-runtime-contract.test.mjs
          git diff --check

  disposable-database:
    name: Verify multi-currency funding database and races
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install pinned tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          npm ci --ignore-scripts

      - name: Start disposable Postgres service
        shell: bash
        run: |
          set -euo pipefail
          LOG="/tmp/multicurrency-funding-startup.log"
          : > "$LOG"
          STATUS=1
          EXCLUDED="studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,gotrue,postgrest,realtime,kong,mailpit,postgres-meta"
          for ATTEMPT in 1 2 3; do
            printf '\n## Supabase Postgres startup attempt %s\n' "$ATTEMPT" | tee -a "$LOG"
            set +e
            npx supabase start --workdir backend --exclude "$EXCLUDED" 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            npx supabase status --workdir backend 2>&1 | tee -a "$LOG" || true
            npx supabase stop --workdir backend --no-backup 2>&1 | tee -a "$LOG" || true
            sleep $((ATTEMPT * 10))
          done
          exit "$STATUS"

      - name: Replay zero-to-head twice
        shell: bash
        run: |
          set -euo pipefail
          npx supabase db reset --workdir backend --local
          npx supabase db reset --workdir backend --local

      - name: Run retained Banking and C0 serial acceptance
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          node scripts/banking-fx-database-acceptance.mjs
          node scripts/multicurrency-funding-database.mjs

      - name: Rebuild before observed concurrency
        run: npx supabase db reset --workdir backend --local

      - name: Run C0 observed concurrency
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/multicurrency-funding-concurrency.mjs

      - name: Lint rebuilt database
        run: npx supabase db lint --workdir backend --local --level warning

      - name: Capture disposable diagnostics
        if: failure()
        shell: bash
        run: |
          npx supabase status --workdir backend 2>&1 | tee -a /tmp/multicurrency-funding-status.log || true
          docker ps -a 2>&1 | tee -a /tmp/multicurrency-funding-docker.log || true
          docker system df 2>&1 | tee -a /tmp/multicurrency-funding-docker.log || true

      - name: Upload disposable diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: multicurrency-funding-core-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/multicurrency-funding-startup.log
            /tmp/multicurrency-funding-status.log
            /tmp/multicurrency-funding-docker.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop disposable stack
        if: always()
        run: npx supabase stop --workdir backend --no-backup || true
