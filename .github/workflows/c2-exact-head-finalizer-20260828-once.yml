name: C2 exact-head finalizer once

on:
  push:
    branches:
      - feat/multicurrency-marketplace-funding-v1
    paths:
      - .github/workflows/c2-exact-head-finalizer-20260828-once.yml

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BRANCH: feat/multicurrency-marketplace-funding-v1
      PR_NUMBER: "675"
    steps:
      - name: Check out exact controller head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify controller ancestry
        id: ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          TEST_SHA="$(git rev-parse HEAD^)"
          CLEAN_TREE_SOURCE="$(git rev-parse "${TEST_SHA}^")"
          echo "test_sha=${TEST_SHA}" >> "$GITHUB_OUTPUT"
          echo "clean_tree_source=${CLEAN_TREE_SOURCE}" >> "$GITHUB_OUTPUT"

      - name: Wait for clean-tree local certification
        id: local_certification
        shell: bash
        env:
          TEST_SHA: ${{ steps.ancestry.outputs.test_sha }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for ATTEMPT in $(seq 1 240); do
            RUN_JSON="$(gh api --method GET "/repos/${REPOSITORY}/actions/runs?head_sha=${TEST_SHA}&per_page=100")"
            RUN_ID="$(jq -r '.workflow_runs[] | select(.name == "C2 local certification once") | .id' <<<"$RUN_JSON" | head -n1)"
            STATUS="$(jq -r --argjson id "${RUN_ID:-0}" '.workflow_runs[] | select(.id == $id) | .status' <<<"$RUN_JSON" | head -n1)"
            CONCLUSION="$(jq -r --argjson id "${RUN_ID:-0}" '.workflow_runs[] | select(.id == $id) | .conclusion // ""' <<<"$RUN_JSON" | head -n1)"
            if [[ -n "$RUN_ID" && "$STATUS" == "completed" ]]; then
              test "$CONCLUSION" = "success"
              echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "C2 local certification did not reach a successful terminal state." >&2
          exit 1

      - name: Materialize carrier-free exact implementation commit
        id: implementation
        shell: bash
        env:
          CLEAN_TREE_SOURCE: ${{ steps.ancestry.outputs.clean_tree_source }}
        run: |
          set -euo pipefail
          rm .github/workflows/c2-local-certification-20260828-once.yml
          rm .github/workflows/c2-exact-head-finalizer-20260828-once.yml
          git diff --check
          git diff --exit-code "$CLEAN_TREE_SOURCE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(c2): remove certification carriers"
          IMPLEMENTATION_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:${BRANCH}"
          echo "sha=${IMPLEMENTATION_SHA}" >> "$GITHUB_OUTPUT"

      - name: Run retained local repository gates on exact implementation tree
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          npm ci --ignore-scripts
          npm --prefix backend ci --ignore-scripts
          npm --prefix player-terminal ci --ignore-scripts
          npm run security:secrets
          node scripts/architecture/build-architecture-inventory.mjs
          node scripts/architecture/architecture-ratchet-v2.mjs
          git diff --exit-code -- docs/architecture/inventories/econovaria-architecture-inventory-v2.json
          npm --prefix backend run typecheck
          npm --prefix backend run test:player-marketplace
          npm --prefix player-terminal run verify
          git diff --check

      - name: Dispatch permanent stack certification workflows
        id: dispatch
        shell: bash
        env:
          IMPLEMENTATION_SHA: ${{ steps.implementation.outputs.sha }}
        run: |
          set -euo pipefail
          : > /tmp/c2-dispatched-workflows.txt
          for WORKFLOW in \
            .github/workflows/banking-fx-clearing-v1.yml \
            .github/workflows/multicurrency-funding-core-v1.yml \
            .github/workflows/multicurrency-store-funding-v1.yml \
            .github/workflows/multicurrency-marketplace-funding-v1.yml \
            .github/workflows/business-player-store-cutover-v2.yml
          do
            if [[ ! -f "$WORKFLOW" ]]; then
              echo "Required permanent workflow is missing: $WORKFLOW" >&2
              exit 1
            fi
            if ! grep -q 'workflow_dispatch:' "$WORKFLOW"; then
              echo "Required permanent workflow is not manually dispatchable: $WORKFLOW" >&2
              exit 1
            fi
            gh workflow run "$WORKFLOW" --ref "$BRANCH"
            printf '%s\n' "$WORKFLOW" >> /tmp/c2-dispatched-workflows.txt
          done
          cat /tmp/c2-dispatched-workflows.txt

      - name: Hold exact implementation SHA through permanent stack workflows
        id: permanent
        shell: bash
        env:
          IMPLEMENTATION_SHA: ${{ steps.implementation.outputs.sha }}
        run: |
          set -euo pipefail
          : > /tmp/c2-permanent-runs.tsv
          while IFS= read -r WORKFLOW; do
            RUN_ID=""
            for ATTEMPT in $(seq 1 300); do
              RUNS="$(gh run list --workflow "$WORKFLOW" --commit "$IMPLEMENTATION_SHA" --event workflow_dispatch --limit 20 --json databaseId,status,conclusion,headSha,workflowName)"
              RUN_ID="$(jq -r --arg sha "$IMPLEMENTATION_SHA" '[.[] | select(.headSha == $sha)][0].databaseId // empty' <<<"$RUNS")"
              STATUS="$(jq -r --arg sha "$IMPLEMENTATION_SHA" '[.[] | select(.headSha == $sha)][0].status // empty' <<<"$RUNS")"
              CONCLUSION="$(jq -r --arg sha "$IMPLEMENTATION_SHA" '[.[] | select(.headSha == $sha)][0].conclusion // empty' <<<"$RUNS")"
              NAME="$(jq -r --arg sha "$IMPLEMENTATION_SHA" '[.[] | select(.headSha == $sha)][0].workflowName // empty' <<<"$RUNS")"
              if [[ -n "$RUN_ID" && "$STATUS" == "completed" ]]; then
                test "$CONCLUSION" = "success"
                printf '%s\t%s\t%s\n' "$WORKFLOW" "$RUN_ID" "$NAME" >> /tmp/c2-permanent-runs.tsv
                break
              fi
              sleep 15
            done
            if [[ -z "$RUN_ID" || "$STATUS" != "completed" || "$CONCLUSION" != "success" ]]; then
              echo "Permanent workflow failed or timed out: $WORKFLOW" >&2
              exit 1
            fi
          done < /tmp/c2-dispatched-workflows.txt
          cat /tmp/c2-permanent-runs.tsv
          {
            echo 'runs<<EOF'
            cat /tmp/c2-permanent-runs.tsv
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Write durable C2 completion records
        shell: bash
        env:
          IMPLEMENTATION_SHA: ${{ steps.implementation.outputs.sha }}
          LOCAL_RUN_ID: ${{ steps.local_certification.outputs.run_id }}
          PERMANENT_RUNS: ${{ steps.permanent.outputs.runs }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import os
          import re

          implementation = os.environ["IMPLEMENTATION_SHA"]
          local_run = os.environ["LOCAL_RUN_ID"]
          permanent_runs = os.environ["PERMANENT_RUNS"].strip()
          timestamp = datetime.now(timezone.utc).isoformat()

          scope_path = Path("docs/roadmaps/multicurrency-marketplace-funding-scope-v1.md")
          scope = scope_path.read_text()
          if re.search(r"(?m)^\*\*Status:\*\*.*$", scope):
              scope = re.sub(
                  r"(?m)^\*\*Status:\*\*.*$",
                  "**Status:** `IMPLEMENTED_NOT_MERGED`",
                  scope,
                  count=1,
              )
          elif "`IMPLEMENTED_NOT_MERGED`" not in scope:
              scope = scope.replace(
                  "# Multi-Currency Marketplace Funding Scope v1\n",
                  "# Multi-Currency Marketplace Funding Scope v1\n\n**Status:** `IMPLEMENTED_NOT_MERGED`\n",
                  1,
              )
          marker = "## Exact implementation certification"
          if marker not in scope:
              scope += f"""

{marker}

- Exact implementation and verification source: `{implementation}`.
- Clean-tree local certification workflow run: `{local_run}`.
- Permanent B2, C0, C1, C2, and connected Store workflows were manually dispatched against that exact source and completed successfully.
- C2 remains draft, unmerged, and undeployed.
- No scheduler, secret, staging/production SQL, or live-database mutation was performed.

C3 may begin only from the later clean documentation handoff. The documentation head does not replace `{implementation}` as the tested implementation identity.
"""
          scope_path.write_text(scope)

          run_lines = []
          for line in permanent_runs.splitlines():
              parts = line.split("\t")
              if len(parts) >= 3:
                  run_lines.append(f"- `{parts[2]}` — run `{parts[1]}` — PASS")
          evidence = "\n".join(run_lines)

          handoff = f"""# Multi-Currency Marketplace Funding Implementation Handoff v1

**Roadmap checkpoint:** `BUSINESS-V2-10A4C2`  
**Status:** `IMPLEMENTED_NOT_MERGED`  
**Branch:** `feat/multicurrency-marketplace-funding-v1`  
**Draft PR:** #675  
**Exact implementation and verification source:** `{implementation}`  
**Recorded at:** `{timestamp}`  
**Merge/deployment authorized:** No

## Implemented authority

- Marketplace listing currency remains the exact bill currency.
- Buyers may fund an exact Marketplace bill from one to three canonical active Checking accounts.
- Same-currency lines settle at rate `1`; foreign lines consume the certified C0 retail-checkout policy, B1 fixing, and B2 clearing/reserve/liquidity authority.
- Marketplace retains listing, reservation, order, dispute, fee, tax, Inventory custody, replay, and listing-first serialization authority.
- Buyer funding, FX effects, seller/fee/tax distribution, exact item delivery, listing mutation, reservation consumption, order completion, and immutable receipts commit atomically or roll back together.
- Funded refunds reverse original source debits and original FX evidence rather than repricing at a later fixing.
- The legacy direct purchase route is retired with bounded authenticated `410 Gone` behavior.
- Browser contracts use opaque public keys and expose no internal UUIDs or trusted monetary inputs.

## Exact-source evidence

- Clean-tree local certification — run `{local_run}` — PASS.
{evidence}

The local certification covered source authority, Backend typecheck and Marketplace tests, complete standalone Player Terminal verification, focused Chromium, two zero-to-head database replays, C2 serial/rollback/concurrency/privacy/two-game acceptance, rebuilt-schema lint, migration validation, architecture inventory, and repository security checks.

## Safety boundary

PR #675 remains draft, open, unmerged, and undeployed. No merge, deployment, scheduler installation, secret mutation, staging/production SQL, or live-database operation was performed.

## Next checkpoint

`BUSINESS-V2-10A4C3` — Stock Market multi-currency funding — may begin on a separate stacked draft branch from the clean C2 documentation handoff. C3 must retain Financial Markets as order-book/trade/securities authority while consuming C0/B1/B2 for listing-currency purchase funding.
"""
          Path("docs/roadmaps/multicurrency-marketplace-funding-implementation-handoff-v1.md").write_text(handoff)

          completion = f"""

## BUSINESS-V2-10A4C2 — Multi-Currency Marketplace Funding

**Status:** `IMPLEMENTED_NOT_MERGED`  
**Exact implementation and verification source:** `{implementation}`  
**Draft PR:** #675

Marketplace resale now consumes the shared multi-currency funding authority while preserving listing currency, Marketplace listing/order/receipt identity, canonical Inventory custody, listing-first serialization, original-evidence refunds, public-key privacy, and two-game isolation. Durable evidence is recorded in `multicurrency-marketplace-funding-implementation-handoff-v1.md`.

Next authorized checkpoint: `BUSINESS-V2-10A4C3` on a separate stacked draft branch from the clean C2 handoff. No merge or deployment is authorized.
"""
          for name in (
              "docs/roadmaps/business-v2-development-execution-plan-v1.md",
              "docs/roadmaps/business-v2-development-execution-log-v1.md",
          ):
              path = Path(name)
              text = path.read_text()
              if f"Exact implementation and verification source:** `{implementation}`" not in text:
                  path.write_text(text.rstrip() + completion + "\n")
          PY

          git diff --check
          test -f docs/roadmaps/multicurrency-marketplace-funding-implementation-handoff-v1.md
          grep -q "$IMPLEMENTATION_SHA" docs/roadmaps/multicurrency-marketplace-funding-implementation-handoff-v1.md

      - name: Commit clean documentation handoff
        id: docs
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/roadmaps/multicurrency-marketplace-funding-scope-v1.md \
            docs/roadmaps/multicurrency-marketplace-funding-implementation-handoff-v1.md \
            docs/roadmaps/business-v2-development-execution-plan-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md
          git commit -m "docs(c2): record exact Marketplace funding handoff"
          DOCS_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:${BRANCH}"
          echo "sha=${DOCS_SHA}" >> "$GITHUB_OUTPUT"

      - name: Update draft PR certification record
        shell: bash
        env:
          IMPLEMENTATION_SHA: ${{ steps.implementation.outputs.sha }}
          DOCS_SHA: ${{ steps.docs.outputs.sha }}
          LOCAL_RUN_ID: ${{ steps.local_certification.outputs.run_id }}
          PERMANENT_RUNS: ${{ steps.permanent.outputs.runs }}
        run: |
          set -euo pipefail
          cat > /tmp/c2-pr-body.md <<EOF
          ## Roadmap checkpoint

          \`BUSINESS-V2-10A4C2\` — Multi-Currency Marketplace Funding.

          ## Canonical status

          - **Status:** \`IMPLEMENTED_NOT_MERGED\`.
          - **Exact implementation and verification source:** \`${IMPLEMENTATION_SHA}\`.
          - **Clean documentation handoff:** \`${DOCS_SHA}\`.
          - Clean-tree local certification run: \`${LOCAL_RUN_ID}\`.
          - Base: \`feat/multicurrency-store-funding-v1\` / PR #674.
          - Controlling scope: \`docs/roadmaps/multicurrency-marketplace-funding-scope-v1.md\`.
          - Durable handoff: \`docs/roadmaps/multicurrency-marketplace-funding-implementation-handoff-v1.md\`.
          - PR authority: \`docs/operations/contracts/player-cross-cutting/pr-675.json\`.

          The documentation handoff does not replace \`${IMPLEMENTATION_SHA}\` as the tested implementation identity.

          ## Implemented result

          Marketplace listing currency remains authoritative. Buyers can fund one exact bill from one to three canonical Checking accounts; same-currency lines use rate 1 and foreign lines consume C0 retail checkout FX plus B1/B2 fixing, clearing, reserve, and liquidity authority. Funding, seller/fee/tax distribution, exact Inventory delivery, listing mutation, order evidence, and refunds are atomic and replay-safe. The legacy direct purchase route is retired. Browser payloads use public keys and cannot author trusted rates, balances, recipient identity, or monetary totals.

          ## Permanent exact-source workflows

          \`\`\`
          ${PERMANENT_RUNS}
          \`\`\`

          ## Safety and next item

          PR #675 remains draft, open, unmerged, and undeployed. No merge, deployment, scheduler, secret, staging/production SQL, or live-database mutation occurred.

          Next: \`BUSINESS-V2-10A4C3\` — Stock Market multi-currency funding — on a separate stacked draft branch from the clean C2 handoff.
          EOF
          sed -i 's/^          //' /tmp/c2-pr-body.md
          gh pr edit "$PR_NUMBER" --repo "$REPOSITORY" --body-file /tmp/c2-pr-body.md
