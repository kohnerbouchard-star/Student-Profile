name: Stock Market Runtime Scheduler

on:
  push:
    branches:
      - fix/stock-market-runtime-scheduler-v1
      - main
    paths:
      - "backend/supabase/functions/stock-market-orchestrator/**"
      - ".github/workflows/stock-market-runtime-scheduler.yml"
      - "scripts/stock-market-runtime-scheduler-contract.test.mjs"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-market-runtime-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  FUNCTION_SLUG: stock-market-orchestrator
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  staging-release:
    name: Deploy and verify staging scheduler
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/stock-market-runtime-scheduler-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
      - name: Verify scheduler contract
        run: node --test scripts/stock-market-runtime-scheduler-contract.test.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Enforce staging boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test "$STAGING_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
      - name: Deploy JWT-protected orchestrator to staging
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy "$FUNCTION_SLUG" \
            --workdir backend \
            --project-ref "$STAGING_PROJECT_REF"
      - name: Invoke staging orchestrator
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/stock-orchestrator.json"
          http_code="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            "https://${STAGING_PROJECT_REF}.supabase.co/functions/v1/${FUNCTION_SLUG}" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header 'content-type: application/json' \
            --data '{}')"
          test "$http_code" = "200"
          RESPONSE_PATH="$response" node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.env.RESPONSE_PATH, 'utf8'));
          if (body.ok !== true || Number(body.failed) !== 0) {
            throw new Error(`Staging stock orchestrator failed: ${JSON.stringify(body)}`);
          }
          if (Number(body.initializedGames) < 1) {
            throw new Error('Staging stock orchestrator found no initialized games.');
          }
          NODE

  production-release:
    name: Deploy and verify production scheduler
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
      - name: Verify exact current main and scheduler contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          node --test scripts/stock-market-runtime-scheduler-contract.test.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Enforce production boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test "$PRODUCTION_PROJECT_REF" != "$STAGING_PROJECT_REF"
      - name: Deploy JWT-protected orchestrator to production
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy "$FUNCTION_SLUG" \
            --workdir backend \
            --project-ref "$PRODUCTION_PROJECT_REF"
      - name: Invoke production orchestrator
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/stock-orchestrator.json"
          http_code="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            "https://${PRODUCTION_PROJECT_REF}.supabase.co/functions/v1/${FUNCTION_SLUG}" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header 'content-type: application/json' \
            --data '{}')"
          test "$http_code" = "200"
          RESPONSE_PATH="$response" node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.env.RESPONSE_PATH, 'utf8'));
          if (body.ok !== true || Number(body.failed) !== 0) {
            throw new Error(`Production stock orchestrator failed: ${JSON.stringify(body)}`);
          }
          NODE

  production-tick:
    name: Advance production stock runtime
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Invoke production orchestrator
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          response="$RUNNER_TEMP/stock-orchestrator.json"
          http_code="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            "https://${PRODUCTION_PROJECT_REF}.supabase.co/functions/v1/${FUNCTION_SLUG}" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header 'content-type: application/json' \
            --data '{}')"
          cat "$response"
          test "$http_code" = "200"
          RESPONSE_PATH="$response" node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.env.RESPONSE_PATH, 'utf8'));
          if (body.ok !== true || Number(body.failed) !== 0) {
            throw new Error(`Production stock runtime tick failed: ${JSON.stringify(body)}`);
          }
          NODE
