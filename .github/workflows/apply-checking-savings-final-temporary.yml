name: Apply Checking and Savings Final Patch Temporary

on:
  push:
    branches:
      - "fix/checking-savings-wallet-convergence-v1"
    paths:
      - ".github/account-migration/checking-savings-final.patch.gz.b64"

permissions:
  contents: write

concurrency:
  group: apply-checking-savings-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/checking-savings-wallet-convergence-v1
          fetch-depth: 0

      - name: Verify temporary-only commits and decode patch
        shell: bash
        run: |
          set -euo pipefail
          expected_base="297ac8cb7820521bf95989e3bd54e7a00816b861"
          git merge-base --is-ancestor "$expected_base" HEAD
          unexpected="$(git diff --name-only "$expected_base"..HEAD | grep -Ev '^(\.github/workflows/apply-checking-savings-final-temporary\.yml|\.github/account-migration/checking-savings-final\.patch\.gz\.b64)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected concurrent branch changes:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          base64 --decode .github/account-migration/checking-savings-final.patch.gz.b64 > /tmp/checking-savings-final.patch.gz
          echo "4bb13e9c22dca8ffa576fa5a6ad80d2aa40610c100ac41b2c7a8a671aeb53563  /tmp/checking-savings-final.patch.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/checking-savings-final.patch.gz > /tmp/checking-savings-final.patch
          echo "eedbe42629572ee051f773d18bc5c71b40ecfc1dba8c4fcdc6d2cc86aafc9f56  /tmp/checking-savings-final.patch" | sha256sum --check

      - name: Apply exact Checking and Savings change set
        run: |
          set -euo pipefail
          git apply --check --index --whitespace=error-all /tmp/checking-savings-final.patch
          git apply --index --whitespace=error-all /tmp/checking-savings-final.patch

      - name: Validate account, banking, and migration contracts
        run: |
          set -euo pipefail
          node --test \
            scripts/checking-savings-account-model-contract.test.mjs \
            scripts/player-local-currency-authority-contract.test.mjs \
            scripts/admin-economic-write-contract.test.mjs \
            scripts/player-cross-cutting-authority.test.mjs
          node --experimental-strip-types --test scripts/business-banking-economic-simulation.test.mjs
          node scripts/business-banking-runtime-contract.mjs
          node scripts/validate-supabase-migrations.mjs
          node player-terminal/tests/banking-read-model.mjs
          node player-terminal/tests/store-local-currency.mjs
          node player-terminal/tests/market-order-flow.mjs
          node player-terminal/tests/business-banking-surface.mjs
          node player-terminal/tests/contracts-flow.mjs
          node player-terminal/tests/contracts-public-list.mjs
          node player-terminal/tests/student-profile-adapter.mjs

      - name: Remove temporary transport and publish one atomic source commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/account-migration/checking-savings-final.patch.gz.b64 \
            .github/workflows/apply-checking-savings-final-temporary.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace legacy cash account with Checking"
          git push origin HEAD:fix/checking-savings-wallet-convergence-v1
