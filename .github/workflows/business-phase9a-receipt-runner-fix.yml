name: Business Phase 9A Receipt Runner Fix

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/business-phase9a-receipt-runner-fix.yml"

permissions:
  contents: write

concurrency:
  group: business-phase9a-receipt-runner-fix
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.event.pull_request.number == 664 &&
      github.event.pull_request.head.ref == 'feat/business-store-withdrawal-safety-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Phase 9A branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/business-store-withdrawal-safety-v2
          fetch-depth: 0

      - name: Correct deterministic match count
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/business-phase9a-receipt-integrity-repair.yml')
          text = path.read_text()
          old = '''              2,
              "recorded replay receipt",
'''
          new = '''              1,
              "recorded replay receipt",
'''
          if text.count(old) != 1:
              raise SystemExit('receipt runner match-count target is not unique')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit corrected runner and remove one-time fixer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "econovaria-automation"
          git config user.email "econovaria-automation@users.noreply.github.com"
          git rm .github/workflows/business-phase9a-receipt-runner-fix.yml
          git add .github/workflows/business-phase9a-receipt-integrity-repair.yml
          git commit -m "fix(ci): correct Phase 9A receipt repair match"
          git push origin HEAD:feat/business-store-withdrawal-safety-v2
