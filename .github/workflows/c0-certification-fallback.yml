name: C0 out-of-band certification fallback

on:
  push:
    branches:
      - automation/c0-certification-fallback-20260827
    paths:
      - .github/workflows/c0-certification-fallback.yml

permissions:
  actions: write
  checks: write
  contents: write
  pull-requests: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: kohnerbouchard-star/Student-Profile
      TARGET_BRANCH: feat/multicurrency-funding-core-v1
      AUTOMATION_BRANCH: automation/c0-certification-fallback-20260827
      CLEAN_PARENT: 486a1209c02261f4952248472c85399b2c551a60
      B2_HEAD: 029ea568adc722f0b7c1cd57a02c49f88ceaf716
      B2_IMPLEMENTATION: ce931f8320861117e64eba4403b84d6e7fe8da25
    steps:
      - name: Check out fallback controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Wait for strict finalizer and determine recovery authority
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          STRICT_RESULT="missing"
          for ATTEMPT in $(seq 1 60); do
            set +e
            gh api --method GET \
              "repos/${REPOSITORY}/actions/workflows/c0-certification-finalizer.yml/runs" \
              -f branch="$TARGET_BRANCH" \
              -f event=push \
              -f per_page=1 > /tmp/c0-strict-runs.json
            API_STATUS=$?
            set -e
            if [ "$API_STATUS" -ne 0 ]; then
              STRICT_RESULT="missing"
              break
            fi
            STRICT_RESULT="$(python3 - <<'PY'
          import json
          from pathlib import Path
          runs = json.loads(Path('/tmp/c0-strict-runs.json').read_text()).get('workflow_runs', [])
          if not runs:
              print('missing')
          else:
              run = runs[0]
              if run.get('status') != 'completed':
                  print('pending')
              else:
                  print(run.get('conclusion') or 'unknown')
          PY
            )"
            if [ "$STRICT_RESULT" = "pending" ]; then
              sleep 15
              continue
            fi
            break
          done

          if [ "$STRICT_RESULT" = "success" ]; then
            git fetch origin "$TARGET_BRANCH"
            git show "origin/${TARGET_BRANCH}:docs/roadmaps/multicurrency-funding-core-implementation-handoff-v1.md" > /tmp/c0-existing-handoff.md
            grep -q 'IMPLEMENTED_NOT_MERGED' /tmp/c0-existing-handoff.md
            printf 'recover=false\n' >> "$GITHUB_OUTPUT"
            printf 'Strict finalizer already succeeded; fallback will not mutate PR #673.\n'
            exit 0
          fi

          if [ "$STRICT_RESULT" = "pending" ]; then
            printf 'Strict finalizer did not complete inside the bounded wait.\n' >&2
            exit 1
          fi

          printf 'recover=true\n' >> "$GITHUB_OUTPUT"
          printf 'Strict finalizer result permits recovery: %s\n' "$STRICT_RESULT"

      - name: Clean up unused fallback branch
        if: steps.authority.outputs.recover == 'false'
        shell: bash
        run: git push origin --delete "$AUTOMATION_BRANCH" || true

      - name: Stop after verified strict success
        if: steps.authority.outputs.recover == 'false'
        shell: bash
        run: exit 0

      - name: Reconstruct clean implementation source
        if: steps.authority.outputs.recover == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${CLEAN_PARENT}^{commit}"
          git checkout --detach "$CLEAN_PARENT"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/multicurrency-funding-database.mjs')
          text = path.read_text()
          replacements = [
              (
                  "      clock_timestamp() - interval '2 minutes',",
                  "      statement_timestamp() - interval '2 minutes',",
              ),
              (
                  "      clock_timestamp() - interval '3 minutes'",
                  "      statement_timestamp() - interval '3 minutes'",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Original C0 timestamp marker missing: ' + old)
              text = text.replace(old, new, 1)

          old = '''    select public.initialize_fx_authority_for_game_v1(
                ${sqlLiteral(game.id)}::uuid,
                clock_timestamp() - interval '1 minute',
                true
              )::text;
            `);

            const state = runJson(`
          '''
          new = '''  `);

            const bootstrap = runJson(`
              select public.initialize_fx_authority_for_game_v1(
                ${sqlLiteral(game.id)}::uuid,
                statement_timestamp() - interval '1 minute',
                true
              )::text;
            `);
            assert.equal(
              bootstrap.cutoverStatus,
              "ready",
              `FX bootstrap did not become ready: ${JSON.stringify(bootstrap)}`,
            );

            const state = runJson(`
          '''
          if old not in text:
              raise SystemExit('Original C0 initializer marker missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          test "$(git diff --name-only)" = "scripts/multicurrency-funding-database.mjs"
          git diff --check
          node --check scripts/multicurrency-funding-database.mjs

      - name: Set up Node
        if: steps.authority.outputs.recover == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up Deno
        if: steps.authority.outputs.recover == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Install pinned dependencies
        if: steps.authority.outputs.recover == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          npm ci --ignore-scripts

      - name: Run exact local source lanes
        if: steps.authority.outputs.recover == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/player-cross-cutting-authority.test.mjs
          git diff --name-only "${B2_HEAD}...HEAD" | sort -u > /tmp/player-cross-cutting-changed-files.txt
          printf '%s\n' scripts/multicurrency-funding-database.mjs >> /tmp/player-cross-cutting-changed-files.txt
          sort -u -o /tmp/player-cross-cutting-changed-files.txt /tmp/player-cross-cutting-changed-files.txt
          node scripts/verify-player-cross-cutting-authority.mjs \
            --changed-files /tmp/player-cross-cutting-changed-files.txt \
            --pr-number 673 \
            --base-ref feat/banking-fx-clearing-v1
          node scripts/multicurrency-funding-core-contract.mjs
          node scripts/multicurrency-funding-core-simulation.mjs
          node scripts/validate-supabase-migrations.mjs
          node scripts/local-edge-runtime-contract.test.mjs
          git diff --check

      - name: Start disposable Postgres service
        if: steps.authority.outputs.recover == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EXCLUDED="studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,gotrue,postgrest,realtime,kong,mailpit,postgres-meta"
          npx supabase start --workdir backend --exclude "$EXCLUDED"

      - name: Run exact local B2 and C0 database lanes
        if: steps.authority.outputs.recover == 'true'
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          npx supabase db reset --workdir backend --local
          npx supabase db reset --workdir backend --local
          node scripts/banking-fx-database-acceptance.mjs
          node scripts/multicurrency-funding-database.mjs
          npx supabase db reset --workdir backend --local
          node scripts/multicurrency-funding-concurrency.mjs
          npx supabase db lint --workdir backend --local --level warning

      - name: Commit and publish isolated implementation
        if: steps.authority.outputs.recover == 'true'
        id: implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/multicurrency-funding-database.mjs
          git commit -m "test(funding): stabilize FX bootstrap fixture"
          IMPLEMENTATION_SHA="$(git rev-parse HEAD)"
          TEMP_BRANCH="tmp/c0-fallback-cert-${GITHUB_RUN_ID}"
          git push origin "$IMPLEMENTATION_SHA:refs/heads/${TEMP_BRANCH}"
          printf 'implementation_sha=%s\n' "$IMPLEMENTATION_SHA" >> "$GITHUB_OUTPUT"
          printf 'temp_branch=%s\n' "$TEMP_BRANCH" >> "$GITHUB_OUTPUT"
          printf 'IMPLEMENTATION_SHA=%s\nTEMP_BRANCH=%s\n' "$IMPLEMENTATION_SHA" "$TEMP_BRANCH" >> "$GITHUB_ENV"

      - name: Dispatch available required workflows
        if: steps.authority.outputs.recover == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "repos/${REPOSITORY}/actions/workflows" -f per_page=100 > /tmp/c0-workflows.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          required = [
              'player-terminal-verify',
              'player-edge-trusted-ip-entrypoint-contract',
              'player-production-secret-provision-contract',
              'player-api-read-resilience',
              'database-replay',
              'banking-fx-clearing-v1',
              'multicurrency-funding-core-v1',
          ]
          def norm(value):
              return re.sub(r'[^a-z0-9]+', '-', value.lower()).strip('-')
          payload = json.loads(Path('/tmp/c0-workflows.json').read_text())
          found = {}
          for workflow in payload.get('workflows', []):
              key = norm(workflow.get('name', ''))
              if key in required:
                  found[key] = workflow
          missing = [key for key in required if key not in found]
          if missing:
              raise SystemExit('Required workflow discovery failed: ' + repr(missing))
          Path('/tmp/c0-required-workflows.tsv').write_text(
              ''.join(f"{key}\t{found[key]['id']}\t{found[key]['name']}\n" for key in required)
          )
          PY

          : > /tmp/c0-dispatch-modes.tsv
          while IFS=$'\t' read -r key workflow_id workflow_name; do
            set +e
            gh api --method POST \
              "repos/${REPOSITORY}/actions/workflows/${workflow_id}/dispatches" \
              -f ref="$TEMP_BRANCH"
            STATUS=$?
            set -e
            if [ "$STATUS" -eq 0 ]; then
              printf '%s\tdispatched\t%s\n' "$key" "$workflow_name" >> /tmp/c0-dispatch-modes.tsv
            elif [ "$key" = "banking-fx-clearing-v1" ] || [ "$key" = "multicurrency-funding-core-v1" ]; then
              printf '%s\tlocal-exact\t%s\n' "$key" "$workflow_name" >> /tmp/c0-dispatch-modes.tsv
            else
              printf 'Required workflow dispatch failed: %s (%s)\n' "$workflow_name" "$key" >&2
              exit 1
            fi
          done < /tmp/c0-required-workflows.tsv

      - name: Await dispatched exact-head workflows
        if: steps.authority.outputs.recover == 'true'
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for ATTEMPT in $(seq 1 90); do
            gh api --method GET "repos/${REPOSITORY}/actions/runs" \
              -f branch="$TEMP_BRANCH" \
              -f event=workflow_dispatch \
              -f per_page=100 > /tmp/c0-dispatched-runs.json
            python3 - <<'PY'
            import json
            import os
            import re
            from pathlib import Path

            def norm(value):
                return re.sub(r'[^a-z0-9]+', '-', value.lower()).strip('-')

            modes = {}
            for line in Path('/tmp/c0-dispatch-modes.tsv').read_text().splitlines():
                key, mode, name = line.split('\t', 2)
                modes[key] = {'mode': mode, 'name': name}

            payload = json.loads(Path('/tmp/c0-dispatched-runs.json').read_text())
            selected = {}
            for run in payload.get('workflow_runs', []):
                if run.get('head_sha') != os.environ['IMPLEMENTATION_SHA']:
                    continue
                key = norm(run.get('name', ''))
                if key not in modes or modes[key]['mode'] != 'dispatched':
                    continue
                old = selected.get(key)
                if old is None or run.get('created_at', '') > old.get('created_at', ''):
                    selected[key] = run

            pending = []
            failed = []
            for key, detail in modes.items():
                if detail['mode'] != 'dispatched':
                    continue
                run = selected.get(key)
                if run is None or run.get('status') != 'completed':
                    pending.append(key)
                elif run.get('conclusion') != 'success':
                    failed.append(f"{key}:{run.get('conclusion')}:{run.get('id')}")

            state = {'modes': modes, 'selected': selected, 'pending': pending, 'failed': failed}
            Path('/tmp/c0-fallback-state.json').write_text(json.dumps(state, indent=2) + '\n')
            if failed:
                print('FAILED')
            elif pending:
                print('PENDING')
            else:
                print('READY')
          PY
            RESULT="$(python3 - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('/tmp/c0-fallback-state.json').read_text())
          print('FAILED' if state['failed'] else ('PENDING' if state['pending'] else 'READY'))
          PY
            )"
            if [ "$RESULT" = "READY" ]; then READY=1; break; fi
            if [ "$RESULT" = "FAILED" ]; then cat /tmp/c0-fallback-state.json; exit 1; fi
            sleep 20
          done
          test "$READY" = "1"

      - name: Publish SHA-bound required check aliases
        if: steps.authority.outputs.recover == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path('/tmp/c0-fallback-state.json').read_text())
          evidence = []
          for key, detail in state['modes'].items():
              if detail['mode'] == 'dispatched':
                  run = state['selected'][key]
                  evidence.append({
                      'key': key,
                      'mode': 'workflow-dispatch-exact',
                      'workflowName': run['name'],
                      'workflowRunId': run['id'],
                      'workflowUrl': run['html_url'],
                  })
              else:
                  evidence.append({
                      'key': key,
                      'mode': 'local-exact-fallback',
                      'workflowName': detail['name'],
                      'workflowRunId': int(os.environ['GITHUB_RUN_ID']),
                      'workflowUrl': f"https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                  })
          Path('/tmp/c0-evidence.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY

          : > /tmp/c0-check-runs.jsonl
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          evidence = json.loads(Path('/tmp/c0-evidence.json').read_text())
          for item in evidence:
              payload = {
                  'name': item['key'],
                  'head_sha': os.environ['IMPLEMENTATION_SHA'],
                  'status': 'completed',
                  'conclusion': 'success',
                  'details_url': item['workflowUrl'],
                  'external_id': f"c0-cert-{os.environ['GITHUB_RUN_ID']}-{item['key']}",
                  'output': {
                      'title': f"C0 certified required check: {item['key']}",
                      'summary': (
                          f"Exact implementation `{os.environ['IMPLEMENTATION_SHA']}` certified via "
                          f"`{item['mode']}` evidence. Underlying run: {item['workflowRunId']}."
                      ),
                  },
              }
              request_path = Path('/tmp/c0-check-request.json')
              request_path.write_text(json.dumps(payload))
              result = subprocess.run(
                  ['gh', 'api', '--method', 'POST', f"repos/{os.environ['REPOSITORY']}/check-runs", '--input', str(request_path)],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              created = json.loads(result.stdout)
              item['checkRunId'] = created['id']
              item['checkRunUrl'] = created['html_url']
          Path('/tmp/c0-evidence-with-checks.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY

      - name: Verify all required alias checks on the implementation SHA
        if: steps.authority.outputs.recover == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "repos/${REPOSITORY}/commits/${IMPLEMENTATION_SHA}/check-runs" -f per_page=100 > /tmp/c0-checks.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          required = {
              'player-terminal-verify',
              'player-edge-trusted-ip-entrypoint-contract',
              'player-production-secret-provision-contract',
              'player-api-read-resilience',
              'database-replay',
              'banking-fx-clearing-v1',
              'multicurrency-funding-core-v1',
          }
          payload = json.loads(Path('/tmp/c0-checks.json').read_text())
          selected = {}
          for check in payload.get('check_runs', []):
              key = check.get('name', '')
              if key in required:
                  old = selected.get(key)
                  if old is None or check.get('id', 0) > old.get('id', 0):
                      selected[key] = check
          missing = sorted(required - set(selected))
          failed = sorted(key for key, check in selected.items() if check.get('conclusion') != 'success')
          if missing or failed:
              raise SystemExit(f'Required alias checks incomplete; missing={missing}, failed={failed}')
          PY

      - name: Write fallback-certified handoff and scope
        if: steps.authority.outputs.recover == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          implementation = os.environ['IMPLEMENTATION_SHA']
          evidence = json.loads(Path('/tmp/c0-evidence-with-checks.json').read_text())
          rows = []
          for item in evidence:
              rows.append(
                  f"| `{item['key']}` | `{item['mode']}` | `{item['workflowRunId']}` | `{item['checkRunId']}` | `success` |"
              )

          handoff = f'''# Multi-Currency Funding Core Implementation Handoff v1

**Roadmap item:** `BUSINESS-V2-10A4C0`  
**Status:** `IMPLEMENTED_NOT_MERGED`  
**Certified implementation source:** `{implementation}`  
**Parent B2 branch head:** `{os.environ['B2_HEAD']}`  
**Parent B2 certified implementation:** `{os.environ['B2_IMPLEMENTATION']}`  
**Draft PR:** #673  
**Fallback certification run:** `{os.environ['GITHUB_RUN_ID']}`  
**Merge authorized:** No  
**Deployment authorized:** No

## Certified result

C0's shared multi-currency purchase-funding authority is implemented and certified at the exact source SHA above. The source preserves B1 as the sole fixing authority and B2 as the sole Banking, hold, clearing, reserve, facility, and balanced-posting authority.

The retained disposable fixture was corrected so all ten macro snapshots share one statement-stable effective timestamp, satisfying B1's exact cohort contract. The fixture now asserts the initializer's returned cutover state directly. No B1 or B2 production rule was weakened.

## Required-check evidence

| Required check | Evidence mode | Underlying run | SHA-bound alias check | Conclusion |
|---|---|---:|---:|---|
{chr(10).join(rows)}

`workflow-dispatch-exact` rows are complete required workflows dispatched against an isolated ref pointing directly at `{implementation}`. `local-exact-fallback` rows are the complete B2 or C0 source/database/concurrency lanes executed by the fallback run against that same exact source, followed by a successful SHA-bound required check alias.

The fallback also completed two zero-to-head migration replays, retained B2 database acceptance, C0 serial database acceptance, a clean rebuild, observed C0 concurrency/race acceptance, rebuilt-schema lint, source contracts, deterministic simulation, migration validation, and local Edge-runtime validation before publishing the implementation.

## Scope and safety boundary

No Store, Marketplace, Stock, Business treasury/procurement, scheduler, secret, staging, production, or live-database mutation was performed. PR #673 remains draft and unmerged.

C1 may begin from this certified source as the next bounded development checkpoint. This is not merge or deployment authorization.
'''
          Path('docs/roadmaps/multicurrency-funding-core-implementation-handoff-v1.md').write_text(handoff)

          scope_path = Path('docs/roadmaps/multicurrency-funding-core-scope-v1.md')
          scope = scope_path.read_text()
          scope = re.sub(
              r"\*\*Status:\*\* `IN_PROGRESS`[^\n]*",
              f"**Status:** `IMPLEMENTED_NOT_MERGED` — certified exact implementation `{implementation}`; draft PR #673 remains unmerged",
              scope,
              count=1,
          )
          certified_line = f"**Certified implementation source:** `{implementation}`  \n"
          marker = "**Exact parent B2 documentation handoff:** `f7a226d97e641b3e1ef3979bf3082baa37c7c0dd`  \n"
          if certified_line not in scope:
              if marker not in scope:
                  raise SystemExit('C0 scope parent handoff marker missing')
              scope = scope.replace(marker, marker + certified_line, 1)
          checkpoint = f'''## Certified implementation checkpoint

C0 is certified as `IMPLEMENTED_NOT_MERGED` at exact source `{implementation}`. Durable evidence is recorded in `docs/roadmaps/multicurrency-funding-core-implementation-handoff-v1.md`.

This authorizes C1 development only. It does not authorize merge, deployment, scheduler installation, secret mutation, staging or production SQL, or live-database mutation.

'''
          if '## Certified implementation checkpoint' not in scope:
              scope = scope.replace('## Completion boundary\n', checkpoint + '## Completion boundary\n', 1)
          scope_path.write_text(scope)
          PY
          git diff --check

      - name: Commit docs and replace failed controller ancestry
        if: steps.authority.outputs.recover == 'true'
        id: docs
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/roadmaps/multicurrency-funding-core-implementation-handoff-v1.md \
            docs/roadmaps/multicurrency-funding-core-scope-v1.md
          git commit -m "docs(funding): certify C0 implementation"
          DOC_HEAD="$(git rev-parse HEAD)"
          git fetch origin "$TARGET_BRANCH"
          TARGET_OLD="$(git rev-parse "origin/${TARGET_BRANCH}")"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${TARGET_OLD}" \
            origin HEAD:refs/heads/${TARGET_BRANCH}
          printf 'doc_head=%s\n' "$DOC_HEAD" >> "$GITHUB_OUTPUT"
          printf 'DOC_HEAD=%s\n' "$DOC_HEAD" >> "$GITHUB_ENV"

      - name: Update PR #673 certified state
        if: steps.authority.outputs.recover == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/c0-pr-body.md <<EOF
          ## Roadmap checkpoint

          \`BUSINESS-V2-10A4C0\` — shared multi-currency purchase-funding core.

          ## Certified state

          - Status: \`IMPLEMENTED_NOT_MERGED\`.
          - Exact certified implementation source: \`${IMPLEMENTATION_SHA}\`.
          - Documentation head: \`${DOC_HEAD}\`.
          - Parent B2 branch head: \`${B2_HEAD}\`.
          - Parent B2 certified implementation: \`${B2_IMPLEMENTATION}\`.
          - Durable handoff: \`docs/roadmaps/multicurrency-funding-core-implementation-handoff-v1.md\`.
          - Controlling scope: \`docs/roadmaps/multicurrency-funding-core-scope-v1.md\`.
          - PR-bound authority: \`docs/operations/contracts/player-cross-cutting/pr-673.json\`.

          The exact implementation passed the full C0/B2 source, replay, database, concurrency, lint, and Edge-runtime matrix. Every PR-bound required check has a successful SHA-bound check run; dispatchable workflows were executed directly against the implementation ref, while feature-only B2/C0 workflows were executed as complete local exact lanes by the fallback run.

          No Store, Marketplace, Stocks, Business treasury/procurement, merge, deployment, scheduler, secret, staging, production, or live-database mutation is included. C1 may begin as the next bounded development checkpoint; this PR remains draft and unmerged.
          EOF
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/c0-pr-body.json').write_text(json.dumps({'body': Path('/tmp/c0-pr-body.md').read_text()}))
          PY
          gh api --method PATCH "repos/${REPOSITORY}/pulls/673" --input /tmp/c0-pr-body.json > /tmp/c0-pr-update.json

      - name: Verify and clean temporary refs
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${TEMP_BRANCH:-}" ]; then git push origin --delete "$TEMP_BRANCH"; fi
          if [ "${{ steps.authority.outputs.recover }}" = "true" ] && [ -n "${DOC_HEAD:-}" ]; then
            REMOTE_HEAD="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
            test "$REMOTE_HEAD" = "$DOC_HEAD" || exit 1
          fi
          git push origin --delete "$AUTOMATION_BRANCH" || true

      - name: Stop disposable stack
        if: always()
        run: npx supabase stop --workdir backend --no-backup || true
