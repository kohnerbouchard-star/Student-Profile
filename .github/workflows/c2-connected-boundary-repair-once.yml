name: C2 connected boundary repair once

on:
  push:
    branches:
      - feat/multicurrency-marketplace-funding-v1
    paths:
      - .github/workflows/c2-connected-boundary-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out C2 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/multicurrency-marketplace-funding-v1
          fetch-depth: 0

      - name: Repair connected browser boundary and structural contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}: {old!r}")
              target.write_text(source.replace(old, new, 1))

          runner = "player-terminal/tools/connected-marketplace-mutation-runner.mjs"
          replace_once(
              runner,
              'response.url().includes("/functions/v1/classroom-api/players/login") &&',
              'response.url().includes("/functions/v1/player-web-session-api/login") &&',
          )
          replace_once(
              runner,
              'if (!url.includes("/functions/v1/classroom-api/") && !url.includes("/functions/v1/player-web-session-api/proxy/")) return;',
              'if (!url.includes("/functions/v1/classroom-api/") && !url.includes("/functions/v1/player-web-session-api/")) return;',
          )
          replace_once(
              runner,
              'const allowed = new Set(["accept", "apikey", "authorization", "content-type", "idempotency-key", "x-idempotency-key", "x-econovaria-csrf-token", "x-request-id"]);',
              'const allowed = new Set(["accept", "apikey", "content-type", "idempotency-key", "x-idempotency-key", "x-econovaria-csrf-token", "x-request-id"]);',
          )
          old_instrument = 'function instrument(page, label) {\n  page.on("console", (message) => {'
          new_instrument = 'function instrument(page, label) {\n  page.on("request", (request) => {\n    const url = request.url();\n    if (!url.includes("/functions/v1/player-web-session-api/")) return;\n    const headers = request.headers();\n    if (\n      headers.authorization !== undefined ||\n      headers["x-player-session-token"] !== undefined ||\n      headers["x-econovaria-player-session-token"] !== undefined\n    ) {\n      evidence.pageErrors.push(\n        `${label}: browser exposed a Player credential on ${redact(url)}`,\n      );\n    }\n  });\n  page.on("console", (message) => {'
          replace_once(runner, old_instrument, new_instrument)

          contract = "scripts/multicurrency-marketplace-funding-contract.mjs"
          old_paths = '  scope: "docs/roadmaps/multicurrency-marketplace-funding-scope-v1.md",\n  authority: "docs/operations/contracts/player-cross-cutting/pr-675.json",\n});'
          new_paths = '  scope: "docs/roadmaps/multicurrency-marketplace-funding-scope-v1.md",\n  authority: "docs/operations/contracts/player-cross-cutting/pr-675.json",\n  workflow: ".github/workflows/multicurrency-marketplace-funding-v1.yml",\n  connectedRunner: "player-terminal/tools/connected-marketplace-mutation-runner.mjs",\n});'
          replace_once(contract, old_paths, new_paths)
          contract_insert = "\n".join([
              'includesAll("connected browser workflow", source.workflow, [',
              '  "connected-browser:",',
              '  "Verify connected multi-currency Marketplace funding browser journey",',
              '  "node scripts/player-multiplayer-browser-acceptance.mjs",',
              '  "node player-terminal/tools/connected-marketplace-mutation-runner.mjs",',
              '  "player-marketplace-mutation-browser-acceptance.json",',
              '  "Enforce connected Marketplace evidence",',
              ']);',
              'includesAll("connected Marketplace runner", source.connectedRunner, [',
              '  "/functions/v1/player-web-session-api/login",',
              "  'credentials: \"include\"',",
              '  "quoteReplaySafe",',
              '  "replaySafe",',
              '  "unauthenticatedRejected",',
              ']);',
              'assert.ok(',
              '  !source.connectedRunner.includes("/functions/v1/classroom-api/players/login"),',
              '  "Connected Marketplace browser journey retained the direct legacy Player login path.",',
              ');',
              'assert.ok(',
              "  !source.connectedRunner.includes('\"authorization\", \"content-type\"'),",
              '  "Connected Marketplace replay retained browser Authorization forwarding.",',
              ');',
              '',
              'const authority = JSON.parse(source.authority);',
          ])
          replace_once(
              contract,
              'const authority = JSON.parse(source.authority);',
              contract_insert,
          )
          PY

          node --check player-terminal/tools/connected-marketplace-mutation-runner.mjs
          node --check scripts/multicurrency-marketplace-funding-contract.mjs
          git diff --check

      - name: Commit repaired connected boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            player-terminal/tools/connected-marketplace-mutation-runner.mjs \
            scripts/multicurrency-marketplace-funding-contract.mjs
          git commit -m "test(marketplace-funding): enforce connected BFF boundary"
          git push origin HEAD:feat/multicurrency-marketplace-funding-v1
