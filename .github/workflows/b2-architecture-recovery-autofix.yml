name: B2 Architecture Recovery Autofix

on:
  push:
    branches:
      - feat/banking-fx-clearing-v1
    paths:
      - .github/workflows/b2-architecture-recovery-autofix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b2-architecture-recovery-autofix
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out B2 branch
        uses: actions/checkout@v7
        with:
          ref: feat/banking-fx-clearing-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Apply deterministic architecture and replay repair
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');

          const root = process.cwd();
          const read = (file) => fs.readFileSync(path.join(root, file), 'utf8');
          const write = (file, content) => {
            const target = path.join(root, file);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.writeFileSync(target, content.endsWith('\n') ? content : `${content}\n`);
          };
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          const replaceOnce = (source, before, after, label) => {
            const first = source.indexOf(before);
            assert(first >= 0, `${label}: source marker missing`);
            assert(source.indexOf(before, first + before.length) < 0, `${label}: source marker is ambiguous`);
            return source.slice(0, first) + after + source.slice(first + before.length);
          };
          const section = (source, startMarker, endMarker, label) => {
            const start = source.indexOf(startMarker);
            assert(start >= 0, `${label}: start marker missing`);
            const end = source.indexOf(endMarker, start + startMarker.length);
            assert(end > start, `${label}: end marker missing`);
            return source.slice(start, end).trimEnd();
          };
          const exportFunctions = (source, names, label) => {
            let output = source;
            for (const name of names) {
              output = replaceOnce(output, `function ${name}(`, `export function ${name}(`, `${label}:${name}`);
            }
            return output;
          };
          const ensureBelow = (file, maximum = 499) => {
            const count = read(file).split(/\r?\n/u).length;
            assert(count <= maximum, `${file} remains oversized at ${count} lines`);
          };

          // Close the final deep-import and marker-only ratchet deltas.
          {
            const file = 'backend/src/domains/banking-fx/api/playerBankingFxHttpHandler.test.ts';
            let source = read(file);
            source = replaceOnce(
              source,
              'import type { PlayerRequestApplicationContext } from "../../players/api/playerRequestScope.ts";',
              'import type { PlayerRequestApplicationContext } from "../../players/index.ts";',
              'Player Banking FX test public boundary',
            );
            write(file, source);
          }
          {
            const file = 'backend/src/domains/banking-fx/infrastructure/supabaseStandardFxOrderSettlementRepository.ts';
            let source = read(file);
            source = replaceOnce(source, '  fallback: string,', '  defaultCode: string,', 'standard FX default code parameter');
            source = replaceOnce(source, 'domainCode ?? fallback,', 'domainCode ?? defaultCode,', 'standard FX default code use');
            write(file, source);
          }
          {
            const file = 'player-terminal/src/api/banking-fx-backend-routes.js';
            let source = read(file);
            source = replaceOnce(
              source,
              'function boundedLimit(value, fallback, endpointKey) {',
              'function boundedLimit(value, defaultLimit, endpointKey) {',
              'Banking FX bounded limit parameter',
            );
            source = replaceOnce(
              source,
              'return fallback;',
              'return defaultLimit;',
              'Banking FX bounded limit default',
            );
            write(file, source);
          }

          // Split Player Banking helpers from the runtime installer.
          {
            const file = 'player-terminal/src/features/banking/banking-read-flow.js';
            let source = read(file);
            source = replaceOnce(
              source,
              'import { playerSafeErrorMessage } from "../../api/errors.js";\n',
              '',
              'Banking helper error import removal',
            );
            const helperStart = source.indexOf('function list(value) {');
            const helperEnd = source.indexOf('function dispatchInvalidSession', helperStart);
            assert(helperStart >= 0 && helperEnd > helperStart, 'Banking base helper block missing');
            let helperBlock = source.slice(helperStart, helperEnd).trimEnd();
            source = source.slice(0, helperStart) + source.slice(helperEnd);

            const formStart = source.indexOf('const DECIMAL_AMOUNT =');
            const formEnd = source.indexOf('function invalidateDisplayedQuote', formStart);
            assert(formStart >= 0 && formEnd > formStart, 'Banking form helper block missing');
            let formBlock = source.slice(formStart, formEnd).trimEnd();
            source = source.slice(0, formStart) + source.slice(formEnd);

            helperBlock = replaceOnce(helperBlock, 'function list(value) {', 'export function list(value) {', 'Banking list export');
            helperBlock = replaceOnce(helperBlock, 'function object(value) {', 'export function object(value) {', 'Banking object export');
            formBlock = replaceOnce(formBlock, 'function quoteFormIntent(form, state) {', 'export function quoteFormIntent(form, state) {', 'Banking quote intent export');
            formBlock = replaceOnce(formBlock, 'function syncFxSourceControls(sourceSelect) {', 'export function syncFxSourceControls(sourceSelect) {', 'Banking source-control export');

            write(
              'player-terminal/src/features/banking/banking-read-helpers.js',
              `import { playerSafeErrorMessage } from "../../api/errors.js";\n\n${helperBlock}\n\n${formBlock}\n`,
            );

            const anchor = '} from "./banking-fx-read-model.js";';
            const helperImport = `\nimport {\n  list,\n  mergeBankingFxOrderPage,\n  mergeBankingPages,\n  object,\n  quoteFormIntent,\n  resolveBankingFxFailure,\n  resolveBankingReadFailure,\n  syncFxSourceControls,\n} from "./banking-read-helpers.js";\nexport {\n  mergeBankingFxOrderPage,\n  mergeBankingPages,\n  resolveBankingFxFailure,\n  resolveBankingReadFailure,\n};`;
            source = replaceOnce(source, anchor, `${anchor}${helperImport}`, 'Banking helper import');
            write(file, source);
            ensureBelow(file);
            ensureBelow('player-terminal/src/features/banking/banking-read-helpers.js');
          }

          // Split the canonical FX calculation engine into model, math, policy,
          // normalization, and a thin public orchestrator without changing logic.
          {
            const file = 'backend/src/domains/fx/calculations/fxFixingEngine.ts';
            const source = read(file);
            const calculateBlock = section(
              source,
              'export function calculateFxFixing',
              '/**\n * Returns the stable, validated input representation',
              'FX calculate block',
            );
            const canonicalizeBlock = section(
              source,
              'export function canonicalizeFxFixingInput',
              'function normalizeInput',
              'FX canonicalize block',
            );
            let normalizeInputBlock = section(source, 'function normalizeInput', 'function normalizePolicy', 'FX input normalization');
            let policyBlock = section(source, 'function normalizePolicy', 'function canonicalCurrency', 'FX policy block');
            const canonicalStoryBlock = section(source, 'function canonicalCurrency', 'function calculateMedians', 'FX canonical/story block');
            let mathBlock = section(source, 'function calculateMedians', 'function validateCurrencyRanges', 'FX math block');
            const currencyValidationBlock = section(source, 'function validateCurrencyRanges', 'function componentCap', 'FX currency validation');
            const policyHelperBlock = section(source, 'function componentCap', 'function requireRange', 'FX policy helpers');
            const normalizationHelperBlock = section(source, 'function requireRange', 'function clampBigInt', 'FX normalization helpers');
            let mathTail = section(source, 'function clampBigInt', 'export const FX_FIXING_ZERO_DECIMAL', 'FX math tail');

            normalizeInputBlock = replaceOnce(normalizeInputBlock, 'function normalizeInput(', 'export function normalizeInput(', 'FX normalizeInput export');
            policyBlock = exportFunctions(policyBlock, ['normalizePolicy', 'canonicalPolicy'], 'FX policy exports');
            mathBlock = exportFunctions(
              mathBlock,
              [
                'calculateMedians',
                'calculateComponents',
                'groupStoryShocks',
                'numeraireValue',
                'applyBasisPointMovement',
                'parseDecimal',
                'formatDecimal',
                'decimalConstant',
                'roundDivideHalfAwayFromZero',
              ],
              'FX math exports',
            );
            mathTail = exportFunctions(mathTail, ['clampBigInt', 'clampNumber', 'compareCodeUnits'], 'FX math tail exports');

            write(
              'backend/src/domains/fx/calculations/fxFixingModel.ts',
              `import {\n  FX_NATIONAL_CURRENCY_DEFINITIONS,\n  type FxCountryCode,\n  type FxFixingCurrencyInput,\n  type FxFixingStoryShockInput,\n  type FxNationalCurrencyCode,\n} from "../contracts/fxFixingContracts.ts";\n\nexport const DECIMAL_PLACES = 18;\nexport const SCALE = 10n ** BigInt(DECIMAL_PLACES);\nexport const MAX_NUMERIC_MAGNITUDE = 10n ** 38n - 1n;\n\nexport const FX_V1_STORAGE_ENVELOPE = Object.freeze({\n  normal: 200,\n  crisis: 1_500,\n  gdp: 50,\n  inflation: 45,\n  realInterest: 30,\n  trade: 40,\n  confidenceStability: 35,\n});\n\nexport const EXPECTED_COUNTRY_BY_CURRENCY = new Map<\n  FxNationalCurrencyCode,\n  FxCountryCode\n>(\n  FX_NATIONAL_CURRENCY_DEFINITIONS.map((definition) => [\n    definition.currencyCode,\n    definition.countryCode,\n  ]),\n);\n\nexport interface NormalizedCurrencyInput {\n  readonly source: FxFixingCurrencyInput;\n  readonly previousUnitsPerEco: bigint;\n  readonly realGdpIndex: bigint;\n  readonly gdpGrowthRate: bigint;\n  readonly inflationRate: bigint;\n  readonly interestRate: bigint;\n  readonly consumerConfidenceIndex: bigint;\n  readonly businessConfidenceIndex: bigint;\n  readonly importDependencyIndex: bigint;\n  readonly currencyStabilityIndex: bigint;\n  readonly tradeBalanceIndex: bigint;\n  readonly exportStrengthIndex: bigint;\n  readonly marketRiskIndex: bigint;\n  readonly politicalStabilityIndex: bigint;\n}\n\nexport interface NormalizedInput {\n  readonly gameSessionId: string;\n  readonly fixingLocalDate: string;\n  readonly policyVersion: string;\n  readonly policy: NormalizedPolicy;\n  readonly currencies: readonly NormalizedCurrencyInput[];\n  readonly storyShocks: readonly FxFixingStoryShockInput[];\n  readonly canonicalInputJson: string;\n}\n\nexport interface NormalizedPolicy {\n  readonly fixingLocalTime: "08:00:00";\n  readonly normalMovementCapBasisPoints: number;\n  readonly crisisMovementCapBasisPoints: number;\n  readonly gdp: {\n    readonly capBasisPoints: number;\n    readonly levelWeightBasisPoints: number;\n    readonly growthWeightBasisPoints: number;\n    readonly levelNormalizer: bigint;\n    readonly growthNormalizer: bigint;\n  };\n  readonly inflation: { readonly capBasisPoints: number; readonly normalizer: bigint };\n  readonly realInterest: { readonly capBasisPoints: number; readonly normalizer: bigint };\n  readonly trade: {\n    readonly capBasisPoints: number;\n    readonly tradeBalanceWeightBasisPoints: number;\n    readonly exportStrengthWeightBasisPoints: number;\n    readonly inverseImportDependencyWeightBasisPoints: number;\n    readonly tradeBalanceNormalizer: bigint;\n    readonly exportStrengthNormalizer: bigint;\n    readonly importDependencyNormalizer: bigint;\n  };\n  readonly confidenceStability: {\n    readonly capBasisPoints: number;\n    readonly signalWeightBasisPoints: number;\n    readonly confidenceNormalizer: bigint;\n    readonly indexNormalizer: bigint;\n  };\n  readonly exchangeRateIndexWeightBasisPoints: 0;\n  readonly bilateralTradeExposureWeightBasisPoints: 0;\n}\n\nexport interface MacroMedians {\n  readonly realGdpIndex: bigint;\n  readonly gdpGrowthRate: bigint;\n  readonly inflationRate: bigint;\n  readonly realInterestRate: bigint;\n  readonly consumerConfidenceIndex: bigint;\n  readonly businessConfidenceIndex: bigint;\n  readonly importDependencyIndex: bigint;\n  readonly currencyStabilityIndex: bigint;\n  readonly tradeBalanceIndex: bigint;\n  readonly exportStrengthIndex: bigint;\n  readonly marketRiskIndex: bigint;\n  readonly politicalStabilityIndex: bigint;\n}\n`,
            );

            write(
              'backend/src/domains/fx/calculations/fxFixingMath.ts',
              `import {\n  FX_NUMERAIRE_CURRENCY_CODE,\n  type FxFixingComponentBreakdown,\n  type FxFixingCurrencyValue,\n  type FxFixingStoryShockInput,\n  type FxNationalCurrencyCode,\n} from "../contracts/fxFixingContracts.ts";\nimport {\n  DECIMAL_PLACES,\n  MAX_NUMERIC_MAGNITUDE,\n  SCALE,\n  type MacroMedians,\n  type NormalizedCurrencyInput,\n  type NormalizedPolicy,\n} from "./fxFixingModel.ts";\n\nconst ZERO_DECIMAL = formatDecimal(0n);\nconst ONE_DECIMAL = formatDecimal(SCALE);\n\n${mathBlock}\n\n${mathTail}\n\nexport const FX_FIXING_ZERO_DECIMAL = ZERO_DECIMAL;\n`,
            );

            write(
              'backend/src/domains/fx/calculations/fxFixingPolicy.ts',
              `import {\n  FX_NUMERAIRE_CURRENCY_CODE,\n  type FxFixingPolicyInput,\n} from "../contracts/fxFixingContracts.ts";\nimport { FX_V1_STORAGE_ENVELOPE, type NormalizedPolicy } from "./fxFixingModel.ts";\nimport { formatDecimal, parseDecimal } from "./fxFixingMath.ts";\n\n${policyBlock}\n\n${policyHelperBlock}\n`,
            );

            write(
              'backend/src/domains/fx/calculations/fxFixingNormalization.ts',
              `import {\n  FX_NATIONAL_CURRENCY_DEFINITIONS,\n  type FxFixingEngineInput,\n  type FxFixingStoryShockInput,\n} from "../contracts/fxFixingContracts.ts";\nimport {\n  EXPECTED_COUNTRY_BY_CURRENCY,\n  type NormalizedCurrencyInput,\n  type NormalizedInput,\n} from "./fxFixingModel.ts";\nimport {\n  compareCodeUnits,\n  decimalConstant,\n  formatDecimal,\n  parseDecimal,\n} from "./fxFixingMath.ts";\nimport { canonicalPolicy, normalizePolicy } from "./fxFixingPolicy.ts";\n\n${normalizeInputBlock}\n\n${canonicalStoryBlock}\n\n${currencyValidationBlock}\n\n${normalizationHelperBlock}\n`,
            );

            write(
              file,
              `import type {\n  FxFixingCurrencyValue,\n  FxFixingEngineInput,\n  FxFixingEngineResult,\n} from "../contracts/fxFixingContracts.ts";\nimport { normalizeInput } from "./fxFixingNormalization.ts";\nimport {\n  applyBasisPointMovement,\n  calculateComponents,\n  calculateMedians,\n  formatDecimal,\n  groupStoryShocks,\n  numeraireValue,\n} from "./fxFixingMath.ts";\n\n${calculateBlock}\n\n/** Returns the stable, validated input representation that the runtime hashes. */\n${canonicalizeBlock}\n\nexport { FX_FIXING_ZERO_DECIMAL } from "./fxFixingMath.ts";\n`,
            );

            for (const candidate of [
              file,
              'backend/src/domains/fx/calculations/fxFixingModel.ts',
              'backend/src/domains/fx/calculations/fxFixingMath.ts',
              'backend/src/domains/fx/calculations/fxFixingPolicy.ts',
              'backend/src/domains/fx/calculations/fxFixingNormalization.ts',
            ]) ensureBelow(candidate);
          }

          // Split Supabase fixing RPC projection/validation from orchestration.
          {
            const file = 'backend/src/domains/fx/infrastructure/supabaseFxFixingRepository.ts';
            const source = read(file);
            const classBlock = section(source, 'export class SupabaseFxFixingRepository', 'function mapClaim', 'FX repository class');
            const mapClaimBlock = section(source, 'function mapClaim', 'function mapEngineInput', 'FX claim projection');
            let projectionBlock = section(source, 'function mapEngineInput', 'function firstRow', 'FX engine-input projection');
            let validationBlock = source.slice(source.indexOf('function firstRow')).trimEnd();
            assert(validationBlock.startsWith('function firstRow'), 'FX validation block missing');
            validationBlock = validationBlock.replaceAll('fallbackCode', 'defaultCode');
            projectionBlock = replaceOnce(projectionBlock, 'function mapEngineInput(', 'export function mapEngineInput(', 'FX engine-input mapper export');
            validationBlock = exportFunctions(
              validationBlock,
              [
                'firstRow',
                'requiredUuid',
                'requiredHash',
                'requiredLocalDate',
                'requiredTimestamp',
                'requiredTimezone',
                'requiredCode',
                'requiredNationalCurrencyCode',
                'requiredCountryCode',
                'requiredSafeId',
                'requiredDecimalText',
                'requiredInteger',
                'requiredNonNegativeInteger',
                'requiredZero',
                'requiredCount',
                'requiredText',
                'isRecord',
                'invalidRpcResult',
                'mapRpcError',
              ],
              'FX repository validation exports',
            );

            write(
              'backend/src/domains/fx/infrastructure/fxFixingValidation.ts',
              `import {\n  FX_NATIONAL_CURRENCY_DEFINITIONS,\n  type FxCountryCode,\n  type FxNationalCurrencyCode,\n} from "../contracts/fxFixingContracts.ts";\nimport { FxFixingRunnerError } from "../services/fxFixingRunner.ts";\n\nexport interface SupabaseRpcError {\n  readonly code?: string;\n  readonly message: string;\n  readonly details?: string | null;\n  readonly hint?: string | null;\n}\n\nexport interface SupabaseRpcResponse<T> {\n  readonly data: T | null;\n  readonly error: SupabaseRpcError | null;\n}\n\nconst NATIONAL_CURRENCY_CODES = new Set<string>(\n  FX_NATIONAL_CURRENCY_DEFINITIONS.map((value) => value.currencyCode),\n);\nconst COUNTRY_CODES = new Set<string>(\n  FX_NATIONAL_CURRENCY_DEFINITIONS.map((value) => value.countryCode),\n);\n\n${validationBlock}\n`,
            );

            write(
              'backend/src/domains/fx/infrastructure/fxFixingProjection.ts',
              `import type { FxFixingEngineInput } from "../contracts/fxFixingContracts.ts";\nimport {\n  invalidRpcResult,\n  isRecord,\n  requiredCountryCode,\n  requiredDecimalText,\n  requiredInteger,\n  requiredLocalDate,\n  requiredNationalCurrencyCode,\n  requiredNonNegativeInteger,\n  requiredSafeId,\n  requiredUuid,\n  requiredZero,\n} from "./fxFixingValidation.ts";\n\n${projectionBlock}\n`,
            );

            write(
              file,
              `import type { FxFixingEngineResult } from "../contracts/fxFixingContracts.ts";\nimport {\n  type FxFixingApplyResult,\n  type FxFixingClaim,\n  type FxFixingLoadedInput,\n  FxFixingRunnerError,\n  type FxFixingRunnerRepository,\n} from "../services/fxFixingRunner.ts";\nimport { mapEngineInput } from "./fxFixingProjection.ts";\nimport {\n  type SupabaseRpcResponse,\n  firstRow,\n  invalidRpcResult,\n  isRecord,\n  mapRpcError,\n  requiredCount,\n  requiredHash,\n  requiredLocalDate,\n  requiredSafeId,\n  requiredTimestamp,\n  requiredTimezone,\n  requiredUuid,\n} from "./fxFixingValidation.ts";\n\nexport interface FxFixingSupabaseClient {\n  rpc<T = unknown>(\n    functionName: string,\n    args?: Readonly<Record<string, unknown>>,\n  ): PromiseLike<SupabaseRpcResponse<T>>;\n}\n\nexport interface FxFixingOrchestratorRepository extends FxFixingRunnerRepository {\n  verifySchedulerToken(input: {\n    readonly schedulerName: string;\n    readonly tokenSha256: string;\n  }): Promise<boolean>;\n}\n\ninterface ClaimRpcRow {\n  readonly game_session_id?: unknown;\n  readonly fixing_local_date?: unknown;\n  readonly fixing_effective_at?: unknown;\n  readonly game_timezone?: unknown;\n  readonly lease_token?: unknown;\n}\n\ninterface LoadRpcRow {\n  readonly input_hash?: unknown;\n  readonly engine_input?: unknown;\n  readonly load_fx_fixing_input_v1?: unknown;\n}\n\ninterface ApplyRpcRow {\n  readonly outcome?: unknown;\n  readonly fixing_public_id?: unknown;\n  readonly currency_values_inserted?: unknown;\n  readonly shocks_consumed?: unknown;\n}\n\n${classBlock}\n\n${mapClaimBlock}\n`,
            );

            for (const candidate of [
              file,
              'backend/src/domains/fx/infrastructure/fxFixingProjection.ts',
              'backend/src/domains/fx/infrastructure/fxFixingValidation.ts',
            ]) ensureBelow(candidate);
          }

          // Match the actual retained hire function formatting during replay.
          {
            const file = 'backend/supabase/migrations/20260826100000_business_bank_identity_runtime_v1.sql';
            let source = read(file);
            source = replaceOnce(
              source,
              "        'hire_business_employee_v1'::text,\n        'ab.player_id = p_player_id'::text,",
              "        'hire_business_employee_v1'::text,\n        'ab.player_id=p_player_id'::text,",
              'Business hire identity rewrite source',
            );
            write(file, source);
          }

          // Keep the cross-cutting authority exact and explicit for all reviewed
          // recovery paths. This expands no deployment or production authority.
          {
            const file = 'docs/operations/contracts/player-cross-cutting/pr-672.json';
            const manifest = JSON.parse(read(file));
            const additions = [
              'backend/src/domains/fx/calculations/fxFixingEngine.ts',
              'backend/src/domains/fx/calculations/fxFixingModel.ts',
              'backend/src/domains/fx/calculations/fxFixingPolicy.ts',
              'backend/src/domains/fx/infrastructure/supabaseFxFixingRepository.ts',
              'backend/src/domains/fx/services/fxFixingRunner.ts',
              'player-terminal/src/features/banking/banking-read-helpers.js',
            ];
            manifest.allowedPaths = [...new Set([...manifest.allowedPaths, ...additions])].sort();
            write(file, `${JSON.stringify(manifest, null, 2)}\n`);
          }

          execFileSync(process.execPath, ['scripts/architecture/build-architecture-inventory.mjs'], { stdio: 'inherit' });
          execFileSync(process.execPath, ['scripts/architecture/architecture-ratchet-v2.mjs'], { stdio: 'inherit' });
          execFileSync(process.execPath, ['scripts/validate-supabase-migrations.mjs'], { stdio: 'inherit' });
          execFileSync('git', ['diff', '--check'], { stdio: 'inherit' });
          NODE

      - name: Install Backend tooling
        run: npm ci --prefix backend

      - name: Typecheck repaired Backend source
        run: npm run --prefix backend typecheck

      - name: Install Player Terminal tooling
        run: npm ci --prefix player-terminal

      - name: Verify repaired Player Banking source
        run: |
          npm run --prefix player-terminal check
          npm run --prefix player-terminal banking-read
          npm run --prefix player-terminal banking-fx

      - name: Commit deterministic recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/domains/banking-fx \
            backend/src/domains/fx \
            backend/supabase/migrations/20260826100000_business_bank_identity_runtime_v1.sql \
            docs/architecture/inventories/econovaria-architecture-inventory-v2.json \
            docs/operations/contracts/player-cross-cutting/pr-672.json \
            player-terminal/src/api/banking-fx-backend-routes.js \
            player-terminal/src/features/banking
          git diff --cached --check
          git commit -m "refactor(banking-fx): close B2 architecture and replay gates"
          git push origin HEAD:feat/banking-fx-clearing-v1
