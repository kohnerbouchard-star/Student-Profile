name: Business Phase 4C Bootstrap

on:
  push:
    branches:
      - feat/business-workforce-hiring-v2
    paths:
      - ".github/workflows/business-phase4c-bootstrap.yml"
      - "docs/roadmaps/business-v2-development-execution-log-v1.md"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: business-phase4c-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PARENT_BRANCH: feat/business-workforce-hiring-v2
      PHASE_BRANCH: feat/business-payroll-settlement-v2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-workforce-hiring-v2
          fetch-depth: 0

      - name: Require durable Phase 4B certification
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          log=docs/roadmaps/business-v2-development-execution-log-v1.md
          if ! grep -q 'Phase 4B COMPLETE: candidate pools and server-owned hiring' "$log"; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Phase 4B is not durably certified; Phase 4C remains closed.'
            exit 0
          fi
          grep -q 'Phase 4C — bounded recurring payroll settlement is OPEN' "$log"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Create clean Phase 4C branch and draft PR
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/business-phase4c-bootstrap.yml
          git config user.name econovaria-phase4c-bootstrap
          git config user.email actions@users.noreply.github.com
          git add -u .github/workflows/business-phase4c-bootstrap.yml
          git commit -m 'chore(business): close Phase 4C bootstrap'
          git push origin HEAD:"$PARENT_BRANCH"
          branch_sha=$(git rev-parse HEAD)

          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          repo=os.environ['REPOSITORY']; token=os.environ['GH_TOKEN']; branch=os.environ['PHASE_BRANCH']; parent=os.environ['PARENT_BRANCH']; sha=os.popen('git rev-parse HEAD').read().strip()
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'}
          def request(url, method='GET', payload=None):
              req=urllib.request.Request(url,data=json.dumps(payload).encode() if payload is not None else None,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:
                      return response.status, json.load(response) if response.status != 204 else None
              except urllib.error.HTTPError as error:
                  body=error.read().decode('utf-8','replace')
                  return error.code, body
          status,_=request(f'https://api.github.com/repos/{repo}/git/refs','POST',{'ref':f'refs/heads/{branch}','sha':sha})
          if status not in (201,422): raise SystemExit(f'branch create failed: {status}')
          status,pulls=request(f'https://api.github.com/repos/{repo}/pulls?state=open&head={repo.split("/")[0]}:{branch}&base={parent}')
          if status != 200: raise SystemExit(f'PR lookup failed: {status}')
          if not pulls:
              body='''## Scope\n\nPhase 4C implements bounded recurring payroll settlement, stacked on durably certified Phase 4B.\n\nThis PR remains **draft, open, unmerged, and undeployed**. No staging or production deployment or live data mutation is authorized.\n\n## Required authority boundary\n\n- create exactly one payroll run per Business and payroll period;\n- derive obligations only from active candidate-backed canonical employees;\n- debit first-class Business cash through canonical ledger authority;\n- record explicit paid, partially paid, and unpaid outcomes;\n- preserve idempotency, concurrency safety, currency/game/Business scope, and immutable evidence;\n- pay employees every payroll cycle regardless of production utilization;\n- do not debit payroll during production a second time;\n- keep production-labor integration closed until a later checkpoint.\n\n## Parent certification\n\nPhase 4B certification is recorded in the durable Business V2 execution log on the parent branch.\n\n## Merge and release boundary\n\nPR #648 and all stacked Business V2 PRs remain draft and unmerged. No deployment or live mutation is authorized.'''
              status,result=request(f'https://api.github.com/repos/{repo}/pulls','POST',{'title':'Draft: Business V2 Phase 4C recurring payroll settlement','head':branch,'base':parent,'body':body,'draft':True})
              if status != 201: raise SystemExit(f'PR create failed: {status} {result}')
              print(f'Created PR #{result["number"]}')
          else:
              print(f'Existing PR #{pulls[0]["number"]}')
          PY
