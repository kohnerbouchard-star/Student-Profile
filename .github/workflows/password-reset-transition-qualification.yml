name: Password Reset Transition Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/password-reset-transition-qualification.yml'
      - 'backend/supabase/config.toml'
      - 'backend/supabase/migrations/**'
      - 'scripts/password-reset-transition-*.mjs'
      - 'scripts/admin-password-recovery-contract.test.mjs'
      - 'scripts/password-recovery-frontend-contract.test.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: password-reset-transition-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  password-reset:
    name: Password Reset Transition Qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PASSWORD_RESET_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Set up pinned Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3
      - name: Install pinned tooling and verify source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PASSWORD_RESET_SOURCE_SHA"
          npm install --global npm@10.9.8
          npm ci --ignore-scripts
          test "$(npx supabase --version)" = '2.109.1'
          node --test scripts/password-reset-transition-qualification.test.mjs
          node --test scripts/admin-password-recovery-contract.test.mjs scripts/password-recovery-frontend-contract.test.mjs
      - name: Reproduce baseline and verify focused actual PostgreSQL transition
        run: node --test scripts/password-reset-transition-database.test.mjs
      - name: Start disposable full-schema PostgreSQL
        run: |
          set -euo pipefail
          npx supabase start --workdir backend --exclude studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,gotrue,postgrest,realtime,kong,mailpit,postgres-meta
      - name: Replay full schema from zero
        run: npx supabase db reset --workdir backend --local
      - name: Exercise effective migrated transition and actual recovery wrapper
        env:
          PASSWORD_RESET_FULL_SCHEMA: '1'
        run: node --test scripts/password-reset-transition-full-schema.test.mjs
      - name: Lint rebuilt schema
        run: npx supabase db lint --workdir backend --local --level warning
      - name: Stop only this disposable Supabase stack
        if: always()
        run: npx supabase stop --workdir backend --no-backup
