name: Business Timed Manufacturing V2

# Canonical Phase 6 convergence verification v1.
on:
  pull_request:
    paths:
      - "backend/supabase/migrations/2026082311*.sql"
      - "backend/src/domains/business/api/playerBusinessManufacturing*.ts"
      - "backend/src/domains/business/api/playerBusinessRoutePaths.ts"
      - "backend/src/domains/business/api/playerBusinessHttpHandler.ts"
      - "backend/src/domains/business/infrastructure/supabasePlayerBusinessRepository.ts"
      - "scripts/business-phase6*.mjs"
      - "docs/roadmaps/business-phase6*.md"
      - ".github/workflows/business-*-manufacturing-*.yml"
      - ".github/workflows/business-timed-manufacturing-v2.yml"
  push:
    branches: [main]
    paths:
      - "backend/supabase/migrations/2026082311*.sql"
      - "backend/src/domains/business/api/playerBusinessManufacturing*.ts"
      - "scripts/business-phase6*.mjs"
      - ".github/workflows/business-timed-manufacturing-v2.yml"

permissions:
  contents: read

jobs:
  verify-manufacturing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            player-terminal/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3
      - run: npm install --global npm@10.9.8
      - run: npm ci --ignore-scripts
      - name: Verify timed manufacturing authority and regressions
        run: |
          node scripts/business-phase6-manufacturing-foundation-contract.mjs
          node scripts/business-phase6-manufacturing-lifecycle-simulation.mjs
          node scripts/business-phase6-manufacturing-start-contract.mjs
          node scripts/business-phase6-manufacturing-start-simulation.mjs
          node scripts/business-phase6-manufacturing-completion-contract.mjs
          node scripts/business-phase6-manufacturing-completion-simulation.mjs
          node scripts/business-phase6-manufacturing-recovery-contract.mjs
          node scripts/business-phase6-manufacturing-recovery-simulation.mjs
          if test -f scripts/business-phase6e-player-api-contract.mjs; then
            node scripts/business-phase6e-player-api-contract.mjs
          fi
          node scripts/business-phase5-equipment-foundation-contract.mjs
          node scripts/business-phase5-equipment-capacity-simulation.mjs
          node scripts/business-phase5-equipment-recipe-sync-contract.mjs
          node scripts/business-phase5-equipment-production-contract.mjs
          node scripts/business-phase5-equipment-production-simulation.mjs
          node scripts/business-phase4c-production-labor-contract.mjs
          node scripts/business-phase4c-labor-reservation-simulation.mjs
          node scripts/business-phase4c-payroll-settlement-contract.mjs
          node scripts/business-phase4c-payroll-simulation.mjs
          node scripts/business-banking-runtime-contract.mjs
          node scripts/validate-supabase-migrations.mjs
          git diff --check
      - name: Run repository quality suite
        run: npm test
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Verify all backend and Edge TypeScript
        working-directory: backend
        run: npm run typecheck:all
      - name: Install Player Terminal dependencies
        working-directory: player-terminal
        run: npm ci --no-audit --no-fund
      - name: Verify retained Player Business surface
        working-directory: player-terminal
        run: |
          npm run check
          node tests/business-banking-surface.mjs
          npm run adapter
          npm run capability-manifest-current
          npm run runtime-integration

  align-retained-contracts:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 661 && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            player-terminal/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3
      - name: Align retained Phase 4-6 contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import json

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          capability_path = Path("backend/src/domains/players/contracts/playerCapabilityManifestContracts.ts")
          capability = capability_path.read_text(encoding="utf-8")
          for old, new in [
              (
                  'export const PLAYER_CAPABILITY_MANIFEST_VERSION = "2026-08-22.1" as const;',
                  'export const PLAYER_CAPABILITY_MANIFEST_VERSION = "2026-08-23.1" as const;',
              ),
              (
                  '  | "businessProduction"\n  | "businessStatus"',
                  '  | "businessProduction"\n  | "businessManufacturingJobs"\n  | "businessManufacturingStart"\n  | "businessManufacturingCancel"\n  | "businessStatus"',
              ),
          ]:
              if capability.count(old) != 1:
                  raise SystemExit(f"Capability manifest expected exactly one match: {old!r}")
              capability = capability.replace(old, new, 1)
          production_descriptor = dedent('''\
            {
              key: "businessProduction",
              operations: [{
                method: "POST",
                pathTemplate: "/players/me/business/production-runs",
              }],
              actionCapabilities: ["businessProduction"],
            },
          ''')
          production_descriptor = "  " + production_descriptor.replace("\n", "\n  ").rstrip() + "\n"
          manufacturing_descriptors = production_descriptor + dedent('''\
            {
              key: "businessManufacturingJobs",
              operations: [{
                method: "GET",
                pathTemplate: "/players/me/businesses/:businessKey/manufacturing/jobs",
              }],
              routeCapabilities: ["business"],
            },
            {
              key: "businessManufacturingStart",
              operations: [{
                method: "POST",
                pathTemplate: "/players/me/businesses/:businessKey/manufacturing/jobs",
              }],
              actionCapabilities: ["businessProduction"],
            },
            {
              key: "businessManufacturingCancel",
              operations: [{
                method: "POST",
                pathTemplate: "/players/me/businesses/:businessKey/manufacturing/jobs/:jobKey/cancel",
              }],
              actionCapabilities: ["businessProduction"],
            },
          ''')
          manufacturing_tail = manufacturing_descriptors[len(production_descriptor):]
          manufacturing_descriptors = production_descriptor + "  " + manufacturing_tail.replace("\n", "\n  ").rstrip() + "\n"
          if capability.count(production_descriptor) != 1:
              raise SystemExit("Expected one Business production capability descriptor.")
          capability_path.write_text(
              capability.replace(production_descriptor, manufacturing_descriptors, 1),
              encoding="utf-8",
          )

          replace_once(
              "backend/src/security/playerRateLimitDispatch.ts",
              dedent('''\
                businessProduction: byMethod({
                  POST: operation("player.business.production.run", "sensitive"),
                }),
              '''),
              dedent('''\
                businessProduction: byMethod({
                  POST: operation("player.business.production.run", "sensitive"),
                }),
                businessManufacturingJobs: byMethod({
                  GET: operation("player.business.manufacturing.jobs.read", "read"),
                }),
                businessManufacturingStart: byMethod({
                  POST: operation("player.business.manufacturing.jobs.start", "sensitive"),
                }),
                businessManufacturingCancel: byMethod({
                  POST: operation("player.business.manufacturing.jobs.cancel", "sensitive"),
                }),
              '''),
          )

          replace_once(
              "backend/supabase/functions/classroom-api/index.ts",
              dedent('''\
                    const endpointKey =
                      playerBusinessBankingRoute.kind === "businessRead" &&
                        playerBusinessBankingRoute.resource === "workforceCandidates"
                        ? "businessWorkforce"
                        : ({
              '''),
              dedent('''\
                    const endpointKey =
                      playerBusinessBankingRoute.kind === "businessRead" &&
                        playerBusinessBankingRoute.resource === "workforceCandidates"
                        ? "businessWorkforce"
                        : playerBusinessBankingRoute.kind === "businessManufacturingCollection"
                        ? request.method === "GET"
                          ? "businessManufacturingJobs"
                          : "businessManufacturingStart"
                        : playerBusinessBankingRoute.kind === "businessManufacturingCancel"
                        ? "businessManufacturingCancel"
                        : ({
              '''),
          )

          test_path = Path("player-terminal/tests/business-banking-surface.mjs")
          test = test_path.read_text(encoding="utf-8")
          replacements = [
              (
                  'const productKey = `bpr_${"b".repeat(32)}`;\n',
                  'const productKey = `bpr_${"b".repeat(32)}`;\nconst manufacturingJobKey = `mfg_${"7".repeat(32)}`;\n',
              ),
              (
                  '    inventory: [{ itemKey: "machine-steel-billet", kind: "input", quantity: 10, unitCost: 2 }],\n    workforceUtilization: {\n',
                  dedent('''\
                        inventory: [{ itemKey: "machine-steel-billet", kind: "input", quantity: 10, unitCost: 2 }],
                        manufacturingJobs: [{
                          jobKey: manufacturingJobKey,
                          businessKey,
                          productKey,
                          productName: "Utility Module",
                          status: "in_progress",
                          resourceState: "reserved",
                          priority: "standard",
                          quantity: 10,
                          completedOutputQuantity: 0,
                          queuedAt: "2026-08-23T00:00:00.000Z",
                          startedAt: "2026-08-23T00:01:00.000Z",
                          completesAt: "2026-08-23T00:11:00.000Z",
                          completedAt: null,
                          cancelledAt: null,
                          failedAt: null,
                          failureCode: null,
                          canCancel: true,
                        }],
                        workforceUtilization: {
                  '''),
              ),
              ('  "businessProduction",\n', '  "businessManufacturingStart",\n'),
          ]
          for old, new in replacements:
              if test.count(old) != 1:
                  raise SystemExit(f"Business surface expected exactly one match: {old!r}")
              test = test.replace(old, new, 1)
          marker = '}\nassert.match(markup, /data-endpoint="businessCandidateHire"/);\n'
          addition = dedent('''\
            }
            assert.match(markup, /data-endpoint="businessManufacturingCancel"/);
            assert.match(markup, new RegExp(`data-business-manufacturing-job="${manufacturingJobKey}"`));
            assert.ok(
              WRITE_INVALIDATIONS.businessManufacturingCancel?.includes("business"),
              "missing businessManufacturingCancel Business invalidation",
            );
            assert.doesNotMatch(markup, /data-endpoint="businessProduction"/);
            assert.equal(
              PLAYER_ENDPOINTS.businessManufacturingStart.path,
              "/businesses/:businessId/manufacturing/jobs",
            );
            assert.equal(
              PLAYER_ENDPOINTS.businessManufacturingCancel.path,
              "/businesses/:businessId/manufacturing/jobs/:jobId/cancel",
            );
            assert.match(markup, /data-endpoint="businessCandidateHire"/);
          ''')
          if test.count(marker) != 1:
              raise SystemExit("Expected one Business surface assertion marker.")
          test_path.write_text(test.replace(marker, addition, 1), encoding="utf-8")

          replace_once(
              "scripts/business-phase4c-player-recovery-contract.mjs",
              '  "Recipe labor minutes are enforced server-side",\n',
              '  "The server reserves exact materials, labor, equipment, and completion time",\n',
          )

          authority_path = Path("docs/operations/contracts/player-cross-cutting-verification-authority-v1.json")
          authority = json.loads(authority_path.read_text(encoding="utf-8"))
          authority["allowedPaths"] = sorted(set(authority["allowedPaths"] + [
              "backend/src/domains/players/contracts/playerCapabilityManifestContracts.ts",
              "backend/src/security/playerRateLimitDispatch.ts",
              "backend/supabase/functions/classroom-api/index.ts",
              "player-terminal/tests/business-banking-surface.mjs",
              "scripts/business-phase4c-player-recovery-contract.mjs",
          ]))
          authority_path.write_text(json.dumps(authority, indent=2) + "\n", encoding="utf-8")
          PY
          git show e6c9ffe6701853e1c71173789f85dc269e9a3c4b:.github/workflows/business-timed-manufacturing-v2.yml > .github/workflows/business-timed-manufacturing-v2.yml
          rm -f .github/workflows/business-phase6-contract-alignment.yml
          rm -f .github/workflows/business-phase6-contract-alignment-pr.yml
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix backend ci --ignore-scripts
      - name: Verify aligned contracts
        run: |
          node player-terminal/tests/business-banking-surface.mjs
          node scripts/business-phase4c-player-recovery-contract.mjs
          node scripts/business-phase6e-player-api-contract.mjs
          node --test scripts/player-cross-cutting-authority.test.mjs
          npm --prefix backend run typecheck:all
          node scripts/validate-supabase-migrations.mjs
          git diff --check
      - name: Commit aligned retained contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/domains/players/contracts/playerCapabilityManifestContracts.ts \
            backend/src/security/playerRateLimitDispatch.ts \
            backend/supabase/functions/classroom-api/index.ts \
            player-terminal/tests/business-banking-surface.mjs \
            scripts/business-phase4c-player-recovery-contract.mjs \
            docs/operations/contracts/player-cross-cutting-verification-authority-v1.json \
            .github/workflows/business-timed-manufacturing-v2.yml \
            .github/workflows/business-phase6-contract-alignment.yml \
            .github/workflows/business-phase6-contract-alignment-pr.yml
          git commit -m "fix(business): align retained contracts with timed manufacturing"
          git push origin HEAD:feat/business-timed-manufacturing-v2
