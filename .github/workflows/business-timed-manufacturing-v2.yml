name: Business Timed Manufacturing V2 Composition Repair

on:
  pull_request:
    paths:
      - "backend/supabase/functions/classroom-api/index.ts"
      - "backend/src/domains/players/contracts/playerCapabilityManifestContracts.test.ts"
      - ".github/workflows/business-timed-manufacturing-v2.yml"

permissions:
  contents: read

concurrency:
  group: business-timed-manufacturing-composition-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  align-composition-roots:
    name: Align dedicated Business dispatch boundaries
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 661 &&
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact Phase 6 branch
        uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0
      - name: Align classroom and capability dispatch boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          classroom = Path('backend/supabase/functions/classroom-api/index.ts')
          source = classroom.read_text()

          import_needle = '''import {
  readPlayerBusinessBankingRoutePath,
} from "../../../src/domains/business-banking/api/playerBusinessBankingRoutePaths.ts";
'''
          import_replacement = import_needle + '''import { dispatchPlayerBusinessRequest } from "../_shared/playerBusinessDispatch.ts";
'''
          if source.count(import_needle) != 1:
              raise SystemExit('Expected one Business Banking route import in classroom-api.')
          source = source.replace(import_needle, import_replacement)

          route_needle = '''  const playerBusinessBankingRoute = readPlayerBusinessBankingRoutePath(
    url.pathname,
  );
'''
          route_replacement = '''  const playerBusinessResponse = await dispatchPlayerBusinessRequest(
    request,
    { createServiceClient },
  );
  if (playerBusinessResponse) return playerBusinessResponse;

''' + route_needle
          if source.count(route_needle) != 1:
              raise SystemExit('Expected one legacy Business Banking route boundary.')
          source = source.replace(route_needle, route_replacement)

          stale_mapping = '''        : playerBusinessBankingRoute.kind === "businessManufacturingCollection"
        ? request.method === "GET"
          ? "businessManufacturingJobs"
          : "businessManufacturingStart"
        : playerBusinessBankingRoute.kind === "businessManufacturingCancel"
        ? "businessManufacturingCancel"
        : ({
'''
          if source.count(stale_mapping) != 1:
              raise SystemExit('Expected one stale manufacturing mapping in classroom-api.')
          source = source.replace(stale_mapping, '''        : ({
''')
          classroom.write_text(source)

          capability = Path('backend/src/domains/players/contracts/playerCapabilityManifestContracts.test.ts')
          source = capability.read_text()

          banking_import = 'import { readPlayerBusinessBankingRoutePath } from "../../business-banking/api/playerBusinessBankingRoutePaths.ts";\n'
          business_import = 'import { readPlayerBusinessRoutePath } from "../../business/api/playerBusinessRoutePaths.ts";\n'
          if source.count(banking_import) != 1 or business_import in source:
              raise SystemExit('Unexpected capability-test Business parser imports.')
          source = source.replace(banking_import, banking_import + business_import)

          old_set = '''const BUSINESS_BANKING_ENDPOINTS = new Set<PlayerCapabilityEndpointKey>([
  "business",
  "businessWorkforce",
  "businessCreate",
  "businessFormationPropose",
  "businessFormationRespond",
  "businessFormationActivate",
  "businessProductCreate",
  "businessProduction",
  "businessManufacturingJobs",
  "businessManufacturingStart",
  "businessManufacturingCancel",
  "businessPrice",
  "businessCandidateHire",
  "businessTerminate",
  "businessStatus",
  "bankTransfer",
  "savingsTransfer",
  "loans",
  "loanApply",
  "loanRepay",
]);
'''
          new_sets = '''const BUSINESS_ENDPOINTS = new Set<PlayerCapabilityEndpointKey>([
  "business",
  "businessWorkforce",
  "businessCreate",
  "businessFormationPropose",
  "businessFormationRespond",
  "businessFormationActivate",
  "businessProductCreate",
  "businessProduction",
  "businessManufacturingJobs",
  "businessManufacturingStart",
  "businessManufacturingCancel",
  "businessPrice",
  "businessCandidateHire",
  "businessTerminate",
  "businessStatus",
]);

const BANKING_ENDPOINTS = new Set<PlayerCapabilityEndpointKey>([
  "bankTransfer",
  "savingsTransfer",
  "loans",
  "loanApply",
  "loanRepay",
]);
'''
          if source.count(old_set) != 1:
              raise SystemExit('Expected one combined Business/Banking endpoint set.')
          source = source.replace(old_set, new_sets)
          source = source.replace(
              '"progression", "progressionUnlock", "progressionClaim", ...BUSINESS_BANKING_ENDPOINTS,',
              '"progression", "progressionUnlock", "progressionClaim", ...BUSINESS_ENDPOINTS, ...BANKING_ENDPOINTS,',
          )
          parser_needle = ''': BUSINESS_BANKING_ENDPOINTS.has(operation.key)
      ? readPlayerBusinessBankingRoutePath(operation.path)
'''
          parser_replacement = ''': BUSINESS_ENDPOINTS.has(operation.key)
      ? readPlayerBusinessRoutePath(operation.path)
      : BANKING_ENDPOINTS.has(operation.key)
      ? readPlayerBusinessBankingRoutePath(operation.path)
'''
          if source.count(parser_needle) != 1:
              raise SystemExit('Expected one combined Business/Banking parser branch.')
          source = source.replace(parser_needle, parser_replacement)
          capability.write_text(source)
          PY
          git diff --check -- \
            backend/supabase/functions/classroom-api/index.ts \
            backend/src/domains/players/contracts/playerCapabilityManifestContracts.test.ts
      - name: Commit source-only composition repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/supabase/functions/classroom-api/index.ts \
            backend/src/domains/players/contracts/playerCapabilityManifestContracts.test.ts
          git commit -m "fix(player): route Business through dedicated dispatch"
          git push origin HEAD:feat/business-timed-manufacturing-v2
