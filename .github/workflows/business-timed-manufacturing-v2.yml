name: Business Timed Manufacturing V2

# Canonical Phase 6 convergence verification v1.
on:
  pull_request:
    paths:
      - "backend/supabase/migrations/2026082311*.sql"
      - "backend/src/domains/business/api/playerBusinessManufacturing*.ts"
      - "backend/src/domains/business/api/playerBusinessRoutePaths.ts"
      - "backend/src/domains/business/api/playerBusinessHttpHandler.ts"
      - "backend/src/domains/business/infrastructure/supabasePlayerBusinessRepository.ts"
      - "scripts/business-phase6*.mjs"
      - "docs/roadmaps/business-phase6*.md"
      - ".github/workflows/business-*-manufacturing-*.yml"
      - ".github/workflows/business-timed-manufacturing-v2.yml"
  push:
    branches: [main]
    paths:
      - "backend/supabase/migrations/2026082311*.sql"
      - "backend/src/domains/business/api/playerBusinessManufacturing*.ts"
      - "scripts/business-phase6*.mjs"
      - ".github/workflows/business-timed-manufacturing-v2.yml"

permissions:
  contents: read

jobs:
  verify-manufacturing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            player-terminal/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3
      - run: npm install --global npm@10.9.8
      - run: npm ci --ignore-scripts
      - name: Verify timed manufacturing authority and regressions
        run: |
          node scripts/business-phase6-manufacturing-foundation-contract.mjs
          node scripts/business-phase6-manufacturing-lifecycle-simulation.mjs
          node scripts/business-phase6-manufacturing-start-contract.mjs
          node scripts/business-phase6-manufacturing-start-simulation.mjs
          node scripts/business-phase6-manufacturing-completion-contract.mjs
          node scripts/business-phase6-manufacturing-completion-simulation.mjs
          node scripts/business-phase6-manufacturing-recovery-contract.mjs
          node scripts/business-phase6-manufacturing-recovery-simulation.mjs
          if test -f scripts/business-phase6e-player-api-contract.mjs; then
            node scripts/business-phase6e-player-api-contract.mjs
          fi
          node scripts/business-phase5-equipment-foundation-contract.mjs
          node scripts/business-phase5-equipment-capacity-simulation.mjs
          node scripts/business-phase5-equipment-recipe-sync-contract.mjs
          node scripts/business-phase5-equipment-production-contract.mjs
          node scripts/business-phase5-equipment-production-simulation.mjs
          node scripts/business-phase4c-production-labor-contract.mjs
          node scripts/business-phase4c-labor-reservation-simulation.mjs
          node scripts/business-phase4c-payroll-settlement-contract.mjs
          node scripts/business-phase4c-payroll-simulation.mjs
          node scripts/business-banking-runtime-contract.mjs
          node scripts/validate-supabase-migrations.mjs
          git diff --check
      - name: Run repository quality suite
        run: npm test
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Verify all backend and Edge TypeScript
        working-directory: backend
        run: npm run typecheck:all
      - name: Install Player Terminal dependencies
        working-directory: player-terminal
        run: npm ci --no-audit --no-fund
      - name: Verify retained Player Business surface
        working-directory: player-terminal
        run: |
          npm run check
          node tests/business-banking-surface.mjs
          npm run adapter
          npm run capability-manifest-current
          npm run runtime-integration
