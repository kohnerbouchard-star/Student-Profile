name: Business Timed Manufacturing V2

# Canonical Phase 6 convergence verification v1.
on:
  pull_request:
    paths:
      - "backend/supabase/migrations/2026082311*.sql"
      - "backend/src/domains/business/api/playerBusinessManufacturing*.ts"
      - "backend/src/domains/business/api/playerBusinessRoutePaths.ts"
      - "backend/src/domains/business/api/playerBusinessHttpHandler.ts"
      - "backend/src/domains/business/infrastructure/supabasePlayerBusinessRepository.ts"
      - "scripts/business-phase6*.mjs"
      - "docs/roadmaps/business-phase6*.md"
      - ".github/workflows/business-*-manufacturing-*.yml"
      - ".github/workflows/business-timed-manufacturing-v2.yml"
  push:
    branches: [main]
    paths:
      - "backend/supabase/migrations/2026082311*.sql"
      - "backend/src/domains/business/api/playerBusinessManufacturing*.ts"
      - "scripts/business-phase6*.mjs"
      - ".github/workflows/business-timed-manufacturing-v2.yml"

permissions:
  contents: read

jobs:
  verify-manufacturing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            player-terminal/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3
      - run: npm install --global npm@10.9.8
      - run: npm ci --ignore-scripts
      - name: Verify timed manufacturing authority and regressions
        run: |
          node scripts/business-phase6-manufacturing-foundation-contract.mjs
          node scripts/business-phase6-manufacturing-lifecycle-simulation.mjs
          node scripts/business-phase6-manufacturing-start-contract.mjs
          node scripts/business-phase6-manufacturing-start-simulation.mjs
          node scripts/business-phase6-manufacturing-completion-contract.mjs
          node scripts/business-phase6-manufacturing-completion-simulation.mjs
          node scripts/business-phase6-manufacturing-recovery-contract.mjs
          node scripts/business-phase6-manufacturing-recovery-simulation.mjs
          if test -f scripts/business-phase6e-player-api-contract.mjs; then
            node scripts/business-phase6e-player-api-contract.mjs
          fi
          node scripts/business-phase5-equipment-foundation-contract.mjs
          node scripts/business-phase5-equipment-capacity-simulation.mjs
          node scripts/business-phase5-equipment-recipe-sync-contract.mjs
          node scripts/business-phase5-equipment-production-contract.mjs
          node scripts/business-phase5-equipment-production-simulation.mjs
          node scripts/business-phase4c-production-labor-contract.mjs
          node scripts/business-phase4c-labor-reservation-simulation.mjs
          node scripts/business-phase4c-payroll-settlement-contract.mjs
          node scripts/business-phase4c-payroll-simulation.mjs
          node scripts/business-banking-runtime-contract.mjs
          node scripts/validate-supabase-migrations.mjs
          git diff --check
      - name: Run repository quality suite
        run: npm test
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Verify all backend and Edge TypeScript
        working-directory: backend
        run: npm run typecheck:all
      - name: Install Player Terminal dependencies
        working-directory: player-terminal
        run: npm ci --no-audit --no-fund
      - name: Verify retained Player Business surface
        working-directory: player-terminal
        run: |
          npm run check
          node tests/business-banking-surface.mjs
          npm run adapter
          npm run capability-manifest-current
          npm run runtime-integration

  diagnose-player-edge-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Start minimal local Supabase Edge stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend/supabase/functions
          {
            node -e "process.stdout.write('ECONOVARIA_RATE_LIMIT_HMAC_SECRET=' + require('node:crypto').randomBytes(48).toString('base64url') + '\n')"
            node -e "process.stdout.write('ECONOVARIA_WEB_SESSION_ENCRYPTION_KEY=' + require('node:crypto').randomBytes(32).toString('base64url') + '\n')"
            node -e "process.stdout.write('ECONOVARIA_PLAYER_CREDENTIAL_PEPPER=' + require('node:crypto').randomBytes(48).toString('base64url') + '\n')"
            printf '%s\n' 'ECONOVARIA_TRUSTED_CLIENT_IP_HEADER=x-real-ip'
          } > backend/supabase/functions/.env
          chmod 600 backend/supabase/functions/.env
          npx supabase start --workdir backend --exclude studio,imgproxy,storage-api,logflare,vector,supavisor,realtime,postgres-meta,mailpit
      - name: Probe Player Edge preflight and expose sanitized boot error
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx supabase status --workdir backend -o env)"
          test -n "${PUBLISHABLE_KEY:-}"
          STATUS=000
          for ATTEMPT in $(seq 1 30); do
            STATUS="$(curl --silent --show-error \
              --output /tmp/player-api-preflight.json \
              --write-out '%{http_code}' \
              --max-time 5 \
              --request OPTIONS \
              --header "apikey: ${PUBLISHABLE_KEY}" \
              http://127.0.0.1:54321/functions/v1/player-api || true)"
            if [ "$STATUS" = "204" ]; then
              echo "Player API Edge preflight is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Player API Edge preflight returned HTTP ${STATUS}." >&2
          echo "== bounded upstream response ==" >&2
          head -c 4000 /tmp/player-api-preflight.json \
            | sed -E 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/[jwt-redacted]/g; s/sb_(secret|publishable)_[A-Za-z0-9_-]+/[supabase-key-redacted]/g; s/[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/[uuid-redacted]/gi' >&2 || true
          echo >&2
          echo "== sanitized Edge runtime logs ==" >&2
          for CONTAINER in $(docker ps --format '{{.Names}}' | grep -E 'edge_runtime|kong' || true); do
            echo "-- ${CONTAINER} --" >&2
            docker logs --since 15m "$CONTAINER" 2>&1 \
              | tail -n 1200 \
              | sed -E 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/[jwt-redacted]/g; s/sb_(secret|publishable)_[A-Za-z0-9_-]+/[supabase-key-redacted]/g; s/[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/[uuid-redacted]/gi' >&2
          done
          exit 1
      - name: Stop diagnostic stack
        if: always()
        run: |
          rm -f backend/supabase/functions/.env
          npx supabase stop --workdir backend --no-backup || true
