name: Business Timed Manufacturing V2 Runtime Repair

on:
  pull_request:
    paths:
      - "backend/supabase/functions/player-api/runtime.ts"
      - ".github/workflows/business-timed-manufacturing-v2.yml"

permissions:
  contents: read

concurrency:
  group: business-timed-manufacturing-runtime-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair-runtime-closures:
    name: Repair two malformed Player runtime closures
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 661 &&
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact Phase 6 branch
        uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0
      - name: Repair exact malformed closures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/supabase/functions/player-api/runtime.ts')
          source = path.read_text()
          malformed = '        createServiceClient,\n      ),'
          repaired = '        createServiceClient,\n      }),'
          count = source.count(malformed)
          if count != 2:
              raise SystemExit(f'Expected exactly two malformed closures, found {count}.')
          path.write_text(source.replace(malformed, repaired))
          PY
          git diff --check -- backend/supabase/functions/player-api/runtime.ts
      - name: Commit runtime-only repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/player-api/runtime.ts
          git commit -m "fix(player): close reviewed Player API dependency objects"
          git push origin HEAD:feat/business-timed-manufacturing-v2
