name: Business Phase 6 Verification Cleanup

on:
  push:
    branches:
      - feat/business-timed-manufacturing-v2
    paths:
      - ".github/workflows/business-timed-manufacturing-v2.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact Phase 6 branch
        uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0
      - name: Restore permanent verification and remove temporary controllers
        shell: bash
        run: |
          set -euo pipefail
          git show 425629318dbb988c124f8d6385e86cbb4b82e1cb:.github/workflows/business-timed-manufacturing-v2.yml \
            > /tmp/business-timed-manufacturing-v2.yml
          python - <<'PY'
          import json
          from pathlib import Path

          workflow = Path('/tmp/business-timed-manufacturing-v2.yml')
          text = workflow.read_text()
          needle = '                --header "Authorization: Bearer ${PUBLISHABLE_KEY}" \\\n'
          addition = (
              needle
              + '                --header "Origin: http://127.0.0.1:4173" \\\n'
              + '                --header "Access-Control-Request-Method: GET" \\\n'
          )
          if 'Origin: http://127.0.0.1:4173' not in text:
              if text.count(needle) != 1:
                  raise SystemExit('Expected one Player Edge preflight authorization header.')
              text = text.replace(needle, addition)
          workflow.write_text(text)

          authority_path = Path(
              'docs/operations/contracts/player-cross-cutting-verification-authority-v1.json'
          )
          authority = json.loads(authority_path.read_text())
          required = 'scripts/security-audit-remediation-contract.test.mjs'
          if required not in authority['allowedPaths']:
              authority['allowedPaths'].append(required)
              authority['allowedPaths'].sort()
          authority_path.write_text(json.dumps(authority, indent=2) + '\n')
          PY
          cp /tmp/business-timed-manufacturing-v2.yml \
            .github/workflows/business-timed-manufacturing-v2.yml
          rm -f \
            .github/workflows/business-phase6-certification-controller.yml \
            .github/workflows/business-phase6-certification-recovery.yml \
            .github/workflows/business-phase6-edge-convergence.yml \
            .github/workflows/phase6-convergence.yml \
            .github/workflows/phase6-durable-certifier.yml \
            .github/workflows/phase6-pr-finalizer.yml \
            .github/workflows/phase7-conditional-bootstrap.yml
          git diff --check
      - name: Commit permanent Phase 6 verification boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(player): converge Phase 6 verification boundaries"
          git push origin HEAD:feat/business-timed-manufacturing-v2
