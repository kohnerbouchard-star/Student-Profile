name: C2 architecture refresh once

on:
  push:
    branches:
      - feat/multicurrency-marketplace-funding-v1
    paths:
      - .github/workflows/c2-architecture-refresh-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out C2 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/multicurrency-marketplace-funding-v1
          fetch-depth: 0

      - name: Retire C2 compatibility marker wording
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          expected = {
              "backend/src/domains/marketplace/api/playerMarketplaceHttpHandler.ts": 1,
              "backend/src/domains/marketplace/api/playerMarketplaceRoutePaths.ts": 2,
              "backend/src/domains/marketplace/api/playerMarketplaceHttpHandler.test.ts": 1,
          }
          for name, count in expected.items():
              path = Path(name)
              source = path.read_text()
              actual = source.count('"legacy"')
              if actual != count:
                  raise SystemExit(f"{name}: expected {count} exact retired-route markers, found {actual}")
              path.write_text(source.replace('"legacy"', '"retired"'))
          PY

          npm --prefix backend ci --ignore-scripts
          npm --prefix backend run typecheck
          npm --prefix backend run test:player-marketplace

      - name: Regenerate and verify architecture inventory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/architecture/build-architecture-inventory.mjs
          node scripts/architecture/architecture-ratchet-v2.mjs
          git diff --check

      - name: Commit source and generated inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/domains/marketplace/api/playerMarketplaceHttpHandler.ts \
            backend/src/domains/marketplace/api/playerMarketplaceRoutePaths.ts \
            backend/src/domains/marketplace/api/playerMarketplaceHttpHandler.test.ts \
            docs/architecture/inventories/econovaria-architecture-inventory-v2.json
          git commit -m "refactor(marketplace-funding): retire compatibility route marker"
          git push origin HEAD:feat/multicurrency-marketplace-funding-v1
