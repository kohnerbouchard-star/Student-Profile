name: C3B prepared-candidate controller

on:
  push:
    branches:
      - feat/multicurrency-stock-funding-v1
    paths:
      - .github/workflows/c3b-prepared-candidate-controller.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write
  checks: write

jobs:
  materialize-certify:
    name: Materialize and certify prepared C3B candidate
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out C3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/multicurrency-stock-funding-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize prepared blobs and publish exact candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: feat/multicurrency-stock-funding-v1
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]
          token = os.environ["GH_TOKEN"]
          prepared = [
              "44a3892b7425ff3de429a12396ad4a9f882f7032",
              "2da60bcf8f002cda400d5869e09bb4f725619a05",
              "d7de8e5e5add56c036ec059670cc2d19855c1e9c",
          ]

          def api(path: str):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "econovaria-c3b-controller",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          def fetch_blob(sha: str) -> str:
              payload = api(f"/git/blobs/{sha}")
              if payload.get("encoding") != "base64":
                  raise RuntimeError(f"Unsupported blob encoding for {sha}")
              return base64.b64decode(payload["content"]).decode("utf-8")

          def classify(text: str, sha: str) -> str:
              stripped = text.lstrip("\ufeff\n\r ")
              lower = stripped.lower()
              explicit = re.search(
                  r"(?im)^(?:file|path)\s*:\s*`?((?:\.github|backend|docs|scripts)/[^`\s]+)`?\s*$",
                  stripped[:3000],
              )
              if explicit:
                  return explicit.group(1)
              if stripped.startswith("{"):
                  try:
                      data = json.loads(stripped)
                  except json.JSONDecodeError:
                      data = None
                  if isinstance(data, dict) and data.get("authorityId") == "econovaria.multicurrency-stock-funding-pr-676.v1":
                      return "docs/operations/contracts/player-cross-cutting/pr-676.json"
              if lower.startswith("name: multicurrency-stock-funding-v1"):
                  return ".github/workflows/multicurrency-stock-funding-v1.yml"
              if lower.startswith("# multi-currency stock market funding c3b") or (
                  lower.startswith("# multi-currency stock market funding") and "c3b" in lower[:500]
              ):
                  return "docs/roadmaps/multicurrency-stock-funding-c3b-handoff-v1.md"
              if stripped.startswith("#!/usr/bin/env node"):
                  if "requiretokens" in lower and "schema-contract" in lower:
                      return "scripts/multicurrency-stock-funding-schema-contract.mjs"
                  if "stock" in lower and "quote" in lower and (
                      "database acceptance" in lower or "resetfixture" in lower or "runjson" in lower
                  ):
                      return "scripts/multicurrency-stock-funding-buy-quote-database.mjs"
              if stripped.startswith("--") or "create table public." in lower or "alter table public." in lower:
                  if "stock_buy_quotes" in lower and "create table" in lower:
                      return "backend/supabase/migrations/20260827112000_multicurrency_stock_funding_buy_quote_v1.sql"
                  if "stock_buy_quotes" in lower and "game_data_purge_table_registry" in lower:
                      return "backend/supabase/migrations/20260827112700_multicurrency_stock_funding_buy_quote_purge_registry_v1.sql"
                  if "c3b_" in lower or ("stock_buy_quotes" in lower and "assert" in lower):
                      return "backend/supabase/migrations/20260827112500_multicurrency_stock_funding_buy_quote_assertions_v1.sql"
              raise RuntimeError(
                  f"Prepared blob {sha} could not be classified. Prefix={stripped[:240]!r}"
              )

          written: dict[str, str] = {}
          for sha in prepared:
              text = fetch_blob(sha)
              try:
                  manifest = json.loads(text)
              except json.JSONDecodeError:
                  manifest = None
              if isinstance(manifest, dict) and isinstance(manifest.get("files"), list):
                  for item in manifest["files"]:
                      path = item["path"]
                      content = item["content"]
                      if path in written:
                          raise RuntimeError(f"Duplicate prepared path: {path}")
                      written[path] = content
              else:
                  path = classify(text, sha)
                  if path in written:
                      raise RuntimeError(f"Duplicate prepared path: {path}")
                  written[path] = text

          for path, content in written.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content if content.endswith("\n") else content + "\n")

          schema_paths = [
              path for path in written
              if path.endswith(".sql") and "buy_quote" in path and "assertions" not in path and "purge" not in path
          ]
          if not schema_paths:
              schema_paths = [
                  str(path) for path in Path("backend/supabase/migrations").glob("20260827112*_multicurrency_stock_funding_*quote*.sql")
                  if "assertions" not in path.name and "purge" not in path.name
              ]
          if not schema_paths:
              raise RuntimeError("C3B prepared payload did not produce a buy-quote schema migration")

          schema_text = "\n".join(Path(path).read_text() for path in schema_paths)
          if "stock_buy_quotes" not in schema_text:
              raise RuntimeError("C3B schema does not establish stock_buy_quotes")

          function_names = re.findall(
              r"create\s+or\s+replace\s+function\s+public\.([a-z0-9_]*stock[a-z0-9_]*quote[a-z0-9_]*)\s*\(",
              schema_text,
              flags=re.IGNORECASE,
          )
          preferred = [name for name in function_names if "buy" in name and "create" in name]
          quote_function = (preferred or function_names)[0] if function_names else None
          if quote_function is None:
              raise RuntimeError("C3B schema does not expose a Stock-owned quote command")

          assertion_path = Path(
              "backend/supabase/migrations/20260827112500_multicurrency_stock_funding_buy_quote_assertions_v1.sql"
          )
          if not assertion_path.exists():
              assertion_path.write_text(f"""-- C3B immutable Stock buy-quote schema assertions V1.\n\nbegin;\n\ndo $assertions$\ndeclare\n  v_rpc_oid oid;\n  v_rls boolean;\n  v_force_rls boolean;\nbegin\n  if to_regclass('public.stock_buy_quotes') is null then\n    raise exception 'C3B_STOCK_BUY_QUOTE_TABLE_MISSING';\n  end if;\n\n  select class_row.relrowsecurity, class_row.relforcerowsecurity\n  into v_rls, v_force_rls\n  from pg_catalog.pg_class as class_row\n  where class_row.oid = 'public.stock_buy_quotes'::regclass;\n\n  if not coalesce(v_rls, false) or not coalesce(v_force_rls, false) then\n    raise exception 'C3B_STOCK_BUY_QUOTE_RLS_INVALID';\n  end if;\n\n  if has_table_privilege('anon', 'public.stock_buy_quotes', 'SELECT,INSERT,UPDATE,DELETE')\n     or has_table_privilege('authenticated', 'public.stock_buy_quotes', 'SELECT,INSERT,UPDATE,DELETE') then\n    raise exception 'C3B_STOCK_BUY_QUOTE_BROWSER_PRIVILEGE';\n  end if;\n\n  select proc_row.oid\n  into v_rpc_oid\n  from pg_catalog.pg_proc as proc_row\n  join pg_catalog.pg_namespace as namespace_row\n    on namespace_row.oid = proc_row.pronamespace\n  where namespace_row.nspname = 'public'\n    and proc_row.proname = '{quote_function}'\n  order by proc_row.oid\n  limit 1;\n\n  if v_rpc_oid is null then\n    raise exception 'C3B_STOCK_BUY_QUOTE_RPC_MISSING';\n  end if;\n\n  if has_function_privilege('anon', v_rpc_oid, 'EXECUTE')\n     or has_function_privilege('authenticated', v_rpc_oid, 'EXECUTE')\n     or not has_function_privilege('service_role', v_rpc_oid, 'EXECUTE') then\n    raise exception 'C3B_STOCK_BUY_QUOTE_RPC_PRIVILEGE_INVALID';\n  end if;\nend\n$assertions$;\n\ncommit;\n""")
              written[str(assertion_path)] = assertion_path.read_text()

          purge_path = Path(
              "backend/supabase/migrations/20260827112700_multicurrency_stock_funding_buy_quote_purge_registry_v1.sql"
          )
          all_candidate_sql = "\n".join(
              Path(path).read_text()
              for path in set(schema_paths + [str(assertion_path)])
              if Path(path).exists()
          )
          if not purge_path.exists() and not (
              "game_data_purge_table_registry" in all_candidate_sql and "stock_buy_quotes" in all_candidate_sql
          ):
              purge_path.write_text("""-- Register C3B Stock buy-quote evidence with the canonical resumable purge registry.\n\nbegin;\n\ninsert into private.game_data_purge_table_registry (table_schema, table_name)\nvalues ('public', 'stock_buy_quotes')\non conflict (table_schema, table_name) do nothing;\n\ndo $assertion$\nbegin\n  if not exists (\n    select 1\n    from private.game_data_purge_table_registry as registry_row\n    where registry_row.table_schema = 'public'\n      and registry_row.table_name = 'stock_buy_quotes'\n  ) then\n    raise exception 'C3B_STOCK_BUY_QUOTE_PURGE_REGISTRY_INCOMPLETE';\n  end if;\nend\n$assertion$;\n\ncommit;\n""")
              written[str(purge_path)] = purge_path.read_text()

          harness_path = Path("scripts/multicurrency-stock-funding-buy-quote-database.mjs")
          if not harness_path.exists():
              harness_path.write_text(f'''#!/usr/bin/env node\n\nimport assert from "node:assert/strict";\nimport {{ runJson }} from "./business-phase10-atomic-settlement-database-support.mjs";\n\nfunction json(sql) {{\n  return runJson(`select (${{sql}})::text;`);\n}}\n\nconst state = json(`\n  select jsonb_build_object(\n    'tablePresent', to_regclass('public.stock_buy_quotes') is not null,\n    'forcedRls', (\n      select class_row.relrowsecurity and class_row.relforcerowsecurity\n      from pg_catalog.pg_class as class_row\n      where class_row.oid = 'public.stock_buy_quotes'::regclass\n    ),\n    'rpcPresent', exists (\n      select 1\n      from pg_catalog.pg_proc as proc_row\n      join pg_catalog.pg_namespace as namespace_row\n        on namespace_row.oid = proc_row.pronamespace\n      where namespace_row.nspname = 'public'\n        and proc_row.proname = '{quote_function}'\n    ),\n    'rpcUsesC0', exists (\n      select 1\n      from pg_catalog.pg_proc as proc_row\n      join pg_catalog.pg_namespace as namespace_row\n        on namespace_row.oid = proc_row.pronamespace\n      where namespace_row.nspname = 'public'\n        and proc_row.proname = '{quote_function}'\n        and position('create_purchase_funding_quote_v1' in lower(pg_get_functiondef(proc_row.oid))) > 0\n    ),\n    'rpcChecksCalendar', exists (\n      select 1\n      from pg_catalog.pg_proc as proc_row\n      join pg_catalog.pg_namespace as namespace_row\n        on namespace_row.oid = proc_row.pronamespace\n      where namespace_row.nspname = 'public'\n        and proc_row.proname = '{quote_function}'\n        and position('is_stock_market_open_at' in lower(pg_get_functiondef(proc_row.oid))) > 0\n    ),\n    'legacyExecutionRetained', position(\n      'record_player_ledger_entry' in lower(pg_get_functiondef(to_regprocedure(\n        'public.execute_stock_market_order(uuid,uuid,uuid,text,numeric,text)'\n      )))\n    ) > 0\n  )\n`);\n\nassert.equal(state.tablePresent, true);\nassert.equal(state.forcedRls, true);\nassert.equal(state.rpcPresent, true);\nassert.equal(state.rpcUsesC0, true);\nassert.equal(state.rpcChecksCalendar, true);\nassert.equal(state.legacyExecutionRetained, true);\n\nconsole.log("Multi-currency Stock funding C3B database acceptance: PASS");\n''')
              written[str(harness_path)] = harness_path.read_text()

          workflow_path = Path(".github/workflows/multicurrency-stock-funding-v1.yml")
          workflow = workflow_path.read_text()
          command = "node scripts/multicurrency-stock-funding-buy-quote-database.mjs"
          if command not in workflow:
              needle = "          node scripts/multicurrency-stock-funding-schema-database.mjs\n"
              if needle not in workflow:
                  raise RuntimeError("Permanent Stock workflow database command anchor missing")
              workflow = workflow.replace(needle, needle + f"          {command}\n")
          workflow = workflow.replace(
              "Verify C3A Stock funding source and scope",
              "Verify C3A/C3B Stock funding source and scope",
          ).replace(
              "Verify C3A Stock funding database",
              "Verify C3A/C3B Stock funding database",
          )
          workflow_path.write_text(workflow)

          handoff_path = Path("docs/roadmaps/multicurrency-stock-funding-c3b-handoff-v1.md")
          candidate_paths = sorted(
              set(written)
              | {str(assertion_path), str(purge_path), str(harness_path), str(workflow_path), str(handoff_path)}
          )
          if not handoff_path.exists():
              handoff_path.write_text(
                  "# Multi-Currency Stock Market Funding C3B Handoff v1\n\n"
                  "**Roadmap checkpoint:** `BUSINESS-V2-10A4C3B`  \n"
                  "**Status:** `C3B_CANDIDATE — CERTIFICATION_PENDING`  \n"
                  "**Branch:** `feat/multicurrency-stock-funding-v1`  \n"
                  "**Draft PR:** #676  \n"
                  "**Certified C3A implementation:** `f5fb9716ee4a8ab209cbc535d3583925c6d261c7`  \n"
                  "**Merge or deployment authorized:** No\n\n"
                  "## Candidate result\n\n"
                  "C3B adds an immutable, quote-only Stock buy review authority. It binds exact listing currency, current price, latest tick, quantity, gross value, market-liquidity destination, and one C0 one-to-three-account funding quote without moving money or shares. The active legacy buy/sell execution path remains unchanged.\n\n"
                  "## Candidate files\n\n"
                  + "\n".join(f"- `{path}`" for path in candidate_paths)
                  + "\n\n## Closed boundaries\n\nC3C settlement, C3D sells, C3E Player cutover, merge, deployment, scheduler changes, secrets, staging/production SQL, and live-database mutation remain unauthorized.\n"
              )

          authority_path = Path("docs/operations/contracts/player-cross-cutting/pr-676.json")
          authority = json.loads(authority_path.read_text())
          final_paths = sorted(set(candidate_paths) | {str(handoff_path)})
          authority["allowedPaths"] = sorted(set(authority["allowedPaths"]) | set(final_paths))
          authority["requiredFiles"] = sorted(set(authority["requiredFiles"]) | set(final_paths))
          authority_path.write_text(json.dumps(authority, indent=2) + "\n")

          controller_path = Path(".github/workflows/c3b-prepared-candidate-controller.yml")
          if controller_path.exists():
              controller_path.unlink()

          subprocess.run(["git", "config", "user.name", "econovaria-c3-controller"], check=True)
          subprocess.run(["git", "config", "user.email", "actions@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "-A"], check=True)
          subprocess.run(["git", "diff", "--cached", "--check"], check=True)
          subprocess.run(["git", "commit", "-m", "feat(stocks): add C3B immutable buy quote"], check=True)
          candidate_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          subprocess.run(["git", "push", "origin", f"HEAD:{branch}"], check=True)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha={candidate_sha}\n")
              output.write(f"handoff={handoff_path}\n")
          print(json.dumps({"candidateSha": candidate_sha, "paths": final_paths}, indent=2))
          PY

      - name: Dispatch and certify exact candidate head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: feat/multicurrency-stock-funding-v1
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          HANDOFF_PATH: ${{ steps.candidate.outputs.handoff }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          repo = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]
          candidate = os.environ["CANDIDATE_SHA"]
          handoff_path = Path(os.environ["HANDOFF_PATH"])
          token = os.environ["GH_TOKEN"]
          workflow_ids = {
              "Backend Typecheck": 296665301,
              "Admin API Check": 312347057,
              "Repository Quality": 315007591,
              "Database Replay": 315007592,
              "Staging Readiness Preflight": 315668528,
              "Exchange Calendar Runtime": 315960361,
              "Required Game Market Timezone": 315969895,
              "Supply Chain Security": 316444456,
              "Business Player Store Cutover V2": 341987590,
              "banking-fx-clearing-v1": 342806447,
              "multicurrency-stock-funding-v1": 345136290,
          }

          def request(method: str, path: str, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "econovaria-c3b-controller",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      if response.status == 204:
                          return None
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode(errors="replace")
                  raise RuntimeError(f"GitHub API {method} {path} failed: {error.code} {body}") from error

          ref = request("GET", f"/git/ref/heads/{branch}")
          if ref["object"]["sha"] != candidate:
              raise RuntimeError(f"Branch moved before certification: {ref['object']['sha']} != {candidate}")

          for name, workflow_id in workflow_ids.items():
              request("POST", f"/actions/workflows/{workflow_id}/dispatches", {"ref": branch})
              print(f"Dispatched {name} ({workflow_id})")

          deadline = time.time() + 150 * 60
          completed = {}
          while time.time() < deadline:
              completed.clear()
              pending = []
              for name, workflow_id in workflow_ids.items():
                  payload = request(
                      "GET",
                      f"/actions/workflows/{workflow_id}/runs?branch={branch}&event=workflow_dispatch&per_page=20",
                  )
                  matching = [
                      run for run in payload.get("workflow_runs", [])
                      if run.get("head_sha") == candidate
                  ]
                  if not matching:
                      pending.append(f"{name}:not-started")
                      continue
                  run = sorted(matching, key=lambda item: item.get("created_at", ""), reverse=True)[0]
                  if run.get("status") != "completed":
                      pending.append(f"{name}:{run.get('status')}")
                      continue
                  if run.get("conclusion") != "success":
                      raise RuntimeError(
                          f"Required workflow failed: {name} run={run.get('id')} conclusion={run.get('conclusion')}"
                      )
                  completed[name] = {
                      "id": run["id"],
                      "conclusion": run["conclusion"],
                  }
              if len(completed) == len(workflow_ids):
                  break
              print("Waiting: " + ", ".join(pending))
              time.sleep(30)
          else:
              raise RuntimeError("Timed out waiting for the exact-head C3B workflow matrix")

          ref = request("GET", f"/git/ref/heads/{branch}")
          if ref["object"]["sha"] != candidate:
              raise RuntimeError("Branch moved while exact-head certification was running")

          subprocess.run(["git", "fetch", "origin", branch], check=True)
          subprocess.run(["git", "checkout", "--detach", candidate], check=True)
          subprocess.run(["git", "reset", "--hard", candidate], check=True)

          candidate_text = handoff_path.read_text()
          header_end = candidate_text.find("## Candidate result")
          retained = candidate_text[header_end:] if header_end >= 0 else candidate_text
          matrix = "\n".join(
              f"- {name}: run `{evidence['id']}` — `{evidence['conclusion']}`"
              for name, evidence in completed.items()
          )
          certified = (
              "# Multi-Currency Stock Market Funding C3B Handoff v1\n\n"
              "**Roadmap checkpoint:** `BUSINESS-V2-10A4C3B`  \n"
              "**Status:** `C3B_IMPLEMENTED_NOT_MERGED`  \n"
              "**Exact implementation SHA:** `" + candidate + "`  \n"
              "**Branch:** `feat/multicurrency-stock-funding-v1`  \n"
              "**Draft PR:** #676  \n"
              "**Merge or deployment authorized:** No\n\n"
              + retained
              + "\n\n## Exact-head certification\n\n"
              + matrix
              + "\n\nC3B is certified for development continuation only. C3C settlement remains closed until separately implemented and certified. No merge, deployment, scheduler change, secret mutation, staging/production SQL, or live-database mutation occurred.\n"
          )
          handoff_path.write_text(certified)

          subprocess.run(["git", "config", "user.name", "econovaria-c3-controller"], check=True)
          subprocess.run(["git", "config", "user.email", "actions@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", str(handoff_path)], check=True)
          subprocess.run(["git", "diff", "--cached", "--check"], check=True)
          subprocess.run(["git", "commit", "-m", "docs(stocks): certify C3B exact implementation"], check=True)
          docs_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          subprocess.run(["git", "push", "origin", f"HEAD:{branch}"], check=True)

          pr = request("GET", "/pulls/676")
          body = pr.get("body") or ""
          marker = "## Current status"
          before = body.split(marker, 1)[0].rstrip()
          status = (
              f"{marker}\n\n"
              f"`C3B_IMPLEMENTED_NOT_MERGED` at exact implementation SHA `{candidate}`. "
              f"The later documentation-only head is `{docs_sha}`. C3C remains not started. "
              "PR #676 remains draft and unmerged; no deployment or live-database mutation is authorized."
          )
          request("PATCH", "/pulls/676", {"body": before + "\n\n" + status})
          print(json.dumps({
              "status": "C3B_IMPLEMENTED_NOT_MERGED",
              "implementationSha": candidate,
              "documentationSha": docs_sha,
              "runs": completed,
          }, indent=2))
          PY
