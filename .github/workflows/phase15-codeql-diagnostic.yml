name: Phase 15 CodeQL Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase15-codeql-diagnostic.yml"
      - ".github/workflows/phase15-controlled-production.yml"
      - "scripts/operations/live-migration-reconciliation/compare-schema-snapshots.mjs"

permissions:
  contents: read
  checks: read

jobs:
  print-codeql-annotation:
    name: Print exact CodeQL annotation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Wait for and print current-head CodeQL annotations
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          check_id=""
          for attempt in $(seq 1 24); do
            check_id="$(curl --fail-with-body --silent --show-error               --header "Authorization: Bearer $GH_TOKEN"               --header "Accept: application/vnd.github+json"               "$api/commits/$HEAD_SHA/check-runs?per_page=100" |
              jq -r '[.check_runs[] | select(.name == "CodeQL" and .output.annotations_count > 0)] | first | .id // empty')"
            if test -n "$check_id"; then
              break
            fi
            sleep 15
          done
          test -n "$check_id"
          curl --fail-with-body --silent --show-error             --header "Authorization: Bearer $GH_TOKEN"             --header "Accept: application/vnd.github+json"             "$api/check-runs/$check_id/annotations" |
            jq '[.[] | {
              path,
              start_line,
              end_line,
              annotation_level,
              title,
              message,
              raw_details
            }]'
