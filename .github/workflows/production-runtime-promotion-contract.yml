name: Production Runtime Promotion Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/production-runtime-promotion-v2.yml"
      - ".github/workflows/production-runtime-promotion-contract.yml"
      - "docs/operations/evidence/production-runtime-promotion-v1.json"
      - "scripts/production-runtime-promotion-contract.test.mjs"

permissions:
  contents: read

jobs:
  verify:
    name: Verify production promotion remains fail-closed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
      - run: node scripts/production-runtime-promotion-contract.test.mjs
      - run: git diff --check
