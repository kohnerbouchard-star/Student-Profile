name: Production Runtime Promotion Contract

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  verify:
    name: Verify production promotion remains fail-closed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out merge candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up exact contract runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify release-integrity and retirement contracts
        run: |
          node --test \
            scripts/release-integrity/index.test.mjs \
            scripts/release-integrity/workflow-contract.test.mjs \
            scripts/production-runtime-promotion-contract.test.mjs

      - name: Verify diff hygiene
        run: git diff --check
