name: Production Runtime Promotion Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - ".npmrc"
      - ".github/workflows/release-integrity.yml"
      - ".github/workflows/production-runtime-promotion-v2.yml"
      - ".github/workflows/production-runtime-promotion-contract.yml"
      - "docs/operations/release-integrity-gates-v1.md"
      - "docs/operations/contracts/release-integrity-expected-differences-v1.json"
      - "scripts/release-integrity/**"
      - "scripts/production-runtime-promotion-contract.test.mjs"

permissions:
  contents: read

jobs:
  verify:
    name: Verify production promotion remains fail-closed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up exact contract runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify release-integrity and retirement contracts
        run: |
          node --test \
            scripts/release-integrity/index.test.mjs \
            scripts/release-integrity/workflow-contract.test.mjs \
            scripts/production-runtime-promotion-contract.test.mjs

      - name: Verify diff hygiene
        run: git diff --check
