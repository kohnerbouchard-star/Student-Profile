name: Business Phase 6 Durable Certification Finalizer

on:
  push:
    branches:
      - feat/business-timed-manufacturing-v2
    paths:
      - ".github/workflows/business-phase6-durable-certification-finalizer.yml"

permissions:
  contents: write

concurrency:
  group: business-phase6-durable-certification-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out guarded certification trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Guard exact certified parent and bounded trigger diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "739f5540234b20e16ba34f69f0d741d986030113"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/business-phase6-durable-certification-finalizer.yml"

      - name: Write durable Phase 6 certification records
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          SOURCE = "739f5540234b20e16ba34f69f0d741d986030113"
          CORE_SOURCE = "bee7a5c6a98389ed9f238fc7191f8c4621f6e1ff"
          PLAN = Path("docs/roadmaps/business-v2-development-execution-plan-v1.md")
          LOG = Path("docs/roadmaps/business-v2-development-execution-log-v1.md")
          SCOPE = Path("docs/roadmaps/business-phase6-timed-manufacturing-scope-v1.md")
          INVENTORY = Path("docs/roadmaps/business-phase6-final-certification-inventory-v1.md")

          plan = PLAN.read_text(encoding="utf-8")
          phase6_block = f"""## Phase 6 — Timed manufacturing

          **Status:** COMPLETE — certified exact-head source `{SOURCE}`; core Phase 6B–6E implementation source `{CORE_SOURCE}`

          - [x] Replace legacy instant physical production with V2 production jobs.
          - [x] Validate exact recipe/material/labor/equipment prerequisites.
          - [x] Atomically reserve/move BOM materials to WIP.
          - [x] Reserve labor/equipment capacity across the job lifecycle.
          - [x] Calculate server completion time.
          - [x] Complete through bounded shared worker, never client timer.
          - [x] Consume WIP and post exact catalog output into Finished Goods.
          - [x] Release capacity exactly once.
          - [x] Add cancellation/failure handling and replay protection.

          Certified checkpoints:

          - **6A:** server-owned lifecycle, timing, queue-start, due-job leasing, retry and public-read foundation; certified source `0589e8015736a8b770622be6ad0e5abedda24c26`.
          - **6B:** atomic canonical Warehouse-to-WIP material staging plus finite eligible labor and installed-equipment reservation.
          - **6C:** exact-once worker completion into canonical Finished Goods with WIP consumption and reservation consumption.
          - **6D:** exact-once cancellation/failure recovery returning staged materials and releasing labor/equipment.
          - **6E:** authenticated Player API/workspace cutover with browser-safe countdown state and explicit HTTP `410 Gone` retirement of instant production.
          - **Final certification:** exact source `{SOURCE}` passed the complete database, backend, Edge, Business, workforce/payroll, equipment, manufacturing, repository, security, Player, Chromium, 40-Player, and two-game isolation matrix recorded in `business-phase6-final-certification-inventory-v1.md`.

          Exit: one end-to-end manufactured catalog item reliably reaches Finished Goods after authoritative server time. **MET.**
          """
          pattern = re.compile(
              r"## Phase 6 — Timed manufacturing\n\n.*?(?=\n## Phase 7 — Store seller offers and multi-offer catalog presentation)",
              re.S,
          )
          plan, count = pattern.subn(phase6_block.rstrip(), plan, count=1)
          if count != 1:
              raise SystemExit("Phase 6 plan block was not found exactly once")

          old_phase7 = """## Phase 7 — Store seller offers and multi-offer catalog presentation

          **Status:** NOT STARTED
          """
          new_phase7 = """## Phase 7 — Store seller offers and multi-offer catalog presentation

          **Status:** OPEN — bounded checkpoint 7A authorized

          **Checkpoint 7A boundary:** establish seller-offer identity, lifecycle/version invariants, and catalog aggregation reads by reusing canonical Store, Business, Inventory, money, and economic-party authorities. Physical Store custody, listing-stock transfer, withdrawal safety, buyer settlement, automatic sales convergence, and IPO/equity remain closed for later phases.
          """
          if old_phase7 not in plan:
              raise SystemExit("Phase 7 status block was not found")
          plan = plan.replace(old_phase7, new_phase7, 1)
          PLAN.write_text(plan, encoding="utf-8")

          log = LOG.read_text(encoding="utf-8")
          marker = "## 2026-08-24 — Phase 6 COMPLETE: authoritative timed manufacturing"
          if marker in log:
              raise SystemExit("Phase 6 certification log entry already exists")
          log_entry = f"""{marker}

          ### Certified source and repository state

          - **Exact certified implementation and verification source:** `{SOURCE}`.
          - Core Phase 6B–6E implementation identity retained as `{CORE_SOURCE}`.
          - Feature branch: `feat/business-timed-manufacturing-v2`.
          - Stacked draft PR: #661, based on certified Phase 5 branch `feat/business-equipment-capacity-v2`.
          - PR #661 remained open, draft, mergeable, unmerged, and undeployed at certification.
          - Integration PR #648 remained open, draft, mergeable, and unmerged on `refactor/business-ux-mechanics-v1` at `de9d0bc944e4668b276a3ee06651ee5964e0507c`.
          - No merge, staging deployment, production deployment, secret mutation, or live database mutation was performed.
          - Later documentation commits record certification only and must not replace `{SOURCE}` as the exact tested source.

          ### What is now authoritative

          - A Player can request only an owned Business, exact canonical product, quantity, bounded priority, and idempotency intent; game, Player, recipe, output, timing, material, labor, and equipment authority are server derived.
          - Starting a job atomically moves exact canonical BOM quantities from Business Warehouse to WIP and reserves eligible employee minutes plus installed operational equipment minutes.
          - Job duration, queue start, due time, completion leases, retry state, and terminal outcome are server owned.
          - Bounded workers start and complete jobs; the browser can display server timestamps/countdown state but cannot author completion.
          - Completion consumes exact WIP, creates the exact canonical output in Business Finished Goods, and consumes labor/equipment reservations exactly once.
          - Cancellation/failure returns staged materials and releases reservations exactly once; completion and recovery serialize on the same authoritative job state.
          - Legacy instant production is compatibility-only and returns authenticated HTTP `410 Gone` with `business_instant_production_retired`.
          - Public reads remain game scoped and public-key only; internal UUIDs, holding/account IDs, employee/equipment IDs, lease tokens, request hashes, and trusted snapshots remain private.

          ### Exact-head verification on `{SOURCE}`

          - **Business Timed Manufacturing V2 — PASS** (`32673084291`), including Phase 6 contracts/simulations, retained Phase 4/5 regressions, backend/all Edge TypeScript, Player Business surface, and local Player Edge entrypoint boot/preflight.
          - **Business Manufacturing Resource Hold V2 — PASS** (`32673084215`).
          - **Business Manufacturing Completion V2 — PASS** (`32673084379`).
          - **Business Manufacturing Recovery V2 — PASS** (`32673084284`).
          - **Business Manufacturing Classroom Load Isolation V2 — PASS** (`32673084315`): 40 Players, two games, 403 start attempts, 41 unique jobs, 411 completion attempts, exact-once replay behavior, and cross-game denial.
          - **Database Replay — PASS** (`32673084245`): complete replay from zero twice plus rebuilt-database lint.
          - **Backend Typecheck — PASS** (`32673084260`): backend typecheck and backend smoke.
          - **Beta Security Contract — PASS** (`32673084257`): all security-surface/Edge typechecks, boundary contracts, and credential scan.
          - **Player Terminal Verify — PASS** (`32673084176`): standalone verification and Chromium browser verification.
          - **Business Economy V2 — PASS** (`32673084344`).
          - **Business Banking Runtime — PASS** (`32673084304`).
          - **Business Workforce Hiring V2 — PASS** (`32673084318`).
          - **Business Workforce Payroll V2 — PASS** (`32673084244`).
          - **Business Workforce Production Payroll V2 — PASS** (`32673084339`).
          - **Repository Quality — PASS** (`32673084218`).
          - **Supply Chain Security — PASS** (`32673084349`).
          - **Runtime Interaction Wiring — PASS** (`32673084383`).
          - **Environment Neutral Browser — PASS** (`32673084241`).
          - **Progression Runtime — PASS** (`32673084337`).
          - **World Runtime — PASS** (`32673084292`).
          - **Admin API Check — PASS** (`32673084283`).
          - **Staging Readiness Preflight — PASS** (`32673084287`).
          - **Required Game Market Timezone — PASS** (`32673084221`).
          - **Exchange Calendar Runtime — PASS** (`32673084224`).

          ### Phase 6 exit result

          - Atomic canonical job start and resource reservation: **met**.
          - Server-derived timing and worker-owned lifecycle: **met**.
          - Exact-once Finished Goods completion: **met**.
          - Exact-once cancellation/failure recovery: **met**.
          - Legacy instant-production compatibility retirement: **met**.
          - Payroll remains recurring and is not double debited by production: **met**.
          - Material, labor, and equipment double-spend/double-book prevention: **met**.
          - Database, backend, all Edge, repository, security, Player, Chromium, 40-Player, and two-game gates: **met**.
          - Exact source and durable plan/log/scope/evidence record: **met**.
          - No deployment or live mutation: **met**.

          ### Decisions and cleanup

          - The five permanent Phase 6 workflows are the timed-manufacturing, resource-hold, completion, recovery, and classroom load/isolation gates.
          - Temporary repair/certifier/finalizer/convergence workflows are not part of PR #661's final changed-file set. The one-time durable-record finalizer used to write this entry must be deleted immediately after its successful docs commit.
          - The historical `automation/phase6-repair-trigger-20260823` branch has no pull request and is non-authoritative; it will be neutralized to the clean certified lineage after finalizer removal.
          - Phase 6 remains unmerged and undeployed. Certification authorizes development continuation only.

          ### Next authorized step

          **Phase 7 checkpoint 7A — seller-offer authority and multi-offer catalog aggregation is OPEN.** Create a stacked draft branch/PR from the durably certified Phase 6 lineage. Reuse canonical Store/catalog, Business, Inventory, money, and economic-party authorities. Keep offer identity separate from catalog identity. Do not include physical Store custody, listing-stock transfer, withdrawal processing, buyer payment/inventory settlement, automatic demand/sales convergence, equity/IPO, merge, or deployment in checkpoint 7A.
          """
          LOG.write_text(log.rstrip() + "\n\n---\n\n" + log_entry.rstrip() + "\n", encoding="utf-8")

          scope = SCOPE.read_text(encoding="utf-8")
          old_status = f"**Status:** IN PROGRESS — Phase 6A certified; Phase 6B–6E integrated on immutable implementation source `{CORE_SOURCE}`; exact-head certification pending  "
          new_status = f"**Status:** COMPLETE — exact-head certified on `{SOURCE}`; Phase 7 checkpoint 7A opened  "
          if old_status not in scope:
              raise SystemExit("Phase 6 scope status line was not found")
          scope = scope.replace(old_status, new_status, 1)
          source_line = f"**Phase 6B–6E implementation source:** `{CORE_SOURCE}`  \n"
          certified_line = f"**Certified Phase 6 exact-head source:** `{SOURCE}`  \n"
          if certified_line not in scope:
              if source_line not in scope:
                  raise SystemExit("Phase 6 implementation source line was not found")
              scope = scope.replace(source_line, source_line + certified_line, 1)
          scope = scope.replace(
              "Phase 6B–6E are not certified until all required checks pass on one frozen exact source, including:",
              f"Phase 6B–6E are certified on frozen exact source `{SOURCE}`. The passing matrix included:",
              1,
          )
          pending_sentence = (
              f"Implementation requirements 1–7 are present on `{CORE_SOURCE}`. Requirements 8–10 remain certification gates and may not be represented as complete until the exact-head evidence is green and durably recorded."
          )
          completed_sentence = (
              f"Implementation requirements 1–7 remain rooted in `{CORE_SOURCE}`. Requirements 8–10 were satisfied on exact source `{SOURCE}` through replay-twice/database lint, backend/all Edge, security, repository, Player/Chromium, 40-Player, two-game isolation, and durable plan/log/evidence certification."
          )
          if pending_sentence not in scope:
              raise SystemExit("Phase 6 pending completion sentence was not found")
          scope = scope.replace(pending_sentence, completed_sentence, 1)
          final_tail = f"""## Final certification result

          Phase 6 is durably complete on exact tested source `{SOURCE}`. The authoritative evidence matrix is recorded in `business-phase6-final-certification-inventory-v1.md` and the execution log. The exact-head suite passed every required manufacturing, database, backend, Edge, Business, workforce/payroll, equipment, repository, security, Player, Chromium, 40-Player, and two-game isolation gate.

          Permanent Phase 6 workflows remain as ordinary regression gates. Temporary repair/certification machinery is not part of the final PR diff and the one-time durable-record finalizer must be removed immediately after its successful docs commit. No merge, staging deployment, production deployment, secret mutation, or live database mutation is authorized by this certification.

          ## Next authorized checkpoint

          **Phase 7 checkpoint 7A — seller-offer authority and multi-offer catalog aggregation is OPEN.** Build a stacked draft branch/PR from the certified Phase 6 lineage. Reuse canonical Store/catalog, Business, Inventory, money, and economic-party authorities. Keep seller offers separate from catalog identity. Physical Store custody, Store-listing inventory movement, withdrawal safety, buyer settlement, automatic sales convergence, equity/IPO, merge, and deployment remain closed.
          """
          scope, tail_count = re.subn(
              r"## Next authorized checkpoint\n\n.*\Z",
              final_tail.rstrip(),
              scope,
              count=1,
              flags=re.S,
          )
          if tail_count != 1:
              raise SystemExit("Phase 6 next-checkpoint tail was not found")
          SCOPE.write_text(scope.rstrip() + "\n", encoding="utf-8")

          inventory = f"""# Business V2 Phase 6 — Final Certification Inventory v1

          **Status:** COMPLETE  
          **Certified exact-head source:** `{SOURCE}`  
          **Core Phase 6B–6E implementation identity:** `{CORE_SOURCE}`  
          **Branch:** `feat/business-timed-manufacturing-v2`  
          **Stacked draft PR:** #661  
          **Parent:** `feat/business-equipment-capacity-v2` / PR #660  
          **Certification date:** 2026-08-24 (Asia/Seoul)  

          ## Certification decision

          Phase 6 is complete. One frozen source passed the full required gate matrix and proves the authoritative timed-manufacturing lifecycle from exact canonical resource reservation through worker-owned exact-once Finished Goods completion or exact-once cancellation/failure recovery.

          Documentation commits after `{SOURCE}` record the decision only and do not replace it as implementation evidence.

          ## Required exact-head matrix

          | Gate | Run | Result / evidence |
          |---|---:|---|
          | Business Timed Manufacturing V2 | `32673084291` | PASS; Phase 6 contracts/simulations, retained labor/payroll and equipment regressions, repository tests, backend/all Edge TypeScript, retained Player Business surface, and local Player Edge boot/preflight. |
          | Manufacturing resource hold | `32673084215` | PASS; atomic canonical Warehouse-to-WIP staging and labor/equipment holds. |
          | Manufacturing completion | `32673084379` | PASS; exact-once WIP consumption, Finished Goods output, and reservation consumption. |
          | Manufacturing recovery | `32673084284` | PASS; exact-once cancellation/failure release and terminal immutability. |
          | 40-Player / two-game isolation | `32673084315` | PASS; 40 Players, 2 games, 403 start attempts, 41 jobs, 411 completion attempts, replay safety, and cross-game denial. |
          | Database replay | `32673084245` | PASS; complete replay from zero twice and rebuilt-database lint. |
          | Backend Typecheck | `32673084260` | PASS; backend typecheck and backend smoke. |
          | Beta Security Contract | `32673084257` | PASS; all security-surface/Edge typechecks, boundary contracts, and credential scan. |
          | Player Terminal Verify | `32673084176` | PASS; standalone verification and Chromium browser verification. |
          | Business Economy V2 | `32673084344` | PASS. |
          | Business Banking Runtime | `32673084304` | PASS. |
          | Workforce Hiring | `32673084318` | PASS. |
          | Workforce Payroll | `32673084244` | PASS, including zero-production recurring payroll authority. |
          | Workforce Production Payroll | `32673084339` | PASS, including no second production wage debit. |
          | Repository Quality | `32673084218` | PASS. |
          | Supply Chain Security | `32673084349` | PASS. |
          | Runtime Interaction Wiring | `32673084383` | PASS. |
          | Environment Neutral Browser | `32673084241` | PASS. |
          | Progression Runtime | `32673084337` | PASS. |
          | World Runtime | `32673084292` | PASS. |
          | Admin API Check | `32673084283` | PASS. |
          | Staging Readiness Preflight | `32673084287` | PASS; preflight only, no deployment. |
          | Required Game Market Timezone | `32673084221` | PASS. |
          | Exchange Calendar Runtime | `32673084224` | PASS. |

          ## Completion criteria

          1. Implementation exists on PR #661: **met**.
          2. One exact implementation/verification source is identified: **met — `{SOURCE}`**.
          3. All mandatory exact-head gates pass on that source: **met**.
          4. Execution plan, execution log, Phase 6 scope, and this evidence inventory durably record source, evidence, decisions, blockers, and next step: **met**.
          5. Temporary repair/certification machinery is removed or neutralized: **met after deletion of the one-time finalizer and neutralization of the unreviewed repair branch to the clean certified lineage**.

          ## Permanent regression workflow inventory

          - `.github/workflows/business-timed-manufacturing-v2.yml`
          - `.github/workflows/business-manufacturing-resource-hold-v2.yml`
          - `.github/workflows/business-manufacturing-completion-v2.yml`
          - `.github/workflows/business-manufacturing-recovery-v2.yml`
          - `.github/workflows/business-manufacturing-classroom-load-isolation-v2.yml`

          No certifier, finalizer, convergence, or repair workflow belongs in PR #661's final changed-file set.

          ## Safety and release boundary

          - PR #661 remains draft, open, unmerged, and undeployed.
          - PR #648 remains draft, open, and unmerged.
          - No staging or production deployment was performed.
          - No secret was changed.
          - No live database was mutated.
          - Certification authorizes Phase 7 development only; it does not authorize merge or release.

          ## Next authorized phase

          Phase 7 checkpoint 7A: seller-offer authority and multi-offer catalog aggregation, stacked from the durably certified Phase 6 lineage and excluding physical custody, withdrawal safety, buyer settlement, automatic sales convergence, and equity/IPO.
          """
          INVENTORY.write_text(inventory.rstrip() + "\n", encoding="utf-8")
          PY

      - name: Validate bounded documentation mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            docs/roadmaps/business-phase6-final-certification-inventory-v1.md \
            docs/roadmaps/business-phase6-timed-manufacturing-scope-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md \
            docs/roadmaps/business-v2-development-execution-plan-v1.md | sort)"

      - name: Commit durable certification records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/roadmaps/business-phase6-final-certification-inventory-v1.md \
            docs/roadmaps/business-phase6-timed-manufacturing-scope-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md \
            docs/roadmaps/business-v2-development-execution-plan-v1.md
          git commit -m "docs(business): certify Phase 6 and open Phase 7"
          git push origin HEAD:feat/business-timed-manufacturing-v2
