name: Business Phase 8A PR Finalizer

# One-time certification writer for the frozen Phase 8A implementation SHA.
on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/business-phase8a-durable-finalizer.yml"
      - ".github/workflows/business-phase8a-pr-finalizer.yml"

permissions:
  contents: write

concurrency:
  group: business-phase8a-pr-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 663 &&
      github.event.pull_request.head.ref == 'feat/business-store-listing-inventory-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact Phase 8A branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/business-store-listing-inventory-v2
          fetch-depth: 0

      - name: Verify frozen certified implementation lineage
        shell: bash
        run: |
          set -euo pipefail
          IMPLEMENTATION_SHA="c0fd8650987a332f99b8173395dcf84fc3518c15"
          git merge-base --is-ancestor "$IMPLEMENTATION_SHA" HEAD
          test -z "$(git diff --name-only "$IMPLEMENTATION_SHA" HEAD -- . \
            ':(exclude).github/workflows/business-phase8a-durable-finalizer.yml' \
            ':(exclude).github/workflows/business-phase8a-pr-finalizer.yml')"

      - name: Execute durable-record transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEXTRACT'
          from pathlib import Path

          source = Path('.github/workflows/business-phase8a-durable-finalizer.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 - <<'PY'")
          end = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'PY')
          body = []
          for line in source[start + 1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/business-phase8a-finalize.py').write_text('\n'.join(body) + '\n')
          PYEXTRACT
          python3 /tmp/business-phase8a-finalize.py
          python3 - <<'PYFORMAT'
          from pathlib import Path

          log_path = Path('docs/roadmaps/business-v2-development-execution-log-v1.md')
          log_path.write_text(log_path.read_text().rstrip() + '\n')
          PYFORMAT
          git diff --check

      - name: Commit durable records and remove temporary finalizers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "econovaria-automation"
          git config user.email "econovaria-automation@users.noreply.github.com"
          git rm \
            .github/workflows/business-phase8a-durable-finalizer.yml \
            .github/workflows/business-phase8a-pr-finalizer.yml
          git add \
            docs/roadmaps/business-phase8-store-listing-inventory-scope-v1.md \
            docs/roadmaps/business-v2-development-execution-plan-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md
          git diff --cached --quiet && { echo "No durable record changes were produced." >&2; exit 1; }
          git commit -m "docs(business): certify Phase 8A Store-listing inventory"
          git push origin HEAD:feat/business-store-listing-inventory-v2
