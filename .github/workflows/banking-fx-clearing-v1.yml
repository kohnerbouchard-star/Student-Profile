name: banking-fx-clearing-v1

on:
  pull_request:
    paths:
      - .github/workflows/banking-fx-clearing-v1.yml
      - backend/package.json
      - backend/src/domains/banking-fx/**
      - backend/src/domains/economy/**
      - backend/src/domains/fx/**
      - backend/src/domains/players/**
      - backend/src/security/**
      - backend/supabase/**
      - docs/operations/contracts/player-cross-cutting/pr-672.json
      - docs/operations/contracts/player-cross-cutting/pr-673.json
      - docs/roadmaps/banking-fx-clearing-scope-v1.md
      - docs/roadmaps/multicurrency-funding-core-scope-v1.md
      - player-terminal/**
      - scripts/banking-fx-*.mjs
      - scripts/banking-fx-*.sql
      - scripts/business-phase10-atomic-settlement-database-support.mjs
      - scripts/local-edge-runtime-contract.test.mjs
      - scripts/player-cross-cutting-authority.test.mjs
      - scripts/verify-player-cross-cutting-authority.mjs
  push:
    branches:
      - feat/banking-fx-clearing-v1
    paths:
      - .github/workflows/banking-fx-clearing-v1.yml
      - backend/package.json
      - backend/supabase/**
      - docs/operations/contracts/player-cross-cutting/pr-672.json
      - player-terminal/**
      - scripts/banking-fx-*.mjs
      - scripts/banking-fx-*.sql
      - scripts/business-phase10-atomic-settlement-database-support.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: banking-fx-clearing-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Certify Banking FX clearing source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          npm ci --ignore-scripts
          npm ci --prefix backend --ignore-scripts

      - name: Run Banking FX certification lanes
        shell: bash
        env:
          AUTHORITY_PR_NUMBER: ${{ github.event.pull_request.number || 672 }}
          AUTHORITY_BASE_REF: ${{ github.event.pull_request.base.ref || 'feat/canonical-fx-authority-v1' }}
        run: |
          set -euo pipefail
          node --test scripts/player-cross-cutting-authority.test.mjs
          git diff --name-only "origin/${AUTHORITY_BASE_REF}...HEAD" | sort -u > /tmp/player-cross-cutting-changed-files.txt
          node scripts/verify-player-cross-cutting-authority.mjs \
            --changed-files /tmp/player-cross-cutting-changed-files.txt \
            --pr-number "${AUTHORITY_PR_NUMBER}" \
            --base-ref "${AUTHORITY_BASE_REF}"
          node --check scripts/business-phase10-atomic-settlement-database-support.mjs
          npm run --prefix backend test:banking-fx-clearing
          node scripts/validate-supabase-migrations.mjs
          node scripts/local-edge-runtime-contract.test.mjs
          git diff --check

  database-acceptance:
    name: Verify Banking FX database acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install pinned tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          npm ci --ignore-scripts

      - name: Start disposable Postgres service
        shell: bash
        run: |
          set -euo pipefail
          LOG="/tmp/banking-fx-database-startup.log"
          : > "$LOG"
          STATUS=1
          EXCLUDED="studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,gotrue,postgrest,realtime,kong,mailpit,postgres-meta"
          for ATTEMPT in 1 2 3; do
            printf '\n## Supabase Postgres startup attempt %s\n' "$ATTEMPT" | tee -a "$LOG"
            set +e
            npx supabase start --workdir backend --exclude "$EXCLUDED" 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            npx supabase status --workdir backend 2>&1 | tee -a "$LOG" || true
            npx supabase stop --workdir backend --no-backup 2>&1 | tee -a "$LOG" || true
            sleep $((ATTEMPT * 10))
          done
          exit "$STATUS"

      - name: Rebuild database from zero
        run: npx supabase db reset --workdir backend --local

      - name: Run Banking FX database acceptance
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/banking-fx-database-acceptance.mjs

      - name: Lint rebuilt database
        run: npx supabase db lint --workdir backend --local --level warning

      - name: Capture disposable diagnostics
        if: failure()
        shell: bash
        run: |
          npx supabase status --workdir backend 2>&1 | tee -a /tmp/banking-fx-database-status.log || true
          docker ps -a 2>&1 | tee -a /tmp/banking-fx-database-docker.log || true
          docker system df 2>&1 | tee -a /tmp/banking-fx-database-docker.log || true

      - name: Upload disposable diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: banking-fx-database-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/banking-fx-database-startup.log
            /tmp/banking-fx-database-status.log
            /tmp/banking-fx-database-docker.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop disposable stack
        if: always()
        run: npx supabase stop --workdir backend --no-backup || true

  chromium-acceptance:
    name: Verify Banking FX Chromium acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: player-terminal/package-lock.json

      - name: Install Player Terminal dependencies
        working-directory: player-terminal
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: player-terminal
        run: npx playwright install --with-deps chromium

      - name: Materialize browser-only runtime fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p player-terminal/frontend/src/core
          cp frontend/src/core/runtime-config.js player-terminal/frontend/src/core/runtime-config.js
          cat > player-terminal/runtime-config.env.js <<'EOF'
          window.__ECONOVARIA_RUNTIME_CONFIG__ = Object.freeze({
            environment: "development",
            projectRef: "runtimefixture123456",
            supabaseUrl: "https://runtimefixture123456.supabase.co",
            supabasePublishableKey: "sb_publishable_runtime_fixture_1234567890"
          });
          EOF

      - name: Run Chromium browser verification
        id: banking-fx-chromium
        working-directory: player-terminal
        shell: bash
        run: |
          set -o pipefail
          npm run browser 2>&1 | tee "$RUNNER_TEMP/banking-fx-chromium.log"

      - name: Upload failed Chromium artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: banking-fx-chromium-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/banking-fx-chromium.log
            player-terminal/playwright-report/
            player-terminal/test-results/
          if-no-files-found: warn
          retention-days: 14
