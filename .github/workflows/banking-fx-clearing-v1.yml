name: banking-fx-clearing-v1

on:
  pull_request:
    paths:
      - .github/workflows/banking-fx-clearing-v1.yml
      - backend/package.json
      - backend/src/domains/banking-fx/**
      - backend/src/domains/economy/**
      - backend/src/domains/fx/**
      - backend/src/domains/players/**
      - backend/src/security/**
      - backend/supabase/**
      - docs/operations/contracts/player-cross-cutting/pr-672.json
      - docs/roadmaps/banking-fx-clearing-scope-v1.md
      - player-terminal/**
      - scripts/banking-fx-*.mjs
      - scripts/banking-fx-*.sql
      - scripts/business-phase10-atomic-settlement-database-support.mjs
      - scripts/local-edge-runtime-contract.test.mjs
      - scripts/player-cross-cutting-authority.test.mjs
      - scripts/verify-player-cross-cutting-authority.mjs
  push:
    branches:
      - feat/banking-fx-clearing-v1
    paths:
      - .github/workflows/banking-fx-clearing-v1.yml
      - backend/package.json
      - docs/operations/contracts/player-cross-cutting/pr-672.json
      - scripts/business-phase10-atomic-settlement-database-support.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: banking-fx-clearing-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    name: Certify Banking FX clearing source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          npm ci --ignore-scripts
          npm ci --prefix backend --ignore-scripts

      - name: Run Banking FX certification lanes
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/player-cross-cutting-authority.test.mjs
          git diff --name-only origin/feat/canonical-fx-authority-v1...HEAD | sort -u > /tmp/player-cross-cutting-changed-files.txt
          node scripts/verify-player-cross-cutting-authority.mjs \
            --changed-files /tmp/player-cross-cutting-changed-files.txt \
            --pr-number 672 \
            --base-ref feat/canonical-fx-authority-v1
          node --check scripts/business-phase10-atomic-settlement-database-support.mjs
          npm run --prefix backend test:banking-fx-clearing
          node scripts/validate-supabase-migrations.mjs
          node scripts/local-edge-runtime-contract.test.mjs
          git diff --check
