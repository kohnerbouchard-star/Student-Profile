name: Temporary Admin Auth Email Readiness

on:
  push:
    branches:
      - feat/branded-supabase-auth-emails-v1
    paths:
      - ".github/workflows/admin-auth-email-readiness-temp.yml"

permissions:
  contents: read

concurrency:
  group: admin-auth-email-readiness-temp
  cancel-in-progress: false

env:
  EXPECTED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny

jobs:
  inspect:
    name: Inspect SMTP and Resend readiness without exposing secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ECONOVARIA_AUTH_EMAIL_FROM: ${{ secrets.ECONOVARIA_AUTH_EMAIL_FROM }}
    steps:
      - name: Check out exact feature source
        uses: actions/checkout@v6
        with:
          ref: feat/branded-supabase-auth-emails-v1
          persist-credentials: false

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Inspect sanitized readiness state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"

          github_resend=false
          github_sender=false
          [[ -n "$RESEND_API_KEY" ]] && github_resend=true
          [[ -n "$ECONOVARIA_AUTH_EMAIL_FROM" ]] && github_sender=true

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_PROJECT_REF/config/auth" \
            > "$RUNNER_TEMP/auth-config.json"

          smtp_configured="$(jq -r '
            (((.smtp_host // "") | length > 0) and
             ((.smtp_user // "") | length > 0) and
             ((.smtp_admin_email // "") | length > 0))
          ' "$RUNNER_TEMP/auth-config.json")"

          supabase secrets list \
            --project-ref "$EXPECTED_STAGING_PROJECT_REF" \
            --output json \
            > "$RUNNER_TEMP/edge-secrets.json"

          edge_resend="$(jq -r '
            (if type == "array" then .
             elif (.secrets? | type) == "array" then .secrets
             else [] end)
            | map(.name // .key // "")
            | index("RESEND_API_KEY") != null
          ' "$RUNNER_TEMP/edge-secrets.json")"
          edge_sender="$(jq -r '
            (if type == "array" then .
             elif (.secrets? | type) == "array" then .secrets
             else [] end)
            | map(.name // .key // "")
            | index("ECONOVARIA_AUTH_EMAIL_FROM") != null
          ' "$RUNNER_TEMP/edge-secrets.json")"

          resend_domain_status="unavailable"
          resend_domain_match=false
          resend_click_tracking="unknown"
          if [[ "$github_resend" == "true" && "$github_sender" == "true" ]]; then
            sender_email="$(printf '%s' "$ECONOVARIA_AUTH_EMAIL_FROM" | sed -n 's/.*<\([^<>[:space:]]*@[^<>[:space:]]*\)>.*/\1/p')"
            [[ -n "$sender_email" ]] || sender_email="$ECONOVARIA_AUTH_EMAIL_FROM"
            sender_domain="${sender_email##*@}"
            domain_http="$(curl --silent --show-error \
              -o "$RUNNER_TEMP/resend-domains.json" \
              -w "%{http_code}" \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              "https://api.resend.com/domains")"
            if [[ "$domain_http" == "200" ]]; then
              domain_row="$(jq -c --arg domain "$sender_domain" '
                (.data // []) | map(select((.name // "") == $domain)) | first // null
              ' "$RUNNER_TEMP/resend-domains.json")"
              if [[ "$domain_row" != "null" ]]; then
                resend_domain_match=true
                resend_domain_status="$(jq -r '.status // "unknown"' <<<"$domain_row")"
                resend_click_tracking="$(jq -r 'if has("click_tracking") then .click_tracking else "unknown" end' <<<"$domain_row")"
              else
                resend_domain_status="missing"
              fi
            else
              resend_domain_status="api_http_${domain_http}"
            fi
          fi

          jq -n \
            --arg projectRef "$EXPECTED_STAGING_PROJECT_REF" \
            --argjson smtpConfigured "$smtp_configured" \
            --argjson githubResendSecret "$github_resend" \
            --argjson githubSenderSecret "$github_sender" \
            --argjson edgeResendSecret "$edge_resend" \
            --argjson edgeSenderSecret "$edge_sender" \
            --argjson resendDomainMatch "$resend_domain_match" \
            --arg resendDomainStatus "$resend_domain_status" \
            --arg resendClickTracking "$resend_click_tracking" \
            '{
              schemaVersion: 1,
              environment: "staging",
              projectRef: $projectRef,
              smtpConfigured: $smtpConfigured,
              githubEnvironment: {
                resendApiKeyPresent: $githubResendSecret,
                senderPresent: $githubSenderSecret
              },
              supabaseEdgeSecrets: {
                resendApiKeyPresent: $edgeResendSecret,
                senderPresent: $edgeSenderSecret
              },
              resend: {
                senderDomainPresent: $resendDomainMatch,
                senderDomainStatus: $resendDomainStatus,
                clickTracking: $resendClickTracking
              }
            }' > "$RUNNER_TEMP/auth-email-readiness.json"

          cat "$RUNNER_TEMP/auth-email-readiness.json"
          rm -f \
            "$RUNNER_TEMP/auth-config.json" \
            "$RUNNER_TEMP/edge-secrets.json" \
            "$RUNNER_TEMP/resend-domains.json"

      - name: Upload sanitized readiness evidence
        uses: actions/upload-artifact@v6
        with:
          name: admin-auth-email-readiness-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/auth-email-readiness.json
