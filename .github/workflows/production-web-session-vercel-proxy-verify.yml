name: Production Web Session Vercel Proxy Verify

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/production-web-session-vercel-proxy-verify.yml"
      - "api/_canonical-bff-path.js"
      - "api/_admin-bff-proxy.js"
      - "api/admin-session/**"
      - "api/admin/**"
      - "scripts/vercel-auth-proxy-contract.test.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-web-session-vercel-proxy-verify.yml"
      - "api/_canonical-bff-path.js"
      - "api/_admin-bff-proxy.js"
      - "api/admin-session/**"
      - "api/admin/**"
      - "scripts/vercel-auth-proxy-contract.test.mjs"

  workflow_dispatch:
    inputs:
      source_commit:
        description: "Exact current main SHA reviewed for the production route probe"
        required: true
        type: string
      confirm_origin:
        description: "Type the exact PRODUCTION_ORIGIN value from this reviewed workflow"
        required: true
        type: string
      confirm_action:
        description: "Type PROBE PRODUCTION ADMIN SESSION ROUTE"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-web-session-vercel-proxy-${{ github.ref }}
  cancel-in-progress: false

env:
  PRODUCTION_ORIGIN: https://econovaria.vercel.app
  STATUS_CONTEXT: econovaria/vercel-admin-session-route

jobs:
  authorize_production_probe:
    name: Authorize scoped production route probe
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Enforce explicit production probe authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "${{ inputs.source_commit }}" =~ ^[a-f0-9]{40}$ ]]
          test "${{ inputs.source_commit }}" = "$GITHUB_SHA"
          test "${{ inputs.confirm_origin }}" = "$PRODUCTION_ORIGIN"
          test "${{ inputs.confirm_action }}" = "PROBE PRODUCTION ADMIN SESSION ROUTE"

  publish_pending:
    name: Publish production route verification location
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs:
      - authorize_production_probe
      - validate
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish pending commit status
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD_PATH: ${{ runner.temp }}/status.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = {
            state: 'pending',
            target_url: process.env.RUN_URL,
            description: 'Production Admin session route verification is running.',
            context: process.env.STATUS_CONTEXT,
          };
          fs.writeFileSync(process.env.PAYLOAD_PATH, JSON.stringify(payload));
          NODE
          curl --fail --silent --show-error \
            --request POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary "@$PAYLOAD_PATH" > /dev/null
          rm -f "$PAYLOAD_PATH"

  validate:
    name: Validate canonical Admin BFF routing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install pinned repository tooling
        run: npm ci

      - name: Validate route modules
        run: |
          node --check api/_canonical-bff-path.js
          node --check api/_admin-bff-proxy.js
          node --check 'api/admin-session/[...path].js'
          node --check 'api/admin/[...path].js'

      - name: Run Vercel Admin proxy contracts
        run: node --test scripts/vercel-auth-proxy-contract.test.mjs

      - name: Validate observable verification contract
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const workflow = fs.readFileSync(
            '.github/workflows/production-web-session-vercel-proxy-verify.yml',
            'utf8',
          );
          for (const required of [
            'econovaria/vercel-admin-session-route',
            'api/admin-session/**',
            'api/admin/**',
            'Publish pending commit status',
            'Publish terminal commit status',
            'publish_pending',
            'verify_production',
            'publish_final',
          ]) {
            if (!workflow.includes(required)) {
              throw new Error(`Observable production verification contract missing: ${required}`);
            }
          }

          const dispatchTrigger = ['workflow_', 'dispatch:'].join('');
          const dispatchExpression = ['github.event_name', " == 'workflow_dispatch'"].join('');
          const forbiddenPushExpression = ['github.event_name', " == 'push'"].join('');
          const productionEnvironment = ['environment', ': production'].join('');
          const statusWrite = ['statuses', ': write'].join('');
          const actionPhrase = ['PROBE PRODUCTION', ' ADMIN SESSION ROUTE'].join('');
          const originInput = ['confirm_', 'origin:'].join('');

          if (workflow.split(dispatchTrigger).length - 1 < 1) {
            throw new Error('Manual production probe trigger is missing.');
          }
          if (workflow.split(dispatchExpression).length - 1 < 4) {
            throw new Error('A live production job is not restricted to manual dispatch.');
          }
          if (workflow.includes(forbiddenPushExpression)) {
            throw new Error('Live production verification must not run from ordinary push activity.');
          }
          if (workflow.split(productionEnvironment).length - 1 !== 1) {
            throw new Error('Production environment approval gate drifted.');
          }
          if (workflow.split(statusWrite).length - 1 !== 2) {
            throw new Error('Commit-status write permission must remain scoped to the two publisher jobs.');
          }
          if (!workflow.includes(actionPhrase) || !workflow.includes(originInput)) {
            throw new Error('Explicit production probe confirmation inputs are missing.');
          }

          const probeNeedle = ['--request POST "', '$PRODUCTION_ORIGIN/api/admin-session/login"'].join('');
          if (workflow.split(probeNeedle).length - 1 !== 1) {
            throw new Error('Production Admin route probe count drifted from one bounded verifier.');
          }
          NODE

  verify_production:
    name: Verify deployed Vercel Admin session route
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs:
      - publish_pending
      - validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Wait for controlled production proxy response
        shell: bash
        env:
          INVALID_PATH: ${{ runner.temp }}/vercel-invalid.json
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            status="$(curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --output "$INVALID_PATH" \
              --write-out '%{http_code}' \
              --request POST "$PRODUCTION_ORIGIN/api/admin-session/login" \
              -H "Origin: $PRODUCTION_ORIGIN" \
              -H "Content-Type: application/json" \
              --data '{}')"

            if [[ "$status" == "400" ]] && node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.env.INVALID_PATH, 'utf8'));
          const code = String(body?.error?.code || '');
          const forbidden = new Set([
            '',
            'route_not_found',
            'web_session_failed',
            'WORKER_ERROR',
            'admin_bff_unavailable',
          ]);
          if (forbidden.has(code)) process.exit(1);
          NODE
            then
              rm -f "$INVALID_PATH"
              exit 0
            fi

            if [[ "$attempt" == "72" ]]; then
              echo "Unexpected Vercel proxy status after deployment window: $status" >&2
              cat "$INVALID_PATH" >&2 || true
              exit 1
            fi
            sleep 10
          done

      - name: Record bounded production proxy evidence
        shell: bash
        run: |
          {
            echo '## Production Admin BFF route verified'
            echo '- Endpoint: `/api/admin-session/login`'
            echo '- Controlled invalid-input response: `400`'
            echo '- Route-not-found response: `rejected`'
            echo '- Supabase deployment performed: `false`'
            echo '- Credential or account mutation requested: `false`'
            echo '- Request-protection nonce database effects: `possible (claim/expiry cleanup)`'
          } >> "$GITHUB_STEP_SUMMARY"

  publish_final:
    name: Publish production route verification result
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.authorize_production_probe.result == 'success' }}
    needs:
      - authorize_production_probe
      - publish_pending
      - validate
      - verify_production
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish terminal commit status
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD_PATH: ${{ runner.temp }}/status.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PENDING_RESULT: ${{ needs.publish_pending.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          VERIFY_RESULT: ${{ needs.verify_production.result }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const succeeded =
            process.env.PENDING_RESULT === 'success' &&
            process.env.VALIDATE_RESULT === 'success' &&
            process.env.VERIFY_RESULT === 'success';
          const detail = succeeded
            ? 'Production Admin session route verification passed.'
            : `Production route verification failed: pending=${process.env.PENDING_RESULT}, validate=${process.env.VALIDATE_RESULT}, verify=${process.env.VERIFY_RESULT}.`;
          const payload = {
            state: succeeded ? 'success' : 'failure',
            target_url: process.env.RUN_URL,
            description: detail.slice(0, 140),
            context: process.env.STATUS_CONTEXT,
          };
          fs.writeFileSync(process.env.PAYLOAD_PATH, JSON.stringify(payload));
          NODE
          curl --fail --silent --show-error \
            --request POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary "@$PAYLOAD_PATH" > /dev/null
          rm -f "$PAYLOAD_PATH"
