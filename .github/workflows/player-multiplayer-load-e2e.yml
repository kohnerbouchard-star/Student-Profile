name: Player Multiplayer and Load E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main, agent/pr377-validation-base]
    paths:
      - ".github/workflows/player-multiplayer-load-e2e.yml"
      - "index.html"
      - "frontend/src/core/**"
      - "player-terminal/**"
      - "backend/src/domains/players/**"
      - "backend/src/domains/game-dashboard/**"
      - "backend/src/domains/countries/**"
      - "backend/src/domains/world/**"
      - "backend/src/domains/economy/**"
      - "backend/src/domains/inventory/**"
      - "backend/src/domains/contracts/**"
      - "backend/src/domains/stocks/**"
      - "backend/src/domains/progression/**"
      - "backend/src/security/**"
      - "backend/supabase/config.toml"
      - "backend/supabase/functions/**"
      - "backend/supabase/migrations/**"
      - "scripts/player-multiplayer-browser-acceptance.mjs"
      - "scripts/player-connected-mutation-browser-acceptance.mjs"
      - "scripts/business-banking-player-state-controls-browser-acceptance.mjs"
      - "scripts/business-banking-player-commerce-browser-acceptance.mjs"
      - "scripts/business-banking-player-business-browser-acceptance.mjs"
      - "scripts/business-banking-player-world-browser-acceptance.mjs"
      - "scripts/player-contracts-browser-acceptance.mjs"
      - "scripts/business-banking-player-inventory-browser-acceptance.mjs"
      - "scripts/business-banking-player-market-browser-acceptance.mjs"
      - "scripts/player-runtime-load-profile.mjs"
      - "scripts/econovaria-local-gateway.py"
      - "scripts/local-staging-gateway-contract.test.mjs"
      - "scripts/game-creation-provisioning-local-acceptance.mjs"
      - "scripts/build-physical-economy-runtime-pack.mjs"
      - "docs/operations/contracts/beta-seed-downstream-consumer-contract-v1.json"
      - "docs/seed-content/executable/beta-pack-v1/**"

permissions:
  contents: read

concurrency:
  group: player-multiplayer-load-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  connected-player-runtime:
    name: Two-browser Player journey, secure mutations, and 30-40 Player load
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PHYSICAL_ECONOMY_PACK: /tmp/physical-economy-runtime-pack.json
      ECONOVARIA_BROWSER_BASE_URL: http://127.0.0.1:4173
      ECONOVARIA_PLAYER_BROWSER_OUTPUT_DIR: /tmp/econovaria-player-browser
      ECONOVARIA_PLAYER_LOAD_OUTPUT_DIR: /tmp/econovaria-player-load
      ECONOVARIA_BROWSER_LICENSE_CODE: PLAYER-E2E-LICENSE-001
      ECONOVARIA_BROWSER_ADMIN_EMAIL: player.e2e@example.test
      ECONOVARIA_BROWSER_ADMIN_PASSWORD: Player-E2E-Admin-2026!
      ECONOVARIA_BROWSER_GAME_NAME: Player Multiplayer E2E
      ECONOVARIA_GATEWAY_REQUEST_TIMEOUT_SECONDS: "180"
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install pinned tooling and Chromium
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          npm ci
          node --check scripts/player-multiplayer-browser-acceptance.mjs
          node --check scripts/player-connected-mutation-browser-acceptance.mjs
          node --check scripts/business-banking-player-state-controls-browser-acceptance.mjs
          node --check scripts/business-banking-player-commerce-browser-acceptance.mjs
          node --check scripts/business-banking-player-business-browser-acceptance.mjs
          node --check scripts/business-banking-player-world-browser-acceptance.mjs
          node --check scripts/player-contracts-browser-acceptance.mjs
          node --check scripts/business-banking-player-inventory-browser-acceptance.mjs
          node --check scripts/business-banking-player-market-browser-acceptance.mjs
          node --check scripts/player-runtime-load-profile.mjs
          python3 -m py_compile scripts/econovaria-local-gateway.py
          node --test scripts/local-staging-gateway-contract.test.mjs
          python3 - <<'PY'
          import importlib.util
          import sys
          from email.message import Message
          from pathlib import Path

          path = Path("scripts/econovaria-local-gateway.py")
          spec = importlib.util.spec_from_file_location("econovaria_gateway", path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          headers = Message()
          headers["apikey"] = "sb_publishable_contract_test"
          headers["authorization"] = "Bearer sb_publishable_contract_test"
          headers["cf-connecting-ip"] = "203.0.113.10"
          headers["x-real-ip"] = "203.0.113.11"
          headers["x-forwarded-for"] = "203.0.113.12"
          filtered = module.filtered_request_headers(
              headers,
              "127.0.0.1:54321",
              browser_publishable_key="sb_publishable_contract_test",
          )
          assert filtered["x-real-ip"] == "127.0.0.1"
          assert "authorization" not in {name.lower() for name in filtered}
          assert "cf-connecting-ip" not in {name.lower() for name in filtered}
          assert "x-forwarded-for" not in {name.lower() for name in filtered}
          PY
          npx playwright install --with-deps chromium

      - name: Build exact authorized Crafting pack
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const contract = JSON.parse(await readFile(
            "docs/operations/contracts/beta-seed-downstream-consumer-contract-v1.json",
            "utf8",
          ));
          process.stdout.write(contract.acceptedImplementationSourceSha);
          NODE
          )"
          node scripts/build-physical-economy-runtime-pack.mjs \
            --source-root . \
            --source-commit "$SOURCE_COMMIT" \
            --approved-source-commit "$SOURCE_COMMIT" \
            --output "$PHYSICAL_ECONOMY_PACK"

      - name: Start local Supabase Player stack
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/player-runtime-supabase-startup.log
          : > "$LOG"
          mkdir -p backend/supabase/functions
          {
            node -e "process.stdout.write('ECONOVARIA_RATE_LIMIT_HMAC_SECRET=' + require('node:crypto').randomBytes(48).toString('base64url') + '\n')"
            node -e "process.stdout.write('ECONOVARIA_WEB_SESSION_ENCRYPTION_KEY=' + require('node:crypto').randomBytes(32).toString('base64url') + '\n')"
            node -e "process.stdout.write('ECONOVARIA_PLAYER_CREDENTIAL_PEPPER=' + require('node:crypto').randomBytes(48).toString('base64url') + '\n')"
            printf '%s\n' 'ECONOVARIA_TRUSTED_CLIENT_IP_HEADER=x-real-ip'
          } > backend/supabase/functions/.env
          chmod 600 backend/supabase/functions/.env
          EXCLUDED="studio,imgproxy,storage-api,logflare,vector,supavisor,realtime,postgres-meta,mailpit"
          for ATTEMPT in 1 2 3; do
            set +e
            npx supabase start --workdir backend --exclude "$EXCLUDED" 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            npx supabase stop --workdir backend --no-backup 2>&1 | tee -a "$LOG" || true
            sleep $((ATTEMPT * 10))
          done
          exit "$STATUS"

      - name: Rebuild database from zero and refresh REST schema
        shell: bash
        run: |
          set -euo pipefail
          npx supabase db reset --workdir backend --local

          REST_CONTAINER="$(docker ps --format '{{.Names}}' | grep -E '^supabase_rest_' | head -n 1)"
          test -n "$REST_CONTAINER"
          docker restart "$REST_CONTAINER" >/dev/null

          eval "$(npx supabase status --workdir backend -o env)"
          SERVER_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          test -n "$SERVER_KEY"

          cat > /tmp/auth-throttle-readiness-request.json <<'JSON'
          {
            "p_buckets": [
              {"dimension":"account","keyHash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"},
              {"dimension":"device","keyHash":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"},
              {"dimension":"ip","keyHash":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"}
            ]
          }
          JSON

          for ATTEMPT in $(seq 1 60); do
            STATUS="$(curl --silent --show-error \
              --output /tmp/auth-throttle-readiness-response.json \
              --write-out '%{http_code}' \
              --max-time 5 \
              --request POST \
              --header "apikey: ${SERVER_KEY}" \
              --header "Authorization: Bearer ${SERVER_KEY}" \
              --header "Content-Type: application/json" \
              --data-binary @/tmp/auth-throttle-readiness-request.json \
              http://127.0.0.1:54321/rest/v1/rpc/auth_throttle_check_v2 || true)"
            if [ "$STATUS" = "200" ]; then
              exit 0
            fi
            sleep 1
          done

          echo "Authentication throttle RPC was not ready after PostgREST restart." >&2
          sed -E \
            's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/[jwt-redacted]/g; s/sb_(secret|publishable)_[A-Za-z0-9_-]+/[supabase-key-redacted]/g; s/[0-9a-f]{64}/[digest-redacted]/gi' \
            /tmp/auth-throttle-readiness-response.json >&2 || true
          exit 1

      - name: Provision canonical source content
        shell: bash
        run: |
          set -o pipefail
          node scripts/game-creation-provisioning-local-acceptance.mjs \
            2>&1 | tee /tmp/player-runtime-source-provisioning.log

      - name: Seed one browser-only license code
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.purchase_codes (
            code_hash,
            status,
            max_redemptions,
            redeemed_count
          ) values (
            encode(extensions.digest('PLAYER-E2E-LICENSE-001', 'sha256'), 'hex'),
            'active',
            1,
            0
          );
          SQL

      - name: Start same-origin Player gateway
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx supabase status --workdir backend -o env)"
          test -n "${PUBLISHABLE_KEY:-}"
          case "$PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *) echo "Local Supabase did not expose a publishable key" >&2; exit 1 ;;
          esac
          python3 scripts/econovaria-local-gateway.py \
            --local-supabase \
            --port 4173 \
            > /tmp/player-runtime-gateway.log 2>&1 &
          echo $! > /tmp/player-runtime-gateway.pid
          for ATTEMPT in $(seq 1 90); do
            STATIC_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 \
              http://127.0.0.1:4173/ || true)"
            PLAYER_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 \
              --request OPTIONS \
              --header "apikey: ${PUBLISHABLE_KEY}" \
              http://127.0.0.1:4173/functions/v1/player-api || true)"
            BOOTSTRAP_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 \
              --request OPTIONS \
              --header "apikey: ${PUBLISHABLE_KEY}" \
              http://127.0.0.1:4173/functions/v1/bootstrap-api || true)"
            if [ "$STATIC_STATUS" = "200" ] && [ "$PLAYER_STATUS" = "204" ] && [ "$BOOTSTRAP_STATUS" = "204" ]; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/player-runtime-gateway.log
          exit 1

      - name: Execute connected two-browser Player journey
        id: player_browser
        continue-on-error: true
        run: node scripts/player-multiplayer-browser-acceptance.mjs

      - name: Execute connected Messaging mutation journey
        id: player_mutations
        if: steps.player_browser.outcome == 'success'
        continue-on-error: true
        run: node scripts/player-connected-mutation-browser-acceptance.mjs

      - name: Execute notification and watchlist mutation journey
        id: player_state_controls
        if: steps.player_mutations.outcome == 'success'
        continue-on-error: true
        run: node scripts/business-banking-player-state-controls-browser-acceptance.mjs

      - name: Execute connected transfer and Store mutation journey
        id: player_commerce
        if: steps.player_state_controls.outcome == 'success'
        continue-on-error: true
        run: node scripts/business-banking-player-commerce-browser-acceptance.mjs

      - name: Execute connected Inventory redemption journey
        id: player_inventory
        if: steps.player_commerce.outcome == 'success'
        continue-on-error: true
        run: node scripts/business-banking-player-inventory-browser-acceptance.mjs

      - name: Execute connected Contract lifecycle
        id: player_contracts
        if: steps.player_inventory.outcome == 'success'
        continue-on-error: true
        run: node scripts/player-contracts-browser-acceptance.mjs

      - name: Execute connected immediate market-order lifecycle
        id: player_market
        if: steps.player_contracts.outcome == 'success'
        continue-on-error: true
        run: node scripts/business-banking-player-market-browser-acceptance.mjs

      - name: Execute connected Business lifecycle
        id: player_business
        if: steps.player_market.outcome == 'success'
        continue-on-error: true
        run: node scripts/business-banking-player-business-browser-acceptance.mjs

      - name: Execute connected World lifecycle
        id: player_world
        if: steps.player_business.outcome == 'success'
        continue-on-error: true
        run: node scripts/business-banking-player-world-browser-acceptance.mjs

      - name: Execute 30 and 40 Player connected load profile
        id: player_load
        if: steps.player_world.outcome == 'success'
        continue-on-error: true
        run: node scripts/player-runtime-load-profile.mjs

      - name: Capture sanitized Player diagnostics
        if: steps.player_browser.outcome == 'failure' || steps.player_mutations.outcome == 'failure' || steps.player_state_controls.outcome == 'failure' || steps.player_commerce.outcome == 'failure' || steps.player_inventory.outcome == 'failure' || steps.player_contracts.outcome == 'failure' || steps.player_market.outcome == 'failure' || steps.player_business.outcome == 'failure' || steps.player_world.outcome == 'failure' || steps.player_load.outcome == 'failure'
        shell: bash
        run: |
          set +e
          {
            echo "== database counts =="
            psql "$DATABASE_URL" -X -qAt -c "select jsonb_build_object('games', (select count(*) from public.game_sessions where name = 'Player Multiplayer E2E'), 'players', (select count(*) from public.players p join public.game_sessions g on g.id = p.game_session_id where g.name = 'Player Multiplayer E2E'), 'activeCredentials', (select count(*) from public.player_access_credentials c join public.game_sessions g on g.id = c.game_session_id where g.name = 'Player Multiplayer E2E' and c.status = 'active'))::text;"
            echo "== container logs =="
            for CONTAINER in $(docker ps --format '{{.Names}}' | grep -E 'edge_runtime|auth|rest|kong' || true); do
              echo "-- ${CONTAINER} --"
              docker logs --since 20m "$CONTAINER" 2>&1 | tail -n 900
            done
          } \
            | sed -E 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/[jwt-redacted]/g; s/sb_(secret|publishable)_[A-Za-z0-9_-]+/[supabase-key-redacted]/g; s/[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/[uuid-redacted]/gi; s/ECO-[A-Z]{3,12}-[A-Z]{3,12}-[0-9]{3}/[game-code-redacted]/g; s/(BROWSER|LOAD)-(PLAYER|ACCESS)-[A-Z0-9-]+/[credential-redacted]/g' \
            > /tmp/player-runtime-server-diagnostics.log
          cat /tmp/player-runtime-server-diagnostics.log
          exit 0

      - name: Upload sanitized Player evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: player-multiplayer-load-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/econovaria-player-browser/
            /tmp/econovaria-player-load/
            /tmp/player-runtime-supabase-startup.log
            /tmp/player-runtime-source-provisioning.log
            /tmp/player-runtime-gateway.log
            /tmp/player-runtime-server-diagnostics.log
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce connected Player results
        if: always()
        shell: bash
        run: |
          test "${{ steps.player_browser.outcome }}" = "success"
          test "${{ steps.player_mutations.outcome }}" = "success"
          test "${{ steps.player_state_controls.outcome }}" = "success"
          test "${{ steps.player_commerce.outcome }}" = "success"
          test "${{ steps.player_inventory.outcome }}" = "success"
          test "${{ steps.player_contracts.outcome }}" = "success"
          test "${{ steps.player_market.outcome }}" = "success"
          test "${{ steps.player_business.outcome }}" = "success"
          test "${{ steps.player_world.outcome }}" = "success"
          test "${{ steps.player_load.outcome }}" = "success"

      - name: Stop local Player stack
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/player-runtime-gateway.pid ]; then
            kill "$(cat /tmp/player-runtime-gateway.pid)" 2>/dev/null || true
          fi
          rm -f backend/supabase/functions/.env
          npx supabase stop --workdir backend --no-backup || true
