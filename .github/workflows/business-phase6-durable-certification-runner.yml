name: Business Phase 6 Durable Certification Runner

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - feat/business-equipment-capacity-v2
    paths:
      - ".github/workflows/business-phase6-durable-certification-finalizer.yml"
      - ".github/workflows/business-phase6-durable-certification-runner.yml"

permissions:
  contents: write

concurrency:
  group: business-phase6-durable-certification-runner
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feat/business-timed-manufacturing-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Write and push durable certification records once
        shell: bash
        run: |
          set -euo pipefail

          if test -f docs/roadmaps/business-phase6-final-certification-inventory-v1.md; then
            echo "Durable Phase 6 certification already exists; no mutation required."
            exit 0
          fi

          git diff --name-only 739f5540234b20e16ba34f69f0d741d986030113...HEAD | sort > /tmp/phase6-finalizer-paths.txt
          printf '%s\n' \
            .github/workflows/business-phase6-durable-certification-finalizer.yml \
            .github/workflows/business-phase6-durable-certification-runner.yml | sort > /tmp/phase6-finalizer-expected.txt
          diff -u /tmp/phase6-finalizer-expected.txt /tmp/phase6-finalizer-paths.txt

          python3 <<'EXTRACT'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/business-phase6-durable-certification-finalizer.yml').read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate bounded documentation mutation"
          if start_marker not in source or end_marker not in source:
              raise SystemExit('Unable to locate guarded certification writer in source workflow')
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          Path('/tmp/business-phase6-finalize.py').write_text(textwrap.dedent(body), encoding='utf-8')
          EXTRACT

          python3 /tmp/business-phase6-finalize.py

          python3 <<'NORMALIZE'
          from pathlib import Path

          source_sha = '739f5540234b20e16ba34f69f0d741d986030113'
          scope_path = Path('docs/roadmaps/business-phase6-timed-manufacturing-scope-v1.md')
          scope = scope_path.read_text(encoding='utf-8')
          scope = scope.replace(
              f'**Status:** COMPLETE — exact-head certified on `{source_sha}`; Phase 7 checkpoint 7A opened  \n',
              f'**Status:** COMPLETE — exact-head certified on `{source_sha}`; Phase 7 checkpoint 7A opened\n',
          )
          scope = scope.replace(
              f'**Certified Phase 6 exact-head source:** `{source_sha}`  \n',
              f'**Certified Phase 6 exact-head source:** `{source_sha}`\n',
          )
          scope_path.write_text(scope, encoding='utf-8')

          inventory_path = Path('docs/roadmaps/business-phase6-final-certification-inventory-v1.md')
          inventory = inventory_path.read_text(encoding='utf-8')
          inventory_path.write_text(
              '\n'.join(line.rstrip() for line in inventory.splitlines()) + '\n',
              encoding='utf-8',
          )
          NORMALIZE

          git add -N docs/roadmaps/business-phase6-final-certification-inventory-v1.md
          git diff --check
          git status --short
          git diff --name-only | sort > /tmp/phase6-doc-paths.txt
          printf '%s\n' \
            docs/roadmaps/business-phase6-final-certification-inventory-v1.md \
            docs/roadmaps/business-phase6-timed-manufacturing-scope-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md \
            docs/roadmaps/business-v2-development-execution-plan-v1.md | sort > /tmp/phase6-doc-expected.txt
          diff -u /tmp/phase6-doc-expected.txt /tmp/phase6-doc-paths.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/roadmaps/business-phase6-final-certification-inventory-v1.md \
            docs/roadmaps/business-phase6-timed-manufacturing-scope-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md \
            docs/roadmaps/business-v2-development-execution-plan-v1.md
          git commit -m "docs(business): certify Phase 6 and open Phase 7"
          git push origin HEAD:feat/business-timed-manufacturing-v2
