name: Finalize Checking and Savings Ownership Temporary

on:
  push:
    branches:
      - fix/checking-savings-wallet-convergence-v1
    paths:
      - .github/workflows/finalize-checking-savings-ownership-temporary.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/checking-savings-wallet-convergence-v1
          fetch-depth: 0

      - name: Confirm coordinated conversion exists
        run: git log -30 --format='%s' | grep -F '[checking-conversion-complete] Canonicalize personal accounts to checking and savings'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.3

      - name: Install pinned tooling
        run: |
          npm install --global npm@10.9.8
          npm ci
          npm --prefix backend ci

      - name: Enforce account ownership by source path and context
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          roots = [
              Path('admin'),
              Path('backend/src'),
              Path('backend/supabase/functions'),
              Path('player-terminal/src'),
              Path('player-terminal/tests'),
              Path('player-terminal/tools'),
              Path('scripts'),
          ]
          suffixes = {'.ts', '.tsx', '.js', '.mjs', '.cjs', '.json', '.yml', '.yaml', '.md'}
          quoted_cash = re.compile(r"(?P<quote>['\"`])cash(?P=quote)", re.IGNORECASE)
          account_keywords = (
              'account', 'accounttype', 'account_type', 'p_account_type',
              'fromaccount', 'toaccount', 'from_account', 'to_account',
              'balance', 'ledger', 'wallet', 'banking', 'checking', 'savings',
              'transfer', 'settlement', 'store', 'business', 'loan', 'travel',
              'stock order', 'marketplace', 'reward', 'capitalization',
              'spendable', 'available funds', 'insufficient funds',
          )
          path_keywords = (
              'account', 'bank', 'ledger', 'wallet', 'balance', 'economy',
              'store', 'business', 'loan', 'travel', 'marketplace', 'stock',
              'currency', 'payment', 'reward', 'contract',
          )
          non_account_markers = (
              'assetclass', 'asset_class', 'cash flow', 'cash-flow',
              'cash equivalent', 'cash-equivalent', 'cash instrument',
              'cash market', 'cash price', 'cash rate', 'cash yield',
              'paymentmethod', 'payment_method',
          )

          def should_convert(path: Path, lines: list[str], index: int) -> bool:
              raw = '\n'.join(lines[max(0, index - 3):index + 4]).lower()
              compact = raw.replace(' ', '')
              if any(marker.replace(' ', '') in compact for marker in non_account_markers):
                  return False
              if any(keyword.replace(' ', '') in compact for keyword in account_keywords):
                  return True
              path_text = path.as_posix().lower()
              return any(keyword in path_text for keyword in path_keywords)

          converted = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in suffixes:
                      continue
                  source = path.read_text(encoding='utf-8')
                  lines = source.splitlines()
                  changed = False
                  for index, line in enumerate(lines):
                      if quoted_cash.search(line) and should_convert(path, lines, index):
                          lines[index] = quoted_cash.sub(
                              lambda match: f"{match.group('quote')}checking{match.group('quote')}",
                              line,
                          )
                          converted.append(f'{path}:{index + 1}')
                          changed = True
                  if changed:
                      path.write_text(
                          '\n'.join(lines) + ('\n' if source.endswith('\n') else ''),
                          encoding='utf-8',
                      )
          print('Ownership conversions applied:')
          print('\n'.join(converted) if converted else 'none')
          PY

      - name: Install permanent ownership-aware guard
        shell: bash
        run: |
          cat > scripts/checking-savings-account-type-contract.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readdirSync, readFileSync, statSync } from "node:fs";
          import path from "node:path";

          const retiredAccount = ["ca", "sh"].join("");
          const roots = [
            "admin",
            "backend/src",
            "backend/supabase/functions",
            "player-terminal/src",
            "player-terminal/tests",
            "player-terminal/tools",
            "scripts",
          ];
          const extensions = new Set([".ts", ".tsx", ".js", ".mjs", ".cjs", ".json", ".yml", ".yaml", ".md"]);
          const accountKeywords = [
            "account", "accounttype", "account_type", "p_account_type",
            "fromaccount", "toaccount", "from_account", "to_account",
            "balance", "ledger", "wallet", "banking", "checking", "savings",
            "transfer", "settlement", "store", "business", "loan", "travel",
            "stock order", "marketplace", "reward", "capitalization",
            "spendable", "available funds", "insufficient funds",
          ];
          const pathKeywords = [
            "account", "bank", "ledger", "wallet", "balance", "economy",
            "store", "business", "loan", "travel", "marketplace", "stock",
            "currency", "payment", "reward", "contract",
          ];
          const nonAccountMarkers = [
            "assetclass", "asset_class", "cash flow", "cash-flow",
            "cash equivalent", "cash-equivalent", "cash instrument",
            "cash market", "cash price", "cash rate", "cash yield",
            "paymentmethod", "payment_method",
          ];
          const escaped = retiredAccount.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const quotedRetired = new RegExp(`(["'\\x60])${escaped}\\1`, "i");
          const violations = [];

          function isOwnedAccountContext(target, lines, index) {
            const context = lines.slice(Math.max(0, index - 3), index + 4).join("\n").toLowerCase();
            const compact = context.replaceAll(" ", "");
            if (nonAccountMarkers.some((marker) => compact.includes(marker.replaceAll(" ", "")))) return false;
            if (accountKeywords.some((keyword) => compact.includes(keyword.replaceAll(" ", "")))) return true;
            const pathText = target.toLowerCase();
            return pathKeywords.some((keyword) => pathText.includes(keyword));
          }

          function walk(directory) {
            for (const entry of readdirSync(directory)) {
              const target = path.join(directory, entry);
              const details = statSync(target);
              if (details.isDirectory()) {
                walk(target);
                continue;
              }
              if (!extensions.has(path.extname(entry).toLowerCase())) continue;
              const lines = readFileSync(target, "utf8").split(/\r?\n/);
              lines.forEach((line, index) => {
                if (quotedRetired.test(line) && isOwnedAccountContext(target, lines, index)) {
                  violations.push(`${target}:${index + 1}`);
                }
              });
            }
          }

          for (const root of roots) walk(root);
          assert.deepEqual(
            violations,
            [],
            `Retired personal account literal remains in an owned account context:\n${violations.join("\n")}`,
          );
          console.log("Ownership-aware Checking/Savings guard passed across active Admin, Player, API, route, runner, and test source.");
          EOF

          python <<'PY'
          from pathlib import Path
          names = (
              'Export PR Source Temporary',
              'Canonicalize Checking and Savings One Time',
              'Canonicalize Checking and Savings One Time V2',
              'Canonicalize Checking and Savings One Time V3',
              'Canonicalize Checking and Savings One Time V4',
              'Audit Checking and Savings Convergence Temporary',
              'Final Checking and Savings Audit Temporary',
              'Reconcile Checking and Savings Semantics Temporary',
              'Finalize Checking and Savings Ownership Temporary',
          )
          for candidate in Path('.github/workflows').glob('*'):
              if not candidate.is_file() or candidate.suffix not in {'.yml', '.yaml'}:
                  continue
              text = candidate.read_text(encoding='utf-8')
              if any(name in text for name in names):
                  candidate.unlink()
          PY

      - name: Regenerate exact final release authority
        shell: bash
        run: |
          python <<'PY'
          import json
          import subprocess
          from pathlib import Path

          authority_path = Path('docs/operations/contracts/player-cross-cutting-verification-authority-v1.json')
          authority = json.loads(authority_path.read_text(encoding='utf-8'))
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'origin/main', '--'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          final_paths = {path for path in changed | untracked if path and Path(path).exists()}
          final_paths.add(str(authority_path))
          verifier_paths = {
              'scripts/player-cross-cutting-authority.test.mjs',
              'scripts/verify-player-cross-cutting-authority.mjs',
          }
          authority.update({
              'authorityId': 'econovaria.checking-savings-account-model-pr-501.v1',
              'purpose': 'authorize-checking-savings-account-convergence',
              'pullRequestNumber': 501,
              'baseRef': 'main',
              'scopeLock': 'exact-path-allowlist',
              'productionDeploymentAllowed': False,
              'productionMutationAllowed': False,
              'secretValuesAllowed': False,
              'allowedPaths': sorted(final_paths | verifier_paths),
              'requiredFiles': sorted(final_paths | verifier_paths),
          })
          authority_path.write_text(json.dumps(authority, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Run final ownership and account contracts
        run: |
          node --test scripts/player-local-currency-authority-contract.test.mjs
          node --test scripts/checking-savings-account-type-contract.test.mjs
          node player-terminal/tests/store-local-currency.mjs
          npm --prefix backend run test:player-banking-public
          node scripts/validate-supabase-migrations.mjs
          node scripts/verify-player-cross-cutting-authority.mjs
          npm --prefix backend run typecheck
          git diff --check

      - name: Commit final ownership guard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --name-only -z | xargs -0 -r git add --
          git ls-files --others --exclude-standard -z | xargs -0 -r git add --
          test -n "$(git diff --cached --name-only)"
          git commit -m "Finalize Checking and Savings account ownership"
          git push origin HEAD:fix/checking-savings-wallet-convergence-v1

      - name: Record final ownership PASS
        run: |
          cat > /tmp/checking-savings-ownership-pass.md <<'EOF'
          ## Checking and Savings ownership audit: PASS

          The account-key conversion now uses both code context and module ownership. Hidden defaults inside Banking, Ledger, Store, Business, Loan, Travel, Marketplace, Stock settlement, Currency, Reward, and Contract modules cannot retain the retired personal account key. Unrelated economic concepts remain preserved.

          Focused Admin/Player contracts, Store, Player Banking, migration validation, release authority, backend typecheck, and the permanent ownership-aware guard passed.

          No staging or production mutation was performed. PR #501 remains draft pending complete CI and connected staging verification.
          EOF
          gh pr comment 501 --repo kohnerbouchard-star/Student-Profile --body-file /tmp/checking-savings-ownership-pass.md

      - name: Record final ownership FAIL
        if: failure()
        run: |
          cat > /tmp/checking-savings-ownership-fail.md <<'EOF'
          ## Checking and Savings ownership audit: FAIL

          The ownership-aware finalization did not publish. PR #501 remains draft and must not be merged or deployed. Review the first failing step.
          EOF
          gh pr comment 501 --repo kohnerbouchard-star/Student-Profile --body-file /tmp/checking-savings-ownership-fail.md
