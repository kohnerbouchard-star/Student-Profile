name: C0 FX bootstrap repair

on:
  push:
    branches:
      - feat/multicurrency-funding-core-v1
    paths:
      - .github/workflows/c0-fx-bootstrap-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact repair controller head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Guard controller ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/multicurrency-funding-core-v1"
          test "$(git rev-parse HEAD^)" = "61358fa1b087c56709b5c63ebf6f2a4b421ec7d0"

      - name: Stabilize the ten-country FX snapshot cohort
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/multicurrency-funding-database.mjs')
          text = path.read_text()
          start = text.index('function initializeFx(game) {')
          end = text.index('\nfunction seedForeignChecking', start)
          block = text[start:end]

          old_effective = "clock_timestamp() - interval '2 minutes',"
          new_effective = "statement_timestamp() - interval '2 minutes',"
          old_created = "clock_timestamp() - interval '3 minutes'"
          new_created = "statement_timestamp() - interval '3 minutes'"

          if block.count(old_effective) != 1:
              raise SystemExit('Expected exactly one volatile FX effective timestamp')
          if block.count(old_created) != 1:
              raise SystemExit('Expected exactly one volatile FX created timestamp')

          block = block.replace(old_effective, new_effective, 1)
          block = block.replace(old_created, new_created, 1)
          path.write_text(text[:start] + block + text[end:])
          PY

          node --check scripts/multicurrency-funding-database.mjs
          git diff --check
          git diff -- scripts/multicurrency-funding-database.mjs

      - name: Commit and push fixture repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/multicurrency-funding-database.mjs
          git commit -m "fix(funding): stabilize FX snapshot cohort"
          git push origin HEAD:feat/multicurrency-funding-core-v1
