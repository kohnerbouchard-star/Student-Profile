name: Release Integrity V2 Live Parity

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-integrity-v2-live-parity.yml"
      - "scripts/release-integrity-v2/**"
      - "scripts/release-integrity/export-schema-fingerprint.sql"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-integrity-v2-live-parity.yml"
      - "scripts/release-integrity-v2/**"
      - "scripts/release-integrity/export-schema-fingerprint.sql"

permissions:
  contents: read

concurrency:
  group: release-integrity-v2-live-parity
  cancel-in-progress: false

env:
  STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  POLICY_PATH: scripts/release-integrity-v2/live-parity-policy.json

jobs:
  static-contract:
    name: Validate v2 parity contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"
      - name: Validate script and policy syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/release-integrity-v2/compare-live-parity.mjs
          node - <<'NODE'
          const policy = require('./scripts/release-integrity-v2/live-parity-policy.json');
          if (policy.schemaVersion !== 'econovaria.release-integrity-v2.policy.v1') throw new Error('policy schema');
          if (!/^\d{14}$/.test(policy.historicalLedgerCutoff || '')) throw new Error('ledger cutoff');
          if (!Array.isArray(policy.allowedStagingOnlyTables) || policy.allowedStagingOnlyTables.length !== 4) throw new Error('staging table hold');
          NODE

  live-report:
    name: Inspect current staging and production read-only
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    env:
      STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
      PRODUCTION_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_CA_CERT: ${{ secrets.SUPABASE_DB_CA_CERT }}
      PGSSLMODE: verify-full
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=30000 -c lock_timeout=5000
    steps:
      - name: Check out exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact current main binding
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$STAGING_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"
      - name: Configure certificate-verified database TLS
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_SUPABASE_DB_URL"
          test -n "$PRODUCTION_SUPABASE_DB_URL"
          test -n "$SUPABASE_DB_CA_CERT"
          cert_path="$RUNNER_TEMP/supabase-db-ca.crt"
          umask 077
          printf '%s\n' "$SUPABASE_DB_CA_CERT" > "$cert_path"
          test -s "$cert_path"
          echo "PGSSLROOTCERT=$cert_path" >> "$GITHUB_ENV"
      - name: Export bounded live evidence read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-integrity-v2"
          ledger_sql="select coalesce(jsonb_agg(jsonb_build_object('version', version, 'name', coalesce(name, '')) order by version), '[]'::jsonb)::text from supabase_migrations.schema_migrations"
          psql "$STAGING_SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "$ledger_sql" > "$RUNNER_TEMP/release-integrity-v2/staging-ledger.json"
          psql "$PRODUCTION_SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "$ledger_sql" > "$RUNNER_TEMP/release-integrity-v2/production-ledger.json"
          psql "$STAGING_SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f scripts/release-integrity/export-schema-fingerprint.sql > "$RUNNER_TEMP/release-integrity-v2/staging-schema.json"
          psql "$PRODUCTION_SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f scripts/release-integrity/export-schema-fingerprint.sql > "$RUNNER_TEMP/release-integrity-v2/production-schema.json"
      - name: Produce v2 parity report
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-integrity-v2/compare-live-parity.mjs \
            --mode report \
            --policy "$POLICY_PATH" \
            --staging-schema "$RUNNER_TEMP/release-integrity-v2/staging-schema.json" \
            --production-schema "$RUNNER_TEMP/release-integrity-v2/production-schema.json" \
            --staging-ledger "$RUNNER_TEMP/release-integrity-v2/staging-ledger.json" \
            --production-ledger "$RUNNER_TEMP/release-integrity-v2/production-ledger.json" \
            --output "$RUNNER_TEMP/release-integrity-v2/parity-report.json"
      - name: Write bounded summary
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'));
          const lines = [
            '## Release Integrity V2 live parity report',
            `- Status: \`${report.status}\``,
            `- Historical staging ledger SHA-256: \`${report.ledger.historical.stagingSha256}\``,
            `- Historical production ledger SHA-256: \`${report.ledger.historical.productionSha256}\``,
            `- Post-cutoff ledger parity: \`${report.ledger.postCutoff.status}\``,
            `- Raw staging-only routines: \`${report.rawRoutineDifferences.stagingOnly.length}\``,
            `- Raw production-only routines: \`${report.rawRoutineDifferences.productionOnly.length}\``,
            `- Shared routine definition drift: \`${report.rawRoutineDifferences.definitionDrift.length}\``,
            `- Unapproved normalized differences: \`${report.unapprovedDifferenceCount}\``,
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE
        env:
          REPORT: ${{ runner.temp }}/release-integrity-v2/parity-report.json
      - name: Remove raw live evidence and TLS material
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/release-integrity-v2/staging-schema.json" \
            "$RUNNER_TEMP/release-integrity-v2/production-schema.json" \
            "$RUNNER_TEMP/release-integrity-v2/staging-ledger.json" \
            "$RUNNER_TEMP/release-integrity-v2/production-ledger.json" \
            "$RUNNER_TEMP/supabase-db-ca.crt"
      - name: Upload sanitized parity report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-integrity-v2-report-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/release-integrity-v2/parity-report.json
