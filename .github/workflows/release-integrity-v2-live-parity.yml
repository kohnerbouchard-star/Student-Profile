name: Release Integrity V2 Live Parity

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-integrity-v2-live-parity.yml"
      - "scripts/release-integrity-v2/**"
      - "scripts/release-integrity/export-schema-fingerprint.sql"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-integrity-v2-live-parity.yml"
      - "scripts/release-integrity-v2/**"
      - "scripts/release-integrity/export-schema-fingerprint.sql"

permissions:
  contents: read

env:
  STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  POLICY_PATH: scripts/release-integrity-v2/live-parity-policy.json
  CA_BUNDLE_PATH: scripts/release-integrity-v2/certs/supabase-ca-bundle.crt
  SUPABASE_CLI_VERSION: 2.109.1

concurrency:
  group: release-integrity-v2-live-parity
  cancel-in-progress: false

jobs:
  static-contract:
    name: Validate v2 parity contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"
      - name: Validate script, policy, and Supabase CA bundle
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/release-integrity-v2/compare-live-parity.mjs
          node - <<'NODE'
          const policy = require('./scripts/release-integrity-v2/live-parity-policy.json');
          if (policy.schemaVersion !== 'econovaria.release-integrity-v2.policy.v1') throw new Error('policy schema');
          if (!/^\d{14}$/.test(policy.historicalLedgerCutoff || '')) throw new Error('ledger cutoff');
          if (!Array.isArray(policy.allowedStagingOnlyTables) || policy.allowedStagingOnlyTables.length !== 4) throw new Error('staging table hold');
          NODE
          test "$(grep -c -- '-----BEGIN CERTIFICATE-----' "$CA_BUNDLE_PATH")" = 3
          openssl crl2pkcs7 -nocrl -certfile "$CA_BUNDLE_PATH" \
            | openssl pkcs7 -print_certs -noout \
            | grep -q 'Supabase'

  staging-evidence:
    name: Export staging parity evidence read-only
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: ${{ github.workspace }}/scripts/release-integrity-v2/certs/supabase-ca-bundle.crt
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=30000 -c lock_timeout=5000
    steps:
      - name: Check out exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact staging binding
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = "$STAGING_PROJECT_REF"
          test "$SUPABASE_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -s "$PGSSLROOTCERT"
          git fetch --no-tags --prune origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1
        with:
          version: 2.109.1
      - name: Link exact staging database
        shell: bash
        run: |
          set -euo pipefail
          cp backend/supabase/config.next.toml backend/supabase/config.toml
          (cd backend && supabase --yes link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD")
          database_url="$(tr -d '\r\n' < backend/supabase/.temp/pooler-url)"
          case "$database_url" in
            "postgresql://postgres.${STAGING_PROJECT_REF}@"*:5432/postgres) ;;
            *) echo 'Unexpected staging pooler binding.' >&2; exit 1 ;;
          esac
          echo "::add-mask::$database_url"
          echo "DATABASE_URL=$database_url" >> "$GITHUB_ENV"
          echo "PGPASSWORD=$SUPABASE_DB_PASSWORD" >> "$GITHUB_ENV"
      - name: Export staging schema and ledger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-integrity-v2-staging"
          ledger_sql="select coalesce(jsonb_agg(jsonb_build_object('version', version, 'name', coalesce(name, '')) order by version), '[]'::jsonb)::text from supabase_migrations.schema_migrations"
          psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c "$ledger_sql" > "$RUNNER_TEMP/release-integrity-v2-staging/staging-ledger.json"
          psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -f scripts/release-integrity/export-schema-fingerprint.sql > "$RUNNER_TEMP/release-integrity-v2-staging/staging-schema.json"
          test -s "$RUNNER_TEMP/release-integrity-v2-staging/staging-ledger.json"
          test -s "$RUNNER_TEMP/release-integrity-v2-staging/staging-schema.json"
      - name: Upload staging metadata evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-integrity-v2-staging-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/release-integrity-v2-staging

  production-evidence:
    name: Export production parity evidence read-only
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: ${{ github.workspace }}/scripts/release-integrity-v2/certs/supabase-ca-bundle.crt
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=30000 -c lock_timeout=5000
    steps:
      - name: Check out exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"
      - name: Verify exact production binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          test -s "$PGSSLROOTCERT"
          test "$STAGING_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          git fetch --no-tags --prune origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          SUPABASE_DB_URL="$SUPABASE_DB_URL" node scripts/release-integrity/cli.mjs validate-db-url \
            --url-env SUPABASE_DB_URL \
            --expected-project-ref "$PRODUCTION_PROJECT_REF"
      - name: Export production schema and ledger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-integrity-v2-production"
          ledger_sql="select coalesce(jsonb_agg(jsonb_build_object('version', version, 'name', coalesce(name, '')) order by version), '[]'::jsonb)::text from supabase_migrations.schema_migrations"
          psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "$ledger_sql" > "$RUNNER_TEMP/release-integrity-v2-production/production-ledger.json"
          psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f scripts/release-integrity/export-schema-fingerprint.sql > "$RUNNER_TEMP/release-integrity-v2-production/production-schema.json"
          test -s "$RUNNER_TEMP/release-integrity-v2-production/production-ledger.json"
          test -s "$RUNNER_TEMP/release-integrity-v2-production/production-schema.json"
      - name: Upload production metadata evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-integrity-v2-production-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/release-integrity-v2-production

  compare:
    name: Compare sanitized staging and production evidence
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [staging-evidence, production-evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"
      - name: Download staging evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-integrity-v2-staging-${{ github.sha }}
          path: ${{ runner.temp }}/release-integrity-v2/staging
      - name: Download production evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-integrity-v2-production-${{ github.sha }}
          path: ${{ runner.temp }}/release-integrity-v2/production
      - name: Produce v2 parity report
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-integrity-v2/compare-live-parity.mjs \
            --mode report \
            --policy "$POLICY_PATH" \
            --staging-schema "$RUNNER_TEMP/release-integrity-v2/staging/staging-schema.json" \
            --production-schema "$RUNNER_TEMP/release-integrity-v2/production/production-schema.json" \
            --staging-ledger "$RUNNER_TEMP/release-integrity-v2/staging/staging-ledger.json" \
            --production-ledger "$RUNNER_TEMP/release-integrity-v2/production/production-ledger.json" \
            --output "$RUNNER_TEMP/release-integrity-v2/parity-report.json"
      - name: Write bounded summary
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'));
          const lines = [
            '## Release Integrity V2 live parity report',
            `- Status: \`${report.status}\``,
            `- Historical staging ledger SHA-256: \`${report.ledger.historical.stagingSha256}\``,
            `- Historical production ledger SHA-256: \`${report.ledger.historical.productionSha256}\``,
            `- Post-cutoff ledger parity: \`${report.ledger.postCutoff.status}\``,
            `- Raw staging-only routines: \`${report.rawRoutineDifferences.stagingOnly.length}\``,
            `- Raw production-only routines: \`${report.rawRoutineDifferences.productionOnly.length}\``,
            `- Shared routine definition drift: \`${report.rawRoutineDifferences.definitionDrift.length}\``,
            `- Unapproved normalized differences: \`${report.unapprovedDifferenceCount}\``,
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE
        env:
          REPORT: ${{ runner.temp }}/release-integrity-v2/parity-report.json
      - name: Upload sanitized parity report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-integrity-v2-report-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/release-integrity-v2/parity-report.json
