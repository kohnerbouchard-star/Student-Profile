name: Reconcile Checking and Savings Semantics Temporary

on:
  push:
    branches:
      - fix/checking-savings-wallet-convergence-v1
    paths:
      - .github/workflows/reconcile-checking-savings-semantics-temporary.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/checking-savings-wallet-convergence-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.3

      - name: Install pinned tooling
        run: |
          npm install --global npm@10.9.8
          npm ci
          npm --prefix backend ci

      - name: Ensure the coordinated conversion exists
        shell: bash
        run: |
          if ! git log -20 --format='%s' | grep -Fq '[checking-conversion-complete] Canonicalize personal accounts to checking and savings'; then
            python <<'EXECUTE_V3'
          from pathlib import Path

          workflow = Path('.github/workflows/canonicalize-checking-savings-one-time-v3.yml')
          if not workflow.exists():
              raise SystemExit('Conversion commit is missing and the reviewed V3 source is unavailable')
          source = workflow.read_text(encoding='utf-8')
          start = "          python <<'PY'\n"
          end = "\n          PY\n\n      - name: Validate focused account contracts"
          if start not in source or end not in source:
              raise SystemExit('Could not extract the reviewed V3 transformation')
          payload = source.split(start, 1)[1].split(end, 1)[0]
          payload = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in payload.splitlines()
          )
          exec(compile(payload, str(workflow), 'exec'), {'__name__': '__main__'})
          EXECUTE_V3
          fi

      - name: Restore unrelated economic semantics and enforce account contexts
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          ROOT = Path.cwd()
          BASELINE = '4e587552855099ae6bb6a9da3407b55268ab4cb3'
          roots = [
              Path('admin'),
              Path('backend/src'),
              Path('backend/supabase/functions'),
              Path('player-terminal/src'),
              Path('player-terminal/tests'),
              Path('player-terminal/tools'),
              Path('scripts'),
          ]
          suffixes = {'.ts', '.tsx', '.js', '.mjs', '.cjs', '.json', '.yml', '.yaml', '.md'}
          quoted_cash = re.compile(r"(?P<quote>['\"`])cash(?P=quote)", re.IGNORECASE)
          account_keywords = (
              'account', 'accounttype', 'account_type', 'p_account_type',
              'fromaccount', 'toaccount', 'from_account', 'to_account',
              'balance', 'ledger', 'wallet', 'banking', 'checking', 'savings',
              'transfer', 'settlement', 'store', 'business', 'loan', 'travel',
              'stock order', 'marketplace', 'reward', 'capitalization',
              'spendable', 'available funds', 'insufficient funds',
          )
          non_account_markers = (
              'assetclass', 'asset_class', 'cash flow', 'cash-flow',
              'cash equivalent', 'cash-equivalent', 'cash instrument',
              'cash market', 'cash price', 'cash rate', 'cash yield',
              'paymentmethod', 'payment_method',
          )

          def context_is_account(lines: list[str], index: int) -> bool:
              start = max(0, index - 3)
              end = min(len(lines), index + 4)
              context = '\n'.join(lines[start:end]).lower().replace(' ', '')
              raw_context = '\n'.join(lines[start:end]).lower()
              if any(marker.replace(' ', '') in context for marker in non_account_markers):
                  return False
              return any(keyword.replace(' ', '') in context for keyword in account_keywords)

          def baseline_text(path: Path) -> str | None:
              result = subprocess.run(
                  ['git', 'show', f'{BASELINE}:{path.as_posix()}'],
                  text=True,
                  capture_output=True,
              )
              return result.stdout if result.returncode == 0 else None

          restored = []
          enforced = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in suffixes:
                      continue
                  base = baseline_text(path)
                  if base is None:
                      continue
                  current = path.read_text(encoding='utf-8')
                  base_lines = base.splitlines()
                  current_lines = current.splitlines()
                  changed = False
                  for index, base_line in enumerate(base_lines):
                      if not quoted_cash.search(base_line):
                          continue
                      converted_line = quoted_cash.sub(
                          lambda match: f"{match.group('quote')}checking{match.group('quote')}",
                          base_line,
                      )
                      if context_is_account(base_lines, index):
                          if base_line in current_lines:
                              current_lines[current_lines.index(base_line)] = converted_line
                              enforced.append(f'{path}:{index + 1}')
                              changed = True
                          continue
                      if converted_line in current_lines:
                          current_lines[current_lines.index(converted_line)] = base_line
                          restored.append(f'{path}:{index + 1}')
                          changed = True
                  if changed:
                      suffix = '\n' if current.endswith('\n') else ''
                      path.write_text('\n'.join(current_lines) + suffix, encoding='utf-8')

          report = Path('/tmp/checking-savings-semantic-repair.txt')
          report.write_text(
              'Restored unrelated semantic literals:\n' + '\n'.join(restored) +
              '\n\nEnforced account-key conversions:\n' + '\n'.join(enforced) + '\n',
              encoding='utf-8',
          )
          print(report.read_text(encoding='utf-8'))
          PY

      - name: Install context-aware account guard and clean temporary workflows
        shell: bash
        run: |
          cat > scripts/checking-savings-account-type-contract.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readdirSync, readFileSync, statSync } from "node:fs";
          import path from "node:path";

          const retiredAccount = ["ca", "sh"].join("");
          const roots = [
            "admin",
            "backend/src",
            "backend/supabase/functions",
            "player-terminal/src",
            "player-terminal/tests",
            "player-terminal/tools",
            "scripts",
          ];
          const extensions = new Set([".ts", ".tsx", ".js", ".mjs", ".cjs", ".json", ".yml", ".yaml", ".md"]);
          const accountKeywords = [
            "account", "accounttype", "account_type", "p_account_type",
            "fromaccount", "toaccount", "from_account", "to_account",
            "balance", "ledger", "wallet", "banking", "checking", "savings",
            "transfer", "settlement", "store", "business", "loan", "travel",
            "stock order", "marketplace", "reward", "capitalization",
            "spendable", "available funds", "insufficient funds",
          ];
          const nonAccountMarkers = [
            "assetclass", "asset_class", "cash flow", "cash-flow",
            "cash equivalent", "cash-equivalent", "cash instrument",
            "cash market", "cash price", "cash rate", "cash yield",
            "paymentmethod", "payment_method",
          ];
          const escaped = retiredAccount.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const quotedRetired = new RegExp(`(["'\\x60])${escaped}\\1`, "i");
          const violations = [];

          function isAccountContext(lines, index) {
            const context = lines.slice(Math.max(0, index - 3), index + 4).join("\n").toLowerCase();
            const compact = context.replaceAll(" ", "");
            if (nonAccountMarkers.some((marker) => compact.includes(marker.replaceAll(" ", "")))) return false;
            return accountKeywords.some((keyword) => compact.includes(keyword.replaceAll(" ", "")));
          }

          function walk(directory) {
            for (const entry of readdirSync(directory)) {
              const target = path.join(directory, entry);
              const details = statSync(target);
              if (details.isDirectory()) {
                walk(target);
                continue;
              }
              if (!extensions.has(path.extname(entry).toLowerCase())) continue;
              const lines = readFileSync(target, "utf8").split(/\r?\n/);
              lines.forEach((line, index) => {
                if (quotedRetired.test(line) && isAccountContext(lines, index)) {
                  violations.push(`${target}:${index + 1}`);
                }
              });
            }
          }

          for (const root of roots) walk(root);
          assert.deepEqual(
            violations,
            [],
            `Retired personal account literal remains in an active account context:\n${violations.join("\n")}`,
          );
          console.log("Context-aware Checking/Savings guard passed across active Admin, Player, API, route, runner, and test source.");
          EOF

          python <<'PY'
          from pathlib import Path

          names = (
              'Export PR Source Temporary',
              'Canonicalize Checking and Savings One Time',
              'Canonicalize Checking and Savings One Time V2',
              'Canonicalize Checking and Savings One Time V3',
              'Canonicalize Checking and Savings One Time V4',
              'Audit Checking and Savings Convergence Temporary',
              'Final Checking and Savings Audit Temporary',
              'Reconcile Checking and Savings Semantics Temporary',
          )
          for candidate in Path('.github/workflows').glob('*'):
              if not candidate.is_file() or candidate.suffix not in {'.yml', '.yaml'}:
                  continue
              text = candidate.read_text(encoding='utf-8')
              if any(name in text for name in names):
                  candidate.unlink()
          PY

      - name: Regenerate exact release authority from final diff
        shell: bash
        run: |
          python <<'PY'
          import json
          import subprocess
          from pathlib import Path

          authority_path = Path('docs/operations/contracts/player-cross-cutting-verification-authority-v1.json')
          authority = json.loads(authority_path.read_text(encoding='utf-8'))
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'origin/main', '--'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          final_paths = {path for path in changed | untracked if path and Path(path).exists()}
          final_paths.add(str(authority_path))
          verifier_paths = {
              'scripts/player-cross-cutting-authority.test.mjs',
              'scripts/verify-player-cross-cutting-authority.mjs',
          }
          authority.update({
              'authorityId': 'econovaria.checking-savings-account-model-pr-501.v1',
              'purpose': 'authorize-checking-savings-account-convergence',
              'pullRequestNumber': 501,
              'baseRef': 'main',
              'scopeLock': 'exact-path-allowlist',
              'productionDeploymentAllowed': False,
              'productionMutationAllowed': False,
              'secretValuesAllowed': False,
              'allowedPaths': sorted(final_paths | verifier_paths),
              'requiredFiles': sorted(final_paths | verifier_paths),
          })
          authority_path.write_text(json.dumps(authority, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Run final semantic and account contracts
        run: |
          node --test scripts/player-local-currency-authority-contract.test.mjs
          node --test scripts/checking-savings-account-type-contract.test.mjs
          node player-terminal/tests/store-local-currency.mjs
          npm --prefix backend run test:player-banking-public
          node scripts/validate-supabase-migrations.mjs
          node scripts/verify-player-cross-cutting-authority.mjs
          npm --prefix backend run typecheck
          git diff --check

      - name: Commit semantic reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --name-only -z | xargs -0 -r git add --
          git ls-files --others --exclude-standard -z | xargs -0 -r git add --
          test -n "$(git diff --cached --name-only)"
          git commit -m "Reconcile Checking and Savings account semantics"
          git push origin HEAD:fix/checking-savings-wallet-convergence-v1

      - name: Record semantic audit PASS
        run: |
          cat > /tmp/checking-savings-semantic-pass.md <<'EOF'
          ## Checking and Savings semantic reconciliation: PASS

          The final branch keeps the account migration limited to personal banking semantics. Account-context uses now resolve to Checking or Savings, while unrelated economic concepts are preserved.

          Verified in the same gate: Admin and Player contracts, Store, Player Banking, migration structure, release authority, backend typecheck, and a context-aware source guard.

          No staging or production mutation was performed. PR #501 remains draft pending complete CI and connected staging verification.
          EOF
          gh pr comment 501 --repo kohnerbouchard-star/Student-Profile --body-file /tmp/checking-savings-semantic-pass.md

      - name: Record semantic audit FAIL
        if: failure()
        run: |
          cat > /tmp/checking-savings-semantic-fail.md <<'EOF'
          ## Checking and Savings semantic reconciliation: FAIL

          The semantic reconciliation did not publish. PR #501 remains draft and must not be merged or deployed. Review the first failing step.
          EOF
          gh pr comment 501 --repo kohnerbouchard-star/Student-Profile --body-file /tmp/checking-savings-semantic-fail.md
