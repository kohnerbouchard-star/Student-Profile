name: Business Phase 4B Certify PR

on:
  pull_request:
    paths:
      - ".github/workflows/business-phase4b-certify-pr.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: business-phase4b-certify-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  certify:
    if: github.event.pull_request.number == 658
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FEATURE_BRANCH: feat/business-workforce-hiring-v2
      CERTIFIED_SOURCE: fd83a17779254ac4ed386ef3ea65fe9c774ee3d2
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/business-workforce-hiring-v2
          fetch-depth: 0

      - name: Capture and verify starting head
        id: start
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git merge-base --is-ancestor "$CERTIFIED_SOURCE" HEAD
          unexpected="$(git diff --name-only "$CERTIFIED_SOURCE" HEAD | grep -v '^.github/workflows/business-phase4b-certify-pr.yml$' || true)"
          test -z "$unexpected"

      - name: Record Phase 4B certification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          plan_path = Path("docs/roadmaps/business-v2-development-execution-plan-v1.md")
          plan = plan_path.read_text(encoding="utf-8")
          old_status = "**Status:** IN PROGRESS — checkpoint A complete; candidate pools and server-owned hiring remain open"
          new_status = "**Status:** IN PROGRESS — checkpoints A and B complete; production-labor and deterministic payroll settlement remain open"
          if plan.count(old_status) != 1:
              raise SystemExit("Phase 4 status marker missing or duplicated")
          plan = plan.replace(old_status, new_status, 1)

          checkpoint_4a = "- **4A:** canonical workforce/payroll authority foundation and scope hardening, certified source `f72626f055004007823eb8de22569035ac897797`."
          checkpoint_4b = "- **4B:** public candidate pools and candidate-only server-owned hiring, with browser-authored employee economics retired; certified implementation source `fd83a17779254ac4ed386ef3ea65fe9c774ee3d2`."
          if checkpoint_4b not in plan:
              if plan.count(checkpoint_4a) != 1:
                  raise SystemExit("Phase 4A checkpoint marker missing or duplicated")
              plan = plan.replace(checkpoint_4a, checkpoint_4a + "\n" + checkpoint_4b, 1)
          plan_path.write_text(plan, encoding="utf-8")

          log_path = Path("docs/roadmaps/business-v2-development-execution-log-v1.md")
          log = log_path.read_text(encoding="utf-8")
          entry_heading = "## 2026-08-22 — Phase 4B COMPLETE: candidate pools and server-owned hiring"
          if entry_heading not in log:
              anchor = "\n---\n\n"
              if log.count(anchor) < 1:
                  raise SystemExit("Execution-log insertion anchor missing")
              entry = f'''{entry_heading}

### Certified source and repository state

- **Certified implementation source:** `fd83a17779254ac4ed386ef3ea65fe9c774ee3d2` (`feat(business): Phase 4B candidate hiring source`).
- Generator/test-envelope correction: `054c2d3e86928fc44e17b4872830b8b1fee5d111`.
- PR #658 remains open, draft, unmerged, and undeployed.
- No staging or production migration, deployment, secret change, or live database mutation was performed during this checkpoint.

### What is now authoritative

- The Player reads a public-key-only workforce candidate pool scoped by the authenticated Player's game and owned Business.
- Candidate availability is filtered server-side by active status, availability window, Business country, Business currency, and active workforce role.
- The browser submits only Business key, candidate public key, and idempotency intent. Role, wage, labor minutes, skill, productivity, contract type, country, and currency are copied from trusted candidate authority inside the transaction.
- Hiring locks the Business and candidate, prevents unavailable/expired/country-mismatched/currency-mismatched/self/duplicate employment, advances candidate state, creates the authoritative employee, and writes an audit event.
- Repeated matching idempotency keys replay the original receipt; conflicting reuse is rejected.
- The retired free-text employee-creation route remains authenticated compatibility-only and returns `410 Gone` with `business_free_text_hiring_retired`.
- Payroll settlement and production-labor reservations remain explicitly outside Phase 4B.

### Verification authority

- **Business Phase 4B Consolidate PR — PASS** (workflow run `32564813170`, job `97011797550`).
- Phase 4B workforce-hiring contract: **PASS**.
- Business/Banking runtime contract: **PASS**.
- Supabase migration validation: **PASS** with 311 unique migration versions.
- Complete root `npm test` repository quality suite: **PASS**.
- Backend TypeScript typecheck: **PASS**.
- Focused Deno workforce-hiring and Business-route regression suite: **PASS**.
- Complete Player Terminal verification: **PASS**.
- The workflow verified the origin branch had not moved, then committed the exact tested working tree as the certified source above.
- No architecture-ratchet baseline was relaxed.

### Phase 4B exit result

- Authoritative candidate pool: **met**.
- Candidate-only server-owned hiring: **met**.
- Browser-authored employee economics removed: **met**.
- Cross-game/ownership scope and public-key boundary: **met**.
- Transactional concurrency and idempotency: **met**.
- Durable source commit and execution-log evidence: **met**.

### Carry-forward scope

1. Bind production orders to eligible role-specific labor capacity.
2. Reserve and release finite employee labor without double booking.
3. Accrue wage obligations from authoritative employment/execution state without charging production a second time.
4. Settle payroll deterministically through Business Checking, including explicit partial-funding/unpaid-wage recovery behavior.
5. Publish utilization and idle-capacity read models without exposing internal identifiers.

### Next authorized step

**Phase 4C — production-labor integration and deterministic payroll settlement is OPEN.** It must be developed on a stacked branch from this certified Phase 4B lineage and must not be declared complete until its implementation, exact source, required tests, and execution-log entry are all durable.

---

'''
              log = log.replace(anchor, anchor + entry, 1)
          log_path.write_text(log, encoding="utf-8")
          PY

      - name: Remove one-use certification workflow
        run: rm -f .github/workflows/business-phase4b-certify-pr.yml

      - name: Verify retained Phase 4B contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/business-workforce-hiring-contract.mjs
          node scripts/business-banking-runtime-contract.mjs
          node scripts/validate-supabase-migrations.mjs
          git diff --check

      - name: Commit durable Phase 4B certification
        env:
          START_SHA: ${{ steps.start.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$FEATURE_BRANCH"
          test "$(git rev-parse origin/$FEATURE_BRANCH)" = "$START_SHA"
          git config user.name econovaria-phase4b-certifier
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "docs(business): certify Phase 4B workforce hiring"
          git push origin HEAD:"$FEATURE_BRANCH"
