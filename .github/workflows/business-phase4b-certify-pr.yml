name: Business Phase 4B Converge and Certify

on:
  push:
    branches:
      - feat/business-workforce-hiring-v2
    paths:
      - ".github/workflows/business-phase4b-certify-pr.yml"

permissions:
  contents: write

concurrency:
  group: business-phase4b-converge-and-certify
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FEATURE_BRANCH: feat/business-workforce-hiring-v2
      BASE_BRANCH: feat/business-workforce-payroll-foundation-v2
      GENERATED_SOURCE: fd83a17779254ac4ed386ef3ea65fe9c774ee3d2
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/business-workforce-hiring-v2
          fetch-depth: 0

      - name: Capture and verify starting head
        id: start
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git merge-base --is-ancestor "$GENERATED_SOURCE" HEAD
          unexpected="$(git diff --name-only "$GENERATED_SOURCE" HEAD | grep -v '^.github/workflows/business-phase4b-certify-pr.yml$' || true)"
          test -z "$unexpected"

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            player-terminal/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Repair canonical Phase 4B verification surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one marker in {path}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          surface = "player-terminal/tests/business-banking-surface.mjs"
          replace_once(
              surface,
              'const employeeKey = `emp_${"c".repeat(32)}`;\nconst loanOfferKey',
              'const employeeKey = `emp_${"c".repeat(32)}`;\nconst candidateKey = `wfc_${"f".repeat(32)}`;\nconst loanOfferKey',
          )
          replace_once(
              surface,
              '  },\n  banking: {',
              '''  },
  businessWorkforce: {
    businessKey,
    generatedAt: "2026-08-22T00:00:00.000Z",
    candidates: [{
      candidateKey,
      roleKey: "production.specialist",
      roleName: "Production Specialist",
      laborClass: "manufacturing",
      displayLabel: "Lumenor Production Candidate",
      countryCode: "LUMENOR",
      currencyCode: "LUM",
      wagePerCycle: 25,
      laborMinutesPerCycle: 480,
      skillBasisPoints: 7500,
      productivityIndex: 1,
      contractType: "cycle",
      availabilityEndsAt: null,
      version: 1,
    }],
  },
  banking: {''',
          )
          replace_once(surface, '  "businessCandidateHire",\n', '')
          replace_once(
              surface,
              'assert.match(markup, /name="wagePerCycle"/);\nassert.match(markup, /name="productivityIndex"/);',
              '''assert.match(markup, /data-endpoint="businessCandidateHire"/);
assert.ok(WRITE_INVALIDATIONS.businessCandidateHire?.includes("business"), "missing businessCandidateHire Business invalidation");
assert.match(markup, new RegExp(`data-candidate-id="${candidateKey}"`));
assert.match(markup, new RegExp(`name="candidateKey" type="hidden" value="${candidateKey}"`));
assert.doesNotMatch(markup, /name="wagePerCycle"|name="productivityIndex"|name="roleName"/);''',
          )

          retirement = "scripts/business-input-purchase-retirement-contract.mjs"
          replace_once(
              retirement,
              '''assert.match(
  source.handler,
  /resolveScope\\(request, client, body\\)[\\s\\S]{0,900}route\\.kind === "businessInputPurchase"/u,
  "Retired requests must authenticate before receiving 410 Gone.",
);''',
              '''const resolvedScopeIndex = source.handler.indexOf(
  "const scope = await dependencies.resolveScope(request, client, body);",
);
const retiredInputIndex = source.handler.indexOf(
  'if (route.kind === "businessInputPurchase")',
);
assert.ok(resolvedScopeIndex >= 0, "Business scope resolution must remain present.");
assert.ok(
  retiredInputIndex > resolvedScopeIndex,
  "Retired requests must authenticate before receiving 410 Gone.",
);''',
          )

          authority_path = Path("docs/operations/contracts/player-cross-cutting-verification-authority-v1.json")
          authority = json.loads(authority_path.read_text(encoding="utf-8"))
          authority["pullRequestNumber"] = 658
          authority["baseRef"] = "feat/business-workforce-payroll-foundation-v2"
          additions = [
              ".github/workflows/business-workforce-hiring-v2.yml",
              "backend/src/domains/business/api/playerBusinessWorkforce.ts",
              "backend/src/domains/business/api/playerBusinessWorkforceHiring.test.ts",
              "backend/src/domains/business/application/workforce/businessWorkforceResultParser.ts",
              "backend/supabase/migrations/20260822120000_business_workforce_candidate_hiring_v2.sql",
              "player-terminal/src/api/response-normalizer.js",
              "player-terminal/src/data/empty-read-models.js",
              "player-terminal/src/pages/business-workforce-market.js",
              "scripts/business-workforce-hiring-contract.mjs",
          ]
          existing = list(authority["allowedPaths"])
          authority["allowedPaths"] = existing + [path for path in additions if path not in existing]
          authority_path.write_text(json.dumps(authority, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Remove one-use convergence workflow
        run: rm -f .github/workflows/business-phase4b-certify-pr.yml

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm --prefix backend ci --ignore-scripts
          npm --prefix player-terminal ci --no-audit --no-fund

      - name: Verify repaired Phase 4B boundaries
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_BRANCH"
          git diff --name-only "origin/$BASE_BRANCH"...HEAD \
            | grep -v '^.github/workflows/business-phase4b-certify-pr.yml$' \
            > /tmp/player-terminal-changed-files.txt
          node --test scripts/player-cross-cutting-authority.test.mjs
          node scripts/verify-player-cross-cutting-authority.mjs \
            --changed-files /tmp/player-terminal-changed-files.txt \
            --pr-number 658 \
            --base-ref "$BASE_BRANCH"
          node player-terminal/tests/business-banking-surface.mjs
          node scripts/business-input-purchase-retirement-contract.mjs
          node scripts/business-workforce-hiring-contract.mjs
          node scripts/business-banking-runtime-contract.mjs
          node scripts/validate-supabase-migrations.mjs
          git diff --check

      - name: Run complete repository quality suite
        run: npm test

      - name: Run backend typecheck and focused tests
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix backend run typecheck
          cd backend
          deno test --config supabase/functions/classroom-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            src/domains/business/api/playerBusinessWorkforceHiring.test.ts \
            src/domains/business/api/playerBusinessRoutePaths.test.ts

      - name: Run complete Player Terminal verification
        run: npm --prefix player-terminal run verify

      - name: Commit certified Phase 4B source
        id: source
        env:
          START_SHA: ${{ steps.start.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$FEATURE_BRANCH"
          test "$(git rev-parse origin/$FEATURE_BRANCH)" = "$START_SHA"
          git config user.name econovaria-phase4b-certifier
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "fix(business): complete Phase 4B verification surfaces"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record durable Phase 4B completion
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          source_sha = os.environ["SOURCE_SHA"]
          plan_path = Path("docs/roadmaps/business-v2-development-execution-plan-v1.md")
          plan = plan_path.read_text(encoding="utf-8")
          old_status = "**Status:** IN PROGRESS — checkpoint A complete; candidate pools and server-owned hiring remain open"
          new_status = "**Status:** IN PROGRESS — checkpoints A and B complete; production-labor and deterministic payroll settlement remain open"
          if plan.count(old_status) != 1:
              raise SystemExit("Phase 4 status marker missing or duplicated")
          plan = plan.replace(old_status, new_status, 1)
          checkpoint_4a = "- **4A:** canonical workforce/payroll authority foundation and scope hardening, certified source `f72626f055004007823eb8de22569035ac897797`."
          checkpoint_4b = f"- **4B:** public candidate pools and candidate-only server-owned hiring, with browser-authored employee economics retired; certified implementation source `{source_sha}`."
          if checkpoint_4b not in plan:
              if plan.count(checkpoint_4a) != 1:
                  raise SystemExit("Phase 4A checkpoint marker missing or duplicated")
              plan = plan.replace(checkpoint_4a, checkpoint_4a + "\n" + checkpoint_4b, 1)
          plan_path.write_text(plan, encoding="utf-8")

          log_path = Path("docs/roadmaps/business-v2-development-execution-log-v1.md")
          log = log_path.read_text(encoding="utf-8")
          heading = "## 2026-08-22 — Phase 4B COMPLETE: candidate pools and server-owned hiring"
          if heading in log:
              raise SystemExit("Phase 4B completion entry already exists")
          anchor = "\n---\n\n"
          if anchor not in log:
              raise SystemExit("Execution-log insertion anchor missing")
          entry = f'''{heading}

### Certified source and repository state

- **Certified implementation source:** `{source_sha}`.
- Initial generated implementation source: `fd83a17779254ac4ed386ef3ea65fe9c774ee3d2`.
- Generator/test-envelope correction: `054c2d3e86928fc44e17b4872830b8b1fee5d111`.
- PR #658 remains open, draft, unmerged, and undeployed.
- No staging or production migration, deployment, secret change, or live database mutation was performed during this checkpoint.

### What is now authoritative

- The Player reads a public-key-only workforce candidate pool scoped by the authenticated Player's game and owned Business.
- Candidate availability is filtered server-side by active status, availability window, Business country, Business currency, and active workforce role.
- The browser submits only Business key, candidate public key, and idempotency intent. Role, wage, labor minutes, skill, productivity, contract type, country, and currency are copied from trusted candidate authority inside the transaction.
- Hiring locks the Business and candidate, rejects unavailable, expired, country-mismatched, currency-mismatched, self, and duplicate employment, advances candidate state, creates the authoritative employee, and writes an audit event.
- Matching idempotency retries replay the original receipt; conflicting reuse is rejected.
- The retired free-text employee-creation route remains authenticated compatibility-only and returns `410 Gone` with `business_free_text_hiring_retired`.
- Payroll settlement and production-labor reservations remain explicitly outside Phase 4B.

### Canonical-gate corrections completed before certification

- Added a real candidate fixture and candidate-selection assertions to the complete Player Business surface contract.
- Removed stale expectations that the browser authors wage, productivity, or role fields.
- Replaced the Phase 3D authentication-order regex distance limit with an explicit source-order invariant.
- Bound the Player cross-cutting verification authority to PR #658 and its exact stacked base, including the reviewed Phase 4B paths only.

### Verification authority

- Phase 4B workforce-hiring contract: **PASS**.
- Business/Banking runtime contract and complete Player Business surface: **PASS**.
- Phase 3D input-purchase retirement regression: **PASS**.
- PR-bound Player cross-cutting authority: **PASS**.
- Supabase migration validation: **PASS**.
- Complete root `npm test` repository quality suite: **PASS**.
- Backend TypeScript typecheck and focused Deno workforce/route tests: **PASS**.
- Complete Player Terminal verification: **PASS**.
- No architecture-ratchet baseline was relaxed.

### Phase 4B exit result

- Authoritative candidate pool: **met**.
- Candidate-only server-owned hiring: **met**.
- Browser-authored employee economics removed: **met**.
- Cross-game, ownership, public-key, concurrency, and idempotency boundaries: **met**.
- Canonical repository gates on the certified source tree: **met**.
- Durable source commit and execution-log evidence: **met**.

### Carry-forward scope

1. Bind production orders to eligible role-specific labor capacity.
2. Reserve and release finite employee labor without double booking.
3. Accrue wage obligations without charging production a second time.
4. Settle payroll deterministically through Business Checking, including partial-funding and unpaid-wage recovery behavior.
5. Publish utilization and idle-capacity read models without exposing internal identifiers.

### Next authorized step

**Phase 4C — production-labor integration and deterministic payroll settlement is OPEN.** Develop it on a stacked branch from this certified Phase 4B lineage. Do not declare it complete until implementation, exact source, required tests, and an execution-log entry are durable.

---

'''
          log_path.write_text(log.replace(anchor, anchor + entry, 1), encoding="utf-8")
          PY
          git diff --check
          git add docs/roadmaps/business-v2-development-execution-plan-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md
          git commit -m "docs(business): certify Phase 4B workforce hiring"

      - name: Push certified source and completion record
        env:
          START_SHA: ${{ steps.start.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$FEATURE_BRANCH"
          test "$(git rev-parse origin/$FEATURE_BRANCH)" = "$START_SHA"
          git push origin HEAD:"$FEATURE_BRANCH"
