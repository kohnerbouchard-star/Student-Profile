name: Business Store Seller Offers V2

on:
  pull_request:
    paths:
      - "backend/src/domains/store/contracts/storeSellerOfferContracts.ts"
      - "backend/src/domains/store/infrastructure/supabaseStoreSellerOfferRepository.ts"
      - "backend/src/domains/store/index.ts"
      - "backend/supabase/migrations/20260824100000_store_seller_offer_foundation_v2.sql"
      - "backend/supabase/migrations/20260824100010_store_seeded_offer_compatibility_v2.sql"
      - "backend/supabase/migrations/20260824100020_store_seller_offer_commands_v2.sql"
      - "backend/supabase/migrations/20260824100030_store_seller_offer_aggregation_v2.sql"
      - "backend/supabase/migrations/20260824100040_store_seller_offer_schema_assertions_v2.sql"
      - "backend/supabase/migrations/20260824100041_store_seller_offer_identity_assertions_v2.sql"
      - "docs/architecture/inventories/econovaria-architecture-inventory-v2.json"
      - "docs/roadmaps/business-phase7-store-seller-offers-scope-v1.md"
      - "scripts/business-phase7-store-seller-offers-contract.mjs"
      - "scripts/business-phase7-store-seller-offers-simulation.mjs"
      - "scripts/business-phase7-store-seller-offers-types.mjs"
      - ".github/workflows/business-store-seller-offers-v2.yml"
  push:
    branches: [main]
    paths:
      - "backend/src/domains/store/contracts/storeSellerOfferContracts.ts"
      - "backend/src/domains/store/infrastructure/supabaseStoreSellerOfferRepository.ts"
      - "backend/src/domains/store/index.ts"
      - "backend/supabase/migrations/20260824100000_store_seller_offer_foundation_v2.sql"
      - "backend/supabase/migrations/20260824100010_store_seeded_offer_compatibility_v2.sql"
      - "backend/supabase/migrations/20260824100020_store_seller_offer_commands_v2.sql"
      - "backend/supabase/migrations/20260824100030_store_seller_offer_aggregation_v2.sql"
      - "backend/supabase/migrations/20260824100040_store_seller_offer_schema_assertions_v2.sql"
      - "backend/supabase/migrations/20260824100041_store_seller_offer_identity_assertions_v2.sql"
      - "docs/architecture/inventories/econovaria-architecture-inventory-v2.json"
      - "scripts/business-phase7-store-seller-offers-contract.mjs"
      - "scripts/business-phase7-store-seller-offers-simulation.mjs"
      - "scripts/business-phase7-store-seller-offers-types.mjs"
      - ".github/workflows/business-store-seller-offers-v2.yml"

permissions:
  contents: read

concurrency:
  group: business-store-seller-offers-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-store-seller-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify seller-offer authority and deterministic concurrency
        shell: bash
        run: |
          set -euo pipefail
          node scripts/business-phase7-store-seller-offers-contract.mjs
          node scripts/business-phase7-store-seller-offers-simulation.mjs
          node --experimental-strip-types scripts/business-phase7-store-seller-offers-types.mjs
          node scripts/validate-supabase-migrations.mjs
          git diff --check

      - name: Verify deterministic architecture inventory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/architecture/build-architecture-inventory.mjs
          git diff --exit-code -- docs/architecture/inventories/econovaria-architecture-inventory-v2.json

      - name: Run repository quality suite
        run: npm test

  verify-retained-business-banking:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@2df3b36cfc17a5b6dcf742f86a14f08dc5b2f31b # v2
        with:
          deno-version: v2.9.3

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify retained Banking, Store, Inventory, and Business contracts
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test scripts/business-banking-economic-simulation.test.mjs
          node scripts/business-formation-authority-contract.mjs
          node scripts/business-banking-runtime-contract.mjs
          node player-terminal/tests/business-banking-surface.mjs
          node scripts/business-phase3b-store-procurement-contract.mjs

      - name: Verify focused Business Banking runtime
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          deno test --config supabase/functions/classroom-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            src/domains/business-banking/api/playerBusinessBankingRoutePaths.test.ts
          deno test --config supabase/functions/admin-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            supabase/functions/admin-api/businessBankingOperations.test.ts
          deno check --config supabase/functions/classroom-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            src/domains/business-banking/api/playerBusinessBankingHttpHandler.ts \
            src/domains/business-banking/api/playerBusinessBankingRoutePaths.ts \
            src/domains/business-banking/infrastructure/supabasePlayerBusinessBankingRepository.ts \
            src/domains/business-banking/domain/businessBankingEconomicSimulation.ts
          deno check --config supabase/functions/admin-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            supabase/functions/admin-api/index.ts

      - name: Verify Player route adapter syntax
        run: |
          node --check player-terminal/src/api/business-banking-backend-routes.js
          node --check player-terminal/src/pages/business-page.js
          node --check player-terminal/src/pages/banking-page.js
          node --check player-terminal/src/pages/loans-page.js

  verify-player-terminal-and-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: player-terminal/package-lock.json

      - name: Install Player Terminal dependencies
        working-directory: player-terminal
        run: npm ci --no-audit --no-fund

      - name: Verify standalone Player Terminal
        working-directory: player-terminal
        run: npm run verify

      - name: Install Chromium
        working-directory: player-terminal
        run: npx playwright install --with-deps chromium

      - name: Materialize browser-only runtime fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p player-terminal/frontend/src/core
          cp frontend/src/core/runtime-config.js player-terminal/frontend/src/core/runtime-config.js
          cat > player-terminal/runtime-config.env.js <<'EOF'
          window.__ECONOVARIA_RUNTIME_CONFIG__ = Object.freeze({
            environment: "development",
            projectRef: "runtimefixture123456",
            supabaseUrl: "https://runtimefixture123456.supabase.co",
            supabasePublishableKey: "sb_publishable_runtime_fixture_1234567890"
          });
          EOF

      - name: Run Chromium browser verification
        working-directory: player-terminal
        run: npm run browser
