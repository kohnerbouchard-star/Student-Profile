name: Business Phase 9A Contract Split Executor

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/business-phase9a-contract-split-executor.yml"

permissions:
  contents: write

concurrency:
  group: business-phase9a-contract-split-executor
  cancel-in-progress: false

jobs:
  execute-split:
    if: >-
      github.event.pull_request.number == 664 &&
      github.event.pull_request.head.ref == 'feat/business-store-withdrawal-safety-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out Phase 9A branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/business-store-withdrawal-safety-v2
          fetch-depth: 0

      - name: Verify exact bounded trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%s)" = "ops(business): execute Phase 9A contract split"
          git merge-base --is-ancestor \
            7dd690f81b1265ff8f569f03a5ae66cb38595158 HEAD

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Install deterministic tooling
        run: |
          npm install --global npm@10.9.8
          npm ci --ignore-scripts
          npm --prefix backend ci --ignore-scripts

      - name: Execute reviewed contract split
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEXTRACT'
          from pathlib import Path

          source = Path(
              '.github/workflows/business-phase9a-contract-split.yml'
          ).read_text().splitlines()
          start = next(
              i for i, line in enumerate(source)
              if line.strip() == "python3 - <<'PY'"
          )
          end = next(
              i for i in range(start + 1, len(source))
              if source[i].strip() == 'PY'
          )
          body = [
              line[10:] if line.startswith('          ') else line
              for line in source[start + 1:end]
          ]
          Path('/tmp/business-phase9a-contract-split.py').write_text(
              '\n'.join(body) + '\n'
          )
          PYEXTRACT
          python3 /tmp/business-phase9a-contract-split.py

          test "$(wc -l < backend/src/domains/store/contracts/storeWithdrawalContracts.ts)" -lt 500
          test "$(wc -l < backend/src/domains/store/contracts/storeWithdrawalContractPrimitives.ts)" -lt 500
          node --experimental-strip-types \
            scripts/business-phase9-store-withdrawal-safety-types.mjs
          node scripts/business-phase9-store-withdrawal-safety-contract.mjs
          npm --prefix backend run typecheck:all
          node scripts/architecture/build-architecture-inventory.mjs
          node scripts/architecture/architecture-ratchet-v2.mjs
          git diff --check

      - name: Commit maintainability repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "econovaria-automation"
          git config user.email "econovaria-automation@users.noreply.github.com"
          git add \
            backend/src/domains/store/contracts/storeWithdrawalContracts.ts \
            backend/src/domains/store/contracts/storeWithdrawalContractPrimitives.ts \
            docs/architecture/inventories/econovaria-architecture-inventory-v2.json
          git diff --cached --quiet && { echo "No contract split was produced." >&2; exit 1; }
          git commit -m "refactor(store): split withdrawal contract primitives"
          git push origin HEAD:feat/business-store-withdrawal-safety-v2
