name: Admin V2 News & Events

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/admin-v2-news-events.yml"
      - "admin/v2.html"
      - "admin/v2/src/app.js"
      - "admin/v2/src/core/**"
      - "admin/v2/src/components/**"
      - "admin/v2/src/routes/news-events/**"
      - "admin/v2/styles/**"
      - "backend/supabase/functions/admin-api/worldRuntimeOperations*.ts"
      - "scripts/admin-v2-news-events*.mjs"
      - "scripts/admin-v2-unit.test.mjs"

permissions:
  contents: read

concurrency:
  group: admin-v2-news-events-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  news-events:
    name: News & Events contract and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Pin npm
        shell: bash
        run: |
          set -euo pipefail
          for ATTEMPT in 1 2 3; do
            if npm install --global npm@10.9.8; then
              exit 0
            fi
            sleep $((ATTEMPT * 5))
          done
          exit 1

      - name: Install repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          for ATTEMPT in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            sleep $((ATTEMPT * 5))
          done
          exit 1

      - name: Verify News & Events source and contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check admin/v2/src/routes/news-events/NewsEventsApi.js
          node --check admin/v2/src/routes/news-events/NewsEventsController.js
          node --check admin/v2/src/routes/news-events/NewsEventsRoute.js
          node --check scripts/admin-v2-news-events-browser-smoke.mjs
          node --check scripts/admin-v2-news-events-permission-smoke.mjs
          node --test scripts/admin-v2-news-events.test.mjs
          npm run test:admin-v2
          git diff --check origin/main...HEAD

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          for ATTEMPT in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            sleep $((ATTEMPT * 5))
          done
          exit 1

      - name: Exercise responsive News & Events
        env:
          ADMIN_V2_EVIDENCE_DIR: /tmp/admin-v2-news-events-evidence
        run: node scripts/admin-v2-news-events-browser-smoke.mjs

      - name: Exercise News & Events permission denial
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/admin-v2-news-events-evidence
          node scripts/admin-v2-news-events-permission-smoke.mjs \
            | tee /tmp/admin-v2-news-events-evidence/admin-v2-news-events-permission-results.json

      - name: Upload News & Events browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-v2-news-events-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/admin-v2-news-events-evidence/
          if-no-files-found: warn
          retention-days: 30
