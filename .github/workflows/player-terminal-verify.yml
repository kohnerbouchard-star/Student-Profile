name: Player Terminal Verify

on:
  pull_request:
    paths:
      - "api/_player-bff-proxy.js"
      - "player-terminal/**"
      - "frontend/src/core/runtime-config.js"
      - "docs/operations/environments/runtime-config.env.template.js"
      - "backend/supabase/functions/player-api/**"
      - "backend/supabase/functions/player-web-session-api/**"
      - "docs/operations/contracts/player-cross-cutting-verification-authority-v1.json"
      - "docs/operations/evidence/player-login-production-secret-trigger-v1.json"
      - "scripts/runtime-config-contract.test.mjs"
      - "scripts/environment-neutral-browser-integration.test.mjs"
      - "scripts/security-audit-remediation-contract.test.mjs"
      - "scripts/player-api-read-resilience.test.mjs"
      - "scripts/player-bff-retry-classification.test.mjs"
      - "scripts/player-edge-trusted-ip-entrypoint-contract.test.mjs"
      - "scripts/player-production-secret-provision-contract.test.mjs"
      - "scripts/player-cross-cutting-authority.test.mjs"
      - "scripts/verify-player-cross-cutting-authority.mjs"
      - "scripts/local-edge-runtime-isolation.mjs"
      - "scripts/local-edge-runtime-isolation.test.mjs"
      - "scripts/business-banking-player-world-browser-acceptance.mjs"
      - "scripts/business-banking-player-commerce-browser-acceptance.mjs"
      - "scripts/business-banking-player-inventory-browser-acceptance.mjs"
      - "scripts/player-contracts-browser-acceptance.mjs"
      - "scripts/business-banking-player-market-browser-acceptance.mjs"
      - "scripts/business-banking-player-business-browser-acceptance.mjs"
      - ".github/workflows/player-terminal-verify.yml"
      - ".github/workflows/production-web-session-secrets.yml"
  push:
    branches:
      - main
    paths:
      - "api/_player-bff-proxy.js"
      - "player-terminal/**"
      - "frontend/src/core/runtime-config.js"
      - "docs/operations/environments/runtime-config.env.template.js"
      - "backend/supabase/functions/player-api/**"
      - "backend/supabase/functions/player-web-session-api/**"
      - "docs/operations/contracts/player-cross-cutting-verification-authority-v1.json"
      - "docs/operations/evidence/player-login-production-secret-trigger-v1.json"
      - "scripts/runtime-config-contract.test.mjs"
      - "scripts/environment-neutral-browser-integration.test.mjs"
      - "scripts/security-audit-remediation-contract.test.mjs"
      - "scripts/player-api-read-resilience.test.mjs"
      - "scripts/player-bff-retry-classification.test.mjs"
      - "scripts/player-edge-trusted-ip-entrypoint-contract.test.mjs"
      - "scripts/player-production-secret-provision-contract.test.mjs"
      - "scripts/player-cross-cutting-authority.test.mjs"
      - "scripts/verify-player-cross-cutting-authority.mjs"
      - "scripts/local-edge-runtime-isolation.mjs"
      - "scripts/local-edge-runtime-isolation.test.mjs"
      - "scripts/business-banking-player-world-browser-acceptance.mjs"
      - "scripts/business-banking-player-commerce-browser-acceptance.mjs"
      - "scripts/business-banking-player-inventory-browser-acceptance.mjs"
      - "scripts/player-contracts-browser-acceptance.mjs"
      - "scripts/business-banking-player-market-browser-acceptance.mjs"
      - "scripts/business-banking-player-business-browser-acceptance.mjs"
      - ".github/workflows/player-terminal-verify.yml"
      - ".github/workflows/production-web-session-secrets.yml"

permissions:
  contents: read

concurrency:
  group: player-terminal-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize pull-request scope
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          git diff --name-only "origin/$BASE_REF"...HEAD > /tmp/player-terminal-changed-files.txt

          if node player-terminal/tools/verify-pr-scope.mjs /tmp/player-terminal-changed-files.txt; then
            echo "Player verification is operating under the isolated Player scope contract."
          else
            node --test scripts/player-cross-cutting-authority.test.mjs
            node scripts/verify-player-cross-cutting-authority.mjs \
              --changed-files /tmp/player-terminal-changed-files.txt \
              --pr-number "$PR_NUMBER" \
              --base-ref "$BASE_REF"
          fi

      - name: Validate Player boundary contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            scripts/player-edge-trusted-ip-entrypoint-contract.test.mjs \
            scripts/player-production-secret-provision-contract.test.mjs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: player-terminal/package-lock.json

      - name: Validate bounded Player read resilience
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            scripts/player-api-read-resilience.test.mjs \
            scripts/player-bff-retry-classification.test.mjs \
            scripts/local-edge-runtime-isolation.test.mjs

      - name: Install package dependencies
        working-directory: player-terminal
        run: npm ci --no-audit --no-fund

      - name: Verify standalone player terminal
        id: player-terminal-verify
        working-directory: player-terminal
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee "$RUNNER_TEMP/player-terminal-verify.log"

      - name: Install Chromium
        if: success()
        working-directory: player-terminal
        run: npx playwright install --with-deps chromium

      - name: Materialize browser-only runtime fixture
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p player-terminal/frontend/src/core
          cp frontend/src/core/runtime-config.js player-terminal/frontend/src/core/runtime-config.js
          cat > player-terminal/runtime-config.env.js <<'EOF'
          window.__ECONOVARIA_RUNTIME_CONFIG__ = Object.freeze({
            environment: "development",
            projectRef: "runtimefixture123456",
            supabaseUrl: "https://runtimefixture123456.supabase.co",
            supabasePublishableKey: "sb_publishable_runtime_fixture_1234567890"
          });
          EOF

      - name: Run Chromium browser verification
        if: success()
        id: player-terminal-browser
        working-directory: player-terminal
        shell: bash
        run: |
          set -o pipefail
          npm run browser 2>&1 | tee "$RUNNER_TEMP/player-terminal-browser.log"

      - name: Upload failed verification log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: player-terminal-verify-log
          path: ${{ runner.temp }}/player-terminal-verify.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failed browser artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: player-terminal-browser-failure
          path: |
            ${{ runner.temp }}/player-terminal-browser.log
            player-terminal/playwright-report/
            player-terminal/test-results/
          if-no-files-found: warn
          retention-days: 7
