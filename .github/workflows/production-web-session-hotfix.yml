name: Production Web Session Hotfix

on:
  push:
    branches:
      - agent/production-web-session-hotfix
    paths:
      - ".github/workflows/production-web-session-hotfix.yml"
      - "backend/supabase/functions/web-session-api/**"
      - "backend/supabase/functions/_shared/**"
      - "backend/src/domains/auth/**"
      - "backend/src/platform/supabase/**"
      - "backend/src/security/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-web-session-hotfix
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify production web-session-api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      EXPECTED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
      SUPABASE_PROJECT_REF: cgiukdjwicykrmtkhudh
      PRODUCTION_ORIGIN: https://econovaria.vercel.app
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out exact hotfix source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce production boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$SUPABASE_PROJECT_REF" = "$EXPECTED_PRODUCTION_PROJECT_REF"
          test "$SUPABASE_PROJECT_REF" != "eecvbssdvarfcykcfrny"
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          [[ "$PRODUCTION_ORIGIN" == https://* ]]
          echo "SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Validate CLI contracts
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy --help >/tmp/functions-deploy-help.txt
          supabase secrets list --help >/tmp/secrets-list-help.txt
          supabase secrets set --help >/tmp/secrets-set-help.txt
          grep -q -- "--project-ref" /tmp/functions-deploy-help.txt
          grep -q -- "--no-verify-jwt" /tmp/functions-deploy-help.txt
          grep -q -- "--use-api" /tmp/functions-deploy-help.txt
          grep -q -- "--project-ref" /tmp/secrets-list-help.txt
          grep -q -- "--project-ref" /tmp/secrets-set-help.txt

      - name: Configure production web-session secrets
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" > /tmp/production-secrets.txt

          supabase secrets set \
            "ECONOVARIA_WEB_ALLOWED_ORIGINS=$PRODUCTION_ORIGIN" \
            --project-ref "$SUPABASE_PROJECT_REF"

          if ! grep -q 'ECONOVARIA_WEB_SESSION_ENCRYPTION_KEY' /tmp/production-secrets.txt; then
            session_key="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
            test "${#session_key}" -eq 43
            echo "::add-mask::$session_key"
            supabase secrets set \
              "ECONOVARIA_WEB_SESSION_ENCRYPTION_KEY=$session_key" \
              --project-ref "$SUPABASE_PROJECT_REF"
            unset session_key
          fi

          rm -f /tmp/production-secrets.txt

      - name: Deploy production web-session-api
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy web-session-api \
            --workdir backend \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api

      - name: Verify production health and login routing
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            "$SUPABASE_URL/functions/v1/web-session-api/health" \
            > /tmp/web-session-health.json

          node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/web-session-health.json', 'utf8'));
          if (body.ok !== true || body.service !== 'web-session-api') {
            throw new Error('Production web-session health contract failed.');
          }
          NODE

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
            > /tmp/production-api-keys.json

          publishable_key="$(node - <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/production-api-keys.json', 'utf8'));
          const match = rows.find((row) =>
            String(row.api_key || '').startsWith('sb_publishable_') &&
            (row.type === 'publishable' || row.name === 'default' || row.name === 'publishable')
          ) || rows.find((row) => String(row.api_key || '').startsWith('sb_publishable_'));
          process.stdout.write(match?.api_key || '');
          NODE
          )"
          test -n "$publishable_key"
          echo "::add-mask::$publishable_key"

          status="$(curl --silent --show-error \
            --output /tmp/web-session-login-probe.json \
            --write-out '%{http_code}' \
            --request POST \
            "$SUPABASE_URL/functions/v1/web-session-api/login" \
            -H "apikey: $publishable_key" \
            -H "Origin: $PRODUCTION_ORIGIN" \
            -H "Content-Type: application/json" \
            --data '{}')"

          test "$status" = "400"
          node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/web-session-login-probe.json', 'utf8'));
          const code = String(body?.error?.code || '');
          if (!code || ['route_not_found', 'missing_edge_runtime_config', 'web_session_failed'].includes(code)) {
            throw new Error(`Unexpected production login probe response: ${code || 'missing code'}`);
          }
          NODE

          rm -f \
            /tmp/web-session-health.json \
            /tmp/production-api-keys.json \
            /tmp/web-session-login-probe.json
          unset publishable_key

      - name: Record production hotfix result
        shell: bash
        run: |
          {
            echo '## Production web-session hotfix'
            echo '- Project binding: `cgiukdjwicykrmtkhudh`'
            echo '- Deployed function: `web-session-api`'
            echo '- Platform JWT verification: `false` (custom publishable-key and session validation)'
            echo '- Health probe: `pass`'
            echo '- Login route probe: `pass`'
            echo '- Database schema modified: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
