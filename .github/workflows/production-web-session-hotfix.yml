name: Web Session Recovery Candidate

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/production-web-session-hotfix.yml"
      - ".github/workflows/production-web-session-deploy.yml"
      - ".github/workflows/production-web-session-secrets.yml"
      - "docs/operations/evidence/production-web-session-recovery-v1.json"
      - "backend/supabase/functions/web-session-api/**"
      - "backend/supabase/functions/_shared/**"
      - "backend/src/domains/auth/**"
      - "backend/src/platform/supabase/**"
      - "backend/src/security/**"
      - "scripts/web-session-release-contract.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "backend/package.json"
      - "backend/package-lock.json"
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Exact merged main commit to package"
        required: true
        type: string
      confirm_staging_project_ref:
        description: "Type the exact staging project ref"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: web-session-recovery-candidate
  cancel-in-progress: false

env:
  AUTHORIZATION_PATH: docs/operations/evidence/production-web-session-recovery-v1.json
  EXPECTED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  DENIED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  SOURCE_FUNCTION_NAME: web-session-api
  CANDIDATE_FUNCTION_NAME: web-session-api
  SUPABASE_CLI_VERSION: 2.109.1
  PRODUCTION_ORIGIN: https://econovaria.vercel.app
  TRUSTED_CLIENT_IP_HEADER: x-real-ip

jobs:
  validate-and-package:
    name: Validate and package immutable web-session source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      source_commit: ${{ steps.identity.outputs.source_commit }}
      source_sha256: ${{ steps.package.outputs.source_sha256 }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce source identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          [[ "$source_commit" =~ ^[a-f0-9]{40}$ ]]
          test "$SOURCE_FUNCTION_NAME" = "$CANDIDATE_FUNCTION_NAME"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$GITHUB_REF" = "refs/heads/main"
            test "$source_commit" = "${{ inputs.source_commit }}"
            test "${{ inputs.confirm_staging_project_ref }}" = "$EXPECTED_STAGING_PROJECT_REF"
            test "$EXPECTED_STAGING_PROJECT_REF" != "$DENIED_PRODUCTION_PROJECT_REF"
            git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
            git merge-base --is-ancestor "$source_commit" origin/main
          fi
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install repository tooling
        run: npm ci

      - name: Install backend tooling
        run: npm --prefix backend ci

      - name: Run web-session release contract
        run: npm run test:web-session-release

      - name: Run authentication boundary tests
        run: npm run test:auth-boundaries

      - name: Typecheck backend
        run: npm --prefix backend run typecheck

      - name: Scan committed source for credentials
        run: npm run security:secrets

      - name: Package deterministic tracked source
        id: package
        shell: bash
        run: |
          set -euo pipefail
          source_commit="${{ steps.identity.outputs.source_commit }}"
          mkdir -p dist/production-web-session
          git archive \
            --format=tar \
            --prefix=backend/ \
            "$source_commit:backend" | gzip -n \
            > dist/production-web-session/backend-source.tgz
          source_sha256="$(sha256sum dist/production-web-session/backend-source.tgz | awk '{print $1}')"
          [[ "$source_sha256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$source_sha256" "backend-source.tgz" \
            > dist/production-web-session/backend-source.tgz.sha256
          cp "$AUTHORIZATION_PATH" dist/production-web-session/authorization.json
          SOURCE_SHA256="$source_sha256" SOURCE_COMMIT="$source_commit" node - <<'NODE'
          const fs = require('node:fs');
          const manifest = {
            schemaVersion: 1,
            sourceCommit: process.env.SOURCE_COMMIT,
            sourceRef: 'refs/heads/main',
            sourceSha256: process.env.SOURCE_SHA256,
            sourceFunctionName: process.env.SOURCE_FUNCTION_NAME,
            candidateFunctionName: process.env.CANDIDATE_FUNCTION_NAME,
            stagingProjectRef: process.env.EXPECTED_STAGING_PROJECT_REF,
            deniedProductionProjectRef: process.env.DENIED_PRODUCTION_PROJECT_REF,
            verifyJwt: false,
            trackedGitTreeOnly: true,
            repositoryLocalModuleGraph: true,
            privateRemoteImports: false,
            dataUrlImports: false,
            identicalFunctionIdentityAcrossEnvironments: true,
          };
          fs.writeFileSync(
            'dist/production-web-session/build-manifest.json',
            `${JSON.stringify(manifest, null, 2)}\n`,
          );
          NODE
          echo "source_sha256=$source_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload immutable candidate source
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: production-web-session-${{ steps.identity.outputs.source_commit }}
          path: dist/production-web-session
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

  deploy-staging-candidate:
    name: Deploy and verify staging candidate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Enforce staging-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "${{ inputs.confirm_staging_project_ref }}" = "$EXPECTED_STAGING_PROJECT_REF"
          test "$EXPECTED_STAGING_PROJECT_REF" != "$DENIED_PRODUCTION_PROJECT_REF"
          test "$SOURCE_FUNCTION_NAME" = "$CANDIDATE_FUNCTION_NAME"
          test "$PRODUCTION_ORIGIN" = "https://econovaria.vercel.app"
          test "$TRUSTED_CLIENT_IP_HEADER" = "x-real-ip"

      - name: Download exact immutable source
        uses: actions/download-artifact@v8
        with:
          name: production-web-session-${{ needs.validate-and-package.outputs.source_commit }}
          path: dist/production-web-session

      - name: Verify and restore artifact
        shell: bash
        run: |
          set -euo pipefail
          cd dist/production-web-session
          sha256sum --check backend-source.tgz.sha256
          test "$(awk '{print $1}' backend-source.tgz.sha256)" = "${{ needs.validate-and-package.outputs.source_sha256 }}"
          cd "$GITHUB_WORKSPACE"
          rm -rf backend
          tar -xzf dist/production-web-session/backend-source.tgz
          test -f backend/supabase/functions/web-session-api/index.ts
          ! grep -R --line-number --fixed-strings 'raw.githubusercontent.com/kohnerbouchard-star/Student-Profile' \
            backend/supabase/functions/web-session-api \
            backend/supabase/functions/_shared \
            backend/src/domains/auth \
            backend/src/platform/supabase \
            backend/src/security
          ! grep -R --line-number --fixed-strings 'data:text/javascript' \
            backend/supabase/functions/web-session-api \
            backend/supabase/functions/_shared \
            backend/src/domains/auth \
            backend/src/platform/supabase \
            backend/src/security

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Configure bounded staging web-session settings
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set \
            "ECONOVARIA_WEB_ALLOWED_ORIGINS=$PRODUCTION_ORIGIN" \
            "ECONOVARIA_TRUSTED_CLIENT_IP_HEADER=$TRUSTED_CLIENT_IP_HEADER" \
            --project-ref "$EXPECTED_STAGING_PROJECT_REF"

      - name: Deploy exact function identity to staging
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy "$SOURCE_FUNCTION_NAME" \
            --workdir backend \
            --project-ref "$EXPECTED_STAGING_PROJECT_REF" \
            --no-verify-jwt \
            --use-api

      - name: Verify staging startup and request contracts
        shell: bash
        run: |
          set -euo pipefail
          base="https://${EXPECTED_STAGING_PROJECT_REF}.supabase.co/functions/v1/${SOURCE_FUNCTION_NAME}"
          health_status="$(curl --silent --show-error --output "$RUNNER_TEMP/health.json" --write-out '%{http_code}' "$base/health")"
          test "$health_status" = "200"
          node -e 'const b=require(process.argv[1]); if(b.ok!==true||b.status!=="ready") process.exit(1)' "$RUNNER_TEMP/health.json"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_PROJECT_REF/api-keys?reveal=true" \
            > "$RUNNER_TEMP/api-keys.json"
          publishable_key="$(node - <<'NODE'
          const rows = require(process.env.KEYS_PATH);
          const row = rows.find((v) => String(v.api_key || '').startsWith('sb_publishable_')) ||
            rows.find((v) => v.name === 'anon' || v.type === 'anon');
          process.stdout.write(String(row?.api_key || row?.apiKey || ''));
          NODE
          )"
          test -n "$publishable_key"
          echo "::add-mask::$publishable_key"

          invalid_status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/invalid.json" \
            --write-out '%{http_code}' \
            --request POST "$base/login" \
            -H "apikey: $publishable_key" \
            -H "Origin: https://econovaria.vercel.app" \
            -H "Content-Type: application/json" \
            --data '{}')"
          test "$invalid_status" = "400"
          node - <<'NODE'
          const body = require(process.env.INVALID_PATH);
          const code = String(body?.error?.code || '');
          if (!code || code === 'web_session_failed' || code === 'WORKER_ERROR') process.exit(1);
          NODE

          rm -f "$RUNNER_TEMP/health.json" "$RUNNER_TEMP/api-keys.json" "$RUNNER_TEMP/invalid.json"
          unset publishable_key
        env:
          KEYS_PATH: ${{ runner.temp }}/api-keys.json
          INVALID_PATH: ${{ runner.temp }}/invalid.json

      - name: Record candidate deployment digest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/functions.json"
          CANDIDATE_DIGEST="$(node - <<'NODE'
          const rows = require(process.env.FUNCTIONS_PATH);
          const row = rows.find((v) => v.slug === process.env.SOURCE_FUNCTION_NAME);
          const digest = String(row?.ezbr_sha256 || '');
          if (!/^[a-f0-9]{64}$/.test(digest) || row?.verify_jwt !== false) process.exit(1);
          process.stdout.write(digest);
          NODE
          )"
          {
            echo '## Staging web-session candidate verified'
            echo "- Source ref: \`$GITHUB_REF\`"
            echo "- Source commit: \`${{ needs.validate-and-package.outputs.source_commit }}\`"
            echo "- Source SHA-256: \`${{ needs.validate-and-package.outputs.source_sha256 }}\`"
            echo "- Candidate digest: \`$CANDIDATE_DIGEST\`"
            echo "- Function identity: \`$SOURCE_FUNCTION_NAME\`"
            echo '- Tracked Git tree only: `true`'
            echo '- Health: `200 ready`'
            echo '- Invalid input: `400 controlled`'
            echo '- Production changed: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/functions.json"
        env:
          FUNCTIONS_PATH: ${{ runner.temp }}/functions.json
