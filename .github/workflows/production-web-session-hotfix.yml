name: Production Web Session Build

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/production-web-session-hotfix.yml"
      - ".github/workflows/production-web-session-deploy.yml"
      - "docs/operations/evidence/production-web-session-hotfix-v1.json"
      - "backend/supabase/functions/web-session-api/**"
      - "backend/supabase/functions/_shared/**"
      - "backend/src/domains/auth/**"
      - "backend/src/platform/supabase/**"
      - "backend/src/security/**"
      - "package.json"
      - "package-lock.json"
      - "backend/package.json"
      - "backend/package-lock.json"
  push:
    branches:
      - main
    paths:
      - "docs/operations/evidence/production-web-session-hotfix-v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-web-session-build-${{ github.ref }}
  cancel-in-progress: false

env:
  AUTHORIZATION_PATH: docs/operations/evidence/production-web-session-hotfix-v1.json
  EXPECTED_COMMIT_SUBJECT: "hotfix(production): deploy web-session-api (#391)"
  EXPECTED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  DENIED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  FUNCTION_NAME: web-session-api
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  validate-and-build:
    name: Validate and build immutable web-session source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      source_sha256: ${{ steps.package.outputs.source_sha256 }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate one-purpose authorization
        shell: bash
        run: |
          set -euo pipefail
          test -f "$AUTHORIZATION_PATH"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = process.env.AUTHORIZATION_PATH;
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const expected = {
            schemaVersion: 1,
            authorizedPullRequest: 391,
            sourceRef: 'refs/heads/main',
            targetProjectRef: process.env.EXPECTED_PRODUCTION_PROJECT_REF,
            functionName: process.env.FUNCTION_NAME,
            verifyJwt: false,
            productionOrigin: 'https://econovaria.vercel.app',
            supabaseCliVersion: process.env.SUPABASE_CLI_VERSION,
            databaseChangesAllowed: false,
            otherFunctionsAllowed: false,
          };
          for (const [key, value] of Object.entries(expected)) {
            if (manifest[key] !== value) throw new Error(`Authorization mismatch: ${key}`);
          }
          if (manifest.requiredCommitSubject !== process.env.EXPECTED_COMMIT_SUBJECT) {
            throw new Error('Authorization commit subject mismatch.');
          }
          if (!Array.isArray(manifest.deniedProjectRefs) ||
              !manifest.deniedProjectRefs.includes(process.env.DENIED_STAGING_PROJECT_REF)) {
            throw new Error('Staging project denial is missing.');
          }
          if (manifest.secretPolicy?.overwriteExistingEncryptionKey !== false ||
              manifest.secretPolicy?.recordSecretValues !== false) {
            throw new Error('Secret policy must fail closed.');
          }
          NODE

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$GITHUB_REF" = "refs/heads/main"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            test "$(git log -1 --pretty=%s)" = "$EXPECTED_COMMIT_SUBJECT"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install repository tooling
        run: npm ci

      - name: Install backend tooling
        run: npm --prefix backend ci

      - name: Run authentication boundary tests
        run: npm run test:auth-boundaries

      - name: Typecheck backend
        run: npm --prefix backend run typecheck

      - name: Scan committed source for credentials
        run: npm run security:secrets

      - name: Reject private remote source imports
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-strings \
            "raw.githubusercontent.com/kohnerbouchard-star/Student-Profile" \
            backend/supabase/functions/web-session-api \
            backend/supabase/functions/_shared \
            backend/src/domains/auth \
            backend/src/platform/supabase \
            backend/src/security; then
            echo "Production source must be repository-local." >&2
            exit 1
          fi

      - name: Validate pinned deployment CLI contract
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Check deployment command surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"
          supabase functions deploy --help > "$RUNNER_TEMP/functions-deploy-help.txt"
          grep -q -- "--project-ref" "$RUNNER_TEMP/functions-deploy-help.txt"
          grep -q -- "--no-verify-jwt" "$RUNNER_TEMP/functions-deploy-help.txt"
          grep -q -- "--use-api" "$RUNNER_TEMP/functions-deploy-help.txt"

      - name: Package immutable repository-owned source
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/production-web-session
          tar \
            --exclude='backend/node_modules' \
            --exclude='backend/.temp' \
            --exclude='backend/supabase/.temp' \
            -czf dist/production-web-session/backend-source.tgz \
            backend
          source_sha256="$(sha256sum dist/production-web-session/backend-source.tgz | awk '{print $1}')"
          [[ "$source_sha256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$source_sha256" "backend-source.tgz" \
            > dist/production-web-session/backend-source.tgz.sha256
          cp "$AUTHORIZATION_PATH" dist/production-web-session/authorization.json
          SOURCE_SHA256="$source_sha256" node - <<'NODE'
          const fs = require('node:fs');
          const manifest = {
            schemaVersion: 1,
            sourceCommit: process.env.GITHUB_SHA,
            sourceRef: process.env.GITHUB_REF,
            sourceSha256: process.env.SOURCE_SHA256,
            functionName: process.env.FUNCTION_NAME,
            targetProjectRef: process.env.EXPECTED_PRODUCTION_PROJECT_REF,
            deniedProjectRef: process.env.DENIED_STAGING_PROJECT_REF,
            verifyJwt: false,
            supabaseCliVersion: process.env.SUPABASE_CLI_VERSION,
            rebuildDuringDeployment: false,
          };
          fs.writeFileSync(
            'dist/production-web-session/build-manifest.json',
            `${JSON.stringify(manifest, null, 2)}\n`,
          );
          NODE
          echo "source_sha256=$source_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload immutable source artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: production-web-session-${{ github.sha }}
          path: dist/production-web-session
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

      - name: Record build result
        shell: bash
        run: |
          {
            echo '## Production web-session source'
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Source SHA-256: \`${{ steps.package.outputs.source_sha256 }}\`"
            echo '- Repository-local imports: `pass`'
            echo '- Auth-boundary tests: `pass`'
            echo '- Backend typecheck: `pass`'
            echo '- Production credentials used: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
