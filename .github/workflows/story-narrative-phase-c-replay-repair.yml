name: Story Narrative Phase C Replay Repair

on:
  push:
    branches:
      - feat/story-narrative-convergence-v1
    paths:
      - ".github/workflows/story-narrative-phase-c-replay-repair.yml"

permissions:
  contents: write

concurrency:
  group: story-narrative-phase-c-replay-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact Story branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/story-narrative-convergence-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Record Phase C start in persistent roadmap
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin feat/story-narrative-convergence-v1
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path('docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## Run-completion rule\n'
          heading = '### Run 2026-08-11 — Phase C S2/S3 forward replay repair launched'
          if heading not in text:
              body = '\n'.join([
                  '', heading, '',
                  f"Workflow run: `{os.environ['GITHUB_RUN_ID']}`", '',
                  'Authoritative defects being repaired:', '',
                  '- S1 created `story_messages.effect_index`; S2 `deliver_story_character_message_v2()` incorrectly reads `story_row.source_effect_index`.',
                  '- `storyline_events` is a reusable global definition table and has no `game_session_id`; S3 `adjust_story_relationship_v1()` incorrectly scopes the source event through that nonexistent column.',
                  '- Correct game isolation is `storyline_events.storyline_id -> game_session_storylines.storyline_id`, with `game_session_storylines.game_session_id` as the isolation boundary.', '',
                  'Repair discipline:', '',
                  '- historical migrations remain immutable;',
                  '- generate one forward migration with the repository-pinned Supabase CLI;',
                  '- add a source regression contract;',
                  '- replay the full database twice from zero;',
                  '- inspect installed Postgres function definitions after replay;',
                  '- do not apply anything to connected staging in this run.', ''
              ])
              if marker not in text:
                  raise SystemExit('roadmap marker missing')
              text = text.replace(marker, body + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git add docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(story): record Phase C replay repair start"
            git push origin HEAD:feat/story-narrative-convergence-v1
          fi

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install repository-pinned Supabase CLI
        run: npm ci

      - name: Confirm pinned Supabase CLI and migration command
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').devDependencies.supabase")" = "2.109.1"
          npx supabase --version
          npx supabase migration new --help >/tmp/story-phase-c-migration-new-help.txt

      - name: Generate forward migration filename with pinned CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(find backend/supabase/migrations -maxdepth 1 -type f -name '*_repair_story_s2_s3_replay_v1.sql' | wc -l | tr -d ' ')" = "0"
          npx supabase migration new repair_story_s2_s3_replay_v1 --workdir backend
          MIGRATION_PATH="$(find backend/supabase/migrations -maxdepth 1 -type f -name '*_repair_story_s2_s3_replay_v1.sql' | sort | tail -n 1)"
          test -n "$MIGRATION_PATH"
          test -f "$MIGRATION_PATH"
          echo "MIGRATION_PATH=$MIGRATION_PATH" >> "$GITHUB_ENV"
          echo "Generated $MIGRATION_PATH"

      - name: Build forward-only S2 and S3 repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          migration_path = Path(os.environ['MIGRATION_PATH'])
          s2_path = Path('backend/supabase/migrations/20260810215844_add_story_structured_response_windows_v1.sql')
          s3_path = Path('backend/supabase/migrations/20260811011033_add_story_relationship_state_v1.sql')
          s2 = s2_path.read_text(encoding='utf-8')
          s3 = s3_path.read_text(encoding='utf-8')

          s2_start_marker = 'create or replace function public.deliver_story_character_message_v2('
          s2_end_marker = '\ncreate or replace function public.select_player_story_message_interaction_v1('
          s2_start = s2.index(s2_start_marker)
          s2_end = s2.index(s2_end_marker, s2_start)
          s2_block = s2[s2_start:s2_end].rstrip()
          if s2_block.count('story_row.source_effect_index = p_source_effect_index') != 1:
              raise SystemExit('unexpected S2 historical source-effect mismatch count')
          s2_block = s2_block.replace(
              'story_row.source_effect_index = p_source_effect_index',
              'story_row.effect_index = p_source_effect_index',
              1,
          )
          if 'source_effect_index' in s2_block:
              raise SystemExit('S2 forward function still references source_effect_index')

          s3_start_marker = 'create or replace function public.adjust_story_relationship_v1('
          s3_end_marker = '\nrevoke all on function public.adjust_story_relationship_v1('
          s3_start = s3.index(s3_start_marker)
          s3_end = s3.index(s3_end_marker, s3_start)
          s3_block = s3[s3_start:s3_end].rstrip()
          old_scope = '''  if not exists (\n    select 1 from public.storyline_events\n    where id = p_source_storyline_event_id\n      and game_session_id = p_game_session_id\n  ) then'''
          new_scope = '''  if not exists (\n    select 1\n    from public.storyline_events as event_row\n    join public.game_session_storylines as activation_row\n      on activation_row.storyline_id = event_row.storyline_id\n    where event_row.id = p_source_storyline_event_id\n      and activation_row.game_session_id = p_game_session_id\n  ) then'''
          if s3_block.count(old_scope) != 1:
              raise SystemExit('unexpected S3 historical event-scope mismatch count')
          s3_block = s3_block.replace(old_scope, new_scope, 1)
          if 'select 1 from public.storyline_events\n    where id = p_source_storyline_event_id\n      and game_session_id = p_game_session_id' in s3_block:
              raise SystemExit('S3 forward function still scopes global storyline_events directly by game')

          migration = f'''-- Forward compatibility repair for Story S2/S3 replay semantics.\n-- Historical migrations are intentionally preserved unchanged.\n\nbegin;\n\n{s2_block}\n\nrevoke all on function public.deliver_story_character_message_v2(\n  uuid, uuid, uuid, integer, text, text, text, text, text, jsonb\n) from public, anon, authenticated;\ngrant execute on function public.deliver_story_character_message_v2(\n  uuid, uuid, uuid, integer, text, text, text, text, text, jsonb\n) to service_role;\n\n{s3_block}\n\nrevoke all on function public.adjust_story_relationship_v1(\n  uuid, uuid, uuid, integer, text, text, jsonb\n) from public, anon, authenticated;\ngrant execute on function public.adjust_story_relationship_v1(\n  uuid, uuid, uuid, integer, text, text, jsonb\n) to service_role;\n\ncomment on function public.deliver_story_character_message_v2(\n  uuid, uuid, uuid, integer, text, text, text, text, text, jsonb\n) is\n  'Story character message V2 delivery using the authoritative S1 story_messages.effect_index replay identity.';\ncomment on function public.adjust_story_relationship_v1(\n  uuid, uuid, uuid, integer, text, text, jsonb\n) is\n  'Story relationship adjustment scoped to a game through game_session_storylines activation of the global Story event definition.';\n\ncommit;\n'''
          migration_path.write_text(migration, encoding='utf-8')
          print(migration_path)
          PY
          git diff --check -- "$MIGRATION_PATH"

      - name: Add forward-repair regression contract
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/story-s2-s3-replay-repair-contract.test.mjs <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import test from 'node:test';

          const root = process.cwd();
          const migrationsDir = path.join(root, 'backend', 'supabase', 'migrations');
          const repairFiles = fs.readdirSync(migrationsDir)
            .filter((name) => name.endsWith('_repair_story_s2_s3_replay_v1.sql'));
          const read = (relative) => fs.readFileSync(path.join(root, relative), 'utf8');

          test('Story S2/S3 replay repair is forward-only and targets authoritative schema', () => {
            assert.equal(repairFiles.length, 1, `expected one forward repair migration, found ${repairFiles.length}`);
            const repair = fs.readFileSync(path.join(migrationsDir, repairFiles[0]), 'utf8');
            const historicalS2 = read('backend/supabase/migrations/20260810215844_add_story_structured_response_windows_v1.sql');
            const historicalS3 = read('backend/supabase/migrations/20260811011033_add_story_relationship_state_v1.sql');
            const foundation = read('backend/supabase/migrations/20260625120000_add_storyline_schema_v1.sql');

            assert.match(historicalS2, /story_row\.source_effect_index = p_source_effect_index/,
              'historical S2 migration must remain untouched');
            assert.match(historicalS3, /select 1 from public\.storyline_events\s+where id = p_source_storyline_event_id\s+and game_session_id = p_game_session_id/,
              'historical S3 migration must remain untouched');

            assert.match(repair, /story_row\.effect_index = p_source_effect_index/);
            assert.doesNotMatch(repair, /story_row\.source_effect_index/);
            assert.match(repair, /from public\.storyline_events as event_row\s+join public\.game_session_storylines as activation_row\s+on activation_row\.storyline_id = event_row\.storyline_id/);
            assert.match(repair, /activation_row\.game_session_id = p_game_session_id/);

            const eventTable = foundation.split('create table public.storyline_events (')[1].split(');')[0];
            assert.doesNotMatch(eventTable, /game_session_id/,
              'global storyline_events definitions must not acquire game scope');
            const activationTable = foundation.split('create table public.game_session_storylines (')[1].split(');')[0];
            assert.match(activationTable, /game_session_id uuid not null/);
            assert.match(activationTable, /storyline_id uuid not null/);
            assert.match(foundation, /The game_session_id is the isolation boundary/);
          });
          JS
          node --test scripts/story-s2-s3-replay-repair-contract.test.mjs
          git diff --check -- scripts/story-s2-s3-replay-repair-contract.test.mjs

      - name: Validate migration source
        run: npm run audit:migrations

      - name: Start disposable Postgres service
        shell: bash
        run: |
          set -euo pipefail
          LOG="/tmp/story-phase-c-database-startup.log"
          : > "$LOG"
          STATUS=1
          EXCLUDED="studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,gotrue,postgrest,realtime,kong,mailpit,postgres-meta"
          for ATTEMPT in 1 2 3; do
            printf '\n## Supabase Postgres startup attempt %s\n' "$ATTEMPT" | tee -a "$LOG"
            set +e
            npx supabase start --workdir backend --exclude "$EXCLUDED" 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            npx supabase status --workdir backend 2>&1 | tee -a "$LOG" || true
            npx supabase stop --workdir backend --no-backup 2>&1 | tee -a "$LOG" || true
            sleep $((ATTEMPT * 10))
          done
          exit "$STATUS"

      - name: Replay all migrations from zero twice
        shell: bash
        run: |
          set -euo pipefail
          npx supabase db reset --workdir backend --local
          npx supabase db reset --workdir backend --local

      - name: Inspect installed Story function definitions
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec "$DB_CONTAINER" psql -U postgres -d postgres -Atc \
            "select pg_get_functiondef('public.deliver_story_character_message_v2(uuid,uuid,uuid,integer,text,text,text,text,text,jsonb)'::regprocedure);" \
            > /tmp/story-s2-function.sql
          docker exec "$DB_CONTAINER" psql -U postgres -d postgres -Atc \
            "select pg_get_functiondef('public.adjust_story_relationship_v1(uuid,uuid,uuid,integer,text,text,jsonb)'::regprocedure);" \
            > /tmp/story-s3-function.sql
          grep -q 'story_row.effect_index = p_source_effect_index' /tmp/story-s2-function.sql
          ! grep -q 'story_row.source_effect_index' /tmp/story-s2-function.sql
          grep -q 'JOIN public.game_session_storylines activation_row' /tmp/story-s3-function.sql
          grep -q 'activation_row.game_session_id = p_game_session_id' /tmp/story-s3-function.sql

      - name: Lint rebuilt database
        run: npx supabase db lint --workdir backend --local --level warning

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Verify focused Story regressions
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm run test:story-choice-callbacks
          npm run test:player-messaging

      - name: Record Phase C success and publish forward repair
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path('docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## Run-completion rule\n'
          heading = f"### Run 2026-08-11 — Phase C S2/S3 forward replay repair green `{os.environ['GITHUB_RUN_ID']}`"
          if heading not in text:
              body = '\n'.join([
                  '', heading, '',
                  f"Migration: `{os.environ['MIGRATION_PATH']}`", '',
                  'Result: GREEN FOR THE LOCAL DATABASE-REPLAY BOUNDARY.', '',
                  '- Historical S1/S2/S3 migrations were not edited.',
                  '- `deliver_story_character_message_v2()` now resolves replay identity through the authoritative `story_messages.effect_index` column.',
                  '- `adjust_story_relationship_v1()` now scopes the global Story event to the game through `game_session_storylines` activation.',
                  '- Forward-repair source regression contract passed.',
                  '- Migration audit passed.',
                  '- Full local Supabase database replay passed twice from zero.',
                  '- Installed Postgres function definitions were inspected after replay and contain the corrected contracts.',
                  '- Database lint and focused S4/Player Messaging regressions passed.', '',
                  'Connected staging remains unchanged. Next tranche: Story runner execution-claim/retry semantics and stable authored effect ordinal before any connected campaign activation.', ''
              ])
              if marker not in text:
                  raise SystemExit('roadmap marker missing')
              text = text.replace(marker, body + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git add "$MIGRATION_PATH" scripts/story-s2-s3-replay-repair-contract.test.mjs docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(story): repair S2 S3 replay contracts forward-only"
          git push origin HEAD:feat/story-narrative-convergence-v1

      - name: Record Phase C failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path('docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## Run-completion rule\n'
          heading = f"### Run 2026-08-11 — Phase C S2/S3 forward replay repair failure `{os.environ['GITHUB_RUN_ID']}`"
          if heading not in text:
              body = '\n'.join([
                  '', heading, '',
                  'Result: FAILED; no forward repair migration or regression test was published from this run.', '',
                  'Inspect the exact CLI-generation, source-contract, migration-audit, database-replay, installed-function, lint, or focused Story regression failure. Do not edit historical migrations and do not apply partial repairs to connected staging.', ''
              ])
              if marker not in text:
                  raise SystemExit('roadmap marker missing')
              text = text.replace(marker, body + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git add docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(story): record Phase C replay repair failure"
            git push origin HEAD:feat/story-narrative-convergence-v1
          fi

      - name: Capture local replay diagnostics
        if: failure()
        shell: bash
        run: |
          npx supabase status --workdir backend 2>&1 | tee -a /tmp/story-phase-c-status.log || true
          docker ps -a 2>&1 | tee -a /tmp/story-phase-c-docker.log || true
          docker system df 2>&1 | tee -a /tmp/story-phase-c-docker.log || true

      - name: Stop disposable stack
        if: always()
        run: npx supabase stop --workdir backend --no-backup || true
