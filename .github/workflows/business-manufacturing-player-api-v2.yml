name: Business Manufacturing Player API V2

on:
  pull_request:
    paths:
      - "backend/src/domains/business/api/playerBusinessManufacturing*.ts"
      - "backend/src/domains/business/api/playerBusinessRoutePaths.ts"
      - "backend/src/domains/business/api/playerBusinessHttpHandler.ts"
      - "backend/src/domains/business/infrastructure/supabasePlayerBusinessRepository.ts"
      - "scripts/business-phase6e-player-*.mjs"
      - "docs/roadmaps/business-phase6e-player-cutover-scope-v1.md"
      - ".github/workflows/business-manufacturing-player-api-v2.yml"
  push:
    branches: [main]
    paths:
      - "backend/src/domains/business/api/playerBusinessManufacturing*.ts"
      - "backend/src/domains/business/api/playerBusinessRoutePaths.ts"
      - "backend/src/domains/business/api/playerBusinessHttpHandler.ts"
      - "backend/src/domains/business/infrastructure/supabasePlayerBusinessRepository.ts"
      - "scripts/business-phase6e-player-*.mjs"
      - ".github/workflows/business-manufacturing-player-api-v2.yml"

permissions:
  contents: read

jobs:
  verify-player-api:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            player-terminal/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3
      - run: npm install --global npm@10.9.8
      - run: npm ci --ignore-scripts
      - name: Verify Player manufacturing publication and retained authorities
        run: |
          node scripts/business-phase6e-player-cutover-intake-contract.mjs
          node scripts/business-phase6e-player-api-contract.mjs
          node scripts/business-phase6-manufacturing-recovery-contract.mjs
          node scripts/business-phase6-manufacturing-recovery-simulation.mjs
          node scripts/business-phase6-manufacturing-completion-contract.mjs
          node scripts/business-phase6-manufacturing-completion-simulation.mjs
          node scripts/business-phase6-manufacturing-resource-hold-contract.mjs
          node scripts/business-phase6-manufacturing-resource-hold-simulation.mjs
          node scripts/business-phase6-manufacturing-foundation-contract.mjs
          node scripts/business-phase6-manufacturing-lifecycle-simulation.mjs
          node scripts/business-banking-runtime-contract.mjs
          node scripts/validate-supabase-migrations.mjs
          git diff --check
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Test and typecheck extracted Business manufacturing API
        working-directory: backend
        run: |
          deno test --config supabase/functions/classroom-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            src/domains/business/api/playerBusinessManufacturing.test.ts
          deno check --config supabase/functions/classroom-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            src/domains/business/api/playerBusinessManufacturing.ts \
            src/domains/business/api/playerBusinessRoutePaths.ts \
            src/domains/business/api/playerBusinessHttpHandler.ts \
            src/domains/business/infrastructure/supabasePlayerBusinessRepository.ts
          npm run typecheck:all
      - name: Run repository quality suite
        run: npm test
      - name: Install Player Terminal dependencies
        working-directory: player-terminal
        run: npm ci --no-audit --no-fund
      - name: Verify retained Player surface
        working-directory: player-terminal
        run: |
          npm run check
          node tests/business-banking-surface.mjs
          npm run adapter
          npm run capability-manifest-current
          npm run runtime-integration
