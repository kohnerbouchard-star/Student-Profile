name: Story Narrative S2 Route Parser Compatibility

on:
  push:
    branches:
      - feat/story-narrative-convergence-v1
    paths:
      - ".github/workflows/story-narrative-s2-route-parser-compat.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact story branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Splice canonical segment-router patcher section and update roadmap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          patcher = Path("scripts/story-narrative/s2/diagnostic-primary.py")
          text = patcher.read_text(encoding="utf-8")
          start_marker = '    path = repo / "backend/src/domains/messaging/api/playerMessagingRoutePaths.ts"\n'
          end_marker = '    path = repo / "backend/supabase/functions/classroom-api/messagingDispatch.ts"\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start + 1)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("S2 route patcher section boundaries were not found")
          replacement = Path("scripts/story-narrative/s2/route-parser-patch-section.txt").read_text(encoding="utf-8")
          updated = text[:start] + replacement + text[end:]
          compile(updated, str(patcher), "exec")
          patcher.write_text(updated, encoding="utf-8")

          roadmap = Path("docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md")
          roadmap_text = roadmap.read_text(encoding="utf-8")
          marker = "\n## Run-completion rule\n"
          if marker not in roadmap_text:
              raise SystemExit("roadmap run-completion marker missing")
          lines = [
              "",
              "### Run 2026-08-11 — S2 route-parser compatibility attempts",
              "",
              "Workflow run `31433730927`: FAILED BEFORE PATCHER OR ROADMAP MUTATION because the helper Python embedded nested triple-quoted patch literals and raised `SyntaxError`.",
              "",
              "Workflow run `31433798416`: FAILED BEFORE PATCHER OR ROADMAP MUTATION because the replacement block still nested the patcher triple quotes inside a Python triple-quoted string.",
              "",
              "Neither failed compatibility run generated a migration, mutated S2 implementation source, or changed the staged patcher.",
              "",
              "### Run 2026-08-11 — S2 canonical route-parser compatibility repair",
              "",
              f"Workflow run: `{os.environ['GITHUB_RUN_ID']}`",
              f"Source head: `{os.environ['GITHUB_SHA']}`",
              "",
              "Result: PATCHER COMPATIBILITY REPAIRED; NO S2 IMPLEMENTATION SOURCE APPLIED IN THIS RUN.",
              "",
              "Finding:",
              "",
              "- current Player Messaging routing is the canonical segment-based `readPlayerApiRouteSegments` implementation;",
              "- the prepared S2 primary patcher incorrectly expected an obsolete regex-normalized router and a non-null-only `markRead` route;",
              "- changing production routing to satisfy that stale patcher would be an architectural regression.",
              "",
              "Correction:",
              "",
              "- repaired only the temporary S2 primary patcher;",
              "- preserved nullable global/thread read-receipt routing;",
              "- S2 choice selection is expressed as the eight-segment `/players/me/messages/threads/:threadId/story-interactions/:interactionKey/select` route inside the existing segment parser;",
              "- added a bounded public `interactionKey` route pattern;",
              "- compiled the corrected patcher before publication;",
              "- removed the temporary replacement section and compatibility workflow before commit.",
              "",
              "Next: trigger the complete S2 verify-and-land workflow from this corrected patcher and continue fail-closed through any subsequent exact compatibility or test failure.",
              "",
          ]
          roadmap.write_text(roadmap_text.replace(marker, "\n".join(lines) + marker, 1), encoding="utf-8")
          PY
          git diff --check
          rm -f scripts/story-narrative/s2/route-parser-patch-section.txt
          rm -f .github/workflows/story-narrative-s2-route-parser-compat.yml
          git add -A -- scripts/story-narrative/s2/diagnostic-primary.py scripts/story-narrative/s2/route-parser-patch-section.txt docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md .github/workflows/story-narrative-s2-route-parser-compat.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(story): align S2 patcher with segment message routes"
          git push origin HEAD:feat/story-narrative-convergence-v1
