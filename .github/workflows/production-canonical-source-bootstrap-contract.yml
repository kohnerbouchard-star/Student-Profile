name: Production Canonical Source Bootstrap Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/production-canonical-source-bootstrap-v1.yml"
      - ".github/workflows/production-canonical-source-bootstrap-contract.yml"
      - "docs/operations/evidence/production-canonical-source-bootstrap-v1.json"
      - "scripts/production-canonical-source-bootstrap.mjs"
      - "scripts/production-canonical-source-bootstrap-contract.test.mjs"

permissions:
  contents: read

jobs:
  verify:
    name: Verify production canonical source remains fail-closed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
      - run: node --check scripts/production-canonical-source-bootstrap.mjs
      - run: node scripts/production-canonical-source-bootstrap-contract.test.mjs
      - run: git diff --check
