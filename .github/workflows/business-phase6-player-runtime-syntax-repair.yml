name: Business Phase 6 Player Runtime Syntax Repair

on:
  push:
    branches:
      - feat/business-timed-manufacturing-v2
    paths:
      - .github/workflows/business-phase6-player-runtime-syntax-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact Phase 6 branch
        uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0
      - name: Repair malformed service-client properties
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('backend/supabase/functions/player-api/runtime.ts')
          source = path.read_text()
          repaired, count = re.subn(
              r'(?m)^(\s*)createServiceClient \},$',
              r'\1createServiceClient,',
              source,
          )
          if count < 1:
              raise SystemExit('No malformed createServiceClient property lines were found.')
          if 'createServiceClient },\n      }),' in repaired:
              raise SystemExit('Malformed service-client property remains after repair.')
          path.write_text(repaired)
          print(f'Repaired {count} malformed service-client property line(s).')
          PY
          rm .github/workflows/business-phase6-player-runtime-syntax-repair.yml
      - name: Commit repaired runtime and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/player-api/runtime.ts .github/workflows/business-phase6-player-runtime-syntax-repair.yml
          git commit -m "fix(player): repair Player API runtime object syntax"
          git push origin HEAD:feat/business-timed-manufacturing-v2
