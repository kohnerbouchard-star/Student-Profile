name: C0 FX bootstrap diagnostics

on:
  push:
    branches:
      - feat/multicurrency-funding-core-v1
    paths:
      - .github/workflows/c0-fx-bootstrap-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install pinned tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          npm ci --ignore-scripts

      - name: Start disposable Postgres service
        shell: bash
        run: |
          set -euo pipefail
          EXCLUDED="studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,gotrue,postgrest,realtime,kong,mailpit,postgres-meta"
          npx supabase start --workdir backend --exclude "$EXCLUDED"

      - name: Rebuild database from zero
        run: npx supabase db reset --workdir backend --local

      - name: Instrument bootstrap result locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/multicurrency-funding-database.mjs')
          text = path.read_text()
          old_start = 'function initializeFx(game) {\n  runSql(`'
          new_start = 'function initializeFx(game) {\n  const bootstrap = runJson(`'
          if old_start not in text:
              raise SystemExit('initializeFx runSql start not found')
          text = text.replace(old_start, new_start, 1)

          old_end = '  `);\n\n  const state = runJson(`'
          new_end = '  `);\n  console.error("C0_FX_BOOTSTRAP_RESULT", JSON.stringify(bootstrap));\n\n  const state = runJson(`'
          if old_end not in text:
              raise SystemExit('initializeFx state boundary not found')
          text = text.replace(old_end, new_end, 1)
          path.write_text(text)
          PY
          node --check scripts/multicurrency-funding-database.mjs

      - name: Run instrumented C0 acceptance
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/multicurrency-funding-database.mjs

      - name: Stop disposable stack
        if: always()
        run: npx supabase stop --workdir backend --no-backup || true
