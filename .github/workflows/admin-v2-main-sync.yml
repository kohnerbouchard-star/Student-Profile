name: Admin V2 Main Sync

on:
  push:
    branches:
      - refactor/admin-v2-ux-root-v1
    paths:
      - .github/workflows/admin-v2-main-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/admin-v2-ux-root-v1
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Merge current main with bounded conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected="scripts/admin-messaging-moderation-contract.mjs"
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --theirs -- "$expected"
            git add "$expected"
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git rm .github/workflows/admin-v2-main-sync.yml
      - name: Verify converged release candidate
        run: |
          node scripts/admin-messaging-moderation-contract.mjs
          node --check scripts/admin-v2-crafting-browser-smoke.mjs
          node --check scripts/admin-v2-contracts-browser-smoke.mjs
          node scripts/admin-v2-contracts-api.test.mjs
          node scripts/admin-v2-store-api.test.mjs
          test "$(grep -c 'v2/styles/routes/loans.css' admin/v2.html)" -eq 1
          git diff --check
      - name: Commit and push main convergence
        run: |
          git add -A
          git commit -m "chore: sync Admin V2 release with main"
          git push origin HEAD:refactor/admin-v2-ux-root-v1
