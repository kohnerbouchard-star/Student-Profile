name: Temporary Phase 3B CI Repair

on:
  push:
    branches:
      - feat/business-store-procurement-v2
    paths:
      - ".github/workflows/temporary-phase3b-ci-repair.yml"

permissions:
  contents: write

concurrency:
  group: temporary-phase3b-ci-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/business-store-procurement-v2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Apply exact bounded repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_value: str, old: str, new: str) -> None:
              path = Path(path_value)
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one repair target in {path_value}; found {count}."
                  )
              path.write_text(source.replace(old, new, 1), encoding="utf-8")

          runtime_old = '''      businessProductCreate: "businessProductCreate",
                businessInputPurchase: "businessInputPurchase",
                businessProduction: "businessProduction",
          '''
          runtime_new = '''      businessProductCreate: "businessProductCreate",
                businessInputPurchase: "businessInputPurchase",
                businessStoreQuote: "storeQuote",
                businessStorePurchase: "storePurchase",
                businessProduction: "businessProduction",
          '''

          for runtime_path in (
              "backend/supabase/functions/classroom-api/index.ts",
              "backend/supabase/functions/player-api/runtime.ts",
          ):
              replace_once(runtime_path, runtime_old, runtime_new)

          replace_once(
              "scripts/business-recipe-access-contract.mjs",
              'assert.match(handlerSource, /\\{ recipes: await readBusinessRecipes\\(client, publicScope\\) \\}/u);\n',
              "",
          )

          replace_once(
              "backend/src/domains/progression/services/progressionIntegrationEventService.test.ts",
              'const NOW = new Date("2026-07-21T02:00:00.000Z");',
              'const NOW = new Date("2026-07-21T05:00:00.000Z");',
          )

          replace_once(
              "backend/src/domains/business-banking/api/playerBusinessBankingRoutePaths.ts",
              '''  { kind: "businessProductCreate" },
                { kind: "businessInputPurchase" },
                { kind: "businessProduction" },
          ''',
              '''  { kind: "businessProductCreate" },
                { kind: "businessInputPurchase" },
                { kind: "businessStoreQuote" },
                { kind: "businessStorePurchase" },
                { kind: "businessProduction" },
          ''',
          )
          PY

          git diff --check

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Verify Business recipe authority contract
        run: node scripts/business-recipe-access-contract.mjs

      - name: Verify backend type surfaces
        run: npm --prefix backend run typecheck:all

      - name: Verify Progression fixture clock
        run: npm --prefix backend run test:player-progression

      - name: Commit and push verified repair
        shell: bash
        run: |
          git config user.name "econovaria-ci-repair"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            backend/supabase/functions/classroom-api/index.ts \
            backend/supabase/functions/player-api/runtime.ts \
            scripts/business-recipe-access-contract.mjs \
            backend/src/domains/progression/services/progressionIntegrationEventService.test.ts \
            backend/src/domains/business-banking/api/playerBusinessBankingRoutePaths.ts
          if git diff --cached --quiet; then
            echo "No repair changes remained to commit."
            exit 0
          fi
          git commit -m "fix(business): repair Phase 3B verification wiring"
          git push origin HEAD:feat/business-store-procurement-v2
