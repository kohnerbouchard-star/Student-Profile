name: Temporary Phase 3B Settlement Hardening

on:
  push:
    branches:
      - feat/business-store-procurement-v2
    paths:
      - ".github/workflows/temporary-phase3b-ci-repair.yml"

permissions:
  contents: write

concurrency:
  group: temporary-phase3b-settlement-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/business-store-procurement-v2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Apply bounded Phase 3B hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          
          def replace_once(path_value: str, old: str, new: str) -> None:
              path = Path(path_value)
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected one replacement target in {path_value}; found {count}."
                  )
              path.write_text(source.replace(old, new, 1), encoding="utf-8")
          
          def insert_after_once(path_value: str, anchor: str, addition: str) -> None:
              replace_once(path_value, anchor, anchor + addition)
          
          def write_b64(path_value: str, encoded: str) -> None:
              Path(path_value).write_bytes(base64.b64decode(encoded))
          
          migration = "backend/supabase/migrations/20260821060000_business_store_procurement_v2.sql"
          
          replace_once(
              migration,
              """  constraint business_store_purchase_quotes_public_key_unique unique (public_key),
            constraint business_store_purchase_quotes_idempotency_unique
          """,
              """  constraint business_store_purchase_quotes_public_key_unique unique (public_key),
            constraint business_store_purchase_quotes_scope_id_unique
              unique (game_session_id, id),
            constraint business_store_purchase_quotes_idempotency_unique
          """,
          )
          
          replace_once(
              migration,
              "  quote_id uuid not null references public.business_store_purchase_quotes(id),\n",
              "  quote_id uuid not null,\n",
          )
          
          replace_once(
              migration,
              """  final_unit_price numeric(14, 2) not null,
            final_total_price numeric(14, 2) not null,
            ledger_entry_id uuid null references public.ledger_entries(id),
          """,
              """  final_unit_price numeric(14, 2) not null,
            final_total_price numeric(14, 2) not null,
            warehouse_quantity_owned integer null,
            warehouse_average_unit_cost numeric(18, 4) null,
            ledger_entry_id uuid null references public.ledger_entries(id),
          """,
          )
          
          replace_once(
              migration,
              """  constraint business_store_purchases_actor_scope_fk
              foreign key (game_session_id, purchased_by_player_id)
              references public.players(game_session_id, id),
            constraint business_store_purchases_item_scope_fk
          """,
              """  constraint business_store_purchases_actor_scope_fk
              foreign key (game_session_id, purchased_by_player_id)
              references public.players(game_session_id, id),
            constraint business_store_purchases_quote_scope_fk
              foreign key (game_session_id, quote_id)
              references public.business_store_purchase_quotes(game_session_id, id),
            constraint business_store_purchases_item_scope_fk
          """,
          )
          
          replace_once(
              migration,
              """  constraint business_store_purchases_prices_non_negative
              check (final_unit_price >= 0 and final_total_price >= 0),
            constraint business_store_purchases_idempotency_key_valid
          """,
              """  constraint business_store_purchases_prices_non_negative
              check (final_unit_price >= 0 and final_total_price >= 0),
            constraint business_store_purchases_warehouse_result_non_negative
              check (
                (
                  warehouse_quantity_owned is null
                  and warehouse_average_unit_cost is null
                )
                or (
                  warehouse_quantity_owned >= 0
                  and warehouse_average_unit_cost >= 0
                )
              ),
            constraint business_store_purchases_idempotency_key_valid
          """,
          )
          
          replace_once(
              migration,
              """      (status = 'COMPLETED'
                  and completed_at is not null
                  and ledger_entry_id is not null
                  and inventory_transaction_id is not null)
                or (status = 'STARTED'
                  and completed_at is null
                  and ledger_entry_id is null
                  and inventory_transaction_id is null)
          """,
              """      (status = 'COMPLETED'
                  and completed_at is not null
                  and ledger_entry_id is not null
                  and inventory_transaction_id is not null
                  and warehouse_quantity_owned is not null
                  and warehouse_average_unit_cost is not null)
                or (status = 'STARTED'
                  and completed_at is null
                  and ledger_entry_id is null
                  and inventory_transaction_id is null
                  and warehouse_quantity_owned is null
                  and warehouse_average_unit_cost is null)
          """,
          )
          
          insert_after_once(
              migration,
              """comment on table public.business_store_purchases is
            'Immutable Business procurement receipt evidence. Business cash and warehouse holdings remain authoritative in the canonical ledger and inventory projections.';
          
          """,
              "create or replace function public.guard_business_store_quote_evidence_v2()\nreturns trigger\nlanguage plpgsql\nsecurity definer\nset search_path = public, pg_temp\nas $function$\nbegin\n  if tg_op = 'DELETE' then\n    raise exception 'BUSINESS_STORE_QUOTE_IMMUTABLE' using errcode = '42501';\n  end if;\n\n  if old.status <> 'CREATED'\n    or new.status not in ('USED', 'EXPIRED', 'CANCELLED')\n  then\n    raise exception 'BUSINESS_STORE_QUOTE_TRANSITION_INVALID' using errcode = '42501';\n  end if;\n\n  if (\n    to_jsonb(new) - array['status', 'used_at', 'cancelled_at']\n  ) is distinct from (\n    to_jsonb(old) - array['status', 'used_at', 'cancelled_at']\n  ) then\n    raise exception 'BUSINESS_STORE_QUOTE_IMMUTABLE' using errcode = '42501';\n  end if;\n\n  if new.status = 'USED' then\n    if new.used_at is null or new.cancelled_at is not null then\n      raise exception 'BUSINESS_STORE_QUOTE_TRANSITION_INVALID' using errcode = '42501';\n    end if;\n  elsif new.status = 'CANCELLED' then\n    if new.cancelled_at is null or new.used_at is not null then\n      raise exception 'BUSINESS_STORE_QUOTE_TRANSITION_INVALID' using errcode = '42501';\n    end if;\n  elsif new.used_at is not null or new.cancelled_at is not null then\n    raise exception 'BUSINESS_STORE_QUOTE_TRANSITION_INVALID' using errcode = '42501';\n  end if;\n\n  return new;\nend\n$function$;\n\ncreate trigger guard_business_store_quote_evidence\nbefore update or delete on public.business_store_purchase_quotes\nfor each row execute function public.guard_business_store_quote_evidence_v2();\n\ncreate or replace function public.guard_business_store_purchase_evidence_v2()\nreturns trigger\nlanguage plpgsql\nsecurity definer\nset search_path = public, pg_temp\nas $function$\nbegin\n  if tg_op = 'DELETE' then\n    raise exception 'BUSINESS_STORE_PURCHASE_IMMUTABLE' using errcode = '42501';\n  end if;\n\n  if old.status <> 'STARTED' or new.status <> 'COMPLETED' then\n    raise exception 'BUSINESS_STORE_PURCHASE_TRANSITION_INVALID' using errcode = '42501';\n  end if;\n\n  if (\n    to_jsonb(new) - array[\n      'ledger_entry_id',\n      'inventory_transaction_id',\n      'warehouse_quantity_owned',\n      'warehouse_average_unit_cost',\n      'status',\n      'completed_at'\n    ]\n  ) is distinct from (\n    to_jsonb(old) - array[\n      'ledger_entry_id',\n      'inventory_transaction_id',\n      'warehouse_quantity_owned',\n      'warehouse_average_unit_cost',\n      'status',\n      'completed_at'\n    ]\n  ) then\n    raise exception 'BUSINESS_STORE_PURCHASE_IMMUTABLE' using errcode = '42501';\n  end if;\n\n  return new;\nend\n$function$;\n\ncreate trigger guard_business_store_purchase_evidence\nbefore update or delete on public.business_store_purchases\nfor each row execute function public.guard_business_store_purchase_evidence_v2();\n\n",
          )
          
          replace_once(
              migration,
              """  v_inventory_transaction jsonb;
            v_warehouse_account_id uuid;
            v_holding public.inventory_holdings%rowtype;
            v_game_status text;
          """,
              """  v_inventory_transaction jsonb;
            v_warehouse_account_id uuid;
            v_holding public.inventory_holdings%rowtype;
            v_settled_unit_cost numeric(18, 4);
            v_game_status text;
          """,
          )
          
          replace_once(
              migration,
              """        'businessId', v_business.business_id,
                  'storeItemId', v_item.id,
          """,
              """        'businessId', v_business.business_id,
                  'playerId', p_player_id,
                  'storeItemId', v_item.id,
          """,
          )
          
          replace_once(
              migration,
              """        'businessId', v_business.business_id,
                  'quoteId', v_quote.id,
          """,
              """        'businessId', v_business.business_id,
                  'playerId', p_player_id,
                  'quoteId', v_quote.id,
          """,
          )
          
          replace_once(
              migration,
              """    v_warehouse_account_id := economy_private.ensure_business_inventory_account_v2(
                p_game_session_id,
                v_business.business_id,
                'warehouse'
              );
          
              select holding_row.*
              into v_holding
              from public.inventory_holdings as holding_row
              where holding_row.game_session_id = p_game_session_id
                and holding_row.inventory_account_id = v_warehouse_account_id
                and holding_row.game_item_id = (
                  select item_row.game_item_id
                  from public.store_items as item_row
                  where item_row.id = v_purchase.store_item_id
                );
          
              return query
              select
                v_business.business_key,
                v_purchase.public_key,
                v_quote.public_key,
                item_row.item_key,
                item_row.name,
                v_purchase.quantity,
                v_purchase.final_unit_price,
                v_purchase.final_total_price,
                v_purchase.currency_code,
                coalesce(v_holding.quantity_owned, 0),
                coalesce(v_holding.average_unit_cost, 0),
                v_purchase.completed_at,
                true
              from public.store_items as item_row
              where item_row.id = v_purchase.store_item_id;
          """,
              """    return query
              select
                v_business.business_key,
                v_purchase.public_key,
                v_quote.public_key,
                item_row.item_key,
                item_row.name,
                v_purchase.quantity,
                v_purchase.final_unit_price,
                v_purchase.final_total_price,
                v_purchase.currency_code,
                v_purchase.warehouse_quantity_owned,
                v_purchase.warehouse_average_unit_cost,
                v_purchase.completed_at,
                true
              from public.store_items as item_row
              where item_row.id = v_purchase.store_item_id;
          """,
          )
          
          replace_once(
              migration,
              """  if v_quote.expires_at <= v_now then
              update public.business_store_purchase_quotes
              set status = 'EXPIRED'
              where id = v_quote.id;
              raise exception 'QUOTE_EXPIRED' using errcode = 'P0001';
            end if;
          
          """,
              """  if v_quote.expires_at <= v_now then
              raise exception 'QUOTE_EXPIRED' using errcode = 'P0001';
            end if;
            if v_quote.settlement_currency_code <> upper(btrim(v_business.currency_code)) then
              raise exception 'BUSINESS_CURRENCY_MISMATCH' using errcode = 'P0001';
            end if;
          
          """,
          )
          
          replace_once(
              migration,
              """  v_warehouse_account_id := economy_private.ensure_business_inventory_account_v2(
              p_game_session_id,
              v_business.business_id,
              'warehouse'
            );
            perform public.ensure_business_bank_account_v2(
              p_game_session_id,
              v_business.business_id
            );
          
            select balance_row.*
            into v_balance
            from public.account_balances as balance_row
            where balance_row.game_session_id = p_game_session_id
              and balance_row.business_id = v_business.business_id
              and balance_row.currency_code = v_quote.settlement_currency_code
            for update;
          """,
              """  v_settled_unit_cost := round(
              v_quote.final_total_price / v_quote.quantity,
              4
            );
          
            -- Phase 3B lock order: Store item -> Business warehouse holding -> Business cash.
            v_warehouse_account_id := economy_private.ensure_business_inventory_account_v2(
              p_game_session_id,
              v_business.business_id,
              'warehouse'
            );
          
            insert into public.inventory_holdings(
              game_session_id,
              inventory_account_id,
              game_item_id,
              quantity_owned,
              quantity_reserved,
              average_unit_cost,
              cost_currency_code,
              version
            ) values (
              p_game_session_id,
              v_warehouse_account_id,
              v_item.game_item_id,
              0,
              0,
              0,
              v_quote.settlement_currency_code,
              1
            )
            on conflict on constraint inventory_holdings_account_item_unique do nothing;
          
            select holding_row.*
            into v_holding
            from public.inventory_holdings as holding_row
            where holding_row.game_session_id = p_game_session_id
              and holding_row.inventory_account_id = v_warehouse_account_id
              and holding_row.game_item_id = v_item.game_item_id
            for update;
            if not found then
              raise exception 'INVENTORY_POSTING_RESULT_MISSING' using errcode = 'P0001';
            end if;
          
            if v_holding.quantity_owned > 0
              and v_holding.cost_currency_code is distinct from v_quote.settlement_currency_code
            then
              raise exception 'BUSINESS_STOCKROOM_COST_CURRENCY_MISMATCH'
                using errcode = 'P0001';
            end if;
          
            if v_holding.quantity_owned = 0
              and (
                v_holding.cost_currency_code is distinct from v_quote.settlement_currency_code
                or v_holding.average_unit_cost <> 0
              )
            then
              update public.inventory_holdings
              set
                average_unit_cost = 0,
                cost_currency_code = v_quote.settlement_currency_code,
                version = version + 1,
                updated_at = v_now
              where id = v_holding.id
              returning * into v_holding;
            end if;
          
            perform public.ensure_business_bank_account_v2(
              p_game_session_id,
              v_business.business_id
            );
          
            select balance_row.*
            into v_balance
            from public.account_balances as balance_row
            where balance_row.game_session_id = p_game_session_id
              and balance_row.business_id = v_business.business_id
              and balance_row.currency_code = v_quote.settlement_currency_code
            for update;
          """,
          )
          
          replace_once(
              migration,
              "        'unitCost', v_quote.final_unit_price,\n",
              "        'unitCost', v_settled_unit_cost,\n",
          )
          
          replace_once(
              migration,
              "          'settledAcquisitionPrice', v_quote.final_unit_price\n",
              """          'settledAcquisitionPrice', v_settled_unit_cost,
                    'settledTotalPrice', v_quote.final_total_price
          """,
          )
          
          replace_once(
              migration,
              """    inventory_transaction_id = (v_inventory_transaction->>'transactionId')::uuid,
              status = 'COMPLETED',
          """,
              """    inventory_transaction_id = (v_inventory_transaction->>'transactionId')::uuid,
              warehouse_quantity_owned = v_holding.quantity_owned,
              warehouse_average_unit_cost = v_holding.average_unit_cost,
              status = 'COMPLETED',
          """,
          )
          
          replace_once(
              migration,
              """  where id = v_purchase.id
            returning * into v_purchase;
          
            return query select
          """,
              """  where id = v_purchase.id
            returning * into v_purchase;
          
            insert into public.business_activity_events(
              game_session_id,
              business_id,
              formation_id,
              actor_type,
              actor_player_id,
              event_type,
              source_id,
              reason_code,
              metadata,
              occurred_at
            ) values (
              p_game_session_id,
              v_business.business_id,
              null,
              'player',
              p_player_id,
              'business.store.procurement.completed',
              v_purchase.id,
              'store_procurement_purchase',
              jsonb_build_object(
                'businessKey', v_business.business_key,
                'receiptKey', v_purchase.public_key,
                'quoteKey', v_quote.public_key,
                'storeItemKey', v_item.item_key,
                'quantity', v_purchase.quantity,
                'settledUnitCost', v_settled_unit_cost,
                'finalTotalPrice', v_purchase.final_total_price,
                'currencyCode', v_purchase.currency_code,
                'inventoryTransactionKey', v_inventory_transaction->>'transactionKey'
              ),
              v_now
            );
          
            return query select
          """,
          )
          
          replace_once(
              migration,
              """    v_holding.quantity_owned,
              v_holding.average_unit_cost,
              v_purchase.completed_at,
              false;
          """,
              """    v_purchase.warehouse_quantity_owned,
              v_purchase.warehouse_average_unit_cost,
              v_purchase.completed_at,
              false;
          """,
          )
          
          replace_once(
              migration,
              """revoke all on table public.business_store_purchases
            from public, anon, authenticated;
          
          revoke all on function public.create_business_store_quote_v2(
          """,
              """revoke all on table public.business_store_purchases
            from public, anon, authenticated;
          revoke all on function public.guard_business_store_quote_evidence_v2()
            from public, anon, authenticated;
          revoke all on function public.guard_business_store_purchase_evidence_v2()
            from public, anon, authenticated;
          
          revoke all on function public.create_business_store_quote_v2(
          """,
          )
          
          # Public DTO validation must match the canonical country-code contract.
          replace_once(
              "backend/src/domains/business/api/playerBusinessStoreProcurement.ts",
              "const COUNTRY_CODE = /^[A-Z0-9_-]{2,16}$/u;",
              "const COUNTRY_CODE = /^[A-Z][A-Z0-9_]{2,31}$/u;",
          )
          
          # Stable public errors for every Phase 3B failure boundary.
          repository = "backend/src/domains/business/infrastructure/supabasePlayerBusinessRepository.ts"
          replace_once(
              repository,
              "  const mappings: Record<string, [number, string]> = {\n",
              "  const mappings: Record<string, [number, string, boolean?]> = {\n",
          )
          replace_once(
              repository,
              """    BUSINESS_FORMATION_INSUFFICIENT_OWNER_FUNDS: [409, "One or more owners do not have enough funds for the agreed contribution."],
            };
          """,
              """    BUSINESS_FORMATION_INSUFFICIENT_OWNER_FUNDS: [409, "One or more owners do not have enough funds for the agreed contribution."],
              BUSINESS_OWNERSHIP_AMBIGUOUS: [409, "Multiple open Businesses are associated with this Player."],
              STORE_ITEM_KEY_INVALID: [400, "Store item key is invalid."],
              STORE_QUOTE_QUANTITY_INVALID: [400, "Store quote quantity is invalid."],
              IDEMPOTENCY_KEY_REQUIRED: [400, "A valid idempotency key is required."],
              STORE_ITEM_NOT_FOUND: [404, "Store item is not available."],
              BUSINESS_COUNTRY_PROFILE_NOT_FOUND: [409, "The Business country is not configured for Store pricing."],
              BUSINESS_CURRENCY_MISMATCH: [409, "The Business currency does not match this procurement quote."],
              COUNTRY_PROFILE_NOT_FOUND: [409, "The Business country is not configured for Store pricing."],
              COUNTRY_SNAPSHOT_NOT_FOUND: [409, "A current country economic snapshot is required for Store pricing."],
              STORE_QUOTE_CURRENCY_INVALID: [409, "The Business settlement currency is invalid."],
              INSUFFICIENT_STOCK: [409, "Store stock is insufficient for this purchase."],
              QUOTE_NOT_FOUND: [404, "Business Store quote was not found."],
              QUOTE_NOT_USABLE: [409, "Business Store quote can no longer be used."],
              QUOTE_EXPIRED: [409, "Business Store quote has expired."],
              INSUFFICIENT_BUSINESS_BALANCE: [409, "Business cash is insufficient for this purchase."],
              ITEM_CANONICAL_CONTEXT_UNAVAILABLE: [409, "Store item is not connected to canonical inventory."],
              BUSINESS_STOCKROOM_COST_CURRENCY_MISMATCH: [409, "Existing Stockroom cost basis uses another currency."],
              INVENTORY_POSTING_RESULT_MISSING: [500, "Canonical inventory settlement did not produce a Stockroom result.", true],
              IDEMPOTENCY_IN_PROGRESS: [409, "This Business Store purchase is still processing.", true],
              GAME_SESSION_DISABLED: [409, "Business Store purchases are paused for this game.", true],
              GAME_SESSION_ARCHIVED: [409, "Business Store purchases are closed because this game has ended."],
              GAME_SESSION_NOT_ACTIVE: [409, "Business Store purchases are unavailable for this game."],
              GAME_SESSION_NOT_FOUND: [409, "Business Store purchases are unavailable for this game."],
            };
          """,
          )
          replace_once(
              repository,
              """    mapped?.[0] ?? 400,
            );
          """,
              """    mapped?.[0] ?? 400,
              mapped?.[2] ?? false,
            );
          """,
          )
          
          # Route authority tests must cover both direct and Edge-prefixed procurement URLs.
          route_tests = "backend/src/domains/business/api/playerBusinessRoutePaths.test.ts"
          replace_once(
              route_tests,
              """  assertEquals(readPlayerBusinessRoutePath("/players/me/business/recipes"), {
              kind: "businessRead",
              resource: "recipes",
            });
          """,
              """  assertEquals(readPlayerBusinessRoutePath("/players/me/business/recipes"), {
              kind: "businessRead",
              resource: "recipes",
            });
            assertEquals(
              readPlayerBusinessRoutePath("/players/me/business/store/quotes"),
              { kind: "businessStoreQuote" },
            );
            assertEquals(
              readPlayerBusinessRoutePath("/players/me/business/store/purchases"),
              { kind: "businessStorePurchase" },
            );
          """,
          )
          replace_once(
              route_tests,
              """  assertEquals(readPlayerBusinessRoutePath("/functions/v1/classroom-api/players/me/business/recipes"), {
              kind: "businessRead",
              resource: "recipes",
            });
          """,
              """  assertEquals(readPlayerBusinessRoutePath("/functions/v1/classroom-api/players/me/business/recipes"), {
              kind: "businessRead",
              resource: "recipes",
            });
            assertEquals(
              readPlayerBusinessRoutePath("/player-api/players/me/business/store/quotes"),
              { kind: "businessStoreQuote" },
            );
            assertEquals(
              readPlayerBusinessRoutePath(
                "/functions/v1/classroom-api/players/me/business/store/purchases",
              ),
              { kind: "businessStorePurchase" },
            );
          """,
          )
          replace_once(
              route_tests,
              """  assertEquals(readPlayerBusinessRoutePath("/players/me/business/recipes/extra"), null);
            assertEquals(readPlayerBusinessRoutePath("/games/game/business"), null);
          """,
              """  assertEquals(readPlayerBusinessRoutePath("/players/me/business/recipes/extra"), null);
            assertEquals(readPlayerBusinessRoutePath("/players/me/business/store/quotes/extra"), null);
            assertEquals(readPlayerBusinessRoutePath("/players/me/business/store/purchases/extra"), null);
            assertEquals(readPlayerBusinessRoutePath("/games/game/business"), null);
          """,
          )
          
          # Add application/browser contracts.
          write_b64(
              "backend/src/domains/business/api/playerBusinessStoreProcurement.test.ts",
              "",
          )
          write_b64(
              "scripts/business-store-procurement-authority-contract.mjs",
              "",
          )
          
          # Business CI must explicitly watch, exercise, and retain Phase 3B.
          workflow = ".github/workflows/business-economy-v2.yml"
          replace_once(
              workflow,
              """      - "backend/supabase/migrations/20260819*.sql"
                - "backend/src/domains/business/**"
          """,
              """      - "backend/supabase/migrations/20260819*.sql"
                - "backend/supabase/migrations/20260820*.sql"
