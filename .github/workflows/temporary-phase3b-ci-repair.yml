      - name: Install repository dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Regenerate final-tree architecture inventory
        run: node scripts/architecture/build-architecture-inventory.mjs

      - name: Validate migration catalog
        run: npm run audit:migrations

      - name: Validate Phase 3B static authority
        shell: bash
        run: |
          node --check scripts/business-store-procurement-authority-contract.mjs
          node scripts/business-formation-authority-contract.mjs
          node scripts/business-economy-authority-contract.mjs
          node scripts/business-domain-boundary-contract.mjs
          node scripts/business-recipe-access-contract.mjs
          node scripts/business-stockroom-authority-contract.mjs
          node scripts/business-store-procurement-authority-contract.mjs
          node scripts/business-banking-runtime-contract.mjs

      - name: Validate Business routes and procurement browser contract
        working-directory: backend
        run: |
          deno test --config supabase/functions/classroom-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            src/domains/business/api/playerBusinessRoutePaths.test.ts \
            src/domains/business/api/playerBusinessStoreProcurement.test.ts

      - name: Typecheck all backend and Edge surfaces
        run: npm --prefix backend run typecheck:all

      - name: Re-run Progression compatibility contracts
        run: npm --prefix backend run test:player-progression

      - name: Scan patched source for credentials
        run: npm run security:secrets

      - name: Verify generated inventory and patch stability
        shell: bash
        run: |
          cp docs/architecture/inventories/econovaria-architecture-inventory-v2.json /tmp/phase3b-inventory.json
          node scripts/architecture/build-architecture-inventory.mjs
          cmp /tmp/phase3b-inventory.json docs/architecture/inventories/econovaria-architecture-inventory-v2.json
          git diff --check

      - name: Commit and push verified Phase 3B hardening
        shell: bash
        run: |
          git config user.name "econovaria-ci-repair"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            .github/workflows/business-economy-v2.yml \
            .github/workflows/temporary-phase3b-ci-repair.yml \
            backend/supabase/migrations/20260821060000_business_store_procurement_v2.sql \
            backend/src/domains/business/api/playerBusinessStoreProcurement.ts \
            backend/src/domains/business/api/playerBusinessRoutePaths.test.ts \
            backend/src/domains/business/api/playerBusinessStoreProcurement.test.ts \
            backend/src/domains/business/infrastructure/supabasePlayerBusinessRepository.ts \
            scripts/business-store-procurement-authority-contract.mjs \
            docs/architecture/inventories/econovaria-architecture-inventory-v2.json
          git diff --cached --check
          git commit -m "fix(business): harden Phase 3B procurement settlement"
          git push origin HEAD:feat/business-store-procurement-v2
