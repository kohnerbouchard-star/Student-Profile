name: Admin V2 Settings Check

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/admin-v2-settings-check.yml"
      - "admin/v2.html"
      - "admin/v2/src/app.js"
      - "admin/v2/src/core/navigation-registry.js"
      - "admin/v2/src/routes/settings/**"
      - "admin/v2/styles/routes/settings.css"
      - "scripts/admin-v2-settings-api.test.mjs"
      - "scripts/admin-v2-settings-browser-smoke.mjs"
      - "scripts/admin-v2-browser-fixture-server.mjs"
      - "docs/architecture/admin-ui-v2-settings.md"
      - "docs/operations/evidence/admin-ui-v2-settings/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-v2-settings-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  settings:
    name: Settings contract and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ADMIN_V2_SETTINGS_EVIDENCE_DIR: /tmp/admin-v2-settings-evidence

    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install repository dependencies
        run: npm ci

      - name: Validate Settings source syntax
        run: |
          node --check admin/v2/src/routes/settings/SettingsApi.js
          node --check admin/v2/src/routes/settings/SettingsController.js
          node --check admin/v2/src/routes/settings/SettingsRoute.js
          node --check admin/v2/src/app.js
          node --check admin/v2/src/core/navigation-registry.js
          node --check scripts/admin-v2-settings-api.test.mjs
          node --check scripts/admin-v2-settings-browser-smoke.mjs

      - name: Run Settings API and controller contracts
        run: node --test scripts/admin-v2-settings-api.test.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run rendered Settings browser acceptance
        run: node scripts/admin-v2-settings-browser-smoke.mjs

      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD

      - name: Upload Settings browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-v2-settings-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/admin-v2-settings-evidence/
          if-no-files-found: warn
          retention-days: 30
