name: Player Credential Runtime Readiness

on:
  pull_request:
    paths:
      - "backend/src/security/playerCredentialHashing.ts"
      - "backend/src/security/playerCredentialHashing.test.ts"
      - "backend/supabase/functions/admin-api/progressionRateLimit.ts"
      - "backend/supabase/functions/admin-api/progressionRateLimit.contract.test.ts"
      - ".github/workflows/production-player-credential-pepper.yml"
      - ".github/workflows/player-credential-runtime-readiness.yml"
      - "docs/operations/evidence/production-player-credential-pepper-preflight-v1.json"
      - "scripts/player-credential-runtime-readiness-contract.test.mjs"
  push:
    branches:
      - main
    paths:
      - "backend/src/security/playerCredentialHashing.ts"
      - "backend/src/security/playerCredentialHashing.test.ts"
      - "backend/supabase/functions/admin-api/progressionRateLimit.ts"
      - "backend/supabase/functions/admin-api/progressionRateLimit.contract.test.ts"
      - ".github/workflows/production-player-credential-pepper.yml"
      - ".github/workflows/player-credential-runtime-readiness.yml"
      - "docs/operations/evidence/production-player-credential-pepper-preflight-v1.json"
      - "scripts/player-credential-runtime-readiness-contract.test.mjs"

permissions:
  contents: read

concurrency:
  group: player-credential-runtime-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Credential readiness contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"

      - name: Validate bounded runtime and production-secret contracts
        run: node --test scripts/player-credential-runtime-readiness-contract.test.mjs
