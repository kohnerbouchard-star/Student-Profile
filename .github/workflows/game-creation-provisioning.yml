name: Game Creation Provisioning

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/game-creation-provisioning.yml"
      - "backend/supabase/migrations/**"
      - "backend/src/domains/game-sessions/tests/gameCreationProvisioningMigrationContract.test.ts"
      - "backend/supabase/functions/admin-api/gameProvisioningOperations.ts"
      - "backend/supabase/functions/admin-api/gameProvisioningOperations.test.ts"
      - "scripts/game-creation-provisioning-local-acceptance.mjs"
      - "scripts/full-game-local-e2e-acceptance.mjs"
      - "scripts/build-physical-economy-runtime-pack.mjs"
      - "scripts/world-staging-provision-lib.mjs"
      - "docs/operations/contracts/beta-seed-downstream-consumer-contract-v1.json"
      - "docs/seed-content/executable/beta-pack-v1/**"

permissions:
  contents: read

concurrency:
  group: game-creation-provisioning-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PHYSICAL_ECONOMY_PACK: /tmp/physical-economy-runtime-pack.json
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install pinned repository tooling
        run: |
          npm install --global npm@10.9.8
          npm ci
          node --check scripts/game-creation-provisioning-local-acceptance.mjs
          node --check scripts/full-game-local-e2e-acceptance.mjs

      - name: Build exact authorized Crafting pack
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const contract = JSON.parse(await readFile(
            "docs/operations/contracts/beta-seed-downstream-consumer-contract-v1.json",
            "utf8",
          ));
          process.stdout.write(contract.acceptedImplementationSourceSha);
          NODE
          )"
          node scripts/build-physical-economy-runtime-pack.mjs \
            --source-root . \
            --source-commit "$SOURCE_COMMIT" \
            --approved-source-commit "$SOURCE_COMMIT" \
            --output "$PHYSICAL_ECONOMY_PACK"

      - name: Start disposable Supabase Postgres
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/game-creation-provisioning-startup.log
          : > "$LOG"
          EXCLUDED="studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,gotrue,postgrest,realtime,kong,mailpit,postgres-meta"
          for ATTEMPT in 1 2 3; do
            set +e
            npx supabase start --workdir backend --exclude "$EXCLUDED" 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            npx supabase stop --workdir backend --no-backup 2>&1 | tee -a "$LOG" || true
            sleep $((ATTEMPT * 10))
          done
          exit "$STATUS"

      - name: Rebuild database from zero
        run: npx supabase db reset --workdir backend --local

      - name: Execute canonical V1 source provisioning
        shell: bash
        run: |
          set -o pipefail
          node scripts/game-creation-provisioning-local-acceptance.mjs \
            2>&1 | tee /tmp/game-creation-provisioning-local-acceptance.log

      - name: Execute connected full-game V2 activation
        shell: bash
        run: |
          set -o pipefail
          node scripts/full-game-local-e2e-acceptance.mjs \
            2>&1 | tee /tmp/full-game-local-e2e-acceptance.log

      - name: Execute first-game license redemption rollback probe
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 2>&1 <<'SQL' \
            | tee /tmp/license-redemption-local-acceptance.log
          create temporary table license_redemption_probe_result (
            result jsonb not null
          );

          do $probe$
          declare
            v_staff_id uuid;
            v_legacy_hash text := encode(
              extensions.digest(
                'ECON-LOCAL-LICENSE-ROLLBACK-PROBE',
                'sha256'
              ),
              'hex'
            );
            v_primary_hash text := encode(
              extensions.digest(
                'econovaria-purchase-code-v2|synthetic-local-rollback-probe',
                'sha256'
              ),
              'hex'
            );
            v_code_envelope text;
            v_hash_version text;
            v_redemption record;
            v_verification jsonb;
            v_result jsonb;
          begin
            v_code_envelope := 'v2.' || v_primary_hash || '.' || v_legacy_hash;

            select game_row.owner_staff_user_id into v_staff_id
            from public.seed_content_releases as release_row
            join public.game_sessions as game_row
              on game_row.id = release_row.game_session_id
            where release_row.pack_id = 'econovaria.beta-seed-pack.v1'
              and release_row.status = 'applied_active'
              and release_row.target_environment in ('local', 'test', 'staging')
            order by release_row.applied_at desc nulls last,
              release_row.created_at desc
            limit 1;

            if v_staff_id is null then
              raise exception 'LICENSE_PROBE_STAFF_MISSING';
            end if;

            begin
              insert into public.purchase_codes (
                code_hash, code_hash_version, status, max_redemptions, redeemed_count
              ) values (
                v_legacy_hash, 'sha256-v1', 'active', 1, 0
              );

              select * into v_redemption
              from public.redeem_purchase_code_for_game(
                v_staff_id,
                v_code_envelope,
                '[SYNTHETIC] License Redemption Rollback Probe',
                '{"difficulty_preset":"moderate","stock_market_window":{"timezone":"Asia/Seoul"}}'::jsonb,
                '{"source":"local-license-redemption-rollback-probe"}'::jsonb
              );

              select purchase_code_row.code_hash_version into v_hash_version
              from public.purchase_codes as purchase_code_row
              where purchase_code_row.id = v_redemption.purchase_code_id;

              v_verification := public.verify_provisioned_game_v1(
                v_redemption.game_session_id,
                v_staff_id
              );

              v_result := jsonb_build_object(
                'redeemed', true,
                'purchaseCodeStatus', v_redemption.purchase_code_status,
                'redeemedCount', v_redemption.redeemed_count,
                'maxRedemptions', v_redemption.max_redemptions,
                'hashVersion', v_hash_version,
                'gameReady', coalesce(
                  (v_verification->>'ready')::boolean,
                  false
                ),
                'counts', v_verification->'counts',
                'entitlementCreated', exists (
                  select 1
                  from public.entitlements as entitlement_row
                  where entitlement_row.id = v_redemption.entitlement_id
                    and entitlement_row.status = 'active'
                )
              );

              if v_redemption.purchase_code_status <> 'exhausted'
                or v_redemption.redeemed_count <> 1
                or v_hash_version <> 'hmac-sha256-v2'
                or coalesce(
                  (v_verification->>'ready')::boolean,
                  false
                ) is not true
                or coalesce(
                  (v_verification #>> '{counts,marketAssets}')::integer,
                  0
                ) <> 240
                or coalesce(
                  (v_verification #>> '{counts,contracts}')::integer,
                  0
                ) <> 30
                or coalesce(
                  (v_verification #>> '{counts,storeItems}')::integer,
                  0
                ) <> 50
              then
                raise exception 'LICENSE_REDEMPTION_PROBE_ASSERTION_FAILED';
              end if;

              raise exception 'LICENSE_REDEMPTION_PROBE_ROLLBACK'
                using errcode = 'ZX001';
            exception
              when sqlstate 'ZX001' then
                insert into license_redemption_probe_result(result)
                values (v_result);
            end;
          end;
          $probe$;

          select result::text as rollback_probe
          from license_redemption_probe_result;
          SQL

      - name: Upload sanitized provisioning evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: game-creation-provisioning-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/game-creation-provisioning-startup.log
            /tmp/game-creation-provisioning-local-acceptance.log
            /tmp/game-creation-provisioning-local-acceptance.json
            /tmp/full-game-local-e2e-acceptance.log
            /tmp/full-game-local-e2e-acceptance.json
            /tmp/license-redemption-local-acceptance.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stop disposable database
        if: always()
        run: npx supabase stop --workdir backend --no-backup || true
