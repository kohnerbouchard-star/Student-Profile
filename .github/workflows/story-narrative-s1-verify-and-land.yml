name: Story Narrative S1 Verify And Land

on:
  push:
    branches:
      - feat/story-narrative-convergence-v1
    paths:
      - ".github/workflows/story-narrative-s1-verify-and-land.yml"

permissions:
  contents: write

concurrency:
  group: story-narrative-s1-verify-and-land
  cancel-in-progress: false

jobs:
  verify-and-land:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out exact story branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify story branch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/story-narrative-convergence-v1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md
          test "$(git merge-base HEAD 8394595b898957676869fb3c692e96969ad0e09e)" = "8394595b898957676869fb3c692e96969ad0e09e"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.3

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.109.1

      - name: Reassemble and manifest-verify S1 payload
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '09fa666dfb46eb719bd805242e37213cbf605a0697e290f8ab830b9199e9dc5e' 'scripts/story-narrative/bootstrap/story-character-messaging-v1.zip.b64.part00' \
            'aeea20eccf8c790ddbb03506d9ba1103d6e39c4b7f92948ada3e410d52f7b18c' 'scripts/story-narrative/bootstrap/story-character-messaging-v1.zip.b64.part01' \
            '7f6c4735ac7db8d6890ce004b6272a25ac13147c56f1b190ebac13af1dc4ca1a' 'scripts/story-narrative/bootstrap/story-character-messaging-v1.zip.b64.part02' \
            '6e55f23f5f5dcfaaf65bdd2a1b5079a971d5d171eeb66ca04b7a89bbc24d2a48' 'scripts/story-narrative/bootstrap/story-character-messaging-v1.zip.b64.part03' \
            '5e136c149096ba24d55a69f73a0369e2d3ae1f181a2866384114c09d3ac6115c' 'scripts/story-narrative/bootstrap/story-character-messaging-v1.zip.b64.part04' \
            | sha256sum --check
          cat scripts/story-narrative/bootstrap/story-character-messaging-v1.zip.b64.part* > "$RUNNER_TEMP/story-character-messaging-v1.zip.b64"
          base64 --decode "$RUNNER_TEMP/story-character-messaging-v1.zip.b64" > "$RUNNER_TEMP/story-character-messaging-v1.zip"
          echo '46ac7cf88aadc9341f0bc9ebd8d65136217862effbbe08357049f06730180604  '"$RUNNER_TEMP/story-character-messaging-v1.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/story-character-messaging-v1"
          set +e
          unzip -q -o "$RUNNER_TEMP/story-character-messaging-v1.zip" -d "$RUNNER_TEMP/story-character-messaging-v1"
          unzip_status=$?
          set -e
          if [ "$unzip_status" -ne 0 ] && [ "$unzip_status" -ne 1 ]; then
            exit "$unzip_status"
          fi
          BUNDLE_DIR="$(find "$RUNNER_TEMP/story-character-messaging-v1" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$BUNDLE_DIR"
          export BUNDLE_DIR
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["BUNDLE_DIR"])
          manifest = json.loads((root / "MANIFEST.json").read_text(encoding="utf-8"))
          for item in manifest["files"]:
              path = root / item["path"]
              if not path.is_file():
                  raise SystemExit(f"missing bundle member: {item['path']}")
              data = path.read_bytes()
              if len(data) != item["bytes"]:
                  raise SystemExit(f"bundle size mismatch: {item['path']}")
              if hashlib.sha256(data).hexdigest() != item["sha256"]:
                  raise SystemExit(f"bundle sha mismatch: {item['path']}")
          print(f"Manifest-verified {len(manifest['files'])} S1 payload files.")
          PY
          python3 "$BUNDLE_DIR/validate_bundle.py"
          echo "BUNDLE_DIR=$BUNDLE_DIR" >> "$GITHUB_ENV"

      - name: Generate S1 migration with pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "2.109.1"
          find backend/supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/migrations-before.txt"
          (
            cd backend
            supabase migration new --help > "$RUNNER_TEMP/supabase-migration-new-help.txt"
            supabase migration new add_story_character_messaging_v1
          )
          find backend/supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/migrations-after.txt"
          MIGRATION_NAME="$(comm -13 "$RUNNER_TEMP/migrations-before.txt" "$RUNNER_TEMP/migrations-after.txt" | grep '_add_story_character_messaging_v1.sql$')"
          test -n "$MIGRATION_NAME"
          test "$(printf '%s\n' "$MIGRATION_NAME" | wc -l)" = "1"
          MIGRATION="backend/supabase/migrations/$MIGRATION_NAME"
          test -f "$MIGRATION"
          echo "MIGRATION=$MIGRATION" >> "$GITHUB_ENV"
          echo "MIGRATION_NAME=$MIGRATION_NAME" >> "$GITHUB_ENV"

      - name: Apply guarded S1 source transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 "$BUNDLE_DIR/apply_story_character_messaging_v1.py" \
            --repo "$GITHUB_WORKSPACE" \
            --migration "$MIGRATION"
          git diff --check

      - name: Narrow character-message contract test discriminant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("backend/src/domains/storylines/contracts/storyCharacterMessageContract.test.ts")
          text = path.read_text(encoding="utf-8")
          old = '  assertEquals(effect.messagePurpose, "relationship");\n  assertEquals(effect.interactionKey, null);\n'
          new = '  if (effect.type !== "character_message") {\n    throw new Error("Expected character_message effect.");\n  }\n  assertEquals(effect.messagePurpose, "relationship");\n  assertEquals(effect.interactionKey, null);\n'
          if old not in text:
              raise SystemExit("character-message type-narrowing anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Verify backend and Edge types
        working-directory: backend
        run: npm run typecheck:all

      - name: Verify Player Messaging and story character contracts
        working-directory: backend
        run: npm run test:player-messaging

      - name: Verify story scheduler integration
        working-directory: backend
        run: npm run test:stock-market-calendar

      - name: Verify Admin Messaging moderation boundary
        working-directory: backend
        run: npm run test:admin-api

      - name: Verify Admin V2 Messages presentation boundary
        run: node --test scripts/admin-v2-messages.test.mjs

      - name: Update authoritative story roadmap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path("docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md")
          text = path.read_text(encoding="utf-8")
          old = "### S1 — Recurring character messaging foundation\n\nStatus: IMPLEMENTATION STAGED / VERIFICATION IN PROGRESS"
          new = "### S1 — Recurring character messaging foundation\n\nStatus: COMPLETE ON BRANCH / CONNECTED STAGING PENDING"
          if old not in text:
              raise SystemExit("roadmap S1 status anchor not found")
          text = text.replace(old, new, 1)
          marker = "\n## Run-completion rule\n"
          lines = [
              "",
              "### Run 2026-08-10 — S1 recurring character messaging landed",
              "",
              f"Workflow run: `{os.environ['GITHUB_RUN_ID']}`",
              f"Source head verified by runner: `{os.environ['GITHUB_SHA']}`",
              f"Migration: `{os.environ['MIGRATION_NAME']}`",
              "",
              "Result: SOURCE + FOCUSED REGRESSION GREEN ON BRANCH.",
              "",
              "Implemented:",
              "",
              "- first-class read-only `story` Messaging thread subtype;",
              "- one persistent private conversation per game + Player + recurring character;",
              "- immutable per-message storyline/event provenance;",
              "- server-owned idempotent `character_message` story-effect delivery;",
              "- Player character-name projection without ownership/event UUID exposure;",
              "- Admin moderation visibility without character impersonation;",
              "- immutable story-thread membership through generic Admin participant controls;",
              "- moderation-suppressed character delivery does not stall global story progression.",
              "",
              "Verification completed:",
              "",
              "- manifest SHA-256 verification of the staged S1 payload;",
              "- `git diff --check`;",
              "- `npm run typecheck:all`;",
              "- `npm run test:player-messaging`;",
              "- `npm run test:stock-market-calendar`;",
              "- `npm run test:admin-api`;",
              "- `node --test scripts/admin-v2-messages.test.mjs`.",
              "",
              "Remaining S1 acceptance:",
              "",
              "- connected staging database replay/acceptance before merge.",
              "",
              "Next: S2 structured narrative response windows.",
              "",
          ]
          entry = "\n".join(lines)
          if marker not in text:
              raise SystemExit("roadmap run-completion marker not found")
          text = text.replace(marker, entry + marker, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Remove temporary S1 bootstrap transport
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/story-narrative-s1-bootstrap.yml \
            .github/workflows/story-narrative-s1-bundle-diagnose.yml \
            .github/workflows/story-narrative-s1-verify-and-land.yml \
            scripts/story-narrative/bootstrap/story-character-messaging-v1.zip.b64.part00 \
            scripts/story-narrative/bootstrap/story-character-messaging-v1.zip.b64.part01 \
            scripts/story-narrative/bootstrap/story-character-messaging-v1.zip.b64.part02 \
            scripts/story-narrative/bootstrap/story-character-messaging-v1.zip.b64.part03 \
            scripts/story-narrative/bootstrap/story-character-messaging-v1.zip.b64.part04
          rmdir scripts/story-narrative/bootstrap 2>/dev/null || true
          rmdir scripts/story-narrative 2>/dev/null || true

      - name: Commit verified S1 implementation to story branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- \
            .github/workflows/story-narrative-s1-bootstrap.yml \
            .github/workflows/story-narrative-s1-bundle-diagnose.yml \
            .github/workflows/story-narrative-s1-verify-and-land.yml \
            scripts/story-narrative \
            docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md \
            "$MIGRATION" \
            backend/package.json \
            backend/src/domains/storylines/infrastructure/supabaseStoryMessageWriter.ts \
            backend/src/domains/storylines/contracts/storyEffectContracts.ts \
            backend/src/domains/storylines/contracts/storyEffectExecutionContracts.ts \
            backend/src/domains/storylines/services/storyEffectEngine.ts \
            backend/src/domains/stocks/api/stockMarketRunnerHttpHandler.ts \
            backend/src/domains/messaging/api/playerMessagingHttpHandler.ts \
            player-terminal/src/pages/messages-page.js \
            backend/supabase/functions/admin-api/messagingOperationsCore.ts \
            backend/supabase/functions/admin-api/messagingParticipantOperations.ts \
            admin/v2/src/routes/messages/MessagesController.js \
            admin/v2/src/routes/messages/MessagesRoute.js \
            backend/src/domains/messaging/api/playerMessagingHttpHandler.test.ts \
            backend/supabase/functions/admin-api/messagingOperations.test.ts \
            backend/supabase/functions/admin-api/messagingParticipantOperations.test.ts \
            scripts/admin-v2-messages.test.mjs \
            backend/src/domains/storylines/contracts/storyCharacterMessageContract.test.ts \
            backend/src/domains/storylines/services/storyCharacterMessageEffect.test.ts \
            backend/src/domains/storylines/infrastructure/supabaseStoryMessageWriter.test.ts \
            backend/src/domains/messaging/tests/storyCharacterMessagingMigrationContract.test.ts
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(story): add recurring character messaging foundation"
          git push origin HEAD:feat/story-narrative-convergence-v1
