name: Reconcile PR 377 with main

on:
  push:
    branches:
      - agent/runtime-stability-button-integrity-v1
    paths:
      - .github/workflows/reconcile-pr377-with-main.yml

permissions:
  contents: write

jobs:
  inventory-conflicts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Persist conflict hunks against main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git -c merge.conflictStyle=diff3 merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          mkdir -p docs/operations/reconciliation
          {
            echo "# PR 377 conflict hunks"
            echo
            echo "- PR head: $(git rev-parse HEAD)"
            echo "- Main head: $(git rev-parse origin/main)"
            echo "- Merge status: ${merge_status}"
            echo
            for path in $(git diff --name-only --diff-filter=U | sort); do
              echo "## ${path}"
              echo '```diff'
              git diff --cc -- "$path" || true
              echo '```'
              echo
            done
          } > /tmp/pr377-conflict-hunks.md
          git merge --abort || true
          cp /tmp/pr377-conflict-hunks.md docs/operations/reconciliation/pr377-conflict-hunks.md
          git add docs/operations/reconciliation/pr377-conflict-hunks.md
          git commit -m "docs(reconcile): record PR 377 conflict hunks"
          git push origin HEAD:agent/runtime-stability-button-integrity-v1
