name: Reconcile PR 377 with main

on:
  push:
    branches:
      - agent/runtime-stability-button-integrity-v1
    paths:
      - .github/workflows/reconcile-pr377-with-main.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge main and resolve bounded conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            cat > /tmp/expected-conflicts.txt <<'EOF'
          .github/workflows/admin-browser-e2e.yml
          .github/workflows/beta-security-contract.yml
          admin/progression-review-client.js
          backend/src/domains/contracts/api/playerContractAcceptanceRoutePaths.ts
          backend/src/domains/contracts/api/playerContractPublicSubmitRoutePaths.ts
          backend/src/domains/contracts/api/playerContractRoutePaths.ts
          player-terminal/src/api/player-api.js
          player-terminal/tests/messaging-connected-lifecycle.mjs
          scripts/admin-messaging-moderation-contract.mjs
          scripts/admin-mounted-modal-focus-reconciled-smoke.mjs
          scripts/admin-mounted-operational-modal-focus-smoke.mjs
          scripts/econovaria-local-gateway.py
          EOF
            git diff --name-only --diff-filter=U | sort > /tmp/actual-conflicts.txt
            diff -u /tmp/expected-conflicts.txt /tmp/actual-conflicts.txt
          fi

          git checkout --theirs -- \
            .github/workflows/beta-security-contract.yml \
            admin/progression-review-client.js \
            backend/src/domains/contracts/api/playerContractAcceptanceRoutePaths.ts \
            backend/src/domains/contracts/api/playerContractPublicSubmitRoutePaths.ts \
            player-terminal/tests/messaging-connected-lifecycle.mjs \
            scripts/admin-messaging-moderation-contract.mjs \
            scripts/admin-mounted-modal-focus-reconciled-smoke.mjs \
            scripts/admin-mounted-operational-modal-focus-smoke.mjs \
            scripts/econovaria-local-gateway.py

          git checkout --ours -- \
            backend/src/domains/contracts/api/playerContractRoutePaths.ts

          git checkout --theirs -- \
            .github/workflows/admin-browser-e2e.yml \
            player-terminal/src/api/player-api.js

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/admin-browser-e2e.yml')
          text = path.read_text()

          def insert_after(source: str, anchor: str, addition: str) -> str:
              if addition.strip() in source:
                  return source
              if anchor not in source:
                  raise SystemExit(f'missing workflow anchor: {anchor!r}')
              return source.replace(anchor, anchor + addition, 1)

          text = insert_after(
              text,
              '      - "admin/**"\n',
              '      - "player-terminal/**"\n'
              '      - "backend/src/security/**"\n'
              '      - "backend/src/domains/attendance/**"\n'
              '      - "backend/src/domains/contracts/**"\n',
          )
          text = insert_after(
              text,
              '      - "scripts/admin-browser-reconnaissance.mjs"\n',
              '      - "scripts/admin-connected-ledger-mutation-browser-acceptance.mjs"\n'
              '      - "scripts/button-action-coverage-contract.mjs"\n',
          )
          text = insert_after(
              text,
              '      - "scripts/local-auth-readiness.mjs"\n',
              '      - "scripts/local-staging-gateway.py"\n',
          )
          text = insert_after(
              text,
              '      - "docs/operations/contracts/beta-seed-downstream-consumer-contract-v1.json"\n',
              '      - "docs/operations/contracts/button-action-coverage-v1.json"\n',
          )
          text = text.replace(
              'name: Rendered Admin browser journey',
              'name: Rendered Admin browser and secure mutation journey',
              1,
          )
          text = insert_after(
              text,
              '          node --check scripts/admin-browser-reconnaissance.mjs\n',
              '          node --check scripts/admin-connected-ledger-mutation-browser-acceptance.mjs\n'
              '          node --check scripts/button-action-coverage-contract.mjs\n',
          )
          text = text.replace(
              '          python3 -m py_compile scripts/econovaria-local-gateway.py\n',
              '          python3 -m py_compile scripts/econovaria-local-gateway.py scripts/local-staging-gateway.py\n',
              1,
          )
          ledger_step = '''\n      - name: Execute secure Admin ledger mutation journey\n        id: ledger_mutation\n        if: steps.browser.outcome == 'success'\n        continue-on-error: true\n        run: node scripts/admin-connected-ledger-mutation-browser-acceptance.mjs\n'''
          text = insert_after(
              text,
              "      - name: Execute rendered Create Game and Admin journey\n        id: browser\n        continue-on-error: true\n        run: node scripts/admin-browser-reconnaissance.mjs\n",
              ledger_step,
          )
          text = text.replace(
              "        if: steps.browser.outcome == 'failure'\n",
              "        if: steps.browser.outcome == 'failure' || steps.ledger_mutation.outcome == 'failure'\n",
              1,
          )
          text = text.replace(
              '      - name: Enforce rendered browser result\n        if: always()\n        shell: bash\n        run: test "${{ steps.browser.outcome }}" = "success"\n',
              '      - name: Enforce rendered browser results\n        if: always()\n        shell: bash\n        run: |\n          test "${{ steps.browser.outcome }}" = "success"\n          test "${{ steps.ledger_mutation.outcome }}" = "success"\n',
              1,
          )
          path.write_text(text)
          PY

          python3 - <<'PY'
          from pathlib import Path

          path = Path('player-terminal/src/api/player-api.js')
          text = path.read_text()

          helper = '''\nfunction actionPathParams(endpointKey, payload, params = {}) {\n  const endpoint = PLAYER_ENDPOINTS[endpointKey];\n  if (!endpoint || typeof endpoint.path !== "string") return { ...params };\n  const resolved = { ...params };\n  const source = payload && typeof payload === "object" && !Array.isArray(payload) ? payload : {};\n  for (const match of endpoint.path.matchAll(/:([A-Za-z][A-Za-z0-9_]*)/g)) {\n    const key = match[1];\n    if (resolved[key] !== undefined && resolved[key] !== null && String(resolved[key]).trim()) continue;\n    const value = source[key];\n    if (value === undefined || value === null || !String(value).trim()) continue;\n    resolved[key] = value;\n  }\n  return resolved;\n}\n'''
          anchor = 'function sessionFingerprint(config) {'
          if 'function actionPathParams(' not in text:
              if anchor not in text:
                  raise SystemExit('player api helper anchor missing')
              text = text.replace(anchor, helper + '\n' + anchor, 1)

          old = '''  async request(endpointKey, { params = {}, payload, force = false, signal = null } = {}) {\n    const { endpoint, path } = resolvedPath(endpointKey, params);\n    const requestId = createRequestId();\n    const mergedSignal = mergeAbortSignals(signal, this.sessionController.signal);\n    const context = { endpointKey, method: endpoint.method, path, payload, requestId, signal: mergedSignal.signal };\n'''
          new = '''  async request(endpointKey, { params = {}, payload, force = false, signal = null } = {}) {\n    const resolvedParams = actionPathParams(endpointKey, payload, params);\n    const { endpoint, path } = resolvedPath(endpointKey, resolvedParams);\n    const requestId = createRequestId();\n    const mergedSignal = mergeAbortSignals(signal, this.sessionController.signal);\n    const context = { endpointKey, method: endpoint.method, path, payload, params: resolvedParams, requestId, signal: mergedSignal.signal };\n'''
          if old not in text:
              raise SystemExit('player api read context anchor missing')
          text = text.replace(old, new, 1)

          old = '''  execute(endpointKey, payload, params = {}, { signal = null } = {}) {\n    const { endpoint, path } = resolvedPath(endpointKey, params);\n'''
          new = '''  execute(endpointKey, payload, params = {}, { signal = null } = {}) {\n    const resolvedParams = actionPathParams(endpointKey, payload, params);\n    const { endpoint, path } = resolvedPath(endpointKey, resolvedParams);\n'''
          if old not in text:
              raise SystemExit('player api write route anchor missing')
          text = text.replace(old, new, 1)

          old = '    const context = { endpointKey, method: endpoint.method, path, payload, requestId, idempotencyKey, signal: mergedSignal.signal };\n'
          new = '    const context = { endpointKey, method: endpoint.method, path, payload, params: resolvedParams, requestId, idempotencyKey, signal: mergedSignal.signal };\n'
          if old not in text:
              raise SystemExit('player api write context anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          python3 - <<'PY'
          from pathlib import Path

          repository = Path('backend/src/domains/marketplace/infrastructure/supabasePlayerMarketplaceRepository.ts')
          text = repository.read_text()
          old = 'select("item_key,name,description,category,image_url")'
          if old not in text:
              raise SystemExit('marketplace item projection anchor missing')
          text = text.replace(old, 'select("item_key,name,description,category")', 1)
          text = text.replace('    image: optionalAsset(item?.image_url),\n', '    image: null,\n', 1)
          repository.write_text(text)

          page = Path('player-terminal/src/pages/marketplace-page.js')
          text = page.read_text()
          import_anchor = 'import { renderEmptyState, renderStatusPill } from "../components/ui.js";\n'
          import_line = 'import { resolveStoreItemImage } from "../features/store/store-artwork.js";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('marketplace page import anchor missing')
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          text = text.replace(
              '<span class="player-terminal-marketplace-image"><img src="${escapeHtml(listing.image)}" alt="" /></span>',
              '<span class="player-terminal-marketplace-image"><img src="${escapeHtml(resolveStoreItemImage({ itemKey: listing.itemId, image: listing.image }))}" alt="" /></span>',
              1,
          )
          text = text.replace(
              '<span><img src="${escapeHtml(selected.image)}" alt="" /></span>',
              '<span><img src="${escapeHtml(resolveStoreItemImage({ itemKey: selected.itemId, image: selected.image }))}" alt="" /></span>',
              1,
          )
          page.write_text(text)
          PY

          rm -f player-terminal/src/api/player-api-core.js
          rm -f .github/workflows/reconcile-pr377-with-main.yml
          rm -f docs/operations/reconciliation/pr377-conflict-inventory.md
          rm -f docs/operations/reconciliation/pr377-conflict-hunks.md
          rmdir docs/operations/reconciliation 2>/dev/null || true

          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- ':!docs/operations/reconciliation/**'
          git diff --check --cached
          node --check player-terminal/src/api/player-api.js
          node --check player-terminal/src/pages/marketplace-page.js
          node --check scripts/admin-connected-ledger-mutation-browser-acceptance.mjs
          python3 -m py_compile scripts/econovaria-local-gateway.py scripts/local-staging-gateway.py

          git commit -m "Merge main into PR 377 and reconcile runtime contracts"
          git push origin HEAD:agent/runtime-stability-button-integrity-v1
