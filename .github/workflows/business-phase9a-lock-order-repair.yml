name: Business Phase 9A Lock-order Repair

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/business-phase9a-lock-order-repair.yml"

permissions:
  contents: write

concurrency:
  group: business-phase9a-lock-order-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 664 &&
      github.event.pull_request.head.ref == 'feat/business-store-withdrawal-safety-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Phase 9A branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/business-store-withdrawal-safety-v2
          fetch-depth: 0

      - name: Verify bounded lineage
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_HEAD="455ff3475fe8b4d249b0700fef4503422e49f0b2"
          git merge-base --is-ancestor "$SOURCE_HEAD" HEAD
          test -z "$(git diff --name-only "$SOURCE_HEAD" HEAD -- . \
            ':(exclude).github/workflows/business-phase9a-lock-order-repair.yml')"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deterministic tooling
        run: |
          npm install --global npm@10.9.8
          npm ci --ignore-scripts

      - name: Remove replay-versus-processor lock inversion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              file_path.write_text(text.replace(old, new, 1))

          replace_once(
              "backend/supabase/migrations/20260824120010_store_offer_withdrawal_request_command_v2.sql",
              """  select request_row.*\n  into v_request\n  from public.store_offer_withdrawal_requests as request_row\n  where request_row.game_session_id = p_game_session_id\n    and request_row.seller_party_id = v_party.id\n    and request_row.request_idempotency_key = btrim(p_idempotency_key)\n  for update;\n""",
              """  -- The offer row is already locked. Do not lock the request row here:\n  -- due processors intentionally lock request -> offer, and an idempotent\n  -- replay-side request lock would invert that order and permit a deadlock.\n  select request_row.*\n  into v_request\n  from public.store_offer_withdrawal_requests as request_row\n  where request_row.game_session_id = p_game_session_id\n    and request_row.seller_party_id = v_party.id\n    and request_row.request_idempotency_key = btrim(p_idempotency_key);\n""",
              "withdrawal replay lookup",
          )

          replace_once(
              "scripts/business-phase9-store-withdrawal-safety-contract.mjs",
              """if (\n  replayIndex < 0 ||\n  requestVersionIndex < 0 ||\n  replayIndex > requestVersionIndex\n) {\n  throw new Error(\n    \"Withdrawal idempotent replay must resolve before current offer-version rejection.\",\n  );\n}\n\nrequireTokens(source.processor, \"Bounded due withdrawal processor\", [\n""",
              """if (\n  replayIndex < 0 ||\n  requestVersionIndex < 0 ||\n  replayIndex > requestVersionIndex\n) {\n  throw new Error(\n    \"Withdrawal idempotent replay must resolve before current offer-version rejection.\",\n  );\n}\nconst replayLookupEnd = source.request.indexOf(\"if found then\", replayIndex);\nif (\n  replayLookupEnd < 0 ||\n  source.request.slice(replayIndex, replayLookupEnd).includes(\"for update\")\n) {\n  throw new Error(\n    \"Withdrawal replay must not lock the request row after locking the offer.\",\n  );\n}\nrequireTokens(source.request, \"Replay lock-order boundary\", [\n  \"due processors intentionally lock request -> offer\",\n  \"replay-side request lock would invert that order and permit a deadlock\",\n]);\n\nrequireTokens(source.processor, \"Bounded due withdrawal processor\", [\n""",
              "withdrawal lock-order structural contract",
          )

          replace_once(
              "scripts/business-phase9-store-withdrawal-safety-simulation.mjs",
              """assert.equal(authority.getRequest(mismatch.requestKey).status, \"completed\");\nassert.equal(authority.getListing(gameFive, offerFive).owned, 0);\n\nconst gameSix = \"game_six\";\n""",
              """assert.equal(authority.getRequest(mismatch.requestKey).status, \"completed\");\nassert.equal(authority.getListing(gameFive, offerFive).owned, 0);\n\nconst replayWorkerGame = \"game_replay_worker\";\nconst replayWorkerBusiness = literalKey(\"biz\", \"0\");\nconst replayWorkerOffer = literalKey(\"sof\", \"0\");\nauthority.registerOffer({\n  game: replayWorkerGame,\n  businessKey: replayWorkerBusiness,\n  partyKey: literalKey(\"pty\", \"b\"),\n  offerKey: replayWorkerOffer,\n  itemKey: item,\n  status: \"active\",\n  listedOwned: 2,\n  listedCost: 6,\n});\nconst replayWorkerCommand = {\n  game: replayWorkerGame,\n  businessKey: replayWorkerBusiness,\n  offerKey: replayWorkerOffer,\n  mode: \"full\",\n  quantity: null,\n  expectedOfferVersion: 1,\n  idempotencyKey: \"withdraw-replay-worker-0006\",\n};\nconst replayWorkerRequest = await authority.requestWithdrawal(\n  replayWorkerCommand,\n  t0 + 5_000_000,\n);\nconst transactionsBeforeReplayWorkerRace = authority.transactionCount();\nconst [replayDuringProcessing, replayWorkerProcessing] = await Promise.all([\n  authority.requestWithdrawal(\n    replayWorkerCommand,\n    replayWorkerRequest.effectiveAtUs,\n  ),\n  authority.processDue(replayWorkerRequest.effectiveAtUs, 25),\n]);\nassert.equal(replayDuringProcessing.replayed, true);\nassert.equal(replayDuringProcessing.requestKey, replayWorkerRequest.requestKey);\nassert.equal(replayWorkerProcessing.completedCount, 1);\nassert.equal(\n  authority.transactionCount(),\n  transactionsBeforeReplayWorkerRace + 1,\n  \"Concurrent replay and due processing must settle once without a lock cycle.\",\n);\nassert.equal(\n  authority.getRequest(replayWorkerRequest.requestKey).status,\n  \"completed\",\n);\nassert.equal(authority.getOffer(replayWorkerGame, replayWorkerOffer).version, 3);\n\nconst gameSix = \"game_six\";\n""",
              "replay-versus-processor concurrency simulation",
          )
          PY

          node scripts/architecture/build-architecture-inventory.mjs
          git diff --check

      - name: Verify lock-order hardening
        shell: bash
        run: |
          set -euo pipefail
          node scripts/business-phase9-store-withdrawal-safety-contract.mjs
          node scripts/business-phase9-store-withdrawal-safety-simulation.mjs
          node --experimental-strip-types scripts/business-phase9-store-withdrawal-safety-types.mjs
          node scripts/validate-supabase-migrations.mjs
          node scripts/architecture/build-architecture-inventory.mjs
          git diff --exit-code -- docs/architecture/inventories/econovaria-architecture-inventory-v2.json
          git diff --check

      - name: Commit hardening and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "econovaria-automation"
          git config user.email "econovaria-automation@users.noreply.github.com"
          git rm .github/workflows/business-phase9a-lock-order-repair.yml
          git add \
            backend/supabase/migrations/20260824120010_store_offer_withdrawal_request_command_v2.sql \
            scripts/business-phase9-store-withdrawal-safety-contract.mjs \
            scripts/business-phase9-store-withdrawal-safety-simulation.mjs
          git diff --cached --quiet && { echo "No lock-order changes were produced." >&2; exit 1; }
          git commit -m "fix(store): prevent withdrawal replay lock inversion"
          git push origin HEAD:feat/business-store-withdrawal-safety-v2
