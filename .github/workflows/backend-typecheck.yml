name: Backend Typecheck

on:
  pull_request:
    paths:
      - "backend/**"
      - "api/**"
      - "admin/**"
      - "auth/**"
      - "frontend/src/**"
      - ".github/workflows/backend-typecheck.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "api/**"
      - "admin/**"
      - "auth/**"
      - "frontend/src/**"
      - ".github/workflows/backend-typecheck.yml"

permissions:
  contents: read

jobs:
  backend-typecheck:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend typecheck
        shell: bash
        run: |
          set +e
          {
            npm run typecheck:all
            deno check \
              --config supabase/functions/classroom-api/deno.json \
              --lock=supabase/functions/deno.lock \
              --frozen \
              supabase/functions/bootstrap-api/index.ts \
              supabase/functions/staff-api/index.ts \
              supabase/functions/staff-mfa-api/index.ts \
              supabase/functions/player-api/index.ts \
              supabase/functions/web-session-api/index.ts \
              supabase/functions/password-reset-api/index.ts
            node --check ../api/_admin-bff-proxy.js
            node --check '../api/admin-session/[...path].js'
            node --check '../api/admin/[...path].js'
            node --check ../api/password-reset.js
            node --check ../admin/auth-session-manager.js
            node --check ../admin/admin-auth.js
            node --check ../admin/session-timeout-safe-exit.js
            node --check ../auth/reset-password.js
            node --check ../frontend/src/core/api.js
            node --check ../frontend/src/core/admin-mfa.js
            node --check ../frontend/src/core/login.js
          } > /tmp/backend-typecheck.log 2>&1
          echo $? > /tmp/backend-typecheck.status
          tail -n 260 /tmp/backend-typecheck.log
          exit 0

      - name: Upload backend typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-typecheck-diagnostics
          path: |
            /tmp/backend-typecheck.log
            /tmp/backend-typecheck.status
          if-no-files-found: error
          retention-days: 7

      - name: Enforce backend typecheck
        shell: bash
        run: |
          status="$(cat /tmp/backend-typecheck.status)"
          if [ "$status" != "0" ]; then
            echo "Backend typecheck failed. Download the backend-typecheck-diagnostics artifact."
            false
          fi

      - name: Run backend smoke tests
        shell: bash
        run: |
          set +e
          npm run smoke > /tmp/backend-smoke.log 2>&1
          echo $? > /tmp/backend-smoke.status
          tail -n 200 /tmp/backend-smoke.log
          exit 0

      - name: Upload backend smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-smoke-diagnostics
          path: |
            /tmp/backend-smoke.log
            /tmp/backend-smoke.status
          if-no-files-found: error
          retention-days: 7

      - name: Enforce backend smoke tests
        shell: bash
        run: |
          status="$(cat /tmp/backend-smoke.status)"
          if [ "$status" != "0" ]; then
            echo "Backend smoke failed. Download the backend-smoke-diagnostics artifact."
            false
          fi
