name: Diagnostic Admin Nonce Key Probe

on:
  push:
    branches:
      - diagnostic/admin-nonce-key-probe-20260921

permissions:
  contents: read

env:
  PROJECT_REF: cgiukdjwicykrmtkhudh

jobs:
  probe:
    name: Compare production nonce RPC key classes
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Probe modern secret and legacy service role
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          keys="$RUNNER_TEMP/keys.json"
          selected="$RUNNER_TEMP/selected.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" > "$keys"
          KEYS="$keys" SELECTED="$selected" node - <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync(process.env.KEYS, 'utf8'));
          const value = (row) => String(row?.api_key || row?.apiKey || '');
          const secret = rows.find((row) => value(row).startsWith('sb_secret_'));
          const service = rows.find((row) =>
            (row?.name === 'service_role' || row?.type === 'service_role') && value(row).split('.').length === 3
          );
          const out = { secret: value(secret), service: value(service) };
          if (!out.secret || !out.service) throw new Error('Required server key classes are unavailable.');
          fs.writeFileSync(process.env.SELECTED, JSON.stringify(out));
          NODE
          secret="$(node -p "require(process.env.SELECTED).secret")"
          service="$(node -p "require(process.env.SELECTED).service")"
          echo "::add-mask::$secret"
          echo "::add-mask::$service"
          now="$(date +%s)"
          expires="$(date -u -d '+5 minutes' '+%Y-%m-%dT%H:%M:%SZ')"
          base="https://$PROJECT_REF.supabase.co/rest/v1/rpc/claim_internal_runner_nonce_v2"

          probe() {
            label="$1"
            key="$2"
            hash="$(openssl rand -hex 32)"
            out="$RUNNER_TEMP/$label.json"
            payload="$(node -e 'process.stdout.write(JSON.stringify({p_runner_name:"admin-bff-vercel",p_nonce_hash:process.argv[1],p_timestamp_seconds:Number(process.argv[2]),p_expires_at:process.argv[3]}))' "$hash" "$now" "$expires")"
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "$out" --write-out '%{http_code}' --request POST "$base" \
              -H "apikey: $key" -H "Authorization: Bearer $key" \
              -H 'Content-Type: application/json' --data "$payload")"
            STATUS="$status" OUT="$out" LABEL="$label" node - <<'NODE'
          const fs = require('node:fs');
          let body = null;
          try { body = JSON.parse(fs.readFileSync(process.env.OUT, 'utf8')); } catch {}
          console.log(JSON.stringify({
            keyClass: process.env.LABEL,
            status: Number(process.env.STATUS),
            code: body && typeof body === 'object' ? String(body.code || '') || null : null,
            claimed: body === true
          }));
          NODE
          }

          probe modern_secret "$secret"
          probe legacy_service_role "$service"
