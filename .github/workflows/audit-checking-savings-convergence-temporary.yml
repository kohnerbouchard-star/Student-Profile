name: Audit Checking and Savings Convergence Temporary

on:
  push:
    branches:
      - fix/checking-savings-wallet-convergence-v1
    paths:
      - .github/workflows/audit-checking-savings-convergence-temporary.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out latest feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/checking-savings-wallet-convergence-v1
          fetch-depth: 0

      - name: Confirm conversion workflow completed
        run: |
          test ! -f .github/workflows/canonicalize-checking-savings-one-time.yml
          ! grep -RIl "Export PR Source Temporary" .github/workflows

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install pinned tooling
        run: |
          npm install --global npm@10.9.8
          npm ci
          npm --prefix backend ci

      - name: Run canonical account model contracts
        run: |
          node --test scripts/player-local-currency-authority-contract.test.mjs
          node --test scripts/checking-savings-account-type-contract.test.mjs
          node player-terminal/tests/store-local-currency.mjs
          npm --prefix backend run test:player-banking-public
          node scripts/validate-supabase-migrations.mjs
          node scripts/verify-player-cross-cutting-authority.mjs

      - name: Audit active source for retired account routes
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('admin'),
              Path('backend/src'),
              Path('backend/supabase/functions'),
              Path('player-terminal/src'),
              Path('player-terminal/tests'),
              Path('player-terminal/tools'),
              Path('scripts'),
          ]
          suffixes = {'.ts', '.tsx', '.js', '.mjs', '.cjs', '.json', '.yml', '.yaml', '.md'}
          quoted = re.compile(r"(['\"`])cash\1", re.I)
          route = re.compile(r"[/.:_-]cash[/.:_-]", re.I)
          violations = []
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in suffixes:
                      continue
                  text = path.read_text(encoding='utf-8')
                  if quoted.search(text) or route.search(text):
                      violations.append(str(path))
          if violations:
              raise SystemExit('Retired cash account route remains:\n' + '\n'.join(sorted(violations)))
          print('No retired cash account literals or route segments remain in active source.')
          PY

      - name: Write success evidence
        if: success()
        run: |
          cat > /tmp/checking-savings-audit.md <<'EOF'
          ## Checking and Savings convergence audit: PASS

          The feature branch now uses **Checking** and **Savings** as the only personal account types.

          Verified boundaries:
          - Admin balance adjustments write `checking`.
          - Player Banking and Store consume `checking` and keep `savings` separate.
          - Business, Store, transfer, loan, travel, stock, Marketplace, rewards, and seed database functions are superseded by the forward migration when they contain the retired account literal.
          - Existing `cash` balance projections are merged into `checking` without losing value.
          - Existing ledger and transfer classifications are converted to `checking`.
          - Database constraints reject future personal `cash` rows while retaining validated `business:biz_...` operating accounts.
          - Active Admin, Player, API, route, runner, and test source contains no quoted `cash` account key or `/cash/`-style route segment.

          No staging or production migration was applied by this audit.
          EOF
          gh pr comment 501 --repo kohnerbouchard-star/Student-Profile --body-file /tmp/checking-savings-audit.md

      - name: Write failure evidence
        if: failure()
        run: |
          cat > /tmp/checking-savings-audit.md <<'EOF'
          ## Checking and Savings convergence audit: FAIL

          The temporary audit did not pass. PR #501 remains draft and must not be merged or deployed. Review the failing workflow step before making further changes.
          EOF
          gh pr comment 501 --repo kohnerbouchard-star/Student-Profile --body-file /tmp/checking-savings-audit.md

      - name: Remove temporary audit workflow
        if: success()
        run: |
          rm -- .github/workflows/audit-checking-savings-convergence-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/audit-checking-savings-convergence-temporary.yml
          git commit -m "Remove temporary checking and savings audit workflow"
          git push origin HEAD:fix/checking-savings-wallet-convergence-v1
