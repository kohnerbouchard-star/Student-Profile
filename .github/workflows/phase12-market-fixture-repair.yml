name: Phase 12 Stock fixture repair

on:
  push:
    branches:
      - feat/player-business-workspace-v2
    paths:
      - ".github/workflows/phase12-market-fixture-repair.yml"

permissions:
  contents: write

concurrency:
  group: phase12-market-fixture-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: Align connected Stock fixture with sell currency contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v7
        with:
          ref: feat/player-business-workspace-v2
          fetch-depth: 0

      - name: Patch connected Stock fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/business-banking-player-market-browser-acceptance.core.mjs")
          source = path.read_text(encoding="utf-8")
          before = '''async function chooseTradableAsset(page) {
            await openMarket(page);
            const rows = page.locator("[data-player-market-select]");
            for (let index = 0; index < await rows.count(); index += 1) {
              const row = rows.nth(index);
              const assetId = String(await row.getAttribute("data-player-market-select") || "").trim().toLowerCase();
              if (assetId === "cel-index") continue;
              await row.click();
              const buyForm = page.locator('form[data-player-market-order-form="buy-quote"]:visible');
              const sellForm = page.locator('form[data-player-market-order-form="sell-review"]:visible');
              await buyForm.waitFor({ state: "visible", timeout: 30_000 });
              await sellForm.waitFor({ state: "visible", timeout: 30_000 });
              const symbol = String(await buyForm.locator('[name="ticker"]').inputValue()).trim().toUpperCase();
              const price = Number(await buyForm.locator('[name="expectedPrice"]').inputValue());
              if (symbol && Number.isFinite(price) && price > 0) return { symbol, price };
            }
            throw new Error("No non-index tradable market asset was rendered.");
          }'''
          after = '''async function chooseTradableAsset(page) {
            await openMarket(page);
            const rows = page.locator("[data-player-market-select]");
            for (let index = 0; index < await rows.count(); index += 1) {
              const row = rows.nth(index);
              const assetId = String(await row.getAttribute("data-player-market-select") || "").trim().toLowerCase();
              if (assetId === "cel-index") continue;
              await row.click();
              const buyForm = page.locator('form[data-player-market-order-form="buy-quote"]:visible');
              const sellForm = page.locator('form[data-player-market-order-form="sell-review"]:visible');
              await buyForm.waitFor({ state: "visible", timeout: 30_000 });
              await sellForm.waitFor({ state: "visible", timeout: 30_000 });
              const symbol = String(await buyForm.locator('[name="ticker"]').inputValue()).trim().toUpperCase();
              const price = Number(await buyForm.locator('[name="expectedPrice"]').inputValue());
              const destinationAccountKey = String(await sellForm.locator('[name="destinationAccountKey"] option').evaluateAll(
                (options) => options.map((option) => String(option.value || "").trim().toLowerCase()).find(Boolean) || "",
              ));
              if (symbol && Number.isFinite(price) && price > 0 && ACCOUNT_KEY.test(destinationAccountKey)) {
                return { symbol, price, destinationAccountKey };
              }
            }
            throw new Error("No non-index tradable market asset with an owned listing-currency Checking destination was rendered.");
          }'''
          if source.count(before) != 1:
              raise SystemExit("chooseTradableAsset source contract changed; refusing speculative patch")
          source = source.replace(before, after)

          before_call = "  const sell = await executeSell(page, asset.symbol);"
          after_call = "  const sell = await executeSell(page, asset.symbol, asset.destinationAccountKey);"
          if source.count(before_call) != 1:
              raise SystemExit("connected sell invocation source contract changed; refusing speculative patch")
          source = source.replace(before_call, after_call)
          path.write_text(source, encoding="utf-8")
          PY

          rm .github/workflows/phase12-market-fixture-repair.yml
          node --check scripts/business-banking-player-market-browser-acceptance.core.mjs
          grep -F 'with an owned listing-currency Checking destination' scripts/business-banking-player-market-browser-acceptance.core.mjs
          grep -F 'executeSell(page, asset.symbol, asset.destinationAccountKey)' scripts/business-banking-player-market-browser-acceptance.core.mjs
          git diff --check

      - name: Commit permanent fixture correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(player): select a sellable listing-currency asset"
          git push origin HEAD:feat/player-business-workspace-v2
