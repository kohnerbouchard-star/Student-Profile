name: Economic Asset Core Production Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/economic-asset-core-production-release.yml"
      - "backend/supabase/migrations/2026080612*.sql"
      - "backend/src/domains/inventory/**"
      - "backend/src/domains/business-banking/**"
      - "backend/src/domains/crafting/**"
      - "backend/src/domains/store/**"
      - "backend/src/domains/marketplace/**"
      - "backend/supabase/functions/classroom-api/**"
      - "scripts/build-economic-asset-migration-bundle.mjs"
      - "scripts/economic-asset-core-*.sql"
      - "scripts/economic-asset-core-*.mjs"

permissions:
  contents: read
  actions: read

concurrency:
  group: economic-asset-core-production-release
  cancel-in-progress: false

env:
  EXPECTED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  DENIED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  STAGING_SOURCE_SHA: ce6c17fa6d2e78f666494eddef7c2b60e2ee18b9
  STAGING_RUN_ID: "31133172937"
  MIGRATION_PREFIX: "2026080612"
  EXPECTED_FINAL_MIGRATION: "20260806120420"
  EXPECTED_MIGRATION_COUNT: "23"
  EXPECTED_PREDEPLOY_CLASSROOM_DIGEST: f38d445b6c18ed765e87b398a8e2740e8ab265cb5d9ccd76e342fc9f51d679d9
  EXPECTED_STAGED_CLASSROOM_DIGEST: bce16640bfaf185aee1b1f017db4290af21b0dbc6193d0614b6a7483f73ca80a
  SUPABASE_CLI_VERSION: 2.109.1
  RELEASE_COMMIT: ${{ github.sha }}

jobs:
  release:
    name: Rehearse, apply, and verify exact economic core
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      CONFIGURED_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PROJECT_REF: cgiukdjwicykrmtkhudh
      SUPABASE_URL: https://cgiukdjwicykrmtkhudh.supabase.co
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out exact merged source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce merged-main production boundary and staged-source ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$SUPABASE_PROJECT_REF" = "$EXPECTED_PRODUCTION_PROJECT_REF"
          test "$SUPABASE_PROJECT_REF" != "$DENIED_STAGING_PROJECT_REF"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$DATABASE_URL"
          git cat-file -e "${STAGING_SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$STAGING_SOURCE_SHA" "$RELEASE_COMMIT"
          node - <<'NODE'
          const parsed = new URL(process.env.DATABASE_URL);
          const ref = process.env.EXPECTED_PRODUCTION_PROJECT_REF;
          const username = decodeURIComponent(parsed.username || '');
          const direct = parsed.hostname === `db.${ref}.supabase.co`;
          const pooler = username === `postgres.${ref}` || username.endsWith(`.${ref}`);
          if (!['postgres:', 'postgresql:'].includes(parsed.protocol) || (!direct && !pooler)) {
            throw new Error('DATABASE_URL is not bound to the expected production project.');
          }
          NODE

      - name: Prove economic source has not drifted since green staging
        shell: bash
        run: |
          set -euo pipefail
          drift="$(
            git diff --name-only "$STAGING_SOURCE_SHA" "$RELEASE_COMMIT" -- \
              backend/supabase/migrations \
              backend/src/domains/inventory \
              backend/src/domains/business-banking \
              backend/src/domains/crafting \
              backend/src/domains/store \
              backend/src/domains/marketplace \
              backend/supabase/functions/classroom-api \
              scripts \
            | grep -E '^(backend/supabase/migrations/2026080612|backend/src/domains/(inventory|business-banking|crafting|store|marketplace)/|backend/supabase/functions/classroom-api/|scripts/(build-economic-asset-migration-bundle|economic-asset-core-))' \
            || true
          )"
          if [ -n "$drift" ]; then
            printf 'Economic release source drifted after staging:\n%s\n' "$drift" >&2
            exit 1
          fi

      - name: Verify exact staging acceptance run is green
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGING_RUN_ID}" > "$RUNNER_TEMP/staging-run.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const run = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/staging-run.json', 'utf8'));
          if (run.head_sha !== process.env.STAGING_SOURCE_SHA) throw new Error(`Unexpected staging head: ${run.head_sha}`);
          if (run.status !== 'completed' || run.conclusion !== 'success') throw new Error(`Staging run is not green: ${run.status}/${run.conclusion}`);
          if (run.name !== 'Economic Asset Core Staging Release') throw new Error(`Unexpected staging workflow: ${run.name}`);
          NODE

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Install and run focused release contracts
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          npm ci
          npm ci --prefix backend --ignore-scripts
          node --check scripts/build-economic-asset-migration-bundle.mjs
          node --test scripts/economic-asset-core-v2-contract.test.mjs
          node --test scripts/economic-asset-migration-bundle.test.mjs
          npm run test:player-inventory --prefix backend
          npm run test:player-store-public --prefix backend
          npm run test:player-crafting --prefix backend
          npm run test:player-marketplace --prefix backend

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Resolve protected production service credential
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"
          service="$CONFIGURED_SERVICE_ROLE_KEY"
          if [ -z "$service" ]; then
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/api-keys?reveal=true" \
              > "$RUNNER_TEMP/economic-asset-api-keys.json"
            KEYS_PATH="$RUNNER_TEMP/economic-asset-api-keys.json" node - <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync(process.env.KEYS_PATH, 'utf8'));
          const service = rows.find((row) => row.name === 'service_role' && row.api_key)?.api_key || '';
          fs.writeFileSync('/tmp/economic-asset-production-service-key', service, { mode: 0o600 });
          NODE
            service="$(cat /tmp/economic-asset-production-service-key)"
          fi
          test -n "$service"
          echo "::add-mask::$service"
          printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$service" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/economic-asset-api-keys.json" /tmp/economic-asset-production-service-key

      - name: Verify pre-deploy production runtime identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/functions-before.json"
          FUNCTIONS_PATH="$RUNNER_TEMP/functions-before.json" node - <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync(process.env.FUNCTIONS_PATH, 'utf8'));
          const rows = Array.isArray(parsed) ? parsed : (parsed.functions || []);
          const row = rows.find((entry) => entry.slug === 'classroom-api');
          if (!row || row.status !== 'ACTIVE' || row.verify_jwt !== true) throw new Error('Production classroom-api is not in the expected secure state.');
          if (row.ezbr_sha256 !== process.env.EXPECTED_PREDEPLOY_CLASSROOM_DIGEST) {
            throw new Error(`Production classroom-api drifted before release: ${row.ezbr_sha256 || 'missing'}`);
          }
          fs.writeFileSync(process.env.RUNNER_TEMP + '/classroom-version-before.txt', String(row.version));
          NODE

      - name: Verify pristine production economic prefix and capture protected baseline
        shell: bash
        run: |
          set -euo pipefail
          export PGSSLMODE=require
          read -r applied_count applied_through < <(
            psql "$DATABASE_URL" -X -qAt -F ' ' -v ON_ERROR_STOP=1 \
              -c "select count(*)::integer, coalesce(max(version), '') from supabase_migrations.schema_migrations where version like '${MIGRATION_PREFIX}%';"
          )
          test "$applied_count" = "0"
          test -z "$applied_through"
          printf 'ECONOMIC_ASSET_APPLIED_THROUGH=\n' >> "$GITHUB_ENV"
          psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 <<'SQL' > "$RUNNER_TEMP/economic-asset-before.json"
          select json_build_object(
            'players', (select count(*) from public.players),
            'games', (select count(*) from public.game_sessions),
            'businesses', (select count(*) from public.business_entities),
            'ledgerEntries', (select count(*) from public.ledger_entries),
            'accountBalances', (select count(*) from public.account_balances)
          );
          SQL

      - name: Confirm rollback acceptance fixture exists before production write
        shell: bash
        run: |
          set -euo pipefail
          export PGSSLMODE=require
          candidate_count="$(psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          select count(*)
          from public.players p
          join public.game_sessions g
            on g.id = p.game_session_id
           and g.status = 'active'
           and g.lifecycle_state = 'active'
          join public.player_country_assignments pca
            on pca.game_session_id = p.game_session_id
           and pca.player_id = p.id
           and pca.status = 'active'
          join public.country_profiles cp on cp.id = pca.country_profile_id
          join public.game_session_physical_economy_packs gp
            on gp.game_session_id = p.game_session_id
           and gp.status = 'active'
          join public.physical_economy_recipe_definitions r
            on r.pack_id = gp.pack_id
           and r.status = 'active'
          join public.game_session_recipe_availability a
            on a.game_session_id = p.game_session_id
           and a.recipe_id = r.id
           and a.enabled
           and a.scarcity_band <> 'unavailable'
           and a.unlocked_by_default
          join public.physical_economy_recipe_inputs i on i.recipe_id = r.id
          join public.store_items si
            on si.game_session_id = p.game_session_id
           and si.item_key = i.item_key
           and si.status = 'active'
           and si.visibility = 'visible'
           and si.stock_quantity >= ceil(i.base_quantity)::integer + 1
          where p.status = 'active'
            and (cardinality(a.country_codes) = 0 or cp.country_code = any(a.country_codes));
          SQL
          )"
          [[ "$candidate_count" =~ ^[0-9]+$ ]]
          test "$candidate_count" -gt 0

      - name: Execute full atomic rollback migration rehearsal against production data
        shell: bash
        run: |
          set -euo pipefail
          export PGSSLMODE=require
          node scripts/build-economic-asset-migration-bundle.mjs \
            --migrations-dir backend/supabase/migrations \
            --prefix "$MIGRATION_PREFIX" \
            --mode rollback \
            --after-version "" \
            --output /tmp/economic-asset-production-rollback.sql \
            | tee /tmp/economic-asset-production-rollback-build.json
          psql "$DATABASE_URL" \
            -X --set=ON_ERROR_STOP=1 --no-psqlrc \
            --file /tmp/economic-asset-production-rollback.sql \
            2>&1 | tee /tmp/economic-asset-production-rollback.log
          test "$(psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select count(*) from supabase_migrations.schema_migrations where version like '${MIGRATION_PREFIX}%'")" = "0"
          test "$(psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select (to_regclass('public.game_items') is null)::integer")" = "1"

      - name: Apply exact-source economic migration bundle atomically
        shell: bash
        run: |
          set -euo pipefail
          export PGSSLMODE=require
          node scripts/build-economic-asset-migration-bundle.mjs \
            --migrations-dir backend/supabase/migrations \
            --prefix "$MIGRATION_PREFIX" \
            --mode commit \
            --after-version "" \
            --output /tmp/economic-asset-production-commit.sql \
            | tee /tmp/economic-asset-production-commit-build.json
          psql "$DATABASE_URL" \
            -X --set=ON_ERROR_STOP=1 --no-psqlrc \
            --file /tmp/economic-asset-production-commit.sql \
            2>&1 | tee /tmp/economic-asset-production-commit.log

      - name: Verify exact migration ledger and all production games
        shell: bash
        run: |
          set -euo pipefail
          export PGSSLMODE=require
          node scripts/build-economic-asset-migration-bundle.mjs \
            --migrations-dir backend/supabase/migrations \
            --prefix "$MIGRATION_PREFIX" \
            --mode verify-full \
            --output /tmp/economic-asset-production-full-verify.sql
          psql "$DATABASE_URL" \
            -X --set=ON_ERROR_STOP=1 --no-psqlrc \
            --file /tmp/economic-asset-production-full-verify.sql \
            2>&1 | tee /tmp/economic-asset-production-full-verify.log
          test "$(psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select count(*) from supabase_migrations.schema_migrations where version like '${MIGRATION_PREFIX}%'")" = "$EXPECTED_MIGRATION_COUNT"
          test "$(psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select max(version) from supabase_migrations.schema_migrations where version like '${MIGRATION_PREFIX}%'")" = "$EXPECTED_FINAL_MIGRATION"
          psql "$DATABASE_URL" -X --set=ON_ERROR_STOP=1 --no-psqlrc <<'SQL' | tee /tmp/economic-asset-production-validator.log
          do $validation$
          declare
            game_row record;
            result jsonb;
          begin
            for game_row in select id from public.game_sessions order by id
            loop
              result := public.validate_economic_asset_core_v2(game_row.id);
              if coalesce((result ->> 'valid')::boolean, false) is not true then
                raise exception 'ECONOMIC_ASSET_CORE_VALIDATION_FAILED:%', result;
              end if;
            end loop;
          end
          $validation$;
          SQL

      - name: Deploy exact merged classroom API to production
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy classroom-api \
            --workdir backend \
            --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF"

      - name: Verify deployed runtime matches staged runtime
        shell: bash
        run: |
          set -euo pipefail
          before_version="$(cat "$RUNNER_TEMP/classroom-version-before.txt")"
          ready=false
          for attempt in $(seq 1 20); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$EXPECTED_PRODUCTION_PROJECT_REF/functions" \
              > "$RUNNER_TEMP/functions-after.json"
            if FUNCTIONS_PATH="$RUNNER_TEMP/functions-after.json" BEFORE_VERSION="$before_version" node - <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync(process.env.FUNCTIONS_PATH, 'utf8'));
          const rows = Array.isArray(parsed) ? parsed : (parsed.functions || []);
          const row = rows.find((entry) => entry.slug === 'classroom-api');
          if (!row || row.status !== 'ACTIVE' || row.verify_jwt !== true) process.exit(1);
          if (Number(row.version) <= Number(process.env.BEFORE_VERSION)) process.exit(1);
          if (row.ezbr_sha256 !== process.env.EXPECTED_STAGED_CLASSROOM_DIGEST) process.exit(1);
          fs.writeFileSync(process.env.RUNNER_TEMP + '/classroom-version-after.txt', String(row.version));
          fs.writeFileSync(process.env.RUNNER_TEMP + '/classroom-digest-after.txt', String(row.ezbr_sha256));
          NODE
            then
              ready=true
              break
            fi
            sleep 3
          done
          test "$ready" = true

      - name: Run rollback-scoped production end-to-end acceptance
        shell: bash
        run: |
          set -euo pipefail
          export PGSSLMODE=require
          psql "$DATABASE_URL" \
            -X --set=ON_ERROR_STOP=1 --no-psqlrc \
            --file scripts/economic-asset-core-staging-acceptance.sql \
            2>&1 | tee /tmp/economic-asset-production-acceptance.log
          grep -F 'ECONOMIC_ASSET_CORE_STAGING_ACCEPTANCE_PASS' /tmp/economic-asset-production-acceptance.log
          test "$(psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select count(*) from public.business_entities where legal_name='Rollback Economic Asset Probe'")" = "0"
          test "$(psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select count(*) from public.inventory_transactions where source_domain='validation' or idempotency_key like 'economic-asset-probe-%'")" = "0"
          test "$(psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select count(*) from public.ledger_entries where source_domain='validation' and source_action='economic_asset_probe_funding'")" = "0"

      - name: Verify hosted classroom API health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "$SUPABASE_URL/functions/v1/classroom-api/health" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            > /tmp/economic-asset-production-health.json
          node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/economic-asset-production-health.json', 'utf8'));
          if (body.ok !== true || body.service !== 'classroom-api' || body.status !== 'ready') {
            throw new Error(`classroom-api health failed: ${JSON.stringify(body)}`);
          }
          NODE

      - name: Verify protected production rows were preserved
        shell: bash
        run: |
          set -euo pipefail
          export PGSSLMODE=require
          psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 <<'SQL' > "$RUNNER_TEMP/economic-asset-after.json"
          select json_build_object(
            'players', (select count(*) from public.players),
            'games', (select count(*) from public.game_sessions),
            'businesses', (select count(*) from public.business_entities),
            'ledgerEntries', (select count(*) from public.ledger_entries),
            'accountBalances', (select count(*) from public.account_balances)
          );
          SQL
          BEFORE_PATH="$RUNNER_TEMP/economic-asset-before.json" AFTER_PATH="$RUNNER_TEMP/economic-asset-after.json" node - <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync(process.env.BEFORE_PATH, 'utf8'));
          const after = JSON.parse(fs.readFileSync(process.env.AFTER_PATH, 'utf8'));
          for (const key of ['players', 'games', 'businesses', 'ledgerEntries', 'accountBalances']) {
            if (after[key] !== before[key]) throw new Error(`Protected production row count changed unexpectedly: ${key} ${before[key]} -> ${after[key]}`);
          }
          NODE

      - name: Upload sanitized production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economic-asset-core-production-${{ github.sha }}
          path: |
            /tmp/economic-asset-production-rollback-build.json
            /tmp/economic-asset-production-rollback.log
            /tmp/economic-asset-production-commit-build.json
            /tmp/economic-asset-production-commit.log
            /tmp/economic-asset-production-full-verify.log
            /tmp/economic-asset-production-validator.log
            /tmp/economic-asset-production-acceptance.log
            /tmp/economic-asset-production-health.json
          if-no-files-found: warn
          retention-days: 90

      - name: Record production result
        if: success()
        shell: bash
        run: |
          {
            echo '## Economic Asset Core V2 production release'
            echo "- Merged main source: \`$RELEASE_COMMIT\`"
            echo "- Staging-proven economic source: \`$STAGING_SOURCE_SHA\`"
            echo "- Staging acceptance run: \`$STAGING_RUN_ID\`"
            echo "- Production project: \`$EXPECTED_PRODUCTION_PROJECT_REF\`"
            echo '- Staging project denied: `true`'
            echo '- Full 23-migration rollback rehearsal: `pass`'
            echo '- Exact-source 23-migration commit: `pass`'
            echo '- Exact migration ledger verification: `pass`'
            echo '- All production games valid: `true`'
            echo '- Matching classroom-api deployed: `true`'
            echo "- classroom-api digest: \`$(cat "$RUNNER_TEMP/classroom-digest-after.txt")\`"
            echo '- Store → Inventory → Crafting → Business/COGS rollback acceptance: `pass`'
            echo '- Probe residue: `zero`'
            echo '- Hosted API health: `ready`'
            echo '- Protected production rows preserved: `true`'
          } >> "$GITHUB_STEP_SUMMARY"
