name: REF032 One-time Read-only Rehearsal
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Approved current-main SHA
        required: true
      replay_run:
        description: Successful Database Replay run for that SHA
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: ref032-one-time-capture
  cancel-in-progress: false
jobs:
  rehearse:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - environment: staging
            project: eecvbssdvarfcykcfrny
          - environment: production
            project: cgiukdjwicykrmtkhudh
    environment: ${{ matrix.environment }}
    env:
      PHASE15_ENVIRONMENT: ${{ matrix.environment }}
      PHASE15_EXPECTED_PROJECT_REF: ${{ matrix.project }}
      IMAGE: ghcr.io/supabase/postgres@sha256:e884cde9f5594ddb30ebec888bd236d128eaf9c9b48cc864d8fa3d27a6c6c6bc
    steps:
      - name: Prepare private paths without credentials
        run: |
          echo "PHASE15_WORK_DIR=$RUNNER_TEMP/u1/work" >> "$GITHUB_ENV"
          echo "PHASE15_EVIDENCE_DIR=$RUNNER_TEMP/u1/private-evidence" >> "$GITHUB_ENV"
          echo "PHASE15_CAPTURE_DIR=$RUNNER_TEMP/u1/raw" >> "$GITHUB_ENV"
          echo "PHASE15_CANONICAL_SCHEMA=$RUNNER_TEMP/u1/canonical/schema-1.json" >> "$GITHUB_ENV"
          echo "PHASE15_CANONICAL_CATALOG=$RUNNER_TEMP/u1/canonical/catalog-1.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.109.1
      - name: Bind approved source and canonical evidence before accessing secrets
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.source_sha }}
          REPLAY_RUN: ${{ inputs.replay_run }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase15-readonly-rehearsal.yml/runs?event=workflow_dispatch&per_page=2" > "$RUNNER_TEMP/manual-runs.json"
          jq -e --argjson id "$GITHUB_RUN_ID" '.total_count == 1 and .workflow_runs[0].id == $id' "$RUNNER_TEMP/manual-runs.json"
          [[ "$REPLAY_RUN" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REPLAY_RUN" > "$RUNNER_TEMP/replay.json"
          jq -e --arg sha "$GITHUB_SHA" '.head_sha == $sha and .event == "push" and .head_branch == "main" and .conclusion == "success" and .path == ".github/workflows/database-replay.yml"' "$RUNNER_TEMP/replay.json"
          umask 077
          mkdir -p "$RUNNER_TEMP/u1/canonical"
          gh run download "$REPLAY_RUN" --name "phase15-clean-replay-$GITHUB_SHA" --dir "$RUNNER_TEMP/u1/canonical"
          docker pull "$IMAGE"
          node --test scripts/operations/live-migration-reconciliation/readonly-rehearsal.test.mjs
          node scripts/operations/live-migration-reconciliation/build-phase15-forward-bundle.mjs --environment "$PHASE15_ENVIRONMENT" --mode rollback --format manifest > "$RUNNER_TEMP/u1/manifest.json"
          node scripts/operations/live-migration-reconciliation/build-phase15-rehearsal-plan.mjs "$RUNNER_TEMP/u1/manifest.json" > "$RUNNER_TEMP/u1/plan.json"
      - name: Capture once with existing environment access
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE15_REMOTE_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          umask 077
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          test "$(sha256sum scripts/operations/live-migration-reconciliation/supabase-prod-ca-2021.crt | cut -d' ' -f1)" = 700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7
          openssl x509 -in scripts/operations/live-migration-reconciliation/supabase-prod-ca-2021.crt -noout -checkend 2592000
          node scripts/release-integrity/cli.mjs validate-db-url --url-env PHASE15_REMOTE_DATABASE_URL --expected-project-ref "$PHASE15_EXPECTED_PROJECT_REF"
          node --input-type=module - <<'NODE' > "$RUNNER_TEMP/u1/connection.env"
          import { writeFileSync } from 'node:fs';
          import { validateDatabaseUrlProjectRef } from './scripts/release-integrity/database-binding.mjs';
          if (/[\u0000-\u0020\u007f\\]/.test(process.env.PHASE15_REMOTE_DATABASE_URL)) throw new Error('Invalid connection authority');
          const url = new URL(process.env.PHASE15_REMOTE_DATABASE_URL);
          const host = url.hostname.toLowerCase();
          const dnsLabel = /^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/;
          if (host.length > 253 || !host.split('.').every(label => dnsLabel.test(label))) throw new Error('DNS hostname required');
          validateDatabaseUrlProjectRef({ databaseUrl: url.href, expectedProjectRef: process.env.PHASE15_EXPECTED_PROJECT_REF });
          if (url.port && url.port !== '5432') throw new Error('Direct/session port required');
          const fields = [host, url.port || '5432', decodeURIComponent(url.pathname.slice(1)) || 'postgres', decodeURIComponent(url.username), decodeURIComponent(url.password)];
          if (fields.some(value => /[\r\n\0]/.test(value))) throw new Error('Invalid connection field');
          const passwordFile = `${process.env.RUNNER_TEMP}/u1/connection.pgpass`;
          const escaped = fields.map(value => value.replace(/\\/g, '\\\\').replace(/:/g, '\\:'));
          writeFileSync(passwordFile, `${escaped.join(':')}\n`, { mode: 0o600 });
          ['PGHOST', 'PGPORT', 'PGDATABASE', 'PGUSER'].forEach((key, i) => console.log(`${key}=${fields[i]}`));
          console.log(`PGPASSFILE=${passwordFile}`);
          NODE
          export PHASE15_VERSIONS="$(jq -r '.bundle.migrations[].version, .suffix.migrations[].version' "$RUNNER_TEMP/u1/plan.json" | paste -sd, -)"
          docker run --pull=never --rm --entrypoint bash --env-file "$RUNNER_TEMP/u1/connection.env" \
            -e PHASE15_VERSIONS -e PGSSLMODE=verify-full \
            -e PGSSLROOTCERT=/repo/scripts/operations/live-migration-reconciliation/supabase-prod-ca-2021.crt \
            -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/u1:$RUNNER_TEMP/u1" "$IMAGE" \
            /repo/scripts/operations/live-migration-reconciliation/capture-rehearsal-snapshot.sh "$PHASE15_CAPTURE_DIR"
          rm -f "$RUNNER_TEMP/u1/connection.env" "$RUNNER_TEMP/u1/connection.pgpass"
          sudo chown -R "$(id -u):$(id -g)" "$PHASE15_CAPTURE_DIR"
      - name: Restore and rehearse locally without hosted credentials
        run: |
          set -euo pipefail
          umask 077
          bash scripts/operations/live-migration-reconciliation/rehearse-live-shaped-upgrade.sh > "$RUNNER_TEMP/u1/rehearsal.log" 2>&1
      - name: Retain only bounded qualification results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/u1/sanitized"
          if test -s "$PHASE15_EVIDENCE_DIR/summary.json"; then
            schema_digest="$(sha256sum "$PHASE15_CAPTURE_DIR/schema.sql" | cut -d' ' -f1)"
            ledger_digest="$(sha256sum "$PHASE15_CAPTURE_DIR/ledger.json" | cut -d' ' -f1)"
            jq --arg schema "$schema_digest" --arg ledger "$ledger_digest" '{sourceCommit, environment, status, exitCode, appliedMigrationCount, certifiedMigrationCount, canonicalApplicationSchemaMatched, sourceSchemaSha256:$schema, sourceLedgerSha256:$ledger, releaseCertificate: false}' "$PHASE15_EVIDENCE_DIR/summary.json" > "$RUNNER_TEMP/u1/sanitized/result.json"
          else
            jq -n --arg sha "$GITHUB_SHA" --arg env "$PHASE15_ENVIRONMENT" '{sourceCommit:$sha, environment:$env, status:"NOT_QUALIFIED", releaseCertificate:false}' > "$RUNNER_TEMP/u1/sanitized/result.json"
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ref032-diagnostic-only-${{ matrix.environment }}-${{ github.sha }}
          path: ${{ runner.temp }}/u1/sanitized/result.json
          retention-days: 7
          if-no-files-found: error
      - name: Remove restricted captures and diagnostics
        if: always()
        run: sudo rm -rf "$RUNNER_TEMP/u1"
