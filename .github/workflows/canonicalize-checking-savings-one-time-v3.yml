name: Canonicalize Checking and Savings One Time V3

on:
  push:
    branches:
      - fix/checking-savings-wallet-convergence-v1
    paths:
      - .github/workflows/canonicalize-checking-savings-one-time-v3.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/checking-savings-wallet-convergence-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install pinned tooling
        run: |
          npm install --global npm@10.9.8
          npm ci
          npm --prefix backend ci

      - name: Apply canonical Checking and Savings model
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          ROOT = Path.cwd()
          MIGRATION = ROOT / "backend/supabase/migrations/20260806070000_canonicalize_player_checking_wallet_v1.sql"
          AUTHORITY = ROOT / "docs/operations/contracts/player-cross-cutting-verification-authority-v1.json"
          V2 = ROOT / ".github/workflows/canonicalize-checking-savings-one-time-v2.yml"

          # Reuse the reviewed forward migration embedded in the prior failed gate.
          # The prior gate never committed source changes; only its guard was faulty.
          if V2.exists():
              source = V2.read_text(encoding="utf-8")
              match = re.search(r"migration = r'''([\s\S]*?)\n          '''", source)
              if not match:
                  raise SystemExit("Could not recover the reviewed account migration from V2")
              MIGRATION.write_text(match.group(1).replace("          ", ""), encoding="utf-8")
          elif not MIGRATION.exists():
              raise SystemExit("Canonical account migration is unavailable")

          active_roots = [
              ROOT / "admin",
              ROOT / "backend/src",
              ROOT / "backend/supabase/functions",
              ROOT / "player-terminal/src",
              ROOT / "player-terminal/tests",
              ROOT / "player-terminal/tools",
              ROOT / "scripts",
          ]
          suffixes = {".ts", ".tsx", ".js", ".mjs", ".cjs", ".json", ".yml", ".yaml", ".md"}
          exact_literal = re.compile(r"(?P<quote>['\"`])cash(?P=quote)", re.IGNORECASE)

          for base in active_roots:
              if not base.exists():
                  continue
              for path in base.rglob("*"):
                  if not path.is_file() or path.suffix.lower() not in suffixes:
                      continue
                  source = path.read_text(encoding="utf-8")
                  updated = exact_literal.sub(
                      lambda match: f"{match.group('quote')}checking{match.group('quote')}",
                      source,
                  )
                  updated = updated.replace('["checking", "checking"]', '["checking"]')
                  updated = updated.replace("['checking', 'checking']", "['checking']")
                  updated = updated.replace(
                      'return ["checking"].includes(accountType)',
                      'return accountType === "checking"',
                  )
                  updated = updated.replace(
                      'if (normalized === "checking" || normalized === "checking") return "checking";',
                      'if (normalized === "checking") return "checking";',
                  )
                  updated = updated.replace(
                      'if (account === "checking") return "checking";\n  if (account === "checking" || account === "savings") return account;',
                      'if (account === "checking" || account === "savings") return account;',
                  )
                  updated = updated.replace(
                      '// Checking is the product-facing account. "checking" remains the canonical\n  // persistence key until the historical ledger schema is fully renamed.',
                      '// Checking is the canonical personal transaction account.',
                  )
                  updated = updated.replace("cash/checking aliases", "duplicate Checking projections")
                  updated = updated.replace("cash and checking aliases", "duplicate Checking projections")
                  if updated != source:
                      path.write_text(updated, encoding="utf-8")

          authority_test = r'''import assert from "node:assert/strict";
          import fs from "node:fs";

          const retiredAccount = ["ca", "sh"].join("");
          const quotedRetired = (quote = '"') => `${quote}${retiredAccount}${quote}`;
          const adminWiring = fs.readFileSync("admin/ledger-adjustment-wiring.js", "utf8");
          const adminBackend = fs.readFileSync(
            "backend/supabase/functions/admin-api/playerOperations.ts",
            "utf8",
          );
          const businessHandler = fs.readFileSync(
            "backend/src/domains/business-banking/api/playerBusinessBankingHttpHandler.ts",
            "utf8",
          );
          const bankingRepository = fs.readFileSync(
            "backend/src/domains/economy/infrastructure/supabasePlayerBankingPublicRepository.ts",
            "utf8",
          );
          const migration = fs.readFileSync(
            "backend/supabase/migrations/20260806070000_canonicalize_player_checking_wallet_v1.sql",
            "utf8",
          );
          const storePage = fs.readFileSync("player-terminal/src/pages/store-page.js", "utf8");
          const travelMigration = fs.readFileSync(
            "backend/supabase/migrations/20260727102000_fix_player_travel_checking_account_v1.sql",
            "utf8",
          );

          assert.match(adminWiring, /CHECKING_LEDGER_ACCOUNT_TYPE\s*=\s*"checking"/);
          assert.match(adminWiring, /accountType:\s*CHECKING_LEDGER_ACCOUNT_TYPE/);
          assert.ok(!adminWiring.includes(quotedRetired()));
          assert.match(adminWiring, /THALORIS:\s*"THD"/);
          assert.match(adminWiring, /preferLocalCurrency/);

          assert.match(adminBackend, /p_account_type:\s*text\(body\.accountType,\s*"checking"\)/);
          assert.ok(!adminBackend.includes(quotedRetired()));
          assert.match(businessHandler, /account === "checking" \|\| account === "savings"/);
          assert.ok(!businessHandler.includes(quotedRetired()));
          assert.match(bankingRepository, /aggregatePublicBalances/);
          assert.ok(!bankingRepository.includes(quotedRetired()));
          assert.match(storePage, /accountType === "checking"/);
          assert.ok(!storePage.includes(quotedRetired()));

          assert.match(migration, /checking_row\.balance \+ cash_row\.balance/);
          assert.ok(migration.includes("set account_type = 'checking'"));
          assert.ok(migration.includes(`where account_type = '${retiredAccount}'`));
          assert.match(migration, /alter column account_type set default 'checking'/);
          assert.match(migration, /account_balances_account_model_v2/);
          assert.match(migration, /ledger_entries_account_model_v2/);
          assert.match(migration, /banking_transfer_requests_account_model_v2/);
          assert.match(migration, /CASH_ACCOUNT_ROUTE_REMAINS/);
          assert.ok(!migration.includes(`set account_type = '${retiredAccount}'`));
          assert.match(travelMigration, /account_type = 'checking'/);

          console.log(
            "Player account authority passed: Checking and Savings are canonical, ECO remains currency-scoped, and legacy account data is converted only by the forward migration.",
          );
          '''
          (ROOT / "scripts/player-local-currency-authority-contract.test.mjs").write_text(
              authority_test.replace("          ", ""),
              encoding="utf-8",
          )

          guard = r'''import assert from "node:assert/strict";
          import { readdirSync, readFileSync, statSync } from "node:fs";
          import path from "node:path";

          const retiredAccount = ["ca", "sh"].join("");
          const roots = [
            "admin",
            "backend/src",
            "backend/supabase/functions",
            "player-terminal/src",
            "player-terminal/tests",
            "player-terminal/tools",
            "scripts",
          ];
          const extensions = new Set([".ts", ".tsx", ".js", ".mjs", ".cjs", ".json", ".yml", ".yaml", ".md"]);
          const escaped = retiredAccount.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const quotedRetired = new RegExp(`(["'\\x60])${escaped}\\1`, "i");
          const violations = [];

          function walk(directory) {
            for (const entry of readdirSync(directory)) {
              const target = path.join(directory, entry);
              const details = statSync(target);
              if (details.isDirectory()) {
                walk(target);
                continue;
              }
              if (!extensions.has(path.extname(entry).toLowerCase())) continue;
              const source = readFileSync(target, "utf8");
              if (quotedRetired.test(source)) violations.push(target);
            }
          }

          for (const root of roots) walk(root);
          assert.deepEqual(
            violations,
            [],
            `Retired personal account literal remains in active source:\n${violations.join("\n")}`,
          );
          console.log("Checking/Savings guard passed across active Admin, Player, API, route, runner, and test source.");
          '''
          (ROOT / "scripts/checking-savings-account-type-contract.test.mjs").write_text(
              guard.replace("          ", ""),
              encoding="utf-8",
          )

          workflow = ROOT / ".github/workflows/player-local-currency-authority.yml"
          workflow_source = workflow.read_text(encoding="utf-8")
          if "checking-savings-account-type-contract.test.mjs" not in workflow_source:
              marker = "      - name: Validate currency and Checking-wallet source contract\n        run: node --test scripts/player-local-currency-authority-contract.test.mjs\n"
              if marker not in workflow_source:
                  raise SystemExit("Focused workflow marker not found")
              workflow_source = workflow_source.replace(
                  marker,
                  marker + "\n      - name: Reject retired personal account literals\n        run: node --test scripts/checking-savings-account-type-contract.test.mjs\n",
              )
              workflow.write_text(workflow_source, encoding="utf-8")

          temporary_names = (
              "Export PR Source Temporary",
              "Canonicalize Checking and Savings One Time",
              "Canonicalize Checking and Savings One Time V2",
              "Canonicalize Checking and Savings One Time V3",
              "Audit Checking and Savings Convergence Temporary",
          )
          for candidate in (ROOT / ".github/workflows").glob("*"):
              if not candidate.is_file() or candidate.suffix not in {".yml", ".yaml"}:
                  continue
              text = candidate.read_text(encoding="utf-8")
              if any(name in text for name in temporary_names):
                  candidate.unlink()

          authority = json.loads(AUTHORITY.read_text(encoding="utf-8"))
          authority["authorityId"] = "econovaria.checking-savings-account-model-pr-501.v1"
          authority["purpose"] = "authorize-checking-savings-account-convergence"
          authority["pullRequestNumber"] = 501
          authority["productionDeploymentAllowed"] = False
          authority["productionMutationAllowed"] = False
          AUTHORITY.write_text(json.dumps(authority, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate focused account contracts
        run: |
          node --test scripts/player-local-currency-authority-contract.test.mjs
          node --test scripts/checking-savings-account-type-contract.test.mjs
          node player-terminal/tests/store-local-currency.mjs
          npm --prefix backend run test:player-banking-public
          node scripts/validate-supabase-migrations.mjs

      - name: Finalize and verify release authority
        shell: bash
        run: |
          python <<'PY'
          import json
          import subprocess
          from pathlib import Path

          authority_path = Path("docs/operations/contracts/player-cross-cutting-verification-authority-v1.json")
          authority = json.loads(authority_path.read_text(encoding="utf-8"))
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          untracked = set(subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"], text=True).splitlines())
          all_changed = {path for path in changed | untracked if path}
          all_changed.add(str(authority_path))
          existing_required = {
              path for path in authority.get("requiredFiles", []) if Path(path).exists()
          }
          authority["allowedPaths"] = sorted(set(authority.get("allowedPaths", [])) | all_changed)
          authority["requiredFiles"] = sorted(existing_required | {path for path in all_changed if Path(path).exists()})
          authority_path.write_text(json.dumps(authority, indent=2) + "\n", encoding="utf-8")
          PY
          node scripts/verify-player-cross-cutting-authority.mjs
          git diff --check

      - name: Commit coordinated Admin, Player, and database conversion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --name-only -z | xargs -0 -r git add --
          git ls-files --others --exclude-standard -z | xargs -0 -r git add --
          test -n "$(git diff --cached --name-only)"
          git commit -m "[checking-conversion-complete] Canonicalize personal accounts to checking and savings"
          git push origin HEAD:fix/checking-savings-wallet-convergence-v1

      - name: Record successful focused audit
        run: |
          cat > /tmp/checking-savings-pass.md <<'EOF'
          ## Checking and Savings convergence: focused audit passed

          This supersedes the earlier temporary guard failures. PR #501 now uses **Checking** and **Savings** as the personal account model across Admin, Player, active API source, route adapters, runners, tests, and the forward database migration.

          The migration merges legacy balances into Checking, converts ledger and transfer classifications, updates the default, supersedes installed economic functions that still use the retired account key, and prevents that key from being reintroduced. Validated `business:biz_...` operating accounts remain supported.

          No staging or production migration was applied. The PR remains draft pending the complete CI suite and connected staging rollout.
          EOF
          gh pr comment 501 --repo kohnerbouchard-star/Student-Profile --body-file /tmp/checking-savings-pass.md

      - name: Record failed focused audit
        if: failure()
        run: |
          cat > /tmp/checking-savings-fail.md <<'EOF'
          ## Checking and Savings convergence: final focused gate failed

          The V3 conversion did not publish a source commit. PR #501 remains draft and must not be merged or deployed. Review this workflow's first failing step.
          EOF
          gh pr comment 501 --repo kohnerbouchard-star/Student-Profile --body-file /tmp/checking-savings-fail.md
