name: Temporary Admin Auth Email Staging Apply

on:
  push:
    branches:
      - feat/branded-supabase-auth-emails-v1
    paths:
      - ".github/workflows/admin-auth-email-staging-apply-temp.yml"

permissions:
  contents: read

concurrency:
  group: admin-auth-email-staging-apply-temp
  cancel-in-progress: false

env:
  EXPECTED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  DENIED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh

jobs:
  apply:
    name: Apply and verify branded Auth email templates in staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Enforce staging-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/branded-supabase-auth-emails-v1"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$EXPECTED_STAGING_PROJECT_REF" != "$DENIED_PRODUCTION_PROJECT_REF"

      - name: Check out exact feature source
        uses: actions/checkout@v6
        with:
          ref: feat/branded-supabase-auth-emails-v1
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"

      - name: Build and validate staging payload
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/auth-email-template-contract.test.mjs
          node scripts/build-supabase-auth-email-config.mjs --check
          node scripts/build-supabase-auth-email-config.mjs \
            --environment staging \
            --output "$RUNNER_TEMP/staging-payload.json" \
            --evidence-output "$RUNNER_TEMP/staging-build.json"
          test "$(jq -r '.projectRef' "$RUNNER_TEMP/staging-build.json")" = "$EXPECTED_STAGING_PROJECT_REF"

      - name: Capture current managed configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_PROJECT_REF/config/auth" \
            > "$RUNNER_TEMP/staging-before-raw.json"
          node scripts/snapshot-supabase-auth-email-config.mjs \
            --environment staging \
            --actual "$RUNNER_TEMP/staging-before-raw.json" \
            --output "$RUNNER_TEMP/staging-before.json"

      - name: Apply canonical staging email fields
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/staging-payload.json" \
            "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_PROJECT_REF/config/auth" \
            > "$RUNNER_TEMP/staging-patch-response.json"

      - name: Verify hosted staging configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_PROJECT_REF/config/auth" \
            > "$RUNNER_TEMP/staging-after.json"
          node scripts/verify-supabase-auth-email-config.mjs \
            --environment staging \
            --actual "$RUNNER_TEMP/staging-after.json" \
            --evidence-output "$RUNNER_TEMP/staging-verified.json"
          jq '{
            verified,
            environment,
            projectRef,
            sourceDigest,
            renderedDigest,
            customSmtpConfigured,
            templateCount: (.templates | length),
            trackingLinksAllowed,
            externalImagesAllowed
          }' "$RUNNER_TEMP/staging-verified.json"
          rm -f \
            "$RUNNER_TEMP/staging-before-raw.json" \
            "$RUNNER_TEMP/staging-after.json" \
            "$RUNNER_TEMP/staging-patch-response.json" \
            "$RUNNER_TEMP/staging-payload.json" \
            "$RUNNER_TEMP/staging-build.json"

      - name: Upload sanitized verification and rollback evidence
        uses: actions/upload-artifact@v6
        with:
          name: admin-auth-email-staging-live-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/staging-verified.json
            ${{ runner.temp }}/staging-before.json
