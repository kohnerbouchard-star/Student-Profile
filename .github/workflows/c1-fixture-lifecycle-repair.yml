name: C1 fixture lifecycle repair

on:
  push:
    branches:
      - feat/multicurrency-store-funding-v1
    paths:
      - .github/workflows/c1-fixture-lifecycle-repair.yml

permissions:
  contents: write

concurrency:
  group: c1-fixture-lifecycle-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Activate only the disposable C1 fixture games
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/multicurrency-store-funding-database.mjs")
          text = path.read_text()

          function_marker = "function seedForeignChecking(game, playerId, currencyCode, amount, suffix) {"
          helper = '''function activateFixtureGames() {
            runSql(`
              update public.game_sessions
              set
                lifecycle_state = 'active',
                status = 'active'
              where id in (
                ${sqlLiteral(gameOne.id)}::uuid,
                ${sqlLiteral(gameTwo.id)}::uuid
              )
                and lifecycle_state = 'draft'
                and status = 'disabled';
            `);

            const state = runJson(`
              select jsonb_build_object(
                'activeCount', count(*) filter (
                  where lifecycle_state = 'active' and status = 'active'
                ),
                'totalCount', count(*)
              )::text
              from public.game_sessions
              where id in (
                ${sqlLiteral(gameOne.id)}::uuid,
                ${sqlLiteral(gameTwo.id)}::uuid
              );
            `);
            assert.equal(Number(state.activeCount), 2);
            assert.equal(Number(state.totalCount), 2);
          }

          '''
          if "function activateFixtureGames()" not in text:
              if function_marker not in text:
                  raise SystemExit("fixture helper insertion marker missing")
              text = text.replace(function_marker, helper + function_marker, 1)

          call_marker = "initializeFx(gameTwo);\nrestoreFixtureCountrySnapshots();"
          replacement = "initializeFx(gameTwo);\nactivateFixtureGames();\nrestoreFixtureCountrySnapshots();"
          if "initializeFx(gameTwo);\nactivateFixtureGames();" not in text:
              if call_marker not in text:
                  raise SystemExit("fixture activation call marker missing")
              text = text.replace(call_marker, replacement, 1)

          path.write_text(text)
          PY

      - name: Verify bounded fixture-only repair
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/multicurrency-store-funding-database.mjs
          node scripts/multicurrency-store-funding-contract.mjs
          node scripts/validate-supabase-migrations.mjs
          git diff --check
          test "$(git diff --name-only)" = "scripts/multicurrency-store-funding-database.mjs"
          grep -F "function activateFixtureGames()" scripts/multicurrency-store-funding-database.mjs
          grep -F "activateFixtureGames();" scripts/multicurrency-store-funding-database.mjs

      - name: Commit repaired C1 acceptance fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/multicurrency-store-funding-database.mjs
          git commit -m "fix(store-funding): activate disposable C1 games"
          git push origin HEAD:refs/heads/feat/multicurrency-store-funding-v1
