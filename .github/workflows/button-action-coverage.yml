name: Button Action Coverage

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/button-action-coverage.yml"
      - "docs/operations/contracts/button-action-coverage-v1.json"
      - "scripts/button-action-coverage-contract.mjs"
      - "scripts/runtime-interaction-wiring-audit.mjs"
      - "player-terminal/src/**"
      - "admin/**"
  workflow_dispatch:
    inputs:
      release_gate:
        description: "Require connected browser evidence for every enabled action"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  button-action-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Trace button and endpoint wiring
        run: node scripts/runtime-interaction-wiring-audit.mjs

      - name: Validate button evidence ledger
        run: node scripts/button-action-coverage-contract.mjs

      - name: Enforce connected release evidence
        if: github.event_name == 'workflow_dispatch' && inputs.release_gate
        run: node scripts/button-action-coverage-contract.mjs --release
