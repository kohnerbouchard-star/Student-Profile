name: Business Phase 8A Architecture Finalizer

# One-time deterministic inventory refresh for the bounded Phase 8A branch.
on:
  push:
    branches:
      - feat/business-store-listing-inventory-v2
    paths:
      - ".github/workflows/business-phase8a-architecture-finalizer.yml"

permissions:
  contents: write

concurrency:
  group: business-phase8a-architecture-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.head_commit.message == 'ops(business): trigger Phase 8A architecture finalizer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact Phase 8A branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/business-store-listing-inventory-v2
          fetch-depth: 0

      - name: Verify bounded finalizer delta
        shell: bash
        run: |
          set -euo pipefail
          IMPLEMENTATION_HEAD="145526ece5a0f74eefaf01f31aa0e3e145bd65d3"
          git merge-base --is-ancestor "$IMPLEMENTATION_HEAD" HEAD
          test -z "$(git diff --name-only "$IMPLEMENTATION_HEAD" HEAD -- . \
            ':(exclude).github/workflows/business-phase8a-architecture-finalizer.yml')"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate deterministic architecture inventory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/architecture/build-architecture-inventory.mjs
          git diff --check
          git diff -- docs/architecture/inventories/econovaria-architecture-inventory-v2.json

      - name: Commit generated inventory and remove one-time finalizer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "econovaria-automation"
          git config user.email "econovaria-automation@users.noreply.github.com"
          git rm .github/workflows/business-phase8a-architecture-finalizer.yml
          git add docs/architecture/inventories/econovaria-architecture-inventory-v2.json
          git diff --cached --quiet && { echo "No architecture inventory changes were produced." >&2; exit 1; }
          git commit -m "docs(architecture): refresh Phase 8A inventory"
          git push origin HEAD:feat/business-store-listing-inventory-v2
