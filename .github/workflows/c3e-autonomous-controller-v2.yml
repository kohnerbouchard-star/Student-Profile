name: C3E Autonomous Certification Controller

on:
  push:
    branches:
      - feat/multicurrency-stock-funding-v1
    paths:
      - .github/workflows/c3e-autonomous-controller-v2.yml
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  models: read
  pull-requests: write

concurrency:
  group: c3e-autonomous-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    name: Repair and certify C3E without merge or deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      REPOSITORY: kohnerbouchard-star/Student-Profile
      BRANCH: feat/multicurrency-stock-funding-v1
      BASE_BRANCH: feat/multicurrency-marketplace-funding-v1
      PR_NUMBER: '676'
      GH_TOKEN: ${{ github.token }}
      OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
      PUSH_TOKEN: ${{ secrets.C3E_AUTOMATION_TOKEN || secrets.CODEX_GITHUB_TOKEN || secrets.GH_PAT || secrets.PAT || secrets.PERSONAL_ACCESS_TOKEN || github.token }}
    steps:
      - name: Check out exact controller head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.3

      - name: Install controller tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests
          npm install --global npm@10.9.8
          npm ci --ignore-scripts
          npm --prefix backend ci --ignore-scripts
          if [[ -f player-terminal/package-lock.json ]]; then
            npm --prefix player-terminal ci --ignore-scripts
          fi

      - name: Run bounded C3E controller
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/c3e_controller.py <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import subprocess
          import sys
          import time
          import traceback
          import zipfile
          from datetime import datetime, timezone
          from io import BytesIO
          from pathlib import Path
          from typing import Any, Iterable

          import requests

          REPO = os.environ['REPOSITORY']
          BRANCH = os.environ['BRANCH']
          BASE = os.environ['BASE_BRANCH']
          PR = int(os.environ['PR_NUMBER'])
          GH_TOKEN = os.environ['GH_TOKEN']
          OPENAI_KEY = os.environ.get('OPENAI_KEY', '').strip()
          PUSH_TOKEN = os.environ['PUSH_TOKEN']
          API = f'https://api.github.com/repos/{REPO}'
          ROOT = Path.cwd()
          CONTROLLER_PATH = Path('.github/workflows/c3e-autonomous-controller-v2.yml')
          EXPORT_PATH = Path('.github/workflows/c3e-source-export.yml')
          C3D_SHA = '9b502b9ffa5e8aaf2f7c8d93d9cd3ccda3a10f15'
          REQUIRED_WORKFLOWS = [
              'Required Game Market Timezone',
              'Staging Readiness Preflight',
              'Business Banking Runtime',
              'Runtime Interaction Wiring',
              'Exchange Calendar Runtime',
              'Supply Chain Security',
              'Environment Neutral Browser',
              'Business Economy V2',
              'Business Workforce Hiring V2',
              'Admin API Check',
              'Business Workforce Payroll V2',
              'World Runtime',
              'Repository Quality',
              'Backend Typecheck',
              'Database Replay',
              'Progression Runtime',
              'Business Timed Manufacturing V2',
              'multicurrency-store-funding-v1',
              'multicurrency-marketplace-funding-v1',
              'multicurrency-stock-funding-v1',
              'Player Terminal Verify',
              'Business Store Withdrawal Safety V2',
              'banking-fx-clearing-v1',
              'Business Store Listing Inventory V2',
              'Business Store Seller Offers V2',
              'Business Store Atomic Settlement V2',
              'Business Player Store Cutover V2',
          ]
          AUTH_HEADERS = {
              'Authorization': f'Bearer {GH_TOKEN}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          SAFE_PREFIXES = (
              'backend/src/domains/stocks/',
              'player-terminal/',
              'api/',
              'scripts/',
              'docs/roadmaps/',
              'docs/operations/contracts/player-cross-cutting/',
              'docs/architecture/inventories/',
          )
          FORBIDDEN_PATH_PARTS = (
              '.env', 'secret', 'scheduler', 'domain',
              'backend/supabase/migrations/',
              'vercel.json', 'wrangler.toml',
          )

          def log(message: str) -> None:
              print(f'[{datetime.now(timezone.utc).isoformat()}] {message}', flush=True)

          def run(command: str | list[str], *, check: bool = True, timeout: int = 1800,
                  env: dict[str, str] | None = None) -> subprocess.CompletedProcess[str]:
              shown = command if isinstance(command, str) else ' '.join(command)
              log(f'RUN {shown}')
              completed = subprocess.run(
                  command,
                  shell=isinstance(command, str),
                  cwd=ROOT,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=timeout,
                  env={**os.environ, **(env or {})},
              )
              print(completed.stdout[-30000:], flush=True)
              if check and completed.returncode != 0:
                  raise RuntimeError(f'command failed ({completed.returncode}): {shown}\n{completed.stdout[-30000:]}')
              return completed

          def api(method: str, path: str, *, json_body: Any | None = None,
                  allow: Iterable[int] = (200, 201, 202, 204)) -> requests.Response:
              response = requests.request(
                  method,
                  f'{API}{path}',
                  headers=AUTH_HEADERS,
                  json=json_body,
                  timeout=90,
                  allow_redirects=True,
              )
              if response.status_code not in set(allow):
                  raise RuntimeError(f'GitHub API {method} {path}: {response.status_code} {response.text[:2000]}')
              return response

          def configure_git() -> None:
              run(['git', 'config', 'user.name', 'Econovaria C3E Controller'])
              run(['git', 'config', 'user.email', 'c3e-controller@users.noreply.github.com'])
              remote = f'https://x-access-token:{PUSH_TOKEN}@github.com/{REPO}.git'
              run(['git', 'remote', 'set-url', 'origin', remote])
              run(['git', 'fetch', '--no-tags', 'origin', BASE, BRANCH])

          def remove_temporary_workflows() -> None:
              for path in (CONTROLLER_PATH, EXPORT_PATH):
                  if path.exists():
                      path.unlink()
                      log(f'removed temporary workflow {path}')

          def git_status() -> str:
              return run(['git', 'status', '--porcelain'], check=False).stdout

          def changed_paths() -> list[str]:
              result = run(['git', 'diff', '--name-only', f'origin/{BASE}'], check=False).stdout
              paths = sorted({line.strip() for line in result.splitlines() if line.strip()})
              return paths

          def validate_model_path(path: str, *, documentation_only: bool = False) -> None:
              normalized = Path(path).as_posix().lstrip('/')
              if normalized != path or '..' in Path(normalized).parts:
                  raise RuntimeError(f'unsafe model path: {path}')
              lower = normalized.lower()
              if normalized.startswith('.github/'):
                  raise RuntimeError(f'model may not modify workflows: {path}')
              if any(part in lower for part in FORBIDDEN_PATH_PARTS):
                  raise RuntimeError(f'model attempted forbidden path: {path}')
              if documentation_only:
                  if not normalized.startswith(('docs/roadmaps/', 'docs/operations/contracts/player-cross-cutting/', 'docs/architecture/inventories/')):
                      raise RuntimeError(f'documentation stage attempted source path: {path}')
              elif not normalized.startswith(SAFE_PREFIXES):
                  raise RuntimeError(f'model path outside bounded C3E scope: {path}')

          def read_text(path: str, limit: int = 60000) -> str:
              p = ROOT / path
              if not p.is_file():
                  return ''
              text = p.read_text(encoding='utf-8', errors='replace')
              return text if len(text) <= limit else text[:limit] + '\n...[truncated]'

          def grep_paths(pattern: str, roots: list[str], maximum: int = 45) -> list[str]:
              command = ['git', 'grep', '-Il', '-E', pattern, '--', *roots]
              output = run(command, check=False).stdout
              return [line.strip() for line in output.splitlines() if line.strip()][:maximum]

          def gather_implementation_context(extra: str = '') -> str:
              paths = [
                  'docs/roadmaps/multicurrency-stock-funding-c3d-handoff-v1.md',
                  'docs/roadmaps/multicurrency-stock-funding-c3e-execution-note-v1.md',
                  'docs/roadmaps/multicurrency-stock-funding-implementation-plan-v1.md',
                  'docs/roadmaps/business-v2-current-checkpoint-v1.json',
                  'docs/roadmaps/business-v2-roadmap-reconciliation-20260829.md',
                  'docs/operations/contracts/player-cross-cutting/pr-676.json',
                  'player-terminal/src/api/payload-normalizer.js',
                  'player-terminal/src/api/resource-plan.js',
                  'player-terminal/src/pages/market-page.js',
                  'player-terminal/tests/browser/player-terminal-core.mjs',
                  'player-terminal/tests/portfolio-market-holdings.mjs',
                  'player-terminal/tests/stock-multicurrency-funding.mjs',
                  'package.json',
              ]
              paths += grep_paths(
                  r'market-order|orderType|side|buy_now|settle_sell|listingCurrency|listing_currency|portfolio|holdings',
                  ['api', 'player-terminal', 'backend/src/domains/stocks', 'scripts'],
              )
              seen: set[str] = set()
              chunks: list[str] = []
              total = 0
              for path in paths:
                  if path in seen:
                      continue
                  seen.add(path)
                  text = read_text(path)
                  if not text:
                      continue
                  block = f'\n===== FILE {path} =====\n{text}\n'
                  if total + len(block) > 420000:
                      break
                  chunks.append(block)
                  total += len(block)
              grep = run(
                  "git grep -n -E 'market-order|orderType|buy_now|settle_sell|listingCurrency|listing_currency|portfolio' -- api player-terminal backend/src/domains/stocks scripts | head -n 1200",
                  check=False,
              ).stdout
              return ''.join(chunks) + '\n===== GREP INDEX =====\n' + grep + '\n===== EXTRA EVIDENCE =====\n' + extra[-80000:]

          def select_model() -> tuple[str, str, str]:
              candidates: list[tuple[str, str, str]] = []
              if OPENAI_KEY:
                  for model in ('gpt-5', 'gpt-4.1'):
                      candidates.append(('https://api.openai.com/v1/chat/completions', OPENAI_KEY, model))
              github_candidates = ['openai/gpt-5', 'openai/gpt-4.1', 'openai/gpt-4o']
              try:
                  catalog = requests.get('https://models.github.ai/catalog/models', headers={'Authorization': f'Bearer {GH_TOKEN}'}, timeout=60)
                  if catalog.ok:
                      data = catalog.json()
                      ids = [item.get('id') or item.get('name') for item in data if isinstance(item, dict)]
                      preferred = [x for x in ids if x and ('gpt-5' in x or 'gpt-4.1' in x)]
                      github_candidates = preferred + [x for x in github_candidates if x not in preferred]
              except Exception:
                  pass
              for model in github_candidates:
                  candidates.append(('https://models.github.ai/inference/chat/completions', GH_TOKEN, model))
              for endpoint, token, model in candidates:
                  try:
                      response = requests.post(
                          endpoint,
                          headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'},
                          json={'model': model, 'messages': [{'role': 'user', 'content': 'Reply with exactly OK.'}], 'max_tokens': 8},
                          timeout=90,
                      )
                      if response.ok:
                          log(f'using model {model} via {endpoint}')
                          return endpoint, token, model
                      log(f'model probe failed {model}: {response.status_code} {response.text[:400]}')
                  except Exception as exc:
                      log(f'model probe exception {model}: {exc}')
              raise RuntimeError('No approved coding model endpoint was available to the disposable controller')

          MODEL_ENDPOINT, MODEL_TOKEN, MODEL_ID = select_model()

          def model_json(system: str, user: str, *, max_tokens: int = 50000) -> dict[str, Any]:
              payload: dict[str, Any] = {
                  'model': MODEL_ID,
                  'messages': [
                      {'role': 'system', 'content': system},
                      {'role': 'user', 'content': user},
                  ],
                  'max_tokens': max_tokens,
              }
              response = requests.post(
                  MODEL_ENDPOINT,
                  headers={'Authorization': f'Bearer {MODEL_TOKEN}', 'Content-Type': 'application/json'},
                  json=payload,
                  timeout=900,
              )
              if not response.ok:
                  raise RuntimeError(f'model request failed: {response.status_code} {response.text[:3000]}')
              data = response.json()
              content = data['choices'][0]['message']['content']
              if isinstance(content, list):
                  content = ''.join(part.get('text', '') for part in content if isinstance(part, dict))
              text = str(content).strip()
              fenced = re.search(r'```(?:json)?\s*(\{.*\})\s*```', text, re.S)
              if fenced:
                  text = fenced.group(1)
              else:
                  first, last = text.find('{'), text.rfind('}')
                  if first >= 0 and last > first:
                      text = text[first:last + 1]
              try:
                  return json.loads(text)
              except json.JSONDecodeError as exc:
                  raise RuntimeError(f'model returned invalid JSON: {exc}: {text[:5000]}') from exc

          def apply_model_files(result: dict[str, Any], *, documentation_only: bool = False) -> int:
              files = result.get('files', {})
              if isinstance(files, list):
                  files = {item['path']: item['content'] for item in files}
              if not isinstance(files, dict):
                  raise RuntimeError('model JSON files must be an object or list of path/content objects')
              count = 0
              for path, content in files.items():
                  validate_model_path(path, documentation_only=documentation_only)
                  if not isinstance(content, str):
                      raise RuntimeError(f'non-text content for {path}')
                  target = ROOT / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if target.exists() and target.read_text(encoding='utf-8', errors='replace') == content:
                      continue
                  target.write_text(content, encoding='utf-8')
                  count += 1
              for path in result.get('delete', []) or []:
                  validate_model_path(path, documentation_only=documentation_only)
                  target = ROOT / path
                  if target.exists():
                      target.unlink()
                      count += 1
              log(f'applied {count} model file changes; rationale={str(result.get("summary", ""))[:1500]}')
              return count

          def implementation_prompt(evidence: str = '') -> tuple[str, str]:
              system = (
                  'You are an exacting senior engineer repairing a high-integrity economic simulation. '
                  'Return only a JSON object with keys summary, files (path to complete UTF-8 replacement content), '
                  'and delete (array). Do not return patches, markdown fences, UUID/private data, secrets, or commentary outside JSON. '
                  'Use the smallest correct change and preserve all security, accounting, replay, accessibility, and architecture invariants.'
              )
              user = f'''
          Complete Econovaria checkpoint BUSINESS-V2-10A4C3E on PR #676. C3D exact predecessor is {C3D_SHA}.

          Required repairs and audit:
          1. The C3E Market forms use actions buy_now and settle_sell. The connected Player route/form adapter must not require the retired side/orderType body. Align the connected submission path with the authenticated Stock gateway. Browser inputs remain public ticker/evidence/account keys and constrained choices only. Game and Player scope and monetary outcomes remain server-derived.
          2. Immediate buys use one to three unique canonical Checking bac_* accounts with exact listing-currency allocations. Immediate sells use exactly one canonical Checking destination. Preserve sbq_*, pfr_*, btx_* evidence, C3B quote, C3C buy settlement, C3D sell settlement, replay/idempotency/conflict behavior, and fail-closed price, tick, ownership, balances, holdings, liquidity, and FX validation. Never expose or trust UUID/private scope.
          3. Portfolio/holding presentation must never sum unrelated listing currencies under one currency label. Implement per-listing-currency subtotals unless an already-authoritative evidenced B1 read conversion genuinely exists. Preserve listing currency through board/detail/portfolio/holdings/orders/trades, cost basis, position value, and realized/unrealized values.
          4. Prove connected buy and sell submissions, confirmation/receipt/proceeds behavior, public-payload UUID denial, Banking FX reads, keyboard/focus/mobile/reduced-motion/screen-reader behavior. Do not weaken retained Store, Banking, browser, privacy, security, or architecture tests.
          5. Unsupported limit/queued/partial-fill execution, margin, short selling, and the old fee estimate remain absent. Do not create a Stock wallet or balance cache.
          6. Update docs/operations/contracts/player-cross-cutting/pr-676.json narrowly for any additional exact path. Keep the C3E execution note not certified until CI is green. Regenerate architecture inventory through repository tooling rather than hand-editing generated metrics.

          Do not modify workflows, migrations, secrets, schedulers, domains, deployment files, staging/production data, or unrelated domains. Do not merge or deploy.

          Repository context follows:
          {gather_implementation_context(evidence)}
          '''
              return system, user

          def regenerate_architecture() -> None:
              candidates = [
                  ['node', 'scripts/generate-architecture-inventory.mjs'],
                  ['node', 'scripts/generate-econovaria-architecture-inventory.mjs'],
              ]
              for command in candidates:
                  if (ROOT / command[1]).exists():
                      run(command)
                      return
              try:
                  package = json.loads((ROOT / 'package.json').read_text())
                  for name in package.get('scripts', {}):
                      lower = name.lower()
                      if 'architecture' in lower and ('inventory' in lower or 'generate' in lower):
                          run(['npm', 'run', name])
                          return
              except Exception:
                  pass

          def local_checks() -> str:
              regenerate_architecture()
              commands = [
                  ['node', '--test', 'scripts/player-cross-cutting-authority.test.mjs'],
                  ['node', '--test', 'player-terminal/tests/stock-multicurrency-funding.mjs', 'player-terminal/tests/portfolio-market-holdings.mjs'],
                  ['npm', '--prefix', 'backend', 'run', 'typecheck'],
              ]
              logs: list[str] = []
              for command in commands:
                  completed = run(command, check=False, timeout=1800)
                  logs.append(f'$ {" ".join(command)}\n{completed.stdout}')
                  if completed.returncode != 0:
                      return '\n'.join(logs)[-100000:]
              changed = ROOT / '/tmp/invalid'
              changed_file = Path('/tmp/c3e-changed-files.txt')
              changed_file.write_text('\n'.join(changed_paths()) + '\n')
              verifier = [
                  'node', 'scripts/verify-player-cross-cutting-authority.mjs',
                  '--changed-files', str(changed_file), '--pr-number', str(PR), '--base-ref', BASE,
              ]
              completed = run(verifier, check=False)
              logs.append(f'$ {" ".join(verifier)}\n{completed.stdout}')
              if completed.returncode != 0:
                  return '\n'.join(logs)[-100000:]
              diffcheck = run(['git', 'diff', '--check'], check=False)
              logs.append(diffcheck.stdout)
              if diffcheck.returncode != 0:
                  return '\n'.join(logs)[-100000:]
              try:
                  package = json.loads((ROOT / 'package.json').read_text())
                  for script in ('test:repo', 'quality'):
                      if script in package.get('scripts', {}):
                          completed = run(['npm', 'run', script], check=False, timeout=2400)
                          logs.append(f'$ npm run {script}\n{completed.stdout}')
                          if completed.returncode != 0:
                              return '\n'.join(logs)[-100000:]
              except Exception as exc:
                  logs.append(str(exc))
              return ''

          def repair_implementation(initial_evidence: str = '') -> None:
              evidence = initial_evidence
              for attempt in range(1, 5):
                  system, user = implementation_prompt(evidence)
                  result = model_json(system, user)
                  apply_model_files(result)
                  remove_temporary_workflows()
                  failure = local_checks()
                  if not failure:
                      log(f'local implementation checks passed on attempt {attempt}')
                      return
                  evidence = f'LOCAL CHECK FAILURE ATTEMPT {attempt}:\n{failure}\nCURRENT DIFF:\n{run(["git", "diff", "--stat"], check=False).stdout}'
              raise RuntimeError('implementation repair did not pass local gates')

          def commit_and_push(message: str) -> str:
              remove_temporary_workflows()
              run(['git', 'add', '-A'])
              if not git_status():
                  sha = run(['git', 'rev-parse', 'HEAD']).stdout.strip()
                  log(f'no changes to commit; retaining {sha}')
                  return sha
              run(['git', 'commit', '-m', message])
              sha = run(['git', 'rev-parse', 'HEAD']).stdout.strip()
              run(['git', 'push', 'origin', f'HEAD:{BRANCH}'], timeout=600)
              log(f'pushed {sha}')
              return sha

          def latest_runs(sha: str) -> list[dict[str, Any]]:
              response = api('GET', f'/actions/runs?head_sha={sha}&event=pull_request&per_page=100')
              runs = response.json().get('workflow_runs', [])
              latest: dict[str, dict[str, Any]] = {}
              for item in sorted(runs, key=lambda x: (x.get('name', ''), x.get('run_attempt', 0), x.get('created_at', ''))):
                  latest[item['name']] = item
              return list(latest.values())

          def matrix_state(sha: str) -> tuple[str, list[dict[str, Any]], dict[str, Any]]:
              runs = latest_runs(sha)
              by_name = {item['name']: item for item in runs}
              missing = [name for name in REQUIRED_WORKFLOWS if name not in by_name]
              pending = [name for name in REQUIRED_WORKFLOWS if name in by_name and by_name[name].get('status') != 'completed']
              failed = [name for name in REQUIRED_WORKFLOWS if name in by_name and by_name[name].get('status') == 'completed' and by_name[name].get('conclusion') != 'success']
              extra_failed = [item['name'] for item in runs if item.get('status') == 'completed' and item.get('conclusion') not in ('success', 'skipped', 'neutral')]
              detail = {'missing': missing, 'pending': pending, 'failed': failed, 'extra_failed': extra_failed, 'count': len(runs)}
              if failed or extra_failed:
                  return 'failed', runs, detail
              if missing or pending:
                  return 'pending', runs, detail
              return 'green', runs, detail

          def update_pr_body(text: str) -> None:
              api('PATCH', f'/pulls/{PR}', json_body={'body': text})

          def signal_wait(phase: str, sha: str, detail: dict[str, Any]) -> None:
              current = api('GET', f'/pulls/{PR}').json()
              original = current.get('body') or ''
              marker = '\n\n---\n\n### C3E autonomous controller status\n'
              body = original.split(marker)[0] + marker + f'Phase: `{phase}`  \nHead: `{sha}`  \nMatrix: `{json.dumps(detail, sort_keys=True)}`  \nThe controller is waiting for the ordinary PR workflow event; no merge or deployment is authorized.'
              update_pr_body(body)

          def collect_failed_logs(runs: list[dict[str, Any]]) -> str:
              chunks: list[str] = []
              for workflow in runs:
                  if workflow.get('status') != 'completed' or workflow.get('conclusion') in ('success', 'skipped', 'neutral'):
                      continue
                  run_id = workflow['id']
                  jobs = api('GET', f'/actions/runs/{run_id}/jobs?per_page=100').json().get('jobs', [])
                  chunks.append(f'===== WORKFLOW {workflow["name"]} RUN {run_id} =====')
                  for job in jobs:
                      if job.get('conclusion') != 'failure':
                          continue
                      chunks.append(f'--- JOB {job.get("name")} ID {job.get("id")} ---')
                      try:
                          response = requests.get(
                              f'{API}/actions/jobs/{job["id"]}/logs', headers=AUTH_HEADERS, timeout=120, allow_redirects=True,
                          )
                          data = response.content
                          if data[:2] == b'PK':
                              with zipfile.ZipFile(BytesIO(data)) as archive:
                                  for name in archive.namelist():
                                      chunks.append(archive.read(name).decode('utf-8', errors='replace')[-80000:])
                          else:
                              chunks.append(data.decode('utf-8', errors='replace')[-80000:])
                      except Exception as exc:
                          chunks.append(f'log download failed: {exc}')
              return '\n'.join(chunks)[-220000:]

          def rerun_failed(runs: list[dict[str, Any]]) -> None:
              for workflow in runs:
                  if workflow.get('status') == 'completed' and workflow.get('conclusion') not in ('success', 'skipped', 'neutral'):
                      try:
                          api('POST', f'/actions/runs/{workflow["id"]}/rerun-failed-jobs', allow=(201,))
                          log(f'reran failed jobs for {workflow["name"]}')
                      except Exception as exc:
                          log(f'failed to rerun {workflow["name"]}: {exc}')

          def wait_matrix(sha: str, phase: str, timeout_seconds: int = 7200) -> tuple[str, list[dict[str, Any]], dict[str, Any]]:
              started = time.time()
              last_signal = 0.0
              while time.time() - started < timeout_seconds:
                  state, runs, detail = matrix_state(sha)
                  log(f'{phase} matrix {state}: {detail}')
                  if state in ('green', 'failed'):
                      return state, runs, detail
                  if time.time() - last_signal > 600:
                      signal_wait(phase, sha, detail)
                      last_signal = time.time()
                  time.sleep(30)
              raise RuntimeError(f'{phase} exact-head matrix timed out for {sha}')

          def implementation_ci_loop(initial_sha: str) -> tuple[str, list[dict[str, Any]]]:
              sha = initial_sha
              for cycle in range(1, 7):
                  state, runs, detail = wait_matrix(sha, f'implementation-{cycle}')
                  if state == 'green':
                      return sha, runs
                  logs = collect_failed_logs(runs)
                  before = git_status()
                  repair_implementation('EXACT-HEAD CI FAILURES:\n' + logs)
                  if not git_status() and not before:
                      rerun_failed(runs)
                      state, rerun_runs, _ = wait_matrix(sha, f'implementation-rerun-{cycle}')
                      if state == 'green':
                          return sha, rerun_runs
                      logs = collect_failed_logs(rerun_runs)
                      repair_implementation('PERSISTENT EXACT-HEAD CI FAILURES AFTER RERUN:\n' + logs)
                  sha = commit_and_push('fix(stocks): repair C3E exact-head verification')
              raise RuntimeError('exhausted C3E implementation CI repair cycles')

          def evidence_map(runs: list[dict[str, Any]]) -> dict[str, Any]:
              return {
                  item['name']: {
                      'run_id': item['id'],
                      'conclusion': item.get('conclusion'),
                      'url': item.get('html_url'),
                  }
                  for item in sorted(runs, key=lambda x: x['name'].lower())
              }

          def gather_docs_context(evidence: dict[str, Any], implementation_sha: str, extra: str = '') -> str:
              candidates = [
                  'docs/roadmaps/multicurrency-stock-funding-c3d-handoff-v1.md',
                  'docs/roadmaps/multicurrency-stock-funding-c3e-execution-note-v1.md',
                  'docs/roadmaps/multicurrency-stock-funding-implementation-plan-v1.md',
                  'docs/roadmaps/business-v2-current-checkpoint-v1.json',
                  'docs/roadmaps/business-v2-roadmap-reconciliation-20260829.md',
                  'docs/operations/contracts/player-cross-cutting/pr-676.json',
              ]
              candidates += grep_paths(r'C3D|C3E|BUSINESS-V2-10A4C3|execution log', ['docs/roadmaps'], maximum=25)
              chunks = []
              total = 0
              for path in dict.fromkeys(candidates):
                  text = read_text(path, 90000)
                  if not text:
                      continue
                  block = f'\n===== FILE {path} =====\n{text}\n'
                  if total + len(block) > 420000:
                      break
                  chunks.append(block)
                  total += len(block)
              return ''.join(chunks) + f'\n===== IMPLEMENTATION SHA =====\n{implementation_sha}\n===== WORKFLOW EVIDENCE =====\n{json.dumps(evidence, indent=2)}\n===== EXTRA =====\n{extra[-80000:]}'

          def author_certification_docs(implementation_sha: str, runs: list[dict[str, Any]], extra: str = '') -> None:
              system = (
                  'You are maintaining authoritative repository certification records. Return only JSON with summary, files, and delete. '
                  'Files are complete UTF-8 replacements. Change documentation/manifests only. Do not guess self-referential SHAs or invent workflow evidence.'
              )
              evidence = evidence_map(runs)
              user = f'''
          Exact C3E implementation {implementation_sha} passed the complete required exact-head matrix. Complete durable certification for checkpoint BUSINESS-V2-10A4C3E.

          - Create/update docs/roadmaps/multicurrency-stock-funding-c3e-handoff-v1.md with exact implementation SHA, C3D predecessor {C3D_SHA}, permanent run IDs/outcomes from the supplied evidence, certified behavior, exclusions, PR #676 state, and explicit no-merge/no-deployment/no-live-mutation statement.
          - Update the C3E execution note from in-progress to implemented/certified, recording the connected buy_now/settle_sell adapter repair, per-listing-currency portfolio subtotals, browser/privacy/accessibility evidence, and the distinction between implementation SHA and later documentation head.
          - Promote docs/roadmaps/business-v2-current-checkpoint-v1.json to BUSINESS-V2-10A4C3E with exact_implementation_sha {implementation_sha}, parent C3D, exact workflow runs, next BUSINESS-V2-10A4C3F, and all release/deployment flags false.
          - Update the authoritative existing Business V2 execution log with a concise C3E certification entry. Locate it in the supplied context; do not invent a parallel log.
          - Reconcile business-v2-roadmap-reconciliation-20260829.md so historical sections are labeled and the machine-readable checkpoint is current.
          - Update PR #676 exact-path authority manifest narrowly for every new documentation path.
          - Preserve valid deterministic JSON and architecture ratchets. Do not edit product source, workflows, migrations, secrets, schedulers, domains, infrastructure, or deployment files.
          - State that the documentation commit itself is not finally reportable until it passes a fresh exact-head matrix; do not insert a guessed documentation SHA into its own content.

          Context:
          {gather_docs_context(evidence, implementation_sha, extra)}
          '''
              result = model_json(system, user)
              apply_model_files(result, documentation_only=True)
              remove_temporary_workflows()
              run(['python', '-m', 'json.tool', 'docs/roadmaps/business-v2-current-checkpoint-v1.json'])
              run(['python', '-m', 'json.tool', 'docs/operations/contracts/player-cross-cutting/pr-676.json'])
              regenerate_architecture()
              changed_file = Path('/tmp/c3e-doc-changed-files.txt')
              changed_file.write_text('\n'.join(changed_paths()) + '\n')
              run([
                  'node', 'scripts/verify-player-cross-cutting-authority.mjs',
                  '--changed-files', str(changed_file), '--pr-number', str(PR), '--base-ref', BASE,
              ])
              run(['git', 'diff', '--check'])

          def docs_ci_loop(implementation_sha: str, implementation_runs: list[dict[str, Any]], docs_sha: str) -> tuple[str, list[dict[str, Any]]]:
              sha = docs_sha
              for cycle in range(1, 4):
                  state, runs, detail = wait_matrix(sha, f'documentation-{cycle}')
                  if state == 'green':
                      return sha, runs
                  logs = collect_failed_logs(runs)
                  before_paths = set(changed_paths())
                  author_certification_docs(implementation_sha, implementation_runs, 'DOCUMENTATION HEAD CI FAILURES:\n' + logs)
                  after_status = git_status()
                  if not after_status:
                      rerun_failed(runs)
                      state, rerun_runs, _ = wait_matrix(sha, f'documentation-rerun-{cycle}')
                      if state == 'green':
                          return sha, rerun_runs
                      raise RuntimeError('persistent final documentation-head failure without a documentation correction')
                  changed_now = set(changed_paths())
                  source_changes = [p for p in changed_now - before_paths if not p.startswith(('docs/roadmaps/', 'docs/operations/contracts/player-cross-cutting/', 'docs/architecture/inventories/'))]
                  if source_changes:
                      raise RuntimeError(f'documentation repair attempted source changes: {source_changes}')
                  sha = commit_and_push('fix(stocks): reconcile C3E certification evidence')
              raise RuntimeError('exhausted documentation CI repair cycles')

          def final_pr_body(implementation_sha: str, docs_sha: str, implementation_runs: list[dict[str, Any]], docs_runs: list[dict[str, Any]]) -> str:
              def lines(items: list[dict[str, Any]]) -> str:
                  return '\n'.join(f'- `{item["name"]}` — run `{item["id"]}` — `{item.get("conclusion")}`' for item in sorted(items, key=lambda x: x['name'].lower()))
              return f'''## Roadmap checkpoint

          `BUSINESS-V2-10A4C3E` — authenticated Player Stock multi-currency funding cutover.

          ## Certified identities

          - Certified predecessor C3D: `{C3D_SHA}`.
          - Exact certified C3E implementation: `{implementation_sha}`.
          - Final exact-head certification documentation: `{docs_sha}`.
          - Durable handoff: `docs/roadmaps/multicurrency-stock-funding-c3e-handoff-v1.md`.
          - Current checkpoint manifest: `docs/roadmaps/business-v2-current-checkpoint-v1.json`.
          - Next authorized checkpoint: `BUSINESS-V2-10A4C3F`.

          ## Certified C3E result

          The authenticated Player Stock surface publishes listing currency; routes immediate buys through C3B quote plus C3C settlement; routes sells through C3D; uses canonical Banking `bac_*` Checking accounts; constrains buy funding to one-to-three accounts and sell proceeds to exactly one destination; rejects private UUID scope injection; preserves public evidence/replay/conflict semantics; presents portfolio values per listing currency; and excludes unsupported limit-order, margin, short, queued, partial-fill, and fee-estimate behavior.

          The connected Market adapter uses `buy_now` / `settle_sell` rather than the retired `side` / `orderType` body. Retained Store, Banking, privacy, security, architecture, database, browser, and accessibility gates were not weakened.

          ## Exact implementation workflow matrix

          {lines(implementation_runs)}

          ## Final documentation-head workflow matrix

          {lines(docs_runs)}

          ## Safety state

          PR #676 remains draft, open, unmerged, and undeployed. No merge, deployment, scheduler change, secret mutation, domain/infrastructure change, staging/production SQL, or live-data mutation was performed or authorized.
          '''

          def cleanup_after_failure(message: str) -> None:
              log(f'cleanup after failure: {message}')
              try:
                  run(['git', 'reset', '--hard', 'HEAD'])
                  remove_temporary_workflows()
                  if git_status():
                      commit_and_push('chore(ci): remove failed C3E controller bootstrap')
              except Exception as cleanup_exc:
                  log(f'cleanup failed: {cleanup_exc}')
              try:
                  current = api('GET', f'/pulls/{PR}').json()
                  original = (current.get('body') or '').split('\n\n---\n\n### C3E autonomous controller status')[0]
                  update_pr_body(original + '\n\n---\n\n### C3E autonomous controller status\nController stopped without certification. Evidence: `' + message[:1800].replace('`', "'") + '`. C3D remains the certified checkpoint. No merge or deployment was performed.')
              except Exception:
                  pass

          def main() -> None:
              configure_git()
              pr = api('GET', f'/pulls/{PR}').json()
              if pr.get('state') != 'open' or not pr.get('draft') or pr.get('merged'):
                  raise RuntimeError('PR #676 safety state changed; expected open draft unmerged')
              if pr['head']['ref'] != BRANCH or pr['base']['ref'] != BASE:
                  raise RuntimeError('PR branch/base drift')
              remove_temporary_workflows()
              repair_implementation()
              implementation_candidate = commit_and_push('fix(stocks): complete C3E connected funding cutover')
              implementation_sha, implementation_runs = implementation_ci_loop(implementation_candidate)
              log(f'implementation green: {implementation_sha}')

              author_certification_docs(implementation_sha, implementation_runs)
              docs_candidate = commit_and_push('docs(stocks): certify C3E Player funding cutover')
              docs_sha, docs_runs = docs_ci_loop(implementation_sha, implementation_runs, docs_candidate)
              log(f'documentation head green: {docs_sha}')

              body = final_pr_body(implementation_sha, docs_sha, implementation_runs, docs_runs)
              update_pr_body(body)
              final = api('GET', f'/pulls/{PR}').json()
              if final.get('state') != 'open' or not final.get('draft') or final.get('merged') or final['head']['sha'] != docs_sha:
                  raise RuntimeError('final PR safety/head verification failed')
              result = {
                  'status': 'certified',
                  'checkpoint': 'BUSINESS-V2-10A4C3E',
                  'implementation_sha': implementation_sha,
                  'documentation_sha': docs_sha,
                  'implementation_runs': evidence_map(implementation_runs),
                  'documentation_runs': evidence_map(docs_runs),
                  'next_checkpoint': 'BUSINESS-V2-10A4C3F',
                  'pr': {'number': PR, 'state': 'open', 'draft': True, 'merged': False, 'deployed': False},
              }
              Path('/tmp/c3e-final-result.json').write_text(json.dumps(result, indent=2))
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  Path(summary).write_text('## C3E certified\n\n```json\n' + json.dumps(result, indent=2) + '\n```\n')
              log(json.dumps(result, indent=2))

          try:
              main()
          except Exception as exc:
              traceback.print_exc()
              cleanup_after_failure(str(exc))
              raise
          PY

          python /tmp/c3e_controller.py

      - name: Upload controller diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c3e-controller-failure-${{ github.sha }}
          path: |
            /tmp/c3e-controller*.log
            /tmp/c3e-*-changed-files.txt
          if-no-files-found: ignore
          retention-days: 7
