name: Admin Auth Surface Staging Candidate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Exact current main commit to deploy"
        required: true
        type: string
      confirm_project_ref:
        description: "Type the exact staging project ref"
        required: true
        type: string
      confirm_action:
        description: "Type DEPLOY ADMIN AUTH STAGING"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: admin-auth-surface-staging-candidate
  cancel-in-progress: false

env:
  EXPECTED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  DENIED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  SUPABASE_CLI_VERSION: 2.109.1
  FUNCTION_MANIFEST: backend/supabase/admin-auth-edge-function-manifest.json

jobs:
  deploy:
    name: Deploy canonical Admin auth surfaces to staging
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Enforce explicit staging authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "${{ inputs.confirm_project_ref }}" = "$EXPECTED_STAGING_PROJECT_REF"
          test "${{ inputs.confirm_action }}" = "DEPLOY ADMIN AUTH STAGING"
          test "$EXPECTED_STAGING_PROJECT_REF" != "$DENIED_PRODUCTION_PROJECT_REF"
          [[ "${{ inputs.source_commit }}" =~ ^[a-f0-9]{40}$ ]]

      - name: Check out exact current main source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current main binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_commit }}"
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -f "$FUNCTION_MANIFEST"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install and validate repository contracts
        run: |
          set -euo pipefail
          npm ci
          node scripts/high-priority-boundary-ratchet.mjs
          node --test \
            scripts/verified-staff-onboarding-contract.test.mjs \
            scripts/password-recovery-frontend-contract.test.mjs

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Verify required staging secret names
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"
          names="$RUNNER_TEMP/staging-secret-names.txt"
          supabase secrets list --project-ref "$EXPECTED_STAGING_PROJECT_REF" > "$names"
          for required in \
            SUPABASE_URL \
            SUPABASE_PUBLISHABLE_KEY \
            SUPABASE_SECRET_KEY \
            ECONOVARIA_WEB_ALLOWED_ORIGINS \
            ECONOVARIA_EMAIL_VERIFICATION_RETURN_URL \
            ECONOVARIA_PASSWORD_RECOVERY_RETURN_URL; do
            grep -q "$required" "$names"
          done
          rm -f "$names"

      - name: Capture pre-deploy identities
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/functions-before.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = require(`./${process.env.FUNCTION_MANIFEST}`);
          const rows = require(process.env.FUNCTIONS_PATH);
          const bounded = manifest.functions.map(({ slug }) => {
            const row = rows.find((value) => value.slug === slug);
            return row ? {
              slug,
              version: row.version,
              digest: row.ezbr_sha256,
              verifyJwt: row.verify_jwt,
            } : { slug, missing: true };
          });
          fs.writeFileSync(process.env.ROLLBACK_PATH, `${JSON.stringify(bounded, null, 2)}\n`);
          NODE
        env:
          FUNCTIONS_PATH: ${{ runner.temp }}/functions-before.json
          ROLLBACK_PATH: ${{ runner.temp }}/admin-auth-staging-before.json

      - name: Deploy exact canonical auth functions
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > "$RUNNER_TEMP/admin-auth-functions.tsv"
          const manifest = require(`./${process.env.FUNCTION_MANIFEST}`);
          for (const entry of manifest.functions) {
            process.stdout.write(`${entry.slug}\t${entry.verifyJwt}\n`);
          }
          NODE
          while IFS=$'\t' read -r function_name verify_jwt; do
            test -n "$function_name"
            if [[ "$verify_jwt" == "false" ]]; then
              supabase functions deploy "$function_name" \
                --workdir backend \
                --project-ref "$EXPECTED_STAGING_PROJECT_REF" \
                --no-verify-jwt
            elif [[ "$verify_jwt" == "true" ]]; then
              supabase functions deploy "$function_name" \
                --workdir backend \
                --project-ref "$EXPECTED_STAGING_PROJECT_REF"
            else
              exit 1
            fi
          done < "$RUNNER_TEMP/admin-auth-functions.tsv"

      - name: Verify deployed auth inventory
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_PROJECT_REF/functions" \
            > "$RUNNER_TEMP/functions-after.json"
          node - <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const manifest = require(`./${process.env.FUNCTION_MANIFEST}`);
          const rows = require(process.env.FUNCTIONS_PATH);
          const deployed = manifest.functions.map(({ slug, verifyJwt, authorizationModel }) => {
            const row = rows.find((value) => value.slug === slug);
            if (!row) throw new Error(`Missing auth function: ${slug}`);
            if (row.verify_jwt !== verifyJwt) throw new Error(`${slug} verify_jwt mismatch.`);
            if (!/^[a-f0-9]{64}$/.test(String(row.ezbr_sha256 || ''))) throw new Error(`${slug} digest invalid.`);
            return { slug, verifyJwt, authorizationModel, version: row.version, digest: row.ezbr_sha256 };
          });
          const inventoryDigest = crypto.createHash('sha256').update(JSON.stringify(deployed)).digest('hex');
          fs.writeFileSync(process.env.EVIDENCE_PATH, `${JSON.stringify({
            schemaVersion: 1,
            environment: 'staging',
            projectRef: process.env.EXPECTED_STAGING_PROJECT_REF,
            sourceCommit: process.env.SOURCE_COMMIT,
            inventoryDigest,
            deployed,
          }, null, 2)}\n`);
          NODE
        env:
          FUNCTIONS_PATH: ${{ runner.temp }}/functions-after.json
          EVIDENCE_PATH: ${{ runner.temp }}/admin-auth-staging-candidate.json
          SOURCE_COMMIT: ${{ inputs.source_commit }}

      - name: Upload staging auth evidence
        uses: actions/upload-artifact@v7
        with:
          name: admin-auth-staging-${{ inputs.source_commit }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/admin-auth-staging-candidate.json
            ${{ runner.temp }}/admin-auth-staging-before.json
