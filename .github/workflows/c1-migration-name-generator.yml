name: C1 migration name generator

on:
  push:
    branches:
      - feat/multicurrency-store-funding-v1
    paths:
      - .github/workflows/c1-migration-name-generator.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact generator head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install pinned tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          npm ci --ignore-scripts

      - name: Generate canonical C1 migration paths
        shell: bash
        run: |
          set -euo pipefail
          npx supabase --version
          npx supabase migration new --help >/tmp/c1-migration-help.txt
          find backend/supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/c1-before.txt
          npx supabase migration new multicurrency_store_funding_schema_v1 --workdir backend
          sleep 1
          npx supabase migration new multicurrency_store_funding_commands_v1 --workdir backend
          sleep 1
          npx supabase migration new multicurrency_store_funding_assertions_v1 --workdir backend
          find backend/supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/c1-after.txt
          echo 'C1_GENERATED_MIGRATIONS_BEGIN'
          comm -13 /tmp/c1-before.txt /tmp/c1-after.txt
          echo 'C1_GENERATED_MIGRATIONS_END'
