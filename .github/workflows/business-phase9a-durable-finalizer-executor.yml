name: Business Phase 9A Durable Finalizer Executor

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/business-phase9a-durable-finalizer-executor.yml"

permissions:
  contents: write

concurrency:
  group: business-phase9a-durable-finalizer-executor
  cancel-in-progress: false

jobs:
  execute-finalizer:
    if: >-
      github.event.pull_request.number == 664 &&
      github.event.pull_request.head.ref == 'feat/business-store-withdrawal-safety-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Phase 9A branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/business-store-withdrawal-safety-v2
          fetch-depth: 0

      - name: Verify frozen exact-head lineage
        shell: bash
        run: |
          set -euo pipefail
          IMPLEMENTATION_SHA="bf17e2493654620229d1acdeaae0fbaba21caf63"
          test "$(git log -1 --format=%s)" = "ops(business): execute Phase 9A durable certification"
          git merge-base --is-ancestor "$IMPLEMENTATION_SHA" HEAD
          test -z "$(git diff --name-only "$IMPLEMENTATION_SHA" HEAD -- . \
            ':(exclude).github/workflows/business-phase9a-durable-finalizer.yml' \
            ':(exclude).github/workflows/business-phase9a-durable-finalizer-executor.yml')"

      - name: Execute reviewed durable-record transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEXTRACT'
          from pathlib import Path

          source = Path(
              '.github/workflows/business-phase9a-durable-finalizer.yml'
          ).read_text().splitlines()
          start = next(
              i for i, line in enumerate(source)
              if line.strip() == "python3 - <<'PY'"
          )
          end = next(
              i for i in range(start + 1, len(source))
              if source[i].strip() == 'PY'
          )
          body = [
              line[10:] if line.startswith('          ') else line
              for line in source[start + 1:end]
          ]
          Path('/tmp/business-phase9a-finalize.py').write_text(
              '\n'.join(body) + '\n'
          )
          PYEXTRACT
          python3 /tmp/business-phase9a-finalize.py
          git diff --check

      - name: Commit durable certification records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "econovaria-automation"
          git config user.email "econovaria-automation@users.noreply.github.com"
          git add \
            docs/roadmaps/business-phase9-store-withdrawal-safety-scope-v1.md \
            docs/roadmaps/business-v2-development-execution-plan-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md
          git diff --cached --quiet && { echo "No durable certification delta." >&2; exit 1; }
          git commit -m "docs(business): certify Phase 9A withdrawal safety"
          git push origin HEAD:feat/business-store-withdrawal-safety-v2
