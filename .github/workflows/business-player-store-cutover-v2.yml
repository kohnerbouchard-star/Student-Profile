name: Business Player Store Cutover V2

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "api/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig*.json"
      - "backend/src/domains/business/**"
      - "backend/src/domains/business-banking/**"
      - "backend/src/domains/economy/**"
      - "backend/src/domains/inventory/**"
      - "backend/src/domains/players/**"
      - "backend/src/domains/store/**"
      - "backend/src/platform/**"
      - "backend/src/security/**"
      - "backend/supabase/config.toml"
      - "backend/supabase/functions/**"
      - "backend/supabase/migrations/**"
      - "docs/architecture/inventories/econovaria-architecture-inventory-v2.json"
      - "docs/operations/contracts/beta-seed-downstream-consumer-contract-v1.json"
      - "docs/roadmaps/business-phase10-player-store-cutover-scope-v1.md"
      - "docs/seed-content/authorizations/**"
      - "docs/seed-content/executable/beta-pack-v1/**"
      - "docs/seed-content/items/**"
      - "docs/seed-content/simulation/**"
      - "frontend/**"
      - "index.html"
      - "player-terminal/**"
      - "scripts/architecture/**"
      - "scripts/business-phase7-*.mjs"
      - "scripts/business-phase8-*.mjs"
      - "scripts/business-phase9-*.mjs"
      - "scripts/business-phase10-*.mjs"
      - "scripts/build-physical-economy-runtime-pack.mjs"
      - "scripts/lib/physical-economy-pack-*.mjs"
      - "scripts/econovaria-local-gateway.py"
      - "scripts/econovaria-local-gateway-core.py"
      - "scripts/game-creation-provisioning-local-acceptance.mjs"
      - "scripts/local-staging-gateway-contract.test.mjs"
      - "scripts/redact-econovaria-ci-log*.mjs"
      - "scripts/runtime-interaction-wiring-audit.mjs"
      - "scripts/simulate-physical-economy-activation-v3.mjs"
      - "scripts/validate-supabase-migrations.mjs"
      - "scripts/world-staging-provision-lib.mjs"
      - ".github/workflows/business-player-store-cutover-v2.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "api/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig*.json"
      - "backend/src/domains/business/**"
      - "backend/src/domains/business-banking/**"
      - "backend/src/domains/economy/**"
      - "backend/src/domains/inventory/**"
      - "backend/src/domains/players/**"
      - "backend/src/domains/store/**"
      - "backend/src/platform/**"
      - "backend/src/security/**"
      - "backend/supabase/config.toml"
      - "backend/supabase/functions/**"
      - "backend/supabase/migrations/**"
      - "docs/architecture/inventories/econovaria-architecture-inventory-v2.json"
      - "docs/operations/contracts/beta-seed-downstream-consumer-contract-v1.json"
      - "docs/roadmaps/business-phase10-player-store-cutover-scope-v1.md"
      - "docs/seed-content/authorizations/**"
      - "docs/seed-content/executable/beta-pack-v1/**"
      - "docs/seed-content/items/**"
      - "docs/seed-content/simulation/**"
      - "frontend/**"
      - "index.html"
      - "player-terminal/**"
      - "scripts/architecture/**"
      - "scripts/business-phase7-*.mjs"
      - "scripts/business-phase8-*.mjs"
      - "scripts/business-phase9-*.mjs"
      - "scripts/business-phase10-*.mjs"
      - "scripts/build-physical-economy-runtime-pack.mjs"
      - "scripts/lib/physical-economy-pack-*.mjs"
      - "scripts/econovaria-local-gateway.py"
      - "scripts/econovaria-local-gateway-core.py"
      - "scripts/game-creation-provisioning-local-acceptance.mjs"
      - "scripts/local-staging-gateway-contract.test.mjs"
      - "scripts/redact-econovaria-ci-log*.mjs"
      - "scripts/runtime-interaction-wiring-audit.mjs"
      - "scripts/simulate-physical-economy-activation-v3.mjs"
      - "scripts/validate-supabase-migrations.mjs"
      - "scripts/world-staging-provision-lib.mjs"
      - ".github/workflows/business-player-store-cutover-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-player-store-cutover-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-cutover-authority:
    name: Verify Player Store cutover and retained authorities
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm and install repository dependencies
        run: |
          npm install --global npm@10.9.8
          npm ci --ignore-scripts

      - name: Verify Phase 10A.4 and retained Phase 7A through 10A.3
        shell: bash
        run: |
          set -euo pipefail
          {
            node scripts/business-phase10-player-store-cutover-contract.mjs
            node scripts/business-phase10-atomic-settlement-contract.mjs
            node scripts/business-phase10-atomic-settlement-simulation.mjs
            node --experimental-strip-types scripts/business-phase10-atomic-settlement-types.mjs
            node scripts/business-phase10-offer-aware-quote-contract.mjs
            node scripts/business-phase10-offer-aware-quote-simulation.mjs
            node --experimental-strip-types scripts/business-phase10-offer-aware-quote-types.mjs
            node scripts/business-phase10-store-purchase-settlement-foundation-contract.mjs
            node --experimental-strip-types scripts/business-phase10-store-purchase-settlement-lock-simulation.mjs
            node --experimental-strip-types scripts/business-phase10-store-purchase-settlement-foundation-types.mjs
            node scripts/business-phase9-store-withdrawal-safety-contract.mjs
            node scripts/business-phase9-store-withdrawal-safety-simulation.mjs
            node --experimental-strip-types scripts/business-phase9-store-withdrawal-safety-types.mjs
            node scripts/business-phase8-store-listing-inventory-contract.mjs
            node scripts/business-phase8-store-listing-inventory-simulation.mjs
            node --experimental-strip-types scripts/business-phase8-store-listing-inventory-types.mjs
            node scripts/business-phase7-store-seller-offers-contract.mjs
            node scripts/business-phase7-store-seller-offers-simulation.mjs
            node --experimental-strip-types scripts/business-phase7-store-seller-offers-types.mjs
            node --test scripts/redact-econovaria-ci-log.test.mjs
            node scripts/validate-supabase-migrations.mjs
            npm run audit:interaction-wiring
            git diff --check
          } 2>&1 | tee /tmp/phase10a4-cutover-authority.log

      - name: Verify deterministic architecture inventory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/architecture/build-architecture-inventory.mjs
          git diff --exit-code -- docs/architecture/inventories/econovaria-architecture-inventory-v2.json

      - name: Upload generated architecture inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase10a4-architecture-inventory
          path: docs/architecture/inventories/econovaria-architecture-inventory-v2.json
          if-no-files-found: error
          retention-days: 14

      - name: Run Repository Quality and Supply Chain Security
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/phase10a4-repository-quality.log
          npm run security:verify 2>&1 | tee /tmp/phase10a4-supply-chain-security.log

      - name: Upload authority diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase10a4-authority-diagnostics
          path: |
            /tmp/phase10a4-cutover-authority.log
            /tmp/phase10a4-repository-quality.log
            /tmp/phase10a4-supply-chain-security.log
          if-no-files-found: warn
          retention-days: 14

  verify-backend-store-runtime:
    name: Verify public Store, seller projection, capabilities, rates, and Edge roots
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.3

      - name: Pin npm and install backend dependencies
        run: |
          npm install --global npm@10.9.8
          npm --prefix backend ci --ignore-scripts

      - name: Verify Store handler and public repository boundaries
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm run test:player-store-public
          deno test \
            --config supabase/functions/classroom-api/deno.json \
            --lock=supabase/functions/deno.lock \
            --frozen \
            src/domains/store/infrastructure/supabasePlayerStoreOfferPublicRepository.test.ts \
            src/domains/business/infrastructure/supabasePlayerBusinessRepository.test.ts

      - name: Verify capabilities and reviewed Store rate limits
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm run test:player-capabilities
          deno test \
            --allow-read=supabase/functions/classroom-api/index.ts,supabase/functions/player-api/runtime.ts \
            --config supabase/functions/classroom-api/deno.json \
            --lock=supabase/functions/deno.lock \
            --frozen \
            src/domains/store/tests/playerStorePublicRateLimitContract.test.ts \
            src/security/playerRateLimitDispatch.test.ts \
            src/security/classroomApiRateLimitDispatch.test.ts

      - name: Verify backend TypeScript and every Edge root
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          mapfile -t STRICT_EDGE_ROOTS < <(
            find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts \
              ! -path 'supabase/functions/admin-api/index.ts' -print | sort
          )
          test "${#STRICT_EDGE_ROOTS[@]}" -gt 0
          deno check \
            --config supabase/functions/deno.json \
            --lock=supabase/functions/deno.lock \
            --frozen \
            "${STRICT_EDGE_ROOTS[@]}"
          deno check \
            --config supabase/functions/admin-api/deno.json \
            --lock=supabase/functions/deno.lock \
            --frozen \
            supabase/functions/admin-api/index.ts

  verify-database-settlement:
    name: Verify serial settlement, ordering races, and two-game isolation
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm and install pinned tooling
        run: |
          npm install --global npm@10.9.8
          npm ci --ignore-scripts

      - name: Start disposable Postgres service
        shell: bash
        run: |
          set -euo pipefail
          LOG="/tmp/phase10a4-database-startup.log"
          : > "$LOG"
          STATUS=1
          EXCLUDED="studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,gotrue,postgrest,realtime,kong,mailpit,postgres-meta"
          for ATTEMPT in 1 2 3; do
            printf '\n## Supabase Postgres startup attempt %s\n' "$ATTEMPT" | tee -a "$LOG"
            set +e
            npx supabase start --workdir backend --exclude "$EXCLUDED" 2>&1 \
              | node scripts/redact-econovaria-ci-log.mjs \
              | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            npx supabase status --workdir backend 2>&1 \
              | node scripts/redact-econovaria-ci-log.mjs \
              | tee -a "$LOG" || true
            npx supabase stop --workdir backend --no-backup 2>&1 \
              | node scripts/redact-econovaria-ci-log.mjs \
              | tee -a "$LOG" || true
            sleep $((ATTEMPT * 10))
          done
          exit "$STATUS"

      - name: Rebuild database for serial behavior verification
        shell: bash
        run: |
          set -euo pipefail
          npx supabase db reset --workdir backend --local 2>&1 \
            | node scripts/redact-econovaria-ci-log.mjs \
            | tee /tmp/phase10a4-database-reset.log

      - name: Run permanent atomic-settlement database harness
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          node scripts/business-phase10-atomic-settlement-database.mjs 2>&1 \
            | node scripts/redact-econovaria-ci-log.mjs \
            | tee /tmp/phase10a4-database-harness.log

      - name: Rebuild database for independent concurrency verification
        shell: bash
        run: |
          set -euo pipefail
          npx supabase db reset --workdir backend --local 2>&1 \
            | node scripts/redact-econovaria-ci-log.mjs \
            | tee /tmp/phase10a4-concurrency-reset.log

      - name: Run permanent settlement concurrency and withdrawal-ordering harness
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          node scripts/business-phase10-atomic-settlement-concurrency.mjs 2>&1 \
            | node scripts/redact-econovaria-ci-log.mjs \
            | tee /tmp/phase10a4-concurrency-harness.log

      - name: Capture database diagnostics
        if: failure()
        shell: bash
        run: |
          set -o pipefail
          npx supabase status --workdir backend 2>&1 \
            | node scripts/redact-econovaria-ci-log.mjs \
            | tee /tmp/phase10a4-database-status.log || true
          docker ps -a 2>&1 \
            | node scripts/redact-econovaria-ci-log.mjs \
            | tee /tmp/phase10a4-database-docker.log || true
          docker system df 2>&1 \
            | node scripts/redact-econovaria-ci-log.mjs \
            | tee -a /tmp/phase10a4-database-docker.log || true

      - name: Sanitize and verify database diagnostics
        id: database_evidence_privacy
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          SANITIZED_DIR=/tmp/phase10a4-database-sanitized
          mkdir -p "$SANITIZED_DIR"
          for SOURCE in \
            /tmp/phase10a4-database-startup.log \
            /tmp/phase10a4-database-reset.log \
            /tmp/phase10a4-database-harness.log \
            /tmp/phase10a4-concurrency-reset.log \
            /tmp/phase10a4-concurrency-harness.log \
            /tmp/phase10a4-database-status.log \
            /tmp/phase10a4-database-docker.log; do
            if [ -f "$SOURCE" ]; then
              node scripts/redact-econovaria-ci-log.mjs "$SOURCE" \
                > "$SANITIZED_DIR/$(basename "$SOURCE")"
            fi
          done
          if grep -aErqi \
            -e 'postgres(ql)?://[^[:space:]]+' \
            -e 'postgres:postgres' \
            -e '"?(SUPABASE[ _-]?[A-Z0-9_]*(SECRET|KEY|TOKEN|PASSWORD)|DATABASE[ _-]?URL|DB[ _-]?URL|PGPASSWORD|DB[ _-]?PASSWORD|POSTGRES[ _-]?PASSWORD|JWT[ _-]?SECRET|(ANON|SERVICE[ _-]?ROLE|SECRET|PUBLISHABLE)[ _-]?KEY|S3[ _-]?(ACCESS|SECRET)[ _-]?KEY|S3_[A-Z0-9_]+|ECONOVARIA_[A-Z0-9_]*(SECRET|KEY|TOKEN|PASSWORD|PEPPER)|AUTHORIZATION|APIKEY|API[ _-]?KEY|COOKIE|SET[ _-]?COOKIE|X[ _-]?PLAYER[ _-]?SESSION[ _-]?TOKEN|X[ _-]?ECONOVARIA[ _-]?(CSRF|PLAYER[ _-]?SESSION)[ _-]?TOKEN)"?[[:space:]]*(=|:|\||│)[[:space:]]*[^[:space:]|│]+' \
            -e '[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}' \
            -e 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' \
            -e 'sb_(secret|publishable)_[A-Za-z0-9_-]+' \
            -e '"?[A-Z][A-Z0-9_]*_HASH"?[[:space:]]*(=|:|[|│]|%3D)[[:space:]]*(eq\.|eq%2E)?("[^"]*"|[^&[:space:]|│"]+)' \
            -e '"?authorization"?[[:space:]]*:[[:space:]]*"?bearer[[:space:]]+[^[:space:]"]+' \
            -e '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----' \
            "$SANITIZED_DIR"; then
            echo "Database diagnostics contain a forbidden credential or private identifier." >&2
            exit 1
          fi

      - name: Upload sanitized database diagnostics
        if: failure() && steps.database_evidence_privacy.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase10a4-database-settlement-diagnostics
          path: /tmp/phase10a4-database-sanitized/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop disposable stack
        if: always()
        run: npx supabase stop --workdir backend --no-backup 2>&1 | node scripts/redact-econovaria-ci-log.mjs || true

  verify-database-replay:
    name: Replay complete database twice and lint at warning level
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm and install pinned tooling
        run: |
          npm install --global npm@10.9.8
          npm ci --ignore-scripts

      - name: Validate migration source
        run: npm run audit:migrations

      - name: Start disposable Postgres service
        shell: bash
        run: |
          set -euo pipefail
          LOG="/tmp/phase10a4-database-replay-startup.log"
          : > "$LOG"
          STATUS=1
          EXCLUDED="studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,gotrue,postgrest,realtime,kong,mailpit,postgres-meta"
          for ATTEMPT in 1 2 3; do
            printf '\n## Supabase Postgres startup attempt %s\n' "$ATTEMPT" | tee -a "$LOG"
            set +e
            npx supabase start --workdir backend --exclude "$EXCLUDED" 2>&1 \
              | node scripts/redact-econovaria-ci-log.mjs \
              | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            npx supabase status --workdir backend 2>&1 \
              | node scripts/redact-econovaria-ci-log.mjs \
              | tee -a "$LOG" || true
            npx supabase stop --workdir backend --no-backup 2>&1 \
              | node scripts/redact-econovaria-ci-log.mjs \
              | tee -a "$LOG" || true
            sleep $((ATTEMPT * 10))
          done
          exit "$STATUS"

      - name: Replay migrations from zero twice
        shell: bash
        run: |
          set -euo pipefail
          npx supabase db reset --workdir backend --local 2>&1 \
            | node scripts/redact-econovaria-ci-log.mjs \
            | tee /tmp/phase10a4-database-replay.log
          npx supabase db reset --workdir backend --local 2>&1 \
            | node scripts/redact-econovaria-ci-log.mjs \
            | tee -a /tmp/phase10a4-database-replay.log

      - name: Lint rebuilt database
        shell: bash
        run: |
          set -euo pipefail
          npx supabase db lint --workdir backend --local --level warning 2>&1 \
            | node scripts/redact-econovaria-ci-log.mjs \
            | tee /tmp/phase10a4-database-lint.log

      - name: Capture database replay diagnostics
        if: failure()
        shell: bash
        run: |
          set -o pipefail
          npx supabase status --workdir backend 2>&1 \
            | node scripts/redact-econovaria-ci-log.mjs \
            | tee /tmp/phase10a4-database-replay-status.log || true
          docker ps -a 2>&1 \
            | node scripts/redact-econovaria-ci-log.mjs \
            | tee /tmp/phase10a4-database-replay-docker.log || true
          docker system df 2>&1 \
            | node scripts/redact-econovaria-ci-log.mjs \
            | tee -a /tmp/phase10a4-database-replay-docker.log || true

      - name: Sanitize and verify database replay diagnostics
        id: database_replay_evidence_privacy
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          SANITIZED_DIR=/tmp/phase10a4-database-replay-sanitized
          mkdir -p "$SANITIZED_DIR"
          for SOURCE in \
            /tmp/phase10a4-database-replay-startup.log \
            /tmp/phase10a4-database-replay.log \
            /tmp/phase10a4-database-lint.log \
            /tmp/phase10a4-database-replay-status.log \
            /tmp/phase10a4-database-replay-docker.log; do
            if [ -f "$SOURCE" ]; then
              node scripts/redact-econovaria-ci-log.mjs "$SOURCE" \
                > "$SANITIZED_DIR/$(basename "$SOURCE")"
            fi
          done
          if grep -aErqi \
            -e 'postgres(ql)?://[^[:space:]]+' \
            -e 'postgres:postgres' \
            -e '"?(SUPABASE[ _-]?[A-Z0-9_]*(SECRET|KEY|TOKEN|PASSWORD)|DATABASE[ _-]?URL|DB[ _-]?URL|PGPASSWORD|DB[ _-]?PASSWORD|POSTGRES[ _-]?PASSWORD|JWT[ _-]?SECRET|(ANON|SERVICE[ _-]?ROLE|SECRET|PUBLISHABLE)[ _-]?KEY|S3[ _-]?(ACCESS|SECRET)[ _-]?KEY|S3_[A-Z0-9_]+|ECONOVARIA_[A-Z0-9_]*(SECRET|KEY|TOKEN|PASSWORD|PEPPER)|AUTHORIZATION|APIKEY|API[ _-]?KEY|COOKIE|SET[ _-]?COOKIE|X[ _-]?PLAYER[ _-]?SESSION[ _-]?TOKEN|X[ _-]?ECONOVARIA[ _-]?(CSRF|PLAYER[ _-]?SESSION)[ _-]?TOKEN)"?[[:space:]]*(=|:|\||│)[[:space:]]*[^[:space:]|│]+' \
            -e '[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}' \
            -e 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' \
            -e 'sb_(secret|publishable)_[A-Za-z0-9_-]+' \
            -e '"?[A-Z][A-Z0-9_]*_HASH"?[[:space:]]*(=|:|[|│]|%3D)[[:space:]]*(eq\.|eq%2E)?("[^"]*"|[^&[:space:]|│"]+)' \
            -e '"?authorization"?[[:space:]]*:[[:space:]]*"?bearer[[:space:]]+[^[:space:]"]+' \
            -e '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----' \
            "$SANITIZED_DIR"; then
            echo "Database replay diagnostics contain a forbidden credential or private identifier." >&2
            exit 1
          fi

      - name: Upload sanitized database replay diagnostics
        if: failure() && steps.database_replay_evidence_privacy.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase10a4-database-replay-diagnostics
          path: /tmp/phase10a4-database-replay-sanitized/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop disposable stack
        if: always()
        run: npx supabase stop --workdir backend --no-backup 2>&1 | node scripts/redact-econovaria-ci-log.mjs || true

  verify-player-terminal-and-chromium:
    name: Verify standalone Player Terminal and full Chromium suite
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: player-terminal/package-lock.json

      - name: Pin npm and install Player Terminal dependencies
        run: |
          npm install --global npm@10.9.8
          npm --prefix player-terminal ci --no-audit --no-fund

      - name: Verify standalone Player Terminal
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix player-terminal run verify 2>&1 | tee /tmp/phase10a4-player-terminal.log

      - name: Install Chromium
        working-directory: player-terminal
        run: npx playwright install --with-deps chromium

      - name: Start read-only Player browser server
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/phase10a4-player-read-only-server.log 2>&1 &
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          repository_root = Path.cwd().resolve()
          terminal_root = (repository_root / "player-terminal").resolve()
          frontend_root = (repository_root / "frontend").resolve()
          runtime_config = b'''window.__ECONOVARIA_RUNTIME_CONFIG__ = Object.freeze({
            environment: "development",
            projectRef: "runtimefixture123456",
            supabaseUrl: "https://runtimefixture123456.supabase.co",
            supabasePublishableKey: "sb_publishable_runtime_fixture_1234567890"
          });\n'''

          class PlayerTerminalHandler(SimpleHTTPRequestHandler):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, directory=str(terminal_root), **kwargs)

              def translate_path(self, request_path):
                  pathname = unquote(urlsplit(request_path).path)
                  if pathname.startswith("/frontend/"):
                      candidate = (repository_root / pathname.removeprefix("/")).resolve()
                      if candidate == frontend_root or frontend_root in candidate.parents:
                          return str(candidate)
                  return super().translate_path(request_path)

              def serve_runtime_config(self, include_body):
                  self.send_response(200)
                  self.send_header("Cache-Control", "no-store")
                  self.send_header("Content-Type", "application/javascript; charset=utf-8")
                  self.send_header("Content-Length", str(len(runtime_config)))
                  self.end_headers()
                  if include_body:
                      self.wfile.write(runtime_config)

              def do_GET(self):
                  if urlsplit(self.path).path == "/runtime-config.env.js":
                      self.serve_runtime_config(True)
                      return
                  super().do_GET()

              def do_HEAD(self):
                  if urlsplit(self.path).path == "/runtime-config.env.js":
                      self.serve_runtime_config(False)
                      return
                  super().do_HEAD()

          ThreadingHTTPServer(("127.0.0.1", 4173), PlayerTerminalHandler).serve_forever()
          PY
          echo $! > /tmp/phase10a4-player-read-only-server.pid

          for ATTEMPT in $(seq 1 30); do
            INDEX_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 \
              http://127.0.0.1:4173/ || true)"
            CONFIG_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 \
              http://127.0.0.1:4173/runtime-config.env.js || true)"
            RUNTIME_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 \
              http://127.0.0.1:4173/frontend/src/core/runtime-config.js || true)"
            if [ "$INDEX_STATUS" = "200" ] && [ "$CONFIG_STATUS" = "200" ] && [ "$RUNTIME_STATUS" = "200" ]; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/phase10a4-player-read-only-server.log
          exit 1

      - name: Run focused Business-offer accessibility and responsive acceptance
        working-directory: player-terminal
        shell: bash
        run: |
          set -euo pipefail
          ECONOVARIA_PLAYWRIGHT_REUSE_SERVER=1 \
            npx playwright test \
              tests/browser/player-store-business-offer-acceptance.spec.mjs \
              --project=chromium-desktop \
              --project=chromium-mobile \
              2>&1 | tee /tmp/phase10a4-player-store-focused.log

      - name: Run full Chromium browser verification
        shell: bash
        run: |
          set -euo pipefail
          ECONOVARIA_PLAYWRIGHT_REUSE_SERVER=1 \
            npm --prefix player-terminal run browser 2>&1 | tee /tmp/phase10a4-player-chromium.log

      - name: Stop read-only Player browser server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/phase10a4-player-read-only-server.pid ]; then
            kill "$(cat /tmp/phase10a4-player-read-only-server.pid)" 2>/dev/null || true
          fi

      - name: Upload Player Terminal diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase10a4-player-terminal-diagnostics
          path: |
            /tmp/phase10a4-player-terminal.log
            /tmp/phase10a4-player-chromium.log
            /tmp/phase10a4-player-store-focused.log
            /tmp/phase10a4-player-read-only-server.log
            player-terminal/playwright-report/
            player-terminal/test-results/
          if-no-files-found: warn
          retention-days: 14

  verify-connected-player-store:
    name: Verify connected Buyer and seller Store journey in two games
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PHYSICAL_ECONOMY_PACK: /tmp/phase10a4-physical-economy-runtime-pack.json
      ECONOVARIA_BROWSER_BASE_URL: http://127.0.0.1:4173
      ECONOVARIA_PLAYER_BROWSER_OUTPUT_DIR: /tmp/econovaria-phase10a4-player-store-evidence
      ECONOVARIA_PLAYER_STORE_OUTPUT_DIR: /tmp/econovaria-phase10a4-player-store-evidence
      ECONOVARIA_BROWSER_LICENSE_CODE: PLAYER-PHASE10A4-LICENSE-001
      ECONOVARIA_BROWSER_ADMIN_EMAIL: phase10a4.player@example.test
      ECONOVARIA_BROWSER_ADMIN_PASSWORD: Phase10A4-Player-Admin-2026!
      ECONOVARIA_BROWSER_GAME_NAME: Business Player Store Cutover A
      ECONOVARIA_GATEWAY_REQUEST_TIMEOUT_SECONDS: "180"
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm and install connected-runtime dependencies
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          npm ci
          node --check scripts/business-phase10-player-store-browser-acceptance.mjs
          node --check scripts/redact-econovaria-ci-log.mjs
          node --test scripts/redact-econovaria-ci-log.test.mjs
          python3 -m py_compile scripts/econovaria-local-gateway.py scripts/econovaria-local-gateway-core.py
          node --test scripts/local-staging-gateway-contract.test.mjs
          node --test scripts/local-edge-runtime-isolation.test.mjs
          npx playwright install --with-deps chromium

      - name: Build exact authorized physical-economy pack
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const contract = JSON.parse(await readFile(
            "docs/operations/contracts/beta-seed-downstream-consumer-contract-v1.json",
            "utf8",
          ));
          process.stdout.write(contract.acceptedImplementationSourceSha);
          NODE
          )"
          node scripts/build-physical-economy-runtime-pack.mjs \
            --source-root . \
            --source-commit "$SOURCE_COMMIT" \
            --approved-source-commit "$SOURCE_COMMIT" \
            --output "$PHYSICAL_ECONOMY_PACK"

      - name: Configure disposable local-only function secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend/supabase/functions
          {
            node -e "process.stdout.write('ECONOVARIA_RATE_LIMIT_HMAC_SECRET=' + require('node:crypto').randomBytes(48).toString('base64url') + '\n')"
            node -e "process.stdout.write('ECONOVARIA_WEB_SESSION_ENCRYPTION_KEY=' + require('node:crypto').randomBytes(32).toString('base64url') + '\n')"
            node -e "process.stdout.write('ECONOVARIA_PLAYER_CREDENTIAL_PEPPER=' + require('node:crypto').randomBytes(48).toString('base64url') + '\n')"
            printf '%s\n' 'ECONOVARIA_TRUSTED_CLIENT_IP_HEADER=x-real-ip'
          } > backend/supabase/functions/.env
          chmod 600 backend/supabase/functions/.env

      - name: Start full local Player runtime
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/phase10a4-connected-supabase-startup.log
          : > "$LOG"
          STATUS=1
          EXCLUDED="studio,imgproxy,storage-api,logflare,vector,supavisor,realtime,postgres-meta,mailpit"
          for ATTEMPT in 1 2 3; do
            printf '\n## Supabase Player runtime startup attempt %s\n' "$ATTEMPT" | tee -a "$LOG"
            set +e
            npx supabase start --workdir backend --exclude "$EXCLUDED" 2>&1 \
              | node scripts/redact-econovaria-ci-log.mjs \
              | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            npx supabase stop --workdir backend --no-backup >/dev/null 2>&1 || true
            sleep $((ATTEMPT * 10))
          done
          exit "$STATUS"

      - name: Rebuild database from zero and refresh REST schema
        shell: bash
        run: |
          set -euo pipefail
          npx supabase db reset --workdir backend --local \
            2>&1 | node scripts/redact-econovaria-ci-log.mjs \
            | tee /tmp/phase10a4-connected-database-reset.log

          REST_CONTAINER="$(docker ps --format '{{.Names}}' | grep -E '^supabase_rest_' | head -n 1)"
          test -n "$REST_CONTAINER"
          docker restart "$REST_CONTAINER" >/dev/null

          eval "$(npx supabase status --workdir backend -o env)"
          SERVER_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          test -n "$SERVER_KEY"

          printf '%s\n' \
            '{' \
            '  "p_buckets": [' \
            '    {"dimension":"account","keyHash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"},' \
            '    {"dimension":"device","keyHash":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"},' \
            '    {"dimension":"ip","keyHash":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"}' \
            '  ]' \
            '}' \
            > /tmp/phase10a4-auth-throttle-readiness-request.json

          for ATTEMPT in $(seq 1 60); do
            STATUS="$(curl --silent --show-error \
              --output /tmp/phase10a4-auth-throttle-readiness-response.json \
              --write-out '%{http_code}' \
              --max-time 5 \
              --request POST \
              --header "apikey: ${SERVER_KEY}" \
              --header "Authorization: Bearer ${SERVER_KEY}" \
              --header "Content-Type: application/json" \
              --data-binary @/tmp/phase10a4-auth-throttle-readiness-request.json \
              http://127.0.0.1:54321/rest/v1/rpc/auth_throttle_check_v2 || true)"
            if [ "$STATUS" = "200" ]; then
              exit 0
            fi
            sleep 1
          done

          echo "Authentication throttle RPC was not ready after PostgREST restart." >&2
          node scripts/redact-econovaria-ci-log.mjs \
            /tmp/phase10a4-auth-throttle-readiness-response.json \
            | sed -E 's/[0-9a-f]{64}/[digest-redacted]/gi' >&2 || true
          exit 1

      - name: Provision canonical source content
        shell: bash
        run: |
          set -euo pipefail
          node scripts/game-creation-provisioning-local-acceptance.mjs 2>&1 \
            | node scripts/redact-econovaria-ci-log.mjs \
            | tee /tmp/phase10a4-connected-source-provisioning.log

      - name: Start same-origin Player gateway
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/econovaria-local-gateway.py \
            --local-supabase \
            --port 4173 \
            > /tmp/phase10a4-connected-gateway-raw.log 2>&1 &
          GATEWAY_PID=$!
          echo "$GATEWAY_PID" > /tmp/phase10a4-connected-gateway.pid
          STATIC_READY=false
          for ATTEMPT in $(seq 1 30); do
            if ! kill -0 "$GATEWAY_PID" 2>/dev/null; then
              break
            fi
            STATIC_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 \
              http://127.0.0.1:4173/ || true)"
            if [ "$STATIC_STATUS" = "200" ]; then
              STATIC_READY=true
              break
            fi
            sleep 1
          done
          if [ "$STATIC_READY" != "true" ]; then
            node scripts/redact-econovaria-ci-log.mjs \
              /tmp/phase10a4-connected-gateway-raw.log >&2 || true
            echo "The local Player gateway did not become ready." >&2
            exit 1
          fi

          node --input-type=module --eval \
            'import { restartLocalEdgeRuntime } from "./scripts/local-edge-runtime-isolation.mjs"; await restartLocalEdgeRuntime();'

      - name: Execute connected two-browser Player Store journey
        id: connected_store
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/business-phase10-player-store-browser-acceptance.mjs 2>&1 \
            | node scripts/redact-econovaria-ci-log.mjs \
            | sed -E 's#P10A4-G[12]-(BUYER|SELLER)-ACCESS-[0-9]+#[credential-redacted]#g; s#PHASE10A4-G[12]-(BUYER|SELLER)#[player-identifier-redacted]#g; s#PLAYER-PHASE10A4-LICENSE-001#[license-redacted]#g; s#Phase10A4-Player-Admin-2026!#[password-redacted]#g' \
            | tee /tmp/phase10a4-connected-browser.log

      - name: Capture sanitized connected-runtime diagnostics
        if: always() && (failure() || steps.connected_store.outcome != 'success')
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/phase10a4-connected-sanitized
          {
            echo "== aggregate database counts =="
            psql "$DATABASE_URL" -X -qAt -c "select jsonb_build_object('games', (select count(*) from public.game_sessions), 'players', (select count(*) from public.players), 'receipts', (select count(*) from public.store_offer_purchase_receipts))::text;"
            echo "== local runtime container summary =="
            docker ps -a --format '{{.Names}} status={{.Status}}' \
              | grep -E '^supabase_(edge_runtime|auth|rest|kong)_[A-Za-z0-9_.-]+[[:space:]]' || true
            echo "== exact Edge and Kong state =="
            for CONTAINER in $(docker ps -a --format '{{.Names}}' \
              | grep -E '^supabase_(edge_runtime|kong)_[A-Za-z0-9_.-]+$' || true); do
              docker inspect \
                --format 'name={{.Name}} state={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} oomKilled={{.State.OOMKilled}} restartCount={{.RestartCount}}' \
                "$CONTAINER"
            done
            echo "== capped local runtime logs =="
            for CONTAINER in $(docker ps -a --format '{{.Names}}' \
              | grep -E '^supabase_(edge_runtime|auth|rest|kong)_[A-Za-z0-9_.-]+$' || true); do
              echo "-- local component --"
              docker logs --since 20m --tail 900 "$CONTAINER" 2>&1
            done
          } | node scripts/redact-econovaria-ci-log.mjs \
            | sed -E \
            's#ECO-[A-Z]{3,12}-[A-Z]{3,12}-[0-9]{3}#[game-code-redacted]#g; s#(BROWSER|PHASE10A4)-(PLAYER|ALPHA|BETA|ACCESS)-[A-Z0-9-]+#[credential-redacted]#g; s#P10A4-G[12]-(BUYER|SELLER)-ACCESS-[0-9]+#[credential-redacted]#g; s#PHASE10A4-G[12]-(BUYER|SELLER)#[player-identifier-redacted]#g; s#PLAYER-PHASE10A4-LICENSE-001#[license-redacted]#g; s#Phase10A4-Player-Admin-2026!#[password-redacted]#g' \
            > /tmp/phase10a4-connected-sanitized/runtime-diagnostics.log
          cat /tmp/phase10a4-connected-sanitized/runtime-diagnostics.log
          exit 0

      - name: Sanitize support logs and verify evidence privacy
        id: evidence_privacy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase10a4-connected-sanitized
          for SOURCE in \
            /tmp/phase10a4-connected-supabase-startup.log \
            /tmp/phase10a4-connected-database-reset.log \
            /tmp/phase10a4-connected-source-provisioning.log \
            /tmp/phase10a4-connected-gateway-raw.log \
            /tmp/phase10a4-connected-browser.log; do
            if [ -f "$SOURCE" ]; then
              BASENAME="$(basename "$SOURCE" .log)"
              node scripts/redact-econovaria-ci-log.mjs "$SOURCE" \
                | sed -E \
                's#ECO-[A-Z]{3,12}-[A-Z]{3,12}-[0-9]{3}#[game-code-redacted]#g; s#(BROWSER|PHASE10A4)-(PLAYER|ALPHA|BETA|ACCESS)-[A-Z0-9-]+#[credential-redacted]#g; s#P10A4-G[12]-(BUYER|SELLER)-ACCESS-[0-9]+#[credential-redacted]#g; s#PHASE10A4-G[12]-(BUYER|SELLER)#[player-identifier-redacted]#g; s#PLAYER-PHASE10A4-LICENSE-001#[license-redacted]#g; s#Phase10A4-Player-Admin-2026!#[password-redacted]#g' \
                > "/tmp/phase10a4-connected-sanitized/${BASENAME}.log"
            fi
          done

          SCAN_PATHS=(/tmp/phase10a4-connected-sanitized)
          if [ -d "$ECONOVARIA_PLAYER_STORE_OUTPUT_DIR" ]; then
            SCAN_PATHS+=("$ECONOVARIA_PLAYER_STORE_OUTPUT_DIR")
          fi
          if grep -aErqi \
            -e 'postgres(ql)?://[^[:space:]]+' \
            -e 'postgres:postgres' \
            -e '"?(SUPABASE[ _-]?[A-Z0-9_]*(SECRET|KEY|TOKEN|PASSWORD)|DATABASE[ _-]?URL|DB[ _-]?URL|PGPASSWORD|DB[ _-]?PASSWORD|POSTGRES[ _-]?PASSWORD|JWT[ _-]?SECRET|(ANON|SERVICE[ _-]?ROLE|SECRET|PUBLISHABLE)[ _-]?KEY|S3[ _-]?(ACCESS|SECRET)[ _-]?KEY|S3_[A-Z0-9_]+|ECONOVARIA_[A-Z0-9_]*(SECRET|KEY|TOKEN|PASSWORD|PEPPER)|AUTHORIZATION|APIKEY|API[ _-]?KEY|COOKIE|SET[ _-]?COOKIE|X[ _-]?PLAYER[ _-]?SESSION[ _-]?TOKEN|X[ _-]?ECONOVARIA[ _-]?(CSRF|PLAYER[ _-]?SESSION)[ _-]?TOKEN)"?[[:space:]]*(=|:|\||│)[[:space:]]*[^[:space:]|│]+' \
            -e '[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}' \
            -e 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' \
            -e 'sb_(secret|publishable)_[A-Za-z0-9_-]+' \
            -e '"?[A-Z][A-Z0-9_]*_HASH"?[[:space:]]*(=|:|[|│]|%3D)[[:space:]]*(eq\.|eq%2E)?("[^"]*"|[^&[:space:]|│"]+)' \
            -e '"?authorization"?[[:space:]]*:[[:space:]]*"?bearer[[:space:]]+[^[:space:]"]+' \
            -e '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----' \
            -e 'PLAYER-PHASE10A4-LICENSE-001' \
            -e 'Phase10A4-Player-Admin-2026!' \
            -e 'P10A4-G[12]-(BUYER|SELLER)-ACCESS-[0-9]+' \
            -e 'PHASE10A4-G[12]-(BUYER|SELLER)' \
            "${SCAN_PATHS[@]}"; then
            echo "Connected Player Store artifacts contain a forbidden private identifier or credential." >&2
            exit 1
          fi

      - name: Upload only sanitized connected evidence and logs
        if: always() && steps.evidence_privacy.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase10a4-connected-player-store-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/econovaria-phase10a4-player-store-evidence/
            /tmp/phase10a4-connected-sanitized/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce connected Player Store result
        if: always()
        shell: bash
        run: test "${{ steps.connected_store.outcome }}" = "success"

      - name: Stop local Player runtime
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/phase10a4-connected-gateway.pid ]; then
            kill "$(cat /tmp/phase10a4-connected-gateway.pid)" 2>/dev/null || true
          fi
          rm -f backend/supabase/functions/.env
          npx supabase stop --workdir backend --no-backup 2>&1 \
            | node scripts/redact-econovaria-ci-log.mjs || true
