name: License Issuance Queue Staging Release

on:
  pull_request:
    paths:
      - "backend/supabase/functions/_shared/licenseCode.ts"
      - "backend/supabase/functions/_shared/stripeLicense.ts"
      - "backend/supabase/functions/license-*/**"
      - "backend/supabase/functions/stripe-*/**"
      - "backend/supabase/migrations/20260813090000_add_durable_license_issuance_queue_v1.sql"
      - "backend/supabase/migrations/20260813091500_harden_license_email_idempotency_window_v1.sql"
      - "backend/supabase/migrations/20260813093000_add_license_issuance_scheduler_safety_switch_v1.sql"
      - "backend/supabase/migrations/20260813100000_harden_license_fulfillment_snapshots_v1.sql"
      - "backend/supabase/migrations/20260813103000_add_license_email_outbox_schema_v1.sql"
      - "backend/supabase/migrations/20260813103100_add_atomic_license_materialization_outbox_v2.sql"
      - "backend/supabase/migrations/20260813103200_add_durable_license_email_worker_queue_v1.sql"
      - "backend/supabase/migrations/20260813103300_add_license_delivery_operations_v1.sql"
      - "backend/supabase/edge-function-manifest.json"
      - "scripts/license-*.test.mjs"
      - "scripts/stripe-license-adapter-contract.test.mjs"
      - "scripts/validate-supabase-migrations.mjs"
      - "docs/architecture/license-*.md"
      - "docs/architecture/stripe-license-adapter-v1.md"
      - ".github/workflows/license-issuance-queue-staging.yml"
  push:
    branches:
      - main
    paths:
      - "backend/supabase/functions/_shared/licenseCode.ts"
      - "backend/supabase/functions/_shared/stripeLicense.ts"
      - "backend/supabase/functions/license-*/**"
      - "backend/supabase/functions/stripe-*/**"
      - "backend/supabase/migrations/20260813090000_add_durable_license_issuance_queue_v1.sql"
      - "backend/supabase/migrations/20260813091500_harden_license_email_idempotency_window_v1.sql"
      - "backend/supabase/migrations/20260813093000_add_license_issuance_scheduler_safety_switch_v1.sql"
      - "backend/supabase/migrations/20260813100000_harden_license_fulfillment_snapshots_v1.sql"
      - "backend/supabase/migrations/20260813103000_add_license_email_outbox_schema_v1.sql"
      - "backend/supabase/migrations/20260813103100_add_atomic_license_materialization_outbox_v2.sql"
      - "backend/supabase/migrations/20260813103200_add_durable_license_email_worker_queue_v1.sql"
      - "backend/supabase/migrations/20260813103300_add_license_delivery_operations_v1.sql"
      - "backend/supabase/edge-function-manifest.json"
      - "scripts/license-*.test.mjs"
      - "scripts/stripe-license-adapter-contract.test.mjs"
      - "scripts/validate-supabase-migrations.mjs"
      - "docs/architecture/license-*.md"
      - "docs/architecture/stripe-license-adapter-v1.md"
      - ".github/workflows/license-issuance-queue-staging.yml"
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: "Deploy the reviewed Stripe and licensing functions to staging"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "Type DEPLOY LICENSE ISSUANCE TO STAGING"
        required: true
        default: ""
        type: string
      enable_scheduler:
        description: "Enable both one-minute staging workers after delivery configuration is verified"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: license-issuance-queue-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  contract:
    name: Verify durable Stripe licensing contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"

      - name: Run licensing contracts and migration validator
        run: |
          node --experimental-strip-types --test \
            scripts/license-issuance-queue-contract.test.mjs \
            scripts/license-issuance-hardening-contract.test.mjs \
            scripts/license-email-outbox-contract.test.mjs \
            scripts/stripe-license-adapter-contract.test.mjs
          node scripts/validate-supabase-migrations.mjs

  staging:
    name: Deploy isolated staging Stripe licensing queue
    needs: contract
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_staging == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Check out exact requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"

      - name: Enforce explicit staging boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$DEPLOY_CONFIRMATION" = "DEPLOY LICENSE ISSUANCE TO STAGING"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test "$STAGING_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/feat/license-issuance-queue-v1|refs/heads/fix/license-issuance-queue-hardening-v1) ;;
            *) echo "Unapproved staging source ref: $GITHUB_REF" >&2; exit 1 ;;
          esac
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Re-run licensing contracts
        run: |
          node --experimental-strip-types --test \
            scripts/license-issuance-queue-contract.test.mjs \
            scripts/license-issuance-hardening-contract.test.mjs \
            scripts/license-email-outbox-contract.test.mjs \
            scripts/stripe-license-adapter-contract.test.mjs

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify reviewed schema and capture pre-deploy evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"
          rpc() {
            local name="$1"
            local output="$2"
            curl --fail --silent --show-error \
              --request POST \
              "https://${STAGING_PROJECT_REF}.supabase.co/rest/v1/rpc/${name}" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header 'content-type: application/json' \
              --data '{}' > "$output"
            test -s "$output"
          }
          rpc read_license_issuance_queue_health_v1 \
            "$RUNNER_TEMP/license-queue-health.json"
          rpc read_license_issuance_secret_rotation_guard_v1 \
            "$RUNNER_TEMP/license-secret-rotation-guard.json"
          rpc read_license_fulfillment_reconciliation_v1 \
            "$RUNNER_TEMP/license-reconciliation.json"

      - name: Disable both workers before deployment
        shell: bash
        run: |
          set -euo pipefail
          for rpc_name in \
            disable_license_issuance_scheduler_v1 \
            disable_license_email_scheduler_v1
          do
            curl --fail --silent --show-error \
              --request POST \
              "https://${STAGING_PROJECT_REF}.supabase.co/rest/v1/rpc/${rpc_name}" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header 'content-type: application/json' \
              --data '{}' > "$RUNNER_TEMP/${rpc_name}.json"
            test -s "$RUNNER_TEMP/${rpc_name}.json"
          done

      - name: Deploy custom-auth staging functions
        shell: bash
        run: |
          set -euo pipefail
          for slug in \
            license-payment-webhook \
            stripe-checkout-session \
            stripe-license-webhook \
            license-issuance-worker \
            license-email-worker
          do
            supabase functions deploy "$slug" \
              --workdir backend \
              --project-ref "$STAGING_PROJECT_REF" \
              --no-verify-jwt
          done

      - name: Configure Vault-authenticated queue schedulers
        if: github.event_name == 'workflow_dispatch' && inputs.enable_scheduler == true
        shell: bash
        run: |
          set -euo pipefail
          configure_scheduler() {
            local rpc_name="$1"
            local function_slug="$2"
            local output="$3"
            local function_url="https://${STAGING_PROJECT_REF}.supabase.co/functions/v1/${function_slug}"
            curl --fail --silent --show-error \
              --request POST \
              "https://${STAGING_PROJECT_REF}.supabase.co/rest/v1/rpc/${rpc_name}" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header 'content-type: application/json' \
              --data "{\"p_function_url\":\"${function_url}\"}" > "$output"
            test -s "$output"
          }
          configure_scheduler \
            configure_license_issuance_scheduler_v1 \
            license-issuance-worker \
            "$RUNNER_TEMP/license-issuance-scheduler-enabled.json"
          configure_scheduler \
            configure_license_email_scheduler_v1 \
            license-email-worker \
            "$RUNNER_TMP/license-email-scheduler-enabled.json"

      - name: Verify unauthenticated requests fail closed
        shell: bash
        run: |
          set -euo pipefail
          request_status() {
            curl --silent --show-error \
              --request POST \
              --output /dev/null \
              --write-out '%{http_code}' \
              "https://${STAGING_PROJECT_REF}.supabase.co/functions/v1/$1" \
              --header 'content-type: application/json' \
              --data '{}'
          }
          internal_webhook_status="$(request_status license-payment-webhook)"
          stripe_checkout_status="$(request_status stripe-checkout-session)"
          stripe_webhook_status="$(request_status stripe-license-webhook)"
          issuance_status="$(request_status license-issuance-worker)"
          email_status="$(request_status license-email-worker)"
          case "$internal_webhook_status" in
            401|503) ;;
            *) echo "Unexpected unsigned internal webhook status: $internal_webhook_status" >&2; exit 1 ;;
          esac
          case "$stripe_checkout_status" in
            403|503) ;;
            *) echo "Unexpected unsigned Stripe checkout status: $stripe_checkout_status" >&2; exit 1 ;;
          esac
          case "$stripe_webhook_status" in
            401|503) ;;
            *) echo "Unexpected unsigned Stripe webhook status: $stripe_webhook_status" >&2; exit 1 ;;
          esac
          test "$issuance_status" = "401"
          test "$email_status" = "401"

      - name: Upload staging evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stripe-license-staging-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/license-queue-health.json
            ${{ runner.temp }}/license-secret-rotation-guard.json
            ${{ runner.temp }}/license-reconciliation.json
            ${{ runner.temp }}/disable_license_issuance_scheduler_v1.json
            ${{ runner.temp }}/disable_license_email_scheduler_v1.json
            ${{ runner.temp }}/license-issuance-scheduler-enabled.json
            ${{ runner.temp }}/license-email-scheduler-enabled.json

  production-hold:
    name: Enforce production payment-provider hold
    needs: contract
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Keep production deployment disabled
        run: |
          echo "Stripe licensing remains staging-only until live account verification, commercial prices, reversal policy, tax review, and production secrets are approved."
