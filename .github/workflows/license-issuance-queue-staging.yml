name: Apply Verified Stripe License Adapter Source Bundle

on:
  push:
    branches:
      - fix/license-issuance-queue-hardening-v1

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: stripe-license-adapter-source-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    name: Verify and publish Stripe adapter sources
    if: >-
      github.repository == 'kohnerbouchard-star/Student-Profile' &&
      github.ref == 'refs/heads/fix/license-issuance-queue-hardening-v1' &&
      github.actor == 'kohnerbouchard-star' &&
      github.event.head_commit.message == 'chore(payments): stage verified Stripe adapter source bundle'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Fetch and verify source bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA256: c3e61ffef7d2418e419d4a41f72a24fc3c21649e046c955ee26b5c7252cf585e
          EXPECTED_AUTHOR: kohnerbouchard-star
          PR_NUMBER: "593"
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            > "$RUNNER_TEMP/stripe-bundle-comments.json"

          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import re

          comments = json.loads(
              (pathlib.Path(os.environ["RUNNER_TEMP"]) / "stripe-bundle-comments.json").read_text()
          )
          expected_sha = os.environ["EXPECTED_SHA256"]
          expected_author = os.environ["EXPECTED_AUTHOR"]
          pattern = re.compile(
              r"^<!-- ECONOVARIA_STRIPE_BUNDLE_V1 part=(\d+) total=(\d+) "
              r"sha256=([0-9a-f]{64}) -->\n([A-Za-z0-9+/=]+)$"
          )
          parts = {}
          comment_ids = []
          total = None

          for comment in comments:
              if comment.get("user", {}).get("login") != expected_author:
                  continue
              match = pattern.fullmatch(comment.get("body") or "")
              if not match or match.group(3) != expected_sha:
                  continue
              part = int(match.group(1))
              declared_total = int(match.group(2))
              if total is None:
                  total = declared_total
              if total != declared_total or part in parts:
                  raise SystemExit("duplicate or inconsistent Stripe source-bundle part")
              parts[part] = match.group(4)
              comment_ids.append(str(comment["id"]))

          expected_parts = [1, 2, 3, 4]
          if total != 4 or sorted(parts) != expected_parts:
              raise SystemExit(
                  f"missing Stripe source-bundle parts: total={total}, parts={sorted(parts)}"
              )

          raw = base64.b64decode(
              "".join(parts[index] for index in expected_parts),
              validate=True,
          )
          actual_sha = hashlib.sha256(raw).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f"Stripe source-bundle digest mismatch: {actual_sha}")

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          (temp / "stripe-license-adapter.tar.gz").write_bytes(raw)
          (temp / "stripe-bundle-comment-ids.txt").write_text(
              "\n".join(comment_ids) + "\n"
          )
          PY

      - name: Enforce exact safe bundle file set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import tarfile

          expected = {
              "backend/supabase/edge-function-manifest.json",
              "backend/supabase/functions/_shared/stripeLicense.ts",
              "backend/supabase/functions/stripe-checkout-session/index.ts",
              "backend/supabase/functions/stripe-license-webhook/index.ts",
              "docs/architecture/stripe-license-adapter-v1.md",
              "scripts/stripe-license-adapter-contract.test.mjs",
          }
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "stripe-license-adapter.tar.gz"
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              names = {member.name for member in members}
              if names != expected:
                  raise SystemExit(f"unexpected Stripe bundle members: {sorted(names ^ expected)}")
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if (
                      not member.isfile()
                      or member.issym()
                      or member.islnk()
                      or path.is_absolute()
                      or ".." in path.parts
                  ):
                      raise SystemExit(f"unsafe Stripe bundle member: {member.name}")
          PY

      - name: Apply sources and run focused contracts
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/stripe-license-adapter.tar.gz" -C .
          node --experimental-strip-types --check \
            backend/supabase/functions/_shared/stripeLicense.ts
          node --experimental-strip-types --check \
            backend/supabase/functions/stripe-checkout-session/index.ts
          node --experimental-strip-types --check \
            backend/supabase/functions/stripe-license-webhook/index.ts
          node --experimental-strip-types --test \
            scripts/stripe-license-adapter-contract.test.mjs \
            scripts/license-issuance-queue-contract.test.mjs \
            scripts/license-issuance-hardening-contract.test.mjs \
            scripts/license-email-outbox-contract.test.mjs
          node scripts/validate-supabase-migrations.mjs

      - name: Commit exact approved source paths
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            backend/supabase/edge-function-manifest.json
            backend/supabase/functions/_shared/stripeLicense.ts
            backend/supabase/functions/stripe-checkout-session/index.ts
            backend/supabase/functions/stripe-license-webhook/index.ts
            docs/architecture/stripe-license-adapter-v1.md
            scripts/stripe-license-adapter-contract.test.mjs
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(payments): add Stripe USD and KRW license adapter"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Remove consumed source-bundle comments
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r comment_id; do
            test -n "$comment_id" || continue
            curl --silent --show-error \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              >/dev/null || true
          done < "$RUNNER_TEMP/stripe-bundle-comment-ids.txt"
