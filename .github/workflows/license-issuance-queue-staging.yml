name: Apply Verified License Outbox Source Bundle

on:
  push:
    branches:
      - fix/license-issuance-queue-hardening-v1

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: license-outbox-source-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    name: Verify and apply one-use source bundle
    if: >-
      github.repository == 'kohnerbouchard-star/Student-Profile' &&
      github.ref == 'refs/heads/fix/license-issuance-queue-hardening-v1' &&
      github.actor == 'kohnerbouchard-star'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Fetch and verify bundle comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA256: 1bbd79fa62a87bf0fc68dd82ca6121bcb74bf9adda58bc0f2612f6f20ed85fe8
          EXPECTED_AUTHOR: kohnerbouchard-star
          PR_NUMBER: "593"
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            > "$RUNNER_TEMP/license-bundle-comments.json"

          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import re

          comments_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "license-bundle-comments.json"
          comments = json.loads(comments_path.read_text())
          expected_sha = os.environ["EXPECTED_SHA256"]
          expected_author = os.environ["EXPECTED_AUTHOR"]
          pattern = re.compile(
              r"^<!-- ECONOVARIA_LICENSE_BUNDLE_V1 part=(\d+) total=(\d+) "
              r"sha256=([0-9a-f]{64}) -->\n([A-Za-z0-9+/=]+)$"
          )
          parts = {}
          comment_ids = []
          total = None

          for comment in comments:
              if comment.get("user", {}).get("login") != expected_author:
                  continue
              match = pattern.fullmatch(comment.get("body") or "")
              if not match or match.group(3) != expected_sha:
                  continue
              part = int(match.group(1))
              declared_total = int(match.group(2))
              if total is None:
                  total = declared_total
              if total != declared_total or part in parts:
                  raise SystemExit("duplicate or inconsistent source-bundle part")
              parts[part] = match.group(4)
              comment_ids.append(str(comment["id"]))

          if total != 3 or sorted(parts) != [1, 2, 3]:
              raise SystemExit(f"missing source-bundle parts: total={total}, parts={sorted(parts)}")

          encoded = "".join(parts[index] for index in range(1, total + 1))
          raw = base64.b64decode(encoded, validate=True)
          actual_sha = hashlib.sha256(raw).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f"source-bundle digest mismatch: {actual_sha}")

          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "license-outbox-bundle.tar.gz").write_bytes(raw)
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "license-bundle-comment-ids.txt").write_text("\n".join(comment_ids) + "\n")
          PY

      - name: Enforce exact bundle file set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import tarfile

          expected = {
              ".github/workflows/license-issuance-queue-staging.yml",
              "backend/supabase/edge-function-manifest.json",
              "backend/supabase/functions/_shared/licenseCode.ts",
              "backend/supabase/functions/license-email-worker/index.ts",
              "backend/supabase/functions/license-issuance-worker/index.ts",
              "backend/supabase/functions/license-issuance-worker/licenseCode.ts",
              "backend/supabase/migrations/20260813103000_add_license_email_outbox_schema_v1.sql",
              "backend/supabase/migrations/20260813103100_add_atomic_license_materialization_outbox_v2.sql",
              "backend/supabase/migrations/20260813103200_add_durable_license_email_worker_queue_v1.sql",
              "backend/supabase/migrations/20260813103300_add_license_delivery_operations_v1.sql",
              "docs/architecture/license-email-outbox-v1.md",
              "scripts/license-email-outbox-contract.test.mjs",
              "scripts/license-issuance-queue-contract.test.mjs",
          }
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "license-outbox-bundle.tar.gz"
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              names = {member.name for member in members}
              if names != expected:
                  raise SystemExit(f"unexpected bundle members: {sorted(names ^ expected)}")
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if member.issym() or member.islnk() or path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe bundle member: {member.name}")
          PY

      - name: Apply source and run focused contracts
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/license-outbox-bundle.tar.gz" -C .
          node --experimental-strip-types --check \
            backend/supabase/functions/license-issuance-worker/index.ts
          node --experimental-strip-types --check \
            backend/supabase/functions/license-email-worker/index.ts
          node --experimental-strip-types --test \
            scripts/license-email-outbox-contract.test.mjs \
            scripts/license-issuance-queue-contract.test.mjs
          node scripts/validate-supabase-migrations.mjs

      - name: Commit exact approved source paths
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            .github/workflows/license-issuance-queue-staging.yml
            backend/supabase/edge-function-manifest.json
            backend/supabase/functions/_shared/licenseCode.ts
            backend/supabase/functions/license-email-worker/index.ts
            backend/supabase/functions/license-issuance-worker/index.ts
            backend/supabase/functions/license-issuance-worker/licenseCode.ts
            backend/supabase/migrations/20260813103000_add_license_email_outbox_schema_v1.sql
            backend/supabase/migrations/20260813103100_add_atomic_license_materialization_outbox_v2.sql
            backend/supabase/migrations/20260813103200_add_durable_license_email_worker_queue_v1.sql
            backend/supabase/migrations/20260813103300_add_license_delivery_operations_v1.sql
            docs/architecture/license-email-outbox-v1.md
            scripts/license-email-outbox-contract.test.mjs
            scripts/license-issuance-queue-contract.test.mjs
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(licensing): add durable transactional email outbox"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Remove consumed source-bundle comments
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r comment_id; do
            test -n "$comment_id" || continue
            curl --silent --show-error \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              >/dev/null || true
          done < "$RUNNER_TEMP/license-bundle-comment-ids.txt"
