name: Temporary Phase 3B PR Certification

on:
  pull_request:
    branches:
      - refactor/business-ux-mechanics-v1
    paths:
      - ".github/workflows/temporary-phase3b-ci-repair.yml"
      - ".github/workflows/temporary-phase3b-pr-certify.yml"

permissions:
  contents: write

concurrency:
  group: temporary-phase3b-settlement-hardening
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/business-store-procurement-v2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Execute canonical Phase 3B certification sequence
        shell: bash
        run: |
          ruby -ryaml <<'RUBY'
          workflow_path = ".github/workflows/temporary-phase3b-ci-repair.yml"
          workflow = YAML.load_file(workflow_path)
          steps = workflow.fetch("jobs").fetch("harden").fetch("steps")
          start = steps.index { |step| step["name"] == "Apply bounded Phase 3B hardening" }
          abort("Phase 3B hardening step was not found.") unless start

          output = [
            "#!/usr/bin/env bash",
            "set -euo pipefail",
          ]

          steps[start..].each do |step|
            script = step["run"]
            next unless script
            name = step.fetch("name", "unnamed run step")
            directory = step["working-directory"]
            output << "echo '::group::#{name.gsub("'", "'\\''")}'"
            output << "pushd #{directory.shellescape} >/dev/null" if directory
            output << script
            output << "popd >/dev/null" if directory
            if name == "Apply bounded Phase 3B hardening"
              output << "rm -f .github/workflows/temporary-phase3b-pr-certify.yml"
            end
            if name == "Commit and push verified Phase 3B hardening"
              output.insert(-2, "git add -- .github/workflows/temporary-phase3b-pr-certify.yml")
            end
            output << "echo '::endgroup::'"
          end

          File.write("/tmp/phase3b-certify.sh", output.join("\n") + "\n")
          RUBY

          # Ruby's shell escaping helper is kept outside the generated repository tree.
          ruby -r shellwords -ryaml <<'RUBY'
          path = "/tmp/phase3b-certify.sh"
          source = File.read(path)
          # The first extraction pass only needs Shellwords when a step has a working directory.
          # Current certification has one such step; regenerate safely with the helper loaded.
          workflow = YAML.load_file(".github/workflows/temporary-phase3b-ci-repair.yml")
          steps = workflow.fetch("jobs").fetch("harden").fetch("steps")
          start = steps.index { |step| step["name"] == "Apply bounded Phase 3B hardening" }
          abort("Phase 3B hardening step was not found.") unless start
          output = ["#!/usr/bin/env bash", "set -euo pipefail"]
          steps[start..].each do |step|
            script = step["run"]
            next unless script
            name = step.fetch("name", "unnamed run step")
            directory = step["working-directory"]
            output << "echo '::group::#{name.gsub("'", "'\\''")}'"
            output << "pushd #{Shellwords.escape(directory)} >/dev/null" if directory
            if name == "Commit and push verified Phase 3B hardening"
              output << "git add -- .github/workflows/temporary-phase3b-pr-certify.yml"
            end
            output << script
            output << "popd >/dev/null" if directory
            if name == "Apply bounded Phase 3B hardening"
              output << "rm -f .github/workflows/temporary-phase3b-pr-certify.yml"
            end
            output << "echo '::endgroup::'"
          end
          File.write(path, output.join("\n") + "\n")
          RUBY

          bash -n /tmp/phase3b-certify.sh
          bash /tmp/phase3b-certify.sh
