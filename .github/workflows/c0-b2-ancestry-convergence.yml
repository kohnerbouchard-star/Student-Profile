name: C0 B2 ancestry convergence

on:
  push:
    branches:
      - feat/multicurrency-funding-core-v1
    paths:
      - .github/workflows/c0-b2-ancestry-convergence.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact C0 convergence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Guard source and repaired B2 parent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/multicurrency-funding-core-v1"
          test "$(git rev-parse HEAD^)" = "3c73f0bdc89d1128aaafce14bc40f4c5199dc1c2"
          git fetch origin feat/banking-fx-clearing-v1
          test "$(git rev-parse origin/feat/banking-fx-clearing-v1)" = "029ea568adc722f0b7c1cd57a02c49f88ceaf716"

      - name: Merge repaired B2 ancestry and validate combined workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git merge --no-commit --no-ff origin/feat/banking-fx-clearing-v1
          test -z "$(git diff --name-only --diff-filter=U)"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/banking-fx-clearing-v1.yml')
          text = path.read_text()
          dollar = chr(36)

          required = [
              'docs/operations/contracts/player-cross-cutting/pr-673.json',
              'docs/roadmaps/multicurrency-funding-core-scope-v1.md',
              'Verify Banking FX database acceptance',
              'Verify Banking FX Chromium acceptance',
              'AUTHORITY_PR_NUMBER: ' + dollar + '{{ github.event.pull_request.number || 672 }}',
              "AUTHORITY_BASE_REF: " + dollar + "{{ github.event.pull_request.base.ref || 'feat/canonical-fx-authority-v1' }}",
              'origin/' + dollar + '{AUTHORITY_BASE_REF}...HEAD',
              '--pr-number "' + dollar + '{AUTHORITY_PR_NUMBER}"',
              '--base-ref "' + dollar + '{AUTHORITY_BASE_REF}"',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit('Merged B2 workflow missing required C0/B2 tokens: ' + repr(missing))

          if 'finalize-certified-candidate' in text or 'contents: write' in text:
              raise SystemExit('Permanent B2 workflow regained mutation authority')
          PY

          git diff --check
          git diff --cached --check

      - name: Commit two-parent convergence
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "chore(funding): converge repaired B2 parent"
          PARENT_COUNT="$(git cat-file -p HEAD | grep -c '^parent ')"
          test "$PARENT_COUNT" = "2"
          git push origin HEAD:feat/multicurrency-funding-core-v1
