name: Econovaria Staging Suffix Apply

on:
  workflow_dispatch:
    inputs:
      verify_authorized:
        type: boolean
        default: false
        required: true
        description: Approve verification of staging evidence
      apply_authorized:
        type: boolean
        default: false
        required: true
        description: Request an apply after all staging gates pass
      source_sha:
        required: true
        description: Exact current main release SHA
      replay_run:
        required: true
        description: Exact main push Database Replay run ID
      rehearsal_run:
        required: true
        description: Protected staging rehearsal run ID
      rehearsal_artifact:
        required: true
        description: Bounded diagnostics artifact ID from that rehearsal
      recovery_run:
        required: true
        description: Protected staging recovery receipt producer run ID
      recovery_artifact:
        required: true
        description: Recovery artifact ID from that producer
      recovery_artifact_digest:
        required: true
        description: Pinned recovery ZIP digest in sha256:<hex> form

permissions:
  contents: read
  actions: read

concurrency:
  group: econovaria-staging-suffix-apply
  cancel-in-progress: false

jobs:
  apply-staging:
    if: github.repository == 'kohnerbouchard-star/Student-Profile' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.verify_authorized == true
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
      - name: Verify exact recovery, qualification and live writer authority
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/operations/staging-suffix-apply/manual.mjs verify
      - name: Apply exact suffix and leave staging held
        if: steps.evidence.outputs.apply_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/operations/staging-suffix-apply/manual.mjs apply
