        run: npm --prefix backend run test:player-progression

      - name: Enforce architecture ratchet
        run: node scripts/architecture/architecture-ratchet-v2.mjs

      - name: Commit and push bounded finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "econovaria-phase3b-finalizer"
          git config user.email "actions@users.noreply.github.com"
          git fetch --no-tags origin refactor/business-ux-mechanics-v1

          approved=(
