      - name: Verify Business authority contracts
        shell: bash
        run: |
          node scripts/business-formation-authority-contract.mjs
          node scripts/business-economy-authority-contract.mjs
          node scripts/business-domain-boundary-contract.mjs
          node scripts/business-recipe-access-contract.mjs
          node scripts/business-stockroom-authority-contract.mjs
          node scripts/business-store-procurement-authority-contract.mjs

      - name: Verify Business route and procurement contracts
        shell: bash
        run: |
          deno test \
            --config backend/supabase/functions/classroom-api/deno.json \
            --lock=backend/supabase/functions/deno.lock \
            --frozen \
            backend/src/domains/business/api/playerBusinessRoutePaths.test.ts \
            backend/src/domains/business/api/playerBusinessStoreProcurement.test.ts

      - name: Verify backend type surfaces
        run: npm --prefix backend run typecheck:all

