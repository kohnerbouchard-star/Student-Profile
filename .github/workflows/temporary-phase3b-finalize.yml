name: Temporary Phase 3B Finalization

on:
  push:
    branches:
      - feat/business-store-procurement-v2
    paths:
      - ".github/workflows/temporary-phase3b-finalize.yml"

permissions:
  contents: write

concurrency:
  group: temporary-phase3b-finalization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/business-store-procurement-v2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Materialize reviewed Phase 3B settlement hardening
        shell: bash
        run: |
          ruby -rshellwords -ryaml <<'RUBY'
          workflow = YAML.load_file(".github/workflows/temporary-phase3b-ci-repair.yml")
          steps = workflow.fetch("jobs").fetch("harden").fetch("steps")
          step = steps.find { |candidate| candidate["name"] == "Apply bounded Phase 3B hardening" }
          abort("Phase 3B hardening step was not found.") unless step
          File.write(
            "/tmp/phase3b-hardening.sh",
            "#!/usr/bin/env bash\nset -euo pipefail\n" + step.fetch("run") + "\n",
          )
          RUBY
          bash -n /tmp/phase3b-hardening.sh
          bash /tmp/phase3b-hardening.sh

      - name: Restore bounded Business architecture and PR-scoped authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import shutil

          handler = r'''/// <reference lib="dom" />

import {
  EdgeActivationError,
  jsonError,
  jsonResponse,
} from "../../../platform/supabase/edgeResponse.ts";
import {
  type EdgeSupabaseClient,
  readSupabaseEnv,
  type SupabaseEnv,
} from "../../../platform/supabase/edgeStaffSession.ts";
import {
  PlayerBusinessError,
  type PlayerBusinessRepository,
  type PlayerBusinessRoute,
} from "../contracts/playerBusinessContracts.ts";
import {
  readBusinessRecipes,
  readBusinessStockroom,
} from "../infrastructure/supabaseBusinessStockroomReadRepository.ts";
import { SupabasePlayerBusinessRepository } from "../infrastructure/supabasePlayerBusinessRepository.ts";
import { executePlayerBusinessMutation } from "./playerBusinessMutationExecutor.ts";
import {
  readBusinessRequestBody,
  validateBusinessRequestEnvelope,
  validateBusinessRequestMethodAndFields,
} from "./playerBusinessRequestValidation.ts";
import {
  createBusinessStoreQuote,
  purchaseBusinessStoreQuote,
} from "./playerBusinessStoreProcurement.ts";

export interface PlayerBusinessRequestScope {
  readonly gameId: string;
  readonly playerUuid: string;
}

export interface PlayerBusinessHttpHandlerDependencies {
  readonly createServiceClient: (env: SupabaseEnv) => EdgeSupabaseClient;
  readonly resolveScope: (
    request: Request,
    client: EdgeSupabaseClient,
    body: Record<string, unknown>,
  ) => Promise<PlayerBusinessRequestScope>;
  readonly readEnvironment?: typeof readSupabaseEnv;
  readonly createRepository?: (
    client: EdgeSupabaseClient,
  ) => PlayerBusinessRepository;
}

export async function handlePlayerBusinessRequest(
  request: Request,
  route: PlayerBusinessRoute,
  dependencies: PlayerBusinessHttpHandlerDependencies,
): Promise<Response> {
  try {
    validateBusinessRequestEnvelope(request);
    const body = await readBusinessRequestBody(
      request,
      route.kind === "businessRead",
    );
    validateBusinessRequestMethodAndFields(route, request.method, body);

    const environment = (dependencies.readEnvironment ?? readSupabaseEnv)();
    if (!environment.ok) {
      return jsonError(500, {
        code: "missing_edge_runtime_config",
        message: "Classroom API runtime configuration is incomplete.",
        retryable: false,
      });
    }

    const client = dependencies.createServiceClient(environment.value);
    const scope = await dependencies.resolveScope(request, client, body);
    const repository = dependencies.createRepository
      ? dependencies.createRepository(client)
      : new SupabasePlayerBusinessRepository(client);
    const publicScope = {
      gameSessionId: scope.gameId,
      playerId: scope.playerUuid,
    };

    if (route.kind === "businessRead") {
      if (route.resource === "stockroom") {
        return privateJson(200, {
          items: await readBusinessStockroom(client, publicScope),
        });
      }
      if (route.resource === "recipes") {
        return privateJson(200, {
          recipes: await readBusinessRecipes(client, publicScope),
        });
      }
      return privateJson(200, await repository.readBusiness(publicScope));
    }

    if (route.kind === "businessStoreQuote") {
      return privateJson(200, {
        ok: true,
        quote: await createBusinessStoreQuote(repository, publicScope, body),
        refreshRequired: false,
      });
    }

    if (route.kind === "businessStorePurchase") {
      return privateJson(200, {
        ok: true,
        receipt: await purchaseBusinessStoreQuote(repository, publicScope, body),
        refreshRequired: true,
      });
    }

    const result = await executePlayerBusinessMutation(
      repository,
      route,
      body,
      publicScope,
    );
    return privateJson(200, { ok: true, result, refreshRequired: true });
  } catch (error) {
    if (error instanceof PlayerBusinessError) {
      return jsonError(error.status, {
        code: error.code,
        message: error.message,
        retryable: error.retryable,
      });
    }
    if (error instanceof EdgeActivationError) {
      return jsonError(error.status, {
        code: error.code,
        message: error.message,
        retryable: error.retryable,
      });
    }
    return jsonError(500, {
      code: "player_business_request_failed",
      message: "The Business request could not be completed.",
      retryable: false,
    });
  }
}

function privateJson(status: number, body: unknown): Response {
  return jsonResponse(status, body, {
    "cache-control": "private, no-store, max-age=0",
    "pragma": "no-cache",
    "vary": "authorization, x-player-session-token",
  });
}
'''

          validation = r'''/// <reference lib="dom" />

import { isRecord } from "../../../platform/supabase/edgeParsing.ts";
import {
  PlayerBusinessError,
  type PlayerBusinessRoute,
} from "../contracts/playerBusinessContracts.ts";

const MAX_BODY_BYTES = 24_576;
const PUBLIC_KEY = /^[a-z]{3}_[0-9a-f]{32}$/u;
const IDEMPOTENCY_KEY = /^[A-Za-z0-9._:-]{8,160}$/u;
const FORBIDDEN_SCOPE_HEADERS = [
  "x-econovaria-game-id",
  "x-econovaria-game-session-id",
  "x-game-session-id",
  "x-player-id",
  "x-player-session-id",
  "x-player-uuid",
] as const;
const FORBIDDEN_BODY_FIELDS = new Set([
  "gameId",
  "gameSessionId",
  "playerId",
  "playerUuid",
  "senderPlayerId",
  "recipientPlayerId",
  "ownerPlayerId",
  "staffUserId",
]);
const FORMATION_OWNER_FIELDS = new Set([
  "playerIdentifier",
  "ownershipBasisPoints",
  "capitalContribution",
]);

export function validateBusinessRequestEnvelope(request: Request): void {
  const url = new URL(request.url);
  if ([...url.searchParams.keys()].length) {
    throw invalidRequest("Business routes do not accept query parameters.");
  }
  if (FORBIDDEN_SCOPE_HEADERS.some((header) => request.headers.has(header))) {
    throw invalidRequest(
      "Player scope is derived only from x-player-session-token.",
    );
  }
}

export async function readBusinessRequestBody(
  request: Request,
  expectsEmptyBody: boolean,
): Promise<Record<string, unknown>> {
  const contentLength = Number(request.headers.get("content-length") ?? 0);
  if (contentLength > MAX_BODY_BYTES) {
    throw invalidRequest("Request body is too large.");
  }
  const raw = await request.text();
  if (new TextEncoder().encode(raw).byteLength > MAX_BODY_BYTES) {
    throw invalidRequest("Request body is too large.");
  }

  let parsed: unknown;
  try {
    parsed = JSON.parse(raw || "{}");
  } catch {
    throw invalidRequest("Request body must be valid JSON.");
  }
  if (!isRecord(parsed)) {
    throw invalidRequest("Request body must be a JSON object.");
  }
  if (expectsEmptyBody && Object.keys(parsed).length) {
    throw invalidRequest("GET requests do not accept a request body.");
  }
  return parsed;
}

export function validateBusinessRequestMethodAndFields(
  route: PlayerBusinessRoute,
  method: string,
  body: Record<string, unknown>,
): void {
  if (route.kind === "businessRead" && method !== "GET") {
    throw methodNotAllowed("Use GET for this resource.");
  }
  if (route.kind !== "businessRead" && method !== "POST") {
    throw methodNotAllowed("Use POST for this action.");
  }

  const businessCreateFields = route.kind !== "businessCreate"
    ? []
    : route.operation === "formationPropose"
    ? ["legalName", "entityType", "industryCode", "owners", "idempotencyKey"]
    : route.operation === "formationRespond"
    ? ["decision", "idempotencyKey"]
    : route.operation === "formationActivate"
    ? ["idempotencyKey"]
    : [
      "legalName",
      "entityType",
      "industryCode",
      "capitalization",
      "acquireBusinessKey",
      "idempotencyKey",
    ];

  const allowed: Record<PlayerBusinessRoute["kind"], readonly string[]> = {
    businessRead: [],
    businessCreate: businessCreateFields,
    businessStoreQuote: ["itemKey", "quantity", "idempotencyKey"],
    businessStorePurchase: [
      "quoteKey",
      "idempotencyKey",
      "clientSubmittedAt",
    ],
    businessProductCreate: [
      "businessKey",
      "name",
      "category",
      "unitPrice",
      "unitInputCost",
      "unitLaborCost",
      "capacityUnits",
      "baseDemandUnits",
      "qualityScore",
      "idempotencyKey",
    ],
    businessInputPurchase: [
      "businessKey",
      "productKey",
      "quantity",
      "idempotencyKey",
    ],
    businessProduction: [
      "businessKey",
      "productKey",
      "productId",
      "quantity",
      "priority",
      "idempotencyKey",
    ],
    businessPrice: [
      "businessKey",
      "price",
      "expectedVersion",
      "idempotencyKey",
    ],
    businessHire: [
      "businessKey",
      "employeePlayerIdentifier",
      "role",
      "roleName",
      "contractType",
      "wagePerCycle",
      "productivityIndex",
      "idempotencyKey",
    ],
    businessTerminate: ["businessKey", "reason", "idempotencyKey"],
    businessStatus: [
      "businessKey",
      "transition",
      "reason",
      "idempotencyKey",
    ],
  };

  const allowedSet = new Set(allowed[route.kind]);
  for (const key of Object.keys(body)) {
    if (FORBIDDEN_BODY_FIELDS.has(key)) {
      throw invalidRequest(`Player scope field is prohibited: ${key}.`);
    }
    if (!allowedSet.has(key)) {
      throw invalidRequest(`Unexpected request field: ${key}.`);
    }
  }
}

export function readText(
  value: unknown,
  field: string,
  minimum: number,
  maximum: number,
): string {
  const result = typeof value === "string" ? value.trim() : "";
  if (result.length < minimum || result.length > maximum) {
    throw invalidRequest(
      `${field} must contain ${minimum}-${maximum} characters.`,
    );
  }
  return result;
}

export function readOptionalText(
  value: unknown,
  maximum: number,
): string | null {
  if (value === null || value === undefined || value === "") return null;
  const result = typeof value === "string" ? value.trim() : "";
  if (!result || result.length > maximum) {
    throw invalidRequest(
      `Optional text must contain at most ${maximum} characters.`,
    );
  }
  return result;
}

export function readEnum(
  value: unknown,
  field: string,
  values: readonly string[],
): string {
  const result = typeof value === "string" ? value.trim().toLowerCase() : "";
  if (!values.includes(result)) throw invalidRequest(`${field} is invalid.`);
  return result;
}

export function readNumber(
  value: unknown,
  field: string,
  minimum: number,
  maximum: number,
): number {
  const result = Number(value);
  if (!Number.isFinite(result) || result < minimum || result > maximum) {
    throw invalidRequest(
      `${field} must be between ${minimum} and ${maximum}.`,
    );
  }
  return result;
}

export function readMoney(
  value: unknown,
  field: string,
  minimum: number,
  maximum: number,
): number {
  return Math.round(readNumber(value, field, minimum, maximum) * 100) / 100;
}

export function readInteger(
  value: unknown,
  field: string,
  minimum: number,
  maximum: number,
): number {
  const result = readNumber(value, field, minimum, maximum);
  if (!Number.isInteger(result)) {
    throw invalidRequest(`${field} must be an integer.`);
  }
  return result;
}

export function readOptionalInteger(
  value: unknown,
  field: string,
  minimum: number,
  maximum: number,
): number | null {
  if (value === null || value === undefined || value === "") return null;
  return readInteger(value, field, minimum, maximum);
}

export function readKey(
  value: unknown,
  field: string,
  prefix: string,
): string {
  const result = typeof value === "string" ? value.trim().toLowerCase() : "";
  if (!PUBLIC_KEY.test(result) || !result.startsWith(`${prefix}_`)) {
    throw invalidRequest(`${field} is invalid.`);
  }
  return result;
}

export function readOptionalKey(
  value: unknown,
  prefix: string,
): string | null {
  if (value === null || value === undefined || value === "") return null;
  return readKey(value, `${prefix}Key`, prefix);
}

export function readIdempotencyKey(value: unknown): string {
  const result = typeof value === "string" ? value.trim() : "";
  if (!IDEMPOTENCY_KEY.test(result)) {
    throw invalidRequest("idempotencyKey is invalid.");
  }
  return result;
}

export function readIndustryCode(value: unknown): string {
  const result = typeof value === "string" ? value.trim().toLowerCase() : "";
  if (!/^[a-z0-9][a-z0-9._-]{0,79}$/u.test(result)) {
    throw invalidRequest("industryCode is invalid.");
  }
  return result;
}

export function readFormationOwners(
  value: unknown,
): readonly Record<string, unknown>[] {
  if (!Array.isArray(value) || value.length < 1 || value.length > 16) {
    throw invalidRequest("owners must contain 1-16 proposed owners.");
  }
  return value.map((candidate, index) => {
    if (!isRecord(candidate)) {
      throw invalidRequest(`owners[${index}] must be an object.`);
    }
    for (const field of Object.keys(candidate)) {
      if (FORBIDDEN_BODY_FIELDS.has(field)) {
        throw invalidRequest(
          `Player scope field is prohibited in owners[${index}]: ${field}.`,
        );
      }
      if (!FORMATION_OWNER_FIELDS.has(field)) {
        throw invalidRequest(
          `Unexpected owners[${index}] field: ${field}.`,
        );
      }
    }
    return {
      playerIdentifier: readText(
        candidate.playerIdentifier,
        `owners[${index}].playerIdentifier`,
        1,
        160,
      ),
      ownershipBasisPoints: readInteger(
        candidate.ownershipBasisPoints,
        `owners[${index}].ownershipBasisPoints`,
        1,
        10_000,
      ),
      capitalContribution: readMoney(
        candidate.capitalContribution ?? 0,
        `owners[${index}].capitalContribution`,
        0,
        10_000_000,
      ),
    };
  });
}

function methodNotAllowed(message: string): PlayerBusinessError {
  return new PlayerBusinessError("method_not_allowed", message, 405);
}

function invalidRequest(
  message: string,
  status = 400,
  code = "invalid_business_request",
): PlayerBusinessError {
  return new PlayerBusinessError(code, message, status);
}
'''

          executor = r'''import {
  PlayerBusinessError,
  type PlayerBusinessRepository,
  type PlayerBusinessRoute,
  type PlayerEconomicContext,
} from "../contracts/playerBusinessContracts.ts";
import {
  readEnum,
  readFormationOwners,
  readIdempotencyKey,
  readIndustryCode,
  readInteger,
  readKey,
  readMoney,
  readNumber,
  readOptionalInteger,
  readOptionalKey,
  readOptionalText,
  readText,
} from "./playerBusinessRequestValidation.ts";

type BusinessMutationRoute = Exclude<
  PlayerBusinessRoute,
  | { readonly kind: "businessRead" }
  | { readonly kind: "businessStoreQuote" }
  | { readonly kind: "businessStorePurchase" }
>;

export async function executePlayerBusinessMutation(
  repository: PlayerBusinessRepository,
  route: BusinessMutationRoute,
  body: Record<string, unknown>,
  scope: { readonly gameSessionId: string; readonly playerId: string },
): Promise<Record<string, unknown>> {
  const context = await readEconomicContext(repository, scope);
  const base = {
    p_game_session_id: scope.gameSessionId,
    p_player_id: scope.playerId,
  };

  switch (route.kind) {
    case "businessCreate": {
      if (route.operation === "formationPropose") {
        return repository.execute("propose_business_formation_v2", {
          ...base,
          p_legal_name: readText(body.legalName, "legalName", 2, 160),
          p_entity_type: readEnum(body.entityType, "entityType", [
            "sole_proprietorship",
            "partnership",
            "llc",
            "c_corporation",
          ]),
          p_industry_code: readIndustryCode(body.industryCode),
          p_owners: readFormationOwners(body.owners),
          p_idempotency_key: readIdempotencyKey(body.idempotencyKey),
        });
      }
      if (route.operation === "formationRespond") {
        return repository.execute("respond_business_formation_v2", {
          ...base,
          p_formation_key: route.formationKey,
          p_decision: readEnum(body.decision, "decision", [
            "approve",
            "reject",
          ]),
          p_idempotency_key: readIdempotencyKey(body.idempotencyKey),
        });
      }
      if (route.operation === "formationActivate") {
        return repository.execute("activate_business_formation_v2", {
          ...base,
          p_formation_key: route.formationKey,
          p_idempotency_key: readIdempotencyKey(body.idempotencyKey),
        });
      }

      const idempotencyKey = readIdempotencyKey(body.idempotencyKey);
      await repository.assertBusinessCreationAllowed?.({
        ...scope,
        idempotencyKey,
      });
      return repository.execute("create_or_acquire_player_business_v1", {
        ...base,
        p_legal_name: readText(body.legalName, "legalName", 2, 120),
        p_entity_type: readEnum(body.entityType, "entityType", [
          "sole_proprietorship",
          "partnership",
          "corporation",
          "cooperative",
        ]),
        p_industry_code: readText(body.industryCode, "industryCode", 2, 80),
        p_country_code: context.countryCode,
        p_currency_code: context.currencyCode,
        p_capitalization: readMoney(
          body.capitalization,
          "capitalization",
          0,
          10_000_000,
        ),
        p_acquire_business_key: readOptionalKey(
          body.acquireBusinessKey,
          "biz",
        ),
        p_idempotency_key: idempotencyKey,
      });
    }
    case "businessProductCreate":
      return repository.execute("submit_business_product_v1", {
        ...base,
        p_business_key: readKey(body.businessKey, "businessKey", "biz"),
        p_name: readText(body.name, "name", 2, 120),
        p_category: readText(body.category, "category", 2, 80),
        p_unit_price: readMoney(body.unitPrice, "unitPrice", 0.01, 1_000_000),
        p_unit_input_cost: readMoney(
          body.unitInputCost,
          "unitInputCost",
          0,
          1_000_000,
        ),
        p_unit_labor_cost: readMoney(
          body.unitLaborCost,
          "unitLaborCost",
          0,
          1_000_000,
        ),
        p_capacity_units: readInteger(
          body.capacityUnits,
          "capacityUnits",
          1,
          100_000,
        ),
        p_base_demand_units: readInteger(
          body.baseDemandUnits,
          "baseDemandUnits",
          0,
          100_000,
        ),
        p_quality_score: readInteger(
          body.qualityScore,
          "qualityScore",
          0,
          100,
        ),
        p_idempotency_key: readIdempotencyKey(body.idempotencyKey),
      });
    case "businessInputPurchase":
      return repository.execute("purchase_business_input_v1", {
        ...base,
        p_business_key: readKey(body.businessKey, "businessKey", "biz"),
        p_product_key: readKey(body.productKey, "productKey", "bpr"),
        p_quantity: readInteger(body.quantity, "quantity", 1, 100_000),
        p_idempotency_key: readIdempotencyKey(body.idempotencyKey),
      });
    case "businessProduction":
      return repository.execute("run_business_production_v1", {
        ...base,
        p_business_key: readKey(body.businessKey, "businessKey", "biz"),
        p_product_key: readKey(
          body.productKey ?? body.productId,
          "productKey",
          "bpr",
        ),
        p_quantity: readInteger(body.quantity, "quantity", 1, 10_000),
        p_priority: readEnum(body.priority ?? "standard", "priority", [
          "standard",
          "expedite",
        ]),
        p_idempotency_key: readIdempotencyKey(body.idempotencyKey),
      });
    case "businessPrice":
      return repository.execute("set_business_product_price_v1", {
        ...base,
        p_business_key: readKey(body.businessKey, "businessKey", "biz"),
        p_product_key: route.productKey,
        p_price: readMoney(body.price, "price", 0.01, 1_000_000),
        p_expected_version: readOptionalInteger(
          body.expectedVersion,
          "expectedVersion",
          1,
          2_147_483_647,
        ),
        p_idempotency_key: readIdempotencyKey(body.idempotencyKey),
      });
    case "businessHire":
      return repository.execute("hire_business_employee_v1", {
        ...base,
        p_business_key: readKey(body.businessKey, "businessKey", "biz"),
        p_employee_player_identifier: readOptionalText(
          body.employeePlayerIdentifier,
          160,
        ),
        p_role_name: readText(body.role ?? body.roleName, "role", 2, 120),
        p_contract_type: readEnum(
          body.contractType ?? "cycle",
          "contractType",
          ["cycle", "permanent"],
        ),
        p_wage_per_cycle: readMoney(
          body.wagePerCycle,
          "wagePerCycle",
          0.01,
          1_000_000,
        ),
        p_productivity_index: readNumber(
          body.productivityIndex ?? 1,
          "productivityIndex",
          0.25,
          3,
        ),
        p_idempotency_key: readIdempotencyKey(body.idempotencyKey),
      });
    case "businessTerminate":
      return repository.execute("terminate_business_employee_v1", {
        ...base,
        p_business_key: readKey(body.businessKey, "businessKey", "biz"),
        p_employee_key: route.employeeKey,
        p_reason: readText(body.reason, "reason", 2, 500),
        p_idempotency_key: readIdempotencyKey(body.idempotencyKey),
      });
    case "businessStatus":
      return repository.execute("transition_business_status_v1", {
        ...base,
        p_business_key: readKey(body.businessKey, "businessKey", "biz"),
        p_transition: readEnum(body.transition, "transition", [
          "restructure",
          "recover",
          "close",
        ]),
        p_reason: readText(body.reason, "reason", 2, 500),
        p_idempotency_key: readIdempotencyKey(body.idempotencyKey),
      });
  }
}

async function readEconomicContext(
  repository: PlayerBusinessRepository,
  scope: { readonly gameSessionId: string; readonly playerId: string },
): Promise<PlayerEconomicContext> {
  if (repository.readEconomicContext) {
    return repository.readEconomicContext(scope);
  }
  const context = await repository.execute(
    "resolve_player_economic_context_v1",
    {
      p_game_session_id: scope.gameSessionId,
      p_player_id: scope.playerId,
    },
  );
  const countryCode = typeof context.country_code === "string"
    ? context.country_code
    : "";
  const currencyCode = typeof context.currency_code === "string"
    ? context.currency_code
    : "";
  if (!countryCode || !currencyCode) {
    throw new PlayerBusinessError(
      "player_economic_context_missing",
      "Player country and currency must be assigned before this action.",
      409,
    );
  }
  return { countryCode, currencyCode };
}
'''

          Path("backend/src/domains/business/api/playerBusinessHttpHandler.ts").write_text(handler, encoding="utf-8")
          Path("backend/src/domains/business/api/playerBusinessRequestValidation.ts").write_text(validation, encoding="utf-8")
