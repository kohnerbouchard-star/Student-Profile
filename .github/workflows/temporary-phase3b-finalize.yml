            "backend/supabase/functions/player-api/runtime.ts"
            "backend/supabase/migrations/20260820070000_store_quote_pricing_resolver_v2.sql"
            "backend/supabase/migrations/20260821060000_business_store_procurement_v2.sql"
            "docs/architecture/inventories/econovaria-architecture-inventory-v2.json"
            "docs/operations/contracts/player-cross-cutting-verification-authority-v1.json"
            "scripts/business-recipe-access-contract.mjs"
            "scripts/business-store-procurement-authority-contract.mjs"
          )

          declare -A allowed=()
          for path in "${approved[@]}"; do allowed["$path"]=1; done
          while IFS= read -r line; do
            path="${line:3}"
            if [[ -z "${allowed[$path]+x}" ]]; then
              echo "Unexpected worktree path: $path" >&2
              exit 1
            fi
          done < <(git status --porcelain=v1)

          for path in "${approved[@]}"; do
            if [[ -e "$path" ]] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git add -- "$path"
            fi
          done

          git diff --cached --check
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

          git commit -m "fix(business): finalize Phase 3B authority and verification"
          git diff --name-only origin/refactor/business-ux-mechanics-v1...HEAD \
            > /tmp/phase3b-final-changed-files.txt
          ! grep -E '^\.github/(phase3b-patch|workflows/temporary-phase3b)' \
            /tmp/phase3b-final-changed-files.txt
          node scripts/verify-player-cross-cutting-authority.mjs \
            --changed-files /tmp/phase3b-final-changed-files.txt \
            --pr-number 654 \
            --base-ref refactor/business-ux-mechanics-v1
          test -z "$(git status --porcelain=v1)"
          git push origin HEAD:feat/business-store-procurement-v2
