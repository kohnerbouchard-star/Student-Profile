name: Business Phase 6E Cutover Inspection

on:
  push:
    branches:
      - feat/business-timed-manufacturing-v2
    paths:
      - .github/workflows/business-phase6e-inspection.yml

permissions:
  contents: write

concurrency:
  group: business-phase6e-inspection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 1

      - name: Capture bounded cutover surface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          files = {
              "route_paths": Path("backend/src/domains/business/api/playerBusinessRoutePaths.ts"),
              "contracts": Path("backend/src/domains/business/contracts/playerBusinessContracts.ts"),
              "handler": Path("backend/src/domains/business/api/playerBusinessHttpHandler.ts"),
              "repository": Path("backend/src/domains/business/infrastructure/supabasePlayerBusinessRepository.ts"),
              "api_routes": Path("player-terminal/src/api/business-banking-backend-routes.js"),
              "api_endpoints": Path("player-terminal/src/api/endpoints.js"),
              "business_page": Path("player-terminal/src/pages/business-page.js"),
              "start_sql": Path("backend/supabase/migrations/20260823110200_business_manufacturing_start_resources_v2.sql"),
              "read_sql": Path("backend/supabase/migrations/20260823110100_business_manufacturing_worker_and_read_v2.sql"),
              "completion_sql": Path("backend/supabase/migrations/20260823110300_business_manufacturing_completion_v2.sql"),
              "recovery_sql": Path("backend/supabase/migrations/20260823110400_business_manufacturing_recovery_v2.sql"),
          }

          patterns = {
              "route_paths": [r"production", r"businesses", r"matchPlayerBusiness"],
              "contracts": [r"Production", r"production", r"Business.*Schema"],
              "handler": [r"runProduction", r"production", r"repository\.", r"matchPlayerBusiness"],
              "repository": [r"runProduction", r"production", r"rpc\(", r"export interface"],
              "api_routes": [r"business", r"production", r"runProduction"],
              "api_endpoints": [r"business", r"production", r"runProduction"],
              "business_page": [r"runProduction", r"production", r"Production", r"render.*business", r"load.*business"],
          }

          def contexts(text, pats, radius=6, max_hits=30):
              lines = text.splitlines()
              hits = []
              seen = set()
              for pat in pats:
                  rx = re.compile(pat, re.I)
                  for i, line in enumerate(lines):
                      if not rx.search(line):
                          continue
                      start = max(0, i - radius)
                      end = min(len(lines), i + radius + 1)
                      key = (start, end)
                      if key in seen:
                          continue
                      seen.add(key)
                      hits.append({
                          "pattern": pat,
                          "line": i + 1,
                          "context": "\n".join(f"{j + 1}: {lines[j]}" for j in range(start, end)),
                      })
                      if len(hits) >= max_hits:
                          return hits
              return hits

          out = {"head": "${{ github.sha }}", "files": {}, "sql_functions": {}}
          for key, path in files.items():
              text = path.read_text(encoding="utf-8")
              entry = {
                  "path": str(path),
                  "lines": len(text.splitlines()),
                  "exports": re.findall(r"^export\s+(?:async\s+)?(?:function|class|interface|type|const)\s+([A-Za-z0-9_]+)", text, re.M),
              }
              if key in patterns:
                  entry["matches"] = contexts(text, patterns[key])
              out["files"][key] = entry

              if key.endswith("_sql"):
                  for name in [
                      "start_business_manufacturing_job_v2",
                      "get_player_business_manufacturing_jobs_v2",
                      "claim_due_business_manufacturing_jobs_v2",
                      "complete_business_manufacturing_job_v2",
                      "cancel_business_manufacturing_job_v2",
                      "fail_exhausted_business_manufacturing_jobs_v2",
                  ]:
                      match = re.search(
                          rf"create\s+or\s+replace\s+function\s+public\.{name}\s*\((.*?)\)\s*returns\s+(.*?)(?:\nlanguage|\nas\s+\$)",
                          text,
                          re.I | re.S,
                      )
                      if match:
                          out["sql_functions"][name] = {
                              "source": str(path),
                              "arguments": re.sub(r"\s+", " ", match.group(1)).strip(),
                              "returns": re.sub(r"\s+", " ", match.group(2)).strip(),
                          }

          target = Path("docs/roadmaps/.phase6e-inspection.json")
          target.write_text(json.dumps(out, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit inspection snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmaps/.phase6e-inspection.json
          git commit -m "chore(business): capture Phase 6E cutover surface"
          git push origin HEAD:feat/business-timed-manufacturing-v2
