name: Export PR Source Temporary

on:
  pull_request:
    paths:
      - ".github/workflows/export-pr-source-temporary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Archive repository source
        run: git archive --format=tar.gz --output=/tmp/econovaria-pr-source.tar.gz HEAD

      - name: Upload repository source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: econovaria-pr-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/econovaria-pr-source.tar.gz
          if-no-files-found: error
          retention-days: 1
