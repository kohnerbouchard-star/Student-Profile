name: REF-002 Source Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ref-002:
    name: Run REF-002 source audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout REF-002 owner branch
        uses: actions/checkout@v4
        with:
          ref: docs/ref-002-route-entrypoint-map-v1
          fetch-depth: 0

      - name: Set up Node from repository
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify exact REF-002 source
        run: |
          test "$(git branch --show-current)" = "docs/ref-002-route-entrypoint-map-v1"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git status --short
          git ls-files > "$RUNNER_TEMP/ref-002-tracked-files.txt"
          echo "tracked_files=$(wc -l < "$RUNNER_TEMP/ref-002-tracked-files.txt")"

      - name: Inspect audit scripts
        run: |
          node --check scripts/admin-bundle-contract-audit.mjs
          node --check scripts/admin-contract-review-source-audit.mjs
          git status --short

      - name: Run Admin bundle contract audit
        run: node scripts/admin-bundle-contract-audit.mjs

      - name: Run Admin contract review source audit
        run: node scripts/admin-contract-review-source-audit.mjs

      - name: Report audit side effects and diff
        if: always()
        run: |
          echo "=== git status ==="
          git status --short
          echo "=== git diff --check ==="
          git diff --check
          echo "=== changed files ==="
          git diff --name-only
          echo "=== diff stat ==="
          git diff --stat
