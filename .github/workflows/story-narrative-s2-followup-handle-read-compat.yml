name: Story Narrative S2 Followup HandleRead Compatibility

on:
  push:
    branches:
      - feat/story-narrative-convergence-v1
    paths:
      - ".github/workflows/story-narrative-s2-followup-handle-read-compat.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact story branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Run exact followup handleRead repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/story-narrative/s2/repair-followup-handle-read.py
          python3 scripts/story-narrative/s2/repair-followup-handle-read.py
          python3 -m py_compile scripts/story-narrative/s2/diagnostic-followup.py
          git diff --check
          rm -f scripts/story-narrative/s2/repair-followup-handle-read.py
          rm -f .github/workflows/story-narrative-s2-followup-handle-read-compat.yml
          git add -A -- scripts/story-narrative/s2/diagnostic-followup.py scripts/story-narrative/s2/repair-followup-handle-read.py docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md .github/workflows/story-narrative-s2-followup-handle-read-compat.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(story): narrow S2 followup handleRead anchor"
          git push origin HEAD:feat/story-narrative-convergence-v1
