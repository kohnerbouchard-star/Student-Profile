name: Phase 12 Architecture Inventory Export

on:
  push:
    branches:
      - feat/player-business-workspace-v2

permissions:
  contents: read

jobs:
  inventory:
    if: github.repository == 'kohnerbouchard-star/Student-Profile'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up pinned Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
      - name: Generate architecture inventory
        run: node scripts/architecture/build-architecture-inventory.mjs
      - name: Upload generated inventory
        uses: actions/upload-artifact@v4
        with:
          name: phase12-architecture-inventory-${{ github.sha }}
          path: docs/architecture/inventories/econovaria-architecture-inventory-v2.json
          if-no-files-found: error
          retention-days: 1
