name: Story Narrative S2 Anchor Diagnose Safe

on:
  push:
    branches:
      - feat/story-narrative-convergence-v1
    paths:
      - ".github/workflows/story-narrative-s2-anchor-diagnose-safe.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Persist failed diagnostic and exact handler references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          targets = [
              Path("scripts/story-narrative/s2/diagnostic-primary.py"),
              Path("scripts/story-narrative/s2/diagnostic-followup.py"),
          ]
          tokens = (
              "playerMessagingHttpHandler",
              "Player Messaging",
              "handler anchors",
              "replace_any",
              "handler =",
          )
          refs = []
          for target in targets:
              src = target.read_text(encoding="utf-8").splitlines()
              for idx, line in enumerate(src, 1):
                  if any(token in line for token in tokens):
                      refs.append((str(target), idx, line.rstrip()))

          roadmap = Path("docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md")
          text = roadmap.read_text(encoding="utf-8")
          marker = "\n## Run-completion rule\n"
          if marker not in text:
              raise SystemExit("roadmap marker missing")

          lines = [
              "",
              "### Run 2026-08-10 — S2 exact-anchor diagnostic attempt 1",
              "",
              "Workflow run: `31373328626`",
              "",
              "Result: DIAGNOSTIC WORKFLOW FAILED; NO S2 SOURCE APPLICATION OCCURRED.",
              "",
              "The failed diagnostic was intended only to capture staged patcher context. It did not generate a migration, mutate S2 implementation source, or run tests. Its failure is superseded by the sanitized diagnostic below.",
              "",
              "### Run 2026-08-10 — S2 sanitized exact-anchor diagnostic",
              "",
              f"Workflow run: `{os.environ['GITHUB_RUN_ID']}`",
              f"Diagnostic source head: `{os.environ['GITHUB_SHA']}`",
              "",
              "Exact staged patcher references containing Player Messaging / handler-anchor terms:",
              "",
          ]
          if refs:
              for file_name, line_number, line in refs:
                  safe = line.replace("`", "'").strip()
                  lines.append(f"- `{file_name}:{line_number}` — `{safe}`")
          else:
              lines.append("- no direct textual references matched; the failure is therefore emitted dynamically by a generic replacement helper and must be traced from its call sites.")
          lines += [
              "",
              "Next: inspect the listed call-site neighborhood(s) against current S1 Player Messaging source, normalize only the exact incompatible S1 formatting/anchor, and rerun the entire S2 landing pipeline.",
              "",
          ]
          text = text.replace(marker, "\n".join(lines) + marker, 1)
          roadmap.write_text(text, encoding="utf-8")
          PY
          git diff --check
          rm -f .github/workflows/story-narrative-s2-anchor-diagnose-safe.yml
          git add -A -- docs/story/STORY-NARRATIVE-CONVERGENCE-ROADMAP.md .github/workflows/story-narrative-s2-anchor-diagnose-safe.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(story): persist exact S2 handler anchor diagnostics"
          git push origin HEAD:feat/story-narrative-convergence-v1
