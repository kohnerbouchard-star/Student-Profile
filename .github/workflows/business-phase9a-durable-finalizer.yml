name: Business Phase 9A Durable Finalizer

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/business-phase9a-durable-finalizer.yml"

permissions:
  contents: write

concurrency:
  group: business-phase9a-durable-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 664 &&
      github.event.pull_request.head.ref == 'feat/business-store-withdrawal-safety-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Phase 9A branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/business-store-withdrawal-safety-v2
          fetch-depth: 0

      - name: Verify frozen exact-head lineage
        shell: bash
        run: |
          set -euo pipefail
          IMPLEMENTATION_SHA="bf17e2493654620229d1acdeaae0fbaba21caf63"
          test "$(git log -1 --format=%s)" = "ops(business): finalize Phase 9A durable certification"
          git merge-base --is-ancestor "$IMPLEMENTATION_SHA" HEAD
          test -z "$(git diff --name-only "$IMPLEMENTATION_SHA" HEAD -- . \
            ':(exclude).github/workflows/business-phase9a-durable-finalizer.yml')"

      - name: Write durable Phase 9A certification records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          implementation_sha = "bf17e2493654620229d1acdeaae0fbaba21caf63"
          dedicated_run = "32729827704"

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          scope_path = Path(
              "docs/roadmaps/business-phase9-store-withdrawal-safety-scope-v1.md"
          )
          scope = scope_path.read_text()
          scope = replace_once(
              scope,
              "**Status:** IN PROGRESS — checkpoint 9A scope locked; implementation not certified\n",
              "**Status:** COMPLETE — checkpoint 9A certified\n"
              f"**Certified implementation and exact-head verification source:** `{implementation_sha}`\n"
              f"**Dedicated certification workflow:** `{dedicated_run}`\n"
              "**Certification date:** 2026-08-24\n",
              "scope status",
          )
          if "## Certification evidence" in scope:
              raise SystemExit("scope already contains certification evidence")
          evidence = f"""## Certification evidence

**Exact certified implementation SHA:** `{implementation_sha}`  
**Dedicated workflow:** Business Store Withdrawal Safety V2 `{dedicated_run}`

- Store-owned withdrawal lifecycle, durable request receipts, immediate aggregation exclusion, five-minute server-time boundary, bounded `SKIP LOCKED` processing, unresolved-reservation deferral, exact return quantity, cost/provenance preservation, retained stockroom convergence, idempotency, duplicate-worker safety, and two-game isolation: **PASS**;
- durable replay remains authoritative after later Business/seller/catalog/offer changes and returns the recorded pending/completion offer state rather than mutable live state: **PASS**;
- retained Phase 8A listing-custody and Phase 7A seller-offer/Banking contracts: **PASS** (`32729827682`, `32729827726`);
- canonical Store quote/purchase and Inventory lifecycle/negative-state tests plus all Backend/Edge TypeScript: **PASS** in the dedicated Phase 9A workflow;
- standalone Player Terminal and Chromium: **PASS** in the Phase 9A, Phase 8A, and Phase 7A workflows;
- Database Replay from zero twice and rebuilt-database lint: **PASS** (`32729827754`);
- Backend Typecheck and backend smoke: **PASS** (`32729827707`);
- retained equipment, workforce-production/payroll, timed-manufacturing, resource, completion, recovery, Player Business, and local Edge boot/preflight regressions: **PASS** (`32729827688`);
- Business Workforce Payroll V2: **PASS** (`32729827714`);
- Business Economy V2: **PASS** (`32729827695`);
- Repository Quality and deterministic architecture ratchet: **PASS** (`32729827698`);
- Supply Chain Security: **PASS** (`32729827697`);
- Runtime Interaction Wiring: **PASS** (`32729827753`);
- Admin API Check: **PASS** (`32729827814`);
- Required Game Market Timezone: **PASS** (`32729827687`);
- Exchange Calendar Runtime: **PASS** (`32729827743`).

The certified head contains only the permanent Phase 9A workflow and implementation artifacts. Temporary repair, executor, runner, and contract-split workflows have zero net presence. No merge, staging deployment, production deployment, secret mutation, or live database mutation occurred. Later documentation-only commits do not replace `{implementation_sha}` as the exact certified implementation source.

"""
          scope = replace_once(
              scope,
              "## Completion rule\n",
              evidence + "## Completion rule\n",
              "scope evidence insertion",
          )
          old_next = """## Next step after scope lock

Implement the bounded Store-owned withdrawal-request authority, immediate pending transition, five-minute server-time gate, reservation-safe bounded due processor, exact Store Listing-to-Finished Goods transfer, retained stockroom convergence, typed contracts, simulations, assertions, and dedicated CI. Do not widen checkpoint 9A into buyer settlement or Player routes/UI.
"""
          new_next = """## Next authorized step

Checkpoint 9A is complete. Open a bounded Phase 10 checkpoint for atomic seller-offer purchase settlement. Reuse the canonical Player Checking ledger, first-class Business cash ledger, seller-offer identity/version authority, canonical Store-listing Inventory custody, buyer Inventory account, existing Store pricing/quote evidence, and canonical Inventory poster. The first checkpoint must lock the offer before inventory and money, preserve purchase-first and withdrawal-first ordering, and make payment, seller credit, Inventory transfer, revenue/COGS evidence, and idempotent receipt state converge atomically. Player Store read/UI cutover, automatic demand/sales convergence, equity/IPO, merge, deployment, secrets, and live database mutation remain unauthorized until separately certified.
"""
          scope = replace_once(scope, old_next, new_next, "scope next step")
          scope_path.write_text(scope.rstrip() + "\n")

          plan_path = Path(
              "docs/roadmaps/business-v2-development-execution-plan-v1.md"
          )
          plan = plan_path.read_text()
          phase9_pattern = re.compile(
              r"## Phase 9 — Five-minute Store withdrawal safety\n\n.*?"
              r"(?=\n## Phase 10 — Atomic Store purchase settlement)",
              re.S,
          )
          phase9_block = f"""## Phase 9 — Five-minute Store withdrawal safety

**Status:** COMPLETE — checkpoint 9A certified exact-head source `{implementation_sha}`

- [x] Add `withdrawal_pending` lifecycle/state and durable public `swr_...` request identity.
- [x] Store server-derived `withdrawal_requested_at` and `withdrawal_effective_at` with a minimum five-minute boundary.
- [x] Disable future offer-aware purchase eligibility immediately and exclude pending offers from active aggregation.
- [x] Preserve one pending request per offer, immutable request identity, optimistic offer versions, and authoritative replay receipts.
- [x] Add a bounded deterministic due-withdrawal processor using request-first locking and `FOR UPDATE SKIP LOCKED`.
- [x] Treat positive canonical Store-listing reservations as unresolved accepted-purchase evidence and defer the entire return.
- [x] Return only remaining unsold stock `Store Listing -> Finished Goods`, including bounded quantity reductions.
- [x] Preserve average cost, currency, canonical Inventory provenance, retained stockroom convergence, and exact-once completion.
- [x] Keep ordinary price/lifecycle mutation immediate outside `withdrawal_pending`; reject stock, price, custody, and lifecycle mutation while pending.
- [x] Establish the offer-first purchase lock boundary and deterministic purchase-first/withdrawal-first contract required by Phase 10.

Certified checkpoint:

- **9A:** Store-owned withdrawal requests and self-describing pending offer state; immediate non-purchasability; five-minute server-time cooling-off; bounded reservation-safe due processing; exact canonical Store Listing-to-Finished Goods return; immutable pending/completion receipts; replay-before-active-state validation; request/offer deadlock prevention; cost/provenance and retained stockroom convergence; typed Store contracts/repository; deterministic time, concurrency, replay, reservation, rollback, bounded-batch, catalog-resume, and two-game tests. **Certified implementation and exact-head verification source:** `{implementation_sha}`. Dedicated workflow: `{dedicated_run}`.

Exit: the withdrawal side of purchase-vs-withdrawal safety is **MET**. Phase 10 must use the same offer-first lock boundary and prove both race orderings while atomically settling buyer money, seller money, and inventory.
"""
          plan, count = phase9_pattern.subn(phase9_block, plan, count=1)
          if count != 1:
              raise SystemExit(f"execution plan Phase 9: expected one block, found {count}")
          plan = replace_once(
              plan,
              "## Phase 10 — Atomic Store purchase settlement\n\n**Status:** NOT STARTED\n",
              "## Phase 10 — Atomic Store purchase settlement\n\n**Status:** OPEN — bounded checkpoint 10A authorized\n",
              "execution plan Phase 10 status",
          )
          plan_path.write_text(plan.rstrip() + "\n")

          log_path = Path(
              "docs/roadmaps/business-v2-development-execution-log-v1.md"
          )
          log = log_path.read_text()
          marker = (
              "## 2026-08-24 — Phase 9A COMPLETE: five-minute Store withdrawal safety"
          )
          if marker in log:
              raise SystemExit("execution log already contains Phase 9A certification")
          entry = f"""

---

{marker}

### Certified source and repository state

- **Exact certified implementation and verification source:** `{implementation_sha}`.
- Feature branch: `feat/business-store-withdrawal-safety-v2`.
- Stacked draft PR: #664, based on the durably certified Phase 8A handoff `42e52c38eea7402aefadb4ec3fad0b6743a22588` / PR #663.
- PR #664 remained open, draft, mergeable, unmerged, and undeployed at certification.
- Integration PR #648 remained open, draft, and unmerged on `refactor/business-ux-mechanics-v1`.
- The exact certified changed-file surface contains one permanent read-only Phase 9A workflow plus Store-domain contracts/repository, four forward migrations, deterministic tests, the architecture inventory, and this scope document. Temporary repair, executor, runner, receipt-integrity, and contract-split workflows have zero net presence.
- No merge, staging deployment, production deployment, secret mutation, or live database mutation was performed.
- Later documentation-only commits record certification and do not replace `{implementation_sha}` as the exact tested source.

### What is now authoritative

- Business seller offers may enter `withdrawal_pending` only through Store-owned service authority. The transition creates one durable public `swr_...` request, records the pre-withdrawal status, request mode/quantity, exact offer version, server request time, and an effective time no earlier than five minutes later.
- `withdrawal_pending` is non-purchasable and is excluded immediately from active multi-offer aggregation. Ordinary offer and stock mutations fail closed while the request is pending.
- Request creation uses bounded idempotency and optimistic concurrency. A matching committed retry resolves from durable request identity before active Business/seller and current offer-version validation.
- Pending and completed retries return the recorded offer status/version receipt rather than mutable live offer state. They remain truthful after later Business, seller, catalog, or offer changes.
- Replay does not lock the request row before the offer; the due processor owns request-to-offer lock ordering. This removes replay-versus-processor lock inversion while retaining deterministic idempotency serialization.
- The due processor selects a bounded deterministic batch with `FOR UPDATE SKIP LOCKED`, validates server time, locks request then offer and custody, and tolerates duplicate workers without duplicate returns.
- Any positive canonical Store-listing reservation defers the entire request and records a bounded retry time. No reserved unit is returned.
- Eligible completion returns `full` remaining quantity or `min(requested reduction, remaining owned quantity)` through one canonical Inventory transfer from the offer account into Business Finished Goods.
- Average cost, cost currency, public Business/offer/request provenance, append-only transaction evidence, and the retained `business_inventory` projection converge in the same transaction. Currency drift between canonical Finished Goods and the Business is rejected before mutation.
- Full withdrawal completes paused. Reduction resumes the recorded draft/active/paused state only when catalog and stock eligibility still permit it; otherwise it finishes paused.
- Withdrawal does not debit or credit cash, create revenue, recognize COGS, charge tax, or deliver buyer Inventory. Those remain Phase 10 authority.
- The Store withdrawal typed contract was split into a bounded public contract and private parsing primitives so Repository Quality remains within the existing oversized-source ratchet.

### Exact-head verification on `{implementation_sha}`

- **Business Store Withdrawal Safety V2 — PASS** (`{dedicated_run}`): Phase 9A structural/type contracts, server-time boundary, replay, reservation, cost/projection, rollback, bounded-batch, duplicate-worker and two-game simulations; deterministic architecture inventory; retained Store/Inventory/Business runtime; all Backend/Edge TypeScript; standalone Player Terminal; Chromium.
- **Business Store Listing Inventory V2 — PASS** (`32729827682`): retained Phase 8A custody, stock placement, canonical/retained projection convergence, Store/Inventory/Business runtime, Player Terminal, and Chromium.
- **Business Store Seller Offers V2 — PASS** (`32729827726`): retained Phase 7A seller-offer aggregation, Business Banking, Store/Inventory/Business contracts, Player Terminal, and Chromium.
- **Database Replay — PASS** (`32729827754`): complete replay from zero twice plus rebuilt-database lint.
- **Backend Typecheck — PASS** (`32729827707`): backend typecheck and backend smoke.
- **Business Timed Manufacturing V2 — PASS** (`32729827688`): retained equipment, workforce-production/payroll, material/labor/equipment reservation, manufacturing start/completion/recovery, all Backend/Edge TypeScript, Player Business surface, and local Edge boot/preflight.
- **Business Workforce Payroll V2 — PASS** (`32729827714`).
- **Business Economy V2 — PASS** (`32729827695`).
- **Repository Quality — PASS** (`32729827698`): repository audit, deterministic architecture ratchet, credential/package/signature checks, and backend dependency audit.
- **Supply Chain Security — PASS** (`32729827697`).
- **Runtime Interaction Wiring — PASS** (`32729827753`).
- **Admin API Check — PASS** (`32729827814`).
- **Required Game Market Timezone — PASS** (`32729827687`).
- **Exchange Calendar Runtime — PASS** (`32729827743`).

### Phase 9A exit result

- Immediate withdrawal-pending non-purchasability and aggregation exclusion: **met**.
- Server-derived five-minute minimum and immutable request timing: **met**.
- Full/reduction request identity, idempotency, optimistic versioning, and one-pending-request invariant: **met**.
- Reservation-safe bounded due processing and duplicate-worker exact-once behavior: **met**.
- Exact remaining-unsold Store Listing-to-Finished Goods transfer: **met**.
- Average cost, currency, canonical transaction provenance, and retained stockroom convergence: **met**.
- Authoritative pending/completion replay after later lifecycle changes: **met**.
- Offer/request lock-order hardening and future offer-first purchase boundary: **met**.
- Deterministic time, concurrency, rollback, catalog-resume, bounded-batch, and two-game tests: **met**.
- Database, backend, all Edge, retained Banking/Store/Inventory/workforce/equipment/manufacturing, repository, security, Player, and Chromium gates: **met**.
- Temporary machinery zero net, PR draft/unmerged, no deployment/live mutation: **met**.

### Decisions and unresolved boundaries

- A positive listing reservation is the only Phase 9A unresolved accepted-purchase signal. Any positive amount blocks the entire withdrawal rather than returning only the unreserved portion.
- The purchase path must lock the seller offer first, before listing Inventory and money. A purchase that obtains the offer lock first may reserve/settle; a withdrawal that obtains it first changes the offer to `withdrawal_pending` and prevents a new purchase.
- Phase 9A deliberately does not create buyer quotes, debit Player Checking, credit Business cash, transfer Inventory to the buyer, recognize revenue/COGS, or migrate Player Store reads and UI.
- The retained Store purchase compatibility channel remains active for seeded Store stock only until Phase 10 can bind displayed seller offer, quote, payment, seller credit, and transferred Inventory to one immutable receipt.
- Automatic consumer/NPC sales convergence, Player Business workspace controls, equity/IPO, merge, staging, and production remain unauthorized.

### Next authorized step

**Phase 10 checkpoint 10A — atomic Store purchase settlement is OPEN.** Create a stacked draft branch/PR from the clean Phase 9A durable handoff. Reuse canonical Player Checking, first-class Business cash, Store seller-offer identity/version, offer-scoped Store-listing Inventory, buyer Inventory, Store pricing/quote evidence, Business activity evidence, and the canonical Inventory poster. Plan a bounded first checkpoint before coding. It must define one immutable public purchase receipt and one offer-first lock order, prove purchase-first and withdrawal-first races, and keep buyer debit, seller credit, Inventory transfer, revenue/COGS evidence, and idempotency within one transaction. Do not include Player Store read/UI cutover, automatic sales convergence, equity/IPO, merge, staging, production deployment, secrets, or live database mutation unless separately authorized.
"""
          log_path.write_text(log.rstrip() + entry + "\n")
          PY

          git diff --check
          git diff -- \
            docs/roadmaps/business-phase9-store-withdrawal-safety-scope-v1.md \
            docs/roadmaps/business-v2-development-execution-plan-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md

      - name: Commit durable certification records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "econovaria-automation"
          git config user.email "econovaria-automation@users.noreply.github.com"
          git add \
            docs/roadmaps/business-phase9-store-withdrawal-safety-scope-v1.md \
            docs/roadmaps/business-v2-development-execution-plan-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md
          git diff --cached --quiet && { echo "No durable certification delta." >&2; exit 1; }
          git commit -m "docs(business): certify Phase 9A withdrawal safety"
          git push origin HEAD:feat/business-store-withdrawal-safety-v2
