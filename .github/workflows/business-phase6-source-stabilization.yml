name: Business Phase 6 Source Stabilization

on:
  pull_request:
    branches:
      - feat/business-equipment-capacity-v2
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/business-phase6-source-stabilization.yml

permissions:
  contents: write

concurrency:
  group: business-phase6-source-stabilization
  cancel-in-progress: false

jobs:
  stabilize:
    if: github.event.pull_request.number == 661 && github.event.pull_request.head.ref == 'feat/business-timed-manufacturing-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-timed-manufacturing-v2
          fetch-depth: 0

      - name: Apply deterministic replay and scope corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/business-timed-manufacturing-v2 feat/business-equipment-capacity-v2
          git reset --hard origin/feat/business-timed-manufacturing-v2

          python - <<'PY'
          from pathlib import Path

          migration_path = Path("backend/supabase/migrations/20260823110200_business_manufacturing_start_resources_v2.sql")
          migration = migration_path.read_text()

          declaration = "  v_output public.game_items%rowtype;\n"
          if migration.count(declaration) != 1:
              raise SystemExit("Expected exactly one v_output declaration before stabilization")
          migration = migration.replace(declaration, "", 1)

          composite_select = "  select recipe, output_item\n  into v_recipe, v_output\n"
          replacement_select = "  select recipe.*\n  into v_recipe\n"
          if migration.count(composite_select) != 1:
              raise SystemExit("Expected exactly one composite recipe/output SELECT before stabilization")
          migration = migration.replace(composite_select, replacement_select, 1)

          if migration.count("v_output.id") != 2:
              raise SystemExit("Expected exactly two v_output.id references before stabilization")
          migration = migration.replace("v_output.id", "v_product.output_game_item_id")
          migration_path.write_text(migration)

          scope_path = Path("docs/roadmaps/business-phase6-timed-manufacturing-scope-v1.md")
          scope = scope_path.read_text()
          old_status = "**Status:** IN PROGRESS — Phase 6A certified; Phase 6B atomic start/resource-hold implementation under exact-head verification  "
          new_status = "**Status:** IN PROGRESS — Phase 6A certified; Phase 6B–6D implementation present but not yet certified; Player cutover not started  "
          if scope.count(old_status) != 1:
              raise SystemExit("Unexpected Phase 6 status header")
          scope = scope.replace(old_status, new_status, 1)

          phase6b_intro = "## Phase 6B — atomic manufacturing start and resource hold\n\nThe Phase 6B implementation now adds one service-owned atomic start transaction. Exact-head certification is pending the full required gate set."
          phase6b_replacement = "## Phase 6B — atomic manufacturing start and resource hold\n\n**Phase 6B — atomic manufacturing start and resource hold is OPEN.**\n\nThe Phase 6B implementation now adds one service-owned atomic start transaction. Exact-head certification is pending the full required gate set."
          if scope.count(phase6b_intro) != 1:
              raise SystemExit("Unexpected Phase 6B introduction")
          scope = scope.replace(phase6b_intro, phase6b_replacement, 1)

          legacy_sentence = "The live Player route remains unchanged while this checkpoint is verified. Legacy instant production is not retired until the authenticated API cutover and completion/recovery path are both complete."
          player_boundary = "The live Player route remains unchanged while this checkpoint is verified. Legacy instant production is not retired until the authenticated API cutover and completion/recovery path are both complete.\n\n## Player cutover\n\nPlayer cutover is **NOT STARTED** on this source. PR #661 does not yet contain the authenticated manufacturing start/cancel routes or the connected Player Business workspace. Those changes remain a later Phase 6 checkpoint and may not be represented as complete until their exact-head API, browser, replay, load, and two-game isolation gates pass."
          if scope.count(legacy_sentence) != 1:
              raise SystemExit("Unexpected Player route boundary sentence")
          scope = scope.replace(legacy_sentence, player_boundary, 1)

          old_next = "**Phase 6C — exact-once due-job completion and Finished Goods settlement is next after Phase 6B certification.** Consume exact WIP, create exact canonical output in Finished Goods, consume labor/equipment reservations, and commit the completed transition under the existing due-job lease. Do not add Store seller offers, sales, durability/repair, or deployment."
          new_next = "**Immediate checkpoint:** certify the existing Phase 6B–6D source on one replayable exact head, then implement Phase 6E authenticated Player API and workspace cutover. Do not open Store seller offers, sales, durability/repair, IPO, merge, or deployment before the full Phase 6 completion rule is satisfied."
          if scope.count(old_next) != 1:
              raise SystemExit("Unexpected next-checkpoint statement")
          scope = scope.replace(old_next, new_next, 1)
          scope_path.write_text(scope)
          PY

          rm -f \
            .github/workflows/business-phase6-bounded-repair.yml \
            .github/workflows/business-phase6-convergence.yml \
            .github/workflows/business-phase6-deterministic-repair.yml \
            .github/workflows/business-phase6-final-certification.yml \
            .github/workflows/business-phase6-status-reconciler.yml \
            .github/workflows/business-phase6-source-stabilization.yml \
            docs/roadmaps/business-phase6-status-v1.json \
            docs/roadmaps/business-phase6-status-v1.png

          node scripts/business-phase6-manufacturing-foundation-contract.mjs
          node scripts/business-phase6-manufacturing-start-contract.mjs
          node scripts/business-phase6-manufacturing-start-simulation.mjs
          node scripts/business-phase6-manufacturing-completion-contract.mjs
          node scripts/business-phase6-manufacturing-completion-simulation.mjs
          node scripts/business-phase6-manufacturing-recovery-contract.mjs
          node scripts/business-phase6-manufacturing-recovery-simulation.mjs
          node scripts/business-phase6-manufacturing-lifecycle-simulation.mjs
          node scripts/validate-supabase-migrations.mjs
          git diff --check

          git add -A
          git commit -m "fix(business): stabilize Phase 6 replay source"
          git push origin HEAD:feat/business-timed-manufacturing-v2
