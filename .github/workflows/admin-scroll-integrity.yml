name: Admin Scroll Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/admin-scroll-integrity.yml"
      - "admin/**"
      - "scripts/admin-scroll-integrity-contract.test.mjs"
      - "scripts/admin-scroll-integrity-smoke.mjs"
      - "scripts/admin-shell-smoke.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/admin-scroll-integrity.yml"
      - "admin/**"
      - "scripts/admin-scroll-integrity-contract.test.mjs"
      - "scripts/admin-scroll-integrity-smoke.mjs"
      - "scripts/admin-shell-smoke.mjs"

permissions:
  contents: read

concurrency:
  group: admin-scroll-integrity-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  rendered-scroll-ownership:
    name: Rendered viewport and drawer scrolling
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install pinned tooling
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          npm ci
          node --test scripts/admin-scroll-integrity-contract.test.mjs
          node --check scripts/admin-scroll-integrity-smoke.mjs
          npx playwright install --with-deps chromium

      - name: Materialize browser-only runtime fixture
        shell: bash
        run: |
          set -euo pipefail
          cat > runtime-config.env.js <<'EOF'
          window.__ECONOVARIA_RUNTIME_CONFIG__ = Object.freeze({
            environment: "development",
            projectRef: "runtimefixture123456",
            supabaseUrl: "https://runtimefixture123456.supabase.co",
            supabasePublishableKey: "sb_publishable_runtime_fixture_1234567890"
          });
          EOF

      - name: Start static Admin preview
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/admin-scroll-server.log 2>&1 &
          echo $! > /tmp/admin-scroll-server.pid
          for ATTEMPT in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/admin/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/admin-scroll-server.log
          exit 1

      - name: Exercise viewport and nested scroll ownership
        shell: bash
        env:
          ADMIN_SCROLL_BASE_URL: http://127.0.0.1:4173/admin/?game=10000000-0000-4000-8000-000000000001
        run: |
          set -o pipefail
          mkdir -p admin-scroll-integrity-artifacts
          node scripts/admin-scroll-integrity-smoke.mjs \
            2>&1 | tee admin-scroll-integrity-artifacts/run.log

      - name: Upload sanitized scroll evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-scroll-integrity-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            admin-scroll-integrity-artifacts/
            /tmp/admin-scroll-server.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stop static Admin preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/admin-scroll-server.pid ]; then
            kill "$(cat /tmp/admin-scroll-server.pid)" 2>/dev/null || true
          fi
