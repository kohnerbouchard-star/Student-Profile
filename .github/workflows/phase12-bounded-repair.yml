name: Phase 12 bounded repair

on:
  push:
    branches:
      - feat/player-business-workspace-v2
    paths:
      - ".github/workflows/phase12-bounded-repair.yml"
      - "scripts/.phase12-bounded-repair/**"

permissions:
  contents: write

concurrency:
  group: phase12-bounded-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: Apply and verify bounded Phase 12 repairs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact repair trigger head
        uses: actions/checkout@v7
        with:
          ref: feat/player-business-workspace-v2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install focused dependencies
        run: |
          npm ci
          npm --prefix player-terminal ci

      - name: Reconstruct and apply bounded source repairs
        run: |
          sed -i '$s/IA$//' scripts/.phase12-bounded-repair/part-00.b64
          cat scripts/.phase12-bounded-repair/part-*.b64 | base64 --decode > /tmp/phase12-bounded-repair.mjs
          node /tmp/phase12-bounded-repair.mjs
          rm -rf scripts/.phase12-bounded-repair .github/workflows/phase12-bounded-repair.yml

      - name: Verify JavaScript syntax
        run: |
          node --check player-terminal/src/pages/market-page.js
          node --check player-terminal/src/features/market/market-order-flow.js
          node --check scripts/business-banking-player-market-browser-acceptance.core.mjs
          node --check player-terminal/tests/market-order-flow.mjs
          node --check scripts/seed-beta-rollback-migration.test.mjs

      - name: Run focused Player market verification
        run: npm --prefix player-terminal run market-flow

      - name: Run Seed compatibility contract
        run: node --test scripts/seed-beta-rollback-migration.test.mjs

      - name: Audit migration source and patch validity
        run: |
          npm run audit:migrations
          git diff --check

      - name: Commit bounded repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(player): align stock sale and seed identity contracts"
          git push origin HEAD:feat/player-business-workspace-v2
