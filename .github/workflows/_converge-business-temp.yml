name: Temporary Business V2 convergence

on:
  push:
    branches: [refactor/admin-ui-v2-business-v1]
    paths:
      - ".github/workflows/_converge-business-temp.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Replay bounded Business diff onto accumulated main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin backup/admin-ui-v2-business-preconvergence-20260810
          BASE=4c17b942fcf4b2a6f60b629549f192d066053ba4
          BACKUP=origin/backup/admin-ui-v2-business-preconvergence-20260810
          git diff --binary "$BASE...$BACKUP" -- \
            admin/v2.html \
            admin/v2/src/app.js \
            admin/v2/src/core/navigation-registry.js \
            admin/v2/src/routes/business/BusinessApi.js \
            admin/v2/src/routes/business/BusinessController.js \
            admin/v2/src/routes/business/BusinessRoute.js \
            admin/v2/styles/routes/business.css \
            docs/architecture/admin-ui-v2-business.md \
            docs/operations/evidence/admin-ui-v2-business/README.md \
            scripts/admin-v2-business-api.test.mjs > /tmp/business.patch
          set +e
          git apply --3way --index /tmp/business.patch
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U | sort | tr '\n' ' ')"
            test "$unresolved" = "admin/v2.html admin/v2/src/app.js "
            git checkout --ours -- admin/v2.html admin/v2/src/app.js
            python - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text: raise SystemExit(f"missing Business convergence anchor in {path}: {old[:100]!r}")
              p.write_text(text.replace(old,new,1))
          replace_once("admin/v2.html", '  <link rel="stylesheet" href="./v2/styles/routes/crafting.css" />\n', '  <link rel="stylesheet" href="./v2/styles/routes/crafting.css" />\n  <link rel="stylesheet" href="./v2/styles/routes/business.css" />\n')
          replace_once("admin/v2/src/app.js", 'import { createCraftingController } from "./routes/crafting/CraftingController.js";\n', 'import { createCraftingController } from "./routes/crafting/CraftingController.js";\nimport { createBusinessApi } from "./routes/business/BusinessApi.js";\nimport { createBusinessController } from "./routes/business/BusinessController.js";\n')
          replace_once("admin/v2/src/app.js", '  const craftingApi = createCraftingApiClient({ fetchImpl: transport });\n', '  const craftingApi = createCraftingApiClient({ fetchImpl: transport });\n  const businessApi = createBusinessApi({ fetchImpl: transport });\n')
          replace_once("admin/v2/src/app.js", '  const crafting = createCraftingController({\n', '  const business = createBusinessController({\n    api: businessApi,\n    selectedGameId,\n    hasPermission,\n    onChange: () => renderControllerChange("business"),\n    notify: (notification) => toast?.push(notification),\n  });\n  const crafting = createCraftingController({\n')
          replace_once("admin/v2/src/app.js", '    crafting: Object.freeze({\n', '    business: Object.freeze({\n      controller: business,\n      render: () => business.render(),\n    }),\n    crafting: Object.freeze({\n')
          replace_once("admin/v2/src/app.js", 'Inventory, Crafting, Banking', 'Inventory, Crafting, Business, Banking')
          replace_once("admin/v2/src/app.js", '      crafting.destroy();\n', '      crafting.destroy();\n      business.destroy();\n')
          PY
            git add -- admin/v2.html admin/v2/src/app.js
          fi
          rm .github/workflows/_converge-business-temp.yml
          git add -u -- .github/workflows/_converge-business-temp.yml
          git diff --cached --check
          node --check admin/v2/src/app.js
          node --check admin/v2/src/routes/business/BusinessApi.js
          node --check admin/v2/src/routes/business/BusinessController.js
          node --check admin/v2/src/routes/business/BusinessRoute.js
          node --test scripts/admin-v2-business-api.test.mjs
          git commit -m "refactor(admin-v2): reconcile Business onto accumulated main"
          git push origin HEAD:refactor/admin-ui-v2-business-v1
