name: Business Store Purchase Settlement Foundation V2

on:
  pull_request:
    paths:
      - "docs/architecture/business-phase10-store-purchase-settlement-authority-v1.md"
      - "docs/roadmaps/business-phase10-store-purchase-settlement-scope-v1.md"
      - "scripts/business-phase10-store-purchase-settlement-*.mjs"
      - "scripts/business-phase10-store-purchase-settlement-*.ts"
      - ".github/workflows/business-store-purchase-settlement-foundation-v2.yml"
  push:
    branches: [main]
    paths:
      - "docs/architecture/business-phase10-store-purchase-settlement-authority-v1.md"
      - "docs/roadmaps/business-phase10-store-purchase-settlement-scope-v1.md"
      - "scripts/business-phase10-store-purchase-settlement-*.mjs"
      - "scripts/business-phase10-store-purchase-settlement-*.ts"
      - ".github/workflows/business-store-purchase-settlement-foundation-v2.yml"

permissions:
  contents: read

concurrency:
  group: business-store-purchase-settlement-foundation-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-settlement-foundation:
    name: Verify settlement authority foundation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Verify Phase 10A.1 authority, types, and race ordering
        shell: bash
        run: |
          set -euo pipefail
          node scripts/business-phase10-store-purchase-settlement-foundation-contract.mjs
          node --experimental-strip-types scripts/business-phase10-store-purchase-settlement-lock-simulation.mjs
          node --experimental-strip-types scripts/business-phase10-store-purchase-settlement-foundation-types.mjs
          node scripts/business-phase9-store-withdrawal-safety-contract.mjs
          node scripts/business-phase9-store-withdrawal-safety-simulation.mjs
          node --experimental-strip-types scripts/business-phase9-store-withdrawal-safety-types.mjs
          node scripts/business-phase8-store-listing-inventory-contract.mjs
          node scripts/business-phase8-store-listing-inventory-simulation.mjs
          node --experimental-strip-types scripts/business-phase8-store-listing-inventory-types.mjs
          node scripts/business-phase7-store-seller-offers-contract.mjs
          node scripts/business-phase7-store-seller-offers-simulation.mjs
          node --experimental-strip-types scripts/business-phase7-store-seller-offers-types.mjs
          node scripts/validate-supabase-migrations.mjs
          git diff --check

      - name: Verify deterministic architecture inventory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/architecture/build-architecture-inventory.mjs
          git diff --exit-code -- docs/architecture/inventories/econovaria-architecture-inventory-v2.json

      - name: Run repository quality suite
        run: npm test

  verify-retained-economic-runtime:
    name: Verify retained Store, Inventory, and Business runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install repository dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix backend ci --ignore-scripts

      - name: Verify retained Business economic authorities
        shell: bash
        run: |
          set -euo pipefail
          node scripts/business-banking-runtime-contract.mjs
          node --experimental-strip-types --test scripts/business-banking-economic-simulation.test.mjs
          node scripts/business-phase6-manufacturing-foundation-contract.mjs
          node scripts/business-phase6-manufacturing-lifecycle-simulation.mjs
          node scripts/business-phase6-manufacturing-start-contract.mjs
          node scripts/business-phase6-manufacturing-start-simulation.mjs
          node scripts/business-phase6-manufacturing-completion-contract.mjs
          node scripts/business-phase6-manufacturing-completion-simulation.mjs
          node scripts/business-phase6-manufacturing-recovery-contract.mjs
          node scripts/business-phase6-manufacturing-recovery-simulation.mjs
          node scripts/business-phase5-equipment-foundation-contract.mjs
          node scripts/business-phase5-equipment-capacity-simulation.mjs
          node scripts/business-phase4c-production-labor-contract.mjs
          node scripts/business-phase4c-labor-reservation-simulation.mjs
          node scripts/business-phase4c-payroll-settlement-contract.mjs
          node scripts/business-phase4c-payroll-simulation.mjs

      - name: Verify retained Store and Inventory lifecycles
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm run test:player-store-public
          npm run test:player-inventory

      - name: Verify all backend and Edge TypeScript
        working-directory: backend
        run: npm run typecheck:all

  verify-player-terminal-and-chromium:
    name: Verify retained Player Terminal and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: player-terminal/package-lock.json

      - name: Install Player Terminal dependencies
        working-directory: player-terminal
        run: npm ci --no-audit --no-fund

      - name: Verify standalone Player Terminal
        working-directory: player-terminal
        run: npm run verify

      - name: Install Chromium
        working-directory: player-terminal
        run: npx playwright install --with-deps chromium

      - name: Materialize browser-only runtime fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p player-terminal/frontend/src/core
          cp frontend/src/core/runtime-config.js player-terminal/frontend/src/core/runtime-config.js
          cat > player-terminal/runtime-config.env.js <<'EOF'
          window.__ECONOVARIA_RUNTIME_CONFIG__ = Object.freeze({
            environment: "development",
            projectRef: "runtimefixture123456",
            supabaseUrl: "https://runtimefixture123456.supabase.co",
            supabasePublishableKey: "sb_publishable_runtime_fixture_1234567890"
          });
          EOF

      - name: Run Chromium browser verification
        working-directory: player-terminal
        run: npm run browser
