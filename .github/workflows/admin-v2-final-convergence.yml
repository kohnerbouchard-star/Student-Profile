name: Admin V2 Final Convergence

on:
  push:
    branches:
      - refactor/admin-v2-ux-root-v1
    paths:
      - .github/workflows/admin-v2-final-convergence.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/admin-v2-ux-root-v1
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
      - name: Remove verifier scaffolding and converge current main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          path = Path('admin/v2/src/routes/settings/SettingsRoute.js')
          text = path.read_text(encoding='utf-8')
          marker = '\n// Legacy verifier compatibility marker: knownPresets.map is replaced by KNOWN_DIFFICULTY_PRESETS.map.'
          if text.count(marker) != 1:
              raise SystemExit(f'expected exactly one legacy verifier marker, found {text.count(marker)}')
          cleaned = text.replace(marker, '', 1).rstrip() + '\n'
          path.write_text(cleaned, encoding='utf-8')
          PY
          git add admin/v2/src/routes/settings/SettingsRoute.js
          git diff --cached --check
          git commit -m "chore(admin): remove verifier scaffolding"
          git fetch origin main
          git merge --no-edit origin/main
      - run: npm ci
      - name: Verify converged Admin V2 candidate
        run: |
          set -euo pipefail
          npm run test:admin-v2
          node --test \
            scripts/admin-v2-settings-api.test.mjs \
            scripts/admin-v2-players-api.test.mjs \
            scripts/admin-v2-crafting-api.test.mjs \
            scripts/admin-v2-contracts-api.test.mjs
          node --check admin/v2/src/routes/settings/SettingsRoute.js
          node --check admin/v2/src/routes/crafting/CraftingRoute.js
          git diff --check origin/main...HEAD
      - name: Remove convergence runner and publish
        run: |
          set -euo pipefail
          git rm .github/workflows/admin-v2-final-convergence.yml
          git commit -m "chore(ci): remove Admin V2 convergence runner"
          git push origin HEAD:refactor/admin-v2-ux-root-v1
