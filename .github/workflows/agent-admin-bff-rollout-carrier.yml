name: Apply Admin BFF Rollout Carrier Patch

on:
  push:
    branches:
      - agent/secure-admin-bff-oidc
    paths:
      - .github/workflows/agent-admin-bff-rollout-carrier.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          ref: agent/secure-admin-bff-oidc
          fetch-depth: 0

      - name: Apply exact compatibility carrier patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          proxy_path = Path("api/_admin-bff-proxy.js")
          source = proxy_path.read_text(encoding="utf-8")
          old = '''      [BFF_NONCE_HEADER]: nonce,
                [BFF_CLIENT_IP_HEADER]: clientIp
              });'''
          new = '''      [BFF_NONCE_HEADER]: nonce,
                [BFF_CLIENT_IP_HEADER]: clientIp,
                "x-real-ip": clientIp
              });'''
          if source.count(old) != 1:
              raise SystemExit(f"Expected one Admin BFF header block, found {source.count(old)}")
          proxy_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("scripts/vercel-auth-proxy-contract.test.mjs")
          test_source = test_path.read_text(encoding="utf-8")
          old = '  assert.equal(headers.has("x-real-ip"), false);'
          new = '''  assert.equal(
              headers.get("x-real-ip"),
              "203.0.113.25",
              "The signed client IP is carried for compatibility with the currently deployed legacy function.",
            );'''
          if test_source.count(old) != 1:
              raise SystemExit(f"Expected one legacy-IP assertion, found {test_source.count(old)}")
          test_path.write_text(test_source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_admin-bff-proxy.js scripts/vercel-auth-proxy-contract.test.mjs
          git diff --cached --check
          git commit -m "Carry signed client IP through Admin BFF rollout"
          git push origin HEAD:agent/secure-admin-bff-oidc
