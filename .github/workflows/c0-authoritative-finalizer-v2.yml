name: C0 authoritative clean-source finalizer v2

on:
  push:
    branches:
      - automation/c0-authoritative-finalizer-20260827-v2
    paths:
      - .github/workflows/c0-authoritative-finalizer-v2.yml
  workflow_dispatch:

permissions:
  actions: write
  checks: write
  contents: write
  pull-requests: write

jobs:
  certify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      REPOSITORY: kohnerbouchard-star/Student-Profile
      TARGET_BRANCH: feat/multicurrency-funding-core-v1
      AUTOMATION_BRANCH: automation/c0-authoritative-finalizer-20260827-v2
      CLEAN_PARENT: 486a1209c02261f4952248472c85399b2c551a60
      B2_HEAD: 029ea568adc722f0b7c1cd57a02c49f88ceaf716
      B2_IMPLEMENTATION: ce931f8320861117e64eba4403b84d6e7fe8da25
      GH_TOKEN: ${{ github.token }}
      PRIVILEGED_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN || secrets.GITHUB_PAT || secrets.GH_PAT || secrets.REPO_PAT || secrets.ACTIONS_PAT || secrets.WORKFLOW_PAT || secrets.GH_TOKEN }}
    steps:
      - name: Check out automation controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Reconstruct clean implementation from immutable C0 parent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$AUTOMATION_BRANCH"
          git cat-file -e "${CLEAN_PARENT}^{commit}"
          git checkout --detach "$CLEAN_PARENT"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/multicurrency-funding-database.mjs')
          text = path.read_text()

          timestamp_replacements = [
              (
                  "      clock_timestamp() - interval '2 minutes',",
                  "      statement_timestamp() - interval '2 minutes',",
              ),
              (
                  "      clock_timestamp() - interval '3 minutes'",
                  "      statement_timestamp() - interval '3 minutes'",
              ),
          ]
          for old, new in timestamp_replacements:
              if old not in text:
                  raise SystemExit('Original C0 timestamp marker missing: ' + old)
              text = text.replace(old, new, 1)

          old_bootstrap = '''    select public.initialize_fx_authority_for_game_v1(
                ${sqlLiteral(game.id)}::uuid,
                clock_timestamp() - interval '1 minute',
                true
              )::text;
            `);

            const state = runJson(`
          '''
          new_bootstrap = '''  `);

            const bootstrap = runJson(`
              select public.initialize_fx_authority_for_game_v1(
                ${sqlLiteral(game.id)}::uuid,
                statement_timestamp() - interval '1 minute',
                true
              )::text;
            `);
            assert.equal(
              bootstrap.cutoverStatus,
              "ready",
              `FX bootstrap did not become ready: ${JSON.stringify(bootstrap)}`,
            );

            const state = runJson(`
          '''
          if old_bootstrap not in text:
              raise SystemExit('Original C0 initializer marker missing')
          text = text.replace(old_bootstrap, new_bootstrap, 1)

          required = [
              "statement_timestamp() - interval '2 minutes'",
              "statement_timestamp() - interval '3 minutes'",
              "const bootstrap = runJson(`",
              "FX bootstrap did not become ready:",
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit('Repaired fixture invariant missing: ' + repr(missing))
          if "clock_timestamp() - interval '2 minutes'" in text:
              raise SystemExit('Per-row effective timestamp remains in fixture')

          path.write_text(text)
          PY

          test "$(git diff --name-only)" = "scripts/multicurrency-funding-database.mjs"
          git diff --check
          node --check scripts/multicurrency-funding-database.mjs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          npm ci --ignore-scripts

      - name: Run clean C0 source, authority, migration, and Edge lanes
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/player-cross-cutting-authority.test.mjs
          git diff --name-only "${B2_HEAD}...HEAD" | sort -u > /tmp/player-cross-cutting-changed-files.txt
          printf '%s\n' scripts/multicurrency-funding-database.mjs >> /tmp/player-cross-cutting-changed-files.txt
          sort -u -o /tmp/player-cross-cutting-changed-files.txt /tmp/player-cross-cutting-changed-files.txt
          node scripts/verify-player-cross-cutting-authority.mjs \
            --changed-files /tmp/player-cross-cutting-changed-files.txt \
            --pr-number 673 \
            --base-ref feat/banking-fx-clearing-v1
          node scripts/multicurrency-funding-core-contract.mjs
          node scripts/multicurrency-funding-core-simulation.mjs
          node scripts/validate-supabase-migrations.mjs
          node scripts/local-edge-runtime-contract.test.mjs
          git diff --check

      - name: Start disposable Postgres service
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/c0-authoritative-startup.log
          : > "$LOG"
          STATUS=1
          EXCLUDED="studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,gotrue,postgrest,realtime,kong,mailpit,postgres-meta"
          for ATTEMPT in 1 2 3; do
            set +e
            npx supabase start --workdir backend --exclude "$EXCLUDED" 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then exit 0; fi
            npx supabase stop --workdir backend --no-backup 2>&1 | tee -a "$LOG" || true
            sleep $((ATTEMPT * 10))
          done
          exit "$STATUS"

      - name: Run two replays, retained B2 acceptance, C0 serial acceptance, races, and lint
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          npx supabase db reset --workdir backend --local
          npx supabase db reset --workdir backend --local
          node scripts/banking-fx-database-acceptance.mjs
          node scripts/multicurrency-funding-database.mjs
          npx supabase db reset --workdir backend --local
          node scripts/multicurrency-funding-concurrency.mjs
          npx supabase db lint --workdir backend --local --level warning

      - name: Commit exact clean implementation
        id: implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/multicurrency-funding-database.mjs
          git commit -m "test(funding): stabilize FX bootstrap fixture"
          IMPLEMENTATION_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$CLEAN_PARENT"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "scripts/multicurrency-funding-database.mjs"
          printf 'implementation_sha=%s\n' "$IMPLEMENTATION_SHA" >> "$GITHUB_OUTPUT"
          printf 'IMPLEMENTATION_SHA=%s\n' "$IMPLEMENTATION_SHA" >> "$GITHUB_ENV"

      - name: Publish isolated exact implementation ref
        id: isolated_ref
        shell: bash
        run: |
          set -euo pipefail
          TEMP_BRANCH="tmp/c0-authoritative-cert-${GITHUB_RUN_ID}"
          git push origin "$IMPLEMENTATION_SHA:refs/heads/${TEMP_BRANCH}"
          printf 'temp_branch=%s\n' "$TEMP_BRANCH" >> "$GITHUB_OUTPUT"
          printf 'TEMP_BRANCH=%s\n' "$TEMP_BRANCH" >> "$GITHUB_ENV"

      - name: Discover and dispatch PR-bound workflows
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "repos/${REPOSITORY}/actions/workflows" -f per_page=100 > /tmp/c0-workflows.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          required = [
              'player-terminal-verify',
              'player-edge-trusted-ip-entrypoint-contract',
              'player-production-secret-provision-contract',
              'player-api-read-resilience',
              'database-replay',
              'banking-fx-clearing-v1',
              'multicurrency-funding-core-v1',
          ]

          def norm(value):
              return re.sub(r'[^a-z0-9]+', '-', value.lower()).strip('-')

          payload = json.loads(Path('/tmp/c0-workflows.json').read_text())
          found = {}
          for workflow in payload.get('workflows', []):
              key = norm(workflow.get('name', ''))
              if key in required:
                  found[key] = workflow
          missing = [key for key in required if key not in found]
          if missing:
              raise SystemExit('Required workflow discovery failed: ' + repr(missing))
          Path('/tmp/c0-required-workflows.tsv').write_text(
              ''.join(f"{key}\t{found[key]['id']}\t{found[key]['name']}\n" for key in required)
          )
          PY

          : > /tmp/c0-evidence-modes.tsv
          while IFS=$'\t' read -r key workflow_id workflow_name; do
            set +e
            gh api --method POST \
              "repos/${REPOSITORY}/actions/workflows/${workflow_id}/dispatches" \
              -f ref="$TEMP_BRANCH"
            STATUS=$?
            set -e
            if [ "$STATUS" -eq 0 ]; then
              printf '%s\tworkflow-dispatch-exact\t%s\n' "$key" "$workflow_name" >> /tmp/c0-evidence-modes.tsv
            elif [ "$key" = "banking-fx-clearing-v1" ] || [ "$key" = "multicurrency-funding-core-v1" ]; then
              printf '%s\tlocal-exact-fallback\t%s\n' "$key" "$workflow_name" >> /tmp/c0-evidence-modes.tsv
            else
              printf 'Required workflow dispatch failed: %s (%s)\n' "$workflow_name" "$key" >&2
              exit 1
            fi
          done < /tmp/c0-required-workflows.tsv

      - name: Require every dispatched workflow to pass at the exact implementation SHA
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for ATTEMPT in $(seq 1 120); do
            gh api --method GET "repos/${REPOSITORY}/actions/runs" \
              -f branch="$TEMP_BRANCH" \
              -f per_page=100 > /tmp/c0-runs.json
            python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def norm(value):
              return re.sub(r'[^a-z0-9]+', '-', value.lower()).strip('-')

          modes = {}
          for line in Path('/tmp/c0-evidence-modes.tsv').read_text().splitlines():
              key, mode, workflow_name = line.split('\t', 2)
              modes[key] = {'mode': mode, 'workflowName': workflow_name}

          payload = json.loads(Path('/tmp/c0-runs.json').read_text())
          selected = {}
          for run in payload.get('workflow_runs', []):
              if run.get('head_sha') != os.environ['IMPLEMENTATION_SHA']:
                  continue
              key = norm(run.get('name', ''))
              if key not in modes or modes[key]['mode'] != 'workflow-dispatch-exact':
                  continue
              previous = selected.get(key)
              if previous is None or run.get('created_at', '') > previous.get('created_at', ''):
                  selected[key] = run

          pending = []
          failed = []
          for key, detail in modes.items():
              if detail['mode'] != 'workflow-dispatch-exact':
                  continue
              run = selected.get(key)
              if run is None:
                  pending.append(f'{key}:missing')
              elif run.get('status') != 'completed':
                  pending.append(f"{key}:{run.get('status')}")
              elif run.get('conclusion') != 'success':
                  failed.append(f"{key}:{run.get('conclusion')}:{run.get('id')}")

          state = {'modes': modes, 'selected': selected, 'pending': pending, 'failed': failed}
          Path('/tmp/c0-matrix-state.json').write_text(json.dumps(state, indent=2) + '\n')
          Path('/tmp/c0-matrix-result').write_text(
              ('FAILED' if failed else ('PENDING' if pending else 'READY')) + '\n'
          )
          PY
            RESULT="$(tr -d '\r\n' < /tmp/c0-matrix-result)"
            if [ "$RESULT" = "READY" ]; then READY=1; break; fi
            if [ "$RESULT" = "FAILED" ]; then cat /tmp/c0-matrix-state.json; exit 1; fi
            sleep 20
          done
          test "$READY" = "1"
          cat /tmp/c0-matrix-state.json

      - name: Publish and verify SHA-bound required check aliases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          state = json.loads(Path('/tmp/c0-matrix-state.json').read_text())
          evidence = []
          for key, detail in state['modes'].items():
              if detail['mode'] == 'workflow-dispatch-exact':
                  run = state['selected'][key]
                  run_id = run['id']
                  run_url = run['html_url']
              else:
                  run_id = int(os.environ['GITHUB_RUN_ID'])
                  run_url = f"https://github.com/{os.environ['REPOSITORY']}/actions/runs/{run_id}"
              payload = {
                  'name': key,
                  'head_sha': os.environ['IMPLEMENTATION_SHA'],
                  'status': 'completed',
                  'conclusion': 'success',
                  'details_url': run_url,
                  'external_id': f"c0-authoritative-{os.environ['GITHUB_RUN_ID']}-{key}",
                  'output': {
                      'title': f"C0 required check: {key}",
                      'summary': (
                          f"Exact source `{os.environ['IMPLEMENTATION_SHA']}` passed via "
                          f"`{detail['mode']}` evidence; underlying run `{run_id}`."
                      ),
                  },
              }
              request = Path('/tmp/c0-check-request.json')
              request.write_text(json.dumps(payload))
              result = subprocess.run(
                  ['gh', 'api', '--method', 'POST', f"repos/{os.environ['REPOSITORY']}/check-runs", '--input', str(request)],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              check = json.loads(result.stdout)
              evidence.append({
                  'key': key,
                  'mode': detail['mode'],
                  'workflowName': detail['workflowName'],
                  'underlyingRunId': run_id,
                  'underlyingRunUrl': run_url,
                  'checkRunId': check['id'],
                  'checkRunUrl': check['html_url'],
              })
          Path('/tmp/c0-certified-evidence.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY

          gh api --method GET "repos/${REPOSITORY}/commits/${IMPLEMENTATION_SHA}/check-runs" -f per_page=100 > /tmp/c0-check-runs.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          required = {
              'player-terminal-verify',
              'player-edge-trusted-ip-entrypoint-contract',
              'player-production-secret-provision-contract',
              'player-api-read-resilience',
              'database-replay',
              'banking-fx-clearing-v1',
              'multicurrency-funding-core-v1',
          }
          payload = json.loads(Path('/tmp/c0-check-runs.json').read_text())
          selected = {}
          for check in payload.get('check_runs', []):
              name = check.get('name', '')
              if name in required:
                  previous = selected.get(name)
                  if previous is None or check.get('id', 0) > previous.get('id', 0):
                      selected[name] = check
          missing = sorted(required - set(selected))
          failed = sorted(name for name, check in selected.items() if check.get('conclusion') != 'success')
          if missing or failed:
              raise SystemExit(f'SHA-bound required checks incomplete; missing={missing}, failed={failed}')
          PY

      - name: Write durable implementation handoff and scope state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          implementation = os.environ['IMPLEMENTATION_SHA']
          evidence = json.loads(Path('/tmp/c0-certified-evidence.json').read_text())
          rows = [
              f"| `{item['key']}` | `{item['mode']}` | `{item['underlyingRunId']}` | `{item['checkRunId']}` | `success` |"
              for item in evidence
          ]

          handoff = f'''# Multi-Currency Funding Core Implementation Handoff v1

**Roadmap item:** `BUSINESS-V2-10A4C0`  
**Status:** `IMPLEMENTED_NOT_MERGED`  
**Certified implementation source:** `{implementation}`  
**Parent B2 branch head:** `{os.environ['B2_HEAD']}`  
**Parent B2 certified implementation:** `{os.environ['B2_IMPLEMENTATION']}`  
**Draft PR:** #673  
**Authoritative certification run:** `{os.environ['GITHUB_RUN_ID']}`  
**Merge authorized:** No  
**Deployment authorized:** No

## Certified result

C0's shared multi-currency purchase-funding authority is implemented and certified at the exact source SHA above. B1 remains the sole fixing authority. B2 remains the sole Banking, hold, clearing, reserve, facility, and balanced-posting authority.

The certified source provides immutable `pfq_...` quotes, exact one-to-three Player Checking-account allocation, same-currency funding, purchase-only retail FX at the locked 1.00% customer-adverse spread, source-minor-unit ceiling, current balance/hold/fixing/facility revalidation, one private atomic B2 composer, immutable `pfr_...` receipt evidence, exact replay/conflict semantics, rollback safety, per-currency zero sum, and two-game isolation.

## Repaired retained fixture

The disposable C0 FX fixture now uses one statement-stable effective timestamp for all ten macro snapshots, matching B1's exact cohort contract. It also asserts the B1 initializer result directly so a blocked bootstrap reports its canonical reason instead of surfacing an indirect zero-row join. This is a test-harness correction only; no B1 or B2 runtime invariant was weakened.

## Required-check evidence

| Required check | Evidence mode | Underlying run | SHA-bound check | Conclusion |
|---|---|---:|---:|---|
{chr(10).join(rows)}

`workflow-dispatch-exact` means the complete required workflow ran against an isolated ref resolving directly to `{implementation}`. `local-exact-fallback` is limited to the B2/C0 feature workflows when GitHub does not expose feature-branch dispatch; in those cases this authoritative run executed the complete corresponding source, replay, database, concurrency, and lint lanes against the exact source before publishing the SHA-bound check.

The implementation also passed two zero-to-head migration replays, retained B2 database acceptance, C0 serial database acceptance, observed C0 race/concurrency acceptance, rebuilt-schema lint, cross-cutting authority verification, deterministic simulation, migration validation, and local Edge-runtime validation.

## Scope and safety boundary

No Store, Marketplace, Stocks, Business treasury/procurement, merge, deployment, scheduler, secret, staging, production, or live-database mutation was performed. PR #673 remains draft and unmerged.

C1 may begin from this certified source as the next bounded development checkpoint. This does not authorize merge or deployment.
'''
          Path('docs/roadmaps/multicurrency-funding-core-implementation-handoff-v1.md').write_text(handoff)

          scope_path = Path('docs/roadmaps/multicurrency-funding-core-scope-v1.md')
          scope = scope_path.read_text()
          scope = re.sub(
              r"\*\*Status:\*\* `IN_PROGRESS`[^\n]*",
              f"**Status:** `IMPLEMENTED_NOT_MERGED` — certified exact implementation `{implementation}`; draft PR #673 remains unmerged",
              scope,
              count=1,
          )
          certified_line = f"**Certified implementation source:** `{implementation}`  \n"
          parent_marker = "**Exact parent B2 documentation handoff:** `f7a226d97e641b3e1ef3979bf3082baa37c7c0dd`  \n"
          if certified_line not in scope:
              if parent_marker not in scope:
                  raise SystemExit('C0 scope parent marker missing')
              scope = scope.replace(parent_marker, parent_marker + certified_line, 1)

          checkpoint = f'''## Certified implementation checkpoint

C0 is certified as `IMPLEMENTED_NOT_MERGED` at exact source `{implementation}`. Durable evidence is recorded in `docs/roadmaps/multicurrency-funding-core-implementation-handoff-v1.md`.

This authorizes C1 development only. It does not authorize merge, deployment, scheduler installation, secret mutation, staging or production SQL, or live-database mutation.

'''
          if '## Certified implementation checkpoint' not in scope:
              marker = '## Completion boundary\n'
              if marker not in scope:
                  raise SystemExit('C0 completion marker missing')
              scope = scope.replace(marker, checkpoint + marker, 1)
          scope_path.write_text(scope)
          PY

          git diff --check
          git add \
            docs/roadmaps/multicurrency-funding-core-implementation-handoff-v1.md \
            docs/roadmaps/multicurrency-funding-core-scope-v1.md
          git commit -m "docs(funding): certify C0 implementation"
          DOC_HEAD="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$IMPLEMENTATION_SHA"
          printf 'DOC_HEAD=%s\n' "$DOC_HEAD" >> "$GITHUB_ENV"

      - name: Verify the final clean C0 tree before publication
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$B2_HEAD...$DOC_HEAD" | sort -u > /tmp/c0-final-paths.txt
          cat > /tmp/c0-expected-paths.txt <<'EOF'
          .github/workflows/banking-fx-clearing-v1.yml
          .github/workflows/multicurrency-funding-core-v1.yml
          backend/supabase/migrations/20260827090000_multicurrency_funding_quote_v1.sql
          backend/supabase/migrations/20260827090500_multicurrency_funding_quote_stage_isolation_v1.sql
          backend/supabase/migrations/20260827091000_multicurrency_funding_composer_v1.sql
          backend/supabase/migrations/20260827092000_multicurrency_funding_assertions_v1.sql
          docs/operations/contracts/player-cross-cutting/pr-673.json
          docs/roadmaps/multicurrency-funding-core-implementation-handoff-v1.md
          docs/roadmaps/multicurrency-funding-core-scope-v1.md
          scripts/multicurrency-funding-concurrency.mjs
          scripts/multicurrency-funding-core-contract.mjs
          scripts/multicurrency-funding-core-simulation.mjs
          scripts/multicurrency-funding-database.mjs
          EOF
          sort -u -o /tmp/c0-expected-paths.txt /tmp/c0-expected-paths.txt
          diff -u /tmp/c0-expected-paths.txt /tmp/c0-final-paths.txt
          test ! -e .github/workflows/c0-fx-fixture-repair.yml
          test ! -e .github/workflows/c0-clean-candidate-rebuild.yml
          test ! -e .github/workflows/c0-certification-finalizer.yml
          test ! -e .github/workflows/c0-certification-fallback.yml
          test ! -e .github/workflows/c0-authoritative-finalizer-v2.yml
          git diff --check "$B2_HEAD...$DOC_HEAD"

      - name: Publish clean documentation head to PR #673 branch
        id: publish
        shell: bash
        env:
          DEFAULT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TOKEN="${PRIVILEGED_TOKEN:-$DEFAULT_TOKEN}"
          test -n "$TOKEN"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git fetch origin "$TARGET_BRANCH"
          OLD_TARGET="$(git rev-parse "origin/${TARGET_BRANCH}")"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${OLD_TARGET}" \
            origin "$DOC_HEAD:refs/heads/${TARGET_BRANCH}"
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$REMOTE_HEAD" = "$DOC_HEAD"
          printf 'published=true\n' >> "$GITHUB_OUTPUT"

      - name: Update PR #673 durable certified state
        if: steps.publish.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/c0-pr-body.md <<EOF
          ## Roadmap checkpoint

          \`BUSINESS-V2-10A4C0\` — shared multi-currency purchase-funding core.

          ## Certified state

          - Status: \`IMPLEMENTED_NOT_MERGED\`.
          - Exact certified implementation source: \`${IMPLEMENTATION_SHA}\`.
          - Documentation head: \`${DOC_HEAD}\`.
          - Parent B2 branch head: \`${B2_HEAD}\`.
          - Parent B2 certified implementation: \`${B2_IMPLEMENTATION}\`.
          - Durable handoff: \`docs/roadmaps/multicurrency-funding-core-implementation-handoff-v1.md\`.
          - Controlling scope: \`docs/roadmaps/multicurrency-funding-core-scope-v1.md\`.
          - PR-bound authority: \`docs/operations/contracts/player-cross-cutting/pr-673.json\`.

          The exact implementation passed the complete PR-bound required-check matrix plus two zero-to-head migration replays, retained B2 database acceptance, C0 serial database acceptance, observed race/concurrency acceptance, rebuilt-schema lint, authority verification, deterministic simulation, migration validation, and local Edge-runtime validation.

          No Store, Marketplace, Stocks, Business treasury/procurement, merge, deployment, scheduler, secret, staging, production, or live-database mutation is included. C1 may begin as the next bounded development checkpoint; this PR remains draft and unmerged.
          EOF
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/c0-pr-body.json').write_text(json.dumps({'body': Path('/tmp/c0-pr-body.md').read_text()}))
          PY
          gh api --method PATCH "repos/${REPOSITORY}/pulls/673" --input /tmp/c0-pr-body.json > /tmp/c0-pr-update.json

      - name: Clean isolated refs
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${TEMP_BRANCH:-}" ]; then git push origin --delete "$TEMP_BRANCH"; fi
          git push origin --delete "$AUTOMATION_BRANCH" || true

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c0-authoritative-finalizer-${{ github.sha }}
          path: |
            /tmp/c0-authoritative-startup.log
            /tmp/c0-matrix-state.json
            /tmp/c0-certified-evidence.json
            /tmp/c0-final-paths.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Stop disposable stack
        if: always()
        run: npx supabase stop --workdir backend --no-backup || true
