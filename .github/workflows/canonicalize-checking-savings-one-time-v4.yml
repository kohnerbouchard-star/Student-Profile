name: Canonicalize Checking and Savings One Time V4

on:
  push:
    branches:
      - fix/checking-savings-wallet-convergence-v1
    paths:
      - .github/workflows/canonicalize-checking-savings-one-time-v4.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/checking-savings-wallet-convergence-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.3

      - name: Install pinned tooling
        run: |
          npm install --global npm@10.9.8
          npm ci
          npm --prefix backend ci

      - name: Execute reviewed V3 source transformation
        shell: bash
        run: |
          python <<'EXECUTE_V3'
          from pathlib import Path

          workflow = Path('.github/workflows/canonicalize-checking-savings-one-time-v3.yml')
          source = workflow.read_text(encoding='utf-8')
          start = "          python <<'PY'\n"
          end = "\n          PY\n\n      - name: Validate focused account contracts"
          if start not in source or end not in source:
              raise SystemExit('Could not extract the reviewed V3 transformation')
          payload = source.split(start, 1)[1].split(end, 1)[0]
          payload = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in payload.splitlines()
          )
          exec(compile(payload, str(workflow), 'exec'), {'__name__': '__main__'})
          Path('.github/workflows/canonicalize-checking-savings-one-time-v4.yml').unlink()
          EXECUTE_V3

      - name: Validate focused account contracts
        run: |
          node --test scripts/player-local-currency-authority-contract.test.mjs
          node --test scripts/checking-savings-account-type-contract.test.mjs
          node player-terminal/tests/store-local-currency.mjs
          npm --prefix backend run test:player-banking-public
          node scripts/validate-supabase-migrations.mjs

      - name: Finalize and verify release authority
        shell: bash
        run: |
          python <<'PY'
          import json
          import subprocess
          from pathlib import Path

          authority_path = Path('docs/operations/contracts/player-cross-cutting-verification-authority-v1.json')
          authority = json.loads(authority_path.read_text(encoding='utf-8'))
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          all_changed = {path for path in changed | untracked if path}
          all_changed.add(str(authority_path))
          existing_required = {
              path for path in authority.get('requiredFiles', []) if Path(path).exists()
          }
          authority['allowedPaths'] = sorted(set(authority.get('allowedPaths', [])) | all_changed)
          authority['requiredFiles'] = sorted(existing_required | {path for path in all_changed if Path(path).exists()})
          authority_path.write_text(json.dumps(authority, indent=2) + '\n', encoding='utf-8')
          PY
          node scripts/verify-player-cross-cutting-authority.mjs
          git diff --check

      - name: Commit coordinated Admin, Player, and database conversion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --name-only -z | xargs -0 -r git add --
          git ls-files --others --exclude-standard -z | xargs -0 -r git add --
          test -n "$(git diff --cached --name-only)"
          git commit -m "[checking-conversion-complete] Canonicalize personal accounts to checking and savings"
          git push origin HEAD:fix/checking-savings-wallet-convergence-v1

      - name: Record successful focused audit
        run: |
          cat > /tmp/checking-savings-pass.md <<'EOF'
          ## Checking and Savings convergence: focused audit passed

          This supersedes the earlier temporary gate failures. PR #501 now uses **Checking** and **Savings** as the personal account model across Admin, Player, active API source, route adapters, runners, tests, and the forward database migration.

          The migration merges legacy balances into Checking, converts ledger and transfer classifications, updates the default, supersedes installed economic functions that still use the retired account key, and prevents that key from being reintroduced. Validated `business:biz_...` operating accounts remain supported.

          No staging or production migration was applied. The PR remains draft pending the complete CI suite and connected staging rollout.
          EOF
          gh pr comment 501 --repo kohnerbouchard-star/Student-Profile --body-file /tmp/checking-savings-pass.md

      - name: Record failed focused audit
        if: failure()
        run: |
          cat > /tmp/checking-savings-fail.md <<'EOF'
          ## Checking and Savings convergence: complete-toolchain gate failed

          The V4 conversion did not publish a source commit. PR #501 remains draft and must not be merged or deployed. Review this workflow's first failing step.
          EOF
          gh pr comment 501 --repo kohnerbouchard-star/Student-Profile --body-file /tmp/checking-savings-fail.md
