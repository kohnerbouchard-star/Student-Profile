name: Story Narrative S1 Bundle Diagnose

on:
  push:
    branches:
      - feat/story-narrative-convergence-v1
    paths:
      - ".github/workflows/story-narrative-s1-bundle-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Diagnose staged S1 bundle
        shell: bash
        run: |
          set -u
          for file in scripts/story-narrative/bootstrap/story-character-messaging-v1.zip.b64.part*; do
            wc -c "$file"
            sha256sum "$file"
          done
          cat scripts/story-narrative/bootstrap/story-character-messaging-v1.zip.b64.part* > "$RUNNER_TEMP/bundle.b64"
          base64 --decode "$RUNNER_TEMP/bundle.b64" > "$RUNNER_TEMP/bundle.zip"
          sha256sum "$RUNNER_TEMP/bundle.zip"
          unzip -t "$RUNNER_TEMP/bundle.zip" || true
          unzip -l "$RUNNER_TEMP/bundle.zip" || true
