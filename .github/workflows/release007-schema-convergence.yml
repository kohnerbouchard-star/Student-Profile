name: RELEASE-007 Schema Convergence

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release007-schema-convergence.yml

permissions:
  contents: read

concurrency:
  group: release007-schema-convergence
  cancel-in-progress: false

env:
  EXPECTED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  EXPECTED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  ECONOMIC_PREFIX: "2026080612"
  EXPECTED_ECONOMIC_COUNT: "27"
  EXPECTED_ECONOMIC_FINAL: "20260806120460"
  ARCHIVE_MIGRATION: backend/supabase/migrations/20260810130000_archive_legacy_runtime_and_migration_history_v1.sql
  ARCHIVE_VERSION: "20260810130000"
  ARCHIVE_NAME: archive_legacy_runtime_and_migration_history_v1
  ARCHIVE_CREATED_BY: release007-schema-convergence-v1
  EXPECTED_LEGACY_KV_ROWS: "93"
  EXPECTED_LEGACY_KV_DIGEST: 34426d578ba56f50a56e90334ac063c28a0fca91fba31a7b2d2e4348e5ae3f19

jobs:
  converge:
    name: Rehearse and converge staging/production schema
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    env:
      STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
      PRODUCTION_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_CA_CERT: ${{ secrets.SUPABASE_DB_CA_CERT }}
    steps:
      - name: Enforce protected release boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$STAGING_SUPABASE_DB_URL"
          test -n "$PRODUCTION_SUPABASE_DB_URL"
          test -n "$SUPABASE_DB_CA_CERT"
          test "$EXPECTED_STAGING_PROJECT_REF" != "$EXPECTED_PRODUCTION_PROJECT_REF"
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          command -v psql >/dev/null

      - name: Check out exact merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact validation runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install locked dependencies and verify source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --prune origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          npm install --global npm@10.9.8
          npm ci
          node --test scripts/build-exact-migration-bundle.test.mjs
          node --test scripts/economic-asset-core-v2-contract.test.mjs
          node --test scripts/economic-asset-migration-bundle.test.mjs
          test -f "$ARCHIVE_MIGRATION"
          mapfile -t economic < <(find backend/supabase/migrations -maxdepth 1 -type f -name "${ECONOMIC_PREFIX}*.sql" -printf '%f\n' | sort)
          test "${#economic[@]}" = "$EXPECTED_ECONOMIC_COUNT"
          test "${economic[-1]%%_*}" = "$EXPECTED_ECONOMIC_FINAL"

      - name: Configure certificate-verified database TLS and bindings
        shell: bash
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/supabase-db-ca.crt"
          umask 077
          printf '%s\n' "$SUPABASE_DB_CA_CERT" > "$cert_path"
          test -s "$cert_path"
          echo "PGSSLROOTCERT=$cert_path" >> "$GITHUB_ENV"
          echo 'PGSSLMODE=verify-full' >> "$GITHUB_ENV"
          STAGING_SUPABASE_DB_URL="$STAGING_SUPABASE_DB_URL" node scripts/release-integrity/cli.mjs validate-db-url --url-env STAGING_SUPABASE_DB_URL --expected-project-ref "$EXPECTED_STAGING_PROJECT_REF"
          PRODUCTION_SUPABASE_DB_URL="$PRODUCTION_SUPABASE_DB_URL" node scripts/release-integrity/cli.mjs validate-db-url --url-env PRODUCTION_SUPABASE_DB_URL --expected-project-ref "$EXPECTED_PRODUCTION_PROJECT_REF"

      - name: Verify staging economic asset source identity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-economic-asset-migration-bundle.mjs \
            --migrations-dir backend/supabase/migrations \
            --prefix "$ECONOMIC_PREFIX" \
            --mode verify-full \
            --output "$RUNNER_TEMP/staging-economic-verify.sql" \
            > "$RUNNER_TEMP/staging-economic-build.json"
          psql "$STAGING_SUPABASE_DB_URL" -X --set=ON_ERROR_STOP=1 --no-psqlrc --file "$RUNNER_TEMP/staging-economic-verify.sql" \
            > "$RUNNER_TEMP/staging-economic-verify.log"

      - name: Rehearse exact production economic asset migration pack
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-economic-asset-migration-bundle.mjs \
            --migrations-dir backend/supabase/migrations \
            --prefix "$ECONOMIC_PREFIX" \
            --mode verify-prefix \
            --output "$RUNNER_TEMP/production-economic-prefix.sql" \
            > "$RUNNER_TEMP/production-economic-prefix-build.json"
          psql "$PRODUCTION_SUPABASE_DB_URL" -X --set=ON_ERROR_STOP=1 --no-psqlrc --file "$RUNNER_TEMP/production-economic-prefix.sql" \
            > "$RUNNER_TEMP/production-economic-prefix.log"
          applied_through="$(psql "$PRODUCTION_SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(max(version), '') from supabase_migrations.schema_migrations where version like '${ECONOMIC_PREFIX}%'")"
          if [ -n "$applied_through" ]; then [[ "$applied_through" =~ ^[0-9]{14}$ ]]; fi
          args=(--migrations-dir backend/supabase/migrations --prefix "$ECONOMIC_PREFIX" --mode rollback --output "$RUNNER_TEMP/production-economic-rollback.sql")
          if [ -n "$applied_through" ]; then args+=(--after-version "$applied_through"); fi
          node scripts/build-economic-asset-migration-bundle.mjs "${args[@]}" > "$RUNNER_TEMP/production-economic-rollback-build.json"
          psql "$PRODUCTION_SUPABASE_DB_URL" -X --set=ON_ERROR_STOP=1 --no-psqlrc --file "$RUNNER_TEMP/production-economic-rollback.sql" \
            > "$RUNNER_TEMP/production-economic-rollback.log"
          printf 'ECONOMIC_APPLIED_THROUGH=%s\n' "$applied_through" >> "$GITHUB_ENV"

      - name: Commit exact production economic asset migration pack
        shell: bash
        run: |
          set -euo pipefail
          args=(--migrations-dir backend/supabase/migrations --prefix "$ECONOMIC_PREFIX" --mode commit --output "$RUNNER_TEMP/production-economic-commit.sql")
          if [ -n "$ECONOMIC_APPLIED_THROUGH" ]; then args+=(--after-version "$ECONOMIC_APPLIED_THROUGH"); fi
          node scripts/build-economic-asset-migration-bundle.mjs "${args[@]}" > "$RUNNER_TEMP/production-economic-commit-build.json"
          psql "$PRODUCTION_SUPABASE_DB_URL" -X --set=ON_ERROR_STOP=1 --no-psqlrc --file "$RUNNER_TEMP/production-economic-commit.sql" \
            > "$RUNNER_TEMP/production-economic-commit.log"
          node scripts/build-economic-asset-migration-bundle.mjs \
            --migrations-dir backend/supabase/migrations \
            --prefix "$ECONOMIC_PREFIX" \
            --mode verify-full \
            --output "$RUNNER_TEMP/production-economic-verify.sql" \
            > "$RUNNER_TEMP/production-economic-verify-build.json"
          psql "$PRODUCTION_SUPABASE_DB_URL" -X --set=ON_ERROR_STOP=1 --no-psqlrc --file "$RUNNER_TEMP/production-economic-verify.sql" \
            > "$RUNNER_TEMP/production-economic-verify.log"

      - name: Rehearse and apply canonical forensic archive migration
        shell: bash
        run: |
          set -euo pipefail
          apply_exact() {
            local label="$1"
            local url="$2"
            local count
            count="$(psql "$url" -X -qAt -v ON_ERROR_STOP=1 -c "select count(*) from supabase_migrations.schema_migrations where version='${ARCHIVE_VERSION}'")"
            if [ "$count" = "1" ]; then
              node scripts/build-exact-migration-bundle.mjs --migration "$ARCHIVE_MIGRATION" --output "$RUNNER_TEMP/${label}-archive-verify.sql" --mode verify --created-by "$ARCHIVE_CREATED_BY" > "$RUNNER_TEMP/${label}-archive-verify-build.json"
              psql "$url" -X --set=ON_ERROR_STOP=1 --no-psqlrc --file "$RUNNER_TEMP/${label}-archive-verify.sql" > "$RUNNER_TEMP/${label}-archive-verify.log"
              return
            fi
            test "$count" = "0"
            node scripts/build-exact-migration-bundle.mjs --migration "$ARCHIVE_MIGRATION" --output "$RUNNER_TEMP/${label}-archive-rollback.sql" --mode rollback --created-by "$ARCHIVE_CREATED_BY" > "$RUNNER_TEMP/${label}-archive-rollback-build.json"
            psql "$url" -X --set=ON_ERROR_STOP=1 --no-psqlrc --file "$RUNNER_TEMP/${label}-archive-rollback.sql" > "$RUNNER_TEMP/${label}-archive-rollback.log"
            node scripts/build-exact-migration-bundle.mjs --migration "$ARCHIVE_MIGRATION" --output "$RUNNER_TEMP/${label}-archive-commit.sql" --mode commit --created-by "$ARCHIVE_CREATED_BY" > "$RUNNER_TEMP/${label}-archive-commit-build.json"
            psql "$url" -X --set=ON_ERROR_STOP=1 --no-psqlrc --file "$RUNNER_TEMP/${label}-archive-commit.sql" > "$RUNNER_TEMP/${label}-archive-commit.log"
            node scripts/build-exact-migration-bundle.mjs --migration "$ARCHIVE_MIGRATION" --output "$RUNNER_TEMP/${label}-archive-verify.sql" --mode verify --created-by "$ARCHIVE_CREATED_BY" > "$RUNNER_TEMP/${label}-archive-verify-build.json"
            psql "$url" -X --set=ON_ERROR_STOP=1 --no-psqlrc --file "$RUNNER_TEMP/${label}-archive-verify.sql" > "$RUNNER_TEMP/${label}-archive-verify.log"
          }
          apply_exact staging "$STAGING_SUPABASE_DB_URL"
          apply_exact production "$PRODUCTION_SUPABASE_DB_URL"

      - name: Validate every live economic asset context and archive boundary
        shell: bash
        run: |
          set -euo pipefail
          validate_games() {
            local label="$1"
            local url="$2"
            psql "$url" -X --set=ON_ERROR_STOP=1 --no-psqlrc <<'SQL' > "$RUNNER_TEMP/${label}-economic-validator.log"
          do $validation$
          declare
            game_row record;
            result jsonb;
          begin
            for game_row in select id from public.game_sessions order by id
            loop
              result := public.validate_economic_asset_core_v2(game_row.id);
              if coalesce((result ->> 'valid')::boolean, false) is not true then
                raise exception 'ECONOMIC_ASSET_CORE_VALIDATION_FAILED:%', result;
              end if;
            end loop;
          end
          $validation$;
          SQL
          }
          validate_games staging "$STAGING_SUPABASE_DB_URL"
          validate_games production "$PRODUCTION_SUPABASE_DB_URL"
          test "$(psql "$STAGING_SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select count(*) from private.legacy_shadow_kv_archive")" = "0"
          test "$(psql "$PRODUCTION_SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select count(*) from private.legacy_shadow_kv_archive")" = "$EXPECTED_LEGACY_KV_ROWS"
          test "$(psql "$STAGING_SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select to_regclass('public.kv_store_0dbf686f') is null")" = "t"
          test "$(psql "$PRODUCTION_SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select to_regclass('public.kv_store_0dbf686f') is null")" = "t"
          digest="$(psql "$PRODUCTION_SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select encode(sha256(convert_to(string_agg(key||E'\\n'||value::text,E'\\n---\\n' order by key),'UTF8')),'hex') from private.legacy_shadow_kv_archive")"
          test "$digest" = "$EXPECTED_LEGACY_KV_DIGEST"
          printf '{"productionLegacyKvRows":%s,"productionLegacyKvDigest":"%s","publicLegacyRelationRemoved":true}\n' "$EXPECTED_LEGACY_KV_ROWS" "$digest" > "$RUNNER_TEMP/archive-evidence.json"

      - name: Require exact staging/production schema and authorization parity
        shell: bash
        run: |
          set -euo pipefail
          psql "$STAGING_SUPABASE_DB_URL" -X -qAt --set=ON_ERROR_STOP=1 --no-psqlrc --file scripts/release-integrity/export-schema-fingerprint.sql > "$RUNNER_TEMP/staging-schema-raw.json"
          psql "$PRODUCTION_SUPABASE_DB_URL" -X -qAt --set=ON_ERROR_STOP=1 --no-psqlrc --file scripts/release-integrity/export-schema-fingerprint.sql > "$RUNNER_TEMP/production-schema-raw.json"
          node scripts/release-integrity/cli.mjs normalize-schema --input "$RUNNER_TEMP/staging-schema-raw.json" --output "$RUNNER_TEMP/staging-schema.json" > /dev/null
          node scripts/release-integrity/cli.mjs normalize-schema --input "$RUNNER_TEMP/production-schema-raw.json" --output "$RUNNER_TEMP/production-schema.json" > /dev/null
          node scripts/release-integrity/cli.mjs compare-schema --staging "$RUNNER_TEMP/staging-schema.json" --production "$RUNNER_TEMP/production-schema.json" --output "$RUNNER_TEMP/schema-comparison.json"
          rm -f "$RUNNER_TEMP/staging-schema-raw.json" "$RUNNER_TEMP/production-schema-raw.json"

      - name: Upload sanitized convergence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release007-schema-convergence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/staging-economic-build.json
            ${{ runner.temp }}/staging-economic-verify.log
            ${{ runner.temp }}/production-economic-prefix-build.json
            ${{ runner.temp }}/production-economic-prefix.log
            ${{ runner.temp }}/production-economic-rollback-build.json
            ${{ runner.temp }}/production-economic-rollback.log
            ${{ runner.temp }}/production-economic-commit-build.json
            ${{ runner.temp }}/production-economic-commit.log
            ${{ runner.temp }}/production-economic-verify-build.json
            ${{ runner.temp }}/production-economic-verify.log
            ${{ runner.temp }}/staging-archive-*-build.json
            ${{ runner.temp }}/staging-archive-*.log
            ${{ runner.temp }}/production-archive-*-build.json
            ${{ runner.temp }}/production-archive-*.log
            ${{ runner.temp }}/staging-economic-validator.log
            ${{ runner.temp }}/production-economic-validator.log
            ${{ runner.temp }}/archive-evidence.json
            ${{ runner.temp }}/schema-comparison.json
          if-no-files-found: warn
          retention-days: 30

      - name: Record convergence result
        if: success()
        shell: bash
        run: |
          {
            echo '## RELEASE-007 structural convergence'
            echo "- Exact source SHA: \`$GITHUB_SHA\`"
            echo '- Production #503 migration pack: `rehearsed + committed`'
            echo '- Production economic migrations: `27/27 exact source`'
            echo '- Legacy shadow KV: `archived privately + public table removed`'
            echo '- Raw legacy values uploaded: `false`'
            echo '- All live game asset validators: `pass`'
            echo '- Staging/production structural parity: `pass`'
            echo '- Staging/production authorization parity: `pass`'
            echo '- Migration ledger identity reconciliation: `not performed by this workflow`'
          } >> "$GITHUB_STEP_SUMMARY"
