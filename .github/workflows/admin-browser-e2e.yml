name: Admin Browser E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/admin-browser-e2e.yml"
      - "index.html"
      - "admin/**"
      - "frontend/src/core/**"
      - "backend/supabase/config.toml"
      - "backend/supabase/functions/**"
      - "backend/supabase/migrations/**"
      - "scripts/admin-browser-reconnaissance.mjs"
      - "scripts/game-creation-provisioning-local-acceptance.mjs"
      - "scripts/build-physical-economy-runtime-pack.mjs"
      - "scripts/local-staging-gateway.py"
      - "docs/operations/contracts/beta-seed-downstream-consumer-contract-v1.json"
      - "docs/seed-content/executable/beta-pack-v1/**"

permissions:
  contents: read

concurrency:
  group: admin-browser-e2e-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  rendered-admin:
    name: Rendered Admin browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PHYSICAL_ECONOMY_PACK: /tmp/physical-economy-runtime-pack.json
      ECONOVARIA_BROWSER_BASE_URL: http://127.0.0.1:4173
      ECONOVARIA_BROWSER_OUTPUT_DIR: /tmp/econovaria-browser
      ECONOVARIA_BROWSER_LICENSE_CODE: BROWSER-E2E-LICENSE-001
      ECONOVARIA_BROWSER_ADMIN_EMAIL: browser.e2e@example.test
      ECONOVARIA_BROWSER_ADMIN_PASSWORD: Browser-E2E-Access-2026!
      ECONOVARIA_BROWSER_GAME_NAME: Browser E2E Economy
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install pinned tooling and Chromium
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8
          npm ci
          node --check scripts/admin-browser-reconnaissance.mjs
          npx playwright install --with-deps chromium

      - name: Build exact authorized Crafting pack
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const contract = JSON.parse(await readFile(
            "docs/operations/contracts/beta-seed-downstream-consumer-contract-v1.json",
            "utf8",
          ));
          process.stdout.write(contract.acceptedImplementationSourceSha);
          NODE
          )"
          node scripts/build-physical-economy-runtime-pack.mjs \
            --source-root . \
            --source-commit "$SOURCE_COMMIT" \
            --approved-source-commit "$SOURCE_COMMIT" \
            --output "$PHYSICAL_ECONOMY_PACK"

      - name: Start local Supabase browser stack
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/admin-browser-supabase-startup.log
          : > "$LOG"
          EXCLUDED="studio,imgproxy,storage-api,logflare,vector,supavisor,realtime,postgres-meta,mailpit"
          for ATTEMPT in 1 2 3; do
            set +e
            npx supabase start --workdir backend --exclude "$EXCLUDED" 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            npx supabase stop --workdir backend --no-backup 2>&1 | tee -a "$LOG" || true
            sleep $((ATTEMPT * 10))
          done
          exit "$STATUS"

      - name: Rebuild database from zero
        run: npx supabase db reset --workdir backend --local

      - name: Provision canonical source content
        shell: bash
        run: |
          set -o pipefail
          node scripts/game-creation-provisioning-local-acceptance.mjs \
            2>&1 | tee /tmp/admin-browser-source-provisioning.log

      - name: Seed one browser-only license code
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.purchase_codes (
            code_hash,
            status,
            max_redemptions,
            redeemed_count
          ) values (
            encode(extensions.digest('BROWSER-E2E-LICENSE-001', 'sha256'), 'hex'),
            'active',
            1,
            0
          );
          SQL

      - name: Start same-origin browser gateway
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/local-staging-gateway.py \
            --local-supabase \
            --port 4173 \
            > /tmp/admin-browser-gateway.log 2>&1 &
          echo $! > /tmp/admin-browser-gateway.pid
          for ATTEMPT in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/admin-browser-gateway.log
          exit 1

      - name: Execute rendered Create Game and Admin journey
        run: node scripts/admin-browser-reconnaissance.mjs

      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-browser-e2e-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/econovaria-browser/
            /tmp/admin-browser-supabase-startup.log
            /tmp/admin-browser-source-provisioning.log
            /tmp/admin-browser-gateway.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stop local browser stack
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/admin-browser-gateway.pid ]; then
            kill "$(cat /tmp/admin-browser-gateway.pid)" 2>/dev/null || true
          fi
          npx supabase stop --workdir backend --no-backup || true
