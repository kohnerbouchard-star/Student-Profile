name: Admin Browser E2E

on:
  workflow_dispatch:
  push:
    branches:
      - agent/runtime-stability-button-integrity-v1
    paths:
      - ".github/workflows/admin-browser-e2e.yml"
      - "scripts/reconcile-pr377-with-main.sh"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/admin-browser-e2e.yml"
      - "scripts/reconcile-pr377-with-main.sh"

permissions:
  contents: write

concurrency:
  group: pr377-reconcile-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  reconcile-main:
    name: Reconcile PR 377 with main
    if: >-
      (github.event_name == 'push' && github.ref_name == 'agent/runtime-stability-button-integrity-v1') ||
      (github.event_name == 'pull_request' && github.head_ref == 'agent/runtime-stability-button-integrity-v1')
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Execute deterministic reconciliation
        id: reconcile
        continue-on-error: true
        shell: bash
        run: bash scripts/reconcile-pr377-with-main.sh

      - name: Push reconciled branch
        if: steps.reconcile.outcome == 'success'
        shell: bash
        run: git push origin HEAD:agent/runtime-stability-button-integrity-v1

      - name: Persist reconciliation failure
        if: steps.reconcile.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git merge --abort 2>/dev/null || true
          git reset --hard "${{ github.event.pull_request.head.sha || github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/operations/reconciliation
          sed -E 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/[jwt-redacted]/g; s/sb_(secret|publishable)_[A-Za-z0-9_-]+/[supabase-key-redacted]/g; s/[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/[uuid-redacted]/gi' \
            /tmp/pr377-reconcile-script.log > docs/operations/reconciliation/pr377-reconcile-script-failure.log
          git add docs/operations/reconciliation/pr377-reconcile-script-failure.log
          git commit -m "docs(reconcile): record deterministic reconciliation failure"
          git push origin HEAD:agent/runtime-stability-button-integrity-v1
          exit 1
