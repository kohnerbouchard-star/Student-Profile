name: Admin Browser E2E
# PR 377 reconciliation publication probe.

on:
  workflow_dispatch:
  push:
    branches:
      - agent/runtime-stability-button-integrity-v1
    paths:
      - ".github/workflows/admin-browser-e2e.yml"
      - "scripts/reconcile-pr377-with-main.sh"
  pull_request:
    branches: [main, agent/pr377-validation-base]
    paths:
      - ".github/workflows/admin-browser-e2e.yml"
      - "scripts/reconcile-pr377-with-main.sh"

permissions:
  contents: write

concurrency:
  group: pr377-reconcile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reconcile-main:
    name: Reconcile PR 377 with main
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Execute deterministic reconciliation
        id: reconcile
        continue-on-error: true
        shell: bash
        run: bash scripts/reconcile-pr377-with-main.sh

      - name: Record reconciled Git objects
        if: steps.reconcile.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr377-reconciliation
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/pr377-reconciliation/commit-sha.txt
          printf '%s\n' "$(git rev-parse HEAD^{tree})" > /tmp/pr377-reconciliation/tree-sha.txt
          git show --no-patch --pretty=raw HEAD > /tmp/pr377-reconciliation/commit.txt

      - name: Probe reconciled branch push
        id: push
        if: steps.reconcile.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git push origin HEAD:agent/runtime-stability-button-integrity-v1 \
            2>&1 | tee /tmp/pr377-reconciliation/push.log

      - name: Upload reconciliation publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr377-reconciliation-publication-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/pr377-reconciliation/
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce reconciliation result
        if: always()
        shell: bash
        run: |
          test "${{ steps.reconcile.outcome }}" = "success"
          test "${{ steps.push.outcome }}" = "success"
