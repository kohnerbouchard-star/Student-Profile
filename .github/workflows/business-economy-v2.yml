name: Business Economy V2

on:
  pull_request:
    paths:
      - "backend/supabase/migrations/20260819*.sql"
      - "backend/supabase/migrations/20260820*.sql"
      - "backend/supabase/migrations/20260821*.sql"
      - "backend/src/domains/business/**"
      - "backend/src/domains/business-banking/**"
      - "backend/src/domains/store/infrastructure/supabaseStorePurchaseRepository.ts"
      - "backend/supabase/functions/_shared/playerBusinessDispatch.ts"
      - "backend/supabase/functions/player-api/runtime.ts"
      - "backend/supabase/functions/classroom-api/index.ts"
      - "player-terminal/src/pages/business-page.js"
      - "player-terminal/src/api/**"
      - "scripts/business-*-authority-contract.mjs"
      - "scripts/business-domain-boundary-contract.mjs"
      - "scripts/business-recipe-access-contract.mjs"
      - "scripts/business-stockroom-authority-contract.mjs"
      - ".github/workflows/business-economy-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-economy-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority-contract:
    name: Business economy authority contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/business-formation-authority-contract.mjs
      - run: node scripts/business-economy-authority-contract.mjs
      - run: node scripts/business-domain-boundary-contract.mjs
      - run: node scripts/business-recipe-access-contract.mjs
      - run: node scripts/business-stockroom-authority-contract.mjs
      - run: node scripts/business-store-procurement-authority-contract.mjs
      - name: Materialize architecture inventory for review
        run: node scripts/architecture/build-architecture-inventory.mjs
      - name: Upload Business V2 review bundle
        uses: actions/upload-artifact@v4
        with:
          name: business-v2-review-bundle
          path: |
            docs/architecture/inventories/econovaria-architecture-inventory-v2.json
            backend/supabase/functions/player-api/runtime.ts
            backend/supabase/functions/classroom-api/index.ts
            backend/src/domains/business-banking/api/playerBusinessBankingHttpHandler.ts
            backend/src/domains/business-banking/infrastructure/supabasePlayerBusinessBankingRepository.ts
            scripts/business-banking-runtime-contract.mjs
          retention-days: 7

  backend-typecheck:
    name: Backend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - name: Verify extracted Business route, procurement, and Stockroom authority
        working-directory: backend
        run: |
          deno test --config supabase/functions/classroom-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            src/domains/business/api/playerBusinessRoutePaths.test.ts \
            src/domains/business/api/playerBusinessStoreProcurement.test.ts \
            src/domains/business/api/playerBusinessStockroomHttpHandler.test.ts \
            src/domains/business/infrastructure/supabaseBusinessStockroomReadRepository.test.ts
