name: Business Economy V2

on:
  pull_request:
    paths:
      - "backend/supabase/migrations/20260819*.sql"
      - "backend/supabase/migrations/20260820*.sql"
      - "backend/supabase/migrations/20260821*.sql"
      - "backend/src/domains/business/**"
      - "backend/src/domains/business-banking/**"
      - "backend/src/domains/store/infrastructure/supabaseStorePurchaseRepository.ts"
      - "backend/supabase/functions/_shared/playerBusinessDispatch.ts"
      - "backend/supabase/functions/player-api/runtime.ts"
      - "backend/supabase/functions/classroom-api/index.ts"
      - "player-terminal/src/pages/business-page.js"
      - "player-terminal/src/api/**"
      - "scripts/business-*-authority-contract.mjs"
      - "scripts/business-domain-boundary-contract.mjs"
      - "scripts/business-recipe-access-contract.mjs"
      - "scripts/business-stockroom-authority-contract.mjs"
      - ".github/workflows/business-economy-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-economy-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority-contract:
    name: Business economy authority contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/business-formation-authority-contract.mjs
      - run: node scripts/business-economy-authority-contract.mjs
      - run: node scripts/business-domain-boundary-contract.mjs
      - run: node scripts/business-recipe-access-contract.mjs
      - run: node scripts/business-stockroom-authority-contract.mjs
      - run: node scripts/business-store-procurement-authority-contract.mjs
      - name: Materialize architecture inventory for review
        run: node scripts/architecture/build-architecture-inventory.mjs
      - name: Upload Business V2 review bundle
        uses: actions/upload-artifact@v4
        with:
          name: business-v2-review-bundle
          path: |
            docs/architecture/inventories/econovaria-architecture-inventory-v2.json
            backend/supabase/functions/player-api/runtime.ts
            backend/supabase/functions/classroom-api/index.ts
            backend/src/domains/business-banking/api/playerBusinessBankingHttpHandler.ts
            backend/src/domains/business-banking/infrastructure/supabasePlayerBusinessBankingRepository.ts
            scripts/business-banking-runtime-contract.mjs
          retention-days: 7

  backend-typecheck:
    name: Backend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - name: Verify extracted Business route, procurement, and Stockroom authority
        working-directory: backend
        run: |
          deno test --config supabase/functions/classroom-api/deno.json \
            --lock=supabase/functions/deno.lock --frozen \
            src/domains/business/api/playerBusinessRoutePaths.test.ts \
            src/domains/business/api/playerBusinessStoreProcurement.test.ts \
            src/domains/business/api/playerBusinessStockroomHttpHandler.test.ts \
            src/domains/business/infrastructure/supabaseBusinessStockroomReadRepository.test.ts

  phase3c-certify:
    name: Record durable Phase 3C certification
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 655
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/business-stockroom-locations-v2
          fetch-depth: 0
      - name: Verify certified implementation ancestry
        shell: bash
        run: |
          git merge-base --is-ancestor 6799c0b44025dd71b54ed75636dd8f2af3358150 HEAD
          git diff --quiet 6799c0b44025dd71b54ed75636dd8f2af3358150 HEAD -- \
            backend \
            player-terminal \
            scripts \
            docs/architecture \
            docs/operations
      - name: Record plan and execution log
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          plan_path = Path("docs/roadmaps/business-v2-development-execution-plan-v1.md")
          log_path = Path("docs/roadmaps/business-v2-development-execution-log-v1.md")

          plan = plan_path.read_text(encoding="utf-8")
          old_status = "**Status:** IN PROGRESS — checkpoints A and B complete; location-complete Stockroom convergence and abstract-input retirement remain open"
          new_status = "**Status:** IN PROGRESS — checkpoints A, B, and C complete; legacy abstract input-purchase retirement remains open"
          if old_status in plan:
              plan = plan.replace(old_status, new_status, 1)
          elif new_status not in plan:
              raise SystemExit("Phase 3 status did not match the reviewed roadmap state")

          old_check = "- [ ] Materials/warehouse, WIP, Finished Goods, and In Transit are visible separately."
          new_check = "- [x] Materials/warehouse, WIP, Finished Goods, and In Transit are visible separately."
          if old_check in plan:
              plan = plan.replace(old_check, new_check, 1)
          elif new_check not in plan:
              raise SystemExit("Phase 3C checklist line was not found")

          checkpoint = "- **3C:** coherent location-complete canonical Business Stockroom read, certified source `6799c0b44025dd71b54ed75636dd8f2af3358150`."
          if checkpoint not in plan:
              anchor = "- **3B:** canonical Store procurement, certified source `acbbff20a4afa8296bdfb30dbc0c8e84e37702c9`."
              if anchor not in plan:
                  raise SystemExit("Phase 3B checkpoint anchor was not found")
              plan = plan.replace(anchor, anchor + "\n" + checkpoint, 1)
          plan_path.write_text(plan.rstrip() + "\n", encoding="utf-8")

          entry = base64.b64decode("").decode("utf-8")

          log = log_path.read_text(encoding="utf-8")
          marker = "## 2026-08-21 — Phase 3C COMPLETE: location-complete canonical Business Stockroom"
          if marker not in log:
              log_path.write_text(log.rstrip() + "\n\n" + entry.rstrip() + "\n", encoding="utf-8")

          git_diff = True
          PY
          git diff --check -- \
            docs/roadmaps/business-v2-development-execution-plan-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md
      - name: Commit durable certification
        shell: bash
        run: |
          if git diff --quiet -- \
            docs/roadmaps/business-v2-development-execution-plan-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md; then
            echo "Phase 3C certification already recorded."
            exit 0
          fi
          git config user.name "econovaria-roadmap-certifier"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            docs/roadmaps/business-v2-development-execution-plan-v1.md \
            docs/roadmaps/business-v2-development-execution-log-v1.md
          git commit -m "docs(business): certify Phase 3C Stockroom"
          git push origin HEAD:feat/business-stockroom-locations-v2
