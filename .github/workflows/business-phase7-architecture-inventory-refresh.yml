name: Business Phase 7 Architecture Inventory Refresh

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - feat/business-timed-manufacturing-v2
    paths:
      - ".github/workflows/business-phase7-architecture-inventory-refresh.yml"

permissions:
  contents: write

concurrency:
  group: business-phase7-architecture-inventory-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'feat/business-store-seller-offers-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Refresh and commit deterministic inventory
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node scripts/architecture/build-architecture-inventory.mjs
          git diff --check

          changed="$(git diff --name-only)"
          if test -z "$changed"; then
            echo "Architecture inventory is already current."
            exit 0
          fi
          test "$changed" = "docs/architecture/inventories/econovaria-architecture-inventory-v2.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/inventories/econovaria-architecture-inventory-v2.json
          git commit -m "docs(architecture): refresh Phase 7A inventory"
          git push origin HEAD:feat/business-store-seller-offers-v2
