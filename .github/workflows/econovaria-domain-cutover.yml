name: Econovaria Production Domain Cutover

on:
  push:
    branches:
      - ops/econovaria-domain-cutover-20260813
      - main
    paths:
      - ".github/workflows/econovaria-domain-cutover.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: econovaria-production-domain-cutover
  cancel-in-progress: false

env:
  PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  DENIED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  PRODUCTION_DOMAIN: econovaria.com
  WWW_DOMAIN: www.econovaria.com
  PRODUCTION_ORIGIN: https://econovaria.com
  WWW_ORIGIN: https://www.econovaria.com
  LEGACY_PRODUCTION_ORIGIN: https://econovaria.vercel.app
  WEB_ALLOWED_ORIGINS: https://econovaria.com,https://www.econovaria.com,https://econovaria.vercel.app,https://econovaria-econovaria.vercel.app,https://econovaria-git-main-econovaria.vercel.app
  VERCEL_PROJECT_ID: prj_xdyYj6NclqUD8XwTrXX6ueXJseV9
  VERCEL_TEAM_ID: team_PRsNkw4DHrGsUHl6ikKw2XyJ
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  cutover:
    name: Attach domain, reconcile DNS, and switch production origin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_DNS_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || secrets.CF_ZONE_ID }}

    steps:
      - name: Enforce bounded production cutover
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/ops/econovaria-domain-cutover-20260813|refs/heads/main) ;;
            *) echo "Unexpected source ref: $GITHUB_REF" >&2; exit 1 ;;
          esac
          test "$PRODUCTION_PROJECT_REF" = "cgiukdjwicykrmtkhudh"
          test "$DENIED_STAGING_PROJECT_REF" = "eecvbssdvarfcykcfrny"
          test "$PRODUCTION_PROJECT_REF" != "$DENIED_STAGING_PROJECT_REF"
          test "$PRODUCTION_DOMAIN" = "econovaria.com"
          test "$WWW_DOMAIN" = "www.econovaria.com"
          test "$PRODUCTION_ORIGIN" = "https://econovaria.com"
          test -n "$VERCEL_TOKEN"
          test -n "$SUPABASE_ACCESS_TOKEN"
          [[ "$WEB_ALLOWED_ORIGINS" == *"https://econovaria.com"* ]]
          [[ "$WEB_ALLOWED_ORIGINS" == *"https://www.econovaria.com"* ]]
          [[ "$WEB_ALLOWED_ORIGINS" == *"https://econovaria.vercel.app"* ]]
          [[ "$WEB_ALLOWED_ORIGINS" != *"*"* ]]

      - name: Check out the auditable cutover source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"

      - name: Attach apex and www domains to the Vercel project
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          const token = process.env.VERCEL_TOKEN;
          const project = process.env.VERCEL_PROJECT_ID;
          const team = process.env.VERCEL_TEAM_ID;
          const wanted = [process.env.PRODUCTION_DOMAIN, process.env.WWW_DOMAIN];
          const base = "https://api.vercel.com";

          async function request(path, init = {}) {
            const response = await fetch(`${base}${path}`, {
              ...init,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(init.headers || {}),
              },
            });
            const text = await response.text();
            let body = null;
            try {
              body = text ? JSON.parse(text) : {};
            } catch {
              body = { message: text };
            }
            return { response, body };
          }

          async function listProjectDomains() {
            const { response, body } = await request(
              `/v9/projects/${encodeURIComponent(project)}/domains?teamId=${encodeURIComponent(team)}&limit=100`,
            );
            if (!response.ok) {
              throw new Error(`Unable to list Vercel project domains (${response.status}).`);
            }
            return Array.isArray(body?.domains) ? body.domains : [];
          }

          async function ensureDomain(name) {
            let domains = await listProjectDomains();
            let domain = domains.find((value) => value?.name === name);
            if (!domain) {
              const { response, body } = await request(
                `/v10/projects/${encodeURIComponent(project)}/domains?teamId=${encodeURIComponent(team)}`,
                {
                  method: "POST",
                  body: JSON.stringify({ name }),
                },
              );
              if (!response.ok && response.status !== 400) {
                throw new Error(
                  `Unable to add ${name} to Vercel (${response.status}: ${String(body?.error?.code || body?.error?.message || body?.message || "unknown")}).`,
                );
              }
              domains = await listProjectDomains();
              domain = domains.find((value) => value?.name === name);
            }
            if (!domain) {
              throw new Error(`${name} is not attached to the intended Vercel project.`);
            }
            return domain;
          }

          const attached = [];
          for (const name of wanted) {
            attached.push(await ensureDomain(name));
          }

          const sanitized = attached.map((domain) => ({
            name: domain.name,
            verified: domain.verified === true,
            redirect: domain.redirect || null,
            redirectStatusCode: domain.redirectStatusCode || null,
            verification: Array.isArray(domain.verification)
              ? domain.verification.map((item) => ({
                  type: item?.type || null,
                  domain: item?.domain || item?.name || null,
                  value: item?.value || null,
                  reason: item?.reason || null,
                }))
              : [],
          }));
          fs.writeFileSync(
            process.env.VERCEL_DOMAINS_PATH,
            `${JSON.stringify({ attached: sanitized }, null, 2)}\n`,
          );
          NODE
        env:
          VERCEL_DOMAINS_PATH: ${{ runner.temp }}/vercel-domains.json

      - name: Read Vercel's project-specific DNS recommendations
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          const token = process.env.VERCEL_TOKEN;
          const project = process.env.VERCEL_PROJECT_ID;
          const team = process.env.VERCEL_TEAM_ID;
          const domains = [process.env.PRODUCTION_DOMAIN, process.env.WWW_DOMAIN];

          async function readConfig(domain) {
            const url = new URL(`https://api.vercel.com/v6/domains/${encodeURIComponent(domain)}/config`);
            url.searchParams.set("projectIdOrName", project);
            url.searchParams.set("teamId", team);
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${token}` },
            });
            const text = await response.text();
            let body;
            try {
              body = text ? JSON.parse(text) : {};
            } catch {
              body = { message: text };
            }
            if (!response.ok) {
              throw new Error(`Unable to read Vercel DNS config for ${domain} (${response.status}).`);
            }
            return body;
          }

          const configs = {};
          for (const domain of domains) configs[domain] = await readConfig(domain);
          fs.writeFileSync(
            process.env.VERCEL_CONFIG_PATH,
            `${JSON.stringify(configs, null, 2)}\n`,
          );
          NODE
        env:
          VERCEL_CONFIG_PATH: ${{ runner.temp }}/vercel-domain-config.json

      - name: Build a deterministic DNS plan
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          const configs = JSON.parse(fs.readFileSync(process.env.VERCEL_CONFIG_PATH, "utf8"));
          const attached = JSON.parse(fs.readFileSync(process.env.VERCEL_DOMAINS_PATH, "utf8")).attached;

          function collectStrings(value, output = []) {
            if (typeof value === "string") output.push(value);
            else if (Array.isArray(value)) {
              for (const item of value) collectStrings(item, output);
            } else if (value && typeof value === "object") {
              for (const item of Object.values(value)) collectStrings(item, output);
            }
            return output;
          }

          function firstIPv4(value) {
            return collectStrings(value).find((item) =>
              /^(?:\d{1,3}\.){3}\d{1,3}$/u.test(item) &&
              item.split(".").every((part) => Number(part) >= 0 && Number(part) <= 255)
            ) || null;
          }

          function firstHostname(value) {
            return collectStrings(value).find((item) =>
              /^[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?\.?$/iu.test(item) &&
              item.includes(".") &&
              !/^(?:\d{1,3}\.){3}\d{1,3}$/u.test(item)
            )?.replace(/\.$/u, "") || null;
          }

          const apexConfig = configs[process.env.PRODUCTION_DOMAIN] || {};
          const wwwConfig = configs[process.env.WWW_DOMAIN] || {};
          const apexAddress = firstIPv4(apexConfig.recommendedIPv4) || "76.76.21.21";
          const wwwTarget = firstHostname(wwwConfig.recommendedCNAME)
            || firstHostname(apexConfig.recommendedCNAME)
            || "cname.vercel-dns-0.com";

          const verification = [];
          for (const domain of attached) {
            for (const item of domain.verification || []) {
              const type = String(item.type || "").toUpperCase();
              const name = String(item.domain || "").toLowerCase().replace(/\.$/u, "");
              const value = String(item.value || "");
              if (
                type === "TXT" &&
                value &&
                (name === process.env.PRODUCTION_DOMAIN ||
                  name.endsWith(`.${process.env.PRODUCTION_DOMAIN}`))
              ) {
                verification.push({ type, name, content: value });
              }
            }
          }

          const uniqueVerification = [...new Map(
            verification.map((item) => [`${item.type}|${item.name}|${item.content}`, item]),
          ).values()];

          const plan = {
            apex: {
              type: "A",
              name: process.env.PRODUCTION_DOMAIN,
              content: apexAddress,
            },
            www: {
              type: "CNAME",
              name: process.env.WWW_DOMAIN,
              content: wwwTarget,
            },
            verification: uniqueVerification,
            source: {
              apexRecommendationPresent: Boolean(firstIPv4(apexConfig.recommendedIPv4)),
              wwwRecommendationPresent: Boolean(
                firstHostname(wwwConfig.recommendedCNAME) ||
                firstHostname(apexConfig.recommendedCNAME)
              ),
            },
          };
          fs.writeFileSync(process.env.DNS_PLAN_PATH, `${JSON.stringify(plan, null, 2)}\n`);
          NODE
        env:
          VERCEL_CONFIG_PATH: ${{ runner.temp }}/vercel-domain-config.json
          VERCEL_DOMAINS_PATH: ${{ runner.temp }}/vercel-domains.json
          DNS_PLAN_PATH: ${{ runner.temp }}/dns-plan.json

      - name: Reconcile Cloudflare DNS when a DNS token is available
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          const token = String(process.env.CLOUDFLARE_API_TOKEN || "").trim();
          const configuredZoneId = String(process.env.CLOUDFLARE_ZONE_ID || "").trim();
          const plan = JSON.parse(fs.readFileSync(process.env.DNS_PLAN_PATH, "utf8"));
          const resultPath = process.env.CLOUDFLARE_RESULT_PATH;
          const snapshotPath = process.env.CLOUDFLARE_SNAPSHOT_PATH;

          if (!token) {
            fs.writeFileSync(
              resultPath,
              `${JSON.stringify({ attempted: false, reason: "cloudflare_dns_token_unavailable" }, null, 2)}\n`,
            );
            fs.writeFileSync(snapshotPath, `${JSON.stringify({ records: [] }, null, 2)}\n`);
            process.exit(0);
          }

          const base = "https://api.cloudflare.com/client/v4";
          const headers = {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
          };

          async function cf(path, init = {}) {
            const response = await fetch(`${base}${path}`, {
              ...init,
              headers: { ...headers, ...(init.headers || {}) },
            });
            const text = await response.text();
            let body;
            try {
              body = text ? JSON.parse(text) : {};
            } catch {
              body = { success: false, errors: [{ message: text }] };
            }
            if (!response.ok || body?.success === false) {
              const message = Array.isArray(body?.errors)
                ? body.errors.map((error) => error?.message || error?.code).join("; ")
                : "unknown";
              throw new Error(`Cloudflare API ${path} failed (${response.status}: ${message}).`);
            }
            return body;
          }

          let zoneId = configuredZoneId;
          if (!zoneId) {
            const zones = await cf(
              `/zones?name=${encodeURIComponent(process.env.PRODUCTION_DOMAIN)}&status=active&per_page=50`,
            );
            const exact = (zones.result || []).filter(
              (zone) => String(zone?.name || "").toLowerCase() === process.env.PRODUCTION_DOMAIN,
            );
            if (exact.length !== 1) {
              throw new Error(`Expected exactly one active Cloudflare zone; found ${exact.length}.`);
            }
            zoneId = exact[0].id;
          }

          const listed = await cf(`/zones/${encodeURIComponent(zoneId)}/dns_records?per_page=5000`);
          const records = Array.isArray(listed.result) ? listed.result : [];
          const relevantNames = new Set([
            plan.apex.name,
            plan.www.name,
            ...plan.verification.map((item) => item.name),
          ]);
          const snapshot = records
            .filter((record) => relevantNames.has(String(record?.name || "").toLowerCase()))
            .map((record) => ({
              id: record.id,
              type: record.type,
              name: record.name,
              content: record.content,
              ttl: record.ttl,
              proxied: record.proxied === true,
            }));
          fs.writeFileSync(
            snapshotPath,
            `${JSON.stringify({ zoneId, records: snapshot }, null, 2)}\n`,
          );

          async function listName(name) {
            const response = await cf(
              `/zones/${encodeURIComponent(zoneId)}/dns_records?name=${encodeURIComponent(name)}&per_page=100`,
            );
            return Array.isArray(response.result) ? response.result : [];
          }

          async function removeRecord(id) {
            await cf(`/zones/${encodeURIComponent(zoneId)}/dns_records/${encodeURIComponent(id)}`, {
              method: "DELETE",
            });
          }

          async function writeRecord(record) {
            const body = {
              type: record.type,
              name: record.name,
              content: record.content,
              ttl: 1,
              proxied: false,
            };
            const current = await listName(record.name);
            const conflicts = current.filter((item) =>
              ["A", "AAAA", "CNAME"].includes(String(item.type || "").toUpperCase())
            );
            const reusable = conflicts.find(
              (item) => String(item.type || "").toUpperCase() === record.type,
            );

            if (reusable) {
              await cf(
                `/zones/${encodeURIComponent(zoneId)}/dns_records/${encodeURIComponent(reusable.id)}`,
                { method: "PUT", body: JSON.stringify(body) },
              );
            } else {
              await cf(`/zones/${encodeURIComponent(zoneId)}/dns_records`, {
                method: "POST",
                body: JSON.stringify(body),
              });
            }

            for (const item of conflicts) {
              if (!reusable || item.id !== reusable.id) await removeRecord(item.id);
            }
          }

          async function ensureVerification(record) {
            const current = await listName(record.name);
            if (
              current.some((item) =>
                String(item.type || "").toUpperCase() === "TXT" &&
                String(item.content || "") === record.content
              )
            ) return;
            await cf(`/zones/${encodeURIComponent(zoneId)}/dns_records`, {
              method: "POST",
              body: JSON.stringify({
                type: "TXT",
                name: record.name,
                content: record.content,
                ttl: 1,
                proxied: false,
              }),
            });
          }

          await writeRecord(plan.apex);
          await writeRecord(plan.www);
          for (const record of plan.verification) await ensureVerification(record);

          const afterApex = await listName(plan.apex.name);
          const afterWww = await listName(plan.www.name);
          const apexOk = afterApex.some((record) =>
            record.type === "A" &&
            record.content === plan.apex.content &&
            record.proxied !== true
          );
          const wwwOk = afterWww.some((record) =>
            record.type === "CNAME" &&
            String(record.content || "").replace(/\.$/u, "") === plan.www.content.replace(/\.$/u, "") &&
            record.proxied !== true
          );
          if (!apexOk || !wwwOk) {
            throw new Error("Cloudflare DNS verification failed after reconciliation.");
          }

          fs.writeFileSync(
            resultPath,
            `${JSON.stringify({
              attempted: true,
              applied: true,
              zoneId,
              apex: plan.apex,
              www: plan.www,
              verificationRecordsApplied: plan.verification.length,
            }, null, 2)}\n`,
          );
          NODE
        env:
          DNS_PLAN_PATH: ${{ runner.temp }}/dns-plan.json
          CLOUDFLARE_RESULT_PATH: ${{ runner.temp }}/cloudflare-result.json
          CLOUDFLARE_SNAPSHOT_PATH: ${{ runner.temp }}/cloudflare-before.json

      - name: Install the pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1
        with:
          version: 2.109.1

      - name: Switch production Edge Function browser origins
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"
          supabase secrets set \
            "ECONOVARIA_WEB_ALLOWED_ORIGINS=$WEB_ALLOWED_ORIGINS" \
            "ECONOVARIA_BROWSER_ORIGIN=$PRODUCTION_ORIGIN" \
            --project-ref "$PRODUCTION_PROJECT_REF"
          supabase secrets list \
            --project-ref "$PRODUCTION_PROJECT_REF" \
            > "$RUNNER_TEMP/production-secret-names.txt"
          grep -q 'ECONOVARIA_WEB_ALLOWED_ORIGINS' "$RUNNER_TEMP/production-secret-names.txt"
          grep -q 'ECONOVARIA_BROWSER_ORIGIN' "$RUNNER_TEMP/production-secret-names.txt"
          rm -f "$RUNNER_TEMP/production-secret-names.txt"

      - name: Switch Supabase Auth Site URL and redirect allowlist
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PRODUCTION_PROJECT_REF/config/auth" \
            > "$RUNNER_TEMP/auth-before.json"

          node <<'NODE'
          const fs = require("node:fs");
          const current = JSON.parse(fs.readFileSync(process.env.AUTH_BEFORE_PATH, "utf8"));
          const raw = current.uri_allow_list;
          const redirects = Array.isArray(raw)
            ? raw.map(String)
            : String(raw || "").split(",").map((value) => value.trim()).filter(Boolean);

          const additions = [
            process.env.PRODUCTION_ORIGIN,
            `${process.env.PRODUCTION_ORIGIN}/**`,
            process.env.WWW_ORIGIN,
            `${process.env.WWW_ORIGIN}/**`,
            `${process.env.PRODUCTION_ORIGIN}/auth/recovery-start.html`,
            `${process.env.PRODUCTION_ORIGIN}/auth/reset-password.html`,
            `${process.env.WWW_ORIGIN}/auth/recovery-start.html`,
            `${process.env.WWW_ORIGIN}/auth/reset-password.html`,
            process.env.LEGACY_PRODUCTION_ORIGIN,
            `${process.env.LEGACY_PRODUCTION_ORIGIN}/**`,
          ];

          const patch = {
            site_url: process.env.PRODUCTION_ORIGIN,
            uri_allow_list: [...new Set([...redirects, ...additions])].join(","),
          };

          for (const [key, value] of Object.entries(current)) {
            if (
              key.startsWith("mailer_templates_") &&
              typeof value === "string" &&
              value.includes(process.env.LEGACY_PRODUCTION_ORIGIN)
            ) {
              patch[key] = value.split(process.env.LEGACY_PRODUCTION_ORIGIN)
                .join(process.env.PRODUCTION_ORIGIN);
            }
          }

          fs.writeFileSync(process.env.AUTH_PATCH_PATH, JSON.stringify(patch));
          NODE

          curl --fail --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/auth-patch.json" \
            "https://api.supabase.com/v1/projects/$PRODUCTION_PROJECT_REF/config/auth" \
            > "$RUNNER_TEMP/auth-result.json"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PRODUCTION_PROJECT_REF/config/auth" \
            > "$RUNNER_TEMP/auth-after.json"

          node <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync(process.env.AUTH_AFTER_PATH, "utf8"));
          const raw = config.uri_allow_list;
          const redirects = Array.isArray(raw)
            ? raw.map(String)
            : String(raw || "").split(",").map((value) => value.trim()).filter(Boolean);
          const required = [
            process.env.PRODUCTION_ORIGIN,
            `${process.env.PRODUCTION_ORIGIN}/**`,
            process.env.WWW_ORIGIN,
            `${process.env.WWW_ORIGIN}/**`,
            process.env.LEGACY_PRODUCTION_ORIGIN,
            `${process.env.LEGACY_PRODUCTION_ORIGIN}/**`,
          ];
          if (config.site_url !== process.env.PRODUCTION_ORIGIN) {
            throw new Error("Supabase Auth Site URL did not switch to econovaria.com.");
          }
          for (const value of required) {
            if (!redirects.includes(value)) {
              throw new Error(`Supabase Auth redirect is missing: ${value}`);
            }
          }
          const sanitized = {
            siteUrl: config.site_url,
            requiredRedirectsPresent: true,
            legacyMigrationRedirectRetained: true,
          };
          fs.writeFileSync(
            process.env.AUTH_EVIDENCE_PATH,
            `${JSON.stringify(sanitized, null, 2)}\n`,
          );
          NODE
        env:
          AUTH_BEFORE_PATH: ${{ runner.temp }}/auth-before.json
          AUTH_PATCH_PATH: ${{ runner.temp }}/auth-patch.json
          AUTH_AFTER_PATH: ${{ runner.temp }}/auth-after.json
          AUTH_EVIDENCE_PATH: ${{ runner.temp }}/auth-evidence.json

      - name: Wait for Vercel domain verification and certificate readiness
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          const token = process.env.VERCEL_TOKEN;
          const project = process.env.VERCEL_PROJECT_ID;
          const team = process.env.VERCEL_TEAM_ID;
          const domains = [process.env.PRODUCTION_DOMAIN, process.env.WWW_DOMAIN];

          async function request(path) {
            const response = await fetch(`https://api.vercel.com${path}`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            const text = await response.text();
            let body;
            try {
              body = text ? JSON.parse(text) : {};
            } catch {
              body = { message: text };
            }
            if (!response.ok) {
              throw new Error(`Vercel verification request failed (${response.status}).`);
            }
            return body;
          }

          async function readState() {
            const listed = await request(
              `/v9/projects/${encodeURIComponent(project)}/domains?teamId=${encodeURIComponent(team)}&limit=100`,
            );
            const projectDomains = Array.isArray(listed?.domains) ? listed.domains : [];
            const state = {};
            for (const domain of domains) {
              const url = new URL(
                `https://api.vercel.com/v6/domains/${encodeURIComponent(domain)}/config`,
              );
              url.searchParams.set("projectIdOrName", project);
              url.searchParams.set("teamId", team);
              const configResponse = await fetch(url, {
                headers: { Authorization: `Bearer ${token}` },
              });
              const config = await configResponse.json();
              const attached = projectDomains.find((item) => item?.name === domain);
              state[domain] = {
                attached: Boolean(attached),
                verified: attached?.verified === true,
                misconfigured: config?.misconfigured === true,
                configuredBy: config?.configuredBy || null,
              };
            }
            return state;
          }

          let state = null;
          for (let attempt = 1; attempt <= 36; attempt += 1) {
            state = await readState();
            const ready = domains.every((domain) =>
              state[domain]?.attached === true &&
              state[domain]?.misconfigured === false
            );
            if (ready) break;
            if (attempt < 36) await new Promise((resolve) => setTimeout(resolve, 10_000));
          }

          fs.writeFileSync(
            process.env.VERCEL_FINAL_PATH,
            `${JSON.stringify(state, null, 2)}\n`,
          );
          const ready = domains.every((domain) =>
            state?.[domain]?.attached === true &&
            state?.[domain]?.misconfigured === false
          );
          if (!ready) {
            const cloudflare = JSON.parse(
              fs.readFileSync(process.env.CLOUDFLARE_RESULT_PATH, "utf8"),
            );
            if (cloudflare?.attempted === false) {
              throw new Error(
                "Vercel domains are attached, but DNS is still misconfigured and no Cloudflare DNS token was available.",
              );
            }
            throw new Error("Vercel still reports a custom-domain DNS or certificate misconfiguration.");
          }
          NODE
        env:
          VERCEL_FINAL_PATH: ${{ runner.temp }}/vercel-final.json
          CLOUDFLARE_RESULT_PATH: ${{ runner.temp }}/cloudflare-result.json

      - name: Verify custom-domain runtime and CORS policy
        shell: bash
        run: |
          set -euo pipefail

          runtime_ready=false
          for attempt in $(seq 1 30); do
            apex_status="$(curl --silent --show-error \
              --location \
              --output "$RUNNER_TEMP/apex.html" \
              --write-out '%{http_code}' \
              "$PRODUCTION_ORIGIN/" || true)"
            health_status="$(curl --silent --show-error \
              --output "$RUNNER_TEMP/health.json" \
              --write-out '%{http_code}' \
              "$PRODUCTION_ORIGIN/api/health" || true)"
            if [[ "$apex_status" == "200" && "$health_status" == "200" ]] && \
              node -e '
                const fs = require("node:fs");
                try {
                  const health = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                  if (
                    health.ok !== true ||
                    health.status !== "ready" ||
                    health.environment !== "production"
                  ) process.exit(1);
                } catch {
                  process.exit(1);
                }
              ' "$RUNNER_TEMP/health.json"; then
              runtime_ready=true
              break
            fi
            if [[ "$attempt" != "30" ]]; then sleep 5; fi
          done
          test "$runtime_ready" = "true"

          for origin in "$PRODUCTION_ORIGIN" "$WWW_ORIGIN"; do
            cors_ready=false
            headers="$RUNNER_TEMP/cors-$(echo "$origin" | tr -cd '[:alnum:]').txt"
            for attempt in $(seq 1 24); do
              status="$(curl --silent --show-error \
                --request OPTIONS \
                --header "Origin: $origin" \
                --header 'Access-Control-Request-Method: POST' \
                --header 'Access-Control-Request-Headers: apikey,content-type' \
                --dump-header "$headers" \
                --output /dev/null \
                --write-out '%{http_code}' \
                "https://$PRODUCTION_PROJECT_REF.supabase.co/functions/v1/web-session-api/login" || true)"
              tr -d '\r' < "$headers" > "$headers.normalized" || true
              if [[ "$status" == "204" ]] && \
                grep -Fxiq "access-control-allow-origin: $origin" "$headers.normalized" && \
                grep -Fxiq 'access-control-allow-credentials: true' "$headers.normalized"; then
                cors_ready=true
                break
              fi
              if [[ "$attempt" != "24" ]]; then sleep 5; fi
            done
            test "$cors_ready" = "true"
          done

          denied_status="$(curl --silent --show-error \
            --request OPTIONS \
            --header 'Origin: https://attacker.invalid' \
            --header 'Access-Control-Request-Method: POST' \
            --output /dev/null \
            --write-out '%{http_code}' \
            "https://$PRODUCTION_PROJECT_REF.supabase.co/functions/v1/web-session-api/login")"
          test "$denied_status" = "403"

      - name: Write sanitized cutover evidence
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          function read(path) {
            try {
              return JSON.parse(fs.readFileSync(path, "utf8"));
            } catch {
              return null;
            }
          }

          const evidence = {
            schemaVersion: 1,
            sourceRef: process.env.GITHUB_REF,
            sourceCommit: process.env.GITHUB_SHA,
            productionDomain: process.env.PRODUCTION_DOMAIN,
            wwwDomain: process.env.WWW_DOMAIN,
            productionOrigin: process.env.PRODUCTION_ORIGIN,
            legacyOriginRetainedDuringMigration: process.env.LEGACY_PRODUCTION_ORIGIN,
            vercelDomains: read(process.env.VERCEL_DOMAINS_PATH),
            dnsPlan: read(process.env.DNS_PLAN_PATH),
            cloudflare: read(process.env.CLOUDFLARE_RESULT_PATH),
            auth: read(process.env.AUTH_EVIDENCE_PATH),
            vercelFinal: read(process.env.VERCEL_FINAL_PATH),
            corsOriginsConfigured: [
              process.env.PRODUCTION_ORIGIN,
              process.env.WWW_ORIGIN,
              process.env.LEGACY_PRODUCTION_ORIGIN,
            ],
            secretValuesRecorded: false,
          };
          fs.writeFileSync(
            process.env.EVIDENCE_PATH,
            `${JSON.stringify(evidence, null, 2)}\n`,
          );
          NODE

          {
            echo "## Econovaria production domain cutover"
            echo "- Vercel project: \`$VERCEL_PROJECT_ID\`"
            echo "- Canonical origin: \`$PRODUCTION_ORIGIN\`"
            echo "- WWW origin: \`$WWW_ORIGIN\`"
            echo "- Legacy Vercel origin retained during migration: \`$LEGACY_PRODUCTION_ORIGIN\`"
            echo "- Supabase production project: \`$PRODUCTION_PROJECT_REF\`"
            cloudflare_status="$(node -e '
              const fs = require("node:fs");
              const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              process.stdout.write(value.attempted ? "applied" : "not-required-or-token-unavailable");
            ' "$RUNNER_TEMP/cloudflare-result.json")"
            echo "- Cloudflare mutation status: \`$cloudflare_status\`"
            echo "- Secret values recorded: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_DOMAINS_PATH: ${{ runner.temp }}/vercel-domains.json
          DNS_PLAN_PATH: ${{ runner.temp }}/dns-plan.json
          CLOUDFLARE_RESULT_PATH: ${{ runner.temp }}/cloudflare-result.json
          AUTH_EVIDENCE_PATH: ${{ runner.temp }}/auth-evidence.json
          VERCEL_FINAL_PATH: ${{ runner.temp }}/vercel-final.json
          EVIDENCE_PATH: ${{ runner.temp }}/econovaria-domain-cutover.json

      - name: Upload cutover evidence and DNS rollback snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: econovaria-domain-cutover-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/econovaria-domain-cutover.json
            ${{ runner.temp }}/cloudflare-before.json
            ${{ runner.temp }}/vercel-domain-config.json
