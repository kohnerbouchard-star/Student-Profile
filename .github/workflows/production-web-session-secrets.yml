name: Production Web Session Secret Provision

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Type the exact production project ref"
        required: true
        type: string
      confirm_source_sha:
        description: "Type the exact 40-character main commit SHA"
        required: true
        type: string
      confirm_action:
        description: "Type PROVISION WEB SESSION SECRETS"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-web-session-secret-provision
  cancel-in-progress: false

env:
  AUTHORIZATION_PATH: docs/operations/evidence/player-login-production-secret-trigger-v1.json
  EXPECTED_PRODUCTION_PROJECT_REF: cgiukdjwicykrmtkhudh
  DENIED_STAGING_PROJECT_REF: eecvbssdvarfcykcfrny
  PRODUCTION_ORIGIN: https://econovaria.vercel.app
  PRODUCTION_ALLOWED_ORIGINS: https://econovaria.vercel.app,https://econovaria-econovaria.vercel.app,https://econovaria-git-main-econovaria.vercel.app
  TRUSTED_CLIENT_IP_HEADER: x-real-ip
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  provision:
    name: Provision production web-session secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Enforce production authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "${{ inputs.confirm_project_ref }}" = "$EXPECTED_PRODUCTION_PROJECT_REF"
          test "${{ inputs.confirm_source_sha }}" = "$GITHUB_SHA"
          test "${{ inputs.confirm_action }}" = "PROVISION WEB SESSION SECRETS"
          test "$EXPECTED_PRODUCTION_PROJECT_REF" != "$DENIED_STAGING_PROJECT_REF"
          [[ "$EXPECTED_PRODUCTION_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          test "$PRODUCTION_ORIGIN" = "https://econovaria.vercel.app"
          test "$PRODUCTION_ALLOWED_ORIGINS" = "https://econovaria.vercel.app,https://econovaria-econovaria.vercel.app,https://econovaria-git-main-econovaria.vercel.app"
          [[ "$PRODUCTION_ALLOWED_ORIGINS" != *'*'* ]]
          test "$TRUSTED_CLIENT_IP_HEADER" = "x-real-ip"

      - name: Check out exact authorized source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate player-login authorization evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f "$AUTHORIZATION_PATH"
          node - <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.env.AUTHORIZATION_PATH, 'utf8'));
          if (
            value.schemaVersion !== 1 ||
            value.purpose !== 'provision-missing-player-login-runtime-secret' ||
            value.targetProjectRef !== process.env.EXPECTED_PRODUCTION_PROJECT_REF ||
            !value.deniedProjectRefs?.includes(process.env.DENIED_STAGING_PROJECT_REF) ||
            value.requiredSecret !== 'ECONOVARIA_PLAYER_CREDENTIAL_PEPPER' ||
            value.sourceBranch !== 'main' ||
            value.manualDispatchOnly !== true ||
            value.protectedEnvironmentRequired !== true ||
            value.exactSourceShaConfirmationRequired !== true ||
            value.createOnlyWhenMissing !== true ||
            value.overwriteExistingCryptographicKeys !== false ||
            value.recordSecretValues !== false ||
            value.databaseChangesAllowed !== false ||
            value.edgeFunctionDeploymentsAllowed !== false
          ) {
            throw new Error('Player login secret authorization evidence is invalid.');
          }
          NODE

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1
        with:
          version: 2.109.1

      - name: Validate secret command surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"
          supabase secrets list --help > "$RUNNER_TEMP/secrets-list-help.txt"
          supabase secrets set --help > "$RUNNER_TEMP/secrets-set-help.txt"
          grep -q -- "--project-ref" "$RUNNER_TEMP/secrets-list-help.txt"
          grep -q -- "--project-ref" "$RUNNER_TEMP/secrets-set-help.txt"

      - name: Provision missing-only session configuration
        shell: bash
        run: |
          set -euo pipefail
          names="$RUNNER_TEMP/production-secret-names.txt"
          supabase secrets list \
            --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF" \
            > "$names"

          supabase secrets set \
            "ECONOVARIA_WEB_ALLOWED_ORIGINS=$PRODUCTION_ALLOWED_ORIGINS" \
            "ECONOVARIA_TRUSTED_CLIENT_IP_HEADER=$TRUSTED_CLIENT_IP_HEADER" \
            --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF"

          if ! grep -q 'ECONOVARIA_RATE_LIMIT_HMAC_SECRET' "$names"; then
            rate_key="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(64).toString("base64url"))')"
            test "${#rate_key}" -eq 86
            RATE_KEY="$rate_key" node - <<'NODE'
          const value = process.env.RATE_KEY || '';
          if (!/^[A-Za-z0-9_-]{86}$/.test(value) || new Set(value).size < 20) {
            throw new Error('Generated rate-limit secret failed validation.');
          }
          NODE
            echo "::add-mask::$rate_key"
            supabase secrets set \
              "ECONOVARIA_RATE_LIMIT_HMAC_SECRET=$rate_key" \
              --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF"
            unset rate_key
          fi

          if ! grep -q 'ECONOVARIA_WEB_SESSION_ENCRYPTION_KEY' "$names"; then
            session_key="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
            test "${#session_key}" -eq 43
            echo "::add-mask::$session_key"
            supabase secrets set \
              "ECONOVARIA_WEB_SESSION_ENCRYPTION_KEY=$session_key" \
              --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF"
            unset session_key
          fi

          if ! grep -q 'ECONOVARIA_MFA_HANDLE_KEY' "$names"; then
            mfa_handle_key="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
            test "${#mfa_handle_key}" -eq 43
            MFA_HANDLE_KEY="$mfa_handle_key" node - <<'NODE'
          const value = process.env.MFA_HANDLE_KEY || '';
          if (!/^[A-Za-z0-9_-]{43}$/.test(value) || new Set(value).size < 16) {
            throw new Error('Generated MFA handle key failed validation.');
          }
          NODE
            echo "::add-mask::$mfa_handle_key"
            supabase secrets set \
              "ECONOVARIA_MFA_HANDLE_KEY=$mfa_handle_key" \
              --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF"
            unset mfa_handle_key
          fi

          if ! grep -q 'ECONOVARIA_PLAYER_CREDENTIAL_PEPPER' "$names"; then
            player_credential_pepper="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(64).toString("base64url"))')"
            test "${#player_credential_pepper}" -eq 86
            PLAYER_CREDENTIAL_PEPPER="$player_credential_pepper" node - <<'NODE'
          const value = process.env.PLAYER_CREDENTIAL_PEPPER || '';
          if (!/^[A-Za-z0-9_-]{86}$/.test(value) || new Set(value).size < 20) {
            throw new Error('Generated Player credential pepper failed validation.');
          }
          NODE
            echo "::add-mask::$player_credential_pepper"
            supabase secrets set \
              "ECONOVARIA_PLAYER_CREDENTIAL_PEPPER=$player_credential_pepper" \
              --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF"
            unset player_credential_pepper
          fi

          supabase secrets list \
            --project-ref "$EXPECTED_PRODUCTION_PROJECT_REF" \
            > "$names"
          grep -q 'ECONOVARIA_WEB_ALLOWED_ORIGINS' "$names"
          grep -q 'ECONOVARIA_TRUSTED_CLIENT_IP_HEADER' "$names"
          grep -q 'ECONOVARIA_RATE_LIMIT_HMAC_SECRET' "$names"
          grep -q 'ECONOVARIA_WEB_SESSION_ENCRYPTION_KEY' "$names"
          grep -q 'ECONOVARIA_MFA_HANDLE_KEY' "$names"
          grep -q 'ECONOVARIA_PLAYER_CREDENTIAL_PEPPER' "$names"
          rm -f "$names"

      - name: Record bounded evidence
        shell: bash
        run: |
          {
            echo '## Production web-session configuration provisioned'
            echo "- Source ref: \`$GITHUB_REF\`"
            echo "- Exact source SHA confirmed: \`$GITHUB_SHA\`"
            echo "- Project: \`$EXPECTED_PRODUCTION_PROJECT_REF\`"
            echo '- Manual dispatch only: `true`'
            echo '- Protected production environment: `true`'
            echo '- Staging denied: `true`'
            echo '- Allowed production origins configured: `3 exact Vercel aliases`'
            echo '- Verified internal client IP header configured: `x-real-ip`'
            echo '- Rate-limit HMAC secret present: `true`'
            echo '- Session encryption key present: `true`'
            echo '- Dedicated MFA handle key present: `true`'
            echo '- Player credential pepper present: `true`'
            echo '- Existing cryptographic keys overwritten: `false`'
            echo '- Secret values recorded: `false`'
            echo '- Database schema changed: `false`'
            echo '- Edge Functions deployed: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
