name: Apply Exact Admin BFF Canonical Request Patch

on:
  push:
    branches:
      - agent/secure-admin-bff-oidc
    paths:
      - .github/workflows/agent-admin-bff-local-canonical.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          ref: agent/secure-admin-bff-oidc
          fetch-depth: 0

      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/admin-bff-canonical.patch" <<'PATCH'
          diff --git a/backend/src/security/adminBffRequestAuth.ts b/backend/src/security/adminBffRequestAuth.ts
          index d11d29a..0000000 100644
          --- a/backend/src/security/adminBffRequestAuth.ts
          +++ b/backend/src/security/adminBffRequestAuth.ts
          @@ -149,7 +149,7 @@ export async function authorizeAdminBffRequest(
               !UUID_V4_PATTERN.test(nonce) ||
               !signatureMatch
             ) {
          -    return authenticationFailure();
          +    return malformedEnvelopeFailure();
             }
           
             const timestampSeconds = Number(timestampText);
          @@ -207,11 +207,20 @@ export async function authorizeAdminBffRequest(
               );
             }
           
          +  let signatureTargetUrl: string;
          +  try {
          +    signatureTargetUrl = canonicalAdminBffTargetUrl(
          +      request.url,
          +      options.supabaseUrl,
          +    );
          +  } catch {
          +    return malformedEnvelopeFailure();
          +  }
             const canonicalPayload = await buildAdminBffSignaturePayload({
               timestampSeconds,
               nonce,
               method: request.method,
          -    targetUrl: request.url,
          +    targetUrl: signatureTargetUrl,
               browserOrigin: String(request.headers.get("origin") || ""),
               clientIp,
               headers: request.headers,
          @@ -481,6 +490,29 @@ function normalizeIpAddress(value: string): string {
             return hostname.slice(1, -1).toLowerCase();
           }
           
          +function canonicalAdminBffTargetUrl(
          +  requestUrlValue: string,
          +  supabaseUrlValue: string,
          +): string {
          +  const requestUrl = new URL(requestUrlValue);
          +  const supabaseUrl = new URL(supabaseUrlValue);
          +  const prefixes = [
          +    "/functions/v1/web-session-api",
          +    "/web-session-api",
          +  ] as const;
          +  const prefix = prefixes.find((candidate) =>
          +    requestUrl.pathname.startsWith(candidate)
          +  );
          +  if (!prefix) throw new Error("invalid Admin BFF path");
          +  const suffix = requestUrl.pathname.slice(prefix.length);
          +  if (
          +    !suffix.startsWith("/") ||
          +    suffix.includes("\\") ||
          +    suffix.split("/").includes("..")
          +  ) throw new Error("invalid Admin BFF path");
          +  return `${supabaseUrl.origin}/functions/v1/web-session-api${suffix}${requestUrl.search}`;
          +}
          +
           function expectedDeploymentEnvironment(value: string): DeploymentEnvironment | null {
             let url: URL;
             try {
          @@ -555,6 +587,15 @@ function ownedArrayBuffer(value: Uint8Array): ArrayBuffer {
             return copy.buffer;
           }
           
          +function malformedEnvelopeFailure(): AdminBffRequestAuthResult {
          +  return failure(
          +    400,
          +    "admin_bff_envelope_invalid",
          +    "Administrator request envelope is missing or invalid.",
          +  );
          +}
          +
           function authenticationFailure(): AdminBffRequestAuthResult {
             return failure(
               401,
          diff --git a/scripts/admin-bff-request-auth.test.mjs b/scripts/admin-bff-request-auth.test.mjs
          index 122ed61..0000000 100644
          --- a/scripts/admin-bff-request-auth.test.mjs
          +++ b/scripts/admin-bff-request-auth.test.mjs
          @@ -17,10 +17,19 @@ const NONCE = "123e4567-e89b-42d3-a456-426614174000";
