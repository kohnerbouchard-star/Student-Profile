name: Apply Exact Admin BFF Canonical Request Patch

on:
  push:
    branches:
      - agent/secure-admin-bff-oidc
    paths:
      - .github/workflows/agent-admin-bff-local-canonical.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          ref: agent/secure-admin-bff-oidc
          fetch-depth: 0

      - name: Apply indentation-independent source transformations
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import traceback

          status = Path(".agent-admin-bff-patch-status.txt")
          try:
              auth_path = Path("backend/src/security/adminBffRequestAuth.ts")
              source = auth_path.read_text(encoding="utf-8")

              anchor = source.index("const signatureMatch")
              failure_index = source.index("return authenticationFailure();", anchor)
              source = (
                  source[:failure_index]
                  + "return malformedEnvelopeFailure();"
                  + source[failure_index + len("return authenticationFailure();"):]
              )

              canonical_marker = "  const canonicalPayload = await buildAdminBffSignaturePayload({"
              canonical_index = source.index(canonical_marker)
              prelude = dedent("""\
                let signatureTargetUrl: string;
                try {
                  signatureTargetUrl = canonicalAdminBffTargetUrl(
                    request.url,
                    options.supabaseUrl,
                  );
                } catch {
                  return malformedEnvelopeFailure();
                }
              """)
              source = source[:canonical_index] + prelude + source[canonical_index:]
              target_index = source.index("    targetUrl: request.url,", canonical_index)
              source = (
                  source[:target_index]
                  + "    targetUrl: signatureTargetUrl,"
                  + source[target_index + len("    targetUrl: request.url,"):]
              )

              environment_marker = "function expectedDeploymentEnvironment(value: string): DeploymentEnvironment | null {"
              helper = dedent("""\
                function canonicalAdminBffTargetUrl(
                  requestUrlValue: string,
                  supabaseUrlValue: string,
                ): string {
                  const requestUrl = new URL(requestUrlValue);
                  const supabaseUrl = new URL(supabaseUrlValue);
                  const prefixes = [
                    "/functions/v1/web-session-api",
                    "/web-session-api",
                  ] as const;
                  const prefix = prefixes.find((candidate) =>
                    requestUrl.pathname.startsWith(candidate)
                  );
                  if (!prefix) throw new Error("invalid Admin BFF path");
                  const suffix = requestUrl.pathname.slice(prefix.length);
                  if (
                    !suffix.startsWith("/") ||
                    suffix.includes("\\\\") ||
                    suffix.split("/").includes("..")
                  ) throw new Error("invalid Admin BFF path");
                  return `${supabaseUrl.origin}/functions/v1/web-session-api${suffix}${requestUrl.search}`;
                }

              """)
              if source.count(environment_marker) != 1:
                  raise RuntimeError("environment marker is not unique")
              source = source.replace(environment_marker, helper + environment_marker, 1)

              auth_marker = "function authenticationFailure(): AdminBffRequestAuthResult {"
              malformed = dedent("""\
                function malformedEnvelopeFailure(): AdminBffRequestAuthResult {
                  return failure(
                    400,
                    "admin_bff_envelope_invalid",
                    "Administrator request envelope is missing or invalid.",
                  );
                }

              """)
              if source.count(auth_marker) != 1:
                  raise RuntimeError("authentication marker is not unique")
              source = source.replace(auth_marker, malformed + auth_marker, 1)
              auth_path.write_text(source, encoding="utf-8")

              test_path = Path("scripts/admin-bff-request-auth.test.mjs")
              tests = test_path.read_text(encoding="utf-8")
              signature = "async function signedRequest({ local = false, invalidSignature = false } = {}) {"
              replacement = dedent("""\
                async function signedRequest({
                  local = false,
                  invalidSignature = false,
                  strippedRuntimePath = false,
                } = {}) {
              """).rstrip("\n")
              if tests.count(signature) != 1:
                  raise RuntimeError("signed request signature is not unique")
              tests = tests.replace(signature, replacement, 1)

              url_start = tests.index("  const url = local\n")
              url_end = tests.index(";\n  const origin = local", url_start) + 1
              url_block = dedent("""\
                  const url = local
                    ? strippedRuntimePath
                      ? "http://kong:8000/web-session-api/login"
                      : "http://127.0.0.1:54321/functions/v1/web-session-api/login"
                    : strippedRuntimePath
                      ? "https://cgiukdjwicykrmtkhudh.supabase.co/web-session-api/login"
                      : "https://cgiukdjwicykrmtkhudh.supabase.co/functions/v1/web-session-api/login";
              """).rstrip("\n")
              tests = tests[:url_start] + url_block + tests[url_end:]

              canonical_index = tests.index("  const canonicalPayload = await buildAdminBffSignaturePayload({")
              signature_url = dedent("""\
                  const signatureUrl = local
                    ? "http://kong:8000/functions/v1/web-session-api/login"
                    : "https://cgiukdjwicykrmtkhudh.supabase.co/functions/v1/web-session-api/login";
              """)
              tests = tests[:canonical_index] + signature_url + tests[canonical_index:]
              target_index = tests.index("    targetUrl: url,", canonical_index)
              tests = (
                  tests[:target_index]
                  + "    targetUrl: signatureUrl,"
                  + tests[target_index + len("    targetUrl: url,"):]
              )

              modified_marker = 'test("rejects a modified request before claiming its nonce", async () => {'
              missing_test = dedent("""\
                test("rejects a request missing the signed BFF envelope as malformed", async () => {
                  let claimed = false;
                  const result = await authorizeAdminBffRequest(new Request(
                    "https://cgiukdjwicykrmtkhudh.supabase.co/functions/v1/web-session-api/login",
                    {
                      method: "POST",
                      headers: {
                        origin: "https://econovaria.vercel.app",
                        "content-type": "application/json",
                      },
                      body: BODY,
                    },
                  ), {
                    supabaseUrl: "https://cgiukdjwicykrmtkhudh.supabase.co",
                    dependencies: {
                      now: () => NOW,
                      verifyOidc: async () => true,
                      claimNonce: async () => {
                        claimed = true;
                        return true;
                      },
                    },
                  });

                  assert.equal(result.ok, false);
                  assert.equal(result.response.status, 400);
                  assert.equal(claimed, false);
                });

              """)
              if tests.count(modified_marker) != 1:
                  raise RuntimeError("modified request marker is not unique")
              tests = tests.replace(modified_marker, missing_test + modified_marker, 1)

              local_marker = 'test("accepts local mode only at the loopback boundary", async () => {'
              canonical_test = dedent("""\
                test("accepts runtime-stripped hosted and local paths using one canonical target", async () => {
                  const hosted = await authorizeAdminBffRequest(await signedRequest({
                    strippedRuntimePath: true,
                  }), {
                    supabaseUrl: "https://cgiukdjwicykrmtkhudh.supabase.co",
                    dependencies: {
                      now: () => NOW,
                      verifyOidc: async () => true,
                      claimNonce: async () => true,
                    },
                  });
                  const local = await authorizeAdminBffRequest(await signedRequest({
                    local: true,
                    strippedRuntimePath: true,
                  }), {
                    supabaseUrl: "http://kong:8000",
                    dependencies: {
                      now: () => NOW,
                      claimNonce: async () => true,
                    },
                  });

                  assert.equal(hosted.ok, true);
                  assert.equal(local.ok, true);
                });

              """)
              if tests.count(local_marker) != 1:
                  raise RuntimeError("local request marker is not unique")
              test_path.write_text(
                  tests.replace(local_marker, canonical_test + local_marker, 1),
                  encoding="utf-8",
              )
              status.write_text("ok\n", encoding="utf-8")
          except Exception:
              status.write_text(traceback.format_exc(), encoding="utf-8")
          PY

      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if grep -qx 'ok' .agent-admin-bff-patch-status.txt; then
            git rm .github/workflows/agent-admin-bff-local-canonical.yml
            git rm -f .agent-admin-bff-patch-status.txt 2>/dev/null || rm -f .agent-admin-bff-patch-status.txt
            git add backend/src/security/adminBffRequestAuth.ts scripts/admin-bff-request-auth.test.mjs
            git diff --cached --check
            git commit -m "Canonicalize Admin BFF request identity"
          else
            git add .agent-admin-bff-patch-status.txt
            git commit -m "Update Admin BFF patch diagnostic"
          fi
          git push origin HEAD:agent/secure-admin-bff-oidc
