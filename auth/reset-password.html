<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Reset Econovaria Administrator Password</title>
  <link rel="stylesheet" href="./reset-password.css" />
  <script defer src="../runtime-config.env.js"></script>
  <script defer src="../frontend/src/core/runtime-config.js"></script>
  <script defer src="./reset-password.js"></script>
</head>
<body>
  <main class="reset-shell">
    <section class="reset-card" aria-labelledby="resetTitle">
      <span class="reset-kicker">Verified staff recovery</span>
      <h1 id="resetTitle">Set a new password</h1>
      <p id="resetIntro">Use at least 15 characters with uppercase, lowercase, number, and symbol.</p>

      <form id="resetPasswordForm" class="reset-form" hidden>
        <label>
          <span>New Password</span>
          <input name="password" type="password" minlength="15" maxlength="128" autocomplete="new-password" required />
        </label>
        <label>
          <span>Confirm Password</span>
          <input name="confirmPassword" type="password" minlength="15" maxlength="128" autocomplete="new-password" required />
        </label>
        <button type="submit">Update Password</button>
      </form>

      <form id="recoveryMfaForm" class="reset-form" hidden>
        <label><span>Authenticator</span><select name="factorHandle" aria-label="Authenticator" required></select></label>
        <label><span>Six-digit authenticator code</span><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required /></label>
        <button type="submit">Verify authenticator</button>
        <button id="recoveryMfaUnavailable" type="button">I can’t access this authenticator</button>
      </form>
      <button id="beginSystemRecovery" type="button" hidden>Continue approved account recovery</button>
      <form id="systemRecoveryForm" class="reset-form" hidden>
        <p id="systemRecoveryInstructions"></p>
        <img id="systemRecoveryQr" alt="Replacement authenticator setup QR code" width="200" height="200" />
        <label>Manual setup key <code id="systemRecoverySecret"></code></label>
        <label>Current six-digit code <input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required /></label>
        <button type="submit">Verify replacement authenticator</button>
      </form>
      <p id="resetMessage" class="reset-message" role="status" aria-live="polite"></p>
      <a class="reset-back" href="../?mode=admin">Return to administrator sign-in</a>
    </section>
  </main>
</body>
</html>
