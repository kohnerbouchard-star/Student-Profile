<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Econovaria Account Security</title>
  <link rel="stylesheet" href="./reset-password.css" />
  <script defer src="./security-review.js"></script>
</head>
<body>
  <main class="reset-shell">
    <section class="reset-card" aria-labelledby="reviewTitle">
      <span class="reset-kicker" id="reviewKicker">Econovaria account security</span>
      <h1 id="reviewTitle">Review security request</h1>
      <p id="reviewIntro">Review this request before continuing.</p>
      <button id="continueReview" type="button" hidden>Continue</button>
      <p id="reviewMessage" class="reset-message" role="status" aria-live="polite"></p>
      <a class="reset-back" href="../?mode=admin">Return to administrator sign-in</a>
    </section>
  </main>
</body>
</html>
