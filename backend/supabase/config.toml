project_id = "econovaria"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://localhost:4173"]
jwt_expiry = 3600
enable_signup = false

# Supabase CLI local Auth disables TOTP enrollment and verification by default.
# Enable both for disposable local browser acceptance; hosted project settings are
# configured separately and are not changed by this repository file.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true

# Authenticated Staff requests carry a real Supabase Auth user JWT. The platform
# gate rejects missing or invalid JWTs before the function performs auth.getUser,
# Staff lookup, role checks, security-version checks and game ownership checks.
[functions.staff-api]
verify_jwt = true

[functions.admin-api]
verify_jwt = true

[functions.staff-mfa-api]
verify_jwt = true

# The one-time recovery JWT is platform-verified, resolved with auth.getUser and
# linked to an active Staff account before a server-side password update.
[functions.password-reset-api]
verify_jwt = true

# Bootstrap and direct Player API requests use the publishable key only as
# application identity. Their handlers enforce purchase-code or opaque Player
# session authorization after the application-key check.
[functions.bootstrap-api]
verify_jwt = false

[functions.player-api]
verify_jwt = false

# Same-origin Player BFF. It validates application identity and origin, seals the
# opaque Player token in an authenticated HttpOnly cookie, enforces CSRF for
# mutations and forwards the server-held token only to player-api.
[functions.player-web-session-api]
verify_jwt = false

# The Admin web-session BFF authenticates the public application key internally,
# verifies allowed origins, decrypts an HttpOnly session envelope, enforces CSRF,
# and forwards a server-held real Staff JWT to platform-verified Staff services.
[functions.web-session-api]
verify_jwt = false

# Public verification review surface. Supabase Auth owns and validates the signup
# or magic-link token. GET only renders a no-store form; POST requires a same-origin
# double-submit challenge, exchanges the token with the publishable key, and never
# forwards the temporary AAL1 session to the browser.
[functions.admin-email-verification]
verify_jwt = false

# Public recovery confirmation surface. GET only renders a no-store confirmation
# form. The recovery TokenHash is exchanged only after a same-origin POST with an
# HttpOnly double-submit challenge; no user JWT exists before that exchange.
[functions.admin-password-recovery]
verify_jwt = false

# Explicit sign-out is handled by web-session-api/logout. The retired
# admin-logout-api function is intentionally absent from the canonical inventory.

# The Business operations worker has fixed all-game scope and an empty body. It
# validates publishable application identity plus timestamped, nonce-bound HMAC
# authorization before invoking only the due-period claim/close/release RPCs.
[functions.business-operations-worker]
verify_jwt = false

# Server-to-server stock functions validate the publishable apikey and signed,
# timestamped, nonce-bound runner authorization inside the function. They do not
# accept a browser or legacy anon JWT as authorization.
[functions.stock-market-runner]
verify_jwt = false

[functions.stock-market-read]
verify_jwt = false

[functions.stock-market-seed-copy]
verify_jwt = false

[functions.stock-market-player-read]
verify_jwt = false

[functions.stock-market-trading]
verify_jwt = false

# Database-owned stock clock endpoint. It authenticates the Vault-held scheduler
# token against the private hash verifier before delegating to the canonical stock
# runner handler. Platform JWT verification must remain disabled for this internal
# custom-auth boundary.
[functions.stock-market-orchestrator]
verify_jwt = false

# Database-owned campaign scheduler endpoint. It authenticates a dedicated
# Vault-held scheduler token against the private hash verifier before processing
# bounded campaign transitions and durable outbox effects.
[functions.campaign-orchestrator]
verify_jwt = false

# Operational storage lifecycle boundaries. Both authenticate Vault-held scheduler
# tokens through the private verifier before using service-role database access.
# Platform JWT verification must remain disabled for these internal runtimes.
[functions.stock-tick-archiver]
verify_jwt = false

[functions.game-data-purger]
verify_jwt = false

# Database-owned daily FX fixing endpoint. It accepts no game or economic
# input, authenticates a Vault-held scheduler token through the private hash
# verifier, and uses service-role access only for the canonical FX RPCs.
[functions.fx-orchestrator]
verify_jwt = false

# Leased standard-order FX settlement endpoint. It shares the database-owned FX
# scheduler verifier and uses service-role access only for claim/settle/fail RPCs.
[functions.banking-fx-orchestrator]
verify_jwt = false

# Deployed compatibility surface. Browser runtime must not target this function.
# admin-api still forwards a bounded set of authenticated Staff operations here
# server-side. Keep platform JWT verification enabled and retire the function only
# after all server-side callers, compatibility routes, deployment references and
# required acceptance tests have reached zero required usage.
[functions.classroom-api]
verify_jwt = true

[analytics]
enabled = false
