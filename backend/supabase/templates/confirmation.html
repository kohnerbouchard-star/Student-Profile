<html>
  <body style="font-family:Arial,sans-serif;background:#020617;color:#e2e8f0;padding:24px">
    <div style="max-width:560px;margin:0 auto;background:#0f172a;border:1px solid #334155;border-radius:16px;padding:32px">
      <h1 style="margin:0 0 16px;color:#f8fafc">Confirm your Econovaria email</h1>
      <p style="line-height:1.6">Confirm this email address before signing in and setting up administrator MFA.</p>
      <p style="margin:28px 0">
        <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#f97316;color:#111827;font-weight:700;text-decoration:none;padding:14px 20px;border-radius:10px">Review and Confirm Email</a>
      </p>
      <p style="font-size:13px;color:#94a3b8;line-height:1.5">The link first opens a confirmation page. Your account is not verified until you explicitly press the confirmation button.</p>
    </div>
  </body>
</html>
