<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="store-placeholder-title store-placeholder-description">
  <title id="store-placeholder-title">Econovaria Store artwork unavailable</title>
  <desc id="store-placeholder-description">A decorative geometric frame marking a Store item without persisted artwork.</desc>
  <defs>
    <linearGradient id="store-placeholder-bg" x1="12" y1="10" x2="148" y2="150" gradientUnits="userSpaceOnUse">
